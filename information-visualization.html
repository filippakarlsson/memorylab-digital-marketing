me       Seats      Weight      Color    HP\n\n\n      225\n                                                                                                                   Smart         2         730         green     45\n\n      200\n\n                                                                                                                     Renault       Twingo        4         790          petrol     59\n\n      175\n\n                                                                                                                     Renault        Captur        5         1190        Yellow     66\n      150\n\n                                                                          VW            Golf          5         1304        Black     110\n      125\n\n      100                                                                     VW          Passat        5         1780          Silver     174\n\n       75                                                                                                         Ford       S Max         7         1980         Blue     180\n\n\n       50                                                                                               Mercedes     E Class        5         1720       Red      255\n\n\n       25                                                                                               Mercedes     V Class        7         2145        Gray     176\n\n\n                                                                          VW       T6 Multivan       8         2628        Black     150\n\n\n                              500             1000            1500            2000            2500             3000       Kg", "img": "slides/00-035.webp"}, {"id": "00-036", "lecture": 0, "page": 36, "title": "Encoding Example Car Dataset", "group": "Visual analysis and design", "text": "Encoding Example Car Dataset\n\n\n HP\n\n\n      250\n                                                                                               Brand      Name       Seats      Weight      Color    HP\n\n\n      225\n                                                                                                                   Smart         2         730         green     45\n\n      200\n\n                                                                                                                     Renault       Twingo        4         790          petrol     59\n\n      175\n\n                                                                                                                     Renault        Captur        5         1190        Yellow     66\n      150\n\n                                                                          VW            Golf          5         1304        Black     110\n      125\n\n      100                                                                     VW          Passat        5         1780          Silver     174\n\n       75                                                                                                         Ford       S Max         7         1980         Blue     180\n\n\n       50                                                                                               Mercedes     E Class        5         1720       Red      255\n\n\n       25                                                                                               Mercedes     V Class        7         2145        Gray     176\n\n\n                                                                          VW       T6 Multivan       8         2628        Black     150\n\n\n                              500             1000            1500            2000            2500             3000        kg", "img": "slides/00-036.webp"}, {"id": "00-037", "lecture": 0, "page": 37, "title": "Encoding Example Car Dataset", "group": "Visual analysis and design", "text": "Encoding Example Car Dataset\n\n\n HP\n\n\n      250\n                                                                                               Brand      Name       Seats      Weight      Color    HP\n\n\n      225\n                                                                                                                   Smart         2         730         green     45\n\n      200\n\n                                                                                                                     Renault       Twingo        4         790          petrol     59\n\n      175\n\n                                                                                                                     Renault        Captur        5         1190        Yellow     66\n      150\n\n                                                                          VW            Golf          5         1304        Black     110\n      125\n\n      100                                                                     VW          Passat        5         1780          Silver     174\n\n       75                                                                                                         Ford       S Max         7         1980         Blue     180\n\n\n       50                                                                                               Mercedes     E Class        5         1720       Red      255\n\n\n       25                                                                                               Mercedes     V Class        7         2145        Gray     176\n\n\n                                                                          VW       T6 Multivan       8         2628        Black     150\n\n\n                              500             1000            1500            2000            2500             3000        kg", "img": "slides/00-037.webp"}, {"id": "00-038", "lecture": 0, "page": 38, "title": "Do we have an innate sense for designing", "group": "Visual analysis and design", "text": "Do we have an innate sense for designing\nInformation Visualizations?\n\nWe will see next week!", "img": "slides/00-038.webp"}, {"id": "00-039", "lecture": 0, "page": 39, "title": "Bad Practices", "group": "Misleading charts and design problems", "text": "Bad Practices", "img": "slides/00-039.webp"}, {"id": "00-040", "lecture": 0, "page": 40, "title": "Scale does not add up", "group": "Misleading charts and design problems", "text": "Scale does not add up\n\n\n\n\n\n                                                   https://i0.wp.com/www.codeconquest.com/wp-content/uploads/image-9.png?w=640&ssl=1", "img": "slides/00-040.webp"}, {"id": "00-041", "lecture": 0, "page": 41, "title": "Wrong alignment", "group": "Misleading charts and design problems", "text": "Wrong alignment\n\n\n\n\n\n                                                     https://i0.wp.com/www.codeconquest.com/wp-content/uploads/image-10.png?w=1000&ssl=1", "img": "slides/00-041.webp"}, {"id": "00-042", "lecture": 0, "page": 42, "title": "Wrong Chart Type and too many Colors", "group": "Misleading charts and design problems", "text": "Wrong Chart Type and too many Colors\n\n\n\n\n\n https://www.google.com/url?sa=i&url=https://humansofdata.atlan.com/2016/09/common-mistakes-bad-data-visualization/&psig=AOvVaw0cufzfIc8KQ1Y1WpWDb0wM&ust=1699265165675000&source=images&cd=vfe&ved=0CBEQjRxqFwoTCOjy-LmarYIDFQAAAAAdAAAAABAE", "img": "slides/00-042.webp"}, {"id": "00-043", "lecture": 0, "page": 43, "title": "Wrong Chart Type and too many Colors", "group": "Misleading charts and design problems", "text": "Wrong Chart Type and too many Colors", "img": "slides/00-043.webp"}, {"id": "00-044", "lecture": 0, "page": 44, "title": "Poor Color Usage (Fifty Shades of Red)", "group": "Misleading charts and design problems", "text": "Poor Color Usage (Fifty Shades of Red)\n\n\n\n\n\n                                                                                                                                https://www.oldstreetsolutions.com/wp-content/uploads/2021/05/Fifty-Shades-of-Red.png", "img": "slides/00-044.webp"}, {"id": "00-045", "lecture": 0, "page": 45, "title": "Truncated Axis", "group": "Misleading charts and design problems", "text": "Truncated Axis\n\n\n\n\n\n        https://assets-global.website-files.com/61488f4f65be16b5ebbd450b/6216bbbe746ea37175559954_B0bgJV5rclHcVeo3O-\n                                   sLC2_EWOexj16ZLHGXe6WfNjf3dJfG4b6C5eYRRjA-\n              Bns_Z8KkQHkRDLbhBy9ghGLBTTC3QWONg5tVBCR6fcBCbI6V_dbZObsAXUumcpim3c2FT2yh1yVj.png", "img": "slides/00-045.webp"}, {"id": "00-046", "lecture": 0, "page": 46, "title": "Tampered Axis", "group": "Misleading charts and design problems", "text": "Tampered Axis", "img": "slides/00-046.webp"}, {"id": "00-047", "lecture": 0, "page": 47, "title": "No 3D at all", "group": "Misleading charts and design problems", "text": "No 3D at all\n\n   • Don’t do it!\n\n\n\n\n\n                                                                                    https://www.oldstreetsolutions.com/wp-content/uploads/2021/05/3D-Chart.png", "img": "slides/00-047.webp"}, {"id": "00-048", "lecture": 0, "page": 48, "title": "Best Practices", "group": "Misleading charts and design problems", "text": "Best Practices\n\n• Choose the most Appropriate Medium for Data Visualization depending upon\n  the Objective it is meant to serve\n\n• Provide necessary Context around Visuals\n\n• Ensure Simplicity and Clarity of Information\n\n• Where possible, bring in Originality by relating, seemingly Unrelated data and\n  subjects\n\n• Ensure Brevity and Avoid Unnecessary Information\n\n• Use Simple and Easy to Understand Color Palettes\n\n• Pay attention to Graphics in order to make sure that they are Visually Appealing\n\n\n\n\n\n https://www.syntaxtechs.com/blog/data-visualization-examples", "img": "slides/00-048.webp"}, {"id": "00-049", "lecture": 0, "page": 49, "title": "To Avoid", "group": "Misleading charts and design problems", "text": "To Avoid\n\n• Avoid using Too Many Variables within a single image which might result in\n  distracting the viewers\n\n• Be extremely careful of not visualizing data through an Unsuitable or Incorrect\n  visualization format\n\n• While using Scales in Data Visualization in order to depict differences between\n  data points, it is important to ensure that the Scale is not Inconsistent\n\n• Poor Choice of Colors is another significant issue which should be avoided at all\n  costs. Thus, it is important to:\n\n• Avoid using too many colors and colors with negligible contrast\n\n• Avoid using conventional colors to convey opposite meanings\n\n• Pay heed to the needs of people who might be colorblind\n\n\n\n https://www.syntaxtechs.com/blog/data-visualization-examples", "img": "slides/00-049.webp"}, {"id": "00-050", "lecture": 0, "page": 50, "title": "Thank You", "group": "Misleading charts and design problems", "text": "Thank You", "img": "slides/00-050.webp"}, {"id": "01-001", "lecture": 1, "page": 1, "title": "Information Visualization 01", "group": "Why visualize?", "text": "Information Visualization 01\nWhat-Why\n\n\n Patrick Riehmann", "img": "slides/01-001.webp"}, {"id": "01-002", "lecture": 1, "page": 2, "title": "The ability to take data—to be able to understand it, to process it, to", "group": "Why visualize?", "text": "The ability to take data—to be able to understand it, to process it, to\nextract value from it, to visualize it, to communicate it—that’s going to\nbe a hugely important skill in the next decades, … because now we really\ndo have essentially free and ubiquitous data. So the complimentary\nscarce factor is the ability to understand that data and extract value from it.\n\n\n\n               Hal Varian, Google’s Chief Economist\n\n             The McKinsey Quarterly, Jan 2009", "img": "slides/01-002.webp"}, {"id": "01-003", "lecture": 1, "page": 3, "title": "Visualization: Terminology", "group": "Why visualize?", "text": "Visualization: Terminology\n\n• Scientific Visualization                     • Information Visualization\n\n  - Physical / simulated data                             - Abstract, non-physical data\n\n  - Data                                                     - Data\n\n    ‣ Automotive                                        ‣ Financial/business\n\n    ‣ Weather                                           ‣ Statistics\n\n    ‣ Medical                                           ‣ Software\n\n    ‣  ...                                                 ‣ Text\n\n                                                        ‣ W W W\n\n                                                        ‣  ...", "img": "slides/01-003.webp"}, {"id": "01-004", "lecture": 1, "page": 4, "title": "Information Visualization", "group": "Why visualize?", "text": "Information Visualization\n\n • In 1989 Xerox PARC Jock Mackinlay, Stu Card,\n  and George Robertson coined the term\n   “Information Visualization”\n\n • What is “Information”?\n\n   -  Items, entities, things without a direct physical\n    correspondence\n\n   -  Notion of abstractness of the entities is important\n\n • What is “visualization”?\n\n   - The use of computer-supported, interactive visual\n     representations of data to amplify cognition. [Card,\n     Mackinlay Shneiderman ‘98]\n\n • Visuals help us think, they support discovery,\n   decision making, explanation, …", "img": "slides/01-004.webp"}, {"id": "01-005", "lecture": 1, "page": 5, "title": "Visualization Analysis and Design", "group": "Why visualize?", "text": "Visualization Analysis and Design\n\n\n•  First three lectures are based on slides and talks by T. Munzner and her book: Tamara Munzner. Visualization\n   Analysis and Design. A K Peters Visualization Series, CRC Press, 2014.", "img": "slides/01-005.webp"}, {"id": "01-006", "lecture": 1, "page": 6, "title": "Munzner’s Definition of Visualization", "group": "Why visualize?", "text": "Munzner’s Definition of Visualization\n\n • Computer-based visualization systems provide visual representations of\n   datasets designed to help people carry out tasks more effectively.\n\n • Visualization is suitable when there is a need to augment human capabilities\n   rather than replace people with computational decision-making methods.\n\n • Don’t need visualization if a fully automatic solution exists and is trusted\n\n • Need human in the loop since many analysis problems ill-specified\n\n   -  Don’t know exactly what to ask in advance\n\n   -  Need to browse, explore, look for patterns, outliers …\n\n   -  Speed up and improve upon analysis and decision-making processes!\n\n • Important uses of visualization\n\n   -  Regular use by end users e.g. for exploratory analysis of scientific data, live monitoring, …\n\n   -  Presentation of known results – data stories, data journalism etc.\n\n   -  Verify statistical analysis and derived models\n\n   - …", "img": "slides/01-006.webp"}, {"id": "01-007", "lecture": 1, "page": 7, "title": "Why Show All the Data?", "group": "Why visualize?", "text": "Why Show All the Data?\n\n• Summaries lose information, the details matter\n\n  - Need to confirm expected and find unexpected patterns\n\n  - Assess validity of statistical model\n                              Anscombe’s Quartet\n\n\n\n\n                                                                        Identical statistics\n\n                                                                 x mean          9\n\n                                                                 x variance       10\n\n                                                                 y mean          8\n\n                                                                 y variance        4\n\n                                                                            x/y correlation     0.816", "img": "slides/01-007.webp"}, {"id": "01-008", "lecture": 1, "page": 8, "title": "Anscombe‘s Advice", "group": "Why visualize?", "text": "Anscombe‘s Advice\n\n\n“...make both calculations and graphs. Both sorts of output should be studied; each will\ncontribute to understanding.”\n\n\n\n\n\n                                                                        Identical statistics\n\n                                                                 x mean          9\n\n                                                                 x variance       10\n\n                                                                 y mean          8\n\n                                                                 y variance        4\n\n                                                                            x/y correlation     0.816", "img": "slides/01-008.webp"}, {"id": "01-009", "lecture": 1, "page": 9, "title": "Why Use Visual Representations?", "group": "Why visualize?", "text": "Why Use Visual Representations?\n\n• Human visual system is high-bandwidth channel to brain\n\n  - Overview possible due to background processing\n\n    ‣ Subjective experience of seeing everything simultaneously\n\n    ‣ Significant processing occurs in parallel and pre-attentively\n\n  - Visual representation can serve as effective externalization of mental models – replaces\n     partially cognition of numbers, relationships, … by perception\n\n• Sound: lower bandwidth and different semantics\n\n  - Subjective experience of sequential stream (overview not supported )\n\n• Touch/haptics: impoverished record/replay capacity\n\n  - Only low-bandwidth communication thus far\n\n• Taste, smell: no viable record/replay devices", "img": "slides/01-009.webp"}, {"id": "01-010", "lecture": 1, "page": 10, "title": "Resource Limitations", "group": "Why visualize?", "text": "Resource Limitations\n\n• Human limits\n\n  - Human recognition, attention and memory\n\n• Computational limits\n\n  - Processing / rendering time\n\n  - System memory\n\n  - System bandwidth\n\n• Display limits\n\n\n                                                                                                     https://growy.app/blog/learning/low-attention-span-embracing-leveraging-at-scale/  - Pixels are a precious resource, the most\n    constrained resource\n\n  - Information density                                                                     https://www.quantamagazine.org/overtaxed-working-memory-knocks-the-brain-out-of-sync-20180606/\n\n    ‣ Ratio of space used to encode info vs unused whitespace\n\n    ‣ Tradeoff between clutter and wasting space, find sweet spot between dense and sparse", "img": "slides/01-010.webp"}, {"id": "01-011", "lecture": 1, "page": 11, "title": "Analysis Framework: Four Levels, Four Questions", "group": "Why visualize?", "text": "Analysis Framework: Four Levels, Four Questions\n\n • Domain situation\n                                                                                        Domain        Who\n  - Who are the target users?\n\n • Abstraction                                                                                       Abstraction\n  -  Translate from specifics of domain\n    to vocabulary of visualization\n  - Data abstraction: What is shown?\n  - Task abstraction: Why is the user looking at it?                                                                                                 Technique\n • Technique (Munzner: Idiom)\n  - How is the data shown and explored?                                                  Algorithm\n   ‣ Visual encoding technique: how to visually represent data\n   ‣ Interaction technique: how to manipulate/explore\n\n • Algorithm\n                                                                                                                                                         [A Nested Model of Visualization Design and Validation.\n                                                                                                                               Munzner. IEEE TVCG 15(6):921-928, 2009 (Proc. InfoVis 2009). ]  -  Efficient computation and rendering\n                                                                                                                                                          [A Multi-Level Typology of Abstract Visualization Tasks\n                                                                                                        Brehmer and Munzner. IEEE TVCG 19(12):2376-2385, 2013 (Proc. InfoVis 2013). ]", "img": "slides/01-011.webp"}, {"id": "01-012", "lecture": 1, "page": 12, "title": "Analysis: What, Why and How", "group": "Why visualize?", "text": "Analysis: What, Why and How\n\n• What is shown?\n\n  - Data abstraction\n\n• Why is the user looking at it?\n\n  - Task abstraction\n\n• How is it shown?\n\n  - Technique: visual encoding and interaction\n\n\n • Abstract vocabulary avoids domain-specific terms\n\n  -  Translation process iterative and often complex\n\n •  It helps to think systematically about this huge design space and the choices\n\n • Analyzing existing designs as an inspiration for designing new", "img": "slides/01-012.webp"}, {"id": "01-013", "lecture": 1, "page": 13, "title": "Quiz", "group": "What · data and attributes", "text": "Quiz\n\n• How – What – Why – Who\n\n\n\n\n• Task – Data – Users - Technique", "img": "slides/01-013.webp"}, {"id": "01-014", "lecture": 1, "page": 14, "title": "Slide 14", "group": "What · data and attributes", "text": "", "img": "slides/01-014.webp"}, {"id": "01-015", "lecture": 1, "page": 15, "title": "Dataset Types", "group": "What · data and attributes", "text": "Dataset Types\n\n\n\n\n\n                                                                                                                                          https://ctisus.com/resources/library/teaching-files/vascular/254181.jpg\n\nhttps://media.springernature.com/lw685/springer-static/image/art%3A10.1007%2Fs00268-019-05052-5/MediaObjects/268_2019_5052_Fig1_HTML.jpg", "img": "slides/01-015.webp"}, {"id": "01-016", "lecture": 1, "page": 16, "title": "Datasets Described by Various Data Types", "group": "What · data and attributes", "text": "Datasets Described by Various Data Types", "img": "slides/01-016.webp"}, {"id": "01-017", "lecture": 1, "page": 17, "title": "Table", "group": "What · data and attributes", "text": "Table\n\n\n\n\n\n                                                        In each cell, an attribute value is stored", "img": "slides/01-017.webp"}, {"id": "01-018", "lecture": 1, "page": 18, "title": "Data Types", "group": "What · data and attributes", "text": "Data Types\n\n\n  - Item: individual discrete entity\n    ‣ A row in a simple table or a node in a network.\n    ‣ E.g. items may be people, stocks, coffee shops, genes, or cities.\n  - Attribute: specific property that can be measured, observed, or logged\n    ‣ Synonyms for attribute are variable and data dimension\n    ‣ ex: salary, price, number of sales, protein expression levels, or temperature.\n  - Link: specifies relationship between items, typically within a network.\n  - Position: spatial data, providing a location in two-dimensional (2D) or three-dimensional (3D)\n   space – very special attribute.\n    ‣ Ex: a position might be a latitude–longitude pair describing a location on the Earth’s surface or\n      three numbers specifying a location within the region of space measured by a medical scanner.\n  - Grid: specifies the strategy for sampling continuous data in terms of both geometric and\n    topological relationships between its cells.", "img": "slides/01-018.webp"}, {"id": "01-019", "lecture": 1, "page": 19, "title": "Attribute Types", "group": "What · data and attributes", "text": "Attribute Types\n\n\n\n\n\n                                    •Ordered data has well-defined ordering• Categorical data (nominal data)\n                                              -Ordinal data has ordering  - No implicit ordering, often\n                                                    but no arithmetic possible    hierarchies of categories\n                                               -Quantitative data allows computation  - Ex: fruit names, movie genres, file\n    types and city names                       ‣Integer and real numbers: measurements (temp,..),\n                                         number of something, …", "img": "slides/01-019.webp"}, {"id": "01-020", "lecture": 1, "page": 20, "title": "Cardinality and Range", "group": "What · data and attributes", "text": "Cardinality and Range\n\n• Cardinality refers to the number of unique values that an attribute can take\n\n  - Low Cardinality: When an attribute has only a few unique values. For example, the attribute\n    \"Gender\" with values like \"Male\" and \"Female\" has low cardinality because there are very\n   few unique values (2 in this case)\n\n  • High Cardinality: When an attribute has many unique values. For example, an attribute like\n   \"Customer ID\" or \"Social Security Number\" typically has high cardinality because there are\n   as many unique values as there are entities (e.g., each customer has a unique ID)\n\n• Vis may work better for attributes with low cardinality (e.g., bar charts) versus high\n   cardinality (e.g., scatter plots)", "img": "slides/01-020.webp"}, {"id": "01-021", "lecture": 1, "page": 21, "title": "Cardinality and Range", "group": "What · data and attributes", "text": "Cardinality and Range\n\n\n\n\n\n                                                                  https://marienicoleclothing.com/pages/mncs-size-chart", "img": "slides/01-021.webp"}, {"id": "01-022", "lecture": 1, "page": 22, "title": "Cardinality and Range", "group": "What · data and attributes", "text": "Cardinality and Range\n\n\n\n\n\n   https://i.etsystatic.com/20956615/r/il/\n         6e26c3/4964292245/\n     il_1588xN.4964292245_1xfb.jpg", "img": "slides/01-022.webp"}, {"id": "01-023", "lecture": 1, "page": 23, "title": "Quiz", "group": "What · data and attributes", "text": "Quiz\n\n• What are the four main dataset types?\n\n\n  - Networks & Trees\n\n  - Wind Tunnel\n\n  - Dynamic\n\n  - Geometry\n\n  - Fields\n\n  - Tables\n\n  - Websites\n\n  - Geology", "img": "slides/01-023.webp"}, {"id": "01-024", "lecture": 1, "page": 24, "title": "• {action, target} pairs", "group": "Why · tasks and targets", "text": "• {action, target} pairs\n\n  -  Discover distribution\n\n  -  Compare trends\n\n  -  Locate outliers\n\n  -  Browse topology", "img": "slides/01-024.webp"}, {"id": "01-025", "lecture": 1, "page": 25, "title": "Actions: Analyze", "group": "Why · tasks and targets", "text": "Actions: Analyze\n\n\n • Analyze → Scrutinize data item(s)\n • Search → Find a known/unknown item(s)\n • Query → Find out about characteristics of item(s)\n\n\n\n • Targets → ﻿﻿What is being acted on", "img": "slides/01-025.webp"}, {"id": "01-026", "lecture": 1, "page": 26, "title": "High-level Actions: Analyze", "group": "Why · tasks and targets", "text": "High-level Actions: Analyze\n\n                                                        • Consume\n\n                                                                                    - Discover vs present\n\n                                                                           ‣ Classic split aka\n                                                                                  explore vs explain\n\n                                                                                    - Enjoy\n\n                                                                           ‣ Casual, social\n\n\n                                                        • Produce\n\n                                                                                    - Annotate, record\n\n                                                                                    - Derive\n\n                                                                           ‣ Crucial design choice", "img": "slides/01-026.webp"}, {"id": "01-027", "lecture": 1, "page": 27, "title": "Action: Derive", "group": "Why · tasks and targets", "text": "Action: Derive\n\n• Don’t just draw the raw data\n\n• Provide the user with possibilities to transform the data\n\n  - Abstract, reduce, …\n\n• One major strategy for handling complexity", "img": "slides/01-027.webp"}, {"id": "01-028", "lecture": 1, "page": 28, "title": "Actions: Mid-level Search, Low-level Query", "group": "Why · tasks and targets", "text": "Actions: Mid-level Search, Low-level Query\n\n• Search depends on what does user know?\n\n  - Target? Location?\n\n\n\n\n ➡ Whiteboard", "img": "slides/01-028.webp"}, {"id": "01-029", "lecture": 1, "page": 29, "title": "Actions: Mid-level Search, Low-level Query", "group": "Why · tasks and targets", "text": "Actions: Mid-level Search, Low-level Query\n\n• Query follows search and\n  further refines targets found\n\n  -  Identify a single target\n\n  - Compare refers to multiple targets\n\n  - Summarize refers to the full set of\n    possible targets", "img": "slides/01-029.webp"}, {"id": "01-030", "lecture": 1, "page": 30, "title": "Why: Targets of Actions", "group": "Why · tasks and targets", "text": "Why: Targets of Actions\n\n\n\n                      Actions: discover, present, annotate, derive, search, …", "img": "slides/01-030.webp"}, {"id": "01-031", "lecture": 1, "page": 31, "title": "Why: Targets of Actions", "group": "Why · tasks and targets", "text": "Why: Targets of Actions\n\n\n\n                      Actions: discover, present, annotate, derive, search, …", "img": "slides/01-031.webp"}, {"id": "01-032", "lecture": 1, "page": 32, "title": "Task:findleast common ancestor between nodes/animals", "group": "Why · tasks and targets", "text": "Task:findleast common ancestor between nodes/animals\nin the tree of evolutionary relationships between\nanimals", "img": "slides/01-032.webp"}, {"id": "01-033", "lecture": 1, "page": 33, "title": "Doing the Abstraction", "group": "Why · tasks and targets", "text": "Doing the Abstraction\n\n\n\n\n\n    Domain Task 1: lecture": 1, "page": 38, "title": "Task:", "group": "Why · tasks and targets", "text": "Task:\nfind least common ancestor between nodes/animals in\nthe tree of evolutionary relationships between animals", "img": "slides/01-038.webp"}, {"id": "01-039", "lecture": 1, "page": 39, "title": "Further reading", "group": "Why · tasks and targets", "text": "Further reading\n\n • Visualization Analysis and Design. Munzner. AK Peters / CRC Press, Oct 2014.\n\n   - Chap 2: What: Data Abstraction\n\n   - Chap 3: Why: Task Abstraction\n\n • A Multi-Level Typology of Abstract Visualization Tasks. Brehmer and Munzner. IEEE Trans. Visualization\n  and Computer Graphics (Proc. InfoVis) 19:12 (2013), 2376–2385.\n\n • Low-Level Components of Analytic Activity in Information Visualization. Amar, Eagan, and Stasko. Proc.\n  IEEE InfoVis 2005, p 111–117.\n\n • A taxonomy of tools that support the fluent and flexible use of visualizations. Heer and Shneiderman.\n  Communications of the ACM 55:4 (2012), 45–54.\n\n • Rethinking Visualization: A High-Level Taxonomy. Tory and Möller. Proc. IEEE InfoVis 2004, p 151–158.", "img": "slides/01-039.webp"}, {"id": "01-040", "lecture": 1, "page": 40, "title": "Quiz and End", "group": "Why · tasks and targets", "text": "Quiz and End", "img": "slides/01-040.webp"}, {"id": "02-001", "lecture": 2, "page": 1, "title": "Visualization", "group": "Marks, channels and encoding", "text": "Visualization\n\nVisual Encoding", "img": "slides/02-001.webp"}, {"id": "02-002", "lecture": 2, "page": 2, "title": "Slide 2", "group": "Marks, channels and encoding", "text": "", "img": "slides/02-002.webp"}, {"id": "02-003", "lecture": 2, "page": 3, "title": "• {action, target} pairs", "group": "Marks, channels and encoding", "text": "•  {action, target} pairs\n\n   -  Discover distribution\n   - Compare trends\n   -  Locate outliers\n   -  Browse topology", "img": "slides/02-003.webp"}, {"id": "02-004", "lecture": 2, "page": 4, "title": "Slide 4", "group": "Marks, channels and encoding", "text": "", "img": "slides/02-004.webp"}, {"id": "02-005", "lecture": 2, "page": 5, "title": "Visual Encoding", "group": "Marks, channels and encoding", "text": "Visual Encoding\n\n\n\n\n\n               •  Analyze visualization techniques and ask questions:\n\n                     - How did we decide to use those particular geometric primitives and visual attributes?\n                     - How many more visual attributes are there?\n                     - What kinds of information and how much information can each visual attribute encode?\n                     - Are some visual attributes better than others?\n                     - Can all of the attributes be used independently or do they interfere with each other?", "img": "slides/02-005.webp"}, {"id": "02-006", "lecture": 2, "page": 6, "title": "Definitions: Marks and Channels", "group": "Marks, channels and encoding", "text": "Definitions: Marks and Channels\n• Marks\n\n   - Geometric primitives\n• Channels (visual attributes)\n\n   - Control appearance of marks\n\n   - Can redundantly code using multiple channels\n\n   - Position and color\n• Some interactions\n\n   - Point marks only convey position\n\n    ➢ Can be size and shape coded\n   - Line marks already convey position and length\n\n    ➢ Can only be size coded in 1D (width)\n   - Area marks fully constrained\n\n    ➢ Cannot be size or shape coded", "img": "slides/02-006.webp"}, {"id": "02-007", "lecture": 2, "page": 7, "title": "Visual Encoding", "group": "Marks, channels and encoding", "text": "Visual Encoding\n\n•  Analyze visualization technique structure as combination of marks and channels\n\n\n\n\n\n            1:                       2:                        3:                                                                                          4:            Vertical position        Vertical position          Vertical position                                                                                            Vertical position\n           Horizontal position     Horizontal position      Horizontal position                                                                                   Horizontal position\n                                                      Color hue                                                                             Color hue\n                                                                                Size (area)\n             Mark: line         Mark: point            Mark: point                                                                          Mark: point", "img": "slides/02-007.webp"}, {"id": "02-008", "lecture": 2, "page": 8, "title": "Rankings", "group": "Marks, channels and encoding", "text": "Rankings\nEffectiveness\nChannels:", "img": "slides/02-008.webp"}, {"id": "02-009", "lecture": 2, "page": 9, "title": "Rankings", "group": "Marks, channels and encoding", "text": "Rankings\nEffectiveness\nChannels:", "img": "slides/02-009.webp"}, {"id": "02-010", "lecture": 2, "page": 10, "title": "Effectiveness and Expressiveness Principles", "group": "Marks, channels and encoding", "text": "Effectiveness and Expressiveness Principles\n\n• Effectiveness principle\n  - Encode most important attributes with highest ranked channels\n• Expressiveness principle\n  - Visual encoding should express all of, and only, the information in the dataset\n   attributes\n  - Match visual attribute and data characteristics\n\n\n\n\n\n                                          [Automating the Design of Graphical Presentations of Relational Information.\n                                             Mackinlay. ACM Trans. on Graphics (TOG) 5:2 (1986), 110–141.]", "img": "slides/02-010.webp"}, {"id": "02-011", "lecture": 2, "page": 11, "title": "Quiz", "group": "Marks, channels and encoding", "text": "Quiz", "img": "slides/02-011.webp"}, {"id": "02-012", "lecture": 2, "page": 12, "title": "Source of Visual Attribute Rankings", "group": "Marks, channels and encoding", "text": "Source of Visual Attribute Rankings\n\n• Accuracy\n  - How close is human perceptual judgement to some objective measurement of the stimulus?\n  - Different visual channels with different levels of accuracy\n• Discriminability\n  - Visual attributes provide a different number of discriminable steps or levels\n• Separability\n  - Visual channels are often not completely independent from each other – their influence\n   cannot be easily separated\n• Popout\n  - Some visual channels provide visual popout, where a distinct item stands out from many\n    others immediately", "img": "slides/02-012.webp"}, {"id": "02-013", "lecture": 2, "page": 13, "title": "Accuracy: Fundamental Theory", "group": "Perception and accuracy", "text": "Accuracy: Fundamental Theory", "img": "slides/02-013.webp"}, {"id": "02-014", "lecture": 2, "page": 14, "title": "Encoding Example Car Dataset", "group": "Perception and accuracy", "text": "Encoding Example Car Dataset\n\n\n HP\n\n\n      250\n                                                                                               Brand      Name       Seats      Weight      Color    HP\n\n\n      225\n                                                                                                                   Smart         2         730         green     45\n\n      200\n\n                                                                                                                     Renault       Twingo        4         790          petrol     59\n\n      175\n\n                                                                                                                     Renault        Captur        5         1190        Yellow     66\n      150\n\n                                                                          VW            Golf          5         1304        Black     110\n      125\n\n                                                                          VW          Passat        5         1780          Silver     174\n      100\n\n\n       75                                                                                                          Ford       S Max         7         1980         Blue     180\n\n\n       50                                                                                               Mercedes     E Class        5         1720       Red      255\n\n\n       25                                                                                               Mercedes     V Class        7         2145        Gray     176\n\n\n                                                                          VW       T6 Multivan       8         2628        Black     150\n\n                              500             1000            1500            2000            2500             3000        kg", "img": "slides/02-014.webp"}, {"id": "02-015", "lecture": 2, "page": 15, "title": "Accuracy: Relative vs. Absolute Judgements", "group": "Perception and accuracy", "text": "Accuracy: Relative vs. Absolute Judgements\n\n•  Perceptual system mostly operates with relative judgements, not absolute\n   - Accuracy increases with common frame/scale and alignment\n   - For the framed bars, we have two possibilities to compare:\n        ➢Filled rectangles differ in length by 15%, a difficult judgement\n       ➢White rectangles differ in length by 30%, easier judgement\n\n\n\n\n\n                        after [Graphical Perception: Theory, Experimentation, and Application to the Development of Graphical Methods. Cleveland and McGill. Journ. American Statistical Association 79:387 (1984),\n                    531–554.]", "img": "slides/02-015.webp"}, {"id": "02-016", "lecture": 2, "page": 16, "title": "Cleveland and McGill’s Experiments", "group": "Perception and accuracy", "text": "Cleveland and McGill’s Experiments\n\n•  Elementary perceptual tasks\n   that people use to extract\n\n   quantitative information in\n\n  graphs\n\n   - ordered from most to least accurate:\n     1. Position along a common scale\n     2. Positions along nonaligned scales\n     3. Length, direction, angle\n     4. Area\n     5. Volume, curvature\n     6. Shading, color saturation\n\n\n\n\n\n                 Graphical Perception: Theory, Experimentation, and Application to the Development of Graphical Methods. Cleveland and McGill. Journ. American Statistical Association 79:387 (1984), 531–\n                554.", "img": "slides/02-016.webp"}, {"id": "02-017", "lecture": 2, "page": 17, "title": "Cleveland and McGill’s Experiments", "group": "Perception and accuracy", "text": "Cleveland and McGill’s Experiments\n\n\n\n\n\n                   • T1-T3: Position/length against an aligned scale but T2 and T3 have distractors\n                   • T4-T5: Unaligned position against an identical scale\n                   •  Task: judge percentual relationship between two stimuli, e.g. how much longer is the orange bar than the blue bar\n                   •  error is\n                 The 1/8 is used to handle the zero error case.\n\n                              -   If the error would be zero, the log result would be -3 because log 1/8 is -3. So an error of 1 is roughly a 2% difference, an error of 2 is\n                            roughly a 4% difference etc.\n\n                Graphical Perception: Theory, Experimentation, and Application to the Development of Graphical Methods. Cleveland and McGill. Journ. American Statistical Association 79:387 (1984), 531–\n                554.", "img": "slides/02-017.webp"}, {"id": "02-018", "lecture": 2, "page": 18, "title": "Discriminability: JND", "group": "Perception and accuracy", "text": "Discriminability: JND\n\n• JND: Just noticeable difference\n   - Increment where humans detects change\n• Weber’s law\n   - JND relative to a given cue is a constant fraction of cue\n   -  This is not generally true, but often a good approximation\n   - Examples\n        ➢Intensity change relative to background intensity\n      ➢The length difference we can detect is a fixed fraction of the object’s length\n           ❑This is probably only true for unaligned scales", "img": "slides/02-018.webp"}, {"id": "02-019", "lecture": 2, "page": 19, "title": "Discriminability: JND", "group": "Perception and accuracy", "text": "Discriminability: JND\n\n• JND: Just noticeable difference\n   - Increment where humans detects change\n• Weber’s law\n   - JND relative to a given cue is a constant fraction of cue\n   -  This is not generally true, but often a good approximation\n   - Examples\n        ➢Intensity change relative to background intensity\n      ➢The length difference we can detect is a fixed fraction of the object’s length\n           ❑This is probably only true for unaligned scales", "img": "slides/02-019.webp"}, {"id": "02-020", "lecture": 2, "page": 20, "title": "Discriminability: JND", "group": "Perception and accuracy", "text": "Discriminability: JND\n\n• JND: Just noticeable difference\n   - Increment where humans detects change\n• Weber’s law\n   - JND relative to a given cue is a constant fraction of cue\n   -  This is not generally true, but often a good approximation\n   - Examples\n        ➢Intensity change relative to background intensity\n      ➢The length difference we can detect is a fixed fraction of the object’s length\n           ❑This is probably only true for unaligned scales", "img": "slides/02-020.webp"}, {"id": "02-021", "lecture": 2, "page": 21, "title": "Discriminability: JND", "group": "Perception and accuracy", "text": "Discriminability: JND\n\n• JND: Just noticeable difference\n   - Increment where humans detects change\n• Weber’s law\n   - JND relative to a given cue is a constant fraction of cue\n   -  This is not generally true, but often a good approximation\n   - Examples\n        ➢Intensity change relative to background intensity\n      ➢The length difference we can detect is a fixed fraction of the object’s length\n           ❑This is probably only true for unaligned scales", "img": "slides/02-021.webp"}, {"id": "02-022", "lecture": 2, "page": 22, "title": "Discriminability: JND", "group": "Perception and accuracy", "text": "Discriminability: JND\n\n• JND: Just noticeable difference\n   - Increment where humans detects change\n• Weber’s law\n   - JND relative to a given cue is a constant fraction of cue\n   -  This is not generally true, but often a good approximation\n   - Examples\n        ➢Intensity change relative to background intensity\n      ➢The length difference we can detect is a fixed fraction of the object’s length\n           ❑This is probably only true for unaligned scales", "img": "slides/02-022.webp"}, {"id": "02-023", "lecture": 2, "page": 23, "title": "Discriminability: JND", "group": "Perception and accuracy", "text": "Discriminability: JND\n\n• JND: Just noticeable difference\n   - Increment where humans detects change\n• Weber’s law\n   - JND relative to a given cue is a constant fraction of cue\n   -  This is not generally true, but often a good approximation\n   - Examples\n        ➢Intensity change relative to background intensity\n      ➢The length difference we can detect is a fixed fraction of the object’s length\n           ❑This is probably only true for unaligned scales", "img": "slides/02-023.webp"}, {"id": "02-024", "lecture": 2, "page": 24, "title": "Discriminability: JND", "group": "Perception and accuracy", "text": "Discriminability: JND\n\n• JND: Just noticeable difference\n   - Increment where humans detects change\n• Weber’s law\n   - JND relative to a given cue is a constant fraction of cue\n   -  This is not generally true, but often a good approximation\n   - Examples\n        ➢Intensity change relative to background intensity\n      ➢The length difference we can detect is a fixed fraction of the object’s length\n           ❑This is probably only true for unaligned scales", "img": "slides/02-024.webp"}, {"id": "02-025", "lecture": 2, "page": 25, "title": "Discriminability: How many usable steps?", "group": "Perception and accuracy", "text": "Discriminability: How many usable steps?\n\n           •  Linewidth: only a few\n\n\n\n\n\n                                                                      https://mappa.mundi.net/maps/maps_014/", "img": "slides/02-025.webp"}, {"id": "02-026", "lecture": 2, "page": 26, "title": "Erasmus Exchange with Germany", "group": "Perception and accuracy", "text": "Erasmus Exchange with Germany\n\n\n\n\n\n                 https://www.zeit.de/zeit-magazin/2019/43/erasmus-studierende-deutschland-ziele-ausland-studium-deutschlandkarte", "img": "slides/02-026.webp"}, {"id": "02-027", "lecture": 2, "page": 27, "title": "Color Vision", "group": "Colour and colour maps", "text": "Color Vision\n\n\n\n\n\n                                                                               Chromaticity\n                                                                                    „Color“\n\n\n                                                                   Luminance\n\n\n                               First rule of color:\n                               Color is confusing if treated as monolithic\n\n                                                                                          Tamara Munzner", "img": "slides/02-027.webp"}, {"id": "02-028", "lecture": 2, "page": 28, "title": "RGB Color Space", "group": "Colour and colour maps", "text": "RGB Color Space\n\n   • Computational nice, but ….\n\n\n\n\n\n    Matthew Rollings Wikipedia CC BY 3.0, https://commons.wikimedia.org/w/index.php?curid=14914205\n    https://engineering.purdue.edu/~abe305/HTMLS/rgbspace.htm", "img": "slides/02-028.webp"}, {"id": "02-029", "lecture": 2, "page": 29, "title": "RGB Color Space", "group": "Colour and colour maps", "text": "RGB Color Space\n\n   • Computational nice, but ….\n\n\n\n\n\n    Matthew Rollings Wikipedia CC BY 3.0, https://commons.wikimedia.org/w/index.php?curid=14914205", "img": "slides/02-029.webp"}, {"id": "02-030", "lecture": 2, "page": 30, "title": "RGB Color Space", "group": "Colour and colour maps", "text": "RGB Color Space\n\n   • Computational nice, but ….", "img": "slides/02-030.webp"}, {"id": "02-031", "lecture": 2, "page": 31, "title": "HSL, HSV(HSB) Color Spaces", "group": "Colour and colour maps", "text": "HSL, HSV(HSB) Color Spaces\n\n\n\n\n\n      hue:      what color       (identity channel)\n       saturation: how colorful   (magnitude channel)\n       luminance/brightness/value: how dark/how bright (magnitude channel)\n\n\n\n\n\n     Munzner vdaallslides164", "img": "slides/02-031.webp"}, {"id": "02-032", "lecture": 2, "page": 32, "title": "Color Maps, Color Scales, Color Ramps", "group": "Colour and colour maps", "text": "Color Maps, Color Scales, Color Ramps\n\n        ‣ Ordered (usually for quantitative data)\n\n                - Sequential                    Single hue\n\n\n\n\n\n                - Sequential                      Multi hue\n\n\n\n\n                - Diverging", "img": "slides/02-032.webp"}, {"id": "02-033", "lecture": 2, "page": 33, "title": "Color Maps, Color Scales, Color Ramps", "group": "Colour and colour maps", "text": "Color Maps, Color Scales, Color Ramps\n\n        ‣ Categorical or Identity                      Two different categories\n                                                                    or\n                                          Two stages of one category", "img": "slides/02-033.webp"}, {"id": "02-034", "lecture": 2, "page": 34, "title": "Channel Effectiveness — Cleveland/McGill", "group": "Colour and colour maps", "text": "Channel Effectiveness — Cleveland/McGill\n\n\n       Magnitude Channels: Ordered Attributes                 Identity Channels: Categorical Attributes\n\n         Position on common scale                                  Spatial region\n\n         Position on unaligned scale                              Color hue\n\n        Length (1D size)                                    Motion\n\n          Tilt/angle                                        Shape\n\n        Area (2D size)\n\n       Depth (3D position)\n\n        Color luminance\n\n        Color saturation\n                                                                              Effectiveness principle:\n        Curvature                                                Encode most important attributes\n                                                                            with highest ranked channels.\n       Volume (3D size)\n                                                                                            Tamara Munzner\n     Munzner vdaallslides 49", "img": "slides/02-034.webp"}, {"id": "02-035", "lecture": 2, "page": 35, "title": "Color Maps, Color Scales, Color Ramps", "group": "Colour and colour maps", "text": "Color Maps, Color Scales, Color Ramps\n\n        ‣ Categorical or Identity\n\n\n\n\n\n                            ‣ saturation and area example: size affects salience!\n\n                                            ‣\n\n\n     Munzner vdaallslides 178", "img": "slides/02-035.webp"}, {"id": "02-036", "lecture": 2, "page": 36, "title": "Color Maps, Color Scales, Color Ramps", "group": "Colour and colour maps", "text": "Color Maps, Color Scales, Color Ramps\n\n        ‣ Categorical or Identity\n\n\n\n\n\n                            ‣ saturation and area example: size affects salience!\n\n                                            ‣\n\n\n     Munzner vdaallslides 178", "img": "slides/02-036.webp"}, {"id": "02-037", "lecture": 2, "page": 37, "title": "Color Maps, Color Scales, Color Ramps", "group": "Colour and colour maps", "text": "Color Maps, Color Scales, Color Ramps\n\n        ‣ Categorical or Identity\n\n\n\n\n\n                            ‣ saturation and area example: size affects salience!\n\n                                            ‣\n\n\n     Munzner vdaallslides 178", "img": "slides/02-037.webp"}, {"id": "02-038", "lecture": 2, "page": 38, "title": "Categorical color: limited number of discriminable bins", "group": "Colour and colour maps", "text": "Categorical color: limited number of discriminable bins\n\n\n\n\n\n     Munzner vdaallslides 176", "img": "slides/02-038.webp"}, {"id": "02-039", "lecture": 2, "page": 39, "title": "Categorical color: limited number of discriminable bins", "group": "Colour and colour maps", "text": "Categorical color: limited number of discriminable bins\n\n\n\n\n\n     Munzner vdaallslides 176", "img": "slides/02-039.webp"}, {"id": "02-040", "lecture": 2, "page": 40, "title": "Categorical color: limited number of discriminable bins", "group": "Colour and colour maps", "text": "Categorical color: limited number of discriminable bins\n\n\n\n\n\n     Munzner vdaallslides 176", "img": "slides/02-040.webp"}, {"id": "02-041", "lecture": 2, "page": 41, "title": "Rainbow is a poor default", "group": "Colour and colour maps", "text": "Rainbow is a poor default\n\n   • Problems\n\n        ‣ Perceptually unordered\n\n        ‣ Perceptually nonlinear\n\n   • Beneﬁts\n\n        ‣ Fine-grained structure visible\n        and nameable\n\n   • Alternatives\n\n        ‣ Large-scale structure: fewer\n        hues\n\n        ‣ Fine structure: multiple hues\n          with monotonically\n          increasing luminance (eg.\n             viridis, magma)\n     Munzner vdaallslides 179", "img": "slides/02-041.webp"}, {"id": "02-042", "lecture": 2, "page": 42, "title": "Munzner vdaallslides 182", "group": "Colour and colour maps", "text": "Munzner vdaallslides 182", "img": "slides/02-042.webp"}, {"id": "02-043", "lecture": 2, "page": 43, "title": "Inherent hue reduction", "group": "Colour and colour maps", "text": "Inherent hue reduction\n\n   X X X    X", "img": "slides/02-043.webp"}, {"id": "02-044", "lecture": 2, "page": 44, "title": "Inherent hue reduction", "group": "Colour and colour maps", "text": "Inherent hue reduction\n\n\n\n                                                                   Assumption\n                                                                     Process\n                                                            Outcome   X X X    X                                 Empirical\n                                                                       Conclusion", "img": "slides/02-044.webp"}, {"id": "02-045", "lecture": 2, "page": 45, "title": "Inherent hue reduction", "group": "Colour and colour maps", "text": "Inherent hue reduction\n\n\n\n                                                                   Assumption\n                                                                     Process\n                                                            Outcome   X X X    X                                 Empirical\n                                                                       Conclusion", "img": "slides/02-045.webp"}, {"id": "02-046", "lecture": 2, "page": 46, "title": "Glyphs as Alternative", "group": "Popout, grouping and glyphs", "text": "Glyphs as Alternative\n\n   • Glyphs: composite objects\n\n        ‣ Internal structure with\n          multiple marks\n\n   • Alternative to color coding\n\n        ‣ Or coding with any single\n         channel\n\n\n\n\n\n              MaguireTaxonomy-BasedE, Rocca-SerraGlyph P,Design—withSansone SA,a CaseDaviesStudyJ, Chenon VisualizingM.      Workﬂows of Biological Experiments. IEEETrans Vis Comput Graph. 2012 Dec;18(12):2603-12", "img": "slides/02-046.webp"}, {"id": "02-047", "lecture": 2, "page": 47, "title": "Glyphs as Alternative", "group": "Popout, grouping and glyphs", "text": "Glyphs as Alternative\n\n\n\n\n\n      S1   S2                                    S3     S4    S5              S6                S7      S8\n\n\n                                                       !!      !\n\n\n\n\n\n              Assumption                 Outcome                     Conclusion\n\n\n                                                   Empirical               Process                                !", "img": "slides/02-047.webp"}, {"id": "02-048", "lecture": 2, "page": 48, "title": "Separability vs. Integrality", "group": "Popout, grouping and glyphs", "text": "Separability vs. Integrality\n\n\n\n\n\n           2 groups each       2 groups each       3 groups total:        4 groups total:\n                                                                 integral\n                                                                             interpretation    integralascolor interpretationhue                                                              of area", "img": "slides/02-048.webp"}, {"id": "02-049", "lecture": 2, "page": 49, "title": "Preattentive Processing (Popout)", "group": "Popout, grouping and glyphs", "text": "Preattentive Processing (Popout)\n\n•  Find the red dot\n   - How long does it take?\n•  Parallel processing on many individual channels\n   - Speed independent of distractor count\n   - Speed depends on channel and amount of\n     difference from distractors\n•  Serial search for (almost all) combinations: here\n   color and shape\n\n   - Speed depends on number of distractors", "img": "slides/02-049.webp"}, {"id": "02-050", "lecture": 2, "page": 50, "title": "Popout", "group": "Popout, grouping and glyphs", "text": "Popout\n\n\n\n\n\n            • Many channels provide popout: tilt, size, shape, proximity,\n           shadow direction, ...\n\n            • But not all: parallel line pairs do not pop out from tilted pairs", "img": "slides/02-050.webp"}, {"id": "02-051", "lecture": 2, "page": 51, "title": "Popout", "group": "Popout, grouping and glyphs", "text": "Popout\n\n• Munzner: “Most pairs of channels do not support popout, but a few pairs do: one example is space and\n   color, and another is motion and shape. Popout is definitely not possible with three or more channels. As a\n\n   general rule, vis designers should only count on using popout for a single channel at a time.”", "img": "slides/02-051.webp"}, {"id": "02-052", "lecture": 2, "page": 52, "title": "Grouping (Show items that belong together)", "group": "Popout, grouping and glyphs", "text": "Grouping (Show items that belong together)\n\n\n • Containment\n   - Area mark as link\n • Connection\n   -  Line mark as link", "img": "slides/02-052.webp"}, {"id": "02-053", "lecture": 2, "page": 53, "title": "Grouping (Show items that belong together)", "group": "Popout, grouping and glyphs", "text": "Grouping (Show items that belong together)\n\n\n • Containment\n   - Area mark as link\n • Connection\n   -  Line mark as link", "img": "slides/02-053.webp"}, {"id": "02-054", "lecture": 2, "page": 54, "title": "Grouping (Show items that belong together)", "group": "Popout, grouping and glyphs", "text": "Grouping (Show items that belong together)\n\n\n • Containment\n   - Area mark as link\n • Connection\n   -  Line mark as link", "img": "slides/02-054.webp"}, {"id": "02-055", "lecture": 2, "page": 55, "title": "Grouping (Show items that belong together)", "group": "Popout, grouping and glyphs", "text": "Grouping (Show items that belong together)\n\n\n • Containment\n   - Area mark as link\n • Connection\n   -  Line mark as link\n\n • Use group ID as a categorical\n    attribute\n\n   -  Proximity\n       ➢Put items in the same spatial\n           region\n   -  Similarity\n        ➢Color, motion, shape\n   - Does not introduce\n      clutter and is orthogonal\n      to other layout techniques", "img": "slides/02-055.webp"}, {"id": "02-056", "lecture": 2, "page": 56, "title": "Colormaps", "group": "Popout, grouping and glyphs", "text": "Colormaps\n\n• Colormaps specify a mapping between data values and colors\n• One dimensional colormaps\n   -  Categorical data\n      ➢For noncontiguous use of color\n      ➢6-12 bins hue/color\n      ➢3-4 bins luminance, saturation\n      ➢Only 6 to 12 bins in total\n       ➢Size heavily affects salience\n      ➢Use high saturation for small regions,\n         low saturation for large\n   - Ordered data use continuous color maps\n       ➢Sequential range of data value\n       ➢Diverging value ranges\n•  Bivariate / two-dimensional color maps\n   - Encode two attributes simultaneously", "img": "slides/02-056.webp"}, {"id": "02-057", "lecture": 2, "page": 57, "title": "Categorization of Colormaps", "group": "Popout, grouping and glyphs", "text": "Categorization of Colormaps\n\n•  Categorization\n   -  Categorical vs. ordered\n   - Ordered: sequential vs. diverging\n       ➢Diverging has zero point at the\n          center\n   - Here: binary encoding added\n   -  Bivariate colormaps work well\n      for a few levels\n\n\n•  ColorBrewer\n   - http://www.colorbrewer2.org\n   - Creates colormaps based on\n     perceptual guidelines\n\n\n\n\n                                                                                                                  After [Color Use Guidelines for Mapping and Visualization. Brewer, 1994]\n                                                                                             Examples: http://www.personal.psu.edu/faculty/c/a/cab38/ColorSch/Schemes.html]", "img": "slides/02-057.webp"}, {"id": "02-058", "lecture": 2, "page": 58, "title": "Map Other Channels", "group": "Popout, grouping and glyphs", "text": "Map Other Channels\n\n\n•  Size\n   - Length accurate, 2D area ok, 3D volume poor\n•  Angle\n   -  Nonlinear accuracy\n     ➢Horizontal, vertical, exact diagonal preferred\n• Shape\n   - Complex combination of lower-level primitives\n   - Many bins", "img": "slides/02-058.webp"}, {"id": "02-059", "lecture": 2, "page": 59, "title": "Quiz", "group": "Popout, grouping and glyphs", "text": "Quiz", "img": "slides/02-059.webp"}, {"id": "02-060", "lecture": 2, "page": 60, "title": "End", "group": "Popout, grouping and glyphs", "text": "End", "img": "slides/02-060.webp"}, {"id": "03-001", "lecture": 3, "page": 1, "title": "Manipulate – Facet – Reduce", "group": "Manipulate · navigation and zoom", "text": "Manipulate – Facet – Reduce", "img": "slides/03-001.webp"}, {"id": "03-002", "lecture": 3, "page": 2, "title": "Analysis: What, Why and How", "group": "Manipulate · navigation and zoom", "text": "Analysis: What, Why and How\n\n • What is shown?\n\n  - Data abstraction\n • Why is the user looking at it?\n\n  - Task abstraction\n • How is it shown?\n\n  - Technique: visual encoding and interaction\n\n\n • Translation to vis vocabulary avoids domain-specific terms\n\n  - Translation process iterative and often complex\n\n • What-why-how analysis framework helps to think systematically about design space", "img": "slides/03-002.webp"}, {"id": "03-003", "lecture": 3, "page": 3, "title": "Slide 3", "group": "Manipulate · navigation and zoom", "text": "", "img": "slides/03-003.webp"}, {"id": "03-004", "lecture": 3, "page": 4, "title": "Slide 4", "group": "Manipulate · navigation and zoom", "text": "", "img": "slides/03-004.webp"}, {"id": "03-005", "lecture": 3, "page": 5, "title": "Slide 5", "group": "Manipulate · navigation and zoom", "text": "", "img": "slides/03-005.webp"}, {"id": "03-006", "lecture": 3, "page": 6, "title": "Slide 6", "group": "Manipulate · navigation and zoom", "text": "", "img": "slides/03-006.webp"}, {"id": "03-007", "lecture": 3, "page": 7, "title": "Manipulate", "group": "Manipulate · navigation and zoom", "text": "Manipulate\n\n\n\n\n\n               Tamara Munzner. Visualization Analysis and Design. A K Peters Visualization Series, CRC Press, 2014. Chapter 11", "img": "slides/03-007.webp"}, {"id": "03-008", "lecture": 3, "page": 8, "title": "Navigation Standard Solution: Scrolling (Detail-only window)", "group": "Manipulate · navigation and zoom", "text": "Navigation Standard Solution: Scrolling (Detail-only window)\n\n • Single window with horizontal and vertical panning\n   to access a larger virtual screen\n\n • Issues\n\n   -  Only single focus\n\n   -  Efficient scrolling requires cognitive map\n\n     ‣ No overview\n\n     ‣  Relationship between the current focus and the desired\n       focus?\n\n     ‣  Must mentally map relationship between current and next\n         foci to the slider positions on the scroll bar\n\n  - Works well only if zoom factor is relatively\n    small", "img": "slides/03-008.webp"}, {"id": "03-009", "lecture": 3, "page": 9, "title": "Overview First, Zoom and Filter, Details on Demand", "group": "Manipulate · navigation and zoom", "text": "Overview First, Zoom and Filter, Details on Demand\n\n • Influential mantra from Ben Shneiderman\n\n\n • What is needed\n\n  - Overview (summary)\n\n  - Focus view\n\n  - Support for navigation\n\n\n\n\n\n                                       [The Eyes Have It: A Task by Data Type Taxonomy for Information Visualizations. Shneiderman. Proc. IEEE Visual Languages, pp. 336–34\n                                         1996.]\n\n\n\n                                          [Search, Show Context, Expand on Demand: Supporting Large Graph Exploration with Degree-of-Interest. van Ham and Perer. IEEE\n                                           Trans. Visualization and Computer Graphics (Proc. InfoVis 2009) 15:6 (2009), 953–960.]", "img": "slides/03-009.webp"}, {"id": "03-010", "lecture": 3, "page": 10, "title": "Overview + Detail", "group": "Manipulate · navigation and zoom", "text": "Overview + Detail\n\n • Provide both overview and detail\n  displays\n • Two ways to combine:                                                                                              overview\n\n  - Time - Alternate between overview and\n     detail sequentially\n\n  - Space - Use different portions of the\n                                                                                               detail    screen (eye beats memory)\n\n\n\n\n\n                                         Overview and detail (from Civilization II game)", "img": "slides/03-010.webp"}, {"id": "03-011", "lecture": 3, "page": 11, "title": "Plaisant et al Article", "group": "Manipulate · navigation and zoom", "text": "Plaisant et al Article\n\n • Good introduction to overview/detail issue\n • Application concern: viewing and editing large images\n • Expanding the notion of the one-dimensional scroll bar: zooming, diagonal panning,\n  multiple detailed views\n • List of visualization/interaction solutions\n\n\n\n\n\n                               Image Browsers: Taxonomy and Design Guidelines. C. Plaisant,\n                                   D. Carr, B. Shneiderman IEEE Software 12(2) March 1995 pp\n                                                         21-32", "img": "slides/03-011.webp"}, {"id": "03-012", "lecture": 3, "page": 12, "title": "One Window With Zoom & Replace", "group": "Manipulate · navigation and zoom", "text": "One Window With Zoom & Replace\n\n • Global view with selectable zoom area which\n  then becomes entire view\n\n • Variations can let users pan and adjust\n  zoomed area and adjust levels of\n   magnification\n\n • Context switch can be disorienting\n\n\n • Example: CAD/CAM", "img": "slides/03-012.webp"}, {"id": "03-013", "lecture": 3, "page": 13, "title": "Single Coordinated Pair", "group": "Manipulate · navigation and zoom", "text": "Single Coordinated Pair\n\n • Combined display of the overview and local\n  magnified view (separate views)\n • Some implementations reserve large space\n   for overview; others for detail\n • Issue: How big are different views and\n  where do they go?\n\n\n\n\n\n                                               Wasted space", "img": "slides/03-013.webp"}, {"id": "03-014", "lecture": 3, "page": 14, "title": "Tiled Multilevel Browser", "group": "Manipulate · navigation and zoom", "text": "Tiled Multilevel Browser\n\n • Combined global, intermediate, and\n   detail views\n • Views do not overlap\n\n\n • Good implementations closely relate the\n  views, allowing panning in one view to\n  affect others", "img": "slides/03-014.webp"}, {"id": "03-015", "lecture": 3, "page": 15, "title": "Free Zoom And Multiple Overlap", "group": "Manipulate · navigation and zoom", "text": "Free Zoom And Multiple Overlap\n\n • Overview presented first; user selects area\n  to zoom and area in which to create\n  detailed view\n\n\n • Flexible layout, but users must perform\n  manual window management", "img": "slides/03-015.webp"}, {"id": "03-016", "lecture": 3, "page": 16, "title": "Overview and Detail for Time Series Data", "group": "Manipulate · navigation and zoom", "text": "Overview and Detail for Time Series Data\n\n                                                   https://www.highcharts.com/demo/dynamic-master-detail\n\n\n\n\n\n                                                          https://bl.ocks.org/mbostock/34f08d5e11952a80609169b7917d4172", "img": "slides/03-016.webp"}, {"id": "03-017", "lecture": 3, "page": 17, "title": "Overview and Detail: Drill-down", "group": "Manipulate · navigation and zoom", "text": "Overview and Detail: Drill-down\n\n • Manually select individual item or smaller set of items from a display for a more\n  detailed view/analysis\n\n\n\n\n\n                        Conklin et al.\n                         InfoVis2002", "img": "slides/03-017.webp"}, {"id": "03-018", "lecture": 3, "page": 18, "title": "Panning and Zooming", "group": "Manipulate · navigation and zoom", "text": "Panning and Zooming\n\n • Panning\n\n  - Smooth movement of camera across scene (or scene moves and camera stays still)\n • Zooming\n\n  - Increasing or decreasing the magnification of the objects in a scene\n\n\n • Useful for changing focal point\n • ZUI = Zoomable User Interface", "img": "slides/03-018.webp"}, {"id": "03-019", "lecture": 3, "page": 19, "title": "Panning", "group": "Manipulate · navigation and zoom", "text": "Panning\n\n • Smooth movement of a viewing window over a 2D image", "img": "slides/03-019.webp"}, {"id": "03-020", "lecture": 3, "page": 20, "title": "Zooming", "group": "Manipulate · navigation and zoom", "text": "Zooming\n\n • Increasing/ or decreasing magnification", "img": "slides/03-020.webp"}, {"id": "03-021", "lecture": 3, "page": 21, "title": "Combined Zooming and Panning", "group": "Manipulate · navigation and zoom", "text": "Combined Zooming and Panning\n\n • Efficient task sequence\n\n  - Zoom back\n\n  - Pan\n\n  - Zoom in", "img": "slides/03-021.webp"}, {"id": "03-022", "lecture": 3, "page": 22, "title": "Geometric + Semantic Zoom", "group": "Manipulate · navigation and zoom", "text": "Geometric + Semantic Zoom\n\n • Often just simple zooming is\n   not all that useful\n\n • Change representation\n  based on zooming level!", "img": "slides/03-022.webp"}, {"id": "03-023", "lecture": 3, "page": 23, "title": "Semantic Zooming", "group": "Manipulate · navigation and zoom", "text": "Semantic Zooming\n\n • Alternative to geometric zoom\n\n • Resolution-aware layout adapts\n   to available space\n\n • Goal: Legible at multiple scales\n\n\n • Example: visual encoding changes\n   from bottom to top\n\n    -  Colored box\n\n    -  Simple line chart\n\n    -  Full chart: axes and tickmarks\n\n System: LiveRAC\nLiveRAC - Interactive Visual Exploration of\nSystem Management Time-Series Data.\nMcLachlan, Munzner, Koutsofios, and North.\nProc. ACM Conf. Human Factors in Computing\nSystems (CHI), pp. 1483–1492, 2008.", "img": "slides/03-023.webp"}, {"id": "03-024", "lecture": 3, "page": 24, "title": "Slide 24", "group": "Manipulate · navigation and zoom", "text": "", "img": "slides/03-024.webp"}, {"id": "03-025", "lecture": 3, "page": 25, "title": "Quiz", "group": "Manipulate · navigation and zoom", "text": "Quiz", "img": "slides/03-025.webp"}, {"id": "03-026", "lecture": 3, "page": 26, "title": "Facet (Split Up)", "group": "Facet · coordinated views", "text": "Facet (Split Up)\n\n • Handle visual complexity\n\n  - Juxtaposing coordinated views side by side\n    ‣ Show different facets or views of the data\n\n  - Superimposing layers in a single view\n    ‣ Requires splitting up in layers\n       e.g. layers in a map: streets vs. water, land areas, …\n\n\n\n\n\n  Tamara Munzner. Visualization Analysis and Design. A K Peters Visualization Series, CRC Press, 2014. Chapter 12", "img": "slides/03-026.webp"}, {"id": "03-027", "lecture": 3, "page": 27, "title": "Juxtapose: Coordination Through Brushing and Linking", "group": "Facet · coordinated views", "text": "Juxtapose: Coordination Through Brushing and Linking\nSelect or designate/specify value, then see matching items elsewhere on the display\n\n\n\n\n\n                                                                                                      Example:\n                                                                                4D data\n                                                                                                                                    in linked\n                                                                                2D + 2D\n                                                                                                                      display\n\n\n\n\n                                                                                                         Items are major league baseball players.", "img": "slides/03-027.webp"}, {"id": "03-028", "lecture": 3, "page": 28, "title": "Juxtapose: Small Multiples", "group": "Facet · coordinated views", "text": "Juxtapose: Small Multiples\n\n\n\n\n\nn e.g. through time slider Unemployed U.S. workers by industry, 2000–2010 Data source: U.S. Bureau of Labor Statistics http://hci.stanford.edu/jheer/files/zoo/ex/time/multiples.html", "img": "slides/03-028.webp"}, {"id": "03-029", "lecture": 3, "page": 29, "title": "Juxtapose: Small Multiples", "group": "Facet · coordinated views", "text": "Juxtapose: Small Multiples\n\n\n\n\n\nn e.g. through time slider Unemployed U.S. workers by industry, 2000–2010 Data source: U.S. Bureau of Labor Statistics http://hci.stanford.edu/jheer/files/zoo/ex/time/multiples.html", "img": "slides/03-029.webp"}, {"id": "03-030", "lecture": 3, "page": 30, "title": "Juxtapose: Small Multiples", "group": "Facet · coordinated views", "text": "Juxtapose: Small Multiples\n\n\n\n\n\nn e.g. through time slider Unemployed U.S. workers by industry, 2000–2010 Data source: U.S. Bureau of Labor Statistics http://hci.stanford.edu/jheer/files/zoo/ex/time/multiples.html", "img": "slides/03-030.webp"}, {"id": "03-031", "lecture": 3, "page": 31, "title": "Small Multiples", "group": "Facet · coordinated views", "text": "Small Multiples\n\n • Can be constructed for plots, area graphs, bar charts, …\n • Also interesting as linked views where coordinated interaction takes place across all\n  individual visualizations\n • Separate visualizations can be more effective than overlaying all data in a single plot", "img": "slides/03-031.webp"}, {"id": "03-032", "lecture": 3, "page": 32, "title": "Coordinated Multiple-View Display Vis System: Improvise", "group": "Facet · coordinated views", "text": "Coordinated Multiple-View Display Vis System: Improvise\n\n   • Investigate\n    power of\n     multiple views\n\n      -  The system is\n      pushing the limits\n      on view count and\n        interaction\n       complexity\n\n\n\n\n\n  [Building Highly-Coordinated Visualizations In\nImprovise. Weaver. Proc. IEEE Symp. Information\n   Visualization (InfoVis), pp. 159–166, 2004.]                                                                                                                                          33", "img": "slides/03-032.webp"}, {"id": "03-033", "lecture": 3, "page": 33, "title": "Superimpose Local Lens: Lenses", "group": "Facet · coordinated views", "text": "Superimpose Local Lens: Lenses\n\n • Regions/objects that can be moved around on display\n • Semantically different content may be displayed in the lens e.g. semantic zoom!\n\n\n                                                                       3D wireframe lens\n\n\n\n                                                                                2D magnifier\n\n\n\n\n\n                                                                                                                                        Toolglass and Magic Lenses: The See-Through Interface, Siggraph 1993\n                                                                                Eric A. Bier, Maureen C. Stone, Ken Pier, William Buxton, Tony D. DeRose http://www2.parc.com/istl/projects/MagicLenses/93Siggraph.html", "img": "slides/03-033.webp"}, {"id": "03-034", "lecture": 3, "page": 34, "title": "Superimpose Local Lens: Bifocal Magnified", "group": "Facet · coordinated views", "text": "Superimpose Local Lens: Bifocal Magnified\n\n • “Magnifying glass” zoomed image floats\n  over overview image\n\n\n\n • Adjacent objects are obscured by the\n  zoomed window", "img": "slides/03-034.webp"}, {"id": "03-035", "lecture": 3, "page": 35, "title": "Dynamic Visual Layering", "group": "Facet · coordinated views", "text": "Dynamic Visual Layering\n\n • Interactive based on selection\n • One-hop neighbor highlighting demos: click vs hover (lightweight)\n\n\n\n\n\n                                                                                                                          http://mbostock.github.io/d3/talk/20111116/airports.html                           http://mariandoerk.de/edgemaps/demo/", "img": "slides/03-035.webp"}, {"id": "03-036", "lecture": 3, "page": 36, "title": "Trellis Plots", "group": "Facet · coordinated views", "text": "Trellis Plots\n\n • Multivariate data is graphed as MxN array of views\n   -  The same 2 “primary” attributes shown in each view\n\n   - Up to two further variables with MxN discrete values\n • Example 1x6 views\n   -  Different wheat varieties are planted at different\n     sites and the yield (x-axis) per site (N=6 sites),\n     year and wheat type (y-axis) is monitored\n   -  Partitioning →Split by site\n   -  Superimpose within same frame →Color code by year\n   -  Main-effects ordering\n     ‣  Derive value of median for group, use to order\n       ‣ Order rows within view by barley variety yield median\n       ‣ Order views themselves by site yield median", "img": "slides/03-036.webp"}, {"id": "03-037", "lecture": 3, "page": 37, "title": "Quiz", "group": "Facet · coordinated views", "text": "Quiz", "img": "slides/03-037.webp"}, {"id": "03-038", "lecture": 3, "page": 38, "title": "Slide 38", "group": "Facet · coordinated views", "text": "", "img": "slides/03-038.webp"}, {"id": "03-039", "lecture": 3, "page": 39, "title": "Reduce Items and Attributes", "group": "Reduce and focus + context", "text": "Reduce Items and Attributes\n\n • Filter (data items, attributes)\n  - Pro: straightforward and intuitive\n    ‣ to understand and compute\n  - Con: out of sight, out of mind\n • Aggregation\n  - Pro: inform about whole set\n  - Con: loses information\n • Filter and aggregation are not\n  mutually exclusive\n  - Combination of filter & show aggregate of rest\n  - Combination of facet, reduce, change\n • Embed\n  - Show detail in context\n\n\n     Tamara Munzner. Visualization Analysis and Design. A K Peters\n           Visualization Series, CRC Press, 2014.Chapter 13 / 14", "img": "slides/03-039.webp"}, {"id": "03-040", "lecture": 3, "page": 40, "title": "Example System Filmfinder", "group": "Reduce and focus + context", "text": "Example System Filmfinder\n\n • Film Finder, University of Maryland\n\n\n\n\n\n                                Categorical: Color                 Ordinal: List                       Quantitative: Axis", "img": "slides/03-040.webp"}, {"id": "03-041", "lecture": 3, "page": 41, "title": "System Filmfinder Supports Dynamic Filtering", "group": "Reduce and focus + context", "text": "System Filmfinder Supports Dynamic Filtering\n\n • Item filtering\n • Browse through tightly coupled interaction\n\n  -  Alternative to queries that might return far too many or too few\n\n\n\n\n\n                           [Visual information seeking: Tight coupling of dynamic que
