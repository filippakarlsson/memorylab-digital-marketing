ry filters with starfield displays. Ahlberg and\n                         Shneiderman. Proc. ACM Conf. on Human Factors in Computing Systems (CHI), pp. 313–317, 1994.]", "img": "slides/03-041.webp"}, {"id": "03-042", "lecture": 3, "page": 42, "title": "Aggregate Information in Scented Widgets", "group": "Reduce and focus + context", "text": "Aggregate Information in Scented Widgets\n\n • The scented widget idiom adds visual encoding information directly to standard\n  graphical widgets to make filtering possible with high information density displays\n   [Willett et al. 07].\n • Idea of information scent: cues that help a searcher decide whether there is value in\n   drilling down further into a particular information source, versus looking elsewhere\n   [Pirolli 07].", "img": "slides/03-042.webp"}, {"id": "03-043", "lecture": 3, "page": 43, "title": "Embed: Focus + Context", "group": "Reduce and focus + context", "text": "Embed: Focus + Context\n\n • Combine information within single view\n\n   -  Zooming hides the context\n\n   - Two separate displays split attention (e.g. overview+detail)\n\n • Elide\n\n   -  Drop from view or replace by aggregate information\n\n   -  Selectively filter and aggregate\n\n • Superimpose layer\n\n   -  Local lens\n\n   -  Different semantic layers\n\n • Distortion design choices\n\n   -  Region shape: radial, rectilinear, complex\n\n   - How many focus areas: one, many\n\n   -  Region extent: local, global", "img": "slides/03-043.webp"}, {"id": "03-044", "lecture": 3, "page": 44, "title": "Distort Geometry: Fish-eye View", "group": "Reduce and focus + context", "text": "Distort Geometry: Fish-eye View\n\n • Magnified image is distorted so that focus is at high magnification, periphery at low\n\n •  All in one view\n\n • Distortion can be disorienting\n\n\n • This is focus + context\n     It is not called\n  OVERVIEW and DETAIL", "img": "slides/03-044.webp"}, {"id": "03-045", "lecture": 3, "page": 45, "title": "Effective Route Maps: Two Focus Regions", "group": "Reduce and focus + context", "text": "Effective Route Maps: Two Focus Regions\n\n\n\n\n\n                                       Agrawala/Stolte, Siggraph 2001:\n                Rendering Effective Route Maps: Improving Usability Through Generalization", "img": "slides/03-045.webp"}, {"id": "03-046", "lecture": 3, "page": 46, "title": "Bifocal Display (Spence & Apperly ‘82)", "group": "Reduce and focus + context", "text": "Bifocal Display (Spence & Apperly ‘82)\n\n\n\n\n\n                                    (a) An information space containing documents, emails, etc.\n\n\n\n\n\n                                                                  direction\n                                                                   of view\n                                                                          (c) Appearance of the information space when\n               (b) The same space wrapped                         viewed from an appropriate direction\n                around two uprights.", "img": "slides/03-046.webp"}, {"id": "03-047", "lecture": 3, "page": 47, "title": "Visual Transfer Functions", "group": "Reduce and focus + context", "text": "Visual Transfer Functions", "img": "slides/03-047.webp"}, {"id": "03-048", "lecture": 3, "page": 48, "title": "Perspective Wall", "group": "Reduce and focus + context", "text": "Perspective Wall\n\n • 3D implementation of bifocal display\n • Uses natural perspective to create focus and context\n • Map work charts onto diagram\n  -  x-axis is time\n  -  y-axis is project\n\n\n\n                                                                      Mackinlay, Robertson, Card CHI‘91", "img": "slides/03-048.webp"}, {"id": "03-049", "lecture": 3, "page": 49, "title": "Focus and Context: Text/Program Viewing", "group": "Reduce and focus + context", "text": "Focus and Context: Text/Program Viewing\n\n\n\n\n\n              Shown here are\n                 examples from\n                  Gutwin and\n                  Greenberg\n\n                  Step function\n\n\n\n\n\n                                                                                              Slide adapted from John Stasko", "img": "slides/03-049.webp"}, {"id": "03-050", "lecture": 3, "page": 50, "title": "Focus and Context: Shared Text editor for CSCW", "group": "Reduce and focus + context", "text": "Focus and Context: Shared Text editor for CSCW\n\n\n\n\n\n                                  Gutwin and Greenberg, ‘96", "img": "slides/03-050.webp"}, {"id": "03-051", "lecture": 3, "page": 51, "title": "Focus and Context Example: Eureka", "group": "Reduce and focus + context", "text": "Focus and Context Example: Eureka\n\n\n\n\n\n                                                    From Xerox PARC and Inxight\n                                                          http://www.inxight.com/products/sdks/tl/", "img": "slides/03-051.webp"}, {"id": "03-052", "lecture": 3, "page": 52, "title": "Slide 52", "group": "Reduce and focus + context", "text": "", "img": "slides/03-052.webp"}, {"id": "03-053", "lecture": 3, "page": 53, "title": "Important for Focus and Context: Animated Transitions", "group": "Reduce and focus + context", "text": "Important for Focus and Context: Animated Transitions\n\n • Smooth transition from one state to another\n\n  -  Alternative to jump cuts\n\n  - Support for item tracking when amount of change is limited\n\n  - Focus should open, shift and close in an animated way\n\n  - http://vis.berkeley.edu/papers/animated_transitions/", "img": "slides/03-053.webp"}, {"id": "03-054", "lecture": 3, "page": 54, "title": "Important for Focus and Context: Animated Transitions", "group": "Reduce and focus + context", "text": "Important for Focus and Context: Animated Transitions\n\n • Animated transitions are useful in general\n\n  - Example: multilevel matrix views\n    ‣ Scope of what is shown narrows down\n\n       ‣ Middle block stretches to fill space, additional structure and detail appears within\n\n       ‣ Other blocks squish down to increasingly aggregated representations\n\n\n\n\n\n                        [Using Multilevel Call Matrices in Large Software Projects. van Ham. Proc. IEEE Symp. Information Visualization (InfoVis), pp. 227–232, 2003.]", "img": "slides/03-054.webp"}, {"id": "03-055", "lecture": 3, "page": 55, "title": "Quiz", "group": "Reduce and focus + context", "text": "Quiz", "img": "slides/03-055.webp"}, {"id": "03-056", "lecture": 3, "page": 56, "title": "End", "group": "Reduce and focus + context", "text": "End", "img": "slides/03-056.webp"}, {"id": "03-057", "lecture": 3, "page": 57, "title": "Data Space", "group": "Advanced examples and principles", "text": "Data Space\n\n • Statistical distributions: multi-dimensional databases,…\n • Trees/Hierarchies: directories,…\n • Networks/Graphs: web, communications,…\n • Unstructured data, e.g. document collections: digital libraries,…\n • Time Series\n\n • Maps", "img": "slides/03-057.webp"}, {"id": "03-058", "lecture": 3, "page": 58, "title": "Competing Approach: Data Mining", "group": "Advanced examples and principles", "text": "Competing Approach: Data Mining\n\n\n\n\n\n          SSS SSS SSS SSS SSS SSS SSS SSS\n          SSS SSS SSS SSS SSS SSS SSS SSS\n          SSS SSS SSS SSS SSS SSS SSS SSS\n          SSS SSS SSS SSS SSS SSS SSS SSS                              $\n          SSS SSS SSS SSS SSS SSS SSS SSS\n          SSS SSS SSS SSS SSS SSS SSS SSS\n\n\n\n\n • Tap the power of the computer\n\n  - Complex statistical analysis\n\n  - Simple report\n\n  - Visual Analytics: combine data mining and info vis", "img": "slides/03-058.webp"}, {"id": "03-059", "lecture": 3, "page": 59, "title": "A First Bifocal Calendar (1980)", "group": "Advanced examples and principles", "text": "A First Bifocal Calendar (1980)\n\n\n                     Mar  Apri l May June   July                            Aug Sept Oct\n                               11Sun Check sli des, notes.\n                                           Fam il y barbeque\n                               12 Mon Fl y LA\n                                                      Kathy to ai rport Model Maker\n                               13 Tue\n\n                               14 Wed\n\n                               15 Thur\n\n                               16 Fri                                                                       Fl ight to SFO\n                                                T utorial set-up\n                                                T utorial\n                                                        United fli ght Heathrow\n\n                                                          Pointer\n                                                          Color OHs\n                                                 Jane+John\n\n                                                                Call Kathy\n\n                                  17Sat Fl y LHR Kathy to coll ect\n                                                     Chapter 2/ see Dave March", "img": "slides/03-059.webp"}, {"id": "03-060", "lecture": 3, "page": 60, "title": "Visual Analytics: Netspeak Wordgraph", "group": "Advanced examples and principles", "text": "Visual Analytics: Netspeak Wordgraph", "img": "slides/03-060.webp"}, {"id": "03-061", "lecture": 3, "page": 61, "title": "The i-disc", "group": "Advanced examples and principles", "text": "The i-disc\n\n\n\n\n\n                                         Perspective: Natural focus and context display", "img": "slides/03-061.webp"}, {"id": "03-062", "lecture": 3, "page": 62, "title": "Spiral Calendar", "group": "Advanced examples and principles", "text": "Spiral Calendar\nThis is more Detail and Overview More Than Focus and Context\n\n\n\n\n\n                                                                                        Mackinlay, Robertson, Deline UIST’94", "img": "slides/03-062.webp"}, {"id": "03-063", "lecture": 3, "page": 63, "title": "No unjustified 3D example: Time-series data", "group": "Advanced examples and principles", "text": "No unjustified 3D example: Time-series data\n\n • extruded curves: detailed comparisons impossible\n\n\n\n\n\n             [Cluster and Calendar based Visualization of Time Series Data. van Wijk and van Selow, Proc. InfoVis\n             99.]                                                                                                                                                                   64\n\n\n                                                                                                                                                       64", "img": "slides/03-063.webp"}, {"id": "03-064", "lecture": 3, "page": 64, "title": "No unjustified 3D example: Transform for new data abstraction", "group": "Advanced examples and principles", "text": "No unjustified 3D example: Transform for new data abstraction\n\n • derived data: cluster hierarchy\n • juxtapose multiple views: calendar, superimposed 2D curves\n\n\n\n\n\n             [Cluster and Calendar based Visualization of Time Series Data. van Wijk and van Selow, Proc. InfoVis\n             99.]                                                                                                                                                                   65\n\n\n                                                                                                                                                       65", "img": "slides/03-064.webp"}, {"id": "03-065", "lecture": 3, "page": 65, "title": "Hyperbolic Browser", "group": "Advanced examples and principles", "text": "Hyperbolic Browser\n\n\n\n\n\n                                                                 DEMO\n\n\n                                                                     Commercial version\n\n                                                                                      Star Tree\n\n                                                                              http://www.inxight.com\n\n                                                                    Now: SAP!\n\n\n\n\n\n                                                                                             Lamping, Rao UIST’94", "img": "slides/03-065.webp"}, {"id": "03-066", "lecture": 3, "page": 66, "title": "Fundamental Problem", "group": "Advanced examples and principles", "text": "Fundamental Problem\n\n • Scale: Most datasets don’t fit on the display\n\n  - Too many attributes\n\n  - Too many data records\n • Therefore, user must focus on specific attributes and/or data records\n • Issues raised by focusing:\n\n  - How to specify focus?\n\n  - What is the relationship of focus to the rest of the data?\n\n  - How does the user shift focus?\n    ‣ Find new focus\n    ‣ Stay oriented", "img": "slides/03-066.webp"}, {"id": "03-067", "lecture": 3, "page": 67, "title": "Example Filmfinder: Data Types", "group": "Advanced examples and principles", "text": "Example Filmfinder: Data Types\n\n\n\n\n                                   Categorical                       Ordinal                    Quantitative\n\n\n\n                     FilmID       230      105      540 …\n                              Title  Goldfinger  Ben Hur  Ben Hur …\n                      Director   Hamilton    Wyler      Niblo …\n                       Actor   Connery   Heston   Novarro …\n                     Actress  Blackman  Harareet  McAvoy …\n                     Year      1964     1959     1926 …\n                    Length       112      212      133 …\n                   Popularity         7.7       8.2        7.4 …\n                     Rating      PG     G     G …\n                  Film Type      Action    Action   Drama …", "img": "slides/03-067.webp"}, {"id": "03-068", "lecture": 3, "page": 68, "title": "Bifocal Calendar: Fishcal / DateLens", "group": "Advanced examples and principles", "text": "Bifocal Calendar: Fishcal / DateLens", "img": "slides/03-068.webp"}, {"id": "03-069", "lecture": 3, "page": 69, "title": "Important Concepts", "group": "Advanced examples and principles", "text": "Important Concepts\n\n • Portals\n • Lenses\n • Sticky objects\n • Semantic zooming\n • Aggregation and abstraction", "img": "slides/03-069.webp"}, {"id": "03-070", "lecture": 3, "page": 70, "title": "Portals", "group": "Advanced examples and principles", "text": "Portals\n\n • Views onto another place in the world\n • Implemented typically as separate rectangular region\n • Zooming, panning, I/O all work independently in there\n • Can be used to create overviews or focus regions", "img": "slides/03-070.webp"}, {"id": "03-071", "lecture": 3, "page": 71, "title": "Sticky Objects", "group": "Advanced examples and principles", "text": "Sticky Objects\n\n • Objects in the world that do not respond to the basic zoom/pan interface physics\n\n  - E.g. coordinate display, counter, …\n • Objects are “stuck” to the display\n\n  - They never change position\n\n  - They never change size", "img": "slides/03-071.webp"}, {"id": "03-072", "lecture": 3, "page": 72, "title": "Eyes beat memory example: Cerebral", "group": "Advanced examples and principles", "text": "Eyes beat memory example: Cerebral\n\n • Small multiples: one graph instance per experimental condition\n\n  - same spatial layout\n\n  - color differently, by condition\n\n\n\n\n\n              [Cerebral: Visualizing Multiple Experimental Conditions on a Graph with Biological Context. Barsky, Munzner, Gardy, and Kincaid.\n             IEEE Trans. Visualization and Computer Graphics (Proc. InfoVis 2008) 14:6 (2008), 1253–1260.]", "img": "slides/03-072.webp"}, {"id": "03-073", "lecture": 3, "page": 73, "title": "Why not animation?", "group": "Advanced examples and principles", "text": "Why not animation?\n\n • disparate frames and regions: comparison difficult\n\n  - vs contiguous frames\n\n  - vs small region\n\n  - vs coherent motion of group\n\n\n • change blindness\n\n  - even major changes difficult to notice if mental buffer wiped\n\n\n • safe special case\n\n  - animated transitions", "img": "slides/03-073.webp"}, {"id": "03-074", "lecture": 3, "page": 74, "title": "Aggregation Example", "group": "Advanced examples and principles", "text": "Aggregation Example", "img": "slides/03-074.webp"}, {"id": "03-075", "lecture": 3, "page": 75, "title": "Aggregation Example", "group": "Advanced examples and principles", "text": "Aggregation Example", "img": "slides/03-075.webp"}, {"id": "03-076", "lecture": 3, "page": 76, "title": "Small Multiples and Large Singles", "group": "Advanced examples and principles", "text": "Small Multiples and Large Singles\n\n\n\n\n\n                   https://vimeo.com/86688905", "img": "slides/03-076.webp"}, {"id": "03-077", "lecture": 3, "page": 77, "title": "Another Route Map Example", "group": "Advanced examples and principles", "text": "Another Route Map Example", "img": "slides/03-077.webp"}, {"id": "03-078", "lecture": 3, "page": 78, "title": "A Really Useful Map: Two Focus Regions", "group": "Advanced examples and principles", "text": "A Really Useful Map: Two Focus Regions", "img": "slides/03-078.webp"}, {"id": "03-079", "lecture": 3, "page": 79, "title": "Superimpose Local Lens: Magic Lenses", "group": "Advanced examples and principles", "text": "Superimpose Local Lens: Magic Lenses\n\n\n\n\n\n                                Gaussian curvature pseudo-color lens\n                               Widget to read the value of the curvature", "img": "slides/03-079.webp"}], "terms": [{"id": "t1", "lecture": 0, "group": "Foundations", "term": "Information visualization", "definition": "Computer-supported visual representations of abstract data designed to help people understand and reason about information.", "explanation": "Information visualization converts non-physical information such as relationships, statistics and text into views that people can explore. The aim is to amplify human cognition: a person can spot patterns, anomalies and relationships that are hard to recognize in raw tables. The chosen representation must match the data and the task; a visually appealing display is not automatically informative.", "example": "An interactive map of links between Wikipedia articles makes a network easier to explore than a spreadsheet of connections.", "pages": [3, 4]}, {"id": "t2", "lecture": 0, "group": "Foundations", "term": "Scientific visualization", "definition": "Visualization of physical or simulated phenomena such as weather, medical scans and fluid flow.", "explanation": "Unlike information visualization, scientific visualization typically has a meaningful physical or spatial basis. The difference is not whether computers are used but whether the entities correspond to a physical phenomenon.", "example": "A weather forecast showing air pressure over a geographic region is scientific visualization.", "pages": [11]}, {"id": "t3", "lecture": 0, "group": "Foundations", "term": "Foundations versus tooling", "definition": "Theory informs design decisions; tools are the methods used to construct a visualization.", "explanation": "Foundations include design principles, possible techniques and their tradeoffs. Tooling involves software and code, such as Excel, Tableau, Observable Plot, JavaScript and D3. Knowing how to make a chart does not establish whether it is appropriate for a task.", "example": "A designer can make a pie chart in Excel but still needs perceptual principles to decide whether bars would make comparisons clearer.", "pages": [8, 9, 10]}, {"id": "t4", "lecture": 0, "group": "Visualization forms", "term": "Visualization zoo", "definition": "A collection of visualization forms for different structures and analytical tasks.", "explanation": "Different charts are suited to different data types: time series, statistical distributions, multivariate data, geographic data, hierarchies, networks and sets. Choosing the chart starts with understanding both the structure of the data and the task, not just the visual appearance.", "example": "A time-series chart works for changing temperature; a node-link diagram is better suited to social connections.", "pages": [11, 13, 15, 17, 19, 21, 23, 25]}, {"id": "t5", "lecture": 0, "group": "Visualization forms", "term": "Time-series data", "definition": "Measurements or events that are ordered in time.", "explanation": "The time axis allows trends, change points, fluctuations and comparisons between periods to be seen. Multiple series can create clutter, which motivates small multiples or careful encoding.", "example": "A line chart of monthly electricity use.", "pages": [12, 13]}, {"id": "t6", "lecture": 0, "group": "Visualization forms", "term": "Index chart", "definition": "A time-series chart that compares relative change from a common reference point.", "explanation": "Series are normalized to a chosen reference date, making relative growth comparable despite different original units or baselines. It does not show absolute differences in value.", "example": "Comparing the percentage growth of two stocks after January.", "pages": [13]}, {"id": "t7", "lecture": 0, "group": "Visualization forms", "term": "Stacked graph", "definition": "A plot that stacks several data series so their combined total is represented by the outer boundary.", "explanation": "It is useful for composition and total trends, but middle layers have shifting baselines and are difficult to compare precisely.", "example": "Unemployment counts stacked by industry over time.", "pages": [13]}, {"id": "t8", "lecture": 0, "group": "Visualization forms", "term": "Small multiples", "definition": "A collection of similarly scaled charts placed side by side for comparison.", "explanation": "Repeating a consistent visual design separates groups while making their differences easy to compare. The shared axes and alignment are important for fair comparison.", "example": "One unemployment trend chart for every industry.", "pages": [13, 28]}, {"id": "t9", "lecture": 0, "group": "Visualization forms", "term": "Horizon graph", "definition": "A compressed time-series chart that folds magnitude bands into a limited vertical space.", "explanation": "Banding and colours make it possible to inspect many dense time series, but the encoding requires a legend and practice.", "example": "A dashboard showing many cities’ temperature histories in compact rows.", "pages": [13]}, {"id": "t10", "lecture": 0, "group": "Visualization forms", "term": "Scatterplot", "definition": "A visualization where points encode two quantitative attributes using x and y position.", "explanation": "The common position scales help reveal relationships, clusters and outliers. Further attributes may be encoded with colour or size, provided the viewer can distinguish them.", "example": "Cars plotted by weight on the x-axis and horsepower on the y-axis.", "pages": [15, 34]}, {"id": "t11", "lecture": 0, "group": "Visualization forms", "term": "Scatterplot matrix", "definition": "A grid of scatterplots showing pairwise relationships among many attributes.", "explanation": "Each pair of variables is plotted in its own panel, which supports multivariate exploration. Interaction such as brushing and linking helps track the same items across panels.", "example": "Comparing car horsepower, weight, acceleration and displacement pairwise.", "pages": [15]}, {"id": "t12", "lecture": 0, "group": "Visualization forms", "term": "Parallel coordinates", "definition": "A multivariate technique that represents each item as a line crossing several parallel attribute axes.", "explanation": "Each axis corresponds to a variable and the crossing position is that item’s value. It can reveal groups and relationships across many dimensions, but many overlapping lines produce clutter.", "example": "Each car appears as a line across cylinders, weight, horsepower and MPG axes.", "pages": [15]}, {"id": "t13", "lecture": 0, "group": "Visualization forms", "term": "Node-link diagram", "definition": "A representation of a graph using points for nodes and lines for links.", "explanation": "It emphasizes the relationships and paths between entities. It can become visually cluttered for large dense networks.", "example": "A diagram connecting classmates who collaborate on projects.", "pages": [17, 19]}, {"id": "t14", "lecture": 0, "group": "Visualization forms", "term": "Adjacency matrix", "definition": "A grid representation of network connections, with rows and columns representing nodes.", "explanation": "Marked cells indicate links. Matrices scale well for dense networks and cluster patterns, but tracing a long path is less direct than in node-link layouts.", "example": "A grid showing which departments exchange data.", "pages": [19]}, {"id": "t15", "lecture": 0, "group": "Visualization forms", "term": "Arc diagram", "definition": "A network visualization arranging nodes in a line and drawing edges as arcs.", "explanation": "The ordering of nodes affects which relationship patterns become visible. It can expose connection patterns but dense arcs can overlap.", "example": "Connections among characters in a novel, arranged by appearance order.", "pages": [19]}, {"id": "t16", "lecture": 0, "group": "Visualization forms", "term": "Sankey diagram", "definition": "A flow diagram in which band widths encode quantities moving between categories or stages.", "explanation": "The diagram explains flow and relative magnitude between stages. Interpretation requires consistent quantities and clear source/target labels.", "example": "An energy-flow diagram showing electricity generated and consumed.", "pages": [19]}, {"id": "t17", "lecture": 0, "group": "Visualization forms", "term": "Treemap", "definition": "A space-filling hierarchy view using nested rectangles whose area represents magnitude.", "explanation": "Treemaps make efficient use of display space for comparing parts of a hierarchy but are less suitable when precise comparison across differently shaped rectangles is required.", "example": "Disk-space folders as nested rectangles sized by file size.", "pages": [17]}, {"id": "t18", "lecture": 0, "group": "Visualization forms", "term": "Set-based visualization", "definition": "A visualization of category memberships and overlaps between sets.", "explanation": "Set relationships can be encoded through parallel sets, mosaics or other approaches. The important distinction is between set membership and continuous quantitative measurement.", "example": "Customers grouped by which of several subscription plans they use.", "pages": [20, 21]}, {"id": "t19", "lecture": 0, "group": "Visualization forms", "term": "Mosaic chart", "definition": "An area-partitioned chart for categorical distributions and relationships.", "explanation": "Rectangles are divided into categories, with areas reflecting proportions; comparing irregular areas can be difficult.", "example": "A mosaic showing clothing size by region.", "pages": [21]}, {"id": "t20", "lecture": 0, "group": "Visualization forms", "term": "Parallel sets", "definition": "A technique that connects categorical groups using bands whose width expresses frequency.", "explanation": "It helps follow how a population is divided across multiple categorical variables, but a large number of categories can create clutter.", "example": "A view linking passenger classes, sex and survival categories.", "pages": [21]}, {"id": "t21", "lecture": 0, "group": "Visualization forms", "term": "Jittering", "definition": "Adding small visual offsets to overlapping points to reveal their density.", "explanation": "Overlapping dots can hide multiple observations. Jittering separates them visually but changes the exact displayed location, so the displacement should not be mistaken for actual data.", "example": "A plot of satisfaction scores 1–5 with many respondents at each score.", "pages": [21]}, {"id": "t22", "lecture": 0, "group": "Visualization forms", "term": "Choropleth map", "definition": "A map whose geographic regions are coloured according to an attribute.", "explanation": "It is well suited to rates or normalized values by region. Raw totals can be misleading because larger or more populated regions dominate interpretation.", "example": "A map shading counties by percentage of residents who cycle to work.", "pages": [23]}, {"id": "t23", "lecture": 0, "group": "Visualization forms", "term": "Graduated symbol map", "definition": "A map using variable-sized symbols at locations to encode magnitude.", "explanation": "Symbols can show counts without implying the whole geographic area has the same value, though overlapping symbols and area perception can complicate comparisons.", "example": "Circles sized by annual passengers at different airports.", "pages": [23]}, {"id": "t24", "lecture": 0, "group": "Visualization forms", "term": "Dorling cartogram", "definition": "A geographic representation that replaces regions with circles sized according to a numeric value.", "explanation": "Preserving approximate spatial relationships while changing area emphasizes the measured attribute rather than literal geography. The map becomes less geographically precise.", "example": "Countries represented by circles sized by population.", "pages": [23]}, {"id": "t25", "lecture": 0, "group": "Visualization forms", "term": "Glyph", "definition": "A compact mark whose internal visual features encode several data attributes.", "explanation": "Glyphs allow multiple variables to be represented by one object. They must avoid too many hard-to-interpret channels and should be used consistently.", "example": "A weather icon combining temperature, wind and precipitation information.", "pages": [25]}, {"id": "t26", "lecture": 0, "group": "Visualization forms", "term": "Chernoff faces", "definition": "Glyphs that encode multivariate data using facial features.", "explanation": "The approach uses face shape, eyes or mouth as visual channels, but viewers attach unequal perceptual importance to different features, which can distort quantitative judgment.", "example": "Comparing several cities using deliberately stylized face glyphs.", "pages": [25]}, {"id": "t27", "lecture": 0, "group": "Visualization design", "term": "Focus + context", "definition": "A visualization technique that emphasizes one area while keeping surrounding information visible.", "explanation": "It helps users inspect details without losing their understanding of where those details sit in the larger structure. Distortion may complicate precise comparison of regions.", "example": "A fisheye timeline enlarges the selected week while keeping other weeks visible.", "pages": [27]}, {"id": "t28", "lecture": 0, "group": "Visualization design", "term": "Overview + detail", "definition": "Two views that show the whole dataset and a close-up of a selected part.", "explanation": "The overview helps navigation and the detail view supports analysis. Coordinating both prevents users from getting lost, but the views compete for limited screen space.", "example": "A map overview with a separate zoomed-in panel for one city.", "pages": [28]}, {"id": "t29", "lecture": 0, "group": "Visualization design", "term": "Semantic zoom", "definition": "Changing the kind or amount of information shown as zoom level changes.", "explanation": "Instead of merely scaling everything bigger, the display switches representation as screen space becomes available. This maintains legibility and reveals appropriate details.", "example": "A city map that reveals street names only when zoomed in.", "pages": [29]}, {"id": "t30", "lecture": 0, "group": "Visualization design", "term": "Coordinated multiple views", "definition": "Several linked visualizations that show complementary views of the same data.", "explanation": "A selection or filter in one view can update the others, allowing complementary perspectives without trying to encode every variable in one chart.", "example": "Selecting a car in one scatterplot highlights it across other charts.", "pages": [30]}, {"id": "t31", "lecture": 0, "group": "Visualization design", "term": "Truncated axis", "definition": "A chart axis that starts above its natural baseline, potentially exaggerating differences.", "explanation": "Truncation is especially misleading for bar charts where length encodes magnitude. For some line charts a restricted range can be useful if explicitly labelled and justified.", "example": "A bar chart starting at 95 instead of zero makes 98 and 100 look very different.", "pages": [45]}, {"id": "t32", "lecture": 0, "group": "Visualization design", "term": "Misleading 3D effects", "definition": "Unnecessary perspective or depth that changes apparent sizes and makes values harder to compare.", "explanation": "The third dimension may introduce foreshortening and occlusion when the data has only two meaningful dimensions. 3D should be used only when it adds relevant information.", "example": "A tilted 3D pie chart makes the front slice look larger.", "pages": [47]}, {"id": "t33", "lecture": 0, "group": "Visualization design", "term": "Chart junk and clutter", "definition": "Visual decoration or unnecessary elements that distract from the data and task.", "explanation": "Excessive colour, labels, 3D, chart borders and unrelated effects can reduce the ability to locate important patterns. Removing material must not remove context or necessary evidence.", "example": "A sales chart with patterned backgrounds and many unrelated icons.", "pages": [42, 44, 49]}, {"id": "t34", "lecture": 1, "group": "Framework and purpose", "term": "Information visualization definition", "definition": "A computer-based visual representation of a dataset designed to help people carry out tasks more effectively.", "explanation": "In Munzner’s account, visualization augments human reasoning rather than replacing every decision with an algorithm. It is useful when a question is uncertain, the analyst needs exploration, or surprising patterns matter.", "example": "A journalist explores voting results for outliers before writing the story.", "pages": [4, 6]}, {"id": "t35", "lecture": 1, "group": "Framework and purpose", "term": "Visualization versus automation", "definition": "Choosing human-led visual exploration when a fully automated answer is unavailable or not trustworthy.", "explanation": "If a well-specified computational solution can reliably deliver the needed result, visualization may not be necessary. Interactive graphics become valuable for ill-defined problems that require judgment and exploration.", "example": "An analyst checks a plot for unexpected customer segments rather than relying only on an average.", "pages": [6]}, {"id": "t36", "lecture": 1, "group": "Framework and purpose", "term": "Anscombe’s quartet", "definition": "Four datasets with matching summary statistics but strikingly different plotted distributions.", "explanation": "Identical means, variances and correlations do not guarantee that data has the same structure. Plotting exposes nonlinear patterns and outliers that summary statistics can hide. Both calculation and visualization should be examined together.", "example": "Four scatterplots can show a linear trend, a curve, an outlier and a vertical cluster with similar summary statistics.", "pages": [7, 8]}, {"id": "t37", "lecture": 1, "group": "Framework and purpose", "term": "Preattentive processing", "definition": "Fast visual processing that can detect some differences before focused attention.", "explanation": "The visual system processes position, colour and some other cues in parallel. A visualization can exploit this to reveal standout marks, though not every combination of channels produces immediate popout.", "example": "A single red dot is noticed among many grey dots.", "pages": [9]}, {"id": "t38", "lecture": 1, "group": "Framework and purpose", "term": "External cognition", "definition": "Using an external representation to reduce how much information a person must remember mentally.", "explanation": "The graphic preserves positions and relationships on screen, allowing perception to do part of the work otherwise required of working memory. The visual representation still has limits from attention and screen space.", "example": "A map makes routes easier to compare than remembering a list of turns.", "pages": [9]}, {"id": "t39", "lecture": 1, "group": "Framework and purpose", "term": "Information density", "definition": "The amount of data communicated per unit of display space.", "explanation": "Very sparse layouts waste pixels, but dense layouts may increase clutter and make patterns hard to perceive. The aim is a balance appropriate to the task and audience.", "example": "A dashboard that shows all 100 labels at once may be less useful than a filterable compact chart.", "pages": [10]}, {"id": "t40", "lecture": 1, "group": "Framework and purpose", "term": "Domain situation", "definition": "The real-world setting, users and questions that motivate a visualization.", "explanation": "This is the Who level of Munzner’s model. A visualization that is effective for an expert exploring anomalies may fail for an audience reading a static summary.", "example": "A hospital clinician checking patient vital signs has different needs from a reader of a news infographic.", "pages": [11]}, {"id": "t41", "lecture": 1, "group": "Framework and purpose", "term": "Data abstraction", "definition": "A description of WHAT data is available, using general visualization terms.", "explanation": "The designer translates a domain-specific subject into items, attributes, dataset structures and attribute types. This prevents the design from relying only on subject-specific jargon.", "example": "A list of shops and their monthly revenue becomes a table with item=shop and quantitative attribute=revenue.", "pages": [11, 12]}, {"id": "t42", "lecture": 1, "group": "Framework and purpose", "term": "Task abstraction", "definition": "A description of WHY a user examines the data, expressed as an action and target.", "explanation": "Tasks include discovering trends, locating outliers, comparing items or browsing topology. Different tasks require different encodings and interactions even when the same dataset is used.", "example": "For shop sales, the task might be to locate the lowest-revenue month rather than to compare stores.", "pages": [11, 12, 24]}, {"id": "t43", "lecture": 1, "group": "Framework and purpose", "term": "Technique (idiom)", "definition": "The visual encoding and interaction choices that determine HOW data is displayed and explored.", "explanation": "An idiom combines marks, channels, layout and interaction. A suitable idiom depends on the data and task already identified; it should not be selected merely because it looks impressive.", "example": "A scatterplot with brushing is a technique for exploring relationships and selected points.", "pages": [11, 12]}, {"id": "t44", "lecture": 1, "group": "Framework and purpose", "term": "Algorithm level", "definition": "The computational implementation that makes a visualization efficient enough to use.", "explanation": "The last level of the nested model addresses computation, rendering, scale and response time. A clear design may still fail if interactive filtering is too slow.", "example": "Efficiently updating thousands of points when a range slider changes.", "pages": [11]}, {"id": "t45", "lecture": 1, "group": "Framework and purpose", "term": "What–Why–How framework", "definition": "A systematic way to analyze visualization design through data, tasks and techniques.", "explanation": "What identifies the data; Why identifies the user’s task; How identifies visual encoding and interaction. The three questions should remain connected and are often revisited iteratively. The broader nested model also begins with Who.", "example": "For city pollution data, What=measurements by site; Why=find extreme values; How=linked map and line chart.", "pages": [11, 12]}, {"id": "t46", "lecture": 1, "group": "What · data", "term": "Table dataset", "definition": "Data represented as items in rows and attributes in columns.", "explanation": "Each cell stores the value of one attribute for one item. A table may contain categorical, ordered or quantitative attributes, and its structure helps identify possible encodings.", "example": "Each student is a row; exam score and programme are columns.", "pages": [15, 16, 17]}, {"id": "t47", "lecture": 1, "group": "What · data", "term": "Network dataset", "definition": "A dataset with nodes representing items and links representing relationships.", "explanation": "Network analysis often examines connections, paths, communities or centrality, rather than only comparing attribute values. Networks can be visualized using node-link layouts or matrices.", "example": "A friendship network with students as nodes and friendships as edges.", "pages": [15, 16]}, {"id": "t48", "lecture": 1, "group": "What · data", "term": "Field dataset", "definition": "Data sampled across continuous space, often on a grid.", "explanation": "Fields represent values that exist across space, such as temperature or medical scan intensity. Positions and sampling are essential to interpretation.", "example": "Temperature recorded on a grid across a city.", "pages": [15, 16, 18]}, {"id": "t49", "lecture": 1, "group": "What · data", "term": "Geometry dataset", "definition": "Spatial shapes and positions that represent real spatial objects.", "explanation": "Geometry-based data emphasizes position and form. It is distinct from an abstract network, even if both may be drawn with points and lines.", "example": "The outlines of buildings on a digital map.", "pages": [15, 16]}, {"id": "t50", "lecture": 1, "group": "What · data", "term": "Item", "definition": "One discrete entity in a dataset.", "explanation": "A row of a table or a node in a network commonly represents one item. Identifying the items is essential before selecting the visual encoding.", "example": "One car in a database of 500 cars.", "pages": [17, 18]}, {"id": "t51", "lecture": 1, "group": "What · data", "term": "Attribute", "definition": "A recorded, observed or measured property of an item.", "explanation": "Also called a variable or dimension. Different attribute types support different mathematical operations and visual channels.", "example": "A car’s weight, brand and horsepower are attributes.", "pages": [17, 18]}, {"id": "t52", "lecture": 1, "group": "What · data", "term": "Link", "definition": "A relation between items, usually in a network.", "explanation": "Links express structure such as friendship, citation or transport connectivity. They are not simply quantitative attributes belonging to isolated items.", "example": "A line showing that one webpage links to another.", "pages": [18]}, {"id": "t53", "lecture": 1, "group": "What · data", "term": "Position", "definition": "Spatial coordinates locating an item in two or three dimensions.", "explanation": "Position can be a meaningful property of spatial data, such as latitude and longitude, not merely a visual layout decision.", "example": "A bus stop at a specific GPS coordinate.", "pages": [18]}, {"id": "t54", "lecture": 1, "group": "What · data", "term": "Grid", "definition": "A spatial structure specifying how continuous data is sampled into related cells.", "explanation": "The grid defines positions and adjacency between cells, helping the system interpret sampled field data.", "example": "Pixels in a satellite temperature image.", "pages": [18]}, {"id": "t55", "lecture": 1, "group": "What · data", "term": "Categorical (nominal) attribute", "definition": "Values that indicate groups without a natural order.", "explanation": "Categories can be compared for equality or frequency, not sorted by numerical magnitude. Different hues or shapes can encode identity.", "example": "Fruit type: apple, banana or pear.", "pages": [19]}, {"id": "t56", "lecture": 1, "group": "What · data", "term": "Ordinal attribute", "definition": "Values with a meaningful order but without meaningful arithmetic distances.", "explanation": "Ranks can be arranged higher or lower but the difference between neighbouring levels need not be equal.", "example": "Customer satisfaction: poor, fair, good, excellent.", "pages": [19]}, {"id": "t57", "lecture": 1, "group": "What · data", "term": "Quantitative attribute", "definition": "Numeric data whose values support meaningful arithmetic.", "explanation": "Counts and measurements can often be compared by magnitude and represented through position or length. Distinguish raw numerical identifiers from genuine magnitudes.", "example": "Temperature or number of books sold.", "pages": [19]}, {"id": "t58", "lecture": 1, "group": "What · data", "term": "Cardinality", "definition": "The number of distinct values an attribute can take.", "explanation": "Low-cardinality attributes can often be displayed with distinct categories; high-cardinality attributes may need continuous scales or filtering. Cardinality and range are not the same concept.", "example": "T-shirt size has relatively few distinct values; a unique customer ID has many.", "pages": [20, 21, 22]}, {"id": "t59", "lecture": 1, "group": "What · data", "term": "Range", "definition": "The extent between the minimum and maximum values of an attribute.", "explanation": "Range describes spread in values, not how many unique values occur. A chart scale should be chosen with this domain in mind.", "example": "A dataset with ages from 18 to 82 has a range of 64 years.", "pages": [20]}, {"id": "t60", "lecture": 1, "group": "What · data", "term": "Static versus dynamic data", "definition": "Static datasets remain fixed during viewing; dynamic datasets change over time.", "explanation": "Dynamic data may require live updates, temporal interaction or careful preservation of past states. The difference is about data availability rather than whether the chart itself animates.", "example": "A historical census table is static; a live stock-price feed is dynamic.", "pages": [16]}, {"id": "t61", "lecture": 1, "group": "Why · tasks", "term": "Action–target pair", "definition": "A task description combining an analytical action with the part of the data it concerns.", "explanation": "Separating an action from its target makes vague requirements specific. The action may be to compare and the target may be trends across time series.", "example": "“Find the highest monthly sales value” has action=locate and target=extreme value.", "pages": [24, 34]}, {"id": "t62", "lecture": 1, "group": "Why · tasks", "term": "Analyze · consume", "definition": "Examining a visualization to discover, present or enjoy information.", "explanation": "Analysis consumption can be exploratory, explanatory or informal. A visualization should be designed for which of these activities matters.", "example": "Exploring store sales to discover an unexpected dip.", "pages": [25, 26]}, {"id": "t63", "lecture": 1, "group": "Why · tasks", "term": "Analyze · produce", "definition": "Creating derived or annotated information while exploring the data.", "explanation": "Production can include notes, records and transformations. It differs from simply viewing the original data.", "example": "Calculating the difference between revenue and costs to create a new attribute.", "pages": [26, 27]}, {"id": "t64", "lecture": 1, "group": "Why · tasks", "term": "Derive", "definition": "Transforming existing attributes into new data to simplify or extend analysis.", "explanation": "Data transformations can reveal relationships that are hard to see from raw measures. They must be defined clearly to avoid misleading calculations.", "example": "Deriving trade balance as exports minus imports.", "pages": [27]}, {"id": "t65", "lecture": 1, "group": "Why · tasks", "term": "Lookup, browse, locate, explore", "definition": "Four search tasks classified by whether target identity and location are known.", "explanation": "Lookup means known target and known location; browse means unknown target in a known location; locate means known target with unknown location; explore means neither is known. These different tasks suggest different navigation tools.", "example": "Looking for a known point on a known map location is lookup, while scanning for interesting anomalies is explore.", "pages": [28]}, {"id": "t66", "lecture": 1, "group": "Why · tasks", "term": "Identify, compare, summarize", "definition": "Three query tasks applied to one item, multiple items or a full set.", "explanation": "Identify examines a single target’s characteristics, compare examines several targets, and summarize characterizes the full group. These should not be confused with search, which determines what to locate.", "example": "Identify one car’s horsepower; compare two cars; summarize horsepower across all cars.", "pages": [29]}, {"id": "t67", "lecture": 1, "group": "Why · tasks", "term": "Trends, outliers and features", "definition": "Analytical targets describing broad patterns, exceptional observations and relevant structures.", "explanation": "Trends show direction or change; outliers depart from the dominant pattern; features may include peaks, clusters and other structures. A visualization should make the task-relevant target perceptible.", "example": "A sales plot reveals rising demand and one unexpected holiday spike.", "pages": [30, 31]}, {"id": "t68", "lecture": 1, "group": "Why · tasks", "term": "Topology", "definition": "The connection structure of a network.", "explanation": "Topology involves which nodes connect, possible paths and overall arrangement, independent of literal map positions.", "example": "Finding how two people are connected through friends-of-friends.", "pages": [31, 32]}, {"id": "t69", "lecture": 2, "group": "Marks and channels", "term": "Visual encoding", "definition": "Mapping data attributes to visible marks and visual channels.", "explanation": "The designer selects points, lines or areas and controls their appearance using position, colour, size, shape or other channels. Effectiveness depends on the attribute type and the task being performed.", "example": "A scatterplot uses points, with horizontal position showing income and vertical position showing spending.", "pages": [5, 7]}, {"id": "t70", "lecture": 2, "group": "Marks and channels", "term": "Marks", "definition": "Geometric primitives—points, lines and areas—that represent items or structures.", "explanation": "A mark supplies basic geometry; channels determine its appearance. Different marks already use some visual dimensions and therefore cannot always encode additional attributes independently.", "example": "A dot for each city in a scatterplot.", "pages": [6]}, {"id": "t71", "lecture": 2, "group": "Marks and channels", "term": "Channels", "definition": "Visual attributes that control a mark’s appearance or location.", "explanation": "Common channels are x/y position, colour hue, luminance, saturation, size, length and shape. Channels can be combined, but their perceptual interactions mean more channels are not always clearer.", "example": "Use blue and orange to distinguish two categories of dots.", "pages": [6, 8]}, {"id": "t72", "lecture": 2, "group": "Marks and channels", "term": "Redundant encoding", "definition": "Representing the same data attribute with more than one visual channel.", "explanation": "Redundancy can improve recognition and accessibility. It must be done consistently and should not imply unrelated relationships.", "example": "Use both triangle shape and orange colour to identify a group.", "pages": [6]}, {"id": "t73", "lecture": 2, "group": "Marks and channels", "term": "Magnitude channels", "definition": "Channels used for ordered or quantitative differences.", "explanation": "Position on a common scale is usually highly effective for comparing numerical values. Length, area, luminance and other channels have progressively different perceptual accuracy.", "example": "Compare prices using aligned bars rather than differently sized icons.", "pages": [8, 16, 34]}, {"id": "t74", "lecture": 2, "group": "Marks and channels", "term": "Identity channels", "definition": "Channels used to distinguish categories without implying order.", "explanation": "Spatial regions, hue, shape and motion can distinguish groups. Category colours should be separable and not accidentally imply a numeric ranking.", "example": "Use distinct hues to represent transport modes.", "pages": [8, 34]}, {"id": "t75", "lecture": 2, "group": "Marks and channels", "term": "Effectiveness principle", "definition": "Use the most perceptually effective channels for the most important attributes.", "explanation": "The ranking of visual channels guides allocation: crucial quantitative values deserve easy-to-compare encodings. The best channel still depends on the actual task and context.", "example": "Put sales on a shared y-axis rather than expressing it only through circle area.", "pages": [10, 34]}, {"id": "t76", "lecture": 2, "group": "Marks and channels", "term": "Expressiveness principle", "definition": "Encode exactly the information that exists in the data, without implying unsupported information.", "explanation": "A visual mapping is invalid if it introduces a false order or masks essential categories. The selected channel should fit the attribute’s type.", "example": "A nominal product category should not be depicted with a continuous light-to-dark scale implying more or less.", "pages": [10]}, {"id": "t77", "lecture": 2, "group": "Marks and channels", "term": "Accuracy of visual channels", "definition": "How precisely viewers can judge the data values encoded by a channel.", "explanation": "Measurements along aligned scales are generally easier to compare accurately than angles, areas or colour saturation. The ranking is based on perception studies rather than aesthetics.", "example": "Two bars sharing a baseline are easier to compare than two bubbles of slightly different area.", "pages": [12, 15, 16]}, {"id": "t78", "lecture": 2, "group": "Marks and channels", "term": "Discriminability", "definition": "How many distinct levels of a visual channel people can reliably tell apart.", "explanation": "A channel may work for a few values but fail for dozens. Small differences in line width or saturation may not be distinguishable in ordinary viewing conditions.", "example": "Three clearly different line widths may be readable, but 20 subtly varying widths are not.", "pages": [12, 18, 25]}, {"id": "t79", "lecture": 2, "group": "Marks and channels", "term": "Separability", "definition": "How independently people can perceive two visual channels that encode different variables.", "explanation": "Channels may interfere, so a viewer can struggle to interpret one without being influenced by the other. This is a design constraint for multivariate glyphs.", "example": "A glyph’s perceived size might change with the shape of its outline.", "pages": [12, 48]}, {"id": "t80", "lecture": 2, "group": "Marks and channels", "term": "Popout", "definition": "Fast preattentive detection of one visually distinct item among distractors.", "explanation": "A strong difference in a suitable channel may cause an item to attract attention without serial search. Not every paired channel supports popout.", "example": "One red marker stands out among 100 grey markers.", "pages": [12, 49, 50, 51]}, {"id": "t81", "lecture": 2, "group": "Perception", "term": "Stevens’s power law", "definition": "A psychophysical model relating physical stimulus magnitude and perceived sensation.", "explanation": "The relationship is nonlinear and varies across senses and stimulus dimensions, so apparent size is not a straightforward substitute for physical quantity.", "example": "A circle that doubles in area may not appear “twice as large” to viewers.", "pages": [13]}, {"id": "t82", "lecture": 2, "group": "Perception", "term": "Relative versus absolute judgment", "definition": "People generally estimate differences more accurately when values can be directly compared against a shared reference.", "explanation": "A common, aligned axis reduces mental comparison effort. Unaligned baselines force users to mentally estimate gaps.", "example": "A bar chart with all bars starting at zero is easier for comparison than bars floating at different heights.", "pages": [15]}, {"id": "t83", "lecture": 2, "group": "Perception", "term": "Cleveland and McGill ranking", "definition": "Experimental ordering of basic graphical perception tasks by average quantitative judgment accuracy.", "explanation": "Position on a common scale generally ranks highest; unaligned position, length/angle, area, volume and saturation rank lower. Results guide design decisions but are not a universal guarantee.", "example": "Choose aligned dots for exact comparisons rather than volume-scaled 3D balls.", "pages": [16, 17]}, {"id": "t84", "lecture": 2, "group": "Perception", "term": "Just noticeable difference (JND)", "definition": "The smallest change in a stimulus that a person can reliably detect.", "explanation": "JND limits how many perceptually distinct steps a visual channel can convey. A change below this threshold may not be noticed.", "example": "Two nearly identical grey shades can be mistaken for the same value.", "pages": [18, 19]}, {"id": "t85", "lecture": 2, "group": "Perception", "term": "Weber’s law", "definition": "An approximate relationship in which the detectable change is a constant proportion of the starting stimulus.", "explanation": "The law explains why a fixed difference is easier to notice at lower than higher intensities in some contexts. The slides warn it is not universally valid.", "example": "A 1 cm length change is easier to notice on a 5 cm line than on a 1 m line.", "pages": [18]}, {"id": "t86", "lecture": 2, "group": "Colour", "term": "Hue", "definition": "The colour family, such as blue, orange or green.", "explanation": "Hue is useful for categorical identity. It generally should not by itself imply a numeric sequence or magnitude.", "example": "Different route categories in a metro map each receive distinct hues.", "pages": [27, 31]}, {"id": "t87", "lecture": 2, "group": "Colour", "term": "Saturation", "definition": "How vivid or muted a colour looks.", "explanation": "Saturation is sometimes used as an ordered magnitude channel, but many fine steps are difficult to discriminate and displayed area influences appearance.", "example": "A darker or more intense red indicates stronger confidence only when explained by a scale.", "pages": [27, 31, 34]}, {"id": "t88", "lecture": 2, "group": "Colour", "term": "Luminance", "definition": "The perceived brightness dimension of a colour.", "explanation": "Luminance can encode ordered differences, but the relationship between digital RGB numbers and perceived brightness is not linear. Contrast matters for accessibility.", "example": "A light-to-dark blue scale used for increasing measured values.", "pages": [27, 31]}, {"id": "t89", "lecture": 2, "group": "Colour", "term": "RGB colour space", "definition": "A computational representation of colour through red, green and blue components.", "explanation": "RGB matches many display technologies but equal numerical differences are not perceptually equal. This makes it insufficient by itself for designing reliable colour scales.", "example": "Two colour swatches differing by the same RGB amount may not look equally different.", "pages": [28, 29, 30]}, {"id": "t90", "lecture": 2, "group": "Colour", "term": "HSL and HSV", "definition": "Colour models that separate hue from saturation and lightness/value.", "explanation": "They are often more intuitive for adjusting hue and brightness than raw RGB. However equal steps are still not guaranteed to look perceptually uniform.", "example": "A designer selects a single hue then adjusts lightness for a sequential scale.", "pages": [31]}, {"id": "t91", "lecture": 2, "group": "Colour", "term": "Sequential colour scale", "definition": "An ordered progression of colours for increasing or decreasing quantitative values.", "explanation": "Sequential ramps usually vary lightness so higher data values appear systematically different. A legend and sensible domain are necessary.", "example": "A heat map changes from pale blue to dark blue as pollution levels rise.", "pages": [32]}, {"id": "t92", "lecture": 2, "group": "Colour", "term": "Diverging colour scale", "definition": "Two colour sequences diverging from a meaningful midpoint.", "explanation": "The neutral centre represents a reference such as zero, average or target. Values on both sides are encoded with contrasting directions or hues.", "example": "A map displays losses in orange and gains in blue around zero.", "pages": [32]}, {"id": "t93", "lecture": 2, "group": "Colour", "term": "Categorical palette", "definition": "A set of visually distinct colours for nominal categories.", "explanation": "Because categories have no order, the palette should not imply a single numeric progression. Too many hues become hard to differentiate reliably.", "example": "Different sports shown as distinct hues in a legend.", "pages": [33, 38]}, {"id": "t94", "lecture": 2, "group": "Colour", "term": "Rainbow colour map", "definition": "A hue-based gradient sweeping through many colours.", "explanation": "Rainbow gradients are often poor defaults for ordered values because perceived steps are uneven and hue boundaries can create artificial visual contrasts. Other palettes may better preserve order and accessibility.", "example": "A weather heat map can look as if there are abrupt boundaries where none exist.", "pages": [41]}, {"id": "t95", "lecture": 2, "group": "Colour", "term": "Categorical colour limit", "definition": "The perceptual limit to how many categories can be distinguished by hue alone.", "explanation": "When there are many categories, additional channels, filtering or grouping may be more effective than adding more similar hues.", "example": "A legend with 40 nearly similar category colours is difficult to use.", "pages": [38, 39, 40]}, {"id": "t96", "lecture": 2, "group": "Other channels", "term": "Glyph encoding", "definition": "Using a composite symbol to encode several attributes at once.", "explanation": "The glyph may combine shape, orientation, size or internal marks. The difficulty is that perceptual interactions can reduce how independently values are understood.", "example": "A wind barb encodes wind direction and speed.", "pages": [46, 47]}, {"id": "t97", "lecture": 2, "group": "Other channels", "term": "Integral channels", "definition": "Visual dimensions whose combination is perceived as a whole rather than independently.", "explanation": "With integral dimensions, changes in one variable can influence how another is judged. A designer must evaluate whether independent reading is actually possible.", "example": "Height and width of a rectangle can combine into a single perceived overall size.", "pages": [48]}, {"id": "t98", "lecture": 2, "group": "Other channels", "term": "Grouping by containment", "definition": "Placing related items inside a common enclosing region.", "explanation": "Containment can visually communicate membership without drawing a separate link to each member. Boundaries must be clear and not imply overlapping memberships accidentally.", "example": "A translucent box groups related nodes on a diagram.", "pages": [52, 53, 54, 55]}, {"id": "t99", "lecture": 2, "group": "Other channels", "term": "Grouping by proximity", "definition": "Making nearby items appear as belonging together.", "explanation": "Spatial nearness can create a perceived group even without an explicit boundary. It can conflict with data-driven position encodings.", "example": "Closely spaced points seem part of one cluster.", "pages": [50, 52]}, {"id": "t100", "lecture": 2, "group": "Other channels", "term": "One-dimensional colormap", "definition": "A function mapping one value to a colour in a specified colour scale.", "explanation": "The input value and colour mapping must be clear and compatible with the data: sequential, diverging or categorical.", "example": "A map legend transforms temperature values into blue-to-red colours.", "pages": [56, 57]}, {"id": "t101", "lecture": 2, "group": "Other channels", "term": "Length versus area encoding", "definition": "Using one-dimensional length or two-dimensional area to represent magnitude.", "explanation": "Length along an aligned scale is generally easier to compare precisely than area. When area is used, dimensions must be scaled so area, not radius or diameter, represents the value.", "example": "A circle for 100 items needs twice the area of a circle for 50, not twice the diameter.", "pages": [58]}, {"id": "t102", "lecture": 3, "group": "Manipulate", "term": "Manipulate", "definition": "Interaction techniques that change the viewer’s perspective, selection or view over time.", "explanation": "The slides organize manipulation into change, select and navigate. These interactions make exploration possible without changing the underlying meaning of the dataset.", "example": "A chart updates while a user drags a year slider.", "pages": [5, 7]}, {"id": "t103", "lecture": 3, "group": "Manipulate", "term": "Change over time", "definition": "Manipulation that updates the state or displayed time of a visualization.", "explanation": "Changing time reveals temporal differences without requiring every frame to be shown at once. Animation can support continuity but precise comparison may require static linked views.", "example": "A slider moves a map from 2010 to 2020.", "pages": [7]}, {"id": "t104", "lecture": 3, "group": "Manipulate", "term": "Select", "definition": "An interaction that identifies a subset of marks or values for further attention.", "explanation": "Selection distinguishes chosen items from others and may drive linked views or filters. Highlighting should not permanently obscure context.", "example": "Clicking one dot highlights the same item in other charts.", "pages": [7]}, {"id": "t105", "lecture": 3, "group": "Manipulate", "term": "Navigate", "definition": "Moving through the information space by panning, zooming or changing focus.", "explanation": "Navigation helps access large datasets when the display cannot show all detail at once. Users benefit from a map of how local and global views relate.", "example": "Panning across a large subway network diagram.", "pages": [7, 8]}, {"id": "t106", "lecture": 3, "group": "Manipulate", "term": "Scrolling as detail-only navigation", "definition": "Viewing a larger virtual display through a smaller scrolling window.", "explanation": "Scrolling is familiar but offers only one local focus and little overview. Large zoom factors make it hard to know how the visible region relates to the entire information space.", "example": "Scrolling around a large diagram without a minimap.", "pages": [8]}, {"id": "t107", "lecture": 3, "group": "Manipulate", "term": "Shneiderman’s visual information-seeking mantra", "definition": "Overview first, zoom and filter, then details on demand.", "explanation": "An overview gives orientation, zoom/filter narrows the search, and details provide close inspection when requested. It is a general strategy, not a requirement that every view use this exact order.", "example": "A product analytics dashboard starts with all regions, then lets the user select one and inspect transactions.", "pages": [9]}, {"id": "t108", "lecture": 3, "group": "Manipulate", "term": "Overview and detail", "definition": "Offering a summary view and a separate close-up view.", "explanation": "The two views can alternate over time or appear simultaneously in different areas. A simultaneous overview reduces the need for users to remember spatial context.", "example": "A large satellite image with a small overview map in the corner.", "pages": [10, 13]}, {"id": "t109", "lecture": 3, "group": "Manipulate", "term": "Zoom and replace", "definition": "Selecting a region and replacing the global overview with an enlarged local view.", "explanation": "This efficiently uses screen space but removes the original overview and can disorient users when they need to move elsewhere.", "example": "Clicking into a map region so it fills the entire screen.", "pages": [12]}, {"id": "t110", "lecture": 3, "group": "Manipulate", "term": "Tiled multilevel browser", "definition": "Several adjacent views showing overview, intermediate context and detailed area.", "explanation": "Linked navigation keeps the panels consistent, though using multiple panels requires careful allocation of screen space.", "example": "Three synchronized map panels at regional, city and street levels.", "pages": [14]}, {"id": "t111", "lecture": 3, "group": "Manipulate", "term": "Free zoom with multiple overlap", "definition": "Creating movable, overlapping detailed windows over the overview.", "explanation": "The layout is flexible, but managing many windows becomes a separate interaction burden.", "example": "Opening several magnified patches over a medical image.", "pages": [15]}, {"id": "t112", "lecture": 3, "group": "Manipulate", "term": "Drill-down", "definition": "Moving from an aggregate or broad view to a selected smaller subset or individual item.", "explanation": "Drill-down reveals detail when needed. A route back to the overview preserves context and prevents users getting trapped in detail.", "example": "Click a sales region to see sales per store.", "pages": [17]}, {"id": "t113", "lecture": 3, "group": "Manipulate", "term": "Panning", "definition": "Moving a viewing window across a larger information space without changing magnification.", "explanation": "Panning changes which part is visible while preserving zoom scale. It differs from zooming, which changes magnification.", "example": "Dragging a city map sideways.", "pages": [18, 19]}, {"id": "t114", "lecture": 3, "group": "Manipulate", "term": "Zooming", "definition": "Changing the magnification of the data view.", "explanation": "Geometric zoom enlarges the same representation, while semantic zoom can reveal different information. Zoom controls may need to coordinate with pan to retain context.", "example": "Pinch-to-zoom on a map.", "pages": [18, 20]}, {"id": "t115", "lecture": 3, "group": "Manipulate", "term": "Zoom-out, pan, zoom-in", "definition": "A navigation sequence for efficiently moving between distant focuses.", "explanation": "It can be easier to zoom out to regain context, pan toward a new target, then zoom in instead of panning at high magnification.", "example": "Move from one city district to another by first zooming out.", "pages": [21]}, {"id": "t116", "lecture": 3, "group": "Manipulate", "term": "Geometric zoom", "definition": "Magnifying the existing visual representation without changing its semantic content.", "explanation": "Labels and shapes become larger, but may not gain information. At some scales this wastes space or remains unreadable.", "example": "Magnifying the same plotted dots without adding more details.", "pages": [22]}, {"id": "t117", "lecture": 3, "group": "Manipulate", "term": "Semantic zoom", "definition": "Changing what is represented as available display space increases or decreases.", "explanation": "Semantic zoom supports legibility across scales by showing appropriate levels of detail. It must avoid surprising changes that break the user’s mental model.", "example": "At far zoom show a dot for a shop, closer zoom show its name and opening hours.", "pages": [22, 23]}, {"id": "t118", "lecture": 3, "group": "Manipulate", "term": "Facet", "definition": "Breaking a visual display into complementary views or layers to reduce complexity.", "explanation": "Faceting includes juxtaposing, partitioning and superimposing. The choice affects comparability, display space and clutter.", "example": "Show three related charts instead of overlaying everything into one plot.", "pages": [5, 26]}, {"id": "t119", "lecture": 3, "group": "Facet", "term": "Juxtapose", "definition": "Placing different views side by side for comparison.", "explanation": "Separate displays reduce overlapping marks and allow direct comparison with consistent scales. Coordination can preserve selected items across views.", "example": "Small-multiple charts for different cities arranged in a grid.", "pages": [26, 27, 28]}, {"id": "t120", "lecture": 3, "group": "Facet", "term": "Brushing and linking", "definition": "Selecting data in one view and highlighting corresponding records in another view.", "explanation": "The coordinated highlight connects multiple representations of the same underlying items, allowing cross-view comparison without repeating complex labels.", "example": "Selecting tall basketball players in one scatterplot highlights them in the salary chart.", "pages": [27]}, {"id": "t121", "lecture": 3, "group": "Facet", "term": "Small multiples", "definition": "Repeated charts with a consistent scale and encoding for many groups.", "explanation": "They separate complexity and enable comparison through spatial arrangement rather than overplotting. Shared axes, ordering and labels are vital for interpreting differences.", "example": "One chart for each industry’s unemployment trend.", "pages": [28, 29, 30, 31]}, {"id": "t122", "lecture": 3, "group": "Facet", "term": "Partition", "definition": "Splitting a dataset into distinct subsets or visual regions.", "explanation": "Partitioning makes subgroup patterns accessible but can hide cross-group relationships if scales and layouts differ.", "example": "A separate panel for each year of measurements.", "pages": [26, 36]}, {"id": "t123", "lecture": 3, "group": "Facet", "term": "Superimpose", "definition": "Overlaying several data layers in one shared coordinate system.", "explanation": "Superimposing can show spatial relationships directly but overplotting can obscure details, so opacity, separation and order matter.", "example": "Roads, rivers and public transport routes on one map.", "pages": [26, 33, 35]}, {"id": "t124", "lecture": 3, "group": "Facet", "term": "Trellis plot", "definition": "A grid of similarly designed views for groups defined by categorical attributes.", "explanation": "Each panel shares the main variables and often a common scale; arranging panels meaningfully can make comparisons easier.", "example": "Separate panels for crop yields by test location and year.", "pages": [36]}, {"id": "t125", "lecture": 3, "group": "Facet", "term": "Lens / magic lens", "definition": "A movable region that changes how underlying information is displayed locally.", "explanation": "A lens can magnify or show another semantic layer without changing the entire view. It can obscure nearby items or complicate navigation.", "example": "A magnifier that reveals road names over a map.", "pages": [33, 34, 79]}, {"id": "t126", "lecture": 3, "group": "Facet", "term": "Dynamic visual layering", "definition": "Highlighting relevant connections or layers in response to interaction.", "explanation": "Selection or hover can reveal local relationships in a dense diagram while the rest stays muted.", "example": "Hovering over an airport highlights routes departing that airport.", "pages": [35]}, {"id": "t127", "lecture": 3, "group": "Manipulate", "term": "Reduce", "definition": "Interaction or transformation techniques that decrease visible complexity by filtering, aggregating or embedding details.", "explanation": "Reduction is valuable when datasets exceed screen capacity, but it introduces risks of hiding relevant items or discarding variation.", "example": "Filter a large sales table by region then show a grouped total.", "pages": [5, 39]}, {"id": "t128", "lecture": 3, "group": "Reduce and focus", "term": "Filter", "definition": "Showing only items or attributes meeting stated conditions.", "explanation": "Filtering is straightforward and preserves selected detail, but excluded information is out of sight and may be forgotten. Filters must have clear states and reset actions.", "example": "Display only orders shipped this week.", "pages": [39, 41]}, {"id": "t129", "lecture": 3, "group": "Reduce and focus", "term": "Aggregate", "definition": "Combining several data items into summary values or groups.", "explanation": "Aggregation reduces visual complexity and communicates overall patterns but discards item-level detail, including important outliers. It can be combined with filters.", "example": "Show average weekly temperature instead of all hourly readings.", "pages": [39, 74, 75]}, {"id": "t130", "lecture": 3, "group": "Reduce and focus", "term": "Scented widget", "definition": "An interface control that includes a small preview of the data distribution.", "explanation": "Embedding data summaries into filter controls guides interaction by showing where values are concentrated before the user adjusts the controls.", "example": "A range slider contains a histogram of prices.", "pages": [42]}, {"id": "t131", "lecture": 3, "group": "Reduce and focus", "term": "Focus + context distortion", "definition": "Magnifying an important area while compressing less relevant regions in the same view.", "explanation": "Unlike a separate overview panel, this approach preserves neighbouring context in one image. Distortion makes exact measurement harder and must be interpreted carefully.", "example": "A fisheye calendar enlarges the selected day while showing other dates.", "pages": [43, 44, 46]}, {"id": "t132", "lecture": 3, "group": "Reduce and focus", "term": "Fisheye view", "definition": "A focus + context technique with high magnification near the focal point and decreasing scale farther away.", "explanation": "The user can read focused detail without abandoning overall context. It distorts spatial distances and area, so it should not be used for precise geometric judgments.", "example": "A long list with enlarged items around the current selection.", "pages": [44, 68]}, {"id": "t133", "lecture": 3, "group": "Reduce and focus", "term": "Perspective wall", "definition": "A 3D-inspired focus + context layout that brings the selected region forward and compresses surrounding context.", "explanation": "Perspective can make the focal region prominent but introduces distortion, occlusion and sometimes unnecessary 3D effects.", "example": "An information timeline with the selected month centred and neighbouring months receding.", "pages": [48]}, {"id": "t134", "lecture": 3, "group": "Reduce and focus", "term": "Animated transitions", "definition": "Smooth changes between views that help users track where objects move or how layouts relate.", "explanation": "Transitions can preserve mental continuity when navigating, but animation may be too slow or difficult for direct comparison of distant frames.", "example": "A map smoothly zooms to a selected region rather than instantly jumping.", "pages": [53, 54]}, {"id": "t135", "lecture": 3, "group": "Design examples", "term": "Visual analytics", "definition": "An approach combining interactive visualization and computational analysis to support reasoning.", "explanation": "Algorithms can reveal patterns while people evaluate meaning and uncertainty. The technique is most valuable for complex, open-ended tasks rather than a single automatic answer.", "example": "A word-network explorer helps researchers investigate related search terms.", "pages": [58, 60]}, {"id": "t136", "lecture": 3, "group": "Design examples", "term": "No unjustified 3D", "definition": "Avoid perspective where depth adds no meaningful information or harms readability.", "explanation": "In many 2D datasets, 3D introduces occlusion, distorted values and hard comparisons. Use it only when spatial structure is meaningful or it solves a specific task.", "example": "A 2D line chart is better than 3D-extruded lines for comparing time trends.", "pages": [63]}
