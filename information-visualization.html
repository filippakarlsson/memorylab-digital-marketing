, {"id": "t137", "lecture": 3, "group": "Design examples", "term": "Portals", "definition": "Views into a different region of a large information space, often shown as separate windows.", "explanation": "A portal supports remote context without moving the main view, but its frame and relation to the main world must be clear.", "example": "A minimap with a floating window showing a distant part of a game world.", "pages": [69, 70]}, {"id": "t138", "lecture": 3, "group": "Design examples", "term": "Sticky objects", "definition": "Interface items that remain fixed when the visualization pans or zooms.", "explanation": "Sticky controls preserve context or orientation; their screen position is not part of the data geometry.", "example": "A zoom button and scale bar remain fixed on a map.", "pages": [71]}, {"id": "t139", "lecture": 3, "group": "Design examples", "term": "Eyes beat memory", "definition": "Showing related views together is often easier than requiring users to remember details across separate screens.", "explanation": "Side-by-side comparison reduces working-memory demand, though too many panels can also increase clutter.", "example": "Compare two line charts side by side instead of switching between them.", "pages": [72, 73]}], "lectures": ["00 · Introduction", "01 · What & Why", "02 · Visual Encoding", "03 · Manipulate, Facet & Reduce"], "groups": [{"id": "0-0", "lecture": 0, "title": "Course and visualization foundations", "start": 1, "end": 10, "slides": ["00-001", "00-002", "00-003", "00-004", "00-005", "00-006", "00-007", "00-008", "00-009", "00-010"]}, {"id": "0-1", "lecture": 0, "title": "The visualization zoo", "start": 11, "end": 25, "slides": ["00-011", "00-012", "00-013", "00-014", "00-015", "00-016", "00-017", "00-018", "00-019", "00-020", "00-021", "00-022", "00-023", "00-024", "00-025"]}, {"id": "0-2", "lecture": 0, "title": "Visual analysis and design", "start": 26, "end": 38, "slides": ["00-026", "00-027", "00-028", "00-029", "00-030", "00-0 -059", "02-060"]}, {"id": "3-0", "lecture": 3, "title": "Manipulate · navigation and zoom", "start": 1, "end": 25, "slides": ["03-001", "03-002", "03-003", "03-004", "03-005", "03-006", "03-007", "03-008", "03-009", "03-010", "03-011", "03-012", "03-013", "03-014", "03-015", "03-016", "03-017", "03-018", "03-019", "03-020", "03-021", "03-022", "03-023", "03-024", "03-025"]}, {"id": "3-1", "lecture": 3, "title": "Facet · coordinated views", "start": 26, "end": 38, "slides": ["03-026", "03-027", "03-028", "03-029", "03-030", "03-031", "03-032", "03-033", "03-034", "03-035", "03-036", "03-037", "03-038"]}, {"id": "3-2", "lecture": 3, "title": "Reduce and focus + context", "start": 39, "end": 56, "slides": ["03-039", "03-040", "03-041", "03-042", "03-043", "03-044", "03-045", "03-046", "03-047", "03-048", "03-049", "03-050", "03-051", "03-052", "03-053", "03-054", "03-055", "03-056"]}, {"id": "3-3", "lecture": 3, "title": "Advanced examples and principles", "start": 57, "end": 79, "slides": ["03-057", "03-058", "03-059", "03-060", "03-061", "03-062", "03-063", "03-064", "03-065", "03-066", "03-067", "03-068", "03-069", "03-070", "03-071", "03-072", "03-073", "03-074", "03-075", "03-076", "03-077", "03-078", "03-079"]}]};const exam={"papers": [{"id": "infovis1", "name": "Past Exam 1", "filename": "infovis1.pdf", "questions": [{"id": 1, "title": "Attribute types", "prompt": "Select the attribute types for rank, title, budget, and average rating.", "kind": "classification", "answer": "Rank is ordinal (ordered positions without meaningful arithmetic). Title is categorical (names). Budget is quantitative (amount of money). Average rating is quantitative when it is a numerical average; although individual star ratings may be ordinal, the question says average rating.", "note": "These are four separate classifications. The original paper rearranges the choices in different versions.", "page": 1, "marks": 4}, {"id": 2, "title": "Scatterplot matrices and parallel coordinates", "prompt": "State FOUR tasks or findings that a scatterplot matrix can support. State ONE task better supported by parallel coordinates.", "kind": "writing", "answer": "A scatterplot matrix lets users compare pairwise relationships for many variables, identify positive or negative correlations, find clusters of similar records, and spot unusual observations or outliers across pairs. Parallel coordinates can be especially useful for tracing how an individual multidimensional record behaves across several ordered attributes, or for comparing patterns across many attributes in one continuous path. Both can show multivariate data, but each has different tradeoffs in clutter and interpretation.", "note": "The question asks for four distinct matrix uses and one separate parallel-coordinate advantage.", "page": 1, "marks": 10}, {"id": 3, "title": "Star plots and parallel coordinates", "prompt": "State two layout similarities, one layout difference, one advantage of a star plot, and one advantage of parallel coordinates.", "kind": "writing", "answer": "Both place several variables on separate axes and represent each item using values connected across those axes. Both enable comparisons of multivariate profiles, and their axis order can affect how patterns appear. A star plot uses axes radiating from a common center; parallel coordinates use parallel (usually vertical) axes connected by a polyline. A star plot can provide a compact shape or profile for a single record, helpful for comparing several small glyphs. Parallel coordinates make it easier to inspect many records at once and brush ranges across multiple dimensions, though overplotting becomes a problem.", "note": "The source has an inconsistent sentence mentioning Parallel Sets even though its heading and questions refer to Parallel Coordinates. The intended term is not silently changed; see original paper.", "page": 2, "marks": 10}, {"id": 4, "title": "Visual channels", "prompt": "Order {Length, Position on unaligned scale, Volume, Color saturation, Area} by effectiveness for a continuous attribute. Explain visual popout and name three channels that can produce it.", "kind": "writing", "answer": "For these five channels, effectiveness from strongest to weakest is position on an unaligned scale, length, area, color saturation, volume. Popout occurs when one item is noticed almost immediately, before a deliberate item-by-item search, because it differs clearly from its neighbours. Examples of cues that can produce popout include contrasting color hue, distinctive orientation, and motion. Whether something pops out depends on the display and competing items; it is not guaranteed for every difference.", "note": "Visual encoding lecture includes an effectiveness ranking and the concepts of accuracy, discriminability, and popout.", "page": 2, "marks": 10}, {"id": 5, "title": "Scalability of time-oriented visualizations", "prompt": "Give one suitable technique for 5, 20 and 100 time series. Do not use line, bar or scatter plots, and do not repeat a technique.", "kind": "writing", "answer": "Possible defensible combination: 5 series: braided graph (relationships are visible if clutter remains manageable); 20 series: small multiples (separate the series while keeping a shared scale for comparison); 100 series: horizon graphs (compress each time series into narrow strips) or a heatmap if suitable. Explain the tradeoff: overlaid plots get cluttered as series increase, small multiples use screen space, and compact displays sacrifice some detail. These are reasoned sample choices, not an official answer key; several combinations may be accepted if justified.", "note": "No official marking guide was supplied. Multiple defensible chart assignments exist.", "page": 3, "marks": 6}, {"id": 6, "title": "Tree visualizations and parent-child relations", "prompt": "Match Sunburst diagram, Node-Link diagrams and Treemaps with Adjacency, Containment and Line.", "kind": "matching", "answer": "Sunburst diagram → Adjacency, where parent and child levels are adjacent radial rings; Node-link diagram → Line, since explicit edges connect nodes; Treemap → Containment, as children are rectangles nested within parents.", "note": "This is a mapping task, and the option order differs between the files.", "page": 3, "marks": 6}, {"id": 7, "title": "Trees and tasks", "prompt": "Match Icicle layout, Treemaps and Node-Link diagrams with spotting outliers in leaf nodes, following paths, and summing values of children.", "kind": "matching", "answer": "Icicle layout → spotting outliers among leaf nodes (compare the sizes/shapes of leaf segments); Treemaps → summing values of children (area aggregates up into parents); Node-link diagrams → following paths (visible connections through the tree). The exact advantage can depend on layout and encoding.", "note": "The original form orders the rows and tasks differently across versions.", "page": 3, "marks": 6}, {"id": 8, "title": "Daily temperature visualizations", "prompt": "For maximum daily temperature across one year in ten cities, give advantages and disadvantages of line graph with grid, braided graph, stacked area chart, small multiples, and horizon graphs.", "kind": "writing", "answer": "Line chart with grid: time trends and exact values are relatively easy to inspect, but ten overlapping lines can clutter the view. Braided graph: crossing and ordering changes can be emphasized; overlaps can obscure individual values and make tracing lines hard. Stacked area chart: conveys the total and group contributions, but individual cities away from the baseline are hard to compare accurately; temperature is not always meaningful to sum. Small multiples: gives each city its own uncluttered view and supports comparison with shared scales, but costs display space and makes exact cross-panel comparisons slower. Horizon graphs: compress many series for a compact overview and reveal patterns, but have a learning cost, require a clear reference/baseline, and hide fine details.", "note": "The question is asking for pros AND cons for all five types; a single generic paragraph is insufficient.", "page": 4, "marks": 10}, {"id": 9, "title": "Identify the InfoVis technique", "prompt": "Identify the technique in the image showing a large time-series detail and a smaller interactive overview. Choose Semantic Zooming, Overview+Detail, Focus and Context, or Detail on Demand.", "kind": "choice", "answer": "Overview+Detail. The figure displays both a detailed time-series window and a separate miniature overview with a highlighted range indicating the detailed selection. Neither view simply replaces the other.", "note": "The image on original page 5 is part of the question.", "page": 5, "marks": 2}, {"id": 10, "title": "Pattern matching", "prompt": "Match the scatterplots and parallel-coordinate plots that represent the same data. Use the diagrams from the original exam page 6.", "kind": "visual", "answer": "Compare the ordering and relative patterns of records across axes: a pairwise scatterplot’s two coordinate variables should correspond to the same axes in parallel coordinates. Match strong positive trends to mostly parallel crossing behaviour, negative trends to more crossing between axes, and clusters/outliers consistently. Because the question is diagram-specific and no official matching key was provided, compare your work to the original image rather than treating a guessed mapping as certain.", "note": "Requires the figure on page 6 and self-review; no verified official mapping supplied.", "page": 6, "marks": 8}, {"id": 11, "title": "Graph visualization", "prompt": "Which visualization techniques are suitable for general graphs? Consider enclosure, node-link diagrams, adjacency diagrams, and adjacency matrices.", "kind": "writing", "answer": "Node-link diagrams and adjacency matrices are standard representations of general graphs. Arc/adjacency diagrams can also show connections among graph vertices using links. Enclosure layouts are most directly suited to nested hierarchies (trees), so they are not a generally applicable representation for arbitrary graph edges. The distinction is whether the technique can encode general relationships, not only parent–child containment.", "note": "The source displays a marking grid rather than a clear text-only answer key.", "page": 6, "marks": 4}, {"id": 12, "title": "Tree visualization", "prompt": "Which of adjacency matrix, enclosure, adjacency diagrams and node-link diagrams are suitable for trees?", "kind": "writing", "answer": "A tree is a special kind of graph. Node-link diagrams show parent–child links clearly, while enclosure techniques such as treemaps show a nested hierarchy through containment. An adjacency matrix can represent the links of a tree, although it is not usually the most efficient way to trace ancestry. Adjacency diagrams can also show tree edges, depending on the form of the diagram. Distinguish “can represent” from “well-suited for typical hierarchy tasks”; the original question may assess appropriateness.", "note": "Original marking-grid options need the original page to interpret fully.", "page": 7, "marks": 4}, {"id": 13, "title": "Observable Plot 1", "prompt": "Recreate the chart using Observable Plot and dataset nyData: x=date, y=medianAskingPrice, color by neighborhood and circle radius mapped to priceCutShare.", "kind": "coding", "answer": "Example pattern, to adapt to the supplied dataset and chart: Plot.plot({marks:[Plot.dot(nyData,{x:\"date\",y:\"medianAskingPrice\",stroke:\"neighborhood\",r:\"priceCutShare\"})]});. Note that the source plot uses hollow circles, making stroke a more faithful color encoding than fill. The complete working result depends on Observable Plot version and the data values.", "note": "This is a practice solution, not official instructor code. See the source image on page 7.", "page": 7, "marks": 15}, {"id": 14, "title": "Observable Plot 2", "prompt": "Using dataset worldbank, recreate x=income_group, y=life_exp, color by income_group, facet by region; add legend, correct colors/order and appropriate y-axis range.", "kind": "coding", "answer": "Possible Observable Plot structure: Plot.plot({color:{domain:[\"Low income\",\"Lower middle income\",\"Upper middle income\",\"High income\"],range:[\"red\",\"orange\",\"green\",\"blue\"],legend:true},x:{domain:[\"Low income\",\"Lower middle income\",\"Upper middle income\",\"High income\"]},y:{domain:[54,86]},fx:{label:\"region\"},marks:[Plot.dot(worldbank,{x:\"income_group\",y:\"life_exp\",stroke:\"income_group\",fx:\"region\"})]});. Adjust margins and axes to match the paper. The screenshot uses hollow circles, so stroke is more appropriate than fill. Check your code in the course’s Observable Plot environment.", "note": "Source figure shows red, orange, green, blue categories and y ticks approximately 54–86.", "page": 8, "marks": 15}]}, {"id": "ingovis2", "name": "Past Exam 2", "filename": "ingovis2.pdf", "questions": [{"id": 1, "title": "Attribute types", "prompt": "Select the attribute types for rank, title, budget, and average rating.", "kind": "classification", "answer": "Rank is ordinal (ordered positions without meaningful arithmetic). Title is categorical (names). Budget is quantitative (amount of money). Average rating is quantitative when it is a numerical average; although individual star ratings may be ordinal, the question says average rating.", "note": "These are four separate classifications. The original paper rearranges the choices in different versions.", "page": 1, "marks": 4}, {"id": 2, "title": "Scatterplot matrices and parallel coordinates", "prompt": "State FOUR tasks or findings that a scatterplot matrix can support. State ONE task better supported by parallel coordinates.", "kind": "writing", "answer": "A scatterplot matrix lets users compare pairwise relationships for many variables, identify positive or negative correlations, find clusters of similar records, and spo le": "Trees and tasks", "prompt": "Match Icicle layout, Treemaps and Node-Link diagrams with spotting outliers in leaf nodes, following paths, and summing values of children.", "kind": "matching", "answer": "Icicle layout → spotting outliers among leaf nodes (compare the sizes/shapes of leaf segments); Treemaps → summing values of children (area aggregates up into parents); Node-link diagrams → following paths (visible connections through the tree). The exact advantage can depend on layout and encoding.", "note": "The original form orders the rows and tasks differently across versions.", "page": 3, "marks": 6}, {"id": 8, "title": "Daily temperature visualizations", "prompt": "For maximum daily temperature across one year in ten cities, give advantages and disadvantages of line graph with grid, braided graph, stacked area chart, small multiples, and horizon graphs.", "kind": "writing", "answer": "Line chart with grid: time trends and exact values are relatively easy to inspect, but ten overlapping lines can clutter the view. Braided graph: crossing and ordering changes can be emphasized; overlaps can obscure individual values and make tracing lines hard. Stacked area chart: conveys the total and group contributions, but individual cities away from the baseline are hard to compare accurately; temperature is not always meaningful to sum. Small multiples: gives each city its own uncluttered view and supports comparison with shared scales, but costs display space and makes exact cross-panel comparisons slower. Horizon graphs: compress many series for a compact overview and reveal patterns, but have a learning cost, require a clear reference/baseline, and hide fine details.", "note": "The question is asking for pros AND cons for all five types; a single generic paragraph is insufficient.", "page": 4, "marks": 10}, {"id": 9, "title": "Identify the InfoVis technique", "prompt": "Identify the technique in the image showing a large time-series detail and a smaller interactive overview. Choose Semantic Zooming, Overview+Detail, Focus and Context, or Detail on Demand.", "kind": "choice", "answer": "Overview+Detail. The figure displays both a detailed time-series window and a separate miniature overview with a highlighted range indicating the detailed selection. Neither view simply replaces the other.", "note": "The image on original page 5 is part of the question.", "page": 5, "marks": 2}, {"id": 10, "title": "Pattern matching", "prompt": "Match the scatterplots and parallel-coordinate plots that represent the same data. Use the diagrams from the original exam page 6.", "kind": "visual", "answer": "Compare the ordering and relative patterns of records across axes: a pairwise scatterplot’s two coordinate variables should correspond to the same axes in parallel coordinates. Match strong positive trends to mostly parallel crossing behaviour, negative trends to more crossing between axes, and clusters/outliers consistently. Because the question is diagram-specific and no official matching key was provided, compare your work to the original image rather than treating a guessed mapping as certain.", "note": "Requires the figure on page 6 and self-review; no verified official mapping supplied.", "page": 6, "marks": 8}, {"id": 11, "title": "Graph visualization", "prompt": "Which visualization techniques are suitable for general graphs? Consider enclosure, node-link diagrams, adjacency diagrams, and adjacency matrices.", "kind": "writing", "answer": "Node-link diagrams and adjacency matrices are standard representations of general graphs. Arc/adjacency diagrams can also show connections among graph vertices using links. Enclosure layouts are most directly suited to nested hierarchies (trees), so they are not a generally applicable representation for arbitrary graph edges. The distinction is whether the technique can encode general relationships, not only parent–child containment.", "note": "The source displays a marking grid rather than a clear text-only answer key.", "page": 6, "marks": 4}, {"id": 12, "title": "Tree visualization", "prompt": "Which of adjacency matrix, enclosure, adjacency diagrams and node-link diagrams are suitable for trees?", "kind": "writing", "answer": "A tree is a special kind of graph. Node-link diagrams show parent–child links clearly, while enclosure techniques such as treemaps show a nested hierarchy through containment. An adjacency matrix can represent the links of a tree, although it is not usually the most efficient way to trace ancestry. Adjacency diagrams can also show tree edges, depending on the form of the diagram. Distinguish “can represent” from “well-suited for typical hierarchy tasks”; the original question may assess appropriateness.", "note": "Original marking-grid options need the original page to interpret fully.", "page": 7, "marks": 4}, {"id": 13, "title": "Observable Plot 1", "prompt": "Recreate the chart using Observable Plot and dataset nyData: x=date, y=medianAskingPrice, color by neighborhood and circle radius mapped to priceCutShare.", "kind": "coding", "answer": "Example pattern, to adapt to the supplied dataset and chart: Plot.plot({marks:[Plot.dot(nyData,{x:\"date\",y:\"medianAskingPrice\",stroke:\"neighborhood\",r:\"priceCutShare\"})]});. Note that the source plot uses hollow circles, making stroke a more faithful color encoding than fill. The complete working result depends on Observable Plot version and the data values.", "note": "This is a practice solution, not official instructor code. See the source image on page 7.", "page": 7, "marks": 15}, {"id": 14, "title": "Observable Plot 2", "prompt": "Using dataset worldbank, recreate x=income_group, y=life_exp, color by income_group, facet by region; add legend, correct colors/order and appropriate y-axis range.", "kind": "coding", "answer": "Possible Observable Plot structure: Plot.plot({color:{domain:[\"Low income\",\"Lower middle income\",\"Upper middle income\",\"High income\"],range:[\"red\",\"orange\",\"green\",\"blue\"],legend:true},x:{domain:[\"Low income\",\"Lower middle income\",\"Upper middle income\",\"High income\"]},y:{domain:[54,86]},fx:{label:\"region\"},marks:[Plot.dot(worldbank,{x:\"income_group\",y:\"life_exp\",stroke:\"income_group\",fx:\"region\"})]});. Adjust margins and axes to match the paper. The screenshot uses hollow circles, so stroke is more appropriate than fill. Check your code in the course’s Observable Plot environment.", "note": "Source figure shows red, orange, green, blue categories and y ticks approximately 54–86.", "page": 8, "marks": 15}]}, {"id": "infovis3", "name": "Past Exam 3", "filename": "infovis3.pdf", "questions": [{"id": 1, "title": "Attribute types", "prompt": "Select the attribute types for rank, title, budget, and average rating.", "kind": "classification", "answer": "Rank is ordinal (ordered positions without meaningful arithmetic). Title is categorical (names). Budget is quantitative (amount of money). Average rating is quantitative when it is a numerical average; although individual star ratings may be ordinal, the question says average rating.", "note": "These are four separate classifications. The original paper rearranges the choices in different versions.", "page": 1, "marks": 4}, {"id": 2, "title": "Scatterplot matrices and parallel coordinates", "prompt": "State FOUR tasks or findings that a scatterplot matrix can support. State ONE task better supported by parallel coordinates.", "kind": "writing", "answer": "A scatterplot matrix lets users compare pairwise relationships for many variables, identify positive or negative correlations, find clusters of similar records, and spot unusual observations or outliers across pairs. Parallel coordinates can be especially useful for tracing how an individual multidimensional record behaves across several ordered attributes, or for comparing patterns across many attributes in one continuous path. Both can show multivariate data, but each has different tradeoffs in clutter and interpretation.", "note": "The question asks for four distinct matrix uses and one separate parallel-coordinate advantage.", "page": 1, "marks": 10}, {"id": 3, "title": "Star plots and parallel coordinates", "prompt": "State two layout similarities, one layout difference, one advantage of a star plot, and one advantage of parallel coordinates.", "kind": "writing", "answer": "Both place several variables on separate axes and represent each item using values connected across those axes. Both enable comparisons of multivariate profiles, and their axis order can affect how patterns appear. A star plot uses axes radiating from a common center; parallel coordinates use parallel (usually vertical) axes connected by a polyline. A star plot can provide a compact shape or profile for a single record, helpful for comparing several small glyphs. Parallel coordinates make it easier to inspect many records at once and brush ranges across multiple dimensions, though overplotting becomes a problem.", "note": "The source has an inconsistent sentence mentioning Parallel Sets even though its heading and questions refer to Parallel Coordinates. The intended term is not silently changed; see original paper.", "page": 2, "marks": 10}, {"id": 4, "title": "Visual channels", "prompt": "Order {Length, Position on unaligned scale, Volume, Color saturation, Area} by effectiveness for a continuous attribute. Explain visual popout and name three channels that can produce it.", "kind": "writing", "answer": "For these five channels, effectiveness from strongest to weakest is position on an unaligned scale, length, area, color saturation, volume. Popout occurs when one item is noticed almost immediately, before a deliberate item-by-item search, because it differs clearly from its neighbours. Examples of cues that can produce popout include contrasting color hue, distinctive orientation, and motion. Whether something pops out depends on the display and competing items; it is not guarantee function termVisual(term){
 const visual=glossaryVisuals[term.id];
 if(!visual)return '';
 const [slideId,caption]=visual;
 const slide=course.slides.find(source=>source.id===slideId);
 if(!slide)return '';
 return `<figure class="term-visual"><a href="${E(slide.img)}" target="_blank" rel="noopener" aria-label="${E('Open full-size visual for '+term.term+' (new tab)')}"><img src="${E(slide.img)}" alt="${E(caption)}" loading="lazy" decoding="async"/></a><figcaption class="small"><strong>${E(caption)}</strong><span>${E(course.lectures[slide.lecture])} · Slide ${slide.page} · Select image to open full-size</span></figcaption></figure>`;
}

function termCards(list){return `<div class="terms">${list.map(t=>`<div class="card term"><span class="chip">${E(course.lectures[t.lecture])}</span><span class="chip">${E(t.group)}</span><h3>${E(t.term)}</h3><div class="definition">${E(t.definition)}</div>${termVisual(t)}<div class="row" style="margin-top:12px"><button class="btn" data-open="${E(t.id)}">Full explanation</button><button class="btn" data-learn="${E(t.id)}">${saved.mastery[t.id]?'✓ '+E(saved.mastery[t.id]):'Mark for review'}</button></div></div>`).join('')}</div>`}

function showHome(){sc.innerHTML=`<h1>Information Visualization</h1><p class="lead">Explore all four uploaded lecture PDFs, memorize the concepts, and prepare with your three past exam papers. The original slide images and complete PDFs are included so diagrams, visual examples, and interactive exercise screenshots are not lost.</p><div class="cards"><div class="card"><h2>${course.terms.length}</h2><p>Detailed study concepts</p><button class="btn" onclick="go('glossary')">Browse glossary</button></div><div class="card"><h2>${course.slides.length}</h2><p>Original lecture slides</p><button class="btn" onclick="go('slides')">Open slides</button></div><div class="card"><h2>3</h2><p>Original past-exam files</p><button class="btn" onclick="go('exams')">Practice exams</button></div><div class="card"><h2>${Object.values(saved.mastery).filter(x=>x==='Mastered').length}</h2><p>Concepts mastered</p><button class="btn" onclick="go('progress')">My progress</button></div></div><h2 style="margin-top:26px">Original lecture PDFs</h2><div class="row"><a class="btn" href="source-lectures/_Infovis_00_ShortIntro_2026.key.pdf" target="_blank">00 · Introduction PDF</a><a class="btn" href="source-lectures/_InfoVis-01-What-Why.pdf" target="_blank">01 · What–Why PDF</a><a class="btn" href="source-lectures/_InfoVis-02-How-Visual-Encoding.pdf" target="_blank">02 · Visual Encoding PDF</a><a class="btn" href="source-lectures/_InfoVis-03-ManipulateFacetReduce copy.pdf" target="_blank">03 · Manipulate, Facet, Reduce PDF</a></div><h2 style="margin-top:26px">Lecture folders</h2><div class="cards">${course.lectures.map((x,i)=>`<button class="card" style="text-align:left;cursor:pointer" onclick="S.lecture='${i}';go('glossary')"><h3>📁 ${E(x)}</h3><p>${course.terms.filter(t=>t.lecture===i).length} terms · ${course.slides.filter(s=>s.lecture===i).length} slides</p><span class="small">Open lecture →</span></button>`).join('')}</div><div class="error">These uploaded lectures cover 00–03. The introductory timetable mentions future lectures 04–11, but their slides were not uploaded and are not presented as covered.</div>`}
function showGlossary(){
 sc.innerHTML=`<h1>Complete glossary</h1><p class="lead"><span id="termCount"></span> Definitions and longer explanations are based on the uploaded lecture material, with simple examples. Visual examples include captions and links to the original slides.</p><div class="controls">${lectOptions(S.lecture)}<input id="termSearch" aria-label="Search glossary" placeholder="Search concepts, explanations, and topics" value="${E(S.query)}"/></div><div id="glossaryResults"></div>`;

function showTerm(id){const t=byId[id];if(!t)return;S.term=id;sc.innerHTML=`<button class="btn" id="backTerm">← Back to glossary</button><div class="glass"><span class="chip">${E(course.lectures[t.lecture])}</span><span class="chip">${E(t.group)}</span><h1>${E(t.term)}</h1><h3>Definition</h3><p class="definition">${E(t.definition)}</p>${termVisual(t)}<h3>Full explanation</h3><p>${E(t.explanation)}</p><h3>Concrete example</h3><div class="answer">${E(t.example)}</div><p class="small">Slide references ${t.pages?.map(p=>`page ${p}`).join(', ')||'see lecture'}</p><div class="row"><button class="btn" id="simpleTerm">Explain simply</button><button class="btn" id="whyTerm">Why it matters</button><button class="btn" id="examTerm">Exam-ready answer</button></div><div id="termExtra"></div><div class="divider"></div><p>How well do you know this?</p><div class="row"><button class="btn" data-rate="Review">Review again</button><button class="btn" data-rate="Studying">Learning</button><button class="btn primary" data-rate="Mastered">Mastered</button></div></div>`;
 document.getElementById('backTerm').onclick=()=>go('glossary');let el=document.getElementById('termExtra');document.getElementById('simpleTerm').onclick=()=>el.innerHTML=`<div class="answer">${E(t.definition)} For example, ${E(t.example)}</div>`;document.getElementById('whyTerm').onclick=()=>el.innerHTML=`<div class="answer">${E(t.explanation)}</div>`;document.getElementById('examTerm').onclick=()=>el.innerHTML=`<div class="answer">${E(t.term)} refers to ${E(t.definition.charAt(0).toLowerCase()+t.definition.slice(1))}\n\n${E(t.explanation)}\n\nFor example, ${E(t.example)}</div>`;sc.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{saved.mastery[t.id]=b.dataset.rate;persist();b.textContent='✓ '+b.dataset.rate});}
function showStudy(){let all=course.terms.filter(t=>S.lecture==='all'||String(t.lecture)===String(S.lecture));if(!all.length)return;S.idx=Math.min(S.idx,all.length-1);const t=all[S.idx];sc.innerHTML=`<h1>Active recall</h1><p class="lead">Try to remember each definition before revealing it. Keep track of difficult concepts.</p><div class="controls">${lectOptions(S.lecture)}<span class="chip">${S.idx+1} / ${all.length}</span></div><div class="glass"><span class="chip">${E(course.lectures[t.lecture])}</span><h2>${E(t.term)}</h2><p>Explain the concept in your own words before clicking reveal.</p><button class="btn primary" id="reveal">Reveal explanation</button><div id="studyAnswer" class="hidden"><h3>Meaning</h3><p>${E(t.definition)}</p><h3>Why and how</h3><p>${E(t.explanation)}</p><h3>Example</h3><div class="answer">${E(t.example)}</div></div><div class="divider"></div><div class="row"><button class="btn" id="prev">← Previous</button><button class="btn" id="again">Need review</button><button class="btn primary" id="gotit">I know this</button><button class="btn" id="next">Next →</button></div></div>`;document.getElementById('lectFilter').onchange=e=>{S.lecture=e.target.value;S.idx=0;render()};document.getElementById('reveal').onclick=()=>document.getElementById('studyAnswer').classList.remove('hidden');document.getElementById('prev').onclick=()=>{S.idx=(S.idx-1+all.length)%all.length;render()};document.getElementById('next').onclick=()=>{S.idx=(S.idx+1)%all.length;render()};document.getElementById('again').onclick=()=>{saved.mastery[t.id]='Review';persist();S.idx=(S.idx+1)%all.length;render()};document.getElementById('gotit').onclick=()=>{saved.mastery[t.id]='Mastered';persist();S.idx=(S.idx+1)%all.length;render()}}
function showCompare(){const combos=exam.comparisons;sc.innerHTML=`<h1>Connected concepts</h1><p class="lead">Study related concepts together. Compare their definitions and decide when each matters. The links below are drawn only from terms actually present in your lecture glossary.</p><div class="terms">${combos.map((c,i)=>{let a=byId[c.a],b=byId[c.b];return `<div class="card"><h3>${E(a.term)} ↔ ${E(b.term)}</h3><div class="cards"><div><p class="chip">${E(a.term)}</p><p>${E(a.definition)}</p></div><div><p class="chip">${E(b.term)}</p><p>${E(b.definition)}</p></div></div><details><summary>See deeper explanation and examples</summary><p><strong>${E(a.term)}</strong> ${E(a.explanation)}</p><div class="answer">${E(a.example)}</div><p><strong>${E(b.term)}</strong> ${E(b.explanation)}</p><div class="answer">${E(b.example)}</div></details></div>`}).join('')}</div>`}
function showSlides(){let list=course.slides.filter(x=>S.lecture==='all'||String(x.lecture)===String(S.lecture));S.slideIdx=Math.min(S.slideIdx,list.length-1);const s=list[S.slideIdx];sc.innerHTML=`<h1>All original lecture slides</h1><p class="lead">Every page from the four uploaded lecture PDFs is preserved as an image. This is important for figures, chart comparisons, diagrams, and slide activities.</p><div class="controls">${lectOptions(S.lecture)}<span class="chip">${E(course.lectures[s.lecture])} · page ${s.page} · ${S.slideIdx+1} of ${list.length}</span><button class="btn" id="sPrev">← Previous</button><button class="btn" id="sNext">Next →</button></div><div class="slidebox"><img class="slide" src="${E(s.img)}" alt="${E(s.title)}"/><h3>${E(s.title)}</h3><details><summary>Read extracted slide text</summary><pre>${E(s.text)}</pre></details></div><h2>Slide overview</h2><div class="gallery">${list.map((x,i)=>`<button class="btn" data-slide="${i}"><img src="${E(x.img)}" loading="lazy" alt="page ${x.page}"/><span class="small">${x.page} · ${E(x.title.slice(0,30))}</span></button>`).join('')}</div>`;document.getElementById('lectFilter').onchange=e=>{S.lecture=e.target.value;S.slideIdx=0;showSlides()};document.getElementById('sPrev').onclick=()=>{S.slideIdx=(S.slideIdx-1+list.length)%list.length;showSlides()};document.getElementById('sNext').onclick=()=>{S.slideIdx=(S.slideIdx+1)%list.length;showSlides()};sc.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{S.slideIdx=Number(b.dataset.slide);showSlides();sc.scrollIntoView({behavior:'smooth',block:'start'})})}
function stopAudio(){if('speechSynthesis'in window)window.speechSynthesis.cancel();S.utter=null}
function showAudio(){let grp=course.groups.filter(g=>S.lecture==='all'||String(g.lecture)===String(S.lecture));sc.innerHTML=`<h1>Audio lectures</h1><p class="lead">Choose a cluster to listen to a connected overview of the concepts. The voice uses your browser’s speech system; choose a natural voice from the installed options.</p><div class="controls">${lectOptions(S.lecture)}<select id="voiceSel"><option value="">Default voice</option></select><label>Speed <select id="speed"><option value="0.85">0.85×</option><option value="0.95" selected>0.95×</option><option value="1">1×</option><option value="1.1">1.1×</option></select></label><button class="btn" id="pauseAudio">Pause / Resume</button><button class="btn" id="stopAudio">Stop</button></div><div class="terms">${grp.map(g=>`<div class="card"><span class="chip">${E(course.lectures[g.lecture])}</span><h3>${E(g.title)}</h3><p>${g.slides.length} source slides · ${course.terms.filter(t=>t.lecture===g.lecture && (g.title.toLowerCase().includes(t.group.toLowerCase())||g.slides.some(id=>{let sl=course.slides.find(s=>s.id===id);return sl&&t.pages?.includes(sl.page)}))).length} related terms</p><button class="btn primary" data-speak="${E(g.id)}">Play lesson</button><details><summary>Read what will be spoken</summary><p>${E(scriptForGroup(g))}</p></details></div>`).join('')}</div>`;
 document.getElementById('lectFilter').onchange=e=>{stopAudio();S.lecture=e.target.value;showAudio()};const vs=document.getElementById('voiceSel');function updateVoices(){let voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'));vs.innerHTML='<option value="">Default voice</option>'+voices.map(v=>`<option value="${E(v.name)}">${E(v.name)} (${E(v.lang)})</option>`).join('');let pref=voices.find(v=>/Daniel|Alex|Oliver|Aaron|Arthur|James|George/i.test(v.name));if(pref)vs.value=pref.name}if('speechSynthesis'in window){updateVoices();speechSynthesis.onvoiceschanged=updateVoices}document.getElementById('pauseAudio').onclick=()=>{if(!('speechSynthesis'in window))return;if(speechSynthesis.paused)speechSynthesis.resume();else speechSynthesis.pause()};document.getElementById('stopAudio').onclick=stopAudio;sc.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>{let g=course.groups.find(x=>x.id===b.dataset.speak);stopAudio();if(!('speechSynthesis'in window)){alert('Speech synthesis is not supported in this browser');return}let u=new SpeechSynthesisUtterance(scriptForGroup(g));let voices=speechSynthesis.getVoices();let voice=voices.find(v=>v.name===vs.value);if(voice)u.voice=voice;u.lang='en-GB';u.rate=Number(document.getElementById('speed').value);u.pitch=.95;S.utter=u;speechSynthesis.speak(u)})}
function scriptForGroup(g){let sl=course.slides.filter(s=>g.slides.includes(s.id));let related=course.terms.filter(t=>t.lecture===g.lecture&&t.pages?.some(p=>sl.some(s=>s.page===p)));return `Welcome to ${g.title}, part of ${course.lectures[g.lecture]}. In this lesson we will connect ${related.length} important ideas. `+related.map((t,i)=>`${i+1}. ${t.term}. ${t.definition} ${t.explanation} For example: ${t.example}`).join(' ')+' To recap, think about what the data means, which task the user needs, and why the design choice is appropriate.'}
function showQuizzes(){const pool=course.terms.filter(t=>S.lecture==='all'||String(t.lecture)===String(S.lecture));let current=pool[S.idx%pool.length]||course.terms[0];const distractors=course.terms.filter(t=>t.id!==current.id && t.definition!==current.definition && t.lecture===current.lecture).slice(0,3);while(distractors.length<3)distractors.push(course.terms.filter(t=>t.id!==current.id && !distractors.includes(t))[distractors.length]);let opts=[current,...distractors];let insert=(S.idx*3+1)%4;opts=opts.filter(t=>t.id!==current.id);opts.splice(insert,0,current);sc.innerHTML=`<h1>Quick quizzes</h1><p class="lead">New lecture-based multiple-choice practice generated from the uploaded glossary. These are NOT official past-exam questions.</p><div class="controls">${lectOptions(S.lecture)}<span class="chip">Question ${S.idx+1}</span></div><div class="glass"><h2>Which concept matches this definition?</h2><p class="prompt">${E(current.definition)}</p>${opts.map((t,i)=>`<label class="quizopt"><input type="radio" name="option" value="${E(t.id)}"/> ${String.fromCharCode(65+i)}. ${E(t.term)}</label>`).join('')}<div class="row"><button class="btn primary" id="checkQ">Check answer</button><button class="btn" id="nextQ">Next question →</button></div><div id="qFeedback"></div></div>`;document.getElementById('lectFilter').onchange=e=>{S.lecture=e.target.value;S.idx=0;showQuizzes()};document.getElementById('checkQ').onclick=()=>{let v=sc.querySelector('input[name="option"]:checked');document.getElementById('qFeedback').innerHTML=v?`<div class="answer">${v.value===current.id?'Correct!':'Not quite.'} The concept is <b>${E(current.term)}</b>. ${E(current.explanation)}</div>`:'<div class="error">No option selected. This question is unanswered, not correct.</div>'};document.getElementById('nextQ').onclick=()=>{S.idx++;showQuizzes()}}
function showProgress(){let levels=['Mastered','Studying','Review'];let n=Object.values(saved.mastery).filter(x=>x==='Mastered').length;sc.innerHTML=`<h1>Learning progress</h1><p class="lead">Your progress is saved in this browser separately from Digital Marketing.</p><div class="cards"><div class="card"><h2>${n} / ${course.terms.length}</h2><p>Concepts mastered</p><div class="progressbar"><div style="width:${Math.round(100*n/course.terms.length)}%"></div></div></div>${levels.map(l=>`<div class="card"><h2>${Object.values(saved.mastery).filter(x=>x===l).length}</h2><p>${l}</p></div>`).join('')}</div><h2>By lecture</h2>${course.lectures.map((l,i)=>{let t=course.terms.filter(t=>t.lecture===i),m=t.filter(x=>saved.mastery[x.id]==='Mastered').length;return `<div class="card"><h3>${E(l)}</h3><p>${m} / ${t.length} mastered</p><div class="progressbar"><div style="width:${Math.round(100*m/t.length)}%"></div></div></div>`}).join('')}`}
function showExams(){let p=exam.papers.find(p=>p.id===S.paper)||exam.papers[0];sc.innerHTML=`<h1>Past exams</h1><p class="lead">Three original uploaded exam PDFs, each with 14 questions. Their question types are largely identical, but option orders vary. Use the paper images for matching/diagram tasks. Written answers are self-assessed; only verified objective items are automatically marked.</p><div class="controls"><button class="btn ${S.practice==='all'?'active':''}" data-exam-view="all">Past exam papers</button><button class="btn ${S.practice==='long'?'active':''}" data-exam-view="long">All longer / coding questions</button><button class="btn ${S.practice==='writing'?'active':''}" data-exam-view="writing">All writing questions</button><button class="btn ${S.practice==='choice'?'active':''}" data-exam-view="choice">All selectable questions</button></div><div id="examSlot"></div>`;sc.querySelectorAll('[data-exam-view]').forEach(b=>b.onclick=()=>{S.practice=b.dataset.examView;showExams()});let slot=document.getElementById('examSlot');if(S.practice==='all'){slot.innerHTML=`<div class="cards">${exam.papers.map(p=>`<div class="card"><h3>${E(p.name)}</h3><p>14 questions · 8 pages · original exam</p><div class="row"><button class="btn primary" data-paper="${p.id}">Open test</button><a class="btn" href="${E(p.filename)}" target="_blank">Original PDF</a></div></div>`).join('')}</div><div id="paperSlot"></div>`;slot.querySelectorAll('[data-paper]').forEach(b=>b.onclick=()=>{S.paper=b.dataset.paper;S.qIdx=0;renderPaper()});renderPaper();return}const typ=S.practice==='long'?[2,3,4,5,8,10,13,14]:S.practice==='writing'?[2,3,4,5,8,10,11,12,13,14]:[1,6,7,9,11,12];slot.innerHTML=`<p class="small">${typ.length} distinct question types. All three original PDFs remain available above under Past exam papers.</p><div class="terms">${exam.questions.filter(q=>typ.includes(q.id)).map(q=>`<div class="card"><span class="chip">Q${q.id} · ${q.marks} marks</span><h3>${E(q.title)}</h3><p>${E(q.prompt)}</p><details><summary>Show model explanation</summary><div class="answer">${E(q.answer)}</div><p class="small">${E(q.note)}</p></details>${[9,10,13,14].includes(q.id)?`<img loading="lazy" class="past-img" src="exam-images/infovis1-${q.page}.png" alt="Original exam figure"/>`:''}</div>`).join('')}</div>`}
function renderPaper(){let p=exam.papers.find(x=>x.id===S.paper);let q=p.questions[S.qIdx];let key=S.paper+'-'+q.id;let stored=saved.drafts[key]||'';let a=saved.exam[key]||'';let isAuto=[1,6,7,9].includes(q.id);let htmlx=`<div class="glass"><div class="paperhead"><h2 style="margin-right:auto">${E(p.name)} · Question ${q.id} / 14</h2><a class="btn" href="${p.filename}" target="_blank">Original PDF</a></div><div class="progressbar"><div style="width:${Math.round((S.qIdx+1)/14*100)}%"></div></div><span class="chip">${q.marks} marks</span><span class="chip">${isAuto?'Classification / matching':'Written / self-assessed'}</span><h3>${E(q.title)}</h3><p class="prompt">${E(q.prompt)}</p>${q.id===1?renderAttrInputs(key):q.id===6?renderMatch6(key):q.id===7?renderMatch7(key):q.id===9?renderTech9(key):`<label class="small" for="draft">Your answer</label><textarea id="draft" placeholder="Write your response before revealing the model answer">${E(stored)}</textarea>`}${[9,10,13,14].includes(q.id)?`<img class="past-img" src="exam-images/${S.paper}-${q.page}.png" alt="Original exam question diagram or chart"/>`:''}<div class="row"><button class="btn" id="examPrev">← Previous</button><button class="btn primary" id="checkExam">${isAuto?'Check answer':'Save answer'}</button><button class="btn" id="examNext">Next →</button></div><div id="examResult"></div><details id="facitBox"><summary>Reveal model answer / explanation</summary><div class="answer">${E(q.answer)}</div><p class="small">${E(q.note)}</p></details></div>`;document.getElementById('paperSlot').innerHTML=htmlx;const doc=document.getElementById('paperSlot');if(Array.isArray(stored)){stored.forEach(pair=>{let sel=[...doc.querySelectorAll('select[data-auto]')].find(el=>el.name===pair[0]);if(sel)sel.value=pair[1]})}doc.querySelector('#examPrev').onclick=()=>{saveDraft();S.qIdx=(S.qIdx+13)%14;renderPaper()};doc.querySelector('#examNext').onclick=()=>{saveDraft();S.qIdx=(S.qIdx+1)%14;renderPaper()};doc.querySelector('#checkExam').onclick=()=>{saveDraft();if(isAuto){let v=correctAuto(q.id,doc);saved.exam[key]=v===null?'unanswered':v?'correct':'incorrect';persist();doc.querySelector('#examResult').innerHTML=v===null?'<div class="error">Unanswered. This does not count as correct.</div>':`<div class="${v?'answer':'error'}">${v?'Correct':'Not correct yet'}. Open model answer below to review.</div>`}else{saved.exam[key]=String(saved.drafts[key]).trim()?'written':'unanswered';persist();doc.querySelector('#examResult').innerHTML=saved.exam[key]==='written'?'<div class="answer">Saved. Written responses are not automatically graded; reveal the model answer and compare each requested part.</div>':'<div class="error">Unanswered. This does not count as correct.</div>'}};
let result=doc.querySelector('#examResult');if(a)result.textContent=a==='correct'?'Last check: correct':a==='incorrect'?'Last check: incorrect':a==='written'?'Written answer saved (self-assessment only)':'Unanswered';function saveDraft(){let ta=doc.querySelector('#draft');if(ta){saved.drafts[key]=ta.value;persist()}else{let els=[...doc.querySelectorAll('select[data-auto],input[data-auto]:checked')];if(els.length){saved.drafts[key]=els.map(x=>[x.name,x.value]);persist()}}}}
function opts(name,values){return `<select data-auto name="${name}"><option value="">Choose…</option>${values.map(v=>`<option value="${E(v)}">${E(v)}</option>`).join('')}</select>`}
function renderAttrInputs(k){return `<div class="terms">${[['rank','ordinal'],['title','categorical'],['budget','quantitative'],['avg rating','quantitative']].map(([label])=>`<div class="row"><label style="min-width:130px">${label}</label>${opts(label,['categorical','ordinal','quantitative'])}</div>`).join('')}</div>`}
function renderMatch6(k){return `<p>Match each tree representation to its way of showing the parent–child relation.</p>${['Sunburst diagram','Node-link diagrams','Treemaps'].map(t=>`<div class="row"><label style="min-width:190px">${E(t)}</label>${opts(t,['Adjacency','Containment','Line'])}</div>`).join('')}`}
function renderMatch7(k){return `<p>Match each visualization to the task it best supports.</p>${['Icicle layout','Treemaps','Node-link diagrams'].map(t=>`<div class="row"><label style="min-width:190px">${E(t)}</label>${opts(t,['Spot outliers in leaf nodes','Following paths','Sum up values of children'])}</div>`).join('')}`}
function renderTech9(k){return `<div class="row">${opts('Technique',['Semantic Zooming','Overview+Detail','Focus and Context','Detail on Demand'])}</div>`}
function correctAuto(id,box){const expected=id===1?{'rank':'ordinal','title':'categorical','budget':'quantitative','avg rating':'quantitative'}:id===6?{'Sunburst diagram':'Adjacency','Node-link diagrams':'Line','Treemaps':'Containment'}:id===7?{'Icicle layout':'Spot outliers in leaf nodes','Treemaps':'Sum up values of children','Node-link diagrams':'Following paths'}:{'Technique':'Overview+Detail'};for(let [k,v] of Object.entries(expected)){let e=box.querySelectorAll('select[data-auto]');let matched=[...e].find(z=>z.name===k);if(!matched||!matched.value)return null;if(matched.value!==v)return false}return true}
render();</script></body></html>
