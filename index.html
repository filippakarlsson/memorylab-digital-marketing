ation and segmentation by Jobs to Be Done?","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-S3","kind":"short","prompt":"Name the two memory systems central to Cognitive Load Theory and explain their roles.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-S4","kind":"short","prompt":"Give three examples of measurable objectives at the conversion stage of the marketing funnel.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-S5","kind":"short","prompt":"Why is launching a campaign on TikTok not itself a marketing objective?","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-S6","kind":"short","prompt":"Explain the distinction between outbound interruption and inbound attraction.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-S7","kind":"short","prompt":"Name and briefly define the four search intent categories.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-S8","kind":"short","prompt":"Match comparison reviews, how-to guides and checkout pages to their most suitable search intents.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-S9","kind":"short","prompt":"Explain the difference between technical, on-site and off-site SEO.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-S10","kind":"short","prompt":"What are a meta title and meta description, and why are they used?","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-S11","kind":"short","prompt":"Define GEO and explain how it relates to SEO.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-S12","kind":"short","prompt":"What is a call to action (CTA)? Provide two examples linked to different objectives.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-S13","kind":"short","prompt":"What is a vanity metric, and why can it mislead a marketer?","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-S14","kind":"short","prompt":"Explain the difference between brand identity and brand image.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-S15","kind":"short","prompt":"Define attribution and incrementality. Why are they not the same?","source":"Additional course-aligned practice (not a verbatim past exam)"}];</script><script>window.EXAM_MODEL_KEYS={"1":"An objective states a measurable outcome the business intends to achieve, ideally within a set time period. It is not a channel, tactic or creative idea.","2":"The course stresses that clearly specified objectives improve the likelihood of a successful campaign because they guide decisions and measurement.","3":"A KPI is a Key Performance Indicator: a selected measurement directly linked to whether an objective is being achieved.","4":"JTBD focuses on the progress people want to make in a specific situation; demographics alone cannot reveal that motivation.","5":"The funnel helps set relevant goals and messages for customers at different stages, from first awareness to action.","6":"Awareness, consideration and conversion are common funnel stages; ownership is not one of the standard stages in this question.","7":"Working memory has limited capacity, so too much unfamiliar information can overload it and make messages harder to process.","8":"SEO improves discoverability, accessibility and relevance in unpaid search results. It is not paid media buying.","9":"The three SEO components taught in this course are technical, on-site and off-site. Paid advertising is different.","10":"SERP means Search Engine Results Page. The course question uses the singular “Result Page” wording, which is the listed correct option.","11":"Outbound sends promotional messages to people whether or not they were actively searching for that offer; inbound attracts through useful, discoverable content.","12":"Sponsored Instagram feed advertisements are paid placements. Unpaid posts and ordinary blog content are not necessarily paid media.","13":"Objective, distribution and creative are the course’s campaign-design components; keyword density is an SEO content concept.","14":"Creative means what the audience actually sees or hears: message, copy, images, video, design, audio and call to action.","15":"CTA means Call to Action, an instruction such as “Book now” or “Sign up” that asks the audience to take a next step.","16":"Scarcity is how valuable people think it is or urgency created by limited availability of quantity, time or access.","17":"Reviews, guarantees, security badges and transparent policies can reduce uncertainty and help visitors feel confident about acting.","18":"Distinctive assets—such as an easily recognized logo, sonic cue or color combination—help people identify a brand quickly.","19":"Marketing is the activity of creating, communicating and delivering value to customers and other stakeholders. It includes understanding customer needs, developing an appropriate offer, deciding on price and availability, and building relationships. Advertising is one component of marketing, not its definition.","20":"Digital marketing applies marketing principles through digital environments such as websites, search engines, apps and social platforms. It includes digital product and service experiences, pricing, distribution and communication, including both paid advertising and unpaid activities such as SEO or customer support.","21":"Search intent is the purpose behind a person's search query. The four types are informational (learning or finding an answer), navigational (reaching a known website), commercial (researching or comparing options) and transactional (ready to buy, sign up or take another action).","22":"An objective–distribution–creative structure aligns three decisions in a digital advertising campaign. The objective states the measurable result to achieve; distribution determines who will see the advertisement and where; creative is the message and content shown to that audience. For example, a hypothetical Nike campaign might aim for 500 product-page purchases (objective), use paid social ads aimed at relevant runners (distribution), and show a clear running-shoe demonstration with a direct product-page link (creative).","23":"Three practical dimensions of digital advertising distribution are (1) the target audience—who should receive the message, (2) channels and placements—where they should encounter it, and (3) timing and frequency—when and how often it is delivered. Budget constrains all three decisions. The materials currently available do not establish whether this is the lecturer's exact named three-part list, so it should not be treated as a verified official formulation.","24":"Framing is presenting the same underlying information in a way that emphasizes particular aspects and affects interpretation. For example, a hypothetical streaming offer presented as 'save 20%' may feel different from one presented as 'pay 80% of the usual price', although the amount is identical. Ethical framing must remain accurate.","Exam A-L1":"Digital marketing measurement determines whether a campaign achieved its intended objective instead of only generating activity on a platform. An objective identifies the business or customer outcome and timeframe, such as increasing completed online orders by 15% in six weeks. Key performance indicators (KPIs) are selected measurements that directly check progress toward that outcome, such as completed orders, conversion rate and cost per acquisition. Other metrics, including impressions, video views or clicks, can help explain campaign performance, but they are not evidence that the objective was achieved unless they are relevant to it.\n\nThe marketing funnel helps determine which measures are appropriate. At awareness, a campaign might aim to increase recognition among a defined audience, supported by measures of qualified reach or brand recall. At consideration, the objective may be to encourage people to evaluate products, making qualified product-page visits, comparison-page engagement or enquiries relevant. At conversion, completed purchases, sign-ups and conversion rates become more important. At retention, repeat purchases or renewals better indicate whether the relationship continues. A KPI is therefore chosen because of the outcome the marketer needs to assess, not simply because an advertising platform happens to report it.\n\nMarketers must also recognize measurement limitations. A served impression does not prove attention, a click does not prove purchase, and high follower counts can be vanity metrics when the objective is sales. Attribution assigns credit to touchpoints, but even a last-click sale may have happened without the advertisement. Incrementality instead asks what additional result advertising caused compared with a relevant baseline or control group. For example, if an online retailer reports higher shoe sales during a campaign, those sales must be evaluated against expected demand before they are all attributed to the ads. Clear objectives and suitable KPIs make marketing results interpretable while supporting decisions about creative and distribution.","Exam A-L2":"Creative is the content of an advertisement: its message, visual and audio elements, format, branding and call to action. It matters because purchasing distribution does not mean that people will notice, understand or respond to an ad. Effective creative communicates one clear proposition, helps the audience recognize the brand and makes the next step understandable. Cognitive Load Theory is relevant here: when an ad contains competing claims, tiny text and too many calls to action, limited working memory is burdened with unnecessary processing.\n\nCreative must be adapted to both the audience’s situation and the campaign objective. A short vertical video in a mobile feed has only a brief moment to communicate relevance, whereas a search advertisement can respond more directly to an already expressed need. At the awareness stage, a recognizable Nike running-shoe visual and simple brand message might be more suitable than technical specifications. At consideration, a comparison or demonstration of features could help potential buyers evaluate the product. At conversion, a concise offer and direct link to the relevant product page reduce friction.\n\nCreative and distribution are interdependent. A campaign may reach the right people but fail if its message is confusing; equally, a clear message may fail when placed where the audience never encounters it. Teams should test creative variants against the same objective and interpret results using relevant KPIs such as qualified visits or conversions, instead of assuming high impressions imply effective communication.","Exam A-L3":"Inbound marketing is an approach that attracts potential customers by making valuable, relevant content discoverable when they already have a question or need. Instead of first demanding attention through an interruption, inbound marketing provides information people choose to seek out. Its main characteristics include understanding search intent, answering genuine customer questions, using organic search and other discoverable channels, and helping people progress through their decision process. Common inbound activities include SEO-friendly guides, explanatory pages, tutorials, product-comparison content, useful organic posts and newsletters that people voluntarily subscribe to.\n\nFor example, a customer looking for storage solutions might discover IKEA's small-space furnishing ideas through a search engine. The customer initiated the search, and the content can help with a real problem before a purchase decision is made. A practical guide may support awareness and problem definition, while a comparison of wardrobe sizes or features can support consideration. The value of inbound lies in how well the information matches the customer's current job instead of how forcefully it promotes the brand.\n\nOutbound marketing is different because the organization initiates contact by placing or sending a message toward an audience, including people who were not actively looking for that offer. Digital outbound tactics include paid social-feed advertisements, display banners, pre-roll video ads, sponsored placements and promotional pop-ups. For example, a hypothetical Nike running-shoe advertisement shown between unrelated videos is outbound because the message reaches the viewer during another activity. Inbound is especially appropriate for existing information needs; outbound can create awareness before the audience starts searching. Both can support the same customer journey, but their distinction is attraction through usefulness versus proactive or interruptive distribution.","Exam A-L4":"Distribution concerns how a digital campaign's message reaches people: the audience selected, the channels and placements used, and the timing and frequency of exposure. Budget allocation determines how much can be invested in those distribution choices. Neither should be decided independently of the campaign objective. A campaign intended to create awareness needs sufficient relevant reach, whereas a campaign designed to generate immediate purchases needs placements that reach people with purchase intent and provide a straightforward path to conversion.\n\nConsider a hypothetical Nike campaign for a newly introduced running shoe. If its objective is awareness among runners who do not yet know the product, the budget could favor short video placements and relevant social feeds that communicate the shoe's distinctive benefits. The primary concern would be reaching the intended audience with memorable creative. If the objective changes to direct online sales, distribution might shift toward search advertisements responding to specific buying queries and retargeting people who have already viewed the product, with links leading to that shoe's product page. The second campaign would evaluate purchases, conversion rate and acquisition cost instead of treating broad reach as its main success criterion.\n\nBudget planning also requires choices about the cost and likely contribution of each placement, geographic relevance, flight dates and repetition. Allocating too much to a broad audience may waste impressions on people unlikely to act; targeting too narrowly may limit the number of potential customers reached. Frequency needs to be sufficient for recognition without becoming excessive. Marketers should therefore monitor both delivery metrics and outcome-based KPIs, compare channel performance against the objective, and reallocate spending where the evidence indicates better results. Distribution makes the message available, creative makes it intelligible and relevant, and the objective defines what successful performance means.","Exam B-L1":"Objectives define what marketing activity is expected to accomplish and provide a basis for evaluating its effectiveness. A meaningful objective specifies a desired outcome, a measure and a timeframe—for instance, increasing completed course-enquiry forms by 20% over eight weeks. 'Post on TikTok' is an activity or channel choice, not an objective, because it does not identify a customer or business result.\n\nThe marketing funnel helps marketers select objectives appropriate to different stages of the customer journey. A customer at awareness may first need to recognize that an offer exists; a customer at consideration may compare alternatives; someone close to conversion needs enough information and a clear call to action to complete the next step. For example, a university trying to attract prospective students could first aim for qualified awareness of a programme, then visits to programme information pages, and finally submitted applications or enquiries. The KPI at each stage should measure relevant progress instead of unrelated platform activity.\n\nClear objectives also improve strategic decisions about distribution, creative and budget. An awareness goal might justify broad, relevant exposure and recognizable branding; a conversion goal may require a focused audience, persuasive evidence and an easy-to-use landing page. Metrics such as impressions or followers are informative only if their relationship to the objective is understood. That is why objectives must be determined before choosing technology: they let an organization judge not simply whether a campaign ran, but whether it created the intended result.","Exam B-L2":"An SEO audit is a structured evaluation of factors that affect a website’s ability to be discovered, understood and used through organic search. The three complementary components are technical SEO, on-site SEO and off-site SEO. The audit should prioritize issues based on their effect on users and search visibility instead of presenting an unranked list of warnings.\n\nTechnical SEO concerns whether machines and people can access the site reliably. An auditor might check crawlability, indexation, HTTPS, broken links, mobile usability, Core Web Vitals and the XML sitemap. A valuable programme page may remain hard to find if it cannot be crawled or indexed. On-site SEO concerns elements the site owner controls directly: clear and accurate copy, title tags, meta descriptions, heading hierarchy, relevant URLs, alt text, internal links and how well the page answers search intent. For example, a university page about exchange opportunities needs descriptive headings and direct answers instead of unrelated administrative content.\n\nOff-site SEO covers signals created beyond the site, such as relevant backlinks, external mentions, business profiles and reviews. Unlike on-site edits, these are influenced but not fully controlled by the organisation. A trusted university partner linking to a programme page differs from a large number of irrelevant links.\n\nAn effective audit connects findings to consequences and feasible fixes: restore an inaccessible high-priority page, repair broken navigation to essential information, improve weak content that mismatches user intent, and investigate low-quality or missing external signals. Technical access, page relevance and outside credibility reinforce one another.","Exam B-L3":"Outbound marketing means that an organization proactively distributes a promotional message to an audience instead of waiting for people to discover the message through an active search. Its defining characteristic is the push or interruption of attention. The marketer chooses placements and timing to reach people who may not have asked for the advertised information. Digital tactics include paid advertisements in social feeds, pre-roll video, display banners, sponsored content, pop-ups and promotional direct messages where permission and applicable rules allow them.\n\nFor example, a hypothetical Nike advertisement shown during a music-streaming session is outbound because the listener is engaged in music, not actively searching for running shoes. The campaign may introduce a new product to relevant users before they have formed purchase intent. Because outbound advertising competes with what people are already doing, the creative should communicate the proposition quickly, identify the brand and make the next action clear. Distribution decisions determine which audiences and placements are appropriate; measurement must follow the objective, such as qualified visits for a consideration campaign or completed purchases for conversion.\n\nInbound marketing instead earns attention by being useful and findable when the audience already expresses a need. Someone searching for ideas to organize a small bedroom might discover an IKEA room-planning guide; that encounter is initiated by the user's search instead of by an interruptive advertisement. Inbound examples include SEO-friendly how-to articles, helpful website content, organic tutorials and voluntarily received newsletters. The central difference is therefore outbound's initiated contact versus inbound's attraction through relevant information. They can complement each other, but neither is effective merely because it uses a particular platform.","Exam B-L4":"A campaign landing page is a dedicated destination that a person reaches after clicking a specific advertisement or campaign link. Its central function is to connect that advertisement directly to the information and action it promises, with as few unnecessary steps as possible. Sending someone who clicked an advertisement for a specific product to a general homepage forces them to locate the advertised product again. That extra navigation creates friction, increases the chance of confusion and abandonment, and weakens the path to conversion. The campaign link should therefore lead to the relevant product or offer page, where the user can immediately understand the offer and act.\n\nConsistency between advertisement and destination is essential. If a Nike advertisement presents a particular running shoe, the linked page should immediately identify that same model, show the promised information and make its availability and purchase option easy to find. A mismatch in product, price or message makes the visitor question whether they reached the right page. A consistent headline, relevant imagery, accurate details and one clear primary call to action help continue the journey the advertisement began instead of restarting it.\n\nCognitive Load Theory explains why reducing unnecessary navigation and distractions matters. Working memory has limited capacity; requiring users to search through categories, compare unrelated offers or interpret a cluttered page adds extraneous cognitive load. A focused layout puts the relevant product details, price, options and primary action together so the visitor can concentrate on the actual decision. Psychological principles can reinforce this direct journey: credible reviews or transparent delivery information are trust signals that reduce uncertainty when action, while clearly presented benefits help the visitor evaluate the offer. Such cues should support informed choice, not manipulate through invented urgency. The effectiveness of the landing page should ultimately be judged by how well it enables the campaign's desired action, such as completed purchases or sign-ups, instead of by visits alone.","Study-L1":"An objective is a specific result that a marketing activity aims to achieve within a set time period. A key performance indicator (KPI) is a selected measurement used to determine whether that objective is being achieved. A metric is a broader measurement of activity or behaviour that may help explain performance but is not necessarily tied directly to success. The difference is the relationship to the goal: objectives define the result they want, KPIs indicate progress towards it, and supporting metrics help diagnose what happened along the way.\n\nConsider a hypothetical IKEA campaign promoting a new modular shelving unit online. Its objective could be to generate 600 completed online purchases of that unit over six weeks. The primary KPI would be completed purchases attributable to the campaign reporting system; conversion rate and cost per purchase could be additional KPIs if the business also wants to evaluate efficiency. Impressions, video views, ad clicks and product-page visits are useful supporting metrics because they reveal whether people saw the message, expressed interest and reached the page. But reaching 50,000 impressions would not meet the 600-purchase objective if very few people bought the product.\n\nThis distinction also prevents marketers from confusing correlation or platform reporting with genuine effect. A click can be accidental, attribution may assign credit based on a reporting rule, and purchases may rise for reasons unrelated to advertising. Comparing outcomes with a relevant baseline or, when feasible, a controlled group can help estimate extra sales. Selecting KPIs from the objective instead of selecting an objective from the metrics makes it possible to evaluate the campaign on the result it was designed to produce.","Study-L2":"Jobs to Be Done (JTBD) is an approach to customer understanding that focuses on the progress people are trying to make in a particular circumstance. Customers metaphorically 'hire' a product or service to perform a job. Unlike demographic segmentation, which groups people by characteristics such as age or location, JTBD investigates their underlying motivations and situations. Two people in the same age group may seek very different outcomes, while people of different ages may have the same job.\n\nA job can be functional, emotional or social. Consider a hypothetical student choosing Spotify for an upcoming party. The functional job is providing uninterrupted background music and arranging playlists. The emotional job is feeling prepared and reducing worry about awkward silences. The social job is being seen as a good host who understands friends’ tastes. A different customer may 'hire' the same service to concentrate while studying; the product is identical, but the job is different.\n\nJTBD therefore informs product design, messaging and distribution. Instead of assuming that all students want the same playlist features, marketers can create content and experiences suited to different circumstances: collaborative playlists for hosting, focus playlists for studying and downloadable content for travel. The framework helps identify unmet needs and the steps where customers struggle. Its practical value is that decisions start from the customer’s desired progress instead of from superficial demographic labels.","Study-L3":"Inbound marketing attracts people when they actively seek information or value, whereas outbound marketing pushes promotional messages toward an audience that may not have requested them. The difference is the direction of attention. Inbound relies on discoverability and relevance; outbound relies on proactively reaching people through selected placements. Both may serve different stages of the marketing funnel.\n\nIKEA’s room-planning resources provide a useful illustration of inbound: someone searching for small-bedroom storage ideas can discover a guide relevant to their problem. The user initiates the search, and the content helps them evaluate possible solutions. A hypothetical paid Nike advertisement inserted into a music-streaming session illustrates outbound: the person was listening to music instead of asking about running shoes, so the brand initiates contact. Paid social advertisements, pre-roll videos, banners and sponsored placements are common outbound tactics.\n\nInbound is especially useful when customers already have questions, and it can support consideration through guides and comparisons. Outbound can help a new offer become known before customers begin searching. A campaign might combine the two: a paid video creates awareness of a product, while clear website information answers subsequent questions and supports conversion. Neither approach should be selected just because a channel is available; success depends on the objective, the customer’s job, the quality of content and appropriate KPIs. The most effective plan can blend interruption with genuine assistance.","Study-L4":"Search intent refers to what someone wants to accomplish through a search, not merely the words they type. The course distinguishes informational, navigational, commercial and transactional intent. These needs call for different page formats and often correspond to different stages of the marketing funnel.\n\nInformational intent concerns learning: a search such as 'what is OLED?' is best served by a clear explainer or how-to guide and can support awareness. Navigational intent concerns reaching a particular destination: 'IKEA kitchen planner' calls for a direct link to that tool, not a general article about kitchens. Commercial intent concerns evaluating options: 'Samsung versus Apple camera comparison' is better served by a balanced comparison or detailed review and often supports consideration. Transactional intent concerns taking action: 'buy iPhone online' needs a product page with price, availability and an obvious purchasing route near conversion.\n\nA single brand can then need multiple connected pages to serve the same person over time. An early explanatory page can link to comparisons, which can in turn direct visitors to a relevant purchase page. When a site serves the wrong intent—for example, replacing a how-to guide with an aggressive checkout—users may leave because their actual need was not answered. SEO and effective content design begin by matching a user’s job to the information and action offered by a page.","Study-L5":"Cognitive Load Theory explains why information is easier to understand when the demands placed on working memory are managed. Working memory can process only a limited amount of unfamiliar information at once, while long-term memory stores organized knowledge and schemas that make familiar tasks less demanding. Advertising and campaign landing pages should therefore communicate the information necessary for a decision without forcing people to process avoidable distractions.\n\nIntrinsic cognitive load is the inherent complexity of what a person is trying to understand, such as comparing the actual fit, size and technical characteristics of two running shoes. Extraneous cognitive load is unnecessary work caused by poor presentation. For example, an advertisement containing several competing messages, an unclear product name and multiple calls to action makes the viewer work to identify what is being offered. On a landing page, sending visitors through unrelated navigation, separating size information from the purchase controls or repeating the same details in several places increases extraneous load without improving the decision. Related information should be presented together to reduce split attention; repetition should add clarification instead of redundancy.\n\nImagine a hypothetical Nike advertisement for a specific running shoe. A well-designed campaign link opens the matching product page, with recognizable imagery, the stated benefit, available sizes, price and a visible purchasing action. The visitor does not need to locate the model again or decipher several unrelated offers. This reduces unnecessary cognitive effort while preserving the information genuinely needed to choose a size or assess suitability. The purpose of applying Cognitive Load Theory is not to remove all information but to distinguish decision-relevant complexity from avoidable processing demands.","Study-L6":"Search Engine Optimization (SEO) aims to make useful content accessible, understandable and credible in organic search. The course separates it into technical, on-site and off-site SEO, which address different parts of that goal and must be evaluated together.\n\nTechnical SEO covers whether crawlers and users can reach and use the pages. Audit checks include crawlability, indexation, HTTPS, page performance, mobile-friendliness, broken links and sitemaps. On-site SEO covers the content and elements a publisher directly controls: accurate page titles, logical headings, helpful copy, descriptive URLs, image alternative text and internal navigation suited to search intent. Off-site SEO covers outside signals such as relevant backlinks, mentions, reviews and business listings that influence discoverability and perceived authority.\n\nSuppose a university’s exchange-information page has strong content but is excluded from indexing: correcting technical access is essential before on-page improvements can affect search visibility. Suppose the page is accessible but titled only 'Information' and contains unclear headings: on-site changes can clarify its relevance to students researching exchange opportunities. References from legitimate partner universities might strengthen outside credibility. An effective audit does not treat every warning equally; it prioritizes problems by their consequence for finding and completing the user’s job. Search success depends on the interaction of technical access, helpful content and external recognition.","Study-L7":"SEO and GEO address related but distinct discovery environments. SEO improves a page’s accessibility, relevance and visibility in ordinary search results; Generative Engine Optimisation (GEO) aims to make source information sufficiently clear, consistent and structured that answer engines can understand, summarize and potentially cite it. GEO extends instead of replaces SEO because an answer engine still depends on reliable and discoverable information.\n\nAn answer engine may assemble a direct response instead of just provide a list of clickable links. This changes the role of pages: users can receive a summary before visiting the source. An answer block near the top of a page can directly resolve a common question, while supporting paragraphs provide detail. Consistent entities—such as a programme or institution with one canonical name and page—reduce ambiguity. Structured data or markup can help describe what a page contains, but it does not guarantee citation or visibility.\n\nFor example, a university page about programme-specific exchange opportunities can begin by saying clearly whether exchanges are possible, then provide eligibility, partner information and an authoritative contact point. Accurate headings and internal links support SEO; clear, consistent answers and entity information also help GEO. A generated answer should be able to interpret the page without guessing. Neither approach justifies inventing facts, and performance should be assessed through meaningful discovery and user outcomes instead of assuming that every AI mention produces a website visit.","Study-L8":"The marketing funnel describes how a customer's needs and decisions may change from first awareness through consideration, conversion and continued use. It helps marketers define a different objective and suitable call to action (CTA) for each stage. An awareness-stage visitor may need an introduction, while someone ready to purchase needs direct access to the relevant offer; loyalty depends on continuing value after the initial action. Treating every stage as if it required an immediate sale can create mismatched messages and ineffective measurement.\n\nConsider the same hypothetical Duolingo language-learning subscription throughout the journey. At awareness, the objective is to introduce the service to people interested in learning a language; a short demonstration and CTA such as 'See how it works' encourages initial exploration. At consideration, visitors may want to compare lesson features, free access and subscription benefits; a CTA such as 'Compare plans' leads directly to the information needed to decide. At conversion, the objective is a completed account registration or subscription, supported by a clear 'Start learning' or 'Choose this plan' action without unnecessary navigation. After the person begins using the service, loyalty efforts can encourage ongoing learning and appropriate renewal, with repeat learning activity or retention as relevant KPIs.\n\nEach objective therefore requires a different success measure. Relevant reach may support awareness, engaged plan-page visits consideration, completed sign-ups conversion and active continued use retention. The same person may revisit earlier information or skip stages, so the funnel is a planning framework instead of a fixed sequence everyone follows. Its value is aligning communication, calls to action and measurement with the progress the customer needs at that point.","Study-L9":"Programmatic advertising uses automated software to buy and sell digital advertising placements, often through rapid auctions. It can improve the scale and speed of distribution but can also reduce transparency about where an advertisement appeared and how its price was determined. Dark pools refer to less transparent or private parts of that advertising marketplace. In Tim Hwang's subprime attention argument, attention of uncertain or low quality can be traded as though its value were more reliable than evidence justifies.\n\nThe distinction between recorded delivery and genuine response is central. An impression indicates that an ad opportunity was served, not that a person consciously noticed it. Viewability checks whether enough of the creative appeared on a screen for long enough to meet a measurement standard, but even a viewable ad may be ignored. Invalid traffic, including automated or fraudulent clicks, can inflate engagement reports. A campaign can then record thousands of impressions and clicks without generating meaningful customer attention or extra purchases.\n\nAttribution assigns credit for an action to marketing touchpoints using a reporting rule, such as last click; it does not prove that the advertisement caused the outcome. Incrementality instead asks which results occurred because of advertising and would not have occurred otherwise. For example, some people clicking a hypothetical Nike running-shoe advertisement may already have intended to purchase the shoe. Comparing outcomes with an appropriately chosen control group, where feasible, can help estimate extra purchases. A credible evaluation of programmatic advertising so needs attention to placement transparency, fraud, actual customer outcomes and causality instead of treating platform-reported clicks as proof of marketing impact.","Study-L10":"Ethical digital marketing must evaluate more than whether content generates engagement or sales. The course’s five ethical fault lines are identity, privacy, ownership and authorship, credibility and participation. They help identify the different people affected by an activity and the responsibilities created by digital media.\n\nImagine a hypothetical sportswear brand inviting customers to upload transformation photos for a social campaign. Identity concerns how participants present themselves and whether the campaign encourages harmful comparisons. Privacy concerns whether people understand where their images and data will be shown and whether other individuals pictured have consented. Ownership and authorship concern who may reuse the photographs and whether creators are credited. Credibility concerns truthful claims about products and clear disclosure of paid partnerships. Participation concerns the tone and safety of the comments and whether the brand moderates harassment or exclusion.\n\nThese concerns interact with the properties of networked media: online posts can persist, be searchable, scale to unintended audiences and be replicated without its original context. Context collapse may expose a participant’s personal story to employers, relatives or strangers who were never the intended audience. A responsible campaign would explain consent and reuse rights, minimize unnecessary data collection, disclose sponsorships, provide meaningful reporting or moderation tools and avoid manipulative pressure to participate. Ethical quality is not demonstrated by high likes alone. A successful campaign should create value without undermining participants’ autonomy, safety or trust.","25":"Digital marketing measurement determines whether a campaign achieved its intended objective instead of only generating activity on a platform. An objective identifies the business or customer outcome and timeframe, such as increasing completed online orders by 15% in six weeks. Key performance indicators (KPIs) are selected measurements that directly check progress toward that outcome, such as completed orders, conversion rate and cost per acquisition. Other metrics, including impressions, video views or clicks, can help explain campaign performance, but they are not evidence that the objective was achieved unless they are relevant to it.\n\nThe marketing funnel helps determine which measures are appropriate. At awareness, a campaign might aim to increase recognition among a defined audience, supported by measures of qualified reach or brand recall. At consideration, the objective may be to encourage people to evaluate products, making qualified product-page visits, comparison-page engagement or enquiries relevant. At conversion, completed purchases, sign-ups and conversion rates become more important. At retention, repeat purchases or renewals better indicate whether the relationship continues. A KPI is therefore chosen because of the outcome the marketer needs to assess, not simply because an advertising platform happens to report it.\n\nMarketers must also recognize measurement limitations. A served impression does not prove attention, a click does not prove purchase, and high follower counts can be vanity metrics when the objective is sales. Attribution assigns credit to touchpoints, but even a last-click sale may have happened without the advertisement. Incrementality instead asks what additional result advertising caused compared with a relevant baseline or control group. For example, if an online retailer reports higher shoe sales during a campaign, those sales must be evaluated against expected demand before they are all attributed to the ads. Clear objectives and suitable KPIs make marketing results interpretable while supporting decisions about creative and distribution.","26":"Creative is the content of an advertisement: its message, visual and audio elements, format, branding and call to action. It matters because purchasing distribution does not mean that people will notice, understand or respond to an ad. Effective creative communicates one clear proposition, helps the audience recognize the brand and makes the next step understandable. Cognitive Load Theory is relevant here: when an ad contains competing claims, tiny text and too many calls to action, limited working memory is burdened with unnecessary processing.\n\nCreative must be adapted to both the audience’s situation and the campaign objective. A short vertical video in a mobile feed has only a brief moment to communicate relevance, whereas a search advertisement can respond more directly to an already expressed need. At the awareness stage, a recognizable Nike running-shoe visual and simple brand message might be more suitable than technical specifications. At consideration, a comparison or demonstration of features could help potential buyers evaluate the product. At conversion, a concise offer and direct link to the relevant product page reduce friction.\n\nCreative and distribution are interdependent. A campaign may reach the right people but fail if its message is confusing; equally, a clear message may fail when placed where the audience never encounters it. Teams should test creative variants against the same objective and interpret results using relevant KPIs such as qualified visits or conversions, instead of assuming high impressions imply effective communication.","27":"Inbound marketing is an approach that attracts potential customers by making valuable, relevant content discoverable when they already have a question or need. Instead of first demanding attention through an interruption, inbound marketing provides information people choose to seek out. Its main characteristics include understanding search intent, answering genuine customer questions, using organic search and other discoverable channels, and helping people progress through their decision process. Common inbound activities include SEO-friendly guides, explanatory pages, tutorials, product-comparison content, useful organic posts and newsletters that people voluntarily subscribe to.\n\nFor example, a customer looking for storage solutions might discover IKEA's small-space furnishing ideas through a search engine. The customer initiated the search, and the content can help with a real problem before a purchase decision is made. A practical guide may support awareness and problem definition, while a comparison of wardrobe sizes or features can support consideration. The value of inbound lies in how well the information matches the customer's current job instead of how forcefully it promotes the brand.\n\nOutbound marketing is different because the organization initiates contact by placing or sending a message toward an audience, including people who were not actively looking for that offer. Digital outbound tactics include paid social-feed advertisements, display banners, pre-roll video ads, sponsored placements and promotional pop-ups. For example, a hypothetical Nike running-shoe advertisement shown between unrelated videos is outbound because the message reaches the viewer during another activity. Inbound is especially appropriate for existing information needs; outbound can create awareness before the audience starts searching. Both can support the same customer journey, but their distinction is attraction through usefulness versus proactive or interruptive distribution.","28":"Distribution concerns how a digital campaign's message reaches people: the audience selected, the channels and placements used, and the timing and frequency of exposure. Budget allocation determines how much can be invested in those distribution choices. Neither should be decided independently of the campaign objective. A campaign intended to create awareness needs sufficient relevant reach, whereas a campaign designed to generate immediate purchases needs placements that reach people with purchase intent and provide a straightforward path to conversion.\n\nConsider a hypothetical Nike campaign for a newly introduced running shoe. If its objective is awareness among runners who do not yet know the product, the budget could favor short video placements and relevant social feeds that communicate the shoe's distinctive benefits. The primary concern would be reaching the intended audience with memorable creative. If the objective changes to direct online sales, distribution might shift toward search advertisements responding to specific buying queries and retargeting people who have already viewed the product, with links leading to that shoe's product page. The second campaign would evaluate purchases, conversion rate and acquisition cost instead of treating broad reach as its main success criterion.\n\nBudget planning also requires choices about the cost and likely contribution of each placement, geographic relevance, flight dates and repetition. Allocating too much to a broad audience may waste impressions on people unlikely to act; targeting too narrowly may limit the number of potential customers reached. Frequency needs to be sufficient for recognition without becoming excessive. Marketers should therefore monitor both delivery metrics and outcome-based KPIs, compare channel performance against the objective, and reallocate spending where the evidence indicates better results. Distribution makes the message available, creative makes it intelligible and relevant, and the objective defines what successful performance means.","Study-S1":"A KPI is a selected measure linked directly to a marketing objective; a general metric describes activity without necessarily showing success. If the objective is to increase purchases, conversion rate is a KPI while total page views may be a supporting metric.","Study-S2":"Demographic segmentation categorizes people by characteristics such as age or income. JTBD categorizes them by the progress they want in a particular situation, including functional, emotional and social motivations; the same demographic group may have different jobs.","Study-S3":"Working memory consciously processes a limited amount of unfamiliar information at once. Long-term memory stores organized knowledge and schemas that make familiar information easier to understand and retrieve.","Study-S4":"Three examples are: increase completed purchases from 200 to 260 per month, raise the product-page conversion rate from 2% to 3% during a campaign, and gain 100 completed newsletter sign-ups in four weeks. Each specifies a measurable action and period.","Study-S5":"Launching a campaign on TikTok is a channel or activity, not a measurable customer or business outcome. A valid objective states the result sought, for example gaining 150 qualified registrations from the campaign within six weeks.","Study-S6":"Outbound pushes promotional messages to an audience, sometimes interrupting an activity; examples include paid feed and pre-roll ads. Inbound attracts people through content they deliberately seek, such as an SEO-friendly how-to guide.","Study-S7":"Informational: seeking knowledge. Navigational: trying to reach a known site or page. Commercial: comparing or evaluating options before a decision. Transactional: ready to buy, register, book or download.","Study-S8":"Comparisons and reviews normally fit commercial investigation intent. How-to guides fit informational intent. A clear checkout page fits transactional intent.","Study-S9":"Technical SEO makes a site crawlable, indexable, secure and usable. On-site SEO improves copy, metadata, headings, images and internal links on the site. Off-site SEO involves links, mentions and reputation signals from elsewhere.","Study-S10":"A meta title is a concise page title that may appear as a search-result headline. A meta description is a short summary that may appear under it. Both should accurately describe the page and help users evaluate whether to click, although search engines may rewrite the snippets.","Study-S11":"GEO, Generative Engine Optimisation, aims to make accurate content clear and structured enough for answer engines to understand and cite. It complements instead of replaces SEO, which supports accessibility and visibility in traditional search results.","Study-S12":"A call to action (CTA) is an instruction that asks a visitor to take the next step. 'Buy this model' can support an objective of completed product purchases, while 'Download the sizing guide' can support an objective of generating guide downloads or helping shoppers evaluate the product before buying.","Study-S13":"A vanity metric is an impressive-looking count, such as followers or page views, that may not indicate progress toward the actual objective. A campaign can gain followers while generating no extra purchases.","Study-S14":"Brand identity is how an organization intends the brand to be perceived, expressed through its chosen positioning and assets. Brand image is how audiences actually perceive it; the two can differ.","Study-S15":"Attribution applies a rule for assigning credit for a sale or action to marketing touchpoints. Incrementality examines what additional outcome was caused by advertising compared with what would have happened without it; attribution alone cannot establish causality."};</script>
<script>const TERMS=window.TERMS;
const KEY='dm-mastery-v1';
const today=()=>new Date().toISOString().slice(0,10);
let state=JSON.parse(localStorage.getItem(KEY)||'{}');state.cards||={};state.session||={correct:0,attempts:0};
let view='dashboard',filter='all',search='',queue=[],idx=0,flipped=false,mode='learn',answered=false,currentOptions=[];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const row=t=>state.cards[t.id]||{stage:0,due:'2000-01-01',seen:0,correct:0,wrong:0};
const known=t=>row(t).stage>=4;
const due=t=>row(t).due<=today();
const matches=t=>(filter==='all'||t.lecture.startsWith('Lecture '+filter+' '))&&(`${t.term} ${t.definition} ${t.explanation}`).toLowerCase().includes(search.toLowerCase());
const eligible=()=>TERMS.filter(matches);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function rating(t,grade){let r=row(t), stages=[0,1,2,4,8,15,30,60];let stage=grade===0?Math.max(0,r.stage-1):grade===1?Math.max(1,r.stage):Math.min(7,r.stage+1);r={...r,stage,due:new Date(Date.now()+(grade===0?0:stages[stage])*86400000).toISOString().slice(0,10),seen:r.seen+1,correct:r.correct+(grade>0?1:0),wrong:r.wrong+(grade===0?1:0),last:today()};state.cards[t.id]=r;state.session.attempts++;state.session.correct+=grade>0?1:0;save();}
function filters(){return `<div class="selectWrap"><label for="lecture">LECTURE</label><select id="lecture"><option value="all">All lectures (156)</option>${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${filter==i+1?'selected':''}>Lecture ${i+1} · ${TERMS.filter(t=>t.lecture.startsWith('Lecture '+(i+1)+' ')).length} terms</option>`).join('')}</select></div>`}
function nav(){let items=[['dashboard','Overview','◈'],['learn','Study cards','▤'],['recall','Active recall','◎'],['quiz','Quick quiz','✦'],['essay','Exam writing','✎'],['past','Exam questions (61)','☷'],['lectures','Audio lectures','◖'],['library','All 156 terms','≡']];return `<aside><div class="brand"><span class="brandmark">m.</span><div>memory<span>lab</span><small>DIGITAL MARKETING</small></div></div><div class="sideLabel">WORKSPACE</div><nav>${items.map(([v,n,icon])=>`<button class="nav ${view===v?'on':''}" data-view="${v}"><span class="ni">${icon}</span>${n}</button>`).join('')}</nav><div class="sideFoot"><div class="miniLabel">TODAY'S FOCUS</div><strong>${TERMS.filter(t=>due(t)&&!known(t)).length} cards waiting</strong><div class="meter"><span style="width:${Math.round(100*TERMS.filter(known).length/156)}%"></span></div><small>${TERMS.filter(known).length} of 156 mastered</small></div></aside>`}
function shell(html,title,desc){$('#app').innerHTML=`${nav()}<main><header><div><div class="eyebrow">YOUR PERSONAL STUDY SPACE / 2026</div><h1>${title}</h1><p class="sub">${desc}</p></div><div class="headerRight"><span class="datepill">● &nbsp; Progress saved locally</span>${filters()}</div></header><section class="content">${html}</section></main>`;$$('[data-view]').forEach(b=>b.onclick=()=>{clearLectureAudio();view=b.dataset.view;queue=[];idx=0;flipped=false;render()});$('#lecture').onchange=e=>{clearLectureAudio();filter=e.target.value;queue=[];idx=0;render()};}
function dashboard(){let learned=TERMS.filter(t=>row(t).seen>0).length,mastered=TERMS.filter(known).length,upcoming=TERMS.filter(t=>due(t)&&row(t).seen>0).length;let cards=`<div class="stats"><div class="stat"><span class="statTitle">TOTAL COVERAGE</span><strong>${learned}<em>/156</em></strong><p>Terms practiced at least once</p></div><div class="stat"><span class="statTitle">MASTERED</span><strong>${mastered}<em>/156</em></strong><p>At spaced repetition stage 4+</p></div><div class="stat"><span class="statTitle">READY FOR REVIEW</span><strong>${upcoming}</strong><p>Previously studied cards due today</p></div><div class="stat"><span class="statTitle">ANSWER ACCURACY</span><strong>${state.session.attempts?Math.round(state.session.correct/state.session.attempts*100):0}<em>%</em></strong><p>${state.session.attempts} self-assessed answers</p></div></div>`;
let modules=Array.from({length:8},(_,i)=>{let a=TERMS.filter(t=>t.lecture.startsWith('Lecture '+(i+1)+' ')),m=a.filter(known).length;return `<button class="module" data-module="${i+1}"><div class="moduleTop"><span>MODULE 0${i+1}</span><span>${m}/${a.length} mastered ↗</span></div><h3>${esc(a[0].lecture.split(' · ')[1])}</h3><div class="meter"><span style="width:${m/a.length*100}%"></span></div></button>`}).join('');shell(`${cards}<div class="mainGrid"><div><div class="secHead"><h2>Choose your study mode</h2><span>ACTIVE LEARNING</span></div><div class="modeGrid"><button class="modeTile" data-go="learn"><span class="icon">▤</span><b>Understand it</b><span>Read definitions, explanations and course examples.</span><small>01 / STUDY CARDS ↗</small></button><button class="modeTile" data-go="recall"><span class="icon">◎</span><b>Retrieve it</b><span>Recall answers before revealing them, and grade yourself.</span><small>02 / ACTIVE RECALL ↗</small></button><button class="modeTile" data-go="quiz"><span class="icon">✦</span><b>Test it</b><span>Choose answers without hints and spot misconceptions.</span><small>03 / QUICK QUIZ ↗</small></button><button class="modeTile" data-go="essay"><span class="icon">✎</span><b>Explain it</b><span>Write exam-style answers, then compare against the source.</span><small>04 / EXAM WRITING ↗</small></button></div></div><div class="panel note"><div class="secHead"><h2>The mastery method</h2></div><p><b>Recognizing an answer is not the same as knowing it by heart.</b> Move through four levels:</p><div class="steps"><div><i>1</i><span>Read and understand</span></div><div><i>2</i><span>Recall without looking</span></div><div><i>3</i><span>Explain in your own words</span></div><div><i>4</i><span>Repeat after a delay</span></div></div><p class="muted">Use <b>Again</b> for missed questions. Your progress is stored in this browser; no account required.</p></div></div><div class="secHead"><h2>All eight lectures</h2><span>CLICK TO STUDY</span></div><div class="moduleGrid">${modules}</div><div class="bottomButtons"><button class="ghost" id="export">Export progress (.json)</button><button class="ghost" id="import">Import progress</button><input id="importFile" type="file" accept="application/json" hidden><button class="ghost danger" id="reset">Reset all progress</button></div>`, 'Know it. By heart.','156 concepts. Eight lectures. One place to master every single one.');$$('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;render()});$$('[data-module]').forEach(b=>b.onclick=()=>{filter=b.dataset.module;view='learn';render()});$('#export').onclick=()=>download('marketing-progress.json',JSON.stringify(state,null,2));$('#import').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{let o=JSON.parse(await e.target.files[0].text());if(!o.cards||typeof o.cards!=='object')throw Error();state=o;save();render()}catch{alert('Not a valid progress file.')}};$('#reset').onclick=()=>{if(confirm('Delete ALL saved progress on this device?')){state={cards:{},session:{correct:0,attempts:0}};save();render()}}}

 shell(`${crumbs}<div class="lecturePlayer"><div class="tinyLabel">AUDIO LESSON · LECTURE ${chosenLecture}</div><h2>${esc(g.name)}</h2><p>${g.ids.length} connected terms · ${Math.max(2,Math.round(lectureParts.join(' ').split(/\s+/).length/140))} min approx. · Full transcript below</p><div class="lectureControls"><button class="primary" id="lecturePlay">▶ Play lesson</button><button id="lecturePause">Ⅱ Pause / Resume</button><button id="lectureStop">■ Stop</button><button id="lectureBack">↶ Previous section</button><button id="lectureNext">Next section ↷</button><label for="lectureVoiceSelect">Voice</label><select id="lectureVoiceSelect" aria-label="Choose the narrator voice" style="max-width:230px"><option value="">Loading voices…</option></select><button id="lecturePreview">▶ Preview voice</button><label for="lectureSpeed">Speed</label><select id="lectureSpeed"><option value="0.8">0.8×</option><option value="0.93">0.93×</option><option value="1">1×</option><option value="1.1">1.1×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option></select><label for="lecturePitch">Pitch</label><select id="lecturePitch"><option value="0.85">Deeper</option><option value="0.93">Slightly deeper</option><option value="1">Normal</option><option value="1.08">Higher</option></select></div><div id="lectureStatus" class="lectureStatus">${supported?'Ready to play. Choose or preview a voice. Available voices depend on macOS and Safari.':'Speech playback is not supported in this browser. The transcript is available below.'}</div><h3>Study these terms</h3><div class="lectureTerms">${tags}</div><div class="lectureTranscript" id="lectureTranscript">${transcript}</div></div>`,g.name,'Listen to a connected lesson and revisit each concept afterwards.');
 $('#lectureHome').onclick=()=>{clearLectureAudio();chosenLecture=0;chosenCluster=-1;lectureParts=[];lectureShow()};$('#lectureClusters').onclick=()=>{clearLectureAudio();chosenCluster=-1;lectureParts=[];lectureShow()};
 populateLectureVoices();
 $('#lectureVoiceSelect').onchange=e=>{lectureVoice=e.target.value;localStorage.setItem('memorylab-lecture-voice',lectureVoice);if(lectureSpeaking){clearLectureAudio();lectureSpeak()}};
 $('#lecturePreview').onclick=()=>{clearLectureAudio();const u=new SpeechSynthesisUtterance('Hello. I will guide you through your digital marketing lecture, using clear explanations and memorable examples.');u.lang='en-GB';u.rate=lectureRate;u.pitch=lecturePitch;const voice=preferredLectureVoice();if(voice)u.voice=voice;speechSynthesis.speak(u);$('#lectureStatus').textContent='Playing voice preview. Press Play lesson to begin.';};
 $('#lecturePitch').value=String(lecturePitch);
 $('#lecturePitch').onchange=e=>{lecturePitch=Number(e.target.value);localStorage.setItem('memorylab-lecture-pitch',String(lecturePitch));if(lectureSpeaking){clearLectureAudio();lectureSpeak()}};
 $('#lectureSpeed').value=String(lectureRate);
 $('#lectureSpeed').onchange=e=>{lectureRate=Number(e.target.value);if(lectureSpeaking){clearLectureAudio();lectureSpeak()}};
 $('#lecturePlay').onclick=()=>{clearLectureAudio();lecturePart=0;lectureSpeak()};
 $('#lecturePause').onclick=()=>{if(!supported)return;if(lectureSpeaking&&!lecturePaused){speechSynthesis.pause();lecturePaused=true;$('#lectureStatus').textContent='Paused.'}else if(lecturePaused){speechSynthesis.resume();lecturePaused=false;$('#lectureStatus').textContent='Playing.'}else{lectureSpeak()}};
 $('#lectureStop').onclick=()=>{clearLectureAudio();$('#lectureStatus').textContent='Stopped.'};
 $('#lectureBack').onclick=()=>{clearLectureAudio();lecturePart=Math.max(0,lecturePart-1);lectureSpeak()};
 $('#lectureNext').onclick=()=>{clearLectureAudio();lecturePart=Math.min(lectureParts.length-1,lecturePart+1);lectureSpeak()};
 $$('[data-lecturepart]').forEach(el=>el.onclick=()=>{clearLectureAudio();lecturePart=Number(el.dataset.lecturepart);lectureSpeak()});
 $$('[data-termlearn]').forEach(b=>b.onclick=()=>{clearLectureAudio();view='learn';filter='all';queue=[Number(b.dataset.termlearn)];idx=0;render()});
}
function lectureSpeak(){
 if(!('speechSynthesis' in window))return;
 if(view!=='lectures'||chosenCluster<0||lecturePart>=lectureParts.length)return;
 const synth=window.speechSynthesis,part=lecturePart,u=new SpeechSynthesisUtterance(lectureParts[part]);u.lang='en-GB';u.rate=lectureRate;u.pitch=lecturePitch;
 const v=preferredLectureVoice();if(v)u.voice=v;
 lectureSpeaking=true;lecturePaused=false;
 $$('.lectureSegment').forEach((e,i)=>e.classList.toggle('active',i===part));
 const active=$$('.lectureSegment')[part];if(active){const box=active.closest('.lectureTranscript');if(box){const relative=active.getBoundingClientRect().top-box.getBoundingClientRect().top+box.scrollTop;box.scrollTo({top:Math.max(0,relative-24),behavior:reducedMotion()?'instant':'smooth'})}}
 $('#lectureStatus').textContent=`Playing section ${part+1} of ${lectureParts.length}`;
 u.onend=()=>{if(view!=='lectures'||chosenCluster<0||!lectureSpeaking||lecturePart!==part)return;lecturePart++;if(lecturePart<lectureParts.length)lectureSpeak();else{lectureSpeaking=false;$('#lectureStatus').textContent='Lesson complete. Try explaining the topic without looking!'}};
 u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled'){lectureSpeaking=false;let status=$('#lectureStatus');if(status)status.textContent='Audio could not play. You can still read the transcript.'}};
 synth.speak(u);
}

let lastRenderView='',lastRenderCard=null,lastRenderTest='';
const reducedMotion=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function smoothTop(){window.scrollTo({top:0,behavior:reducedMotion()?'instant':'smooth'})}
function render(){
 const oldY=window.scrollY;
 const activeCard=['learn','recall','quiz','essay'].includes(view)?queue[idx]:null;
 const testId=view==='past'?(selectedTest?.id||'list')+':'+testIndex+':'+testDone:'';
 const moved=(view!==lastRenderView||activeCard!==lastRenderCard||testId!==lastRenderTest);
 if(view==='dashboard')dashboard();else if(view==='library')library();else if(view==='past')pastExam();else if(view==='lectures')lectureShow();else study();
 lastRenderView=view;lastRenderCard=activeCard;lastRenderTest=testId;
 requestAnimationFrame(()=>{if(moved)smoothTop();else window.scrollTo({top:oldY,behavior:'instant'})});
}
window.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT','SELECT'].includes(document.activeElement?.tagName))return;if(['learn','recall','quiz','essay'].includes(view)){if(e.key==='ArrowRight')advance(1);if(e.key==='ArrowLeft')advance(-1);if(e.key===' ' && $('#reveal')){e.preventDefault();$('#reveal').click()}}});render();

// Guided, independent tests: each sitting is deliberately short.
const EXAMS=window.EXAM_QUESTIONS;
const by=(k)=>EXAMS.filter(q=>q.kind===k);
const MC=by('mcq'), SHORT=by('short').filter(q=>!q.source), LONG_A=by('long').filter(q=>q.source==='Exam A'), LONG_B=by('long').filter(q=>q.source==='Exam B');
const EXTRA_S=by('short').filter(q=>q.source?.startsWith('Additional'));
const EXTRA_L=by('long').filter(q=>q.source?.startsWith('Additional'));
const TESTS=[
 {id:'past-a-1',title:'Past Exam A · Part 1',subtitle:'Past-paper questions · shorter sitting',type:'Past exam',questions:[...MC.slice(0,9),...SHORT.slice(0,3),...LONG_A.slice(0,2)]},
 {id:'past-a-2',title:'Past Exam A · Part 2',subtitle:'Past-paper questions · shorter sitting',type:'Past exam',questions:[...MC.slice(9),...SHORT.slice(3),...LONG_A.slice(2)]},
 {id:'past-b-1',title:'Past Exam B · Part 1',subtitle:'Shared core questions + Exam B essay questions',type:'Past exam',questions:[...MC.slice(0,9),...SHORT.slice(0,3),...LONG_B.slice(0,2)]},
 {id:'past-b-2',title:'Past Exam B · Part 2',subtitle:'Shared core questions + Exam B essay questions',type:'Past exam',questions:[...MC.slice(9),...SHORT.slice(3),...LONG_B.slice(2)]},
 ...Array.from({length:5},(_,i)=>({id:'practice-'+(i+1),title:'Practice Test '+(i+1),subtitle:'Course-aligned practice · not an original exam',type:'Practice',questions:[...MC.slice((i*3)%18,(i*3)%18+3),...EXTRA_S.slice(i*3,i*3+3),...EXTRA_L.slice(i*2,i*2+2)]}))
];
let selectedTest=null,testIndex=0,testDone=false;
let examDrafts=JSON.parse(localStorage.getItem('dm-exam-drafts-v1')||'{}');
let testScores=JSON.parse(localStorage.getItem('dm-test-results-v2')||'{}');
let testAnswers=JSON.parse(localStorage.getItem('dm-test-answers-v2')||'{}');
let testProgress=JSON.parse(localStorage.getItem('dm-test-progress-v3')||'{}');
function testSave(){localStorage.setItem('dm-test-answers-v2',JSON.stringify(testAnswers));localStorage.setItem('dm-exam-drafts-v1',JSON.stringify(examDrafts));localStorage.setItem('dm-test-progress-v3',JSON.stringify(testProgress))}
function testKey(q){return (q.source||'common')+'-'+q.number}
function answerKey(q){return q.answer||''}
function answerId(test,q){return test.id+'|'+testKey(q)}
function savedAnswer(test,q){let k=answerId(test,q);return q.kind==='mcq'?testAnswers[k]:examDrafts[k]}
function isTestAnswered(test,q){let val=savedAnswer(test,q);return typeof val==='string'&&val.trim().length>0}
function testStats(t){
 const mcq=t.questions.filter(q=>q.kind==='mcq'),written=t.questions.filter(q=>q.kind!=='mcq');
 const marked=mcq.filter(q=>isTestAnswered(t,q)), correct=marked.filter(q=>savedAnswer(t,q)===answerKey(q)),wrote=written.filter(q=>isTestAnswered(t,q));
 return {mcqTotal:mcq.length,mcqAnswered:marked.length,correct:correct.length,incorrect:marked.length-correct.length,mcqBlank:mcq.length-marked.length,writtenTotal:written.length,writtenAnswered:wrote.length,writtenBlank:written.length-wrote.length,allAnswered:marked.length===mcq.length&&wrote.length===written.length};
}
function modelText(q){return String(window.EXAM_MODEL_KEYS?.[String(q.number)]||'No verified model answer is available for this question yet.')}
function modelParagraphs(q){return modelText(q).split(/\n\s*\n/).map(p=>'<p>'+esc(p.trim())+'</p>').join('')}
function startTest(t){
 const result=testScores[t.id];
 if(result){
  if(!confirm('Start a new attempt? This resets the answers to this test only. Your other progress will stay saved.'))return;
  for(const q of t.questions){delete testAnswers[answerId(t,q)];delete examDrafts[answerId(t,q)];}
  delete testScores[t.id];delete testProgress[t.id];testSave();
 }
 selectedTest=t;testIndex=Math.min(testProgress[t.id]?.index||0,t.questions.length-1);testDone=false;testProgress[t.id]={index:testIndex,started:true};testSave();pastExam();
}
function testList(){
 selectedTest=null;testDone=false;
 const cards=TESTS.map(t=>{let counts={mcq:0,short:0,long:0};t.questions.forEach(q=>counts[q.kind]++);
 const prev=testScores[t.id],stat=testStats(t),inProgress=!prev&&!!testProgress[t.id];
 const status=prev?(prev.allAnswered?'FINISHED':'FINISHED WITH BLANKS'):inProgress?'IN PROGRESS':'READY';
 const button=prev?'Retake test →':inProgress?'Continue test →':'Start test →';
 return `<article class="bigCard" style="padding:24px;margin:0"><div class="cardMeta"><span>${esc(t.type.toUpperCase())}</span><span>${status}</span></div><h3 style="margin:8px 0">${esc(t.title)}</h3><p class="muted">${esc(t.subtitle)}</p><p><b>${t.questions.length} questions</b> · ${counts.mcq} multiple choice · ${counts.short} short answers · <b>${counts.long} essays</b></p><p class="muted">About ${counts.mcq*1+counts.short*3+counts.long*12} minutes${prev?' · '+stat.correct+' MCQ correct, '+stat.writtenAnswered+'/'+stat.writtenTotal+' written submitted':''}</p><button class="primary" data-start-test="${t.id}">${button}</button>${prev?`<button class="miniButton" data-review-test="${t.id}" style="margin-left:8px">View facit / results</button>`:''}</article>`;}).join('');
 shell(`<div class="panel note" style="margin-bottom:22px"><h2 style="margin-top:0">Choose a test.</h2><p>Each test includes a manageable mix of multiple-choice, short-answer and essay questions. <b>Blank answers are never counted as correct.</b> After finishing, open the full facit and compare your own written responses with course-based model answers (not an official marking guide).</p></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px">${cards}</div>`, 'Exam practice','Separate tests, honest scoring and complete answer keys.');
 $$('[data-start-test]').forEach(b=>b.onclick=()=>startTest(TESTS.find(t=>t.id===b.dataset.startTest)));
 $$('[data-review-test]').forEach(b=>b.onclick=()=>{selectedTest=TESTS.find(t=>t.id===b.dataset.reviewTest);testDone=true;pastExam()});
}
function renderTestResults(t){
 const stats=testStats(t);
 const mcqStatus=stats.mcqTotal?`${stats.correct} / ${stats.mcqTotal} multiple-choice correct (${stats.mcqAnswered} answered, ${stats.incorrect} incorrect, ${stats.mcqBlank} unanswered)`:'No multiple-choice questions in this test';
 const writtenStatus=`${stats.writtenAnswered} / ${stats.writtenTotal} written answers submitted (${stats.writtenBlank} unanswered; written answers are not automatically graded)`;
 testScores[t.id]={...stats,date:new Date().toISOString()};localStorage.setItem('dm-test-results-v2',JSON.stringify(testScores));
 const review=t.questions.map((q,index)=>{
  const a=savedAnswer(t,q),has=isTestAnswered(t,q),isMCQ=q.kind==='mcq',good=has&&isMCQ&&a===q.answer;
  const status=!has?'UNANSWERED':isMCQ?(good?'CORRECT':'INCORRECT'):'WRITTEN · SELF-REVIEW';
  const mine=has?esc(a):'<em>Blank — no answer submitted.</em>';
  const answer=isMCQ?`<p><b>Correct answer:</b> ${esc(q.answer)}</p><p>${esc(modelText(q))}</p>`:`<div class="modelAnswer"><h4 style="margin:10px 0">Suggested model answer (course-based, not official exam key)</h4>${modelParagraphs(q)}</div>`;
  return `<details class="exam-review" style="margin:12px 0;padding:15px;border:1px solid #8eafbb;border-radius:12px;background:#f5fbff" ${!has?'open':''}><summary style="cursor:pointer;line-height:1.5"><span class="tinyLabel">${status}</span> &nbsp; <b>Q${index+1} · ${q.kind==='mcq'?'Multiple choice':q.kind==='long'?'Essay':'Short answer'}</b> &nbsp; ${esc(q.prompt)}</summary><div style="padding-top:14px"><h4 style="margin:0 0 8px">Your answer</h4><p style="white-space:pre-wrap">${mine}</p><div style="height:1px;background:#b9d4db;margin:18px 0"></div><h4 style="margin:0 0 10px">Facit</h4>${answer}${isMCQ?'':`<p class="muted" style="margin:14px 0 0">This is a suggested course-based answer, not an official examiner’s grading key. Compare content and reasoning rather than exact wording.</p>`}</div></details>`;
 }).join('');
 shell(`<article class="bigCard"><span class="tinyLabel">${stats.allAnswered?'TEST FINISHED':'ATTEMPT FINISHED · SOME ANSWERS BLANK'}</span><h2>${esc(t.title)}</h2><div class="panel" style="background:#ecf8ff;margin:18px 0;border-color:#b9d5e1"><h3 style="margin:0 0 12px">Your result</h3><p><b>Multiple choice:</b> ${mcqStatus}.</p><p><b>Written responses:</b> ${writtenStatus}.</p>${!stats.allAnswered?`<p style="color:#802f30"><b>Incomplete:</b> ${stats.mcqBlank+stats.writtenBlank} question(s) left blank. This is NOT a perfect or fully marked test score.</p>`:''}<p class="muted">The score only reflects multiple-choice questions. A blank or ungraded essay is never treated as correct.</p></div><div class="secHead"><h2>Facit · all ${t.questions.length} questions</h2><button class="miniButton" id="toggleFacit">Expand all answers</button></div>${review}<div class="pager"><button class="primary" id="allTests">← Choose another test</button><button id="retryTest">Retake this test →</button></div></article>`,'Test results and facit','Correct choices, explanations and complete suggested written answers.');
 $('#allTests').onclick=testList;$('#retryTest').onclick=()=>startTest(t);
 let expanded=false;$('#toggleFacit').onclick=()=>{expanded=!expanded;$$('.exam-review').forEach(d=>d.open=expanded);$('#toggleFacit').textContent=expanded?'Collapse all':'Expand all answers'};
}
function pastExam(){
 if(!selectedTest){testList();return}
 const t=selectedTest,list=t.questions;
 if(testDone){renderTestResults(t);return}
 const q=list[testIndex],key=answerId(t,q),saved=savedAnswer(t,q),mcq=q.kind==='mcq';
 const options=mcq?`<div class="options">${q.options.map((a,i)=>`<button data-examopt="${i}" aria-pressed="${saved===a}" class="option ${saved===a?'chosen':''}" style="${saved===a?'background:#d5f0fc;border:2px solid #166c91;color:#083753;':''}">${esc(a)}</button>`).join('')}</div><p class="muted">Choose an answer. The correct option and explanation will appear in the facit after you finish.</p>`:`<textarea id="examWriting" style="min-height:${q.kind==='long'?'230px':'140px'}" placeholder="Write your answer here. Blank answers are counted as unanswered.">${esc(examDrafts[key]||'')}</textarea><p class="muted">${q.kind==='long'?'Essay response — you can compare it to a full model answer in the facit after submitting.':'Short answer — see the suggested answer after completing the test.'}</p>`;
 const done=testIndex===list.length-1,stat=testStats(t);
 shell(`<div class="studyTools"><button class="miniButton" id="backTests">← All tests</button><div class="pill">${esc(t.title)}</div><div class="spacer"></div><div class="pill">QUESTION ${testIndex+1} / ${list.length}</div></div><div style="height:7px;background:#e6e9ed;border-radius:20px;margin:0 0 20px;overflow:hidden"><div style="height:100%;width:${(testIndex+1)/list.length*100}%;background:#397a75"></div></div><div class="studyLayout"><article class="bigCard"><div class="cardMeta"><span>${esc(q.source||t.type)} · ${mcq?'MULTIPLE CHOICE':q.kind==='long'?'ESSAY':'SHORT ANSWER'}</span><span>QUESTION ${testIndex+1}</span></div><h2 style="font-size:clamp(19px,2vw,27px)">${esc(q.prompt)}</h2>${options}<div class="pager"><button id="examPrev" ${testIndex===0?'disabled':''}>← Previous</button><button class="primary" id="examNext">${done?'Finish test & open facit →':'Next question →'}</button></div></article><aside class="studyAside"><h3>One test at a time</h3><p><b>${stat.mcqAnswered+stat.writtenAnswered} of ${list.length}</b> questions answered.</p><p>${stat.mcqBlank+stat.writtenBlank} still blank. An unanswered question will not be marked correct.</p><div class="asideRule"></div><p>The answer key and developed model answers appear <b>after</b> you finish the test. Your responses are saved as you go.</p></aside></div>`,t.title,'Focused exam practice — answer first, check the facit afterwards.');
 $('#backTests').onclick=testList;
 $('#examPrev').onclick=()=>{testIndex--;testProgress[t.id]={index:testIndex,started:true};testSave();pastExam();smoothTop()};
 $('#examNext').onclick=()=>{if(done){const s=testStats(t),missing=s.mcqBlank+s.writtenBlank;if(missing&&!confirm(`You have ${missing} unanswered question(s). Submit this incomplete attempt and open the facit anyway?`))return;testDone=true;}else{testIndex++;testProgress[t.id]={index:testIndex,started:true};testSave();}pastExam();smoothTop()};
 $$('[data-examopt]').forEach(b=>b.onclick=()=>{testAnswers[key]=q.options[Number(b.dataset.examopt)];testSave();pastExam()});
 if($('#examWriting'))$('#examWriting').oninput=e=>{examDrafts[key]=e.target.value;testSave()};
}
</script><!-- MemoryLab v2026.10.19 complete-college-responses -->
