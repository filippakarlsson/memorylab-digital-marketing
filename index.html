ses generative AI to draft several descriptions of an IKEA-style table. The model produces plausible wording from learned patterns, not independently verified product measurements. Human review is needed to catch invented materials, sizes or warranties. Generative AI can accelerate content creation, but the speed advantage is valuable only when accuracy, authorship and consumer trust are protected.\n\nGenerated copy can accelerate production, but invented product facts and misleading images can harm customers. Human checking remains necessary."},"exampleType":"illustrative"},{"id":20,"term":"Algorithmic feed","lecture":"Lecture 2 · Web 4.0 and the advertising marketplace","page":6,"definition":"A feed that is no longer chronological: what people see is chosen by a model estimating what will keep them scrolling. Marketing moves from buying space to earning a prediction.","explanation":"The order of posts is determined by a model instead of just by publication time. What a user sees depends on predictions about continued attention and engagement. As a result, distribution depends increasingly on platform decisions that the publisher does not directly control.\n\nPublishing a post does not mean every follower sees it. Platforms rank content for predicted engagement, so reach is uncertain and not solely controlled by the brand.","example":"Real-world example: TikTok explains that its For You feed ranks videos using signals such as watch behaviour, likes and follows. That is why two people can open the app and see different videos rather than one shared chronological list.","full":"Algorithmic feed is a feed that is no longer chronological: what people see is chosen by a model estimating what will keep them scrolling. Marketing moves from buying space to earning a prediction. The order of posts is determined by a model instead of just by publication time. What a user sees depends on predictions about continued attention and engagement. As a result, distribution depends increasingly on platform decisions that the publisher does not directly control.\n\nTwo TikTok users may follow the same Nike account yet see different videos because the feed predicts which items will hold each person's attention. Distribution is therefore not simply chronological or guaranteed to followers. A brand can improve relevance but cannot entirely determine ranking. More engagement does not necessarily mean the content is informative or that the audience will buy the product.\n\nPublishing a post does not mean every follower sees it. Platforms rank content for predicted engagement, so reach is uncertain and not solely controlled by the brand.","study":{"simple":"The order of posts is determined by a model instead of just by publication time. What a user sees depends on predictions about continued attention and engagement.","why":"Publishing a post does not mean every follower sees it. Platforms rank content for predicted engagement, so reach is uncertain and not solely controlled by the brand. Distribution is therefore not simply chronological or guaranteed to followers. A brand can improve relevance but cannot entirely determine ranking.","example":"TikTok explains that its For You feed ranks videos using signals such as watch behaviour, likes and follows. That is why two people can open the app and see different videos rather than one shared chronological list.","exam":"Algorithmic feed is a feed that is no longer chronological: what people see is chosen by a model estimating what will keep them scrolling. Marketing moves from buying space to earning a prediction. The order of posts is determined by a model instead of just by publication time. What a user sees depends on predictions about continued attention and engagement. As a result, distribution depends increasingly on platform decisions that the publisher does not directly control.\n\nTwo TikTok users may follow the same Nike account yet see different videos because the feed predicts which items will hold each person's attention. Distribution is therefore not simply chronological or guaranteed to followers. A brand can improve relevance but cannot entirely determine ranking. More engagement does not necessarily mean the content is informative or that the audience will buy the product.\n\nPublishing a post does not mean every follower sees it. Platforms rank content for predicted engagement, so reach is uncertain and not solely controlled by the brand."},"exampleType":"real","exampleSource":"https://newsroom.tiktok.com/how-tiktok-recommends-videos-foryou?lang=en-AU"},{"id":21,"term":"Programmatic advertising","lecture":"Lecture 2 · Web 4.0 and the advertising marketplace","page":7,"definition":"Automated, real-time buying and selling of advertising space. It has eroded the gatekeeping role of agencies and made buyers and sellers dependent on data from a handful of major platforms.","explanation":"Software automates the trading of digital ad placements, often extremely quickly. This allows advertising space to be bought and sold on a large scale, but the course also raises concerns about transparency and dependence on platform data. Automation does not mean that the ad being shown is valuable.\n\nAutomated ad buying scales placement, but advertisers may know too little about where money goes and whether actual people saw the ad.","example":"Illustrative example: Imagine a pet-food brand setting a budget for banner ads. Software automatically bids for placements as people open websites, instead of a human negotiating each banner. That's programmatic advertising.","full":"Programmatic advertising is the automated buying and selling of digital advertising placements, often through software-driven decisions in real time. This allows advertising space to be bought and sold on a large scale, but the course also raises concerns about transparency and dependence on platform data. Automation does not mean that the ad being shown is valuable.\n\nImagine Nike uses automated software to bid for a banner impression when a suitable website slot becomes available. Buying and placement decisions happen in fractions of a second, allowing enormous scale without negotiating each placement. But automation does not prove that an actual person looked at the banner or that the publisher was appropriate. The advertiser still needs transparency and independent outcome measurement.\n\nAutomated ad buying scales placement, but advertisers may know too little about where money goes and whether actual people saw the ad.","category":"ATTENTION AND DISTRIBUTION","study":{"simple":"Software automates the trading of digital ad placements, often extremely quickly. This allows advertising space to be bought and sold on a large scale, but the course also raises concerns about transparency and dependence on platform data.","why":"Automated ad buying scales placement, but advertisers may know too little about where money goes and whether actual people saw the ad. Buying and placement decisions happen in fractions of a second, allowing enormous scale without negotiating each placement. But automation does not prove that an actual person looked at the banner or that the publisher was appropriate.","example":"Imagine a pet-food brand setting a budget for banner ads. Software automatically bids for placements as people open websites, instead of a human negotiating each banner. That's programmatic advertising.","exam":"Programmatic advertising is the automated buying and selling of digital advertising placements, often through software-driven decisions in real time. This allows advertising space to be bought and sold on a large scale, but the course also raises concerns about transparency and dependence on platform data. Automation does not mean that the ad being shown is valuable.\n\nImagine Nike uses automated software to bid for a banner impression when a suitable website slot becomes available. Buying and placement decisions happen in fractions of a second, allowing enormous scale without negotiating each placement. But automation does not prove that an actual person looked at the banner or that the publisher was appropriate. The advertiser still needs transparency and independent outcome measurement.\n\nAutomated ad buying scales placement, but advertisers may know too little about where money goes and whether actual people saw the ad."},"exampleType":"illustrative"},{"id":22,"term":"Dark pools","lecture":"Lecture 2 · Web 4.0 and the advertising marketplace","page":7,"definition":"Opaque parts of the programmatic marketplace where the advertiser can no longer see how the money is spent or how the advertisement is placed.","explanation":"These refer to opaque or private parts of the advertising marketplace. The main problem is that buyers cannot fully inspect the placement or trading activity behind what they purchase. The lecture connects this lack of transparency to doubts about the real value of digital advertising.\n\nAn opaque advertising market makes it hard to inspect placements and prices. Advertisers can end up paying for exposure they cannot check independently.","example":"Illustrative example: Imagine a retailer paying an ad platform but receiving only a final bill and a vague placement report. The retailer cannot see every intermediary fee or exactly where the ads appeared: the market feels like a 'dark pool.'","full":"Dark pools refer to opaque sections of the programmatic advertising marketplace where placements, prices or trading relationships cannot easily be inspected by advertisers. The main problem is that buyers cannot fully inspect the placement or trading activity behind what they purchase. The lecture connects this lack of transparency to doubts about the real value of digital advertising.\n\nSuppose a shop purchases display advertising through intermediaries but cannot establish which websites ultimately displayed the creative or how fees were divided. The opacity prevents proper review of placement quality and price. Even impressive dashboard reports may conceal low-value inventory. The problem is structural information asymmetry, not simply that one advertisement performed poorly.\n\nAn opaque advertising market makes it hard to inspect placements and prices. Advertisers can end up paying for exposure they cannot check independently.","category":"ATTENTION AND DISTRIBUTION","study":{"simple":"These refer to opaque or private parts of the advertising marketplace. The main problem is that buyers cannot fully inspect the placement or trading activity behind what they purchase.","why":"An opaque advertising market makes it hard to inspect placements and prices. Advertisers can end up paying for exposure they cannot check independently. The opacity prevents proper review of placement quality and price. Even impressive dashboard reports may conceal low-value inventory.","example":"Imagine a retailer paying an ad platform but receiving only a final bill and a vague placement report. The retailer cannot see every intermediary fee or exactly where the ads appeared: the market feels like a 'dark pool.'","exam":"Dark pools refer to opaque sections of the programmatic advertising marketplace where placements, prices or trading relationships cannot easily be inspected by advertisers. The main problem is that buyers cannot fully inspect the placement or trading activity behind what they purchase. The lecture connects this lack of transparency to doubts about the real value of digital advertising.\n\nSuppose a shop purchases display advertising through intermediaries but cannot establish which websites ultimately displayed the creative or how fees were divided. The opacity prevents proper review of placement quality and price. Even impressive dashboard reports may conceal low-value inventory. The problem is structural information asymmetry, not simply that one advertisement performed poorly.\n\nAn opaque advertising market makes it hard to inspect placements and prices. Advertisers can end up paying for exposure they cannot check independently."},"exampleType":"illustrative"},{"id":23,"term":"Subprime attention crisis","lecture":"Lecture 2 · Web 4.0 and the advertising marketplace","page":7,"definition":"Tim Hwang's argument that the value of online attention is systematically overstated: a marketplace of fraud and unverifiable prices, while the attention actually bought is worth less and less.","explanation":"Tim Hwang compares parts of the online advertising market with financial markets in which uncertain products are sold as though their value is reliable. An ad may not be seen, a click may be fraudulent, or a purchase may have happened without the ad. The key difference is between what advertisers can count and the real attention or extra sales they receive.\n\nIf the value of attention is overstated, a campaign can appear profitable on a dashboard without generating extra sales. Verification matters more than impressive counts.","example":"Illustrative example: Suppose a campaign reports 100,000 impressions and many clicks, but some ads were never noticed and some clicks were bots. The numbers look valuable even when genuine attention is uncertain—exactly the concern in the subprime attention argument.","full":"Tim Hwang’s subprime attention crisis argument suggests that the digital advertising market can systematically overstate the value of the attention it sells. An ad may not be seen, a click may be fraudulent, or a purchase may have happened without the ad. The key difference is between what advertisers can count and the real attention or extra sales they receive.\n\nAn advertiser may report hundreds of thousands of impressions for a new Samsung phone while having little independent evidence of real attention or extra sales. Tim Hwang's argument treats this as potentially mispriced attention: buyers assume a level of value that the measurements cannot guarantee. Fake clicks, unseen ads and non-incremental purchases expose the gap between counted activity and economic effect.\n\nIf the value of attention is overstated, a campaign can appear profitable on a dashboard without generating extra sales. Verification matters more than impressive counts.","category":"ATTENTION AND DISTRIBUTION","study":{"simple":"Tim Hwang compares parts of the online advertising market with financial markets in which uncertain products are sold as though their value is reliable. An ad may not be seen, a click may be fraudulent, or a purchase may have happened without the ad.","why":"If the value of attention is overstated, a campaign can appear profitable on a dashboard without generating extra sales. Verification matters more than impressive counts. Tim Hwang's argument treats this as potentially mispriced attention: buyers assume a level of value that the measurements cannot guarantee. Fake clicks, unseen ads and non-incremental purchases expose the gap between counted activity and economic effect.","example":"Suppose a campaign reports 100,000 impressions and many clicks, but some ads were never noticed and some clicks were bots. The numbers look valuable even when genuine attention is uncertain—exactly the concern in the subprime attention argument.","exam":"Tim Hwang’s subprime attention crisis argument suggests that the digital advertising market can systematically overstate the value of the attention it sells. An ad may not be seen, a click may be fraudulent, or a purchase may have happened without the ad. The key difference is between what advertisers can count and the real attention or extra sales they receive.\n\nAn advertiser may report hundreds of thousands of impressions for a new Samsung phone while having little independent evidence of real attention or extra sales. Tim Hwang's argument treats this as potentially mispriced attention: buyers assume a level of value that the measurements cannot guarantee. Fake clicks, unseen ads and non-incremental purchases expose the gap between counted activity and economic effect.\n\nIf the value of attention is overstated, a campaign can appear profitable on a dashboard without generating extra sales. Verification matters more than impressive counts."},"exampleType":"illustrative"},{"id":24,"term":"Click-through rate (CTR)","lecture":"Lecture 2 · Web 4.0 and the advertising marketplace","page":7,"definition":"The share of people who click after seeing something. The early banner ads of the mid-1990s had a click-through rate of 44 percent; today banner ads command far less attention.","explanation":"CTR compares clicks with opportunities to see or encounter a link or advertisement. For example, 20 clicks from 1,000 impressions gives a CTR of 2%. The lecture uses the striking difference between early banner-ad click-through rates and later attention levels to illustrate how online advertising has changed. A click alone does not prove genuine interest or added sales\n\nCTR describes the proportion of impressions that produced clicks, not how many purchases occurred or whether those clicks were valuable.","example":"Illustrative example: A hypothetical banner for a concert gets 60 clicks from 3,000 impressions. Its CTR is 60 ÷ 3,000 × 100 = 2%. That tells us how often impressions led to clicks, not whether tickets were sold.","full":"Click-through rate (CTR) measures the percentage of counted impressions that lead to clicks. It is calculated as clicks divided by impressions, multiplied by 100. CTR compares clicks with opportunities to see or encounter a link or advertisement. For example, 20 clicks from 1,000 impressions gives a CTR of 2%. The lecture uses the striking difference between early banner-ad click-through rates and later attention levels to illustrate how online advertising has changed. A click alone does not prove genuine interest or added sales.\n\nIn a hypothetical Adidas banner campaign, 40 clicks from 2,000 impressions produce a CTR of 2 percent. The calculation describes how often an impression led to a click; it does not reveal whether visitors bought shoes, remembered the brand or were genuine customers. For campaign evaluation, CTR is useful diagnostic evidence but must be interpreted alongside the objective and stronger outcome measures.\n\nCTR describes the proportion of impressions that produced clicks, not how many purchases occurred or whether those clicks were valuable.","category":"ATTENTION AND DISTRIBUTION","study":{"simple":"CTR compares clicks with opportunities to see or encounter a link or advertisement. For example, 20 clicks from 1,000 impressions gives a CTR of 2%.","why":"CTR describes the proportion of impressions that produced clicks, not how many purchases occurred or whether those clicks were valuable. The calculation describes how often an impression led to a click; it does not reveal whether visitors bought shoes, remembered the brand or were genuine customers. For campaign evaluation, CTR is useful diagnostic evidence but must be interpreted alongside the objective and stronger outcome measures.","example":"A hypothetical banner for a concert gets 60 clicks from 3,000 impressions. Its CTR is 60 ÷ 3,000 × 100 = 2%. That tells us how often impressions led to clicks, not whether tickets were sold.","exam":"Click-through rate (CTR) measures the percentage of counted impressions that lead to clicks. It is calculated as clicks divided by impressions, multiplied by 100. CTR compares clicks with opportunities to see or encounter a link or advertisement. For example, 20 clicks from 1,000 impressions gives a CTR of 2%. The lecture uses the striking difference between early banner-ad click-through rates and later attention levels to illustrate how online advertising has changed. A click alone does not prove genuine interest or added sales.\n\nIn a hypothetical Adidas banner campaign, 40 clicks from 2,000 impressions produce a CTR of 2 percent. The calculation describes how often an impression led to a click; it does not reveal whether visitors bought shoes, remembered the brand or were genuine customers. For campaign evaluation, CTR is useful diagnostic evidence but must be interpreted alongside the objective and stronger outcome measures.\n\nCTR describes the proportion of impressions that produced clicks, not how many purchases occurred or whether those clicks were valuable."},"exampleType":"illustrative"},{"id":25,"term":"Search-centric internet","lecture":"Lecture 2 · Web 4.0 and the advertising marketplace","page":8,"definition":"An internet where people reach information by searching and clicking through to websites — the model that answer engines and assistants are now displacing.","explanation":"In this model, a person types a query, reviews search results and opens webpages to find information. Websites therefore compete to be discovered and clicked in those results. Assistant-generated answers challenge that pattern by placing a composed response between the person and the original webpages.\n\nSearch-result visibility historically sent visitors to publishers' sites. As assistants answer more questions directly, content strategies must take into account fewer source visits.","example":"Illustrative example: Someone searches Google for 'how to clean suede shoes,' scans the links and opens a care guide. That search-and-click route is the search-centric internet; an AI-generated answer can replace some of those visits.","full":"Search-centric internet is an internet where people reach information by searching and clicking through to websites — the model that answer engines and assistants are now displacing. In this model, a person types a query, reviews search results and opens webpages to find information. Websites therefore compete to be discovered and clicked in those results. Assistant-generated answers challenge that pattern by placing a composed response between the person and the original webpages.\n\nA person looking for IKEA desk dimensions traditionally typed a query, evaluated Google's links and visited a product page for the answer. Websites therefore competed for visible rankings and click-throughs. If an answer engine gives the measurements directly, the user's need may be satisfied without a site visit. This threatens click-based discovery models while increasing the value of accurate, machine-readable information.\n\nSearch-result visibility historically sent visitors to publishers' sites. As assistants answer more questions directly, content strategies must take into account fewer source visits.","category":"CONSEQUENCES","study":{"simple":"In this model, a person types a query, reviews search results and opens webpages to find information. Websites therefore compete to be discovered and clicked in those results.","why":"Search-result visibility historically sent visitors to publishers' sites. As assistants answer more questions directly, content strategies must take into account fewer source visits. Websites therefore competed for visible rankings and click-throughs If an answer engine gives the measurements directly, the user's need may be satisfied without a site visit.","example":"Someone searches Google for 'how to clean suede shoes,' scans the links and opens a care guide. That search-and-click route is the search-centric internet; an AI-generated answer can replace some of those visits.","exam":"Search-centric internet is an internet where people reach information by searching and clicking through to websites — the model that answer engines and assistants are now displacing. In this model, a person types a query, reviews search results and opens webpages to find information. Websites therefore compete to be discovered and clicked in those results. Assistant-generated answers challenge that pattern by placing a composed response between the person and the original webpages.\n\nA person looking for IKEA desk dimensions traditionally typed a query, evaluated Google's links and visited a product page for the answer. Websites therefore competed for visible rankings and click-throughs. If an answer engine gives the measurements directly, the user's need may be satisfied without a site visit. This threatens click-based discovery models while increasing the value of accurate, machine-readable information.\n\nSearch-result visibility historically sent visitors to publishers' sites. As assistants answer more questions directly, content strategies must take into account fewer source visits."},"exampleType":"illustrative"},{"id":26,"term":"Replicability","lecture":"Lecture 2 · Web 4.0 and the advertising marketplace","page":8,"definition":"Anything published can be copied and reused in contexts you never chose. What is posted stays: removing the original does not remove the copies.","explanation":"The original publisher cannot always control every later copy. A post may be downloaded, screenshot, quoted or shared in a different setting where the context has changed. Deleting the initial version does not automatically remove copies elsewhere.\n\nDeleting an original post does not erase screenshots or copies. Brands must think about how messages could be reused after their original dates or context disappear.","example":"Illustrative example: A shoe store deletes an incorrect Instagram price, but someone has already screenshotted and shared it in a group chat. The copied version can continue circulating after the original disappears.","full":"Replicability is the capacity of digital content to be copied, distributed and reused beyond the control of its original publisher. The original publisher cannot reliably control every later copy. A post may be downloaded, screenshot, quoted or shared in a different setting where the context has changed. Deleting the initial version does not automatically remove copies elsewhere.\n\nAn IKEA discount image may be screenshot and shared after the offer expires. The copy survives even if the shop updates or removes the original message, and viewers may not see its date or restrictions. This demonstrates replicability: publication creates potential versions beyond the author's control. Marketers must make time-sensitive conditions clear and consider how material can be reused in unintended contexts.\n\nDeleting an original post does not erase screenshots or copies. Brands must think about how messages could be reused after their original dates or context disappear.","study":{"simple":"The original publisher cannot always control every later copy. A post may be downloaded, screenshot, quoted or shared in a different setting where the context has changed.","why":"Deleting an original post does not erase screenshots or copies. Brands must think about how messages could be reused after their original dates or context disappear. The copy survives even if the shop updates or removes the original message, and viewers may not see its date or restrictions. This demonstrates replicability: publication creates potential versions beyond the author's control.","example":"A shoe store deletes an incorrect Instagram price, but someone has already screenshotted and shared it in a group chat. The copied version can continue circulating after the original disappears.","exam":"Replicability is the capacity of digital content to be copied, distributed and reused beyond the control of its original publisher. The original publisher cannot reliably control every later copy. A post may be downloaded, screenshot, quoted or shared in a different setting where the context has changed. Deleting the initial version does not automatically remove copies elsewhere.\n\nAn IKEA discount image may be screenshot and shared after the offer expires. The copy survives even if the shop updates or removes the original message, and viewers may not see its date or restrictions. This demonstrates replicability: publication creates potential versions beyond the author's control. Marketers must make time-sensitive conditions clear and consider how material can be reused in unintended contexts.\n\nDeleting an original post does not erase screenshots or copies. Brands must think about how messages could be reused after their original dates or context disappear."},"exampleType":"illustrative"},{"id":27,"term":"Objective","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":9,"definition":"A clear, measurable goal that defines what a business wants to achieve with its marketing efforts within a set timeframe. The clearer the objective, the more likely the campaign is to succeed.","explanation":"An objective specifies what an activity is supposed to achieve and by when. A clear objective should be measurable so that the team can judge whether the effort worked. For example, increasing completed sign-ups over a defined campaign period is more actionable than simply wanting more attention.\n\nA measurable outcome makes it possible to choose activities and evaluate results. 'Post more videos' is a task, while increased completed ticket purchases is a business objective.","example":"Illustrative example: A neighbourhood bookshop decides: 'Increase online reservations for author events from 40 to 60 per month by December.' It names an outcome, a measurable target and a deadline; 'post more Reels' would only name an activity.","full":"A marketing objective is a measurable outcome that an organization wants to achieve within a set time period. A clear objective should be measurable so that the team can judge whether the effort worked. For example, increasing completed sign-ups over a defined campaign period is more actionable than simply wanting more attention.\n\nImagine a theatre aims to increase completed online ticket purchases by 10 percent over an eight-week campaign. This states a measurable business outcome and time period. By comparison, posting five videos a week is only a marketing activity: it might contribute to the objective but cannot itself establish success. The distinction enables sensible channel choices, measurement and evaluation after the campaign.\n\nA measurable outcome makes it possible to choose activities and evaluate results. 'Post more videos' is a task, while increased completed ticket purchases is a business objective.","category":"OBJECTIVES AND MEASUREMENT","study":{"simple":"An objective specifies what an activity is supposed to achieve and by when. A clear objective should be measurable so that the team can judge whether the effort worked.","why":"A measurable outcome makes it possible to choose activities and evaluate results. 'Post more videos' is a task, while increased completed ticket purchases is a business objective. This states a measurable business outcome and time period By comparison, posting five videos a week is only a marketing activity: it might contribute to the objective but cannot itself establish success.","example":"A neighbourhood bookshop decides: 'Increase online reservations for author events from 40 to 60 per month by December.' It names an outcome, a measurable target and a deadline; 'post more Reels' would only name an activity.","exam":"A marketing objective is a measurable outcome that an organization wants to achieve within a set time period. A clear objective should be measurable so that the team can judge whether the effort worked. For example, increasing completed sign-ups over a defined campaign period is more actionable than simply wanting more attention.\n\nImagine a theatre aims to increase completed online ticket purchases by 10 percent over an eight-week campaign. This states a measurable business outcome and time period. By comparison, posting five videos a week is only a marketing activity: it might contribute to the objective but cannot itself establish success. The distinction enables sensible channel choices, measurement and evaluation after the campaign.\n\nA measurable outcome makes it possible to choose activities and evaluate results. 'Post more videos' is a task, while increased completed ticket purchases is a business objective."},"exampleType":"illustrative"},{"id":28,"term":"Call to action (CTA)","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":9,"definition":"What we ask the customer to do next. Every objective needs a CTA: a sign in a store, a sentence from a salesperson, or a clickable link online.","explanation":"A CTA makes the desired next step explicit. It might ask someone to buy, subscribe, download, book or visit a page; it can also exist outside digital marketing. A good CTA connects the communication to the actual objective instead of only attracting attention.\n\nA clear next step prevents interested people from getting stuck. A useful call to action should match the customer's readiness and the campaign goal.","example":"Illustrative example: Imagine a plant shop promoting a terrarium workshop. The button 'Book a place' tells visitors exactly what to do next. A vague button saying 'Learn more' would be weaker if the real objective is bookings.","full":"A call to action (CTA) is a clear instruction that tells an audience which step to take next toward the result they want. A CTA makes the desired next step explicit. It might ask someone to buy, subscribe, download, book or visit a page; it can also exist outside digital marketing. A good CTA connects the communication to the actual objective instead of only attracting attention.\n\nOn a theatre's booking interface, 'Choose seats' is a CTA because it tells an interested visitor the next action needed to progress toward purchase. A brand-awareness ad might instead invite someone to 'Explore upcoming films.' The correct CTA depends on the customer's stage and the objective. If the next step is unclear or premature, attention can be lost before conversion.\n\nA clear next step prevents interested people from getting stuck. A useful call to action should match the customer's readiness and the campaign goal.","category":"OBJECTIVES AND MEASUREMENT","study":{"simple":"A CTA makes the desired next step explicit. It might ask someone to buy, subscribe, download, book or visit a page; it can also exist outside digital marketing.","why":"A clear next step prevents interested people from getting stuck. A useful call to action should match the customer's readiness and the campaign goal. A brand-awareness ad might instead invite someone to 'Explore upcoming films.' The correct CTA depends on the customer's stage and the objective If the next step is unclear or premature, attention can be lost before conversion.","example":"Imagine a plant shop promoting a terrarium workshop. The button 'Book a place' tells visitors exactly what to do next. A vague button saying 'Learn more' would be weaker if the real objective is bookings.","exam":"A call to action (CTA) is a clear instruction that tells an audience which step to take next toward the result they want. A CTA makes the desired next step explicit. It might ask someone to buy, subscribe, download, book or visit a page; it can also exist outside digital marketing. A good CTA connects the communication to the actual objective instead of only attracting attention.\n\nOn a theatre's booking interface, 'Choose seats' is a CTA because it tells an interested visitor the next action needed to progress toward purchase. A brand-awareness ad might instead invite someone to 'Explore upcoming films.' The correct CTA depends on the customer's stage and the objective. If the next step is unclear or premature, attention can be lost before conversion.\n\nA clear next step prevents interested people from getting stuck. A useful call to action should match the customer's readiness and the campaign goal."},"exampleType":"illustrative"},{"id":29,"term":"KPI (key performance indicator)","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":9,"definition":"The measure that shows whether an objective is being met — for example conversion rate, cost per acquisition or qualified leads generated.","explanation":"A KPI is selected because it indicates progress toward a specific objective. If the goal is to gain customers, qualified leads or conversion rate may be more useful than follower count. The distinction from a general metric is that a KPI is tied directly to judging success.\n\nA KPI makes success measurable against a chosen objective. Without that connection, a report can celebrate activity while the result they want remains unmet.","example":"Illustrative example: A yoga studio wants 30 new class bookings this month. Completed bookings—not Instagram likes—would be a relevant KPI because they show progress towards the studio's actual goal.","full":"A key performance indicator (KPI) is a measure selected to check progress toward a specific objective. If the goal is to gain customers, qualified leads or conversion rate may be more useful than follower count. The distinction from a general metric is that a KPI is tied directly to judging success.\n\nIf a cinema wants more completed bookings, checkout completion rate is a relevant KPI because it tracks progress toward that specific result. Instagram follower growth may supply context about visibility but cannot answer whether purchases increased. A KPI is therefore a chosen success indicator, not merely any attractive chart. It should be defined consistently and interpreted against a baseline or target.\n\nA KPI makes success measurable against a chosen objective. Without that connection, a report can celebrate activity while the result they want remains unmet.","category":"OBJECTIVES AND MEASUREMENT","study":{"simple":"A KPI is selected because it indicates progress toward a specific objective. If the goal is to gain customers, qualified leads or conversion rate may be more useful than follower count.","why":"A KPI makes success measurable against a chosen objective. Without that connection, a report can celebrate activity while the result they want remains unmet. Instagram follower growth may supply context about visibility but cannot answer whether purchases increased. A KPI is therefore a chosen success indicator, not merely any attractive chart.","example":"A yoga studio wants 30 new class bookings this month. Completed bookings—not Instagram likes—would be a relevant KPI because they show progress towards the studio's actual goal.","exam":"A key performance indicator (KPI) is a measure selected to check progress toward a specific objective. If the goal is to gain customers, qualified leads or conversion rate may be more useful than follower count. The distinction from a general metric is that a KPI is tied directly to judging success.\n\nIf a cinema wants more completed bookings, checkout completion rate is a relevant KPI because it tracks progress toward that specific result. Instagram follower growth may supply context about visibility but cannot answer whether purchases increased. A KPI is therefore a chosen success indicator, not merely any attractive chart. It should be defined consistently and interpreted against a baseline or target.\n\nA KPI makes success measurable against a chosen objective. Without that connection, a report can celebrate activity while the result they want remains unmet."},"exampleType":"illustrative"},{"id":30,"term":"Metric","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":9,"definition":"Supporting data that describes activity. Metrics explain what happened; KPIs tell you whether the objective was reached.","explanation":"Metrics provide numerical descriptions of what happened, such as impressions, page views or clicks. They help explain activity, but not every metric shows progress toward the campaign objective. Whether a metric is useful as a KPI depends on the goal.\n\nA metric can help explain a pattern without establishing success. Teams need to interpret clicks or visits against the result they are actually pursuing.","example":"Illustrative example: A museum counts 8,000 page views, 500 event-page clicks and 75 ticket purchases. All three are metrics describing behaviour; which is a KPI depends on the objective the museum set.","full":"A metric is a piece of quantitative information used to describe activity or performance; whether it serves as a KPI depends on the objective. They help explain activity, but not every metric shows progress toward the campaign objective. Whether a metric is useful as a KPI depends on the goal.\n\nAn event venue can count showtime-page views, seat-selection clicks and checkout starts. These metrics describe where users move through the journey and may help diagnose a problem. But none is automatically the campaign's main success measure. If ticket purchases are the objective, a rising click count with falling completed bookings indicates activity without the desired outcome.\n\nA metric can help explain a pattern without establishing success. Teams need to interpret clicks or visits against the result they are actually pursuing.","category":"OBJECTIVES AND MEASUREMENT","study":{"simple":"Metrics provide numerical descriptions of what happened, such as impressions, page views or clicks. They help explain activity, but not every metric shows progress toward the campaign objective.","why":"A metric can help explain a pattern without establishing success. Teams need to interpret clicks or visits against the result they are actually pursuing. These metrics describe where users move through the journey and may help diagnose a problem. But none is automatically the campaign's main success measure.","example":"A museum counts 8,000 page views, 500 event-page clicks and 75 ticket purchases. All three are metrics describing behaviour; which is a KPI depends on the objective the museum set.","exam":"A metric is a piece of quantitative information used to describe activity or performance; whether it serves as a KPI depends on the objective. They help explain activity, but not every metric shows progress toward the campaign objective. Whether a metric is useful as a KPI depends on the goal.\n\nAn event venue can count showtime-page views, seat-selection clicks and checkout starts. These metrics describe where users move through the journey and may help diagnose a problem. But none is automatically the campaign's main success measure. If ticket purchases are the objective, a rising click count with falling completed bookings indicates activity without the desired outcome.\n\nA metric can help explain a pattern without establishing success. Teams need to interpret clicks or visits against the result they are actually pursuing."},"exampleType":"illustrative"},{"id":31,"term":"Vanity metric","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":10,"definition":"A comfort goal that looks good but says nothing about the objective — followers, total page views, app downloads without active users, subscribers without open rates.","explanation":"Large follower counts or page-view totals can look impressive without showing meaningful outcomes. A company might attract many visits without receiving sign-ups or sales. The lecture warns marketers not to confuse numbers that feel successful with measurements that answer the actual objective.\n\nAn attractive figure can disguise weak outcomes. The question is whether a number changes a meaningful decision, not whether it looks impressive on a slide.","example":"Illustrative example: A fictional jewellery brand gains 20,000 followers after a giveaway but receives no additional orders. The follower count looks impressive; if sales were the objective, treating it as success would be a vanity-metric mistake.","full":"A vanity metric is a figure that appears impressive but offers weak evidence that the intended business objective has been reached. Large follower counts or page-view totals can look impressive without showing meaningful outcomes. A company might attract many visits without receiving sign-ups or sales. The lecture warns marketers not to confuse numbers that feel successful with measurements that answer the actual objective.\n\nImagine a Nike promotion gains 50,000 followers but generates little relevant engagement or additional shoe sales. Presenting the follower increase as proof of success would mistake a visible count for business value. Vanity metrics are not always useless; they may explain reach or audience size. They become misleading when substituted for a KPI tied to the stated objective.\n\nAn attractive figure can disguise weak outcomes. The question concerns whether a number changes a meaningful decision, not whether it looks impressive on a slide.","category":"OBJECTIVES AND MEASUREMENT","study":{"simple":"Large follower counts or page-view totals can look impressive without showing meaningful outcomes. A company might attract many visits without receiving sign-ups or sales.","why":"An attractive figure can disguise weak outcomes. The question is whether a number changes a meaningful decision, not whether it looks impressive on a slide. Presenting the follower increase as proof of success would mistake a visible count for business value. Vanity metrics are not always useless; they may explain reach or audience size.","example":"A fictional jewellery brand gains 20,000 followers after a giveaway but receives no additional orders. The follower count looks impressive; if sales were the objective, treating it as success would be a vanity-metric mistake.","exam":"A vanity metric is a figure that appears impressive but offers weak evidence that the intended business objective has been reached. Large follower counts or page-view totals can look impressive without showing meaningful outcomes. A company might attract many visits without receiving sign-ups or sales. The lecture warns marketers not to confuse numbers that feel successful with measurements that answer the actual objective.\n\nImagine a Nike promotion gains 50,000 followers but generates little relevant engagement or additional shoe sales. Presenting the follower increase as proof of success would mistake a visible count for business value. Vanity metrics are not always useless; they may explain reach or audience size. They become misleading when substituted for a KPI tied to the stated objective.\n\nAn attractive figure can disguise weak outcomes. The question concerns whether a number changes a meaningful decision, not whether it looks impressive on a slide."},"exampleType":"illustrative"},{"id":32,"term":"Marketing funnel","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":10,"definition":"A metaphor describing the customer journey from first awareness to loyal customer. It helps marketers set clear objectives for each stage so activities match where customers are in their decision-making.","explanation":"The funnel represents different stages in the customer’s decision-making process. An unfamiliar customer needs different communication from someone already comparing options or ready to buy. The model helps connect each stage to suitable activities, calls to action and objectives.\n\nPeople encountering an offer for the first time need different information from buyers comparing specifications. Matching messages to stages reduces friction in the journey.","example":"Illustrative example: Someone first sees a bicycle brand, reads reviews, compares sizes, visits a shop and finally buys a bike. Each stage needs different information, which is why the marketing funnel is useful.","full":"A marketing funnel models different stages of customer decision-making, from first awareness toward purchase and an ongoing relationship. An unfamiliar customer needs different communication from someone already comparing options or ready to buy. The model helps connect each stage to suitable activities, calls to action and objectives.\n\nA customer may notice an IKEA sofa, read product details, compare fabrics, check delivery costs and finally order. Each stage creates a different question and therefore requires different communication: inspiration early, reassurance and specifications later, and a simple checkout near purchase. The funnel is a planning model, not a promise that every buyer follows an identical linear path.\n\nPeople encountering an offer for the first time need different information from buyers comparing specifications. Matching messages to stages reduces friction in the journey.","category":"FUNNELS","study":{"simple":"The funnel represents different stages in the customer’s decision-making process. An unfamiliar customer needs different communication from someone already comparing options or ready to buy.","why":"People encountering an offer for the first time need different information from buyers comparing specifications. Matching messages to stages reduces friction in the journey. Each stage creates a different question and therefore requires different communication: inspiration early, reassurance and specifications later, and a simple checkout near purchase. The funnel is a planning model, not a promise that every buyer follows an identical linear path.","example":"Someone first sees a bicycle brand, reads reviews, compares sizes, visits a shop and finally buys a bike. Each stage needs different information, which is why the marketing funnel is useful.","exam":"A marketing funnel models different stages of customer decision-making, from first awareness toward purchase and an ongoing relationship. An unfamiliar customer needs different communication from someone already comparing options or ready to buy. The model helps connect each stage to suitable activities, calls to action and objectives.\n\nA customer may notice an IKEA sofa, read product details, compare fabrics, check delivery costs and finally order. Each stage creates a different question and therefore requires different communication: inspiration early, reassurance and specifications later, and a simple checkout near purchase. The funnel is a planning model, not a promise that every buyer follows an identical linear path.\n\nPeople encountering an offer for the first time need different information from buyers comparing specifications. Matching messages to stages reduces friction in the journey."},"exampleType":"illustrative"},{"id":33,"term":"AIDA","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":10,"definition":"The mother funnel: Attention, Interest, Desire, Action. There is a CTA in each step.","explanation":"Attention is the stage where someone notices an offer, Interest where they begin engaging with it, Desire where they want it, and Action where they take the requested step. The lecture stresses a CTA at every stage. AIDA offers a simple way to connect a message to the next desired behaviour.\n\nAIDA helps shape a communication from initial notice to a next action. Skipping the audience's interest or desire can make an immediate sales request ineffective.","example":"Illustrative example: Imagine an ad for a science museum: an unusual image attracts Attention, a fun experiment sparks Interest, a preview creates Desire, and a 'Book tickets' button prompts Action. That's AIDA applied to one message.","full":"AIDA is the mother funnel: Attention, Interest, Desire, Action. There is a CTA in each step. Attention is the stage where someone notices an offer, Interest where they begin engaging with it, Desire where they want it, and Action where they take the requested step. The lecture stresses a CTA at every stage. AIDA offers a simple way to connect a message to the next desired behaviour.\n\nIn a hypothetical Adidas campaign, a striking running image draws Attention; a demonstration builds Interest; evidence about comfort supports Desire; and a clear purchase link invites Action. The sequence connects creative choices to a behavioral goal. AIDA simplifies complex decisions, but it remains useful for checking whether an advertisement gives people reasons and a next step instead of only being visually memorable.\n\nAIDA helps shape a communication from initial notice to a next action. Skipping the audience's interest or desire can make an immediate sales request ineffective.","category":"FUNNELS","study":{"simple":"Attention is the stage where someone notices an offer, Interest where they begin engaging with it, Desire where they want it, and Action where they take the requested step. The lecture stresses a CTA at every stage.","why":"AIDA helps shape a communication from initial notice to a next action. Skipping the audience's interest or desire can make an immediate sales request ineffective. The sequence connects creative choices to a behavioral goal AIDA simplifies complex decisions, but it remains useful for checking whether an advertisement gives people reasons and a next step instead of only being visually memorable.","example":"Imagine an ad for a science museum: an unusual image attracts Attention, a fun experiment sparks Interest, a preview creates Desire, and a 'Book tickets' button prompts Action. That's AIDA applied to one message.","exam":"AIDA is the mother funnel: Attention, Interest, Desire, Action. There is a CTA in each step. Attention is the stage where someone notices an offer, Interest where they begin engaging with it, Desire where they want it, and Action where they take the requested step. The lecture stresses a CTA at every stage. AIDA offers a simple way to connect a message to the next desired behaviour.\n\nIn a hypothetical Adidas campaign, a striking running image draws Attention; a demonstration builds Interest; evidence about comfort supports Desire; and a clear purchase link invites Action. The sequence connects creative choices to a behavioral goal. AIDA simplifies complex decisions, but it remains useful for checking whether an advertisement gives people reasons and a next step instead of only being visually memorable.\n\nAIDA helps shape a communication from initial notice to a next action. Skipping the audience's interest or desire can make an immediate sales request ineffective."},"exampleType":"illustrative"},{"id":34,"term":"The digital marketing funnel","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":10,"definition":"The funnel as most often used in digital marketing: awareness, interest, consideration, intent, evaluation, purchase.","explanation":"The six stages make the customer’s progression more detailed than AIDA: awareness, interest, consideration, intent, evaluation and purchase. A person may first discover a product, then compare it with alternatives and finally make a decision. Marketers use the stages to choose appropriate information and objectives instead of treating every visitor as ready to buy\n\nDetailed funnel stages help identify exactly where people stop progressing. A comparison problem needs a different solution from a payment problem.","example":"Illustrative example: Someone discovers a language app, watches a demo, compares plans, decides to try it, checks the cancellation terms and buys a subscription. Those actions illustrate awareness, interest, consideration, intent, evaluation and purchase.","full":"The digital marketing funnel is the funnel as most often used in digital marketing: awareness, interest, consideration, intent, evaluation, purchase. The six stages make the customer’s progression more detailed than AIDA: awareness, interest, consideration, intent, evaluation and purchase. A person may first discover a product, then compare it with alternatives and finally make a decision. Marketers use the stages to choose appropriate information and objectives instead of treating every visitor as ready to buy.\n\nConsider a Samsung buyer who first discovers a phone, reads specifications, compares competitors, develops purchase intent, evaluates price and warranty, and completes payment. Those six funnel stages separate curiosity from genuine readiness to act. A long educational article suits early research better than an immediate checkout prompt. People can repeat or skip stages, so the model guides choices without rigidly predicting behaviour.\n\nDetailed funnel stages help identify exactly where people stop progressing. A comparison problem needs a different solution from a payment problem.","category":"FUNNELS","study":{"simple":"The six stages make the customer’s progression more detailed than AIDA: awareness, interest, consideration, intent, evaluation and purchase. A person may first discover a product, then compare it with alternatives and finally make a decision.","why":"Detailed funnel stages help identify exactly where people stop progressing. A comparison problem needs a different solution from a payment problem. Those six funnel stages separate curiosity from genuine readiness to act. A long educational article suits early research better than an immediate checkout prompt.","example":"Someone discovers a language app, watches a demo, compares plans, decides to try it, checks the cancellation terms and buys a subscription. Those actions illustrate awareness, interest, consideration, intent, evaluation and purchase.","exam":"The digital marketing funnel is the funnel as most often used in digital marketing: awareness, interest, consideration, intent, evaluation, purchase. The six stages make the customer’s progression more detailed than AIDA: awareness, interest, consideration, intent, evaluation and purchase. A person may first discover a product, then compare it with alternatives and finally make a decision. Marketers use the stages to choose appropriate information and objectives instead of treating every visitor as ready to buy.\n\nConsider a Samsung buyer who first discovers a phone, reads specifications, compares competitors, develops purchase intent, evaluates price and warranty, and completes payment. Those six funnel stages separate curiosity from genuine readiness to act. A long educational article suits early research better than an immediate checkout prompt. People can repeat or skip stages, so the model guides choices without rigidly predicting behaviour.\n\nDetailed funnel stages help identify exactly where people stop progressing. A comparison problem needs a different solution from a payment problem."},"exampleType":"illustrative"},{"id":35,"term":"Conversion","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":11,"definition":"The point where a visitor completes the action the objective asks for — a purchase, a sign-up, a download.","explanation":"A conversion occurs when the user completes the desired action, not merely when they see the content. Depending on the objective, that action might be a purchase, sign-up or download. The definition of a conversion therefore depends on what the business asked the visitor to do.\n\nA visitor has not converted until they finish the intended action. Defining this event clearly prevents teams from treating every page visit as an outcome.","example":"Illustrative example: A person reaches the final step of ordering a birthday cake online and successfully pays. If purchases are the bakery's campaign objective, that completed payment is the conversion, not simply clicking the advert.","full":"A conversion occurs when a visitor completes the action defined by the marketing objective, such as a purchase, signup or download. Depending on the objective, that action might be a purchase, sign-up or download. The definition of a conversion therefore depends on what the business asked the visitor to do.\n\nA visitor who pays for a theatre ticket has completed a conversion when the campaign's intended action is a purchase. If the objective is newsletter subscriptions, a valid signup is the conversion instead. Watching an advertisement or clicking a link is not automatically a conversion. Defining the event precisely prevents marketers from reporting attention as though it were the final desired behavior.\n\nA visitor has not converted until they finish the intended action. Defining this event clearly prevents teams from treating every page visit as an outcome.","category":"OBJECTIVES AND MEASUREMENT","study":{"simple":"A conversion occurs when the user completes the desired action, not merely when they see the content. Depending on the objective, that action might be a purchase, sign-up or download.","why":"A visitor has not converted until they finish the intended action. Defining this event clearly prevents teams from treating every page visit as an outcome. If the objective is newsletter subscriptions, a valid signup is the conversion instead. Watching an advertisement or clicking a link is not automatically a conversion.","example":"A person reaches the final step of ordering a birthday cake online and successfully pays. If purchases are the bakery's campaign objective, that completed payment is the conversion, not simply clicking the advert.","exam":"A conversion occurs when a visitor completes the action defined by the marketing objective, such as a purchase, signup or download. Depending on the objective, that action might be a purchase, sign-up or download. The definition of a conversion therefore depends on what the business asked the visitor to do.\n\nA visitor who pays for a theatre ticket has completed a conversion when the campaign's intended action is a purchase. If the objective is newsletter subscriptions, a valid signup is the conversion instead. Watching an advertisement or clicking a link is not automatically a conversion. Defining the event precisely prevents marketers from reporting attention as though it were the final desired behavior.\n\nA visitor has not converted until they finish the intended action. Defining this event clearly prevents teams from treating every page visit as an outcome."},"exampleType":"illustrative"},{"id":36,"term":"Jobs to be done (JTBD)","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":11,"definition":"Customers “hire” products and services to do a job; they seek to make progress in a specific circumstance. Jobs are functional, emotional and social, and depend on context rather than demographics.","explanation":"JTBD begins with the progress a person is trying to make in a particular situation, instead of starting with age or other demographic categories. A job may be functional, such as accomplishing a task; emotional, such as feeling reassured; or social, such as being perceived in a certain way. A product succeeds when it helps the customer make the progress they need.\n\nAge and demographic labels cannot fully explain why a person chooses a product. Understanding the progress they seek leads to more useful offers and messages.","example":"Illustrative example: Someone buys takeaway coffee before a 6 a.m. train not because they want 'a cup' in itself, but because they need energy, comfort and a small reliable routine. Those are the functional and emotional jobs the product does.","full":"Jobs to be done (JTBD) describes how customers “hire” products and services to do a job; they seek to make progress in a specific circumstance. Jobs are functional, emotional and social, and depend on context instead of demographics. JTBD begins with the progress a person is trying to make in a particular situation, instead of starting with age or other demographic categories. A job may be functional, such as accomplishing a task; emotional, such as feeling reassured; or social, such as being perceived in a certain way. A product succeeds when it helps the customer make the progress they need.\n\nSomeone may subscribe to Spotify to find music quickly on a commute, feel relaxed and have songs to discuss with friends. These functional, emotional and social jobs explain the decision more deeply than demographic traits. Two people of the same age can choose different services because their circumstances and desired progress differ. JTBD helps organizations design for the actual problem instead of assuming a demographic segment shares one motive.\n\nAge and demographic labels cannot fully explain why a person chooses a product. Understanding the progress they seek leads to more useful offers and messages.","category":"CUSTOMER BEHAVIOUR","study":{"simple":"JTBD begins with the progress a person is trying to make in a particular situation, instead of starting with age or other demographic categories. A job may be functional, such as accomplishing a task; emotional, such as feeling reassured; or social, such as being perceived in a certain way.","why":"Age and demographic labels cannot fully explain why a person chooses a product. Understanding the progress they seek leads to more useful offers and messages. These functional, emotional and social jobs explain the decision more deeply than demographic traits. Two people of the same age can choose different services because their circumstances and desired progress differ.","example":"Someone buys takeaway coffee before a 6 a.m. train not because they want 'a cup' in itself, but because they need energy, comfort and a small reliable routine. Those are the functional and emotional jobs the product does.","exam":"Jobs to be done (JTBD) describes how customers “hire” products and services to do a job; they seek to make progress in a specific circumstance. Jobs are functional, emotional and social, and depend on context instead of demographics. JTBD begins with the progress a person is trying to make in a particular situation, instead of starting with age or other demographic categories. A job may be functional, such as accomplishing a task; emotional, such as feeling reassured; or social, such as being perceived in a certain way. A product succeeds when it helps the customer make the progress they need.\n\nSomeone may subscribe to Spotify to find music quickly on a commute, feel relaxed and have songs to discuss with friends. These functional, emotional and social jobs explain the decision more deeply than demographic traits. Two people of the same age can choose different services because their circumstances and desired progress differ. JTBD helps organizations design for the actual problem instead of assuming a demographic segment shares one motive.\n\nAge and demographic labels cannot fully explain why a person chooses a product. Understanding the progress they seek leads to more useful offers and messages."},"exampleType":"illustrative"},{"id":37,"term":"Job mapping","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":11,"definition":"Breaking a job down into its steps — define, locate, prepare, execute, conclude — to see where customers struggle and where the innovation opportunities are.","explanation":"Mapping a job divides it into define, locate, prepare, execute and conclude. This makes it possible to identify where the customer gets stuck instead of assuming the difficulty happens only during the final action. Each problem point may suggest an opportunity to improve the offer or information.\n\nBreaking a customer's job into steps reveals barriers that a single satisfaction score might hide. Improvements can target the precise stage where people struggle.","example":"Illustrative example: For booking a bicycle repair, a customer must identify the problem, find a nearby mechanic, choose a time, drop off the bike and collect it. Mapping those steps reveals whether the biggest frustration is finding the shop or booking a slot.","full":"Job mapping divides the progress a customer wants to make into stages such as defining, locating, preparing, executing and concluding a task. This makes it possible to identify where the customer gets stuck instead of assuming the difficulty happens only during the final action. Each problem point may suggest an opportunity to improve the offer or information.\n\nAn IKEA kitchen customer first defines storage needs, locates measurements, prepares a plan, orders components and finally completes installation. Mapping the sequence reveals where the experience fails: perhaps measuring instructions are unclear, instead of the price being wrong. Improving that step can remove friction from the wider job. Job mapping makes a broad customer need actionable by breaking it into observable stages and obstacles.\n\nBreaking a customer's job into steps reveals barriers that a single satisfaction score might hide. Improvements can target the precise stage where people struggle.","category":"CUSTOMER BEHAVIOUR","study":{"simple":"Mapping a job divides it into define, locate, prepare, execute and conclude. This makes it possible to identify where the customer gets stuck instead of assuming the difficulty happens only during the final action.","why":"Breaking a customer's job into steps reveals barriers that a single satisfaction score might hide. Improvements can target the precise stage where people struggle. Mapping the sequence reveals where the experience fails: perhaps measuring instructions are unclear, instead of the price being wrong. Improving that step can remove friction from the wider job.","example":"For booking a bicycle repair, a customer must identify the problem, find a nearby mechanic, choose a time, drop off the bike and collect it. Mapping those steps reveals whether the biggest frustration is finding the shop or booking a slot.","exam":"Job mapping divides the progress a customer wants to make into stages such as defining, locating, preparing, executing and concluding a task. This makes it possible to identify where the customer gets stuck instead of assuming the difficulty happens only during the final action. Each problem point may suggest an opportunity to improve the offer or information.\n\nAn IKEA kitchen customer first defines storage needs, locates measurements, prepares a plan, orders components and finally completes installation. Mapping the sequence reveals where the experience fails: perhaps measuring instructions are unclear, instead of the price being wrong. Improving that step can remove friction from the wider job. Job mapping makes a broad customer need actionable by breaking it into observable stages and obstacles.\n\nBreaking a customer's job into steps reveals barriers that a single satisfaction score might hide. Improvements can target the precise stage where people struggle."},"exampleType":"illustrative"},{"id":38,"term":"Inbound marketing","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":11,"definition":"Marketing that earns attention by being findable and useful: pages, guides and blog posts that match real searches, organic social, newsletters people choose to receive, reviews and user-generated content.","explanation":"Inbound activity aims to be found when people have a relevant question or need. Search-friendly guides, helpful pages, chosen newsletters and organic content can attract attention without directly interrupting the user. The emphasis is on being useful and discoverable.\n\nUseful content can meet a person at the moment they need help. It builds discoverability without relying on interrupting an unrelated activity.","example":"Real-world example: Patagonia's Worn Wear page explains how customers can trade in eligible used gear. People looking for trade-in information can find useful content on their own, illustrating how helpful content can attract rather than interrupt.","full":"Inbound marketing is marketing that earns attention by being findable and useful: pages, guides and blog posts that match real searches, organic social, newsletters people choose to receive, reviews and user-generated content. Inbound activity aims to be found when people have a relevant question or need. Search-friendly guides, helpful pages, chosen newsletters and organic content can attract attention without directly interrupting the user. The emphasis is on being useful and discoverable.\n\nA person searching for small-bedroom storage ideas might find IKEA's planning guides before considering any particular wardrobe. The content attracts attention because it answers an existing question instead of interrupting another activity. When relevant guides link naturally to suitable products, interest can progress toward purchase. Inbound marketing depends on usefulness and findability; publishing many unrelated articles would not achieve the same effect.\n\nUseful content can meet a person at the moment they need help. It builds discoverability without relying on interrupting an unrelated activity.","category":"INBOUND AND OUTBOUND","study":{"simple":"Inbound activity aims to be found when people have a relevant question or need. Search-friendly guides, helpful pages, chosen newsletters and organic content can attract attention without directly interrupting the user.","why":"Useful content can meet a person at the moment they need help. It builds discoverability without relying on interrupting an unrelated activity. The content attracts attention because it answers an existing question instead of interrupting another activity. When relevant guides link naturally to suitable products, interest can progress toward purchase.","example":"Patagonia's Worn Wear page explains how customers can trade in eligible used gear. People looking for trade-in information can find useful content on their own, illustrating how helpful content can attract rather than interrupt.","exam":"Inbound marketing is marketing that earns attention by being findable and useful: pages, guides and blog posts that match real searches, organic social, newsletters people choose to receive, reviews and user-generated content. Inbound activity aims to be found when people have a relevant question or need. Search-friendly guides, helpful pages, chosen newsletters and organic content can attract attention without directly interrupting the user. The emphasis is on being useful and discoverable.\n\nA person searching for small-bedroom storage ideas might find IKEA's planning guides before considering any particular wardrobe. The content attracts attention because it answers an existing question instead of interrupting another activity. When relevant guides link naturally to suitable products, interest can progress toward purchase. Inbound marketing depends on usefulness and findability; publishing many unrelated articles would not achieve the same effect.\n\nUseful content can meet a person at the moment they need help. It builds discoverability without relying on interrupting an unrelated activity."},"exampleType":"real","exampleSource":"https://www.patagonia.com/trade-in/"},{"id":39,"term":"Outbound marketing","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":12,"definition":"Marketing that pushes a message to an audience: paid social ads, display banners and pop-ups, pre-roll video, direct mail, cold calls, out-of-home advertising and sponsored content.","explanation":"Outbound activity sends the message toward an audience instead of waiting to be found. Examples in the lecture include paid social advertising, banners, video pre-rolls, direct mail and cold calls. The key contrast with inbound is the way attention is reached: interruption or push versus attraction through useful content.\n\nOutbound can create awareness among people not actively searching, but an irrelevant interruption can waste attention and money.","example":"Illustrative example: Imagine a 15-second ad for language lessons appearing before a person can play a music video. The viewer wasn't looking for lessons; the advertiser pushed a message into another activity, which is outbound marketing.","full":"Outbound marketing is marketing that pushes a message to an audience: paid social ads, display banners and pop-ups, pre-roll video, direct mail, cold calls, out-of-home advertising and sponsored content. Outbound activity sends the message toward an audience instead of waiting to be found. Examples in the lecture include paid social advertising, banners, video pre-rolls, direct mail and cold calls. The key contrast with inbound is the way attention is reached: interruption or push versus attraction through useful content.\n\nImagine Nike pays for an audio advertisement that interrupts a free Spotify listening session. The listener did not request shoe information, so the brand has pushed a message into an existing activity. Outbound can reach people before they search, but the interruption may be ignored. Its value depends on suitable targeting, creative relevance and outcomes instead of the fact that the ad was delivered.\n\nOutbound can create awareness among people not actively searching, but an irrelevant interruption can waste attention and money.","category":"INBOUND AND OUTBOUND","study":{"simple":"Outbound activity sends the message toward an audience instead of waiting to be found. Examples in the lecture include paid social advertising, banners, video pre-rolls, direct mail and cold calls.","why":"Outbound can create awareness among people not actively searching, but an irrelevant interruption can waste attention and money. The listener did not request shoe information, so the brand has pushed a message into an existing activity. Outbound can reach people before they search, but the interruption may be ignored.","example":"Imagine a 15-second ad for language lessons appearing before a person can play a music video. The viewer wasn't looking for lessons; the advertiser pushed a message into another activity, which is outbound marketing.","exam":"Outbound marketing is marketing that pushes a message to an audience: paid social ads, display banners and pop-ups, pre-roll video, direct mail, cold calls, out-of-home advertising and sponsored content. Outbound activity sends the message toward an audience instead of waiting to be found. Examples in the lecture include paid social advertising, banners, video pre-rolls, direct mail and cold calls. The key contrast with inbound is the way attention is reached: interruption or push versus attraction through useful content.\n\nImagine Nike pays for an audio advertisement that interrupts a free Spotify listening session. The listener did not request shoe information, so the brand has pushed a message into an existing activity. Outbound can reach people before they search, but the interruption may be ignored. Its value depends on suitable targeting, creative relevance and outcomes instead of the fact that the ad was delivered.\n\nOutbound can create awareness among people not actively searching, but an irrelevant interruption can waste attention and money."},"exampleType":"illustrative"},{"id":40,"term":"SEO (search engine optimization)","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":12,"definition":"The work of making a site findable and rankable in search engines. It has three components: technical, on-site and off-site.","explanation":"SEO seeks to make pages accessible, relevant and credible in organic search results. Technical SEO helps search engines reach and read a site; on-site SEO improves the pages themselves; off-site SEO concerns signals from elsewhere. These aspects work together to support findability and ranking.\n\nSearch visibility needs accessible pages, relevant content and outside credibility. Fixing only keywords will not resolve broken crawling or weak authority.","example":"Illustrative example: A small bakery wants its sourdough recipe guide to appear in Google. It needs readable pages, clear headings and credible links—not merely repeated keywords. SEO combines technical, on-page and off-page work.","full":"SEO (search engine optimization) is the work of making a site findable and rankable in search engines. It has three components: technical, on-site and off-site. SEO seeks to make pages accessible, relevant and credible in organic search results. Technical SEO helps search engines reach and read a site; on-site SEO improves the pages themselves; off-site SEO concerns signals from elsewhere. These aspects work toget
