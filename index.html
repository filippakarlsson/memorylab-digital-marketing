those details without opening the company's website. Out-of-date opening hours can waste the customer's trip and damage trust. Local visibility therefore depends on accurate practical information, not only broad brand recognition.\n\nCustomers deciding whether to visit a location rely on accurate business information. Wrong opening hours can undermine trust before a purchase begins."},"exampleType":"real","exampleSource":"https://support.google.com/business/answer/15300403?hl=en"},{"id":72,"term":"Reviews and mentions","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":20,"definition":"Other people doing your marketing. Answering them matters, because the reply is read by everyone who comes after.","explanation":"People’s comments, recommendations and discussions can affect the reputation of a business. The organisation does not fully control this conversation, but it can respond. A public reply matters because later readers see both the original comment and the response.\n\nOther people's experiences can affect a brand's reputation. A respectful public response can be read by future customers even if it does not erase a negative review.","example":"Real-world example: Airbnb lets guests browse and sort reviews, including by most recent or highest-rated. Those reviews are opinions from customers, and the host's response can matter to future guests.","full":"Customer reviews and public mentions are communications about an organization produced by other people, not fully controlled by the organization itself. People’s comments, recommendations and discussions can affect the reputation of a business. The organisation does not fully control this conversation, but it can respond. A public reply matters because later readers see both the original comment and the response.\n\nImagine a dissatisfied customer reviews a Samsung appliance publicly. Future buyers may read both the complaint and the company's response when deciding whether to trust the product. A factual, helpful reply can show accountability; an aggressive dismissal may compound the reputational problem. Brands can engage with reviews but cannot legitimately control the independent experiences that produced them.\n\nOther people's experiences can affect a brand's reputation. A respectful public response can be read by future customers even if it does not erase a negative review.","category":"OFF-SITE SEO","study":{"simple":"People’s comments, recommendations and discussions can affect the reputation of a business. The organisation does not fully control this conversation, but it can respond.","why":"Other people's experiences can affect a brand's reputation. A respectful public response can be read by future customers even if it does not erase a negative review. Future buyers may read both the complaint and the company's response when deciding whether to trust the product. A factual, helpful reply can show accountability; an aggressive dismissal may compound the reputational problem.","example":"Airbnb lets guests browse and sort reviews, including by most recent or highest-rated. Those reviews are opinions from customers, and the host's response can matter to future guests.","exam":"Customer reviews and public mentions are communications about an organization produced by other people, not fully controlled by the organization itself. People’s comments, recommendations and discussions can affect the reputation of a business. The organisation does not fully control this conversation, but it can respond. A public reply matters because later readers see both the original comment and the response.\n\nImagine a dissatisfied customer reviews a Samsung appliance publicly. Future buyers may read both the complaint and the company's response when deciding whether to trust the product. A factual, helpful reply can show accountability; an aggressive dismissal may compound the reputational problem. Brands can engage with reviews but cannot legitimately control the independent experiences that produced them.\n\nOther people's experiences can affect a brand's reputation. A respectful public response can be read by future customers even if it does not erase a negative review."},"exampleType":"real","exampleSource":"https://www.airbnb.com/help/article/1885"},{"id":73,"term":"HTTPS","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":21,"definition":"Secure communication between the browser and the site. Without it, browsers warn the visitor before they ever see your content.","explanation":"HTTPS creates a secure connection between the visitor’s browser and the website. The course includes it as a basic technical SEO and trust requirement. A browser warning about an insecure site can damage confidence before visitors even reach the intended content.\n\nA secure connection protects data in transit and avoids browser warnings that can make users abandon a site.","example":"Illustrative example: When someone enters card details into an online shoe store, HTTPS protects the connection between their browser and the website. Without a secure connection, shoppers may see warnings or lose trust.","full":"HTTPS is a protocol that secures communication between a website and a visitor’s browser through encryption. HTTPS creates a secure connection between the visitor’s browser and the website. The course includes it as a basic technical SEO and trust requirement. A browser warning about an insecure site can damage confidence before visitors even reach the intended content.\n\nA checkout on Nike's website uses HTTPS to encrypt traffic between the shopper's browser and the service. This helps protect information in transit and supports trust in the buying process. It does not, by itself, prove that every business practice on the website is legitimate or secure. HTTPS is a necessary technical baseline, not a complete guarantee of customer safety.\n\nA secure connection protects data in transit and avoids browser warnings that can make users abandon a site.","category":"TECHNICAL SEO","study":{"simple":"HTTPS creates a secure connection between the visitor’s browser and the website. The course includes it as a basic technical SEO and trust requirement.","why":"A secure connection protects data in transit and avoids browser warnings that can make users abandon a site. This helps protect information in transit and supports trust in the buying process. It does not, by itself, prove that every business practice on the website is legitimate or secure.","example":"When someone enters card details into an online shoe store, HTTPS protects the connection between their browser and the website. Without a secure connection, shoppers may see warnings or lose trust.","exam":"HTTPS is a protocol that secures communication between a website and a visitor’s browser through encryption. HTTPS creates a secure connection between the visitor’s browser and the website. The course includes it as a basic technical SEO and trust requirement. A browser warning about an insecure site can damage confidence before visitors even reach the intended content.\n\nA checkout on Nike's website uses HTTPS to encrypt traffic between the shopper's browser and the service. This helps protect information in transit and supports trust in the buying process. It does not, by itself, prove that every business practice on the website is legitimate or secure. HTTPS is a necessary technical baseline, not a complete guarantee of customer safety.\n\nA secure connection protects data in transit and avoids browser warnings that can make users abandon a site."},"exampleType":"illustrative"},{"id":74,"term":"Core Web Vitals","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":21,"definition":"User-focused metrics designed to measure page quality in terms of a smooth and seamless user experience. This is how speed is measured.","explanation":"These measurements focus on aspects of the real page experience, particularly how smoothly the site behaves for users. They help turn the general idea of performance into measurable signals. Poor performance can make a page harder and more frustrating to use.\n\nSlow loading or unstable page behaviour can stop visitors completing a task. Experience metrics help teams prioritise specific problems instead of saying 'make it faster'.","example":"Illustrative example: Imagine a concert website where the 'Buy' button keeps moving as images load. Even if the page looks attractive, that unstable experience is exactly the sort of usability problem measured by Core Web Vitals.","full":"Core Web Vitals are user-centred measures of loading, responsiveness and visual stability on web pages. These measurements focus on aspects of the real page experience, particularly how smoothly the site behaves for users. They help turn the general idea of performance into measurable signals. Poor performance can make a page harder and more frustrating to use.\n\nGoogle's Core Web Vitals evaluate user-experience dimensions such as loading, interaction responsiveness and unexpected layout movement. A mobile IKEA product page that shifts the buy button while loading can cause accidental taps even if the text is useful. These measures turn vague complaints about a 'slow site' into more specific problems. Performance is important for usability, but it cannot replace relevance or trustworthy content.\n\nSlow loading or unstable page behaviour can stop visitors completing a task. Experience metrics help teams prioritise specific problems instead of saying 'make it faster'.","category":"TECHNICAL SEO","study":{"simple":"These measurements focus on aspects of the real page experience, particularly how smoothly the site behaves for users. They help turn the general idea of performance into measurable signals.","why":"Slow loading or unstable page behaviour can stop visitors completing a task. Experience metrics help teams prioritise specific problems instead of saying 'make it faster'. A mobile IKEA product page that shifts the buy button while loading can cause accidental taps even if the text is useful. These measures turn vague complaints about a 'slow site' into more specific problems.","example":"Imagine a concert website where the 'Buy' button keeps moving as images load. Even if the page looks attractive, that unstable experience is exactly the sort of usability problem measured by Core Web Vitals.","exam":"Core Web Vitals are user-centred measures of loading, responsiveness and visual stability on web pages. These measurements focus on aspects of the real page experience, particularly how smoothly the site behaves for users. They help turn the general idea of performance into measurable signals. Poor performance can make a page harder and more frustrating to use.\n\nGoogle's Core Web Vitals evaluate user-experience dimensions such as loading, interaction responsiveness and unexpected layout movement. A mobile IKEA product page that shifts the buy button while loading can cause accidental taps even if the text is useful. These measures turn vague complaints about a 'slow site' into more specific problems. Performance is important for usability, but it cannot replace relevance or trustworthy content.\n\nSlow loading or unstable page behaviour can stop visitors completing a task. Experience metrics help teams prioritise specific problems instead of saying 'make it faster'."},"exampleType":"illustrative"},{"id":75,"term":"Mobile-friendliness","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":21,"definition":"Whether the site adapts well across screen sizes. Google evaluates the mobile version of your site first.","explanation":"A mobile-friendly page adapts to small screens so visitors can read and use it. The course connects this to Google’s emphasis on evaluating the mobile version of a site. A design that works on a desktop but fails on a phone creates both usability and search problems.\n\nA site that works on a desktop but fails on a phone can lose users and search visibility. Mobile experience must be considered from the start.","example":"Illustrative example: A hotel-booking page may look fine on a laptop but have tiny buttons and cut-off prices on a phone. Making it work on a small screen is mobile-friendliness, not simply shrinking the desktop layout.","full":"Mobile-friendliness concerns whether the site adapts well across screen sizes. Google evaluates the mobile version of your site first. A mobile-friendly page adapts to small screens so visitors can read and use it. The course connects this to Google’s emphasis on evaluating the mobile version of a site. A design that works on a desktop but fails on a phone creates both usability and search problems.\n\nAn IKEA product page might look clear on a desktop but place purchase controls off-screen or require sideways scrolling on an iPhone. A mobile-friendly design rearranges content to fit smaller screens while keeping buttons usable. This matters because many shoppers research products on phones and search systems primarily evaluate mobile content. A responsive layout must preserve information, not simply shrink everything.\n\nA site that works on a desktop but fails on a phone can lose users and search visibility. Mobile experience must be considered from the start.","category":"TECHNICAL SEO","study":{"simple":"A mobile-friendly page adapts to small screens so visitors can read and use it. The course connects this to Google’s emphasis on evaluating the mobile version of a site.","why":"A site that works on a desktop but fails on a phone can lose users and search visibility. Mobile experience must be considered from the start. A mobile-friendly design rearranges content to fit smaller screens while keeping buttons usable. This matters because many shoppers research products on phones and search systems primarily evaluate mobile content.","example":"A hotel-booking page may look fine on a laptop but have tiny buttons and cut-off prices on a phone. Making it work on a small screen is mobile-friendliness, not simply shrinking the desktop layout.","exam":"Mobile-friendliness concerns whether the site adapts well across screen sizes. Google evaluates the mobile version of your site first. A mobile-friendly page adapts to small screens so visitors can read and use it. The course connects this to Google’s emphasis on evaluating the mobile version of a site. A design that works on a desktop but fails on a phone creates both usability and search problems.\n\nAn IKEA product page might look clear on a desktop but place purchase controls off-screen or require sideways scrolling on an iPhone. A mobile-friendly design rearranges content to fit smaller screens while keeping buttons usable. This matters because many shoppers research products on phones and search systems primarily evaluate mobile content. A responsive layout must preserve information, not simply shrink everything.\n\nA site that works on a desktop but fails on a phone can lose users and search visibility. Mobile experience must be considered from the start."},"exampleType":"illustrative"},{"id":76,"term":"404 error (broken link)","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":21,"definition":"A missing page. 404 errors waste both the visitor's time and the crawler's budget.","explanation":"A 404 occurs when a requested page is missing. A visitor may reach a dead end, and a crawler may spend effort following a link that provides no useful page. Site audits identify these errors so important navigation paths can be repaired.\n\nA broken destination interrupts the visitor's task and wastes crawl effort. Fixing important dead links restores access to content.","example":"Illustrative example: A bakery posts a link to its Christmas menu, but customers reach '404 Not Found' because the page was deleted. The broken link stops both visitors and crawlers from reaching the promised information.","full":"An HTTP 404 response indicates that the requested webpage cannot be found at the specified address. A visitor may reach a dead end, and a crawler may spend effort following a link that provides no useful page. Site audits identify these errors so important navigation paths can be repaired.\n\nAn event listing that links to a removed showtime page may produce a 404 error. The user reaches a dead end and a crawler follows a route that yields no useful content. Some 404 responses are normal when a page genuinely no longer exists, but important navigation should be repaired or redirected appropriately. The marketing consequence is lost access during a decision or purchase journey.\n\nA broken destination interrupts the visitor's task and wastes crawl effort. Fixing important dead links restores access to content.","category":"TECHNICAL SEO","study":{"simple":"A 404 occurs when a requested page is missing. A visitor may reach a dead end, and a crawler may spend effort following a link that provides no useful page.","why":"A broken destination interrupts the visitor's task and wastes crawl effort. Fixing important dead links restores access to content. The user reaches a dead end and a crawler follows a route that yields no useful content. Some 404 responses are normal when a page genuinely no longer exists, but important navigation should be repaired or redirected appropriately.","example":"A bakery posts a link to its Christmas menu, but customers reach '404 Not Found' because the page was deleted. The broken link stops both visitors and crawlers from reaching the promised information.","exam":"An HTTP 404 response indicates that the requested webpage cannot be found at the specified address. A visitor may reach a dead end, and a crawler may spend effort following a link that provides no useful page. Site audits identify these errors so important navigation paths can be repaired.\n\nAn event listing that links to a removed showtime page may produce a 404 error. The user reaches a dead end and a crawler follows a route that yields no useful content. Some 404 responses are normal when a page genuinely no longer exists, but important navigation should be repaired or redirected appropriately. The marketing consequence is lost access during a decision or purchase journey.\n\nA broken destination interrupts the visitor's task and wastes crawl effort. Fixing important dead links restores access to content."},"exampleType":"illustrative"},{"id":77,"term":"Crawlability","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":22,"definition":"Whether the crawler can reach and read your pages. Nothing you write matters if the crawler cannot get to it.","explanation":"Crawlability asks whether a search-engine robot can access and read the relevant pages. Good text is not enough if important content is blocked or unreachable. The course treats crawlability as a foundation for subsequent indexing and ranking.\n\nWhen crawlers cannot reach a page, content improvements cannot help that page participate normally in search. Access is foundational.","example":"Illustrative example: Imagine a clothing store's new jacket page exists but has no links from the site and is blocked from crawling. Search robots cannot reliably reach or read it, so better product descriptions alone won't solve the problem.","full":"Crawlability concerns whether the crawler can reach and read your pages. Nothing you write matters if the crawler cannot get to it. Crawlability asks whether a search-engine robot can access and read the relevant pages. Good text is not enough if important content is blocked or unreachable. The course treats crawlability as a foundation for subsequent indexing and ranking.\n\nImagine a Nike product listing that cannot be reached by Googlebot because it is blocked or lacks a navigable path. Even excellent product copy may never be discovered for indexing. Crawlability therefore concerns access before ranking quality. The appropriate solution is to inspect the barrier and site architecture, not to add more keywords to content that the crawler cannot read.\n\nWhen crawlers cannot reach a page, content improvements cannot help that page participate normally in search. Access is foundational.","category":"TECHNICAL SEO","study":{"simple":"Crawlability asks whether a search-engine robot can access and read the relevant pages. Good text is not enough if important content is blocked or unreachable.","why":"When crawlers cannot reach a page, content improvements cannot help that page participate normally in search. Access is foundational. Even excellent product copy may never be discovered for indexing. Crawlability therefore concerns access before ranking quality.","example":"Imagine a clothing store's new jacket page exists but has no links from the site and is blocked from crawling. Search robots cannot reliably reach or read it, so better product descriptions alone won't solve the problem.","exam":"Crawlability concerns whether the crawler can reach and read your pages. Nothing you write matters if the crawler cannot get to it. Crawlability asks whether a search-engine robot can access and read the relevant pages. Good text is not enough if important content is blocked or unreachable. The course treats crawlability as a foundation for subsequent indexing and ranking.\n\nImagine a Nike product listing that cannot be reached by Googlebot because it is blocked or lacks a navigable path. Even excellent product copy may never be discovered for indexing. Crawlability therefore concerns access before ranking quality. The appropriate solution is to inspect the barrier and site architecture, not to add more keywords to content that the crawler cannot read.\n\nWhen crawlers cannot reach a page, content improvements cannot help that page participate normally in search. Access is foundational."},"exampleType":"illustrative"},{"id":78,"term":"Site Health score","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":22,"definition":"The overall score a site audit gives your domain, alongside a ranked list of errors and warnings. A site audit turns technical SEO into a to-do list.","explanation":"Site-audit tools combine findings into a general health score while also listing errors and warnings. The score gives an overview, but the actionable value lies in the specific problems identified. Fixes should be prioritised by their significance instead of treating the score as the whole objective.\n\nAn overall audit score is a starting signal, not the objective. Teams should fix the errors with the greatest real consequence.","example":"Illustrative example: A website-audit tool gives a small online shop an overall health score and a list of 404s, slow pages and missing metadata. The useful part isn't boasting about the score: it's knowing which serious issues to repair first.","full":"Site Health score is the overall score a site audit gives your domain, alongside a ranked list of errors and warnings. A site audit turns technical SEO into a to-do list. Site-audit tools combine findings into a general health score while also listing errors and warnings. The score gives an overview, but the actionable value lies in the specific problems identified. Fixes should be prioritised by their significance instead of treating the score as the whole objective.\n\nA hypothetical site audit of an IKEA campaign microsite might combine broken links, missing titles and crawl issues into an overall Site Health score. The aggregate figure gives a quick overview but cannot tell the team which issue is most damaging. A blocked purchase page may deserve urgent attention even when the score looks acceptable. Decision-making should prioritize actual consequences over maximizing a dashboard number.\n\nAn overall audit score is a starting signal, not the objective. Teams should fix the errors with the greatest real consequence.","category":"TECHNICAL SEO","study":{"simple":"Site-audit tools combine findings into a general health score while also listing errors and warnings. The score gives an overview, but the actionable value lies in the specific problems identified.","why":"An overall audit score is a starting signal, not the objective. Teams should fix the errors with the greatest real consequence. The aggregate figure gives a quick overview but cannot tell the team which issue is most damaging. A blocked purchase page may deserve urgent attention even when the score looks acceptable.","example":"A website-audit tool gives a small online shop an overall health score and a list of 404s, slow pages and missing metadata. The useful part isn't boasting about the score: it's knowing which serious issues to repair first.","exam":"Site Health score is the overall score a site audit gives your domain, alongside a ranked list of errors and warnings. A site audit turns technical SEO into a to-do list. Site-audit tools combine findings into a general health score while also listing errors and warnings. The score gives an overview, but the actionable value lies in the specific problems identified. Fixes should be prioritised by their significance instead of treating the score as the whole objective.\n\nA hypothetical site audit of an IKEA campaign microsite might combine broken links, missing titles and crawl issues into an overall Site Health score. The aggregate figure gives a quick overview but cannot tell the team which issue is most damaging. A blocked purchase page may deserve urgent attention even when the score looks acceptable. Decision-making should prioritize actual consequences over maximizing a dashboard number.\n\nAn overall audit score is a starting signal, not the objective. Teams should fix the errors with the greatest real consequence."},"exampleType":"illustrative"},{"id":79,"term":"Markup (structured data)","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":22,"definition":"Code that tells robots about the content on your site, so that it can be understood and displayed correctly in search results.","explanation":"Structured data labels information in a form that machines can interpret more precisely. It helps search systems understand what a page contains and may support particular ways information is displayed. It is different from the visible copy, although it should describe that content accurately.\n\nStructured data helps machines identify what content means—for example, a product, organisation or event. Incorrect markup can misrepresent the page.","example":"Real-world example: Google documents structured-data types for products, recipes and events. For example, a recipe page can identify ingredients and cooking information in machine-readable code so search systems understand what the content represents.","full":"Structured data, also called markup, labels website information in a machine-readable form so search systems can identify relevant entities and properties. It helps search systems understand what a page contains and may support particular ways information is displayed. It is different from the visible copy, although it should describe that content accurately.\n\nAn event page can add structured data identifying an event's name, location and date in a machine-readable format. Search systems can then interpret the visible information more precisely and may support suitable search features. The markup must match the real page content; false event dates would mislead both systems and visitors. Adding schema does not guarantee a rich result or a top ranking.\n\nStructured data helps machines identify what content means—for example, a product, organisation or event. Incorrect markup can misrepresent the page.","category":"TECHNICAL SEO","study":{"simple":"Structured data labels information in a form that machines can interpret more precisely. It helps search systems understand what a page contains and may support particular ways information is displayed.","why":"Structured data helps machines identify what content means—for example, a product, organisation or event. Incorrect markup can misrepresent the page. Search systems can then interpret the visible information more precisely and may support suitable search features. The markup must match the real page content; false event dates would mislead both systems and visitors.","example":"Google documents structured-data types for products, recipes and events. For example, a recipe page can identify ingredients and cooking information in machine-readable code so search systems understand what the content represents.","exam":"Structured data, also called markup, labels website information in a machine-readable form so search systems can identify relevant entities and properties. It helps search systems understand what a page contains and may support particular ways information is displayed. It is different from the visible copy, although it should describe that content accurately.\n\nAn event page can add structured data identifying an event's name, location and date in a machine-readable format. Search systems can then interpret the visible information more precisely and may support suitable search features. The markup must match the real page content; false event dates would mislead both systems and visitors. Adding schema does not guarantee a rich result or a top ranking.\n\nStructured data helps machines identify what content means—for example, a product, organisation or event. Incorrect markup can misrepresent the page."},"exampleType":"real","exampleSource":"https://developers.google.com/search/docs/appearance/structured-data/search-gallery"},{"id":80,"term":"Semrush","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":22,"definition":"The tool used in the assignment: site audit, keywords and backlinks. Open a demo account, find Site Audit, enter your domain and start the crawl.","explanation":"The course uses Semrush for investigating a site’s technical condition, keywords and backlinks. A site audit begins by entering the relevant domain and letting the tool crawl it. The output provides findings to interpret and prioritise instead of replacing human judgement.\n\nAn SEO platform helps identify issues and priorities, but a tool's warning needs interpretation. Not every flagged item has the same impact.","example":"Illustrative example: Imagine a bicycle shop checking its site in Semrush. The tool reports broken pages and missing titles; the shop uses the findings to decide what to fix, rather than assuming the tool has already improved its rankings.","full":"Semrush is a digital marketing analysis tool that offers SEO audits and research into keywords, backlinks and site health. A site audit begins by entering the relevant domain and letting the tool crawl it. The output provides findings to interpret and prioritise instead of replacing human judgement.\n\nA marketer could run a Semrush Site Audit on a Nike microsite to inspect technical warnings, then use keyword or backlink reports to examine other SEO dimensions. The software organizes evidence but does not decide which problems matter for the site's audience. A large warning count may contain many low-impact issues. Interpretation connects the tool's findings to the business goal and user journey.\n\nAn SEO platform helps identify issues and priorities, but a tool's warning needs interpretation. Not every flagged item has the same impact.","category":"TOOLS","study":{"simple":"The course uses Semrush for investigating a site’s technical condition, keywords and backlinks. A site audit begins by entering the relevant domain and letting the tool crawl it.","why":"An SEO platform helps identify issues and priorities, but a tool's warning needs interpretation. Not every flagged item has the same impact. The software organizes evidence but does not decide which problems matter for the site's audience. A large warning count may contain many low-impact issues.","example":"Imagine a bicycle shop checking its site in Semrush. The tool reports broken pages and missing titles; the shop uses the findings to decide what to fix, rather than assuming the tool has already improved its rankings.","exam":"Semrush is a digital marketing analysis tool that offers SEO audits and research into keywords, backlinks and site health. A site audit begins by entering the relevant domain and letting the tool crawl it. The output provides findings to interpret and prioritise instead of replacing human judgement.\n\nA marketer could run a Semrush Site Audit on a Nike microsite to inspect technical warnings, then use keyword or backlink reports to examine other SEO dimensions. The software organizes evidence but does not decide which problems matter for the site's audience. A large warning count may contain many low-impact issues. Interpretation connects the tool's findings to the business goal and user journey.\n\nAn SEO platform helps identify issues and priorities, but a tool's warning needs interpretation. Not every flagged item has the same impact."},"exampleType":"illustrative"},{"id":81,"term":"PageSpeed Insights","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":22,"definition":"pagespeed.web.dev — a free tool that reports Core Web Vitals and performance for a single page.","explanation":"This free Google tool analyses performance for an individual page at pagespeed.web.dev. It reports page-experience information including Core Web Vitals. It can help find where page speed or responsiveness needs attention.\n\nPage-level performance results can show where slow loading or delayed interactions affect real users. Recommendations need to be considered alongside the page's purpose.","example":"Illustrative example: An event organizer runs its ticket page through Google's PageSpeed Insights and discovers that large images slow down loading. The report gives evidence for performance fixes; it doesn't automatically make the page faster.","full":"Google PageSpeed Insights analyzes a specific webpage and reports performance diagnostics, including information related to Core Web Vitals. It reports page-experience information including Core Web Vitals. It can help find where page speed or responsiveness needs attention.\n\nAn IKEA landing-page owner can enter one URL in Google PageSpeed Insights and investigate loading, responsiveness and layout stability. This helps locate performance weaknesses on a specific page instead of treating site speed as an abstract concern. Results may differ between field observations and laboratory tests. A score supports diagnosis but cannot replace checking whether real customers can complete the intended task.\n\nPage-level performance results can show where slow loading or delayed interactions affect real users. Recommendations need to be considered alongside the page's purpose.","category":"TOOLS","study":{"simple":"This free Google tool analyses performance for an individual page at pagespeed.web.dev. It reports page-experience information including Core Web Vitals.","why":"Page-level performance results can show where slow loading or delayed interactions affect real users. Recommendations need to be considered alongside the page's purpose. This helps locate performance weaknesses on a specific page instead of treating site speed as an abstract concern. Results may differ between field observations and laboratory tests.","example":"An event organizer runs its ticket page through Google's PageSpeed Insights and discovers that large images slow down loading. The report gives evidence for performance fixes; it doesn't automatically make the page faster.","exam":"Google PageSpeed Insights analyzes a specific webpage and reports performance diagnostics, including information related to Core Web Vitals. It reports page-experience information including Core Web Vitals. It can help find where page speed or responsiveness needs attention.\n\nAn IKEA landing-page owner can enter one URL in Google PageSpeed Insights and investigate loading, responsiveness and layout stability. This helps locate performance weaknesses on a specific page instead of treating site speed as an abstract concern. Results may differ between field observations and laboratory tests. A score supports diagnosis but cannot replace checking whether real customers can complete the intended task.\n\nPage-level performance results can show where slow loading or delayed interactions affect real users. Recommendations need to be considered alongside the page's purpose."},"exampleType":"illustrative"},{"id":82,"term":"Prompt intent","lecture":"Lecture 5 · GEO and keyword analysis","page":24,"definition":"The job behind a prompt to an answer engine. The same informational, navigational, commercial and transactional intents transfer from search, but prompts can express more context and combine several intents.","explanation":"A prompt to an answer engine still comes from a person with a job to accomplish. Unlike a short search query, it may include detailed circumstances or several linked needs in the same request. Marketers need to understand the underlying purpose instead of treating prompt words as isolated keywords.\n\nLong prompts can express several needs at once. A brand should answer the underlying task instead of optimise only a single isolated phrase.","example":"Illustrative example: Someone asks an assistant, 'Which family hotels in Copenhagen have a pool, allow dogs and are near the station?' That one prompt combines several practical needs, so understanding the job matters more than repeating its keywords.","full":"Prompt intent is the job behind a prompt to an answer engine. The same informational, navigational, commercial and transactional intents transfer from search, but prompts can express more context and combine several intents. A prompt to an answer engine still comes from a person with a job to accomplish. Unlike a short search query, it may include detailed circumstances or several linked needs in the same request. Marketers need to understand the underlying purpose instead of treating prompt words as isolated keywords.\n\nA prompt such as 'Compare Nike and Adidas running shoes for a beginner under €100 who needs wide sizing' combines comparison, budget, product use and personal constraints. Short keyword matching would miss some of that job. Prompt intent analysis asks which decision the person is trying to make and what facts would be needed to support it. One prompt can combine informational and commercial needs.\n\nLong prompts can express several needs at once. A brand should answer the underlying task instead of optimise only a single isolated phrase.","category":"INTENT","study":{"simple":"A prompt to an answer engine still comes from a person with a job to accomplish. Unlike a short search query, it may include detailed circumstances or several linked needs in the same request.","why":"Long prompts can express several needs at once. A brand should answer the underlying task instead of optimise only a single isolated phrase. Short keyword matching would miss some of that job. Prompt intent analysis asks which decision the person is trying to make and what facts would be needed to support it.","example":"Someone asks an assistant, 'Which family hotels in Copenhagen have a pool, allow dogs and are near the station?' That one prompt combines several practical needs, so understanding the job matters more than repeating its keywords.","exam":"Prompt intent is the job behind a prompt to an answer engine. The same informational, navigational, commercial and transactional intents transfer from search, but prompts can express more context and combine several intents. A prompt to an answer engine still comes from a person with a job to accomplish. Unlike a short search query, it may include detailed circumstances or several linked needs in the same request. Marketers need to understand the underlying purpose instead of treating prompt words as isolated keywords.\n\nA prompt such as 'Compare Nike and Adidas running shoes for a beginner under €100 who needs wide sizing' combines comparison, budget, product use and personal constraints. Short keyword matching would miss some of that job. Prompt intent analysis asks which decision the person is trying to make and what facts would be needed to support it. One prompt can combine informational and commercial needs.\n\nLong prompts can express several needs at once. A brand should answer the underlying task instead of optimise only a single isolated phrase."},"exampleType":"illustrative"},{"id":83,"term":"GEO (Generative Engine Optimisation)","lecture":"Lecture 5 · GEO and keyword analysis","page":24,"definition":"The work of making content clear, consistent and structured enough to be quoted and cited in generated answers. GEO extends SEO; it does not replace it.","explanation":"GEO aims to help answer engines understand, summarise and cite information reliably. Clear answers, consistent facts and organised content make a source easier to use in generated responses. The course explicitly says GEO extends SEO instead of replacing the work required for normal search visibility.\n\nAssistants need unambiguous facts and clear answers to cite reliably. GEO expands visibility beyond ordinary result rankings while still depending on sound SEO.","example":"Illustrative example: Imagine a university page directly answering 'Can exchange students take design courses in English?' and using consistent programme details. Clear, reliable content is easier for an AI answer engine to identify and cite: the idea behind GEO.","full":"GEO (Generative Engine Optimisation) is the work of making content clear, consistent and structured enough to be quoted and cited in generated answers. GEO extends SEO; it does not replace it. GEO aims to help answer engines understand, summarise and cite information reliably. Clear answers, consistent facts and organised content make a source easier to use in generated responses. The course explicitly says GEO extends SEO instead of replacing the work required for normal search visibility.\n\nIf IKEA clearly states the dimensions and assembly requirements of a shelf in a consistent FAQ, an answer engine can more reliably interpret and potentially cite that information. GEO focuses on being understandable and credible inside generated answers, not just appearing as a clickable search result. SEO still matters because the source must be accessible and findable. A well-formatted answer cannot compensate for inaccurate underlying facts.\n\nAssistants need unambiguous facts and clear answers to cite reliably. GEO expands visibility beyond ordinary result rankings while still depending on sound SEO.","category":"GEO","study":{"simple":"GEO aims to help answer engines understand, summarise and cite information reliably. Clear answers, consistent facts and organised content make a source easier to use in generated responses.","why":"Assistants need unambiguous facts and clear answers to cite reliably. GEO expands visibility beyond ordinary result rankings while still depending on sound SEO. GEO focuses on being understandable and credible inside generated answers, not just appearing as a clickable search result SEO still matters because the source must be accessible and findable.","example":"Imagine a university page directly answering 'Can exchange students take design courses in English?' and using consistent programme details. Clear, reliable content is easier for an AI answer engine to identify and cite: the idea behind GEO.","exam":"GEO (Generative Engine Optimisation) is the work of making content clear, consistent and structured enough to be quoted and cited in generated answers. GEO extends SEO; it does not replace it. GEO aims to help answer engines understand, summarise and cite information reliably. Clear answers, consistent facts and organised content make a source easier to use in generated responses. The course explicitly says GEO extends SEO instead of replacing the work required for normal search visibility.\n\nIf IKEA clearly states the dimensions and assembly requirements of a shelf in a consistent FAQ, an answer engine can more reliably interpret and potentially cite that information. GEO focuses on being understandable and credible inside generated answers, not just appearing as a clickable search result. SEO still matters because the source must be accessible and findable. A well-formatted answer cannot compensate for inaccurate underlying facts.\n\nAssistants need unambiguous facts and clear answers to cite reliably. GEO expands visibility beyond ordinary result rankings while still depending on sound SEO."},"exampleType":"illustrative"},{"id":84,"term":"Answer block","lecture":"Lecture 5 · GEO and keyword analysis","page":24,"definition":"A concise two-sentence answer near the top of a page that resolves its main job before presenting the detail.","explanation":"An answer block resolves the main question near the beginning of a page, usually in about two sentences. Supporting details can then follow below. The structure helps people and answer engines identify the central answer without having to extract it from a long introduction.\n\nA direct answer near the top reduces the work required to find the essential information. Supporting evidence can follow without hiding the main point.","example":"Illustrative example: A delivery website could start with 'Standard delivery takes 3–5 working days. You can track the parcel after dispatch,' then explain exceptions below. The two-sentence answer block solves the main question immediately.","full":"An answer block is a concise response placed near the start of a webpage to resolve its main question before providing supporting details. Supporting details can then follow below. The structure helps people and answer engines identify the central answer without having to extract it from a long introduction.\n\nAn IKEA delivery page could begin with two direct sentences answering how long standard delivery takes and what affects the estimate. Detailed conditions can follow below for people who need them. This answer block gives the central information before the reader navigates a long page and helps extraction by answer systems. It succeeds through relevance and clarity, not by merely being short.\n\nA direct answer near the top reduces the work required to find the essential information. Supporting evidence can follow without hiding the main point.","category":"GEO","study":{"simple":"An answer block resolves the main question near the beginning of a page, usually in about two sentences. Supporting details can then follow below.","why":"A direct answer near the top reduces the work required to find the essential information. Supporting evidence can follow without hiding the main point. Detailed conditions can follow below for people who need them. This answer block gives the central information before the reader navigates a long page and helps extraction by answer systems.","example":"A delivery website could start with 'Standard delivery takes 3–5 working days. You can track the parcel after dispatch,' then explain exceptions below. The two-sentence answer block solves the main question immediately.","exam":"An answer block is a concise response placed near the start of a webpage to resolve its main question before providing supporting details. Supporting details can then follow below. The structure helps people and answer engines identify the central answer without having to extract it from a long introduction.\n\nAn IKEA delivery page could begin with two direct sentences answering how long standard delivery takes and what affects the estimate. Detailed conditions can follow below for people who need them. This answer block gives the central information before the reader navigates a long page and helps extraction by answer systems. It succeeds through relevance and clarity, not by merely being short.\n\nA direct answer near the top reduces the work required to find the essential information. Supporting evidence can follow without hiding the main point."},"exampleType":"illustrative"},{"id":85,"term":"Canonical tag","lecture":"Lecture 5 · GEO and keyword analysis","page":24,"definition":"An HTML signal used to identify the preferred URL when the same or very similar content exists on multiple URLs. It helps search engines understand which version should be treated as the main one.","explanation":"When multiple URLs display the same or very similar information, the canonical signal identifies the preferred version. This helps search systems distinguish the main page from duplicates. The chosen URL should provide a consistent reference for that content.\n\nDuplicate versions of a page can create uncertainty about which URL represents the content. A canonical tag indicates the preferred version.","example":"Illustrative example: A shoe shop accidentally has the same blue trainer listed at /shoes/blue and /sale/blue. A canonical tag indicates which URL should be treated as the preferred main page rather than making search engines guess.","full":"Canonical tag is an HTML signal used to identify the preferred URL when the same or very similar content exists on multiple URLs. It helps search engines understand which version should be treated as the main one. When multiple URLs display the same or very similar information, the canonical signal identifies the preferred version. This helps search systems distinguish the main page from duplicates. The chosen URL should provide a consistent reference for that content.\n\nSuppose one Samsung support article is reachable through two URLs with almost identical content. A canonical tag can identify the preferred version so search systems receive a consistent signal about which page represents that information. Canonicalization addresses duplicate-URL ambiguity, not whether the page is useful. It is a preference signal instead of a guarantee that a search engine will obey it.\n\nDuplicate versions of a page can create uncertainty about which URL represents the content. A canonical tag indicates the preferred version.","category":"GEO","study":{"simple":"When multiple URLs display the same or very similar information, the canonical signal identifies the preferred version. This helps search systems distinguish the main page from duplicates.","why":"Duplicate versions of a page can create uncertainty about which URL represents the content. A canonical tag indicates the preferred version. A canonical tag can identify the preferred version so search systems receive a consistent signal about which page represents that information. Canonicalization addresses duplicate-URL ambiguity, not whether the page is useful.","example":"A shoe shop accidentally has the same blue trainer listed at /shoes/blue and /sale/blue. A canonical tag indicates which URL should be treated as the preferred main page rather than making search engines guess.","exam":"Canonical tag is an HTML signal used to identify the preferred URL when the same or very similar content exists on multiple URLs. It helps search engines understand which version should be treated as the main one. When multiple URLs display the same or very similar information, the canonical signal identifies the preferred version. This helps search systems distinguish the main page from duplicates. The chosen URL should provide a consistent reference for that content.\n\nSuppose one Samsung support article is reachable through two URLs with almost identical content. A canonical tag can identify the preferred version so search systems receive a consistent signal about which page represents that information. Canonicalization addresses duplicate-URL ambiguity, not whether the page is useful. It is a preference signal instead of a guarantee that a search engine will obey it.\n\nDuplicate versions of a page can create uncertainty about which URL represents the content. A canonical tag indicates the preferred version."},"exampleType":"illustrative"},{"id":86,"term":"Entity","lecture":"Lecture 5 · GEO and keyword analysis","page":25,"definition":"A clearly identified thing — such as an organisation, programme, service or location — with one consistent name, set of facts and canonical page.","explanation":"An entity is a specific identifiable thing instead of a vague keyword, such as a programme or organisation. Using one consistent name and set of facts makes it easier to recognise across pages and answers. The course also links that consistency to a clear canonical page.\n\nConsistent names and facts help systems recognise the same organisation or programme across pages. Inconsistency creates avoidable confusion in generated answers.","example":"Illustrative example: A museum uses one official name, address and website everywhere—its own site, map listing and event pages. Those consistent facts help systems recognize the museum as one specific entity.","full":"Entity is a clearly identified thing — such as an organisation, programme, service or location — with one consistent name, set of facts and canonical page. An entity is a specific identifiable thing instead of a vague keyword, such as a programme or organisation. Using one consistent name and set of facts makes it easier to recognise across pages and answers. The course also links that consistency to a clear canonical page.\n\nAn answer engine needs to understand that IKEA store pages, customer support and product information refer to the same identifiable organization. Consistent naming, factual attributes and a canonical reference help connect those records. Entity clarity differs from repeating a keyword frequently. Conflicting details about a brand or service increase uncertainty when systems try to compose a trustworthy answer.\n\nConsistent names and facts help systems recognise the same organisation or programme across pages. Inconsistency creates avoidable confusion in generated answers.","category":"GEO","study":{"simple":"An entity is a specific identifiable thing instead of a vague keyword, such as a programme or organisation. Using one consistent name and set of facts makes it easier to recognise across pages and answers.","why":"Consistent names and facts help systems recognise the same organisation or programme across pages. Inconsistency creates avoidable confusion in generated answers. Consistent naming, factual attributes and a canonical reference help connect those records. Entity clarity differs from repeating a keyword frequently.","example":"A museum uses one official name, address and website everywhere—its own site, map listing and event pages. Those consistent facts help systems recognize the museum as one specific entity.","exam":"Entity is a clearly identified thing — such as an organisation, programme, service or location — with one consistent name, set of facts and canonical page. An entity is a specific identifiable thing instead of a vague keyword, such as a programme or organisation. Using one consistent name and set of facts makes it easier to recognise across pages and answers. The course also links that consistency to a clear canonical page.\n\nAn answer engine needs to understand that IKEA store pages, customer support and product information refer to the same identifiable organization. Consistent naming, factual attributes and a canonical reference help connect those records. Entity clarity differs from repeating a keyword frequently. Conflicting details about a brand or service increase uncertainty when systems try to compose a trustworthy answer.\n\nConsistent names and facts help systems recognise the same organisation or programme across pages. Inconsistency creates avoidable confusion in generated answers."},"exampleType":"illustrative"},{"id":87,"term":"Keyword analysis","lecture":"Lecture 5 · GEO and keyword analysis","page":25,"definition":"The process of identifying how an audience phrases demand, understanding the intent and value behind those queries, and mapping them to useful pages.","explanation":"Keyword analysis starts with the language people use when looking for something. It considers the intention and value of a query, not just how frequently the words appear. The resulting groups of keywords can be matched to pages that actually answer the need.\n\nKeyword analysis connects audience language with intent and relevant pages. High volume alone does not mean a phrase serves the customer's job.","example":"Illustrative example: A bike-rental company researches whether visitors search 'rent a bike for a day' or 'city bike hire.' It groups phrases by the need behind them and decides which useful page should answer each one.","full":"Keyword analysis is the process of identifying how an audience phrases demand, understanding the intent and value behind those queries, and mapping them to useful pages. Keyword analysis starts with the language people use when looking for something. It considers the intention and value of a query, not just how frequently the words appear. The resulting groups of keywords can be matched to pages that actually answer the need.\n\nA cinema might discover that some users search for general 'cinema tickets,' others for 'movie times,' and others for one film's specific screenings. Those queries represent different needs that may deserve different landing pages. Keyword analysis joins phrasing with intent and business relevance instead of picking the largest volume. A relevant low-volume request can be more valuable than a broad search attracting the wrong audience.\n\nKeyword analysis connects audience language with intent and relevant pages. High volume alone does not mean a phrase serves the customer's job.","category":"KEYWORD ANALYSIS","study":{"simple":"Keyword analysis starts with the language people use when looking for something. It considers the intention and value of a query, not just how frequently the words appear.","why":"Keyword analysis connects audience language with intent and relevant pages. High volume alone does not mean a phrase serves the customer's job. Those queries represent different needs that may deserve different landing pages. Keyword analysis joins phrasing with intent and business relevance instead of picking the largest volume.","example":"A bike-rental company researches whether visitors search 'rent a bike for a day' or 'city bike hire.' It groups phrases by the need behind them and decides which useful page should answer each one.","exam":"Keyword analysis is the process of identifying how an audience phrases demand, understanding the intent and value behind those queries, and mapping them to useful pages. Keyword analysis starts with the language people use when looking for something. It considers the intention and value of a query, not just how frequently the words appear. The resulting groups of keywords can be matched to pages that actually answer the need.\n\nA cinema might discover that some users search for general 'cinema tickets,' others for 'movie times,' and others for one film's specific screenings. Those queries represent different needs that may deserve different landing pages. Keyword analysis joins phrasing with intent and business relevance instead of picking the largest volume. A relevant low-volume request can be more valuable than a broad search attracting the wrong audience.\n\nKeyword analysis connects audience language with intent and relevant pages. High volume alone does not mean a phrase serves the customer's job."},"exampleType":"illustrative"},{"id":88,"term":"Seed keyword","lecture":"Lecture 5 · GEO and keyword analysis","page":25,"definition":"A starting phrase used to generate related keyword ideas. Audience, job, intent and the four Ps can all provide seeds.","explanation":"A seed is an initial phrase from which related searches can be explored. Seeds can come from the audience, the job they want done, their intent or the marketing mix. It is a starting point for investigation, not automatically the best final target.\n\nA seed keyword opens an exploration of related searches. It must be tested against actual needs instead of accepted as the final target automatically.","example":"Illustrative example: A baby-products shop begins keyword research with 'stroller.' It then explores related phrases such as 'lightweight stroller' and 'stroller for travel.' The original phrase is the seed, not automatically the best final target.","full":"Seed keyword is a starting phrase used to generate related keyword ideas. Audience, job, intent and the four Ps can all provide seeds. A seed is an initial phrase from which related searches can be explored. Seeds can come from the audience, the job they want done, their intent or the marketing mix. It is a starting point for investigation, not automatically the best final target.\n\nNike could start with the seed phrase 'running shoes' and explore related questions about fit, beginner use, terrain and injury concerns. The seed helps generate possibilities but is not automatically a suitable target for a single page. Research must determine the different intents inside the broad topic. Otherwise one generic page may try and fail to satisfy every searcher.\n\nA seed keyword opens an exploration of related searches. It must be tested against actual needs instead of accepted as the final target automatically.","category":"KEYWORD ANALYSIS","study":{"simple":"A seed is an initial phrase from which related searches can be explored. Seeds can come from the audience, the job they want done, their intent or the marketing mix.","why":"A seed keyword opens an exploration of related searches. It must be tested against actual needs instead of accepted as the final target automatically. The seed helps generate possibilities but is not automatically a suitable target for a single page. Research must determine the different intents inside the broad topic.","example":"A baby-products shop begins keyword research with 'stroller.' It then explores related phrases such as 'lightweight stroller' and 'stroller for travel.' The original phrase is the seed, not automatically the best final target.","exam":"Seed keyword is a starting phrase used to generate related keyword ideas. Audience, job, intent and the four Ps can all provide seeds. A seed is an initial phrase from which related searches can be explored. Seeds can come from the audience, the job they want done, their intent or the marketing mix. It is a starting point for investigation, not automatically the best final target.\n\nNike could start with the seed phrase 'running shoes' and explore related questions about fit, beginner use, terrain and injury concerns. The seed helps generate possibilities but is not automatically a suitable target for a single page. Research must determine the different intents inside the broad topic. Otherwise one generic page may try and fail to satisfy every searcher.\n\nA seed keyword opens an exploration of related searches. It must be tested against actual needs instead of accepted as the final target automatically."},"exampleType":"illustrative"},{"id":89,"term":"Search volume","lecture":"Lecture 5 · GEO and keyword analysis","page":25,"definition":"The estimated number of searches for a query in a defined place and time period. It shows frequency, not the value or relevance of the query.","explanation":"Volume estimates how often a query is searched within a particular location and time. A large number indicates frequency, not whether the visitors are relevant or likely to act. It so needs to be interpreted together with intent and the page’s purpose.\n\nSearch volume indicates popularity, not usefulness. A niche query can be worth more when it closely matches what the page offers.","example":"Illustrative example: Suppose a tool estimates 5,000 monthly searches for 'birthday cakes' and 150 for 'gluten-free birthday cake delivery.' The second phrase may attract more relevant customers to a specialist bakery despite lower search volume.","full":"Search volume is the estimated number of searches for a query in a defined place and time period. It shows frequency, not the value or relevance of the query. Volume estimates how often a query is searched within a particular location and time. A large number indicates frequency, not whether the visitors are relevant or likely to act. It so needs to be interpreted together with intent and the page’s purpose.\n\nA tool may estimate many monthly searches for 'best running shoes,' but high volume does not say whether those users want to read reviews, visit a store or buy immediately. Estimates also depend on the selected geography and period. Search volume is therefore an indicator of demand frequency, not a measure of sales potential on its own. Intent and relevance must guide prioritization.\n\nSearch volume indicates popularity, not usefulness. A niche query can be worth more when it closely matches what the page offers.","category":"KEYWORD ANALYSIS","study":{"simple":"Volume estimates how often a query is searched within a particular location and time. A large number indicates frequency, not whether the visitors are relevant or likely to act.","why":"Search volume indicates popularity, not usefulness. A niche query can be worth more when it closely matches what the page offers. Estimates also depend on the selected geography and period. Search volume is therefore an indicator of demand frequency, not a measure of sales potential on its own.","example":"Suppose a tool estimates 5,000 monthly searches for 'birthday cakes' and 150 for 'gluten-free birthday cake delivery.' The second phrase may attract more relevant customers to a specialist bakery despite lower search volume.","exam":"Search volume is the estimated number of searches for a query in a defined place and time period. It shows frequency, not the value or relevance of the query. Volume estimates how often a query is searched within a particular location and time. A large number indicates frequency, not whether the visitors are relevant or likely to act. It so needs to be interpreted together with intent and the page’s purpose.\n\nA tool may estimate many monthly searches for 'best running shoes,' but high volume does not say whether those users want to read reviews, visit a store or buy immediately. Estimates also depend on the selected geography and period. Search volume is therefore an indicator of demand frequency, not a measure of sales potential on its own. Intent and relevance must guide prioritization.\n\nSearch volume indicates popularity, not usefulness. A niche query can be worth more when it closely matches what the page offers."},"exampleType":"illustrative"},{"id":90,"term":"Keyword difficulty","lecture":"Lecture 5 · GEO and keyword analysis","page":26,"definition":"An estimate of how difficult it may be to rank organically for a keyword, based on the strength and competition of the existing results.","explanation":"Difficulty estimates the competition facing a page that wants to rank for a query. It helps compare opportunities but is not the same as customer value or intent. A highly relevant lower-volume query may be more useful than a popular one that is hard to rank for.\n\nA keyword can be highly relevant but hard to rank for. Competition estimates help prioritise effort but do not replace intent analysis.","example":"Illustrative example: A tiny candle shop might struggle to rank for 'candles' against giant retailers, while 'hand-poured soy candles in Bristol' could be less competitive. Keyword difficulty estimates that competition, not how much a search is worth.","full":"Keyword difficulty is an estimate of how difficult it may be to rank organically for a keyword, based on the strength and competition of the existing results. Difficulty estimates the competition facing a page that wants to rank for a query. It helps compare opportunities but is not the same as customer value or intent. A highly relevant lower-volume query may be more useful than a popular one that is hard to rank for.\n\nA general search such as 'running shoes' may be dominated by major retailers and publishers, making organic ranking difficult for a new guide. A more specific query about beginners' trail shoes could be more achievable and better matched to the page. Keyword difficulty estimates competition; it does not decide whether the traffic is valuable. The strongest choice balances achievable visibility with a useful audience need.\n\nA keyword can be highly relevant but hard to rank for. Competition estimates help prioritise effort but do not replace intent analysis.","category":"KEYWORD ANALYSIS","study":{"simple":"Difficulty estimates the competition facing a page that wants to rank for a query. It helps compare opportunities but is not the same as customer value or intent.","why":"A keyword can be highly relevant but hard to rank for. Competition estimates help prioritise effort but do not replace intent analysis. A more specific query about beginners' trail shoes could be more achievable and better matched to the page. Keyword difficulty estimates competition; it does not decide whether the traffic is valuable.","example":"A tiny candle shop might struggle to rank for 'candles' against giant retailers, while 'hand-poured soy candles in Bristol' could be less competitive. Keyword difficulty estimates that competition, not how much a search is worth.","exam":"Keyword difficulty is an estimate of how difficult it may be to rank organically for a keyword, based on the strength and competition of the existing results. Difficulty estimates the competition facing a page that wants to rank for a query. It helps compare opportunities but is not the same as customer value or intent. A highly relevant lower-volume query may be more useful than a popular one that is hard to rank for.\n\nA general search such as 'running shoes' may be dominated by major retailers and publishers, making organic ranking difficult for a new guide. A more specific query about beginners' trail shoes could be more achievable and better matched to the page. Keyword difficulty estimates competition; it does not decide whether the traffic is valuable. The strongest choice balances achievable visibility with a useful audience need.\n\nA keyword can be highly relevant but hard to rank for. Competition estimates help prioritise effort but do not replace intent analysis."},"exampleType":"illustrative"},{"id":91,"term":"Keyword cluster","lecture":"Lecture 5 · GEO and keyword analysis","page":26,"definition":"A group of related queries that share a topic and intent and can usually be answered by the same canonical page.","explanation":"A cluster combines related search phrases that share a subject and similar intent. One useful canonical page can often answer several such phrases. This avoids creating a separate near-duplicate page for every small variation.\n\nGrouping queries by shared intent avoids creating many near-duplicate pages that all answer essentially the same question.","example":"Illustrative example: Searches for 'study desk lamp,' 'best lamp for homework' and 'desk light for students' may share a useful intent. A lighting shop can answer them in one strong guide rather than three near-identical pages.","full":"Keyword cluster is a group of related queries that share a topic and intent and can usually be answered by the same canonical page. A cluster combines related search phrases that share a subject and similar intent. One useful canonical page can often answer several such phrases. This avoids creating a separate near-duplicate page for every small variation.\n\nThe searches 'beginner running shoes' and 'shoes for new runners' might be answered by one well-structured Nike guide because they express essentially the same purpose. Clustering those phrases avoids publishing near-identical question."},"exampleType":"illustrative"},{"id":92,"term":"Primary keyword","lecture":"Lecture 5 · GEO and keyword analysis","page":26,"definition":"The main query a page is designed to answer. Related phrases support it; a different intent normally requires a different page.","explanation":"The primary keyword expresses the main search need that a particular page should answer. Supporting phrases can add context without replacing that main purpose. A substantially different search intent normally calls for a different page.\n\nOne main query clarifies the page's purpose. A different user intention often deserves different content instead of extra keyword repetition.","example":"Illustrative example: A gardening guide is mainly written to answer 'how to prune roses.' Related phrases like 'rose pruning in spring' can support it, but a search to buy pruning shears likely deserves a different page.","full":"Primary keyword is the main query a page is designed to answer. Related phrases support it; a different intent normally requires a different page. The primary keyword expresses the main search need that a particular page should answer. Supporting phrases can add context without replacing that main purpose. A substantially different search intent normally calls for a different page.\n\nA Nike page focused on 'trail running shoes' can organize its main heading, copy and supporting sections around shoes suited to uneven terrain. Related terms about grip or waterproofing provide context for that primary need. A search for 'Nike returns policy' is a different job and should not be forced onto the product page. Choosing a primary keyword gives a page coherent purpose instead of licensing repetition.\n\nOne main query clarifies the page's purpose. A different user intention often deserves different content instead of extra keyword repetition.","category":"KEYWORD ANALYSIS","study":{"simple":"The primary keyword expresses the main search need that a particular page should answer. Supporting phrases can add context without replacing that main purpose.","why":"One main query clarifies the page's purpose. A different user intention often deserves different content instead of extra keyword repetition. Related terms about grip or waterproofing provide context for that primary need. A search for 'Nike returns policy' is a different job and should not be forced onto the product page.","example":"A gardening guide is mainly written to answer 'how to prune roses.' Related phrases like 'rose pruning in spring' can support it, but a search to buy pruning shears likely deserves a different page.","exam":"Primary keyword is the main query a page is designed to answer. Related phrases support it; a different intent normally requires a different page. The primary keyword expresses the main search need that a particular page should answer. Supporting phrases can add context without replacing that main purpose. A substantially different search intent normally calls for a different page.\n\nA Nike page focused on 'trail running shoes' can organize its main heading, copy and supporting sections around shoes suited to uneven terrain. Related terms about grip or waterproofing provide context for that primary need. A search for 'Nike returns policy' is a different job and should not be forced onto the product page. Choosing a primary keyword gives a page coherent purpose instead of licensing repetition.\n\nOne main query clarifies the page's purpose. A different user intention often deserves different content instead of extra keyword repetition."},"exampleType":"illustrative"},{"id":93,"term":"Cognitive Load Theory","lecture":"Lecture 6 · Cognitive load theory and outbound marketing","page":27,"definition":"A theory about how people process new information while thinking and learning, centred on the limited capacity of working memory.","explanation":"The theory explains why presenting too much unfamiliar information at once can overwhelm a person. Working memory has limited capacity, while organised knowledge in long-term memory can make processing easier. In communication design, clarity matters because presentation choices can create or reduce unnecessary mental effort.\n\nOverloading working memory makes new material harder to process. Clear communication gives people a better chance to understand the offer and decide deliberately.","example":"Illustrative example: Imagine trying to book a haircut while a page shows four pop-ups, three prices and ten unfamiliar options. Working memory has to process too much at once. A clear, focused booking flow reduces unnecessary mental effort.","full":"Cognitive Load Theory explains learning and decision-making through the limited capacity of working memory to process unfamiliar information. The theory explains why presenting too much unfamiliar information at once can overwhelm a person. Working memory has limited capacity, while organised knowledge in long-term memory can make processing easier. In communication design, clarity matters because presentation choices can create or reduce unnecessary mental effort.\n\nA crowded concert-booking checkout with animated offers, unfamiliar terms and five competing pop-ups demands more processing than its core task requires. Cognitive Load Theory explains this through working memory's limited ability to handle new material. Removing distracting options and grouping booking steps can improve comprehension. The theory does not mean all detail is bad: information essential for an informed purchase still needs to remain accessible.\n\nOverloading working memory makes new material harder to process. Clear communication gives people a better chance to understand the offer and decide deliberately.","category":"COGNITIVE LOAD THEORY","study":{"simple":"The theory explains why presenting too much unfamiliar information at once can overwhelm a person. Working memory has limited capacity, while organised knowledge in long-term memory can make processing easier.","why":"Overloading working memory makes new material harder to process. Clear communication gives people a better chance to understand the offer and decide deliberately. Cognitive Load Theory explains this through working memory's limited ability to handle new material. Removing distracting options and grouping booking steps can improve comprehension.","example":"Imagine trying to book a haircut while a page shows four pop-ups, three prices and ten unfamiliar options. Working memory has to process too much at once. A clear, focused booking flow reduces unnecessary mental effort.","exam":"Cognitive Load Theory explains learning and decision-making through the limited capacity of working memory to process unfamiliar information. The theory explains why presenting too much unfamiliar information at once can overwhelm a person. Working memory has limited capacity, while organised knowledge in long-term memory can make processing easier. In communication design, clarity matters because presentation choices can create or reduce unnecessary mental effort.\n\nA crowded concert-booking checkout with animated offers, unfamiliar terms and five competing pop-ups demands more processing than its core task requires. Cognitive Load Theory explains this through working memory's limited ability to handle new material. Removing distracting options and grouping booking steps can improve comprehension. The theory does not mean all detail is bad: information essential for an informed purchase still needs to remain accessible.\n\nOverloading working memory makes new material harder to process. Clear communication gives people a better chance to understand the offer and decide deliberately."},"exampleType":"illustrative"},{"id":94,"term":"Working memory","lecture":"Lecture 6 · Cognitive load theory and outbound marketing","page":27,"definition":"The memory system where we consciously process information. It can handle only a limited amount of unfamiliar information at on
