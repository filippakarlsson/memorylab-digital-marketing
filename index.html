her to support findability and ranking.\n\nAn IKEA page about desks needs to be accessible to crawlers, answer relevant searches clearly and receive credible references from other sites. Technical, on-site and off-site SEO address these different conditions. Well-written keywords cannot help if a page is blocked, and fast loading alone cannot make irrelevant content valuable. Organic visibility depends on several supporting elements instead of one isolated trick.\n\nSearch visibility needs accessible pages, relevant content and outside credibility. Fixing only keywords will not resolve broken crawling or weak authority.","category":"SEO BASICS","study":{"simple":"SEO seeks to make pages accessible, relevant and credible in organic search results. Technical SEO helps search engines reach and read a site; on-site SEO improves the pages themselves; off-site SEO concerns signals from elsewhere.","why":"Search visibility needs accessible pages, relevant content and outside credibility. Fixing only keywords will not resolve broken crawling or weak authority. Technical, on-site and off-site SEO address these different conditions. Well-written keywords cannot help if a page is blocked, and fast loading alone cannot make irrelevant content valuable.","example":"A small bakery wants its sourdough recipe guide to appear in Google. It needs readable pages, clear headings and credible links—not merely repeated keywords. SEO combines technical, on-page and off-page work.","exam":"SEO (search engine optimization) is the work of making a site findable and rankable in search engines. It has three components: technical, on-site and off-site. SEO seeks to make pages accessible, relevant and credible in organic search results. Technical SEO helps search engines reach and read a site; on-site SEO improves the pages themselves; off-site SEO concerns signals from elsewhere. These aspects work together to support findability and ranking.\n\nAn IKEA page about desks needs to be accessible to crawlers, answer relevant searches clearly and receive credible references from other sites. Technical, on-site and off-site SEO address these different conditions. Well-written keywords cannot help if a page is blocked, and fast loading alone cannot make irrelevant content valuable. Organic visibility depends on several supporting elements instead of one isolated trick.\n\nSearch visibility needs accessible pages, relevant content and outside credibility. Fixing only keywords will not resolve broken crawling or weak authority."},"exampleType":"illustrative"},{"id":41,"term":"SERP (search engine results page)","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":12,"definition":"The page a search engine returns for a query. One query produces many components: AI overview, ads, organic results, local pack, knowledge panel, image and video blocks, and more.","explanation":"A SERP is more than a simple list of blue links. Depending on the query it may include advertisements, ordinary organic listings, an AI Overview, a featured snippet, a map and local listings, images or a knowledge panel. Understanding the result layout helps explain how people discover information.\n\nDifferent result features compete for the searcher's attention. Being 'on Google' may mean an ad, map listing, answer box or ordinary organic result.","example":"Illustrative example: Search 'coffee shop near me' and a results page may include sponsored links, a map with local cafés and regular website results. That whole mixture is a SERP, not just the blue links.","full":"SERP (search engine results page) is the page a search engine returns for a query. One query produces many components: AI overview, ads, organic results, local pack, knowledge panel, image and video blocks, and more. A SERP is more than a simple list of blue links. Depending on the query it may include advertisements, ordinary organic listings, an AI Overview, a featured snippet, a map and local listings, images or a knowledge panel. Understanding the result layout helps explain how people discover information.\n\nA Google query for 'IKEA near me' may show sponsored links, store maps, ordinary results and knowledge features simultaneously. All appear on the SERP but serve different purposes and may follow different ranking or placement rules. A marketer must assess the actual result layout for the query: ranking first organically does not always mean being the first item the user sees.\n\nDifferent result features compete for the searcher's attention. Being 'on Google' may mean an ad, map listing, answer box or ordinary organic result.","category":"SEO BASICS","study":{"simple":"A SERP is more than a simple list of blue links. Depending on the query it may include advertisements, ordinary organic listings, an AI Overview, a featured snippet, a map and local listings, images or a knowledge panel.","why":"Different result features compete for the searcher's attention. Being 'on Google' may mean an ad, map listing, answer box or ordinary organic result. All appear on the SERP but serve different purposes and may follow different ranking or placement rules. A marketer must assess the actual result layout for the query: ranking first organically does not always mean being the first item the user sees.","example":"Search 'coffee shop near me' and a results page may include sponsored links, a map with local cafés and regular website results. That whole mixture is a SERP, not just the blue links.","exam":"SERP (search engine results page) is the page a search engine returns for a query. One query produces many components: AI overview, ads, organic results, local pack, knowledge panel, image and video blocks, and more. A SERP is more than a simple list of blue links. Depending on the query it may include advertisements, ordinary organic listings, an AI Overview, a featured snippet, a map and local listings, images or a knowledge panel. Understanding the result layout helps explain how people discover information.\n\nA Google query for 'IKEA near me' may show sponsored links, store maps, ordinary results and knowledge features simultaneously. All appear on the SERP but serve different purposes and may follow different ranking or placement rules. A marketer must assess the actual result layout for the query: ranking first organically does not always mean being the first item the user sees.\n\nDifferent result features compete for the searcher's attention. Being 'on Google' may mean an ad, map listing, answer box or ordinary organic result."},"exampleType":"illustrative"},{"id":42,"term":"Crawler (robot)","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":12,"definition":"The robots that work their way across the internet, following links and reading content so the search engine can index it.","explanation":"A crawler follows links and reads accessible pages so the search engine can discover content. This happens before the page can be included in a searchable index. Poor linking or technical barriers may prevent important pages from being discovered.\n\nA useful page may remain undiscovered if a crawler cannot follow links to it. A sensible internal structure matters before ranking even begins.","example":"Illustrative example: A garden centre publishes a page about caring for orchids and links to it from its homepage. A search crawler can follow that link to discover and read the new page.","full":"A web crawler is an automated search-engine program that follows links and reads accessible pages to discover content. This happens before the page can be included in a searchable index. Poor linking or technical barriers may prevent important pages from being discovered.\n\nGooglebot might discover an IKEA wardrobe page by following a link from a bedroom-category page. The crawler's task is finding and reading accessible content; it does not mean that the page will be indexed or ranked well. A useful page buried behind broken links may not be reached reliably. Internal linking and technical access therefore affect whether content even enters search consideration.\n\nA useful page may remain undiscovered if a crawler cannot follow links to it. A sensible internal structure matters before ranking even begins.","category":"SEO BASICS","study":{"simple":"A crawler follows links and reads accessible pages so the search engine can discover content. This happens before the page can be included in a searchable index.","why":"A useful page may remain undiscovered if a crawler cannot follow links to it. A sensible internal structure matters before ranking even begins. The crawler's task is finding and reading accessible content; it does not mean that the page will be indexed or ranked well. A useful page buried behind broken links may not be reached reliably.","example":"A garden centre publishes a page about caring for orchids and links to it from its homepage. A search crawler can follow that link to discover and read the new page.","exam":"A web crawler is an automated search-engine program that follows links and reads accessible pages to discover content. This happens before the page can be included in a searchable index. Poor linking or technical barriers may prevent important pages from being discovered.\n\nGooglebot might discover an IKEA wardrobe page by following a link from a bedroom-category page. The crawler's task is finding and reading accessible content; it does not mean that the page will be indexed or ranked well. A useful page buried behind broken links may not be reached reliably. Internal linking and technical access therefore affect whether content even enters search consideration.\n\nA useful page may remain undiscovered if a crawler cannot follow links to it. A sensible internal structure matters before ranking even begins."},"exampleType":"illustrative"},{"id":43,"term":"Index","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":13,"definition":"The search engine's record of the pages its robots have found. Each search engine has an index of websites that the robots keep updated.","explanation":"The index is a search engine’s stored record of discovered pages. Crawling finds and reads pages; indexing makes the information available to the search system. A page that is not properly indexed cannot compete normally in search results.\n\nA page must become discoverable through the search system's index before it can appear as a normal result. Publishing a URL alone is not enough.","example":"Illustrative example: A new recipe page can be published online before Google includes it in its searchable index. Crawling discovers the page; indexing stores information about it so it can become a search result.","full":"A search-engine index is the stored record of pages and information that the search system can retrieve when responding to queries. Crawling finds and reads pages; indexing makes the information available to the search system. A page that is not properly indexed cannot compete normally in search results.\n\nOnce a search crawler discovers an IKEA shelf page, the search engine may store information about it in an index. That database enables retrieval when a relevant query arrives. Discovery and indexing are separate steps: an accessible page is not automatically indexed, and a page outside the index cannot normally compete in organic results. An audit should identify which stage has failed.\n\nA page must become discoverable through the search system's index before it can appear as a normal result. Publishing a URL alone is not enough.","category":"SEO BASICS","study":{"simple":"The index is a search engine’s stored record of discovered pages. Crawling finds and reads pages; indexing makes the information available to the search system.","why":"A page must become discoverable through the search system's index before it can appear as a normal result. Publishing a URL alone is not enough. That database enables retrieval when a relevant query arrives. Discovery and indexing are separate steps: an accessible page is not automatically indexed, and a page outside the index cannot normally compete in organic results.","example":"A new recipe page can be published online before Google includes it in its searchable index. Crawling discovers the page; indexing stores information about it so it can become a search result.","exam":"A search-engine index is the stored record of pages and information that the search system can retrieve when responding to queries. Crawling finds and reads pages; indexing makes the information available to the search system. A page that is not properly indexed cannot compete normally in search results.\n\nOnce a search crawler discovers an IKEA shelf page, the search engine may store information about it in an index. That database enables retrieval when a relevant query arrives. Discovery and indexing are separate steps: an accessible page is not automatically indexed, and a page outside the index cannot normally compete in organic results. An audit should identify which stage has failed.\n\nA page must become discoverable through the search system's index before it can appear as a normal result. Publishing a URL alone is not enough."},"exampleType":"illustrative"},{"id":44,"term":"Algorithm","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":13,"definition":"The search engine's code that decides how the pages in the index are ranked for a given query.","explanation":"Once pages are in the index, the search engine must decide which ones best answer a query. The algorithm provides that ranking process. SEO work aims to make a page accessible, relevant and useful within that system, instead of directly controlling the rankings.\n\nRanking algorithms decide which indexed pages best fit a query. Site owners can improve relevance and quality but cannot directly set their ranking.","example":"Illustrative example: Two sites publish answers to 'how long to boil an egg.' Google's ranking systems decide which pages are most useful for that query and what order they appear in. That ranking process is the algorithm at work.","full":"A search-ranking algorithm is the system of rules and signals used to order indexed pages for a specific search. Once pages are in the index, the search engine must decide which ones best answer a query. The algorithm provides that ranking process. SEO work aims to make a page accessible, relevant and useful within that system, instead of directly controlling the rankings.\n\nFor the query 'small bookshelf,' Google's ranking systems compare candidate indexed pages to decide which may best satisfy the query. The algorithm assesses signals at scale instead of displaying websites in creation order. Marketers can improve accessibility, relevance and quality, but they do not assign themselves a rank. Search performance is influenced by the user query and the wider competition.\n\nRanking algorithms decide which indexed pages best fit a query. Site owners can improve relevance and quality but cannot directly set their ranking.","category":"SEO BASICS","study":{"simple":"Once pages are in the index, the search engine must decide which ones best answer a query. The algorithm provides that ranking process.","why":"Ranking algorithms decide which indexed pages best fit a query. Site owners can improve relevance and quality but cannot directly set their ranking. The algorithm assesses signals at scale instead of displaying websites in creation order. Marketers can improve accessibility, relevance and quality, but they do not assign themselves a rank.","example":"Two sites publish answers to 'how long to boil an egg.' Google's ranking systems decide which pages are most useful for that query and what order they appear in. That ranking process is the algorithm at work.","exam":"A search-ranking algorithm is the system of rules and signals used to order indexed pages for a specific search. Once pages are in the index, the search engine must decide which ones best answer a query. The algorithm provides that ranking process. SEO work aims to make a page accessible, relevant and useful within that system, instead of directly controlling the rankings.\n\nFor the query 'small bookshelf,' Google's ranking systems compare candidate indexed pages to decide which may best satisfy the query. The algorithm assesses signals at scale instead of displaying websites in creation order. Marketers can improve accessibility, relevance and quality, but they do not assign themselves a rank. Search performance is influenced by the user query and the wider competition.\n\nRanking algorithms decide which indexed pages best fit a query. Site owners can improve relevance and quality but cannot directly set their ranking."},"exampleType":"illustrative"},{"id":45,"term":"Organic result","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":13,"definition":"A standard, unpaid listing on the SERP — title, URL and snippet — possibly with sitelinks or a site search box for brands.","explanation":"An organic listing appears without the site paying for that particular placement. It commonly includes a title, URL and text snippet and can sometimes include sitelinks. Organic visibility is therefore different from paid search advertising.\n\nAn organic result is earned through search relevance instead of paying for that placement. It can attract visitors without a per-click ad cost.","example":"Illustrative example: Someone searches for 'beginner crochet patterns' and clicks an unpaid tutorial from a knitting blog. That listing is an organic result, unlike a sponsored ad shown for the same search.","full":"An organic search result is an unpaid listing shown among the search engine’s ordinary results. It commonly includes a title, URL and text snippet and can sometimes include sitelinks. Organic visibility is therefore different from paid search advertising.\n\nAn IKEA desk page shown in Google's ordinary results without payment for that placement is an organic result. Its snippet can attract a relevant click, but a nearby sponsored listing is a different advertising product. Organic visibility often reflects SEO work and the search engine's ranking decisions. It should be assessed separately from paid-search spending and its performance.\n\nAn organic result is earned through search relevance instead of paying for that placement. It can attract visitors without a per-click ad cost.","category":"SEO BASICS","study":{"simple":"An organic listing appears without the site paying for that particular placement. It commonly includes a title, URL and text snippet and can sometimes include sitelinks.","why":"An organic result is earned through search relevance instead of paying for that placement. It can attract visitors without a per-click ad cost. Its snippet can attract a relevant click, but a nearby sponsored listing is a different advertising product. Organic visibility often reflects SEO work and the search engine's ranking decisions.","example":"Someone searches for 'beginner crochet patterns' and clicks an unpaid tutorial from a knitting blog. That listing is an organic result, unlike a sponsored ad shown for the same search.","exam":"An organic search result is an unpaid listing shown among the search engine’s ordinary results. It commonly includes a title, URL and text snippet and can sometimes include sitelinks. Organic visibility is therefore different from paid search advertising.\n\nAn IKEA desk page shown in Google's ordinary results without payment for that placement is an organic result. Its snippet can attract a relevant click, but a nearby sponsored listing is a different advertising product. Organic visibility often reflects SEO work and the search engine's ranking decisions. It should be assessed separately from paid-search spending and its performance.\n\nAn organic result is earned through search relevance instead of paying for that placement. It can attract visitors without a per-click ad cost."},"exampleType":"illustrative"},{"id":46,"term":"Position 0 (featured snippet)","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":13,"definition":"An answer box extracted from a page — a paragraph, list, table or video — shown ahead of the regular results.","explanation":"A featured snippet pulls a short answer from a page and presents it prominently above regular results. The answer may be formatted as a paragraph, list, table or video. It demonstrates how a search engine can provide information directly on its results page.\n\nA featured snippet can answer the question before the visitor opens the source page. Concise, accurate page sections can help searchers even when click-through changes.","example":"Illustrative example: Imagine Google placing a short extract from a gardening guide above regular results for 'when to prune roses.' The extracted answer is a featured snippet, even if the searcher does not open the full article.","full":"A featured snippet, sometimes described as position zero, is an answer excerpt presented prominently within search results. The answer may be formatted as a paragraph, list, table or video. It demonstrates how a search engine can provide information directly on its results page.\n\nA recipe website may have a concise explanation extracted into a featured snippet that answers 'how long to boil rice' above conventional blue links. The searcher might obtain enough information without opening the page. This feature shows the benefit and cost of answer visibility: the publisher may gain credibility while receiving fewer clicks than a traditional result.\n\nA featured snippet can answer the question before the visitor opens the source page. Concise, accurate page sections can help searchers even when click-through changes.","category":"SEO BASICS","study":{"simple":"A featured snippet pulls a short answer from a page and presents it prominently above regular results. The answer may be formatted as a paragraph, list, table or video.","why":"A featured snippet can answer the question before the visitor opens the source page. Concise, accurate page sections can help searchers even when click-through changes. The searcher might obtain enough information without opening the page. This feature shows the benefit and cost of answer visibility: the publisher may gain credibility while receiving fewer clicks than a traditional result.","example":"Imagine Google placing a short extract from a gardening guide above regular results for 'when to prune roses.' The extracted answer is a featured snippet, even if the searcher does not open the full article.","exam":"A featured snippet, sometimes described as position zero, is an answer excerpt presented prominently within search results. The answer may be formatted as a paragraph, list, table or video. It demonstrates how a search engine can provide information directly on its results page.\n\nA recipe website may have a concise explanation extracted into a featured snippet that answers 'how long to boil rice' above conventional blue links. The searcher might obtain enough information without opening the page. This feature shows the benefit and cost of answer visibility: the publisher may gain credibility while receiving fewer clicks than a traditional result.\n\nA featured snippet can answer the question before the visitor opens the source page. Concise, accurate page sections can help searchers even when click-through changes."},"exampleType":"illustrative"},{"id":47,"term":"AI Overview","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":14,"definition":"An AI-generated snapshot at the top of the SERP, with cited links.","explanation":"An AI Overview provides an AI-generated summary within the search results and may include links to cited sources. It changes the search experience because the user may receive an answer before clicking a webpage. This is one reason the course discusses GEO alongside SEO.\n\nAI summaries can satisfy the searcher's question without a site visit. Brands need clear, dependable facts that answer systems can interpret and cite.","example":"Real-world example: Google's AI search features can create an answer within Search itself, with links to supporting sources. That's different from a normal organic result that mainly invites a click to another page.","full":"AI Overview is an AI-generated snapshot at the top of the SERP, with cited links. An AI Overview provides an AI-generated summary within the search results and may include links to cited sources. It changes the search experience because the user may receive an answer before clicking a webpage. This is one reason the course discusses GEO alongside SEO.\n\nGoogle's AI Overview might summarize OLED versus QLED televisions using information from multiple sources and provide links for further reading. Unlike an ordinary result, the overview synthesizes an answer inside the search page. A manufacturer so needs facts that can be interpreted accurately, but it cannot assume the summary will perfectly represent every nuance of its product descriptions.\n\nAI summaries can satisfy the searcher's question without a site visit. Brands need clear, dependable facts that answer systems can interpret and cite.","category":"SEO BASICS","study":{"simple":"An AI Overview provides an AI-generated summary within the search results and may include links to cited sources. It changes the search experience because the user may receive an answer before clicking a webpage.","why":"AI summaries can satisfy the searcher's question without a site visit. Brands need clear, dependable facts that answer systems can interpret and cite. Unlike an ordinary result, the overview synthesizes an answer inside the search page. A manufacturer so needs facts that can be interpreted accurately, but it cannot assume the summary will perfectly represent every nuance of its product descriptions.","example":"Google's AI search features can create an answer within Search itself, with links to supporting sources. That's different from a normal organic result that mainly invites a click to another page.","exam":"AI Overview is an AI-generated snapshot at the top of the SERP, with cited links. An AI Overview provides an AI-generated summary within the search results and may include links to cited sources. It changes the search experience because the user may receive an answer before clicking a webpage. This is one reason the course discusses GEO alongside SEO.\n\nGoogle's AI Overview might summarize OLED versus QLED televisions using information from multiple sources and provide links for further reading. Unlike an ordinary result, the overview synthesizes an answer inside the search page. A manufacturer so needs facts that can be interpreted accurately, but it cannot assume the summary will perfectly represent every nuance of its product descriptions.\n\nAI summaries can satisfy the searcher's question without a site visit. Brands need clear, dependable facts that answer systems can interpret and cite."},"exampleType":"real","exampleSource":"https://developers.google.com/search/docs/appearance"},{"id":48,"term":"Knowledge panel","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":14,"definition":"A panel of facts about a brand, person or place, shown at the top or on the right of the results page.","explanation":"A knowledge panel collects key facts about a recognised person, place or brand into a dedicated result feature. It is different from an ordinary organic webpage listing. The feature can help users identify an entity and find basic information quickly.\n\nA factual panel can shape a searcher's first impression of an organisation. Inaccurate entity information can confuse people before they reach the website.","example":"Illustrative example: When someone searches for a famous painter, Google may show a panel with their birth date, art movement and notable paintings. That collection of facts is a knowledge panel, not an ordinary webpage listing.","full":"Knowledge panel is a panel of facts about a brand, person or place, shown at the top or on the right of the results page. A knowledge panel collects key facts about a recognised person, place or brand into a dedicated result feature. It is different from an ordinary organic webpage listing. The feature can help users identify an entity and find basic information quickly.\n\nA search for Apple may display a knowledge panel with company facts and links. The panel organizes recognized information about the entity instead of only displaying one webpage's headline and snippet. This helps searchers identify the organization quickly. For people working in marketing, maintaining consistent authoritative facts is important, but the panel's presentation is controlled by the search platform, not the company.\n\nA factual panel can shape a searcher's first impression of an organisation. Inaccurate entity information can confuse people before they reach the website.","category":"SEO BASICS","study":{"simple":"A knowledge panel collects key facts about a recognised person, place or brand into a dedicated result feature. It is different from an ordinary organic webpage listing.","why":"A factual panel can shape a searcher's first impression of an organisation. Inaccurate entity information can confuse people before they reach the website. The panel organizes recognized information about the entity instead of only displaying one webpage's headline and snippet. This helps searchers identify the organization quickly.","example":"When someone searches for a famous painter, Google may show a panel with their birth date, art movement and notable paintings. That collection of facts is a knowledge panel, not an ordinary webpage listing.","exam":"Knowledge panel is a panel of facts about a brand, person or place, shown at the top or on the right of the results page. A knowledge panel collects key facts about a recognised person, place or brand into a dedicated result feature. It is different from an ordinary organic webpage listing. The feature can help users identify an entity and find basic information quickly.\n\nA search for Apple may display a knowledge panel with company facts and links. The panel organizes recognized information about the entity instead of only displaying one webpage's headline and snippet. This helps searchers identify the organization quickly. For people working in marketing, maintaining consistent authoritative facts is important, but the panel's presentation is controlled by the search platform, not the company.\n\nA factual panel can shape a searcher's first impression of an organisation. Inaccurate entity information can confuse people before they reach the website."},"exampleType":"illustrative"},{"id":49,"term":"Local pack","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":14,"definition":"A map with three local listings showing ratings, opening hours and directions.","explanation":"The local pack combines a map with a small set of nearby business listings. Information such as ratings, hours and directions helps a person choose where to go. It is particularly relevant when the search has a local or place-based need.\n\nA local searcher may choose from the map panel without visiting an ordinary site result. Accurate hours, location and reviews can matter immediately.","example":"Illustrative example: Searching 'hairdresser near me' may show a map and three salons with ratings, hours and directions. That local group helps someone choose a nearby business without opening multiple websites.","full":"A local pack is a map-based group of nearby business results showing practical details such as ratings, hours and directions. Information such as ratings, hours and directions helps a person choose where to go. It is particularly relevant when the search has a local or place-based need.\n\nSomeone searching for a furniture store nearby may see a Google local pack showing a map, several listings, ratings, hours and routes. The feature addresses a place-based intent and can affect a visit before the person reaches the store's website. Accurate opening hours and location details therefore matter; strong generic SEO copy cannot compensate for a listing that sends visitors to the wrong address.\n\nA local searcher may choose from the map panel without visiting an ordinary site result. Accurate hours, location and reviews can matter immediately.","category":"SEO BASICS","study":{"simple":"The local pack combines a map with a small set of nearby business listings. Information such as ratings, hours and directions helps a person choose where to go.","why":"A local searcher may choose from the map panel without visiting an ordinary site result. Accurate hours, location and reviews can matter immediately. The feature addresses a place-based intent and can affect a visit before the person reaches the store's website. Accurate opening hours and location details therefore matter; strong generic SEO copy cannot compensate for a listing that sends visitors to the wrong address.","example":"Searching 'hairdresser near me' may show a map and three salons with ratings, hours and directions. That local group helps someone choose a nearby business without opening multiple websites.","exam":"A local pack is a map-based group of nearby business results showing practical details such as ratings, hours and directions. Information such as ratings, hours and directions helps a person choose where to go. It is particularly relevant when the search has a local or place-based need.\n\nSomeone searching for a furniture store nearby may see a Google local pack showing a map, several listings, ratings, hours and routes. The feature addresses a place-based intent and can affect a visit before the person reaches the store's website. Accurate opening hours and location details therefore matter; strong generic SEO copy cannot compensate for a listing that sends visitors to the wrong address.\n\nA local searcher may choose from the map panel without visiting an ordinary site result. Accurate hours, location and reviews can matter immediately."},"exampleType":"illustrative"},{"id":50,"term":"Search intent","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":14,"definition":"What the person actually wants from a query. Four types: informational, navigational, commercial (investigation) and transactional — each mapping to a stage of the funnel.","explanation":"Search intent is the purpose behind a query instead of just the words typed. The four types in the course are informational, navigational, commercial and transactional. Understanding the difference helps a marketer match a page and its content to the action the searcher actually wants.\n\nThe same topic can represent different customer needs. A buying page is a poor response to a learning question, and a how-to guide is a poor checkout page.","example":"Illustrative example: 'How to fix a squeaky door' asks for instructions, while 'buy door hinges today' suggests a purchase. The words differ because the people want different outcomes: search intent explains which page should answer each.","full":"Search intent is the purpose a person is trying to fulfil with a query. The main categories in the course are informational, navigational, commercial and transactional. Identifying intent helps the marketer decide whether a searcher needs an explanation, a destination, a review of options or a page that supports immediate action.\n\nThe queries 'Spotify login' and 'best music streaming service' both concern music platforms but demand different results. The first asks for a specific destination; the second asks for an evaluation. Treating them as equivalent would send one searcher to an irrelevant page. Intent-based planning starts with the action the user wants to accomplish, not merely the nouns in the query.\n\nThe same topic can represent different customer needs. A buying page is a poor response to a learning question, and a how-to guide is a poor checkout page.","category":"SEO BASICS","study":{"simple":"Search intent is the purpose behind a query instead of just the words typed. The four types in the course are informational, navigational, commercial and transactional.","why":"The same topic can represent different customer needs. A buying page is a poor response to a learning question, and a how-to guide is a poor checkout page. The first asks for a specific destination; the second asks for an evaluation. Treating them as equivalent would send one searcher to an irrelevant page.","example":"'How to fix a squeaky door' asks for instructions, while 'buy door hinges today' suggests a purchase. The words differ because the people want different outcomes: search intent explains which page should answer each.","exam":"Search intent is the purpose a person is trying to fulfil with a query. The main categories in the course are informational, navigational, commercial and transactional. Identifying intent helps the marketer decide whether a searcher needs an explanation, a destination, a review of options or a page that supports immediate action.\n\nThe queries 'Spotify login' and 'best music streaming service' both concern music platforms but demand different results. The first asks for a specific destination; the second asks for an evaluation. Treating them as equivalent would send one searcher to an irrelevant page. Intent-based planning starts with the action the user wants to accomplish, not merely the nouns in the query.\n\nThe same topic can represent different customer needs. A buying page is a poor response to a learning question, and a how-to guide is a poor checkout page."},"exampleType":"illustrative"},{"id":51,"term":"Informational intent","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":15,"definition":"The user is looking to learn or understand something — answers, how-tos, facts. Maps to awareness and problem definition.","explanation":"The searcher wants to understand a topic or solve a question, often through a guide or explanation. A page that answers clearly is more appropriate than a checkout page. In the course, this often connects to awareness and defining a problem.\n\nTeaching someone clearly can build discovery and trust without pushing an early sale. Informational searches need answers instead of sales pressure.","example":"Illustrative example: 'How do I remove a coffee stain from a white shirt?' calls for a helpful cleaning guide, not a checkout screen. The person wants information before buying anything.","full":"Informational search intent occurs when a person wants to learn a fact, understand a problem or find instructions. A page that answers clearly is more appropriate than a checkout page. In the course, this often connects to awareness and defining a problem.\n\nSomeone asking 'How do Netflix downloads work?' needs explanatory instructions and perhaps eligibility conditions. A checkout page would interrupt the job before answering the question. Informational intent commonly aligns with learning and problem definition, so useful guides, FAQs and clear instructions are appropriate. Providing the answer can also establish trust before the visitor is ready to subscribe or buy.\n\nTeaching someone clearly can build discovery and trust without pushing an early sale. Informational searches need answers instead of sales pressure.","category":"SEO BASICS","study":{"simple":"The searcher wants to understand a topic or solve a question, often through a guide or explanation. A page that answers clearly is more appropriate than a checkout page.","why":"Teaching someone clearly can build discovery and trust without pushing an early sale. Informational searches need answers instead of sales pressure. A checkout page would interrupt the job before answering the question. Informational intent commonly aligns with learning and problem definition, so useful guides, FAQs and clear instructions are appropriate.","example":"'How do I remove a coffee stain from a white shirt?' calls for a helpful cleaning guide, not a checkout screen. The person wants information before buying anything.","exam":"Informational search intent occurs when a person wants to learn a fact, understand a problem or find instructions. A page that answers clearly is more appropriate than a checkout page. In the course, this often connects to awareness and defining a problem.\n\nSomeone asking 'How do Netflix downloads work?' needs explanatory instructions and perhaps eligibility conditions. A checkout page would interrupt the job before answering the question. Informational intent commonly aligns with learning and problem definition, so useful guides, FAQs and clear instructions are appropriate. Providing the answer can also establish trust before the visitor is ready to subscribe or buy.\n\nTeaching someone clearly can build discovery and trust without pushing an early sale. Informational searches need answers instead of sales pressure."},"exampleType":"illustrative"},{"id":52,"term":"Navigational intent","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":15,"definition":"The user is trying to reach a specific site or page: a brand homepage, login or store locator. Maps to consideration and retention.","explanation":"The searcher already knows the particular website or destination they want to reach. A branded search or login-page search is an example. The best response makes that destination easy to find instead of giving an unrelated general explanation.\n\nSomeone trying to reach a known site should find that destination quickly. Unrelated comparison articles do not satisfy navigational intent.","example":"Illustrative example: Someone types 'Canva login' because they already know the site they want. The best result takes them to that destination; a long article about design tools would miss the navigational intent.","full":"Navigational search intent occurs when a person wants to reach a particular website, service or page they already have in mind. A branded search or login-page search is an example. The best response makes that destination easy to find instead of giving an unrelated general explanation.\n\nA query such as 'Spotify login' usually means the person already knows the destination and wants to reach it efficiently. The best page is the relevant sign-in route, not an article comparing streaming platforms. Navigational intent may come from existing customers as well as prospects. Search design should make the destination unmistakable and minimize unnecessary steps or confusion.\n\nSomeone trying to reach a known site should find that destination quickly. Unrelated comparison articles do not satisfy navigational intent.","category":"SEO BASICS","study":{"simple":"The searcher already knows the particular website or destination they want to reach. A branded search or login-page search is an example.","why":"Someone trying to reach a known site should find that destination quickly. Unrelated comparison articles do not satisfy navigational intent. The best page is the relevant sign-in route, not an article comparing streaming platforms. Navigational intent may come from existing customers as well as prospects.","example":"Someone types 'Canva login' because they already know the site they want. The best result takes them to that destination; a long article about design tools would miss the navigational intent.","exam":"Navigational search intent occurs when a person wants to reach a particular website, service or page they already have in mind. A branded search or login-page search is an example. The best response makes that destination easy to find instead of giving an unrelated general explanation.\n\nA query such as 'Spotify login' usually means the person already knows the destination and wants to reach it efficiently. The best page is the relevant sign-in route, not an article comparing streaming platforms. Navigational intent may come from existing customers as well as prospects. Search design should make the destination unmistakable and minimize unnecessary steps or confusion.\n\nSomeone trying to reach a known site should find that destination quickly. Unrelated comparison articles do not satisfy navigational intent."},"exampleType":"illustrative"},{"id":53,"term":"Commercial intent","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":15,"definition":"The user is comparing options before a decision — reviews, comparisons, case studies. Maps to consideration and evaluation.","explanation":"The user is investigating options before deciding, for example through reviews, comparisons or case studies. Content should help evaluate alternatives and resolve uncertainties. This differs from transactional intent because the final action has not yet been chosen.\n\nSomeone comparing options needs balanced specifications, reviews and trade-offs. A purchase button alone does not resolve their uncertainty.","example":"Illustrative example: A shopper searches 'Dyson vs Shark cordless vacuum reviews.' They are comparing options before deciding, so comparison pages and honest reviews meet their commercial-investigation intent.","full":"Commercial search intent involves comparing options, reviews and comparisons before making a decision. Content should help evaluate alternatives and resolve uncertainties. This differs from transactional intent because the final action has not yet been chosen.\n\nA user searching 'Samsung Galaxy vs iPhone camera' is investigating options before committing to a purchase. Useful content would compare concrete criteria such as image quality, video tools and price, acknowledging trade-offs. A one-click buy page provides too little support for that evaluation. Commercial investigation sits between broad learning and transaction because the customer is assessing alternatives instead of acting immediately.\n\nSomeone comparing options needs balanced specifications, reviews and trade-offs. A purchase button alone does not resolve their uncertainty.","category":"SEO BASICS","study":{"simple":"The user is investigating options before deciding, for example through reviews, comparisons or case studies. Content should help evaluate alternatives and resolve uncertainties.","why":"Someone comparing options needs balanced specifications, reviews and trade-offs. A purchase button alone does not resolve their uncertainty. Useful content would compare concrete criteria such as image quality, video tools and price, acknowledging trade-offs. A one-click buy page provides too little support for that evaluation.","example":"A shopper searches 'Dyson vs Shark cordless vacuum reviews.' They are comparing options before deciding, so comparison pages and honest reviews meet their commercial-investigation intent.","exam":"Commercial search intent involves comparing options, reviews and comparisons before making a decision. Content should help evaluate alternatives and resolve uncertainties. This differs from transactional intent because the final action has not yet been chosen.\n\nA user searching 'Samsung Galaxy vs iPhone camera' is investigating options before committing to a purchase. Useful content would compare concrete criteria such as image quality, video tools and price, acknowledging trade-offs. A one-click buy page provides too little support for that evaluation. Commercial investigation sits between broad learning and transaction because the customer is assessing alternatives instead of acting immediately.\n\nSomeone comparing options needs balanced specifications, reviews and trade-offs. A purchase button alone does not resolve their uncertainty."},"exampleType":"illustrative"},{"id":54,"term":"Transactional intent","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":15,"definition":"The user is ready to act now: buy, sign up or download. Maps to conversion and purchase.","explanation":"The person is ready to do something, such as purchase, download or register. The page should make the action clear and straightforward. It belongs close to conversion and purchase in the funnel.\n\nSomeone ready to purchase needs a clear price, availability and checkout. Extra explanation can become friction when the decision is already made.","example":"Illustrative example: Searching 'order replacement ear cushions for Sony WH-1000XM4' shows a person ready to buy a specific item. A clear product page with price, stock and checkout serves that transactional intent.","full":"Transactional search intent indicates that a person wants to complete an action such as buying, registering or downloading. The page should make the action clear and straightforward. It belongs close to conversion and purchase in the funnel.\n\nA query such as 'buy white IKEA KALLAX' indicates a relatively clear product and action. A matching product page should therefore show the appropriate variant, availability, price, delivery and an obvious way to purchase. Sending this visitor to a general storage-inspiration article can introduce friction. Transactional intent calls for an efficient conversion path, not a long preliminary explanation.\n\nSomeone ready to purchase needs a clear price, availability and checkout. Extra explanation can become friction when the decision is already made.","category":"SEO BASICS","study":{"simple":"The person is ready to do something, such as purchase, download or register. The page should make the action clear and straightforward.","why":"Someone ready to purchase needs a clear price, availability and checkout. Extra explanation can become friction when the decision is already made. A matching product page should therefore show the appropriate variant, availability, price, delivery and an obvious way to purchase. Sending this visitor to a general storage-inspiration article can introduce friction.","example":"Searching 'order replacement ear cushions for Sony WH-1000XM4' shows a person ready to buy a specific item. A clear product page with price, stock and checkout serves that transactional intent.","exam":"Transactional search intent indicates that a person wants to complete an action such as buying, registering or downloading. The page should make the action clear and straightforward. It belongs close to conversion and purchase in the funnel.\n\nA query such as 'buy white IKEA KALLAX' indicates a relatively clear product and action. A matching product page should therefore show the appropriate variant, availability, price, delivery and an obvious way to purchase. Sending this visitor to a general storage-inspiration article can introduce friction. Transactional intent calls for an efficient conversion path, not a long preliminary explanation.\n\nSomeone ready to purchase needs a clear price, availability and checkout. Extra explanation can become friction when the decision is already made."},"exampleType":"illustrative"},{"id":55,"term":"SEO audit","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":15,"definition":"An SEO analysis of a site that uncovers the highest-priority issues: a Site Health rank, errors and warnings, crawlability, HTTPS, Core Web Vitals, internal linking, markup and site performance.","explanation":"An SEO audit identifies issues that could limit a website’s search performance. Findings can cover site health, crawling, security, page experience, links and markup. The point is to prioritise what to investigate and fix, not just produce a long list of technical observations.\n\nAuditing makes technical issues actionable by linking them to visitor and crawler consequences. Fixing a blocked important page should outrank trivial cosmetic warnings.","example":"Illustrative example: An online flower shop discovers that its bouquet category page has a broken link and loads slowly on phones. An SEO audit records these issues and prioritizes the fixes most likely to help visitors and search engines.","full":"An SEO audit systematically examines a website to identify and prioritize the technical and content problems that could limit its search performance. Findings can cover site health, crawling, security, page experience, links and markup. The point is to prioritise what to investigate and fix, not just produce a long list of technical observations.\n\nImagine an audit discovers that an important IKEA furniture category is accidentally blocked from search crawlers, while several minor descriptions are imperfect. The access problem is likely to deserve higher priority because the entire category could be undiscoverable. An SEO audit is useful when it links each technical or content finding to the likely consequence for visitors and search systems instead of listing scores without interpretation.\n\nAuditing makes technical issues actionable by linking them to visitor and crawler consequences. Fixing a blocked important page should outrank trivial cosmetic warnings.","category":"SEO BASICS","study":{"simple":"An SEO audit identifies issues that could limit a website’s search performance. Findings can cover site health, crawling, security, page experience, links and markup.","why":"Auditing makes technical issues actionable by linking them to visitor and crawler consequences. Fixing a blocked important page should outrank trivial cosmetic warnings. The access problem is likely to deserve higher priority because the entire category could be undiscoverable. An SEO audit is useful when it links each technical or content finding to the likely consequence for visitors and search systems instead of listing scores without interpretation.","example":"An online flower shop discovers that its bouquet category page has a broken link and loads slowly on phones. An SEO audit records these issues and prioritizes the fixes most likely to help visitors and search engines.","exam":"An SEO audit systematically examines a website to identify and prioritize the technical and content problems that could limit its search performance. Findings can cover site health, crawling, security, page experience, links and markup. The point is to prioritise what to investigate and fix, not just produce a long list of technical observations.\n\nImagine an audit discovers that an important IKEA furniture category is accidentally blocked from search crawlers, while several minor descriptions are imperfect. The access problem is likely to deserve higher priority because the entire category could be undiscoverable. An SEO audit is useful when it links each technical or content finding to the likely consequence for visitors and search systems instead of listing scores without interpretation.\n\nAuditing makes technical issues actionable by linking them to visitor and crawler consequences. Fixing a blocked important page should outrank trivial cosmetic warnings."},"exampleType":"illustrative"},{"id":56,"term":"Technical SEO","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":17,"definition":"The “under-the-hood” aspects of a site that affect crawling, indexation, user experience and rankings. It asks one question: can a machine reach, read and trust your site?.","explanation":"Technical SEO focuses on whether the website works in ways that allow crawlers and users to reach its content. It includes crawlability, secure connections, performance, mobile usability and site structure. A page with excellent writing can still struggle if it cannot be reached or processed properly.\n\nTechnical failures can stop a useful page loading or being indexed. Search performance depends on access and usability as well as good content.","example":"Illustrative example: Imagine a charity's donation page cannot load on mobile phones. Even excellent copy won't help users who cannot access the page. Fixing that technical barrier is technical SEO and usability work.","full":"Technical SEO concerns the infrastructure and site behaviour that allow search systems and visitors to reach, read and use web content. It includes crawlability, secure connections, performance, mobile usability and site structure. A page with excellent writing can still struggle if it cannot be reached or processed properly.\n\nA hypothetical Nike product page may contain excellent shoe descriptions but fail to load consistently on mobile or return errors to crawlers. Technical SEO investigates and removes those barriers through site performance, accessibility, secure connections and crawlability. Its role is foundational: improving copy cannot rescue a page that machines or users cannot reach, although technical health alone does not ensure high rankings.\n\nTechnical failures can stop a useful page loading or being indexed. Search performance depends on access and usability as well as good content.","category":"TECHNICAL SEO","study":{"simple":"Technical SEO focuses on whether the website works in ways that allow crawlers and users to reach its content. It includes crawlability, secure connections, performance, mobile usability and site structure.","why":"Technical failures can stop a useful page loading or being indexed. Search performance depends on access and usability as well as good content. Technical SEO investigates and removes those barriers through site performance, accessibility, secure connections and crawlability. Its role is foundational: improving copy cannot rescue a page that machines or users cannot reach, although technical health alone does not ensure high rankings.","example":"Imagine a charity's donation page cannot load on mobile phones. Even excellent copy won't help users who cannot access the page. Fixing that technical barrier is technical SEO and usability work.","exam":"Technical SEO concerns the infrastructure and site behaviour that allow search systems and visitors to reach, read and use web content. It includes crawlability, secure connections, performance, mobile usability and site structure. A page with excellent writing can still struggle if it cannot be reached or processed properly.\n\nA hypothetical Nike product page may contain excellent shoe descriptions but fail to load consistently on mobile or return errors to crawlers. Technical SEO investigates and removes those barriers through site performance, accessibility, secure connections and crawlability. Its role is foundational: improving copy cannot rescue a page that machines or users cannot reach, although technical health alone does not ensure high rankings.\n\nTechnical failures can stop a useful page loading or being indexed. Search performance depends on access and usability as well as good content."},"exampleType":"illustrative"},{"id":57,"term":"On-site SEO","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":17,"definition":"Everything on your own pages that you control: content, keywords, titles, descriptions, headings, URLs, images and links.","explanation":"This covers elements the site owner can edit directly, including page content, headings, metadata, descriptive URLs, image text and internal links. The goal is to make each page understandable and useful for its intended query. It complements technical access and signals from other websites.\n\nPage owners control titles, headings, descriptions and internal links. Clear structure helps visitors and search engines understand the actual subject.","example":"Illustrative example: A second-hand bookshop rewrites a vague page heading from 'Products' to 'Used science-fiction books' and adds useful descriptions. Those are edits made on its own site, so they count as on-site SEO.","full":"On-site SEO covers everything on your own pages that you control: content, keywords, titles, descriptions, headings, URLs, images and links. This covers elements the site owner can edit directly, including page content, headings, metadata, descriptive URLs, image text and internal links. The goal is to make each page understandable and useful for its intended query. It complements technical access and signals from other websites.\n\nIKEA can improve its own wardrobe page by adding a descriptive title, structured headings, measurements, helpful images and links to related products. These are on-site changes because the company controls the page content. They help users and search systems understand relevance. Their purpose is to answer a searcher's real need clearly, instead of insert keywords repeatedly without improving the page.\n\nPage owners control titles, headings, descriptions and internal links. Clear structure helps visitors and search engines understand the actual subject.","category":"ON-SITE SEO","study":{"simple":"This covers elements the site owner can edit directly, including page content, headings, metadata, descriptive URLs, image text and internal links. The goal is to make each page understandable and useful for its intended query.","why":"Page owners control titles, headings, descriptions and internal links. Clear structure helps visitors and search engines understand the actual subject. These are on-site changes because the company controls the page content. They help users and search systems understand relevance.","example":"A second-hand bookshop rewrites a vague page heading from 'Products' to 'Used science-fiction books' and adds useful descriptions. Those are edits made on its own site, so they count as on-site SEO.","exam":"On-site SEO covers everything on your own pages that you control: content, keywords, titles, descriptions, headings, URLs, images and links. This covers elements the site owner can edit directly, including page content, headings, metadata, descriptive URLs, image text and internal links. The goal is to make each page understandable and useful for its intended query. It complements technical access and signals from other websites.\n\nIKEA can improve its own wardrobe page by adding a descriptive title, structured headings, measurements, helpful images and links to related products. These are on-site changes because the company controls the page content. They help users and search systems understand relevance. Their purpose is to answer a searcher's real need clearly, instead of insert keywords repeatedly without improving the page.\n\nPage owners control titles, headings, descriptions and internal links. Clear structure helps visitors and search engines understand the actual subject."},"exampleType":"illustrative"},{"id":58,"term":"Off-site SEO","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":17,"definition":"Everything said about you somewhere else — business profiles, reviews, mentions, backlinks, PR and word of mouth. You influence it; you do not control it.","explanation":"Off-site factors are created outside the website itself, such as backlinks, business listings, reviews and mentions. A company can affect these through its work and relationships but cannot completely control them. The lecture connects them with credibility and recognition beyond the site.\n\nReputation outside a company's website can affect discovery and credibility. Because other people control those mentions, they cannot simply be edited like on-site text.","example":"Illustrative example: A local news site independently recommends a family-run restaurant and links to its menu. That external mention can build discovery and credibility, even though the restaurant cannot fully control it.","full":"Off-site SEO covers everything said about you somewhere else — business profiles, reviews, mentions, backlinks, PR and word of mouth. You influence it; you do not control it. Off-site factors are created outside the website itself, such as backlinks, business listings, reviews and mentions. A company can affect these through its work and relationships but cannot completely control them. The lecture connects them with credibility and recognition beyond the site.\n\nSuppose an independent home-design publication links to IKEA's room-measuring guide. That mention exists outside IKEA's own site, so it is an off-site signal, unlike the headings IKEA edits itself. External recommendations may strengthen discovery and credibility but cannot be dictated by the brand. That is why earning useful coverage differs from merely placing links on pages the organization controls.\n\nReputation outside a company's website can affect discovery and credibility. Because other people control those mentions, they cannot simply be edited like on-site text.","category":"OFF-SITE SEO","study":{"simple":"Off-site factors are created outside the website itself, such as backlinks, business listings, reviews and mentions. A company can affect these through its work and relationships but cannot completely control them.","why":"Reputation outside a company's website can affect discovery and credibility. Because other people control those mentions, they cannot simply be edited like on-site text. That mention exists outside IKEA's own site, so it is an off-site signal, unlike the headings IKEA edits itself. External recommendations may strengthen discovery and credibility but cannot be dictated by the brand.","example":"A local news site independently recommends a family-run restaurant and links to its menu. That external mention can build discovery and credibility, even though the restaurant cannot fully control it.","exam":"Off-site SEO covers everything said about you somewhere else — business profiles, reviews, mentions, backlinks, PR and word of mouth. You influence it; you do not control it. Off-site factors are created outside the website itself, such as backlinks, business listings, reviews and mentions. A company can affect these through its work and relationships but cannot completely control them. The lecture connects them with credibility and recognition beyond the site.\n\nSuppose an independent home-design publication links to IKEA's room-measuring guide. That mention exists outside IKEA's own site, so it is an off-site signal, unlike the headings IKEA edits itself. External recommendations may strengthen discovery and credibility but cannot be dictated by the brand. That is why earning useful coverage differs from merely placing links on pages the organization controls.\n\nReputation outside a company's website can affect discovery and credibility. Because other people control those mentions, they cannot simply be edited like on-site text."},"exampleType":"illustrative"},{"id":59,"term":"Sitemap","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":17,"definition":"A simple display of the entirety of your site, telling search engines which pages exist.","explanation":"A sitemap helps search engines discover the pages a site wants them to know about. It is especially useful as a list of available URLs, complementing links between pages. Having a sitemap does not replace the need for sensible site structure.\n\nA sitemap helps crawlers discover available URLs, especially ones not easily reached through navigation. It does not replace sound links or guarantee indexing.","example":"Illustrative example: An online pet shop adds dozens of new items. Its sitemap lists the product URLs so search engines have another way to discover pages, alongside links on the website.","full":"A sitemap is a structured list of site URLs designed to help search engines discover available pages. It is especially useful as a list of available URLs, complementing links between pages. Having a sitemap does not replace the need for sensible site structure.\n\nAn XML sitemap can list IKEA product and category URLs so crawlers know which pages the business wishes to expose. It improves discovery, particularly on a large or changing site. But listing a URL does not force a search engine to index it or fix a page that is blocked. The sitemap complements, instead of replaces, good internal navigation and technical accessibility.\n\nA sitemap helps crawlers discover available URLs, especially ones not easily reached through navigation. It does not replace sound links or guarantee indexing.","category":"TECHNICAL SEO","study":{"simple":"A sitemap helps search engines discover the pages a site wants them to know about. It is especially useful as a list of available URLs, complementing links between pages.","why":"A sitemap helps crawlers discover available URLs, especially ones not easily reached through navigation. It does not replace sound links or guarantee indexing. It improves discovery, particularly on a large or changing site. But listing a URL does not force a search engine to index it or fix a page that is blocked.","example":"An online pet shop adds dozens of new items. Its sitemap lists the product URLs so search engines have another way to discover pages, alongside links on the website.","exam":"A sitemap is a structured list of site URLs designed to help search engines discover available pages. It is especially useful as a list of available URLs, complementing links between pages. Having a sitemap does not replace the need for sensible site structure.\n\nAn XML sitemap can list IKEA product and category URLs so crawlers know which pages the business wishes to expose. It improves discovery, particularly on a large or changing site. But listing a URL does not force a search engine to index it or fix a page that is blocked. The sitemap complements, instead of replaces, good internal navigation and technical accessibility.\n\nA sitemap helps crawlers discover available URLs, especially ones not easily reached through navigation. It does not replace sound links or guarantee indexing."},"exampleType":"illustrative"},{"id":60,"term":"Site hierarchy","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":18,"definition":"The structure of your pages within the site. The hierarchy tells the crawler what belongs to what — and what matters most.","explanation":"Hierarchy organises pages into understandable relationships. It shows which information is broad, which is more specific and how pages connect. A clear hierarchy helps both visitors and crawlers navigate the website.\n\nClear page relationships let visitors and crawlers move from broad topics to specific products without getting lost. Poor hierarchy hides relevant pages.","example":"Illustrative example: A bike-shop website groups 'Bikes → City bikes → Folding bikes.' Customers understand where they are, and crawlers can see how specific pages fit under broader categories.","full":"Site hierarchy is the structure of your pages within the site. The hierarchy tells the crawler what belongs to what — and what matters most. Hierarchy organises pages into understandable relationships. It shows which information is broad, which is more specific and how pages connect. A clear hierarchy helps both visitors and crawlers navigate the website.\n\nAn IKEA site might arrange products as Beds, Bed frames and Storage beds. This hierarchy communicates that storage beds are a specific kind of bed frame within the wider furniture catalogue. It helps shoppers narrow choices and allows search engines to infer relationships between pages. Poorly organized categories make both navigation and content interpretation harder, even if individual product descriptions are accurate.\n\nClear page relationships let visitors and crawlers move from broad topics to specific products without getting lost. Poor hierarchy hides relevant pages.","category":"TECHNICAL SEO","study":{"simple":"Hierarchy organises pages into understandable relationships. It shows which information is broad, which is more specific and how pages connect.","why":"Clear page relationships let visitors and crawlers move from broad topics to specific products without getting lost. Poor hierarchy hides relevant pages. This hierarchy communicates that storage beds are a specific kind of bed frame within the wider furniture catalogue. It helps shoppers narrow choices and allows search engines to infer relationships between pages.","example":"A bike-shop website groups 'Bikes → City bikes → Folding bikes.' Customers understand where they are, and crawlers can see how specific pages fit under broader categories.","exam":"Site hierarchy is the structure of your pages within the site. The hierarchy tells the crawler what belongs to what — and what matters most. Hierarchy organises pages into understandable relationships. It shows which information is broad, which is more specific and how pages connect. A clear hierarchy helps both visitors and crawlers navigate the website.\n\nAn IKEA site might arrange products as Beds, Bed frames and Storage beds. This hierarchy communicates that storage beds are a specific kind of bed frame within the wider furniture catalogue. It helps shoppers narrow choices and allows search engines to infer relationships between pages. Poorly organized categories make both navigation and content interpretation harder, even if individual product descriptions are accurate.\n\nClear page relationships let visitors and crawlers move from broad topics to specific products without getting lost. Poor hierarchy hides relevant pages."},"exampleType":"illustrative"},{"id":61,"term":"Metadata","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":18,"definition":"Code that tells the robots about your site and its pages.","explanation":"Metadata provides information about a page beyond its visible body copy. The course discusses titles and descriptions because they help describe pages to search systems and may change how a result is presented. Each page should have metadata suited to its own content.\n\nMetadata helps describe what a page contains before a person opens it. Generic or misleading information can produce confusing search listings.","example":"Illustrative example: A cooking blog can give a recipe page a clear HTML title and description, even though those details aren't the recipe instructions on the page. That extra information is metadata.","full":"Metadata is information supplied about a webpage, including elements such as its HTML title and description. The course discusses titles and descriptions because they help describe pages to search systems and may change how a result is presented. Each page should have metadata suited to its own content.\n\nA Samsung phone page can include a specific HTML title and description explaining what the page contains. This metadata adds information about the page for machines and potential search-result displays, beyond the body text. It is not a substitute for useful content and search engines may rewrite snippets. Consistency between metadata and the actual destination prevents misleading expectations and improves relevance.\n\nMetadata helps describe what a page contains before a person opens it. Generic or misleading information can produce confusing search listings.","category":"ON-SITE SEO","study":{"simple":"Metadata provides information about a page beyond its visible body copy. The course discusses titles and descriptions because they help describe pages to search systems and may change how a result is presented.","why":"Metadata helps describe what a page contains before a person opens it. Generic or misleading information can produce confusing search listings. This metadata adds information about the page for machines and potential search-result displays, beyond the body text. It is not a substitute for useful content and search engines may rewrite snippets.","example":"A cooking blog can give a recipe page a clear HTML title and description, even though those details aren't the recipe instructions on the page. That extra information is metadata.","exam":"Metadata is information supplied about a webpage, including elements such as its HTML title and description. The course discusses titles and descriptions because they help describe pages to search systems and may change how a result is presented. Each page should have metadata suited to its own content.\n\nA Samsung phone page can include a specific HTML title and description explaining what the page contains. This metadata adds information about the page for machines and potential search-result displays, beyond the body text. It is not a substitute for useful content and search engines may rewrite snippets. Consistency between metadata and the actual destination prevents misleading expectations and improves relevance.\n\nMetadata helps describe what a page contains before a person opens it. Generic or misleading information can produce confusing search listings."},"exampleType":"illustrative"},{"id":62,"term":"Meta title","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":18,"definition":"The clickable headline on the SERP. Concise, relevant and containing important keywords — around 50–60 characters. One unique title per page.","explanation":"The title communicates the page topic in a short, distinctive form and commonly appears as the clickable search-result heading. The course recommends about 50–60 characters and a relevant keyword. Giving each page its own title helps distinguish the pages in search.\n\nA descriptive, unique page title lets searchers distinguish the result from alternatives. Repeated vague titles reduce clarity at the decision to click.","example":"Illustrative example: Imagine a hiking shop naming one page 'Waterproof Hiking Boots | Trail Shop' instead of 'Home.' The descriptive title helps searchers understand what the page offers before clicking.","full":"A meta title is the HTML page title that commonly appears as the main clickable heading of a search result. The course recommends about 50–60 characters and a relevant keyword. Giving each page its own title helps distinguish the pages in search.\n\nA desk page titled 'MICKE desk – IKEA' is more informative than a repeated title such as 'Product Page.' The meta title communicates identity and subject before the searcher clicks. The course suggests roughly 50–60 characters as a practical guide, not an absolute ranking threshold. A unique, accurate title helps distinguish nearby search results and avoids hiding the page's main purpose.\n\nA descriptive, unique page title lets searchers distinguish the result from alternatives. Repeated vague titles reduce clarity at the decision to click.","category":"ON-SITE SEO","study":{"simple":"The title communicates the page topic in a short, distinctive form and commonly appears as the clickable search-result heading. The course recommends about 50–60 characters and a relevant keyword.","why":"A descriptive, unique page title lets searchers distinguish the result from alternatives. Repeated vague titles reduce clarity at the decision to click. The course suggests roughly 50–60 characters as a practical guide, not an absolute ranking threshold. A unique, accurate title helps distinguish nearby search results and avoids hiding the page's main purpose.","example":"Imagine a hiking shop naming one page 'Waterproof Hiking Boots | Trail Shop' instead of 'Home.' The descriptive title helps searchers understand what the page offers before clicking.","exam":"A meta title is the HTML page title that commonly appears as the main clickable heading of a search result. The course recommends about 50–60 characters and a relevant keyword. Giving each page its own title helps distinguish the pages in search.\n\nA desk page titled 'MICKE desk – IKEA' is more informative than a repeated title such as 'Product Page.' The meta title communicates identity and subject before the searcher clicks. The course suggests roughly 50–60 characters as a practical guide, not an absolute ranking threshold. A unique, accurate title helps distinguish nearby search results and avoids hiding the page's main purpose.\n
