e time.","explanation":"Working memory is used while a person is actively reading, comparing or understanding new information. Because its capacity is limited, too many unfamiliar elements can make a message hard to follow. The course uses this to explain why marketing communication should avoid unnecessary complexity.\n\nWhen a user must compare several unfamiliar details at once, they can lose track of them. Presenting information in manageable pieces supports comprehension.","example":"Illustrative example: A traveller tries to remember three train times while checking which platform to use. If another announcement adds five details, some information may be lost because working memory can only handle so much at once.","full":"Working memory is the temporary mental system used to hold and process information while learning, reading or making a decision. Because its capacity is limited, too many unfamiliar elements can make a message hard to follow. The course uses this to explain why marketing communication should avoid unnecessary complexity.\n\nSomeone comparing four IKEA wardrobe dimensions while remembering the size of a bedroom is using working memory. If the page hides earlier measurements, the shopper must keep too many numbers active at once and may make mistakes. Displaying comparable dimensions together reduces the burden. Working memory is the temporary processing system, not the long-term store of furniture knowledge.\n\nWhen a user must compare several unfamiliar details at once, they can lose track of them. Presenting information in manageable pieces supports comprehension.","category":"MEMORY SYSTEMS","study":{"simple":"Working memory is used while a person is actively reading, comparing or understanding new information. Because its capacity is limited, too many unfamiliar elements can make a message hard to follow.","why":"When a user must compare several unfamiliar details at once, they can lose track of them. Presenting information in manageable pieces supports comprehension. If the page hides earlier measurements, the shopper must keep too many numbers active at once and may make mistakes. Displaying comparable dimensions together reduces the burden.","example":"A traveller tries to remember three train times while checking which platform to use. If another announcement adds five details, some information may be lost because working memory can only handle so much at once.","exam":"Working memory is the temporary mental system used to hold and process information while learning, reading or making a decision. Because its capacity is limited, too many unfamiliar elements can make a message hard to follow. The course uses this to explain why marketing communication should avoid unnecessary complexity.\n\nSomeone comparing four IKEA wardrobe dimensions while remembering the size of a bedroom is using working memory. If the page hides earlier measurements, the shopper must keep too many numbers active at once and may make mistakes. Displaying comparable dimensions together reduces the burden. Working memory is the temporary processing system, not the long-term store of furniture knowledge.\n\nWhen a user must compare several unfamiliar details at once, they can lose track of them. Presenting information in manageable pieces supports comprehension."},"exampleType":"illustrative"},{"id":95,"term":"Long-term memory","lecture":"Lecture 6 · Cognitive load theory and outbound marketing","page":27,"definition":"The memory system that stores organised knowledge for later use. It is not limited in the same way as working memory.","explanation":"Long-term memory holds knowledge that has already been learned and organised. A familiar idea can be processed more easily because the person can draw on existing knowledge. This helps explain why recognition and prior experience affect how demanding new information feels.\n\nFamiliar knowledge lets people recognise patterns more quickly. Communication can build on what users already know instead of teaching everything from scratch.","example":"Illustrative example: An experienced barista can make a familiar latte without consciously recalling every step. The recipe is stored as organised long-term knowledge, leaving more attention available for a new customer request.","full":"Long-term memory is the memory system that stores organised knowledge for later use. It is not limited in the same way as working memory. Long-term memory holds knowledge that has already been learned and organised. A familiar idea can be processed more easily because the person can draw on existing knowledge. This helps explain why recognition and prior experience affect how demanding new information feels.\n\nAn experienced IKEA kitchen planner recognizes common cabinet sizes without mentally calculating every relationship from scratch. That knowledge is available from long-term memory and frees working memory to tackle new design decisions. Beginners lack the same organized knowledge, so identical instructions may feel more demanding to them. Communication should take into account expertise instead of assuming every visitor processes information equally.\n\nFamiliar knowledge lets people recognise patterns more quickly. Communication can build on what users already know instead of teaching everything from scratch.","category":"MEMORY SYSTEMS","study":{"simple":"Long-term memory holds knowledge that has already been learned and organised. A familiar idea can be processed more easily because the person can draw on existing knowledge.","why":"Familiar knowledge lets people recognise patterns more quickly. Communication can build on what users already know instead of teaching everything from scratch. That knowledge is available from long-term memory and frees working memory to tackle new design decisions. Beginners lack the same organized knowledge, so identical instructions may feel more demanding to them.","example":"An experienced barista can make a familiar latte without consciously recalling every step. The recipe is stored as organised long-term knowledge, leaving more attention available for a new customer request.","exam":"Long-term memory is the memory system that stores organised knowledge for later use. It is not limited in the same way as working memory. Long-term memory holds knowledge that has already been learned and organised. A familiar idea can be processed more easily because the person can draw on existing knowledge. This helps explain why recognition and prior experience affect how demanding new information feels.\n\nAn experienced IKEA kitchen planner recognizes common cabinet sizes without mentally calculating every relationship from scratch. That knowledge is available from long-term memory and frees working memory to tackle new design decisions. Beginners lack the same organized knowledge, so identical instructions may feel more demanding to them. Communication should take into account expertise instead of assuming every visitor processes information equally.\n\nFamiliar knowledge lets people recognise patterns more quickly. Communication can build on what users already know instead of teaching everything from scratch."},"exampleType":"illustrative"},{"id":96,"term":"Schema","lecture":"Lecture 6 · Cognitive load theory and outbound marketing","page":27,"definition":"An organised structure that connects several pieces of knowledge, making information easier to process and retrieve.","explanation":"A schema organises related knowledge into a meaningful structure. Instead of having to process each detail separately, a person can use that structure to understand a larger idea. Building and using schemas so helps reduce the effort required by unfamiliar material.\n\nRelated facts stored together are easier to retrieve and use. Grouping ideas into a schema is more effective than memorising disconnected terms.","example":"Illustrative example: An experienced cook sees 'make pancakes' as one familiar routine rather than ten unrelated actions. Those connected steps form a schema that makes the whole task easier to understand and perform.","full":"Schema is an organised structure that connects several pieces of knowledge, making information easier to process and retrieve. A schema organises related knowledge into a meaningful structure. Instead of having to process each detail separately, a person can use that structure to understand a larger idea. Building and using schemas so helps reduce the effort required by unfamiliar material.\n\nA student who understands that CTR, CPC and CPM are different advertising metrics can organize them in one coherent mental schema. Instead of learning three disconnected acronyms, the student recognizes whether a figure describes clicks, a billing method or impressions. Schemas reduce processing demands by grouping related knowledge into meaningful structures. Misleading grouping, however, can blur important differences between concepts.\n\nRelated facts stored together are easier to retrieve and use. Grouping ideas into a schema is more effective than memorising disconnected terms.","category":"MEMORY SYSTEMS","study":{"simple":"A schema organises related knowledge into a meaningful structure. Instead of having to process each detail separately, a person can use that structure to understand a larger idea.","why":"Related facts stored together are easier to retrieve and use. Grouping ideas into a schema is more effective than memorising disconnected terms. Instead of learning three disconnected acronyms, the student recognizes whether a figure describes clicks, a billing method or impressions. Schemas reduce processing demands by grouping related knowledge into meaningful structures.","example":"An experienced cook sees 'make pancakes' as one familiar routine rather than ten unrelated actions. Those connected steps form a schema that makes the whole task easier to understand and perform.","exam":"Schema is an organised structure that connects several pieces of knowledge, making information easier to process and retrieve. A schema organises related knowledge into a meaningful structure. Instead of having to process each detail separately, a person can use that structure to understand a larger idea. Building and using schemas so helps reduce the effort required by unfamiliar material.\n\nA student who understands that CTR, CPC and CPM are different advertising metrics can organize them in one coherent mental schema. Instead of learning three disconnected acronyms, the student recognizes whether a figure describes clicks, a billing method or impressions. Schemas reduce processing demands by grouping related knowledge into meaningful structures. Misleading grouping, however, can blur important differences between concepts.\n\nRelated facts stored together are easier to retrieve and use. Grouping ideas into a schema is more effective than memorising disconnected terms."},"exampleType":"illustrative"},{"id":97,"term":"Cognitive load","lecture":"Lecture 6 · Cognitive load theory and outbound marketing","page":28,"definition":"The demands placed on working memory while a person processes information.","explanation":"Cognitive load is the amount of mental effort a task demands from working memory. Some load comes from the task itself, while some is added unnecessarily by poor presentation. Designers can often improve understanding by reducing the avoidable part.\n\nA task can become mentally demanding even when all information is relevant. Designers need to respect the limited capacity of working memory.","example":"Illustrative example: A bread maker with twelve unlabeled symbols forces users to keep too many details in mind. A simpler screen with a few clear settings lowers the mental work needed to complete the same task.","full":"Cognitive load is the mental demand placed on working memory while a person processes information or completes a task. Some load comes from the task itself, while some is added unnecessarily by poor presentation. Designers can often improve understanding by reducing the avoidable part.\n\nComparing ten unfamiliar Samsung phone specifications places demands on working memory because users must evaluate relationships between battery, display, price and other features. Some effort is necessary, but excessive presentation complexity creates avoidable pressure. Cognitive load is the total mental demand during processing; it helps explain why a page can contain correct information yet remain hard to use.\n\nA task can become mentally demanding even when all information is relevant. Designers need to respect the limited capacity of working memory.","category":"COGNITIVE LOAD THEORY","study":{"simple":"Cognitive load is the amount of mental effort a task demands from working memory. Some load comes from the task itself, while some is added unnecessarily by poor presentation.","why":"A task can become mentally demanding even when all information is relevant. Designers need to respect the limited capacity of working memory. Some effort is necessary, but excessive presentation complexity creates avoidable pressure. Cognitive load is the total mental demand during processing; it helps explain why a page can contain correct information yet remain hard to use.","example":"A bread maker with twelve unlabeled symbols forces users to keep too many details in mind. A simpler screen with a few clear settings lowers the mental work needed to complete the same task.","exam":"Cognitive load is the mental demand placed on working memory while a person processes information or completes a task. Some load comes from the task itself, while some is added unnecessarily by poor presentation. Designers can often improve understanding by reducing the avoidable part.\n\nComparing ten unfamiliar Samsung phone specifications places demands on working memory because users must evaluate relationships between battery, display, price and other features. Some effort is necessary, but excessive presentation complexity creates avoidable pressure. Cognitive load is the total mental demand during processing; it helps explain why a page can contain correct information yet remain hard to use.\n\nA task can become mentally demanding even when all information is relevant. Designers need to respect the limited capacity of working memory."},"exampleType":"illustrative"},{"id":98,"term":"Extraneous cognitive load","lecture":"Lecture 6 · Cognitive load theory and outbound marketing","page":28,"definition":"Unnecessary processing created by how information is presented or by the design of a task.","explanation":"This is effort caused by the way information is delivered instead of by the important meaning of the information. Examples in the course include splitting related information across locations, repeating the same message without benefit and making information disappear too quickly. Better design reduces this unnecessary burden.\n\nDecorative distractions compete with necessary information. Removing them frees mental effort for understanding instead of decoding the interface.","example":"Illustrative example: Imagine booking a hotel room while animated banners cover the price and a pop-up asks about newsletters. The extra attention needed to ignore those distractions is extraneous cognitive load, not necessary work for choosing a room.","full":"Extraneous cognitive load is unnecessary mental effort created by how information is presented instead of by the substance of the task. Examples in the course include splitting related information across locations, repeating the same message without benefit and making information disappear too quickly. Better design reduces this unnecessary burden.\n\nImagine an online ticket checkout where pop-up promotions cover seat options and animated banners constantly move. The shopper spends effort ignoring distractions and rediscovering relevant controls instead of choosing seats. That unnecessary processing is extraneous cognitive load because it comes from presentation, not the core booking decision. Simplifying the interface releases capacity for the intended task without removing essential ticket information.\n\nDecorative distractions compete with necessary information. Removing them frees mental effort for understanding instead of decoding the interface.","category":"COGNITIVE LOAD THEORY","study":{"simple":"This is effort caused by the way information is delivered instead of by the important meaning of the information. Examples in the course include splitting related information across locations, repeating the same message without benefit and making information disappear too quickly.","why":"Decorative distractions compete with necessary information. Removing them frees mental effort for understanding instead of decoding the interface. The shopper spends effort ignoring distractions and rediscovering relevant controls instead of choosing seats. That unnecessary processing is extraneous cognitive load because it comes from presentation, not the core booking decision.","example":"Imagine booking a hotel room while animated banners cover the price and a pop-up asks about newsletters. The extra attention needed to ignore those distractions is extraneous cognitive load, not necessary work for choosing a room.","exam":"Extraneous cognitive load is unnecessary mental effort created by how information is presented instead of by the substance of the task. Examples in the course include splitting related information across locations, repeating the same message without benefit and making information disappear too quickly. Better design reduces this unnecessary burden.\n\nImagine an online ticket checkout where pop-up promotions cover seat options and animated banners constantly move. The shopper spends effort ignoring distractions and rediscovering relevant controls instead of choosing seats. That unnecessary processing is extraneous cognitive load because it comes from presentation, not the core booking decision. Simplifying the interface releases capacity for the intended task without removing essential ticket information.\n\nDecorative distractions compete with necessary information. Removing them frees mental effort for understanding instead of decoding the interface."},"exampleType":"illustrative"},{"id":99,"term":"Intrinsic cognitive load","lecture":"Lecture 6 · Cognitive load theory and outbound marketing","page":28,"definition":"The necessary complexity of the information or task. It depends on how many elements must be understood together and what the person already knows.","explanation":"Intrinsic load comes from the genuine difficulty of learning or processing the subject. A task involving many connected unfamiliar ideas demands more than a simple familiar task. Unlike extraneous load, it cannot simply be removed through cosmetic presentation changes.\n\nSome complexity is unavoidable because the task itself requires decisions. Removing visual clutter cannot eliminate the need to understand real product differences.","example":"Illustrative example: Planning a trip with three connecting flights is genuinely more complex than booking one direct flight because several times and connections must be understood together. That unavoidable complexity is intrinsic cognitive load.","full":"Intrinsic cognitive load is the necessary complexity of the information or task. It depends on how many elements must be understood together and what the person already knows. Intrinsic load comes from the genuine difficulty of learning or processing the subject. A task involving many connected unfamiliar ideas demands more than a simple familiar task. Unlike extraneous load, it cannot simply be removed through cosmetic presentation changes.\n\nChoosing an IKEA wardrobe that fits a room requires comparing actual dimensions, door clearances and storage needs. These connected constraints are complex even when the webpage is perfectly organized. Their inherent demands constitute intrinsic cognitive load. A better design can sequence or explain the information, but it cannot make the underlying decision entirely effortless without omitting factors that matter.\n\nSome complexity is unavoidable because the task itself requires decisions. Removing visual clutter cannot eliminate the need to understand real product differences.","category":"COGNITIVE LOAD THEORY","study":{"simple":"Intrinsic load comes from the genuine difficulty of learning or processing the subject. A task involving many connected unfamiliar ideas demands more than a simple familiar task.","why":"Some complexity is unavoidable because the task itself requires decisions. Removing visual clutter cannot eliminate the need to understand real product differences. These connected constraints are complex even when the webpage is perfectly organized. Their inherent demands constitute intrinsic cognitive load.","example":"Planning a trip with three connecting flights is genuinely more complex than booking one direct flight because several times and connections must be understood together. That unavoidable complexity is intrinsic cognitive load.","exam":"Intrinsic cognitive load is the necessary complexity of the information or task. It depends on how many elements must be understood together and what the person already knows. Intrinsic load comes from the genuine difficulty of learning or processing the subject. A task involving many connected unfamiliar ideas demands more than a simple familiar task. Unlike extraneous load, it cannot simply be removed through cosmetic presentation changes.\n\nChoosing an IKEA wardrobe that fits a room requires comparing actual dimensions, door clearances and storage needs. These connected constraints are complex even when the webpage is perfectly organized. Their inherent demands constitute intrinsic cognitive load. A better design can sequence or explain the information, but it cannot make the underlying decision entirely effortless without omitting factors that matter.\n\nSome complexity is unavoidable because the task itself requires decisions. Removing visual clutter cannot eliminate the need to understand real product differences."},"exampleType":"illustrative"},{"id":100,"term":"Split-attention effect","lecture":"Lecture 6 · Cognitive load theory and outbound marketing","page":28,"definition":"When related information is separated and the audience must use working memory to connect it. Placing related information together reduces this load.","explanation":"If the caption describing a diagram is far from the relevant part of the diagram, the reader must keep switching between them. This uses working memory for matching instead of understanding. The course recommends keeping related information close together.\n\nForcing people to match distant labels with diagrams wastes memory capacity. Putting related information together reduces avoidable effort.","example":"Illustrative example: Imagine assembling a flat-pack shelf with screw labels on one page and the picture on another. You constantly look back and forth. Putting each label beside its matching screw reduces split attention.","full":"Split-attention effect occurs when related information is separated and the audience must use working memory to connect it. Placing related information together reduces this load. If the caption describing a diagram is far from the relevant part of the diagram, the reader must keep switching between them. This uses working memory for matching instead of understanding. The course recommends keeping related information close together.\n\nAn IKEA assembly diagram that labels a screw immediately beside its picture allows the viewer to identify it in one glance. If the label is several pages away, the user must repeatedly shift attention and remember the connection. That coordination wastes limited working memory. The split-attention effect explains why spatially integrating related instructions reduces unnecessary effort while keeping the technical information unchanged.\n\nForcing people to match distant labels with diagrams wastes memory capacity. Putting related information together reduces avoidable effort.","category":"EXTRANEOUS LOAD","study":{"simple":"If the caption describing a diagram is far from the relevant part of the diagram, the reader must keep switching between them. This uses working memory for matching instead of understanding.","why":"Forcing people to match distant labels with diagrams wastes memory capacity. Putting related information together reduces avoidable effort. If the label is several pages away, the user must repeatedly shift attention and remember the connection. That coordination wastes limited working memory.","example":"Imagine assembling a flat-pack shelf with screw labels on one page and the picture on another. You constantly look back and forth. Putting each label beside its matching screw reduces split attention.","exam":"Split-attention effect occurs when related information is separated and the audience must use working memory to connect it. Placing related information together reduces this load. If the caption describing a diagram is far from the relevant part of the diagram, the reader must keep switching between them. This uses working memory for matching instead of understanding. The course recommends keeping related information close together.\n\nAn IKEA assembly diagram that labels a screw immediately beside its picture allows the viewer to identify it in one glance. If the label is several pages away, the user must repeatedly shift attention and remember the connection. That coordination wastes limited working memory. The split-attention effect explains why spatially integrating related instructions reduces unnecessary effort while keeping the technical information unchanged.\n\nForcing people to match distant labels with diagrams wastes memory capacity. Putting related information together reduces avoidable effort."},"exampleType":"illustrative"},{"id":101,"term":"Redundancy effect","lecture":"Lecture 6 · Cognitive load theory and outbound marketing","page":29,"definition":"Unnecessary processing caused by repeating the same message without adding understanding. Text and visuals should have complementary jobs.","explanation":"Repeated text and visuals can create extra processing when they merely say the same thing. Communication becomes clearer when each element adds a useful contribution. The aim is not to eliminate explanation, but to avoid duplication that does not improve comprehension.\n\nRepeating information without adding anything new can crowd attention. Combining complementary visuals and words is more helpful than duplicating the same message.","example":"Illustrative example: A product video shows a presenter reading the exact paragraph already displayed on screen, word for word, while nothing new is shown. The repetition may add mental effort without improving understanding—the redundancy effect.","full":"The redundancy effect occurs when repeated content adds mental processing demands without improving understanding. Communication becomes clearer when each element adds a useful contribution. The aim is not to eliminate explanation, but to avoid duplication that does not improve comprehension.\n\nImagine a Nike product video where the subtitles duplicate every word of an already clear narration while competing with detailed visuals. Viewers may spend effort processing repeated information without learning more. The redundancy effect concerns duplication that adds processing burden; captions can still be important for accessibility. The relevant design judgement concerns whether channels complement the viewer's needs instead of repeat material mechanically.\n\nRepeating information without adding anything new can crowd attention. Combining complementary visuals and words is more helpful than duplicating the same message.","category":"EXTRANEOUS LOAD","study":{"simple":"Repeated text and visuals can create extra processing when they merely say the same thing. Communication becomes clearer when each element adds a useful contribution.","why":"Repeating information without adding anything new can crowd attention. Combining complementary visuals and words is more helpful than duplicating the same message. Viewers may spend effort processing repeated information without learning more. The redundancy effect concerns duplication that adds processing burden; captions can still be important for accessibility.","example":"A product video shows a presenter reading the exact paragraph already displayed on screen, word for word, while nothing new is shown. The repetition may add mental effort without improving understanding—the redundancy effect.","exam":"The redundancy effect occurs when repeated content adds mental processing demands without improving understanding. Communication becomes clearer when each element adds a useful contribution. The aim is not to eliminate explanation, but to avoid duplication that does not improve comprehension.\n\nImagine a Nike product video where the subtitles duplicate every word of an already clear narration while competing with detailed visuals. Viewers may spend effort processing repeated information without learning more. The redundancy effect concerns duplication that adds processing burden; captions can still be important for accessibility. The relevant design judgement concerns whether channels complement the viewer's needs instead of repeat material mechanically.\n\nRepeating information without adding anything new can crowd attention. Combining complementary visuals and words is more helpful than duplicating the same message."},"exampleType":"illustrative"},{"id":102,"term":"Transient information effect","lecture":"Lecture 6 · Cognitive load theory and outbound marketing","page":29,"definition":"The load created when information disappears before it is understood, forcing the audience to hold it in working memory.","explanation":"A temporary message, slide or moving element may disappear before the audience has understood it. The user then has to hold the unfinished information in working memory. Giving people enough time or making important material available reduces this problem.\n\nAudio or motion that disappears too quickly forces people to remember details before they understand them. Persistent summaries and slower pacing can help.","example":"Illustrative example: A radio advertisement quickly reads out a long discount code only once. Listeners must hold the whole code in memory before it disappears; that is a transient-information problem.","full":"Transient information effect is the load created when information disappears before it is understood, forcing the audience to hold it in working memory. A temporary message, slide or moving element may disappear before the audience has understood it. The user then has to hold the unfinished information in working memory. Giving people enough time or making important material available reduces this problem.\n\nA fast Spotify audio ad might describe several subscription conditions and then disappear before a listener can compare them. Because the information is transient, the listener must hold each detail in working memory without a persistent reference. A companion landing page or shorter message can reduce that burden. The effect is not that audio is inherently poor, but that fleeting, complex information can outpace comprehension.\n\nAudio or motion that disappears too quickly forces people to remember details before they understand them. Persistent summaries and slower pacing can help.","category":"EXTRANEOUS LOAD","study":{"simple":"A temporary message, slide or moving element may disappear before the audience has understood it. The user then has to hold the unfinished information in working memory.","why":"Audio or motion that disappears too quickly forces people to remember details before they understand them. Persistent summaries and slower pacing can help. Because the information is transient, the listener must hold each detail in working memory without a persistent reference. A companion landing page or shorter message can reduce that burden.","example":"A radio advertisement quickly reads out a long discount code only once. Listeners must hold the whole code in memory before it disappears; that is a transient-information problem.","exam":"Transient information effect is the load created when information disappears before it is understood, forcing the audience to hold it in working memory. A temporary message, slide or moving element may disappear before the audience has understood it. The user then has to hold the unfinished information in working memory. Giving people enough time or making important material available reduces this problem.\n\nA fast Spotify audio ad might describe several subscription conditions and then disappear before a listener can compare them. Because the information is transient, the listener must hold each detail in working memory without a persistent reference. A companion landing page or shorter message can reduce that burden. The effect is not that audio is inherently poor, but that fleeting, complex information can outpace comprehension.\n\nAudio or motion that disappears too quickly forces people to remember details before they understand them. Persistent summaries and slower pacing can help."},"exampleType":"illustrative"},{"id":103,"term":"Walled garden","lecture":"Lecture 6 · Cognitive load theory and outbound marketing","page":29,"definition":"A closed digital ecosystem where one company controls the content, user data, ad inventory and measurement.","explanation":"A walled garden keeps audiences, content, advertising opportunities and measurement within one company’s environment. Businesses can reach people inside that platform, but they depend on the platform’s rules and data. This illustrates the control major intermediaries have over digital advertising.\n\nA closed platform can control access to its audience, data and ad inventory. Brands gain distribution but depend on rules they cannot set themselves.","example":"Illustrative example: Imagine a game studio selling digital items only through one app store, where the platform sets the rules for payments and access. The studio gains distribution but becomes dependent on a controlled ecosystem: a walled garden.","full":"Walled garden is a closed digital ecosystem where one company controls the content, user data, ad inventory and measurement. A walled garden keeps audiences, content, advertising opportunities and measurement within one company’s environment. Businesses can reach people inside that platform, but they depend on the platform’s rules and data. This illustrates the control major intermediaries have over digital advertising.\n\nApple's App Store illustrates a controlled ecosystem where a platform sets distribution rules, governs transactions and has access to platform-level data. App developers can reach users inside that system but depend on rules they do not determine. For advertisers and marketers, a walled garden may offer targeting and measurement tools while limiting independent visibility or portability of information.\n\nA closed platform can control access to its audience, data and ad inventory. Brands gain distribution but depend on rules they cannot set themselves.","category":"OUTBOUND MARKETING","study":{"simple":"A walled garden keeps audiences, content, advertising opportunities and measurement within one company’s environment. Businesses can reach people inside that platform, but they depend on the platform’s rules and data.","why":"A closed platform can control access to its audience, data and ad inventory. Brands gain distribution but depend on rules they cannot set themselves. App developers can reach users inside that system but depend on rules they do not determine. For advertisers and marketers, a walled garden may offer targeting and measurement tools while limiting independent visibility or portability of information.","example":"Imagine a game studio selling digital items only through one app store, where the platform sets the rules for payments and access. The studio gains distribution but becomes dependent on a controlled ecosystem: a walled garden.","exam":"Walled garden is a closed digital ecosystem where one company controls the content, user data, ad inventory and measurement. A walled garden keeps audiences, content, advertising opportunities and measurement within one company’s environment. Businesses can reach people inside that platform, but they depend on the platform’s rules and data. This illustrates the control major intermediaries have over digital advertising.\n\nApple's App Store illustrates a controlled ecosystem where a platform sets distribution rules, governs transactions and has access to platform-level data. App developers can reach users inside that system but depend on rules they do not determine. For advertisers and marketers, a walled garden may offer targeting and measurement tools while limiting independent visibility or portability of information.\n\nA closed platform can control access to its audience, data and ad inventory. Brands gain distribution but depend on rules they cannot set themselves."},"exampleType":"illustrative"},{"id":104,"term":"SEM (Search Engine Marketing)","lecture":"Lecture 7 · SEM, distinction and decision-making","page":30,"definition":"Paid advertisements that appear in search-engine results, targeting specific keywords to reach people actively searching for related products or services.","explanation":"The course defines SEM in terms of paid ads shown in search results. Advertisers choose keywords connected to what people are actively searching for. The query signals a need, while the advertisement and its landing page should respond to that need.\n\nPaid search reaches people who have already expressed intent through a query. The ad still needs to match their need and a useful landing page.","example":"Illustrative example: A florist pays for a Google Search ad on queries like 'same-day birthday flowers.' The ad reaches people already searching for related flowers, which is the paid-search idea behind SEM.","full":"Search Engine Marketing (SEM) refers here to paid placements in search results, targeted to the queries people enter. The course defines SEM in terms of paid ads shown in search results. Advertisers choose keywords connected to what people are actively searching for. The query signals a need, while the advertisement and its landing page should respond to that need.\n\nA sponsored running-shoe listing appearing in Google when someone searches for shoes is search engine marketing because the advertiser pays to appear against expressed demand. The ad's relevance depends on the query and the landing page that follows. Paid placement should be distinguished from SEO's unpaid rankings. A click indicates interest in the result, but the campaign still needs evidence of valuable customer action.\n\nPaid search reaches people who have already expressed intent through a query. The ad still needs to match their need and a useful landing page.","category":"SEM","study":{"simple":"The course defines SEM in terms of paid ads shown in search results. Advertisers choose keywords connected to what people are actively searching for.","why":"Paid search reaches people who have already expressed intent through a query. The ad still needs to match their need and a useful landing page. The ad's relevance depends on the query and the landing page that follows. Paid placement should be distinguished from SEO's unpaid rankings.","example":"A florist pays for a Google Search ad on queries like 'same-day birthday flowers.' The ad reaches people already searching for related flowers, which is the paid-search idea behind SEM.","exam":"Search Engine Marketing (SEM) refers here to paid placements in search results, targeted to the queries people enter. The course defines SEM in terms of paid ads shown in search results. Advertisers choose keywords connected to what people are actively searching for. The query signals a need, while the advertisement and its landing page should respond to that need.\n\nA sponsored running-shoe listing appearing in Google when someone searches for shoes is search engine marketing because the advertiser pays to appear against expressed demand. The ad's relevance depends on the query and the landing page that follows. Paid placement should be distinguished from SEO's unpaid rankings. A click indicates interest in the result, but the campaign still needs evidence of valuable customer action.\n\nPaid search reaches people who have already expressed intent through a query. The ad still needs to match their need and a useful landing page."},"exampleType":"illustrative"},{"id":105,"term":"Distinctiveness","lecture":"Lecture 7 · SEM, distinction and decision-making","page":30,"definition":"Being easy to notice and recognise as your brand through consistent distinctive assets such as colours, shapes, taglines, characters, sonic cues and pack shapes.","explanation":"A distinctive brand is easy to notice and recognise because it repeatedly uses recognisable cues. The course names colours, shapes, characters, taglines, sounds and packaging as possible assets. Distinctiveness helps someone connect a message to the correct brand.\n\nRecognisable cues help people identify a brand before reading its name. Without distinctiveness, money spent on attention may benefit a competitor instead.","example":"Illustrative example: Even without its name written out, McDonald's golden arches are easy for many people to recognise. A consistent visual cue makes the brand distinctive in a crowded street or feed.","full":"Brand distinctiveness is the ease with which an audience notices and identifies a brand using consistent, recognizable cues. The course names colours, shapes, characters, taglines, sounds and packaging as possible assets. Distinctiveness helps someone connect a message to the correct brand.\n\nNike's swoosh is recognizable even when the company name is absent, allowing an audience to link many different products and messages to one brand. That is distinctiveness: being easy to identify, not necessarily offering a unique product benefit. Consistent brand assets help new advertising connect with memories of earlier encounters. Recognition is valuable because otherwise media attention may fail to attach to the intended brand.\n\nRecognisable cues help people identify a brand before reading its name. Without distinctiveness, money spent on attention may benefit a competitor instead.","category":"DISTINCTION AND CREATIVITY","study":{"simple":"A distinctive brand is easy to notice and recognise because it repeatedly uses recognisable cues. The course names colours, shapes, characters, taglines, sounds and packaging as possible assets.","why":"Recognisable cues help people identify a brand before reading its name. Without distinctiveness, money spent on attention may benefit a competitor instead. That is distinctiveness: being easy to identify, not necessarily offering a unique product benefit. Consistent brand assets help new advertising connect with memories of earlier encounters.","example":"Even without its name written out, McDonald's golden arches are easy for many people to recognise. A consistent visual cue makes the brand distinctive in a crowded street or feed.","exam":"Brand distinctiveness is the ease with which an audience notices and identifies a brand using consistent, recognizable cues. The course names colours, shapes, characters, taglines, sounds and packaging as possible assets. Distinctiveness helps someone connect a message to the correct brand.\n\nNike's swoosh is recognizable even when the company name is absent, allowing an audience to link many different products and messages to one brand. That is distinctiveness: being easy to identify, not necessarily offering a unique product benefit. Consistent brand assets help new advertising connect with memories of earlier encounters. Recognition is valuable because otherwise media attention may fail to attach to the intended brand.\n\nRecognisable cues help people identify a brand before reading its name. Without distinctiveness, money spent on attention may benefit a competitor instead."},"exampleType":"illustrative"},{"id":106,"term":"Distinctive brand asset","lecture":"Lecture 7 · SEM, distinction and decision-making","page":30,"definition":"A recognisable cue linked to a brand, such as a colour, shape, tagline, character, sound, promise or pack shape.","explanation":"This is a particular feature people associate with a brand, such as its familiar colour or sound. Repeated consistent use helps strengthen recognition. An asset is useful when it helps identify the brand, instead of only decorating an advertisement.\n\nA consistent asset links many encounters to the same brand in memory. An isolated attractive graphic does not necessarily create recognition.","example":"Illustrative example: Netflix's short 'ta-dum' sound is a memorable brand cue. Someone may recognise which service a clip belongs to before seeing the word Netflix: that's a distinctive brand asset.","full":"Distinctive brand asset is a recognisable cue linked to a brand, such as a colour, shape, tagline, character, sound, promise or pack shape. This is a particular feature people associate with a brand, such as its familiar colour or sound. Repeated consistent use helps strengthen recognition. An asset is useful when it helps identify the brand, instead of only decorating an advertisement.\n\nThe shape of a Coca-Cola bottle or the Nike swoosh can function as a distinctive brand asset because people repeatedly associate the cue with one organization. Used consistently, such assets support quick identification across packaging, digital ads and stores. A random attractive colour is not automatically distinctive until the audience learns its association. Building recognition requires repetition and coherence over time.\n\nA consistent asset links many encounters to the same brand in memory. An isolated attractive graphic does not necessarily create recognition.","category":"DISTINCTION AND CREATIVITY","study":{"simple":"This is a particular feature people associate with a brand, such as its familiar colour or sound. Repeated consistent use helps strengthen recognition.","why":"A consistent asset links many encounters to the same brand in memory. An isolated attractive graphic does not necessarily create recognition. Used consistently, such assets support quick identification across packaging, digital ads and stores. A random attractive colour is not automatically distinctive until the audience learns its association.","example":"Netflix's short 'ta-dum' sound is a memorable brand cue. Someone may recognise which service a clip belongs to before seeing the word Netflix: that's a distinctive brand asset.","exam":"Distinctive brand asset is a recognisable cue linked to a brand, such as a colour, shape, tagline, character, sound, promise or pack shape. This is a particular feature people associate with a brand, such as its familiar colour or sound. Repeated consistent use helps strengthen recognition. An asset is useful when it helps identify the brand, instead of only decorating an advertisement.\n\nThe shape of a Coca-Cola bottle or the Nike swoosh can function as a distinctive brand asset because people repeatedly associate the cue with one organization. Used consistently, such assets support quick identification across packaging, digital ads and stores. A random attractive colour is not automatically distinctive until the audience learns its association. Building recognition requires repetition and coherence over time.\n\nA consistent asset links many encounters to the same brand in memory. An isolated attractive graphic does not necessarily create recognition."},"exampleType":"illustrative"},{"id":107,"term":"Brand image","lecture":"Lecture 7 · SEM, distinction and decision-making","page":30,"definition":"How a brand is being perceived.","explanation":"Brand image concerns the perceptions people actually hold about an organisation. It may not match what the organisation intends to communicate. Understanding the distinction matters because the audience, not the company, determines how the brand is perceived.\n\nActual customer perceptions can differ from the picture a company wants to project. Research is needed to learn what the brand really means to people.","example":"Illustrative example: Imagine asking ten people what LEGO makes them think of. If many answer 'creativity and play,' that perception is LEGO's brand image in their minds—whether or not the company intended exactly that reaction.","full":"Brand image is the set of perceptions that consumers actually hold about a brand, regardless of the company’s intentions. It may not match what the organisation intends to communicate. Understanding the distinction matters because the audience, not the company, determines how the brand is perceived.\n\nBrand image describes how customers actually perceive a company. If a shop intends to seem affordable but shoppers regard it as expensive, the public image differs from management's intentions. Reviews, prior experiences and word of mouth can shape this perception beyond direct advertising. Image should therefore be investigated through audience evidence instead of inferred from the brand's chosen visual identity.\n\nActual customer perceptions can differ from the picture a company wants to project. Research is needed to learn what the brand really means to people.","category":"DISTINCTION AND CREATIVITY","study":{"simple":"Brand image concerns the perceptions people actually hold about an organisation. It may not match what the organisation intends to communicate.","why":"Actual customer perceptions can differ from the picture a company wants to project. Research is needed to learn what the brand really means to people. If a shop intends to seem affordable but shoppers regard it as expensive, the public image differs from management's intentions Reviews, prior experiences and word of mouth can shape this perception beyond direct advertising.","example":"Imagine asking ten people what LEGO makes them think of. If many answer 'creativity and play,' that perception is LEGO's brand image in their minds—whether or not the company intended exactly that reaction.","exam":"Brand image is the set of perceptions that consumers actually hold about a brand, regardless of the company’s intentions. It may not match what the organisation intends to communicate. Understanding the distinction matters because the audience, not the company, determines how the brand is perceived.\n\nBrand image describes how customers actually perceive a company. If a shop intends to seem affordable but shoppers regard it as expensive, the public image differs from management's intentions. Reviews, prior experiences and word of mouth can shape this perception beyond direct advertising. Image should therefore be investigated through audience evidence instead of inferred from the brand's chosen visual identity.\n\nActual customer perceptions can differ from the picture a company wants to project. Research is needed to learn what the brand really means to people."},"exampleType":"illustrative"},{"id":108,"term":"Brand identity","lecture":"Lecture 7 · SEM, distinction and decision-making","page":31,"definition":"How a brand wants to be perceived.","explanation":"Brand identity is the way a brand deliberately presents itself and wishes to be understood. It may involve its chosen visual and verbal cues. The difference from brand image is intention versus actual audience perception.\n\nA brand's chosen presentation guides consistency across products and communications. Identity cannot guarantee that audiences will perceive it as intended.","example":"Illustrative example: Imagine a children's museum deciding that its logo, messages and staff should all communicate 'curious, playful and welcoming.' That is the identity it wants to project; visitors may or may not perceive it the same way.","full":"Brand identity is how a company deliberately presents its brand and wants audiences to perceive it. It may involve its chosen visual and verbal cues. The difference from brand image is intention versus actual audience perception.\n\nBrand identity is the set of qualities and associations a brand intentionally projects through its communication and design. Nike may seek a recognizable energetic character through consistent imagery and cues, but whether audiences interpret it that way is a question of brand image. The distinction matters because organizations can control planned presentation much more directly than they can control the perceptions people form.\n\nA brand's chosen presentation guides consistency across products and communications. Identity cannot guarantee that audiences will perceive it as intended.","category":"DISTINCTION AND CREATIVITY","study":{"simple":"Brand identity is the way a brand deliberately presents itself and wishes to be understood. It may involve its chosen visual and verbal cues.","why":"A brand's chosen presentation guides consistency across products and communications. Identity cannot guarantee that audiences will perceive it as intended. The distinction matters because organizations can control planned presentation much more directly than they can control the perceptions people form.","example":"Imagine a children's museum deciding that its logo, messages and staff should all communicate 'curious, playful and welcoming.' That is the identity it wants to project; visitors may or may not perceive it the same way.","exam":"Brand identity is how a company deliberately presents its brand and wants audiences to perceive it. It may involve its chosen visual and verbal cues. The difference from brand image is intention versus actual audience perception.\n\nBrand identity is the set of qualities and associations a brand intentionally projects through its communication and design. Nike may seek a recognizable energetic character through consistent imagery and cues, but whether audiences interpret it that way is a question of brand image. The distinction matters because organizations can control planned presentation much more directly than they can control the perceptions people form.\n\nA brand's chosen presentation guides consistency across products and communications. Identity cannot guarantee that audiences will perceive it as intended."},"exampleType":"illustrative"},{"id":109,"term":"CPM (cost per mille)","lecture":"Lecture 7 · SEM, distinction and decision-making","page":31,"definition":"An advertising billing model in which the advertiser pays per 1,000 impressions.","explanation":"Under CPM pricing, the advertiser pays for every 1,000 counted impressions. The cost is connected to display opportunities instead of clicks or purchases. It is therefore important not to confuse the volume of impressions with proof of attention or sales.\n\nCPM prices delivery opportunities, not customer action. A low CPM is not automatically cost-effective if the audience does not notice the ad.","example":"Illustrative example: If a display campaign charges €8 CPM, buying 5,000 ad impressions costs about €40 (five groups of 1,000). CPM prices delivery opportunities, not proven attention or sales.","full":"CPM (cost per mille) is an advertising billing model in which the advertiser pays per 1,000 impressions. Under CPM pricing, the advertiser pays for every 1,000 counted impressions. The cost is connected to display opportunities instead of clicks or purchases. It is therefore important not to confuse the volume of impressions with proof of attention or sales.\n\nA hypothetical Nike display campaign charged €8 CPM would pay €8 for each 1,000 counted impressions under that billing model. The cost measures purchased delivery opportunities, not how many shoes were sold or whether viewers noticed the ad. An inexpensive CPM can still waste budget if placements are irrelevant. Evaluating efficiency requires connecting the buying model to real objectives and trustworthy delivery data.\n\nCPM prices delivery opportunities, not customer action. A low CPM is not automatically cost-effective if the audience does not notice the ad.","category":"CAMPAIGN MEASUREMENT","study":{"simple":"Under CPM pricing, the advertiser pays for every 1,000 counted impressions. The cost is connected to display opportunities instead of clicks or purchases.","why":"CPM prices delivery opportunities, not customer action. A low CPM is not automatically cost-effective if the audience does not notice the ad. The cost measures purchased delivery opportunities, not how many shoes were sold or whether viewers noticed the ad. An inexpensive CPM can still waste budget if placements are irrelevant.","example":"If a display campaign charges €8 CPM, buying 5,000 ad impressions costs about €40 (five groups of 1,000). CPM prices delivery opportunities, not proven attention or sales.","exam":"CPM (cost per mille) is an advertising billing model in which the advertiser pays per 1,000 impressions. Under CPM pricing, the advertiser pays for every 1,000 counted impressions. The cost is connected to display opportunities instead of clicks or purchases. It is therefore important not to confuse the volume of impressions with proof of attention or sales.\n\nA hypothetical Nike display campaign charged €8 CPM would pay €8 for each 1,000 counted impressions under that billing model. The cost measures purchased delivery opportunities, not how many shoes were sold or whether viewers noticed the ad. An inexpensive CPM can still waste budget if placements are irrelevant. Evaluating efficiency requires connecting the buying model to real objectives and trustworthy delivery data.\n\nCPM prices delivery opportunities, not customer action. A low CPM is not automatically cost-effective if the audience does not notice the ad."},"exampleType":"illustrative"},{"id":110,"term":"CPC (cost per click)","lecture":"Lecture 7 · SEM, distinction and decision-making","page":31,"definition":"An advertising billing model in which the advertiser pays for each valid click.","explanation":"Under CPC pricing, cost is linked to valid clicks on an advertisement. This makes a click the billing event, but it does not mean that the visitor buys something. The lecture’s later discussion of advertising measurement warns against treating clicks as proof of business effect.\n\nCPC charges for valid clicks, but visitors may leave without buying. Click cost should be evaluated alongside the quality and outcomes of traffic.","example":"Illustrative example: If a paid search ad costs €0.60 per valid click and receives 100 charged clicks, the advertiser pays €60. That's CPC billing, regardless of whether any of those visitors buy.","full":"Cost per click (CPC) is an advertising pricing model in which the advertiser pays when a valid click occurs. Under CPC pricing, cost is linked to valid clicks on an advertisement. This makes a click the billing event, but it does not mean that the visitor buys something. The lecture’s later discussion of advertising measurement warns against treating clicks as proof of business effect.\n\nSuppose an Adidas search advertisement costs €0.80 per valid click. CPC tells the advertiser how much each visitor interaction costs, not whether the visitor purchases anything. Two ads with the same CPC can produce very different business outcomes if their landing pages attract different levels of buying intent. Cost per click is therefore a purchasing metric that should be interpreted together with conversion and customer value.\n\nCPC charges for valid clicks, but visitors may leave without buying. Click cost should be evaluated alongside the quality and outcomes of traffic.","category":"CAMPAIGN MEASUREMENT","study":{"simple":"Under CPC pricing, cost is linked to valid clicks on an advertisement. This makes a click the billing event, but it does not mean that the visitor buys something.","why":"CPC charges for valid clicks, but visitors may leave without buying. Click cost should be evaluated alongside the quality and outcomes of traffic. CPC tells the advertiser how much each visitor interaction costs, not whether the visitor purchases anything. Two ads with the same CPC can produce very different business outcomes if their landing pages attract different levels of buying intent.","example":"If a paid search ad costs €0.60 per valid click and receives 100 charged clicks, the advertiser pays €60. That's CPC billing, regardless of whether any of those visitors buy.","exam":"Cost per click (CPC) is an advertising pricing model in which the advertiser pays when a valid click occurs. Under CPC pricing, cost is linked to valid clicks on an advertisement. This makes a click the billing event, but it does not mean that the visitor buys something. The lecture’s later discussion of advertising measurement warns against treating clicks as proof of business effect.\n\nSuppose an Adidas search advertisement costs €0.80 per valid click. CPC tells the advertiser how much each visitor interaction costs, not whether the visitor purchases anything. Two ads with the same CPC can produce very different business outcomes if their landing pages attract different levels of buying intent. Cost per click is therefore a purchasing metric that should be interpreted together with conversion and customer value.\n\nCPC charges for valid clicks, but visitors may leave without buying. Click cost should be evaluated alongside the quality and outcomes of traffic."},"exampleType":"illustrative"},{"id":111,"term":"Anchoring effect","lecture":"Lecture 7 · SEM, distinction and decision-making","page":31,"definition":"A cognitive bias where people rely heavily on the first piece of information they encounter when making decisions.","explanation":"The first number or fact encountered can shape how later options are judged. For example, an initial high price can become a reference point against which another price seems low. The important mechanism is reliance on the first piece of information, not a full independent comparison.\n\nThe first price shown can shape whether later offers seem expensive or attractive. This makes presentation order a meaningful design decision.","example":"Illustrative example: A furniture website first displays a sofa priced at €1,800, then a €950 sofa. The second might feel cheaper partly because the first price became a mental reference point: anchoring.","full":"Anchoring effect is a cognitive bias where people rely heavily on the first piece of information they encounter when making decisions. The first number or fact encountered can shape how later options are judged. For example, an initial high price can become a reference point against which another price seems low. The important mechanism is reliance on the first piece of information, not a full independent comparison.\n\nWhen a shopper first sees a €1,500 Samsung phone, a later €1,000 model may feel comparatively affordable because the initial price becomes a reference point. This is the anchoring effect, not evidence that the second phone is objectively cheap. Marketers can affect comparisons through ordering, but responsible use requires that displayed prices and alternatives are genuine instead of fabricated anchors.\n\nThe first price shown can shape whether later offers seem expensive or attractive. This makes presentation order a meaningful design decision.","category":"DECISION-MAKING","study":{"simple":"The first number or fact encountered can shape how later options are judged. For example, an initial high price can become a reference point against which another price seems low.","why":"The first price shown can shape whether later offers seem expensive or attractive. This makes presentation order a meaningful design decision. This is the anchoring effect, not evidence that the second phone is objectively cheap. Marketers can affect comparisons through ordering, but responsible use requires that displayed prices and alternatives are genuine instead of fabricated anchors.","example":"A furniture website first displays a sofa priced at €1,800, then a €950 sofa. The second might feel cheaper partly because the first price became a mental reference point: anchoring.","exam":"Anchoring effect is a cognitive bias where people rely heavily on the first piece of information they encounter when making decisions. The first number or fact encountered can shape how later options are judged. For example, an initial high price can become a reference point against which another price seems low. The important mechanism is reliance on the first piece of information, not a full independent comparison.\n\nWhen a shopper first sees a €1,500 Samsung phone, a later €1,000 model may feel comparatively affordable because the initial price becomes a reference point. This is the anchoring effect, not evidence that the second phone is objectively cheap. Marketers can affect comparisons through ordering, but responsible use requires that displayed prices and alternatives are genuine instead of fabricated anchors.\n\nThe first price shown can shape whether later offers seem expensive or attractive. This makes presentation order a meaningful design decision."},"exampleType":"illustrative"},{"id":112,"term":"Scarcity","lecture":"Lecture 7 · SEM, distinction and decision-making","page":31,"definition":"A principle where limited availability is perceived as more valuable, prompting faster decisions. Scarcity can concern quantity, time, demand or access.","explanation":"People may assign greater value or urgency to something that appears limited. The limit can concern time, quantity, demand or access. This can affect decisions by making delay feel costly.\n\nGenuine limited availability can prompt decisions, but invented scarcity can pressure customers unfairly and erode trust.","example":"Illustrative example: A theatre honestly displays '3 seats remaining' for a performance. The genuine limit can make people decide sooner because the opportunity may disappear. Inventing a false limit would be misleading.","full":"Scarcity is a principle where limited availability is seen as more valuable, prompting faster decisions. Scarcity can concern quantity, time, demand or access. People may assign greater value or urgency to something that appears limited. The limit can concern time, quantity, demand or access. This can affect decisions by making delay feel costly.\n\nImagine a theatre displays 'Only six seats left' for a screening and the number is correct. Customers may decide sooner because waiting risks losing access. Scarcity works by increasing the perceived cost of delay, not by changing the film itself. Inventing a shortage would exploit the same psychological mechanism dishonestly and could undermine trust once customers discover it.\n\nGenuine limited availability can prompt decisions, but invented scarcity can pressure customers unfairly and erode trust.","category":"DECISION-MAKING","study":{"simple":"People may assign greater value or urgency to something that appears limited. The limit can concern time, quantity, demand or access.","why":"Genuine limited availability can prompt decisions, but invented scarcity can pressure customers unfairly and erode trust. Customers may decide sooner because waiting risks losing access. Scarcity works by increasing the perceived cost of delay, not by changing the film itself.","example":"A theatre honestly displays '3 seats remaining' for a performance. The genuine limit can make people decide sooner because the opportunity may disappear. Inventing a false limit would be misleading.","exam":"Scarcity is a principle where limited availability is seen as more valuable, prompting faster decisions. Scarcity can concern quantity, time, demand or access. People may assign greater value or urgency to something that appears limited. The limit can concern time, quantity, demand or access. This can affect decisions by making delay feel costly.\n\nImagine a theatre displays 'Only six seats left' for a screening and the number is correct. Customers may decide sooner because waiting risks losing access. Scarcity works by increasing the perceived cost of delay, not by changing the film itself. Inventing a shortage would exploit the same psychological mechanism dishonestly and could undermine trust once customers discover it.\n\nGenuine limited availability can prompt decisions, but invented scarcity can pressure customers unfairly and erode trust."},"exampleType":"illustrative"},{"id":113,"term":"Loss aversion","lecture":"Lecture 7 · SEM, distinction and decision-making","page":32,"definition":"The principle that people are more motivated to avoid losses than to acquire equivalent gains.","explanation":"A potential loss can have a stronger motivational effect than an equivalent possible gain. A message that emphasises what someone might lose can then feel different from one describing what they could gain. The principle concerns how choices are perceived, not an objective change in value.\n\nPeople often weigh a possible loss heavily. Ethical communication should help them understand real consequences instead of exploit fear.","example":"Real-world example: Duolingo tracks how many days in a row someone completes a lesson, and offers streak freezes to protect a streak. A learner may practise partly because they do not want to lose a streak they have built. The feature is real; that motivation illustrates loss aversion.","full":"Loss aversion is the tendency to weigh a potential loss more heavily than an equivalent gain. A message that emphasises what someone might lose can then feel different from one describing what they could gain. The principle concerns how choices are perceived, not an objective change in value.\n\nA customer may react more strongly to potentially losing an IKEA return option than to gaining an equivalent convenience. Loss aversion helps explain why messages about missed opportunities can feel urgent. But framing a minor issue as a major loss can manipulate customers. Ethical application requires accurate consequences and sufficient information, instead of maximizing anxiety to force a decision.\n\nPeople often weigh a possible loss heavily. Ethical communication should help them understand real consequences instead of exploit fear.","category":"DECISION-MAKING","study":{"simple":"A potential loss can have a stronger motivational effect than an equivalent possible gain. A message that emphasises what someone might lose can then feel different from one describing what they could gain.","why":"People often weigh a possible loss heavily. Ethical communication should help them understand real consequences instead of exploit fear. Loss aversion helps explain why messages about missed opportunities can feel urgent. But framing a minor issue as a major loss can manipulate customers.","example":"Duolingo tracks how many days in a row someone completes a lesson, and offers streak freezes to protect a streak. A learner may practise partly because they do not want to lose a streak they have built. The feature is real; that motivation illustrates loss aversion.","exam":"Loss aversion is the tendency to weigh a potential loss more heavily than an equivalent gain. A message that emphasises what someone might lose can then feel different from one describing what they could gain. The principle concerns how choices are perceived, not an objective change in value.\n\nA customer may react more strongly to potentially losing an IKEA return option than to gaining an equivalent convenience. Loss aversion helps explain why messages about missed opportunities can feel urgent. But framing a minor issue as a major loss can manipulate customers. Ethical application requires accurate consequences and sufficient information, instead of maximizing anxiety to force a decision.\n\nPeople often weigh a possible loss heavily. Ethical communication should help them understand real consequences instead of exploit fear."},"exampleType":"real","exampleSource":"https://www.duolingo.com/help/what-is-a-streak"},{"id":114,"term":"Reciprocity","lecture":"Lecture 7 · SEM, distinction and decision-making","page":32,"definition":"The principle that people feel compelled to return a favour or gesture after receiving something of value.","explanation":"Receiving something useful or generous can create a feeling that one should respond in kind. In marketing, the idea helps explain why offering value may affect later behaviour. The response comes from a perceived social obligation, not simply a direct transaction.\n\nProviding something useful can encourage goodwill and future engagement. It does not mean that recipients will buy or feel obligated to reciprocate.","example":"Illustrative example: A tea shop lets a customer try a small cup of a new blend for free. The customer may feel more willing to return the gesture by buying a packet, although a free sample never guarantees a sale.","full":"Reciprocity is the principle that people feel compelled to return a favour or gesture after receiving something of value. Receiving something useful or generous can create a feeling that one should respond in kind. In marketing, the idea helps explain why offering value may affect later behaviour. The response comes from a perceived social obligation, not simply a direct transaction.\n\nImagine a Lush store offers a helpful sample without demanding an immediate purchase. The customer may feel positively disposed toward the company and more inclined to respond later. Reciprocity describes the social tendency to return value after receiving something. It is a possible motivation, not a contract: a sample does not entitle the brand to a sale, personal information or customer loyalty.\n\nProviding something useful can encourage goodwill and future engagement. It does not mean that recipients will buy or feel obligated to reciprocate.","category":"DECISION-MAKING","study":{"simple":"Receiving something useful or generous can create a feeling that one should respond in kind. In marketing, the idea helps explain why offering value may affect later behaviour.","why":"Providing something useful can encourage goodwill and future engagement. It does not mean that recipients will buy or feel obligated to reciprocate. The customer may feel positively disposed toward the company and more inclined to respond later. Reciprocity describes the social tendency to return value after receiving something.","example":"A tea shop lets a customer try a small cup of a new blend for free. The customer may feel more willing to return the gesture by buying a packet, although a free sample never guarantees a sale.","exam":"Reciprocity is the principle that people feel compelled to return a favour or gesture after receiving something of value. Receiving something useful or generous can create a feeling that one should respond in kind. In marketing, the idea helps explain why offering value may affect later behaviour. The response comes from a perceived social obligation, not simply a direct transaction.\n\nImagine a Lush store offers a helpful sample without demanding an immediate purchase. The customer may feel positively disposed toward the company and more inclined to respond later. Reciprocity describes the social tendency to return value after receiving something. It is a possible motivation, not a contract: a sample does not entitle the brand to a sale, personal information or customer loyalty.\n\nProviding something useful can encourage goodwill and future engagement. It does not mean that recipients will buy or feel obligated to reciprocate."},"exampleType":"illustrative"},{"id":115,"term":"Priming","lecture":"Lecture 7 · SEM, distinction and decision-making","page":32,"definition":"Prior exposure to a cue that changes how a person perceives, interprets or responds to related information.","explanation":"A cue encountered earlier can affect the interpretation of something that appears later. The influence may occur even when the person is not consciously thinking about the first cue. The principle helps explain how context changes perception.\n\nEarlier cues can colour how later information is interpreted. Marketers should think about what a viewer has just seen before presenting an offer.","example":"Illustrative example: A bakery puts the smell of fresh bread near its entrance. That cue may make bread feel more appealing before customers read the menu. This illustrates priming: earlier exposure affects later reactions.","full":"Priming is the influence of an earlier cue or experience on how someone interprets or responds to later information. The influence may occur even when the person is not consciously thinking about the first cue. The principle helps explain how context changes perception.\n\nA Nike running video viewed immediately before a shoe comparison can activate ideas about fitness and performance. Those associations may affect what the shopper notices or values on the next screen. Priming is an effect of prior exposure on later interpretation, even when the cue is subtle. A marketer should not treat it as proof of persuasion; the actual decision depends on other factors too.\n\nEarlier cues can colour how later information is interpreted. Marketers should think about what a viewer has just seen before presenting an offer.","category":"DECISION-MAKING","study":{"simple":"A cue encountered earlier can affect the interpretation of something that appears later. The influence may occur even when the person is not consciously thinking about the first cue.","why":"Earlier cues can colour how later information is interpreted. Marketers should think about what a viewer has just seen before presenting an offer. Those associations may affect what the shopper notices or values on the next screen. Priming is an effect of prior exposure on later interpretation, even when the cue is subtle.","example":"A bakery puts the smell of fresh bread near its entrance. That cue may make bread feel more appealing before customers read the menu. This illustrates priming: earlier exposure affects later reactions.","exam":"Priming is the influence of an earlier cue or experience on how someone interprets or responds to later information. The influence may occur even when the person is not consciously thinking about the first cue. The principle helps explain how context changes perception.\n\nA Nike running video viewed immediately before a shoe comparison can activate ideas about fitness and performance. Those associations may affect what the shopper notices or values on the next screen. Priming is an effect of prior exposure on later interpretation, even when the cue is subtle. A marketer should not treat it as proof of persuasion; the actual decision depends on other factors too.\n\nEarlier cues can colour how later information is interpreted. Marketers should think about what a viewer has just seen before presenting an offer."},"exampleType":"illustrative"},{"id":116,"term":"Framing","lecture":"Lecture 7 · SEM, distinction and decision-making","page":32,"definition":"Presenting information in a way that emphasises certain aspects and influences how people perceive and react to it.","explanation":"The facts can remain the same while the way they are presented changes the audience’s reaction. Highlighting a gain, loss, risk or benefit gives one interpretation greater prominence. Framing is therefore about presentation and perception instead of changing the underlying information.\n\nThe same
