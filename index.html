</style></head><body><div id="app"></div><script>window.TERMS=[{"id":0,"term":"Marketing","lecture":"Lecture 1 · Marketing, technology and change","page":1,"definition":"The activity of creating, communicating and delivering value. Marketing begins with value, and advertising is only one of the many things marketing does.","explanation":"The starting point is the value offered to the customer, not the advertisement used to promote it. Research, segmentation, product development, pricing, distribution, branding, content, service and customer relationships are all marketing activities. A campaign cannot compensate for an offer that does not create value for the people it is meant to serve.\n\nHow to explain it in an exam: Marketing is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as marketing, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: IKEA deciding which wardrobes solve small-apartment storage problems, how to price them, how to display them in stores, and how to help people assemble them. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): IKEA deciding which wardrobes solve small-apartment storage problems, how to price them, how to display them in stores, and how to help people assemble them. Why it fits: This shows marketing in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The activity of creating, communicating and delivering value. Marketing begins with value, and advertising is only one of the many things marketing does.\n\nThe starting point is the value offered to the customer, not the advertisement used to promote it. Research, segmentation, product development, pricing, distribution, branding, content, service and customer relationships are all marketing activities. A campaign cannot compensate for an offer that does not create value for the people it is meant to serve.\n\nHow to explain it in an exam: Marketing is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as marketing, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: IKEA deciding which wardrobes solve small-apartment storage problems, how to price them, how to display them in stores, and how to help people assemble them. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): IKEA deciding which wardrobes solve small-apartment storage problems, how to price them, how to display them in stores, and how to help people assemble them. Why it fits: This shows marketing in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"MARKETING FUNDAMENTALS"},{"id":1,"term":"Advertising","lecture":"Lecture 1 · Marketing, technology and change","page":1,"definition":"Paid communication. It is one marketing activity among many, and it exists both online and offline.","explanation":"Advertising is a specific communication activity within the wider field of marketing. Paying for a social media ad, a search ad or a billboard is advertising; developing the offer, setting its price and serving customers are also marketing, but are not themselves advertising. The defining feature is the paid communication, not whether the channel is digital.\n\nHow to explain it in an exam: Advertising is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as advertising, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: Nike purchasing a sponsored Instagram placement to show running shoes to potential customers. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":" t fits: This shows advertising in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"MARKETING FUNDAMENTALS"},{"id":2,"term":"Digital marketing","lecture":"Lecture 1 · Marketing, technology and change","page":1,"definition":"Marketing carried out in a digital environment. It applies the same fundamentals as all marketing — product, price, place and promotion — but depends on technology.","explanation":"Digital technology changes how each of the four Ps operates: products may become services, prices can be compared or adjusted rapidly, place includes search results and feeds, and promotion can travel through brands, partners and customers. It also depends on the digital environment through which people discover and interact with offers. Digital marketing is broader than paid digital advertising.\n\nHow to explain it in an exam: Digital marketing is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as digital marketing, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: Spotify offering a subscription in its app, testing prices, guiding listeners through playlists, and communicating the subscription’s value across digital channels. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Spotify offering a subscription in its app, testing prices, guiding listeners through playlists, and communicating the subscription’s value across digital channels. Why it fits: This shows digital marketing in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Marketing carried out in a digital environment. It applies the same fundamentals as all marketing — product, price, place and promotion — but depends on technology.\n\nDigital technology changes how each of the four Ps operates: products may become services, prices can be compared or adjusted rapidly, place includes search results and feeds, and promotion can travel through brands, partners and customers. It also depends on the digital environment through which people discover and interact with offers. Digital marketing is broader than paid digital advertising.\n\nHow to explain it in an exam: Digital marketing is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as digital marketing, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: Spotify offering a subscription in its app, testing prices, guiding listeners through playlists, and communicating the subscription’s value across digital channels. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Spotify offering a subscription in its app, testing prices, guiding listeners through playlists, and communicating the subscription’s value across digital channels. Why it fits: This shows digital marketing in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"MARKETING FUNDAMENTALS"},{"id":3,"term":"Digital advertising","lecture":"Lecture 1 · Marketing, technology and change","page":2,"definition":"Paid communication placed in digital channels. It is only one part of digital marketing.","explanation":"The lecture identifies paid search, paid social, display and programmatic advertising, and paid influencer partnerships as examples. These are different ways of paying to place promotional messages in digital environments. SEO, organic social media, digital services and customer experience can be part of digital marketing without being paid advertising.\n\nHow to explain it in an exam: Digital advertising is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as digital advertising, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: A paid YouTube pre-roll for Samsung Galaxy phones appearing before someone watches an unrelated video. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A paid YouTube pre-roll for Samsung Galaxy phones appearing before someone watches an unrelated video. Why it fits: This shows digital advertising in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Paid communication placed in digital channels. It is only one part of digital marketing.\n\nThe lecture identifies paid search, paid social, display and programmatic advertising, and paid influencer partnerships as examples. These are different ways of paying to place promotional messages in digital environments. SEO, organic social media, digital services and customer experience can be part of digital marketing without being paid advertising.\n\nHow to explain it in an exam: Digital advertising is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as digital advertising, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: A paid YouTube pre-roll for Samsung Galaxy phones appearing before someone watches an unrelated video. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A paid YouTube pre-roll for Samsung Galaxy phones appearing before someone watches an unrelated video. Why it fits: This shows digital advertising in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"MARKETING FUNDAMENTALS"},{"id":4,"term":"The four Ps (marketing mix)","lecture":"Lecture 1 · Marketing, technology and change","page":2,"definition":"Product, price, place and promotion — the marketing mix. It still matters in a digital environment, but each P changes: products become services, prices become dynamic, place becomes search and feed.","explanation":"Product asks what is offered: a music album can become a streaming service. Price asks what customers pay and may become dynamic or easy to compare online. Place asks where an offer can be found, including search engines, feeds, apps and stores. Promotion asks how and by whom it is communicated, including brands, paid partners and customers.\n\nHow to explain it in an exam: The four Ps (marketing mix) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as the four ps (marketing mix), and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: Netflix: the streaming catalogue is the product, its subscription is the price, its app is the place, and trailers and promotions communicate its offering. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Netflix: the streaming catalogue is the product, its subscription is the price, its app is the place, and trailers and promotions communicate its offering. Why it fits: This shows the four ps (marketing mix) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Product, price, place and promotion — the marketing mix. It still matters in a digital environment, but each P changes: products become services, prices become dynamic, place becomes search and feed.\n\nProduct asks what is offered: a music album can become a streaming service. Price asks what customers pay and may become dynamic or easy to compare online. Place asks where an offer can be found, including search engines, feeds, apps and stores. Promotion asks how and by whom it is communicated, including brands, paid partners and customers.\n\nHow to explain it in an exam: The four Ps (marketing mix) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as the four ps (marketing mix), and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: Netflix: the streaming catalogue is the product, its subscription is the price, its app is the place, and trailers and promotions communicate its offering. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Netflix: the streaming catalogue is the product, its subscription is the price, its app is the place, and trailers and promotions communicate its offering. Why it fits: This shows the four ps (marketing mix) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"MARKETING FUNDAMENTALS"},{"id":5,"term":"Web 1.0","lecture":"Lecture 1 · Marketing, technology and change","page":2,"definition":"The read-only web: a library you read. Information was published to an audience that could not easily answer back.","explanation":"Website owners mainly published information and visitors mainly read it. The lecture compares this stage to a library: information was available, but audience participation was limited. This matters because later developments changed users from readers into contributors and made their participation part of the digital environment.\n\nHow to explain it in an exam: Web 1.0 is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organizatio e link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as the like button, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: An Instagram post about an Adidas sneaker receiving 15,000 likes; the visible count becomes a public signal of approval, not proof of purchases. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): An Instagram post about an Adidas sneaker receiving 15,000 likes; the visible count becomes a public signal of approval, not proof of purchases. Why it fits: This shows the like button in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A small interface element with enormous consequences: it turned approval into a number, made attention countable, and gave marketers real-time feedback.\n\nA click of approval became a visible metric that platforms and marketers could count. This makes audience reactions immediately measurable, but it also encourages attention and approval to be treated as numbers. The lecture uses it to show how a very small design choice can change behaviour on a large scale.\n\nHow to explain it in an exam: The like button is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as the like button, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: An Instagram post about an Adidas sneaker receiving 15,000 likes; the visible count becomes a public signal of approval, not proof of purchases. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): An Instagram post about an Adidas sneaker receiving 15,000 likes; the visible count becomes a public signal of approval, not proof of purchases. Why it fits: This shows the like button in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"THE DIGITAL ENVIRONMENT"},{"id":10,"term":"Scalable, searchable, replicable","lecture":"Lecture 1 · Marketing, technology and change","page":3,"definition":"Three qualities of networked content — and their consequences. It can reach a global public, it can be found by anyone at any time, and it can be copied and reused out of context.","explanation":"Scalability means a message can spread far beyond its intended audience; searchability means unexpected people may later find it; replicability means it can be copied and reused in another context. Together, these properties make online publishing powerful but difficult to control. They explain why the consequences of sharing something may continue beyond the original publication.\n\nHow to explain it in an exam: Scalable, searchable, replicable is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as scalable, searchable, replicable, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: A TikTok video reviewing a Stanley tumbler spreading globally, appearing in search months later, and being copied into another compilation. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A TikTok video reviewing a Stanley tumbler spreading globally, appearing in search months later, and being copied into another compilation. Why it fits: This shows scalable, searchable, replicable in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Three qualities of networked content — and their consequences. It can reach a global public, it can be found by anyone at any time, and it can be copied and reused out of context.\n\nScalability means a message can spread far beyond its intended audience; searchability means unexpected people may later find it; replicability means it can be copied and reused in another context. Together, these properties make online publishing powerful but difficult to control. They explain why the consequences of sharing something may continue beyond the original publication.\n\nHow to explain it in an exam: Scalable, searchable, replicable is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as scalable, searchable, replicable, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: A TikTok video reviewing a Stanley tumbler spreading globally, appearing in search months later, and being copied into another compilation. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A TikTok video reviewing a Stanley tumbler spreading globally, appearing in search months later, and being copied into another compilation. Why it fits: This shows scalable, searchable, replicable in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"THE DIGITAL ENVIRONMENT"},{"id":11,"term":"GDPR","lecture":"Lecture 1 · Marketing, technology and change","page":4,"definition":"European data protection regulation that made consent, purpose and data minimisation legal obligations. Regulation is society answering back to a technology it had already adopted.","explanation":"The lecture connects privacy regulation to technological change: after organisations gained new ways to collect and use data, society introduced legal limits and responsibilities. Consent, a defined purpose and collecting only necessary data are central requirements in the course description. Digital marketing therefore cannot treat every possible use of personal data as automatically acceptable.\n\nHow to explain it in an exam: GDPR is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as gdpr, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: A hypothetical IKEA newsletter signup asking permission for a defined purpose instead of silently collecting extra personal details. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A hypothetical IKEA newsletter signup asking permission for a defined purpose instead of silently collecting extra personal details. Why it fits: This shows gdpr in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"European data protection regulation that made consent, purpose and data minimisation legal obligations. Regulation is society answering back to a technology it had already adopted.\n\nThe lecture connects privacy regulation to technological change: after organisations gained new ways to collect and use data, society introduced legal limits and responsibilities. Consent, a defined purpose and collecting only necessary data are central requirements in the course description. Digital marketing therefore cannot treat every possible use of personal data as automatically acceptable.\n\nHow to explain it in an exam: GDPR is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as gdpr, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: A hypothetical IKEA newsletter signup asking permission for a defined purpose instead of silently collecting extra personal details. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A hypothetical IKEA newsletter signup asking permission for a defined purpose instead of silently collecting extra personal details. Why it fits: This shows gdpr in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"THE DIGITAL ENVIRONMENT"},{"id":12,"term":"Trade-off (Postman 1)","lecture":"Lecture 1 · Marketing, technology and change","page":4,"definition":"All technological change is a trade-off. For every advantage a technology offers, there is a corresponding disadvantage.","explanation":"A tool can solve one problem while creating another. The important question is not whether the technology is simply good or bad, but what advantage it brings and what cost accompanies that advantage. This helps marketers evaluate a new technology beyond its attractive features.\n\nHow to explain it in an exam: Trade-off (Postman 1) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as trade-off (postman 1), and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: Google Maps helps drivers navigate but location tracking also creates privacy concerns—a benefit and a cost of the same technology. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Google Maps helps drivers navigate but location tracking also creates privacy concerns—a benefit and a cost of the same technology. Why it fits: This shows trade-off (postman 1) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"All technological change is a trade-off. For every advantage a technology offers, there is a corresponding disadvantage.\n\nA tool can solve one problem while creating another. The important question is not whether the technology is simply good or bad, but what advantage it brings and what cost accompanies that advantage. This helps marketers evaluate a new technology beyond its attractive features.\n\nHow to explain it in an exam: Trade-off (Postman 1) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as trade-off (postman 1), and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: Google Maps helps drivers navigate but location tracking also creates privacy concerns—a benefit and a cost of the same technology. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Google Maps helps drivers navigate but location tracking also creates privacy concerns—a benefit and a cost of the same technology. Why it fits: This shows trade-off (postman 1) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ATTENTION AND DISTRIBUTION"},{"id":13,"term":"Uneven distribution (Postman 2)","lecture":"Lecture 1 · Marketing, technology and change","page":4,"definition":"The advantages and disadvantages of a technology are never distributed evenly. Ask who gains reach or control, whose work becomes easier, and whose skills lose market value.","explanation":"A technology may benefit one group while placing costs on another. For example, a new digital channel can increase the reach of some organisations while reducing the value of skills built around older channels. Postman’s question is who gains, who loses and how these effects differ.\n\nHow to explain it in an exam: Uneven distribution (Postman 2) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as uneven distribution (postman 2), and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: Self-checkout at an IKEA store might shorten queues for some customers while shifting work onto shoppers and changing cashier roles. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Self-checkout at an IKEA store might shorten queues for some customers while shifting work onto shoppers and changing cashier roles. Why it fits: This shows uneven distribution (postman 2) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The advantages and disadvantages of a technology are never distributed evenly. Ask who gains reach or control, whose work becomes easier, and whose skills lose market value.\n\nA technology may benefit one group while placing costs on another. For example, a new digital channel can increase the reach of some organisations while reducing the value of skills built around older channels. Postman’s question is who gains, who loses and how these effects differ.\n\nHow to explain it in an exam: Uneven distribution (Postman 2) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as uneven distribution (postman 2), and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: Self-checkout at an IKEA store might shorten queues for some customers while shifting work onto shoppers and changing cashier roles. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Self-checkout at an IKEA store might shorten queues for some customers while shifting work onto shoppers and changing cashier roles. Why it fits: This shows uneven distribution (postman 2) in a specific customer, product or platform context, rather than treating the concept as an abstract label."},{"id":14,"term":"Embedded idea (Postman 3)","lecture":"Lecture 1 · Marketing, technology and change","page":5,"definition":"Every technology contains a powerful idea or bias. Technologies are not neutral tools: their design favours particular behaviours, values and ways of understanding people.","explanation":"A technology shapes behaviour through its design, even if users treat it as a neutral tool. For example, a system that emphasises visible likes makes approval particularly important and easy to compare. Evaluating a technology therefore includes asking which behaviours it encourages and which values it assumes.\n\nHow to explain it in an exam: Embedded idea (Postman 3) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as embedded idea (postman 3), and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: An Instagram heart icon favours quick, countable approval; it is not a neutral choice about how people communicate. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): An Instagram heart icon favours quick, countable approval; it is not a neutral choice about how people communicate. Why it fits: This shows embedded idea (postman 3) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Every technology contains a powerful idea or bias. Technologies are not neutral tools: their design favours particular behaviours, values and ways of understanding people.\n\nA technology shapes behaviour through its design, even if users treat it as a neutral tool. For example, a system that emphasises visible likes makes approval particularly important and easy to compare. Evaluating a technology therefore includes asking which behaviours it encourages and which values it assumes.\n\nHow to explain it in an exam: Embedded idea (Postman 3) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as embedded idea (postman 3), and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: An Instagram heart icon favours quick, countable approval; it is not a neutral choice about how people communicate. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): An Instagram heart icon favours quick, countable approval; it is not a neutral choice about how people communicate. Why it fits: This shows embedded idea (postman 3) in a specific customer, product or platform context, rather than treating the concept as an abstract label."},{"id":15,"term":"Ecological change (Postman 4)","lecture":"Lecture 1 · Marketing, technology and change","page":5,"definition":"Technological change is ecological, not additive. A new channel does not simply get added — it changes all the existing channels around it.","explanation":"Introducing a new technology changes its surrounding environment rather than merely adding another option. The spread of search, social feeds or assistants changes how existing websites and communication channels are used. A marketer must consider the effects on the entire system, not only the new tool.\n\nHow to explain it in an exam: Ecological change (Postman 4) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as ecological change (postman 4), and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: Spotify streaming did not simply add another music shop: it changed how people discover, distribute, and pay for recorded music. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Spotify streaming did not simply add another music shop: it changed how people discover, distribute, and pay for recorded music. Why it fits: This shows ecological change (postman 4) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Technological change is ecological, not additive. A new channel does not simply get added — it changes all the existing channels around it.\n\nIntroducing a new technology changes its surrounding environment rather than merely adding another option. The spread of search, social feeds or assistants changes how existing websites and communication channels are used. A marketer must consider the effects on the entire system, not only the new tool.\n\nHow to explain it in an exam: Ecological change (Postman 4) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as ecological change (postman 4), and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: Spotify streaming did not simply add another music shop: it changed how people discover, distribute, and pay for recorded music. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Spotify streaming did not simply add another music shop: it changed how people discover, distribute, and pay for recorded music. Why it fits: This shows ecological change (postman 4) in a specific customer, product or platform context, rather than treating the concept as an abstract label."},{"id":16,"term":"Mythic technology (Postman 5)","lecture":"Lecture 1 · Marketing, technology and change","page":5,"definition":"Technologies tend to become mythic: they come to feel natural and inevitable, so we stop questioning them. Technology can never be the solution in itself — it is a strategy.","explanation":"When a technology becomes ordinary, people can begin to assume it must exist and cannot be questioned. Postman warns against treating the tool itself as the answer. A technology should instead be judged as a possible strategy for a clearly understood problem.\n\nHow to explain it in an exam: Mythic technology (Postman 5) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as mythic technology (postman 5), and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: A student assuming Google Search rankings are inevitable rather than questioning how the ranking system shapes what information gets noticed. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A student assuming Google Search rankings are inevitable rather than que he ranking system shapes what information gets noticed. Why it fits: This shows mythic technology (postman 5) in a specific customer, product or platform context, rather than treating the concept as an abstract label."},{"id":17,"term":"Web 4.0","lecture":"Lecture 2 · Web 4.0 and the advertising marketplace","page":6,"definition":"The assistant-centric web: from a global library to a global databank, where generative AI and answer engines increasingly stand between people and information.","explanation":"In the lecture, this is a shift from people navigating a library of web pages towards assistants working over a wider databank of information. Generative AI and answer engines can compose responses before a user visits an original source. That changes where people encounter information and what organisations need to consider when making information available.\n\nHow to explain it in an exam: Web 4.0 is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as web 4.0, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: Someone asks an AI assistant which Samsung phone fits their budget and receives a composed comparison rather than a list of separate webpages. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Someone asks an AI assistant which Samsung phone fits their budget and receives a composed comparison rather than a list of separate webpages. Why it fits: This shows web 4.0 in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The assistant-centric web: from a global library to a global databank, where generative AI and answer engines increasingly stand between people and information.\n\nIn the lecture, this is a shift from people navigating a library of web pages towards assistants working over a wider databank of information. Generative AI and answer engines can compose responses before a user visits an original source. That changes where people encounter information and what organisations need to consider when making information available.\n\nHow to explain it in an exam: Web 4.0 is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as web 4.0, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: Someone asks an AI assistant which Samsung phone fits their budget and receives a composed comparison rather than a list of separate webpages. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypo ithout treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): An AI assistant drafts alternative product descriptions for an IKEA lamp; a human must verify that the descriptions match the actual lamp. Why it fits: This shows generative ai in a specific customer, product or platform context, rather than treating the concept as an abstract label."},{"id":20,"term":"Algorithmic feed","lecture":"Lecture 2 · Web 4.0 and the advertising marketplace","page":6,"definition":"A feed that is no longer chronological: what people see is chosen by a model estimating what will keep them scrolling. Marketing moves from buying space to earning a prediction.","explanation":"The order of posts is determined by a model rather than simply by publication time. What a user sees depends on predictions about continued attention and engagement. As a result, distribution depends increasingly on platform decisions that the publisher does not directly control.\n\nHow to explain it in an exam: Algorithmic feed is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as algorithmic feed, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: Two people following Nike on TikTok seeing different shoe-related videos because the feed predicts their individual interests. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Two people following Nike on TikTok seeing different shoe-related videos because the feed predicts their individual interests. Why it fits: This shows algorithmic feed in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A feed that is no longer chronological: what people see is chosen by a model estimating what will keep them scrolling. Marketing moves from buying space to earning a prediction.\n\nThe order of posts is determined by a model rather than simply by publication time. What a user sees depends on predictions about continued attention and engagement. As a result, distribution depends increasingly on platform decisions that the publisher does not directly control.\n\nHow to explain it in an exam: Algorithmic feed is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as algorithmic feed, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: Two people following Nike on TikTok seeing different shoe-related videos because the feed predicts their individual interests. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Two people following Nike on TikTok seeing different shoe-related videos because the feed predicts their individual interests. Why it fits: This shows algorithmic feed in a specific customer, product or platform context, rather than treating the concept as an abstract label."},{"id":21,"term":"Programmatic advertising","lecture":"Lecture 2 · Web 4.0 and the advertising marketplace","page":7,"definition":"Automated, real-time buying and selling of advertising space. It has eroded the gatekeeping role of agencies and made buyers and sellers dependent on data from a handful of major platforms.","explanation":"Software automates the trading of digital ad placements, often extremely quickly. This allows advertising space to be bought and sold on a large scale, but the course also raises concerns about transparency and dependence on platform data. Automation does not guarantee that the resulting exposure is valuable.\n\nHow to explain it in an exam: Programmatic advertising is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as programmatic advertising, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: A hypothetical Nike display campaign using an automated platform to bid for available ad impressions instead of negotiating each website placement manually. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A hypothetical Nike display campaign using an automated platform to bid for available ad impressions instead of negotiating each website placement manually. Why it fits: This shows programmatic advertising in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Automated, real-time buying and selling of advertising space. It has eroded the gatekeeping role of agencies and made buyers and sellers dependent on data from a handful of major platforms.\n\nSoftware automates the trading of digital ad placements, often extremely quickly. This allows advertising space to be bought and sold on a large scale, but the course also raises concerns about transparency and dependence on platform data. Automation does not guarantee that the resulting exposure is valuable.\n\nHow to explain it in an exam: Programmatic advertising is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as programmatic advertising, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: A hypothetical Nike display campaign using an automated platform to bid for available ad impressions instead of negotiating each website placement manually. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A hypothetical Nike display campaign using an automated platform to bid for available ad impressions instead of negotiating each website placement manually. Why it fits: This shows programmatic advertising in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ATTENTION AND DISTRIBUTION"},{"id":22,"term":"Dark pools","lecture":"Lecture 2 · Web 4.0 and the advertising marketplace","page":7,"definition":"Opaque parts of the programmatic marketplace where the advertiser can no longer see how the money is spent or how the advertisement is placed.","explanation":"These refer to opaque or private parts of the advertising marketplace. The central problem is that buyers cannot fully inspect the placement or trading activity behind what they purchase. The lecture connects this lack of transparency to doubts about the real value of digital advertising.\n\nHow to explain it in an exam: Dark pools is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as dark pools, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: A Nike advertiser paying through an opaque advertising exchange without being able to trace which specific publisher received each portion of the spend. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A Nike advertiser paying through an opaque advertising exchange without being able to trace which specific publisher received each portion of the spend. Why it fits: This shows dark pools in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Opaque parts of the programmatic marketplace where the advertiser can no longer see how the money is spent or how the advertisement is placed.\n\nThese refer to opaque or private parts of the advertising marketplace. The central problem is that buyers cannot fully inspect the placement or trading activity behind what they purchase. The lecture connects this lack of transparency to doubts about the real value of digital advertising.\n\nHow to explain it in an exam: Dark pools is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as dark pools, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: A Nike advertiser paying through
