re than one area may apply to the same situation.\n\nHow to explain it in an exam: Ethical fault lines is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as ethical fault lines, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A TikTok creator faces questions about identity, privacy, authorship, credibility, and participation when sharing a video featuring classmates. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A TikTok creator faces questions about identity, privacy, authorship, credibility, and participation when sharing a video featuring classmates. Why it fits: This shows ethical fault lines in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Five areas for analysing ethics online: identity, privacy, ownership and authorship, credibility and participation (James et al., 2009).\n\nThe course uses five areas from James and colleagues: identity, privacy, ownership and authorship, credibility, and participation. They provide a way to examine different problems rather than reducing all online ethics to one question. More than one area may apply to the same situation.\n\nHow to explain it in an exam: Ethical fault lines is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as ethical fault lines, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A TikTok creator faces questions about identity, privacy, authorship, credibility, and participation when sharing a video featuring classmates. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A TikTok creator faces questions about identity, privacy, authorship, credibility, and participation when sharing a video featuring classmates. Why it fits: This shows ethical fault lines in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ETHICS ONLINE"},{"id":132,"term":"Ethical analysis","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":36,"definition":"A method that describes what happened, identifies who is affected, selects relevant ethical areas, explains possible harm, and recommends a justified responsible action.","explanation":"A structured analysis first explains the event and who is affected. It then identifies relevant ethical areas and the possible harms before recommending a justified response. The goal is reasoned responsibility, not simply\n\nHow to explain it in an exam: Ethical analysis is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as ethical analysis, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: Before reposting a customer’s Nike workout photo, a marketer asks who is affected, whether consent exists, and which responsible action fits. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Before reposting a customer’s Nike workout photo, a marketer asks who is affected, whether consent exists, and which responsible action fits. Why it fits: This shows ethical analysis in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A method that describes what happened, identifies who is affected, selects relevant ethical areas, explains possible harm, and recommends a justified responsible action.\n\nA structured analysis first explains the event and who is affected. It then identifies relevant ethical areas and the possible harms before recommending a justified response. The goal is reasoned responsibility, not simply\n\nHow to explain it in an exam: Ethical analysis is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as ethical analysis, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: Before reposting a customer’s Nike workout photo, a marketer asks who is affected, whether consent exists, and which responsible action fits. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Before reposting a customer’s Nike workout photo, a marketer asks who is affected, whether consent exists, and which responsible action fits. Why it fits: This shows ethical analysis in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ETHICS ONLINE"},{"id":133,"term":"Context collapse","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":37,"definition":"When different audiences and contexts converge in one place, so something meant for one group is seen and read by others.","explanation":"An online post can reach audiences who would normally be separate, such as friends, teachers and employers. A message intended for one setting may be interpreted differently in another. The effect is increased risk of misunderstanding because the original social context is missing.\n\nHow to explain it in an exam: Context collapse is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as context collapse, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A student posts a joke to a private Instagram account, but screenshots circulate to teachers and employers who interpret it differently. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A student posts a joke to a private Instagram account, but screenshots circulate to teachers and employers who interpret it differently. Why it fits: This shows context collapse in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"When different audiences and contexts converge in one place, so something meant for one group is seen and read by others.\n\nAn online post can reach audiences who would normally be separate, such as friends, teachers and employers. A message intended for one setting may be interpreted differently in another. The effect is increased risk of misunderstanding because the original social context is missing.\n\nHow to explain it in an exam: Context collapse is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as context collapse, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A student posts a joke to a private Instagram account, but screenshots circulate to teachers and employers who interpret it differently. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A student posts a joke to a private Instagram account, but screenshots circulate to teachers and employers who interpret it differently. Why it fits: This shows context collapse in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ETHICS ONLINE"},{"id":134,"term":"Online disinhibition effect","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":37,"definition":"People say and do things online that they would not ordinarily say and do face to face (Suler, 2004).","explanation":"People may behave differently when communicating online than they would face to face. The lecture cites Suler’s explanation of how online settings can change what individuals feel comfortable saying or doing. The concept is relevant to evaluating responsibility in digital interactions.\n\nHow to explain it in an exam: Online disinhibition effect is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as online disinhibition effect, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: Someone posts a harsh reply under a YouTube video that they would be unlikely to say to the creator face-to-face. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Someone posts a harsh reply under a YouTube video that they would be unlikely to say to the creator face-to-face. Why it fits: This shows online disinhibition effect in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"People say and do things online that they would not ordinarily say and do face to face (Suler, 2004).\n\nPeople may behave differently when communicating online than they would face to face. The lecture cites Suler’s explanation of how online settings can change what individuals feel comfortable saying or doing. The concept is relevant to evaluating responsibility in digital interactions.\n\nHow to explain it in an exam: Online disinhibition effect is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as online disinhibition effect, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: Someone posts a harsh reply under a YouTube video that they would be unlikely to say to the creator face-to-face. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Someone posts a harsh reply under a YouTube video that they would be unlikely to say to the creator face-to-face. Why it fits: This shows online disinhibition effect in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ETHICS ONLINE"},{"id":135,"term":"First-party data","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":37,"definition":"Data a company collects directly from its own audience, such as customers or website visitors.","explanation":"The company collects this data through its own direct relationships with visitors or customers. Examples in the course include information from its audience and website visitors. Its source is different from information aggregated by an outside data broker.\n\nHow to explain it in an exam: First-party data is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as first-party data, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: Spotify can collect account and listening-interaction data directly through its own service, subject to applicable privacy requirements. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Spotify can collect account and listening-interaction data directly through its own service, subject to applicable privacy requirements. Why it fits: This shows first-party data in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Data a company collects directly from its own audience, such as customers or website visitors.\n\nThe company collects this data through its own direct relationships with visitors or customers. Examples in the course include information from its audience and website visitors. Its source is different from information aggregated by an outside data broker.\n\nHow to explain it in an exam: First-party data is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as first-party data, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: Spotify can collect account and listening-interaction data directly through its own service, subject to applicable privacy requirements. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Spotify can collect account and listening-interaction data directly through its own service, subject to applicable privacy requirements. Why it fits: This shows first-party data in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ETHICS ONLINE"},{"id":136,"term":"Third-party data","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":37,"definition":"Data aggregated and sold by providers who did not collect it themselves.","explanation":"The data comes from providers that aggregate and sell information they did not collect directly from the people concerned. The course distinguishes it from first-party data because the organisation buying it is further removed from the original collection relationship. That distinction matters when considering transparency and privacy.\n\nHow to explain it in an exam: Third-party data is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as third-party data, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A marketer hypothetically purchases demographic profiles from an independent data broker that originally received them from other parties. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A marketer hypothetically purchases demographic profiles from an independent data broker that originally received them from other parties. Why it fits: This shows third-party data in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Data aggregated and sold by providers who did not collect it themselves.\n\nThe data comes from providers that aggregate and sell information they did not collect directly from the people concerned. The course distinguishes it from first-party data because the organisation buying it is further removed from the original collection relationship. That distinction matters when considering transparency and privacy.\n\nHow to explain it in an exam: Third-party data is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as third-party data, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A marketer hypothetically purchases demographic profiles from an independent data broker that originally received them from other parties. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A marketer hypothetically purchases demographic profiles from an independent data broker that originally received them from other parties. Why it fits: This shows third-party data in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ETHICS ONLINE"},{"id":137,"term":"Second-party data","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":38,"definition":"Another company's first-party data, shared through a direct partnership.","explanation":"One organisation shares its directly collected first-party data with another through a partnership. From the recipient’s perspective it is second-party data. The term therefore describes the relationship between the original collector and the partner using it.\n\nHow to explain it in an exam: Second-party data is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as second-party data, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A hypothetical Nike–retailer partnership directly shares a defined, permitted dataset collected by the retailer itself. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A hypothetical Nike–retailer partnership directly shares a defined, permitted dataset collected by the retailer itself. Why it fits: This shows second-party data in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Another company's first-party data, shared through a direct partnership.\n\nOne organisation shares its directly collected first-party data with another through a partnership. From the recipient’s perspective it is second-party data. The term therefore describes the relationship between the original collector and the partner using it.\n\nHow to explain it in an exam: Second-party data is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as second-party data, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A hypothetical Nike–retailer partnership directly shares a defined, permitted dataset collected by the retailer itself. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A hypothetical Nike–retailer partnership directly shares a defined, permitted dataset collected by the retailer itself. Why it fits: This shows second-party data in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ETHICS ONLINE"},{"id":138,"term":"Persistence","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":38,"definition":"The quality of online content that allows it to remain accessible, or to survive through copies, long after it was published.","explanation":"Online information may remain available long after its original posting. Copies can preserve material even when the first version is removed. This increases the long-term consequences of publishing and sharing.\n\nHow to explain it in an exam: Persistence is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as persistence, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A screenshot of a deleted TikTok remains in group chats long after the original video disappears. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A screenshot of a deleted TikTok remains in group chats long after the original video disappears. Why it fits: This shows persistence in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The quality of online content that allows it to remain accessible, or to survive through copies, long after it was published.\n\nOnline information may remain available long after its original posting. Copies can preserve material even when the first version is removed. This increases the long-term consequences of publishing and sharing.\n\nHow to explain it in an exam: Persistence is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as persistence, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A screenshot of a deleted TikTok remains in group chats long after the original video disappears. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A screenshot of a deleted TikTok remains in group chats long after the original video disappears. Why it fits: This shows persistence in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ONLINE CONTEXT"},{"id":139,"term":"Searchability (online context)","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":38,"definition":"The quality of online content that allows it to be found by people you did not intend.","explanation":"Online information can be discovered through searches by people outside the intended audience. A post written for a small group may later become easy for strangers to find. The course treats this as one of the qualities that changes the social consequences of communication.\n\nHow to explain it in an exam: Searchability (online context) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as searchability (online context), and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: An old review of an IKEA furniture product can be found months later by someone the original writer never expected to read it. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): An old review of an IKEA furniture product can be found months later by someone the original writer never expected to read it. Why it fits: This shows searchability (online context) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The quality of online cont t that allows it to reach far larger audiences than intended.","explanation":"A message can travel far beyond the small audience its author imagined. Online networks can extend its reach quickly and widely. The consequence is that a private-feeling interaction may have public-scale effects.\n\nHow to explain it in an exam: Scalability (online context) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as scalability (online context), and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A single TikTok review of an Apple phone can spread far beyond the uploader’s initial followers. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A single TikTok review of an Apple phone can spread far beyond the uploader’s initial followers. Why it fits: This shows scalability (online context) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The quality of online content that allows it to reach far larger audiences than intended.\n\nA message can travel far beyond the small audience its author imagined. Online networks can extend its reach quickly and widely. The consequence is that a private-feeling interaction may have public-scale effects.\n\nHow to explain it in an exam: Scalability (online context) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as scalability (online context), and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A single TikTok review of an Apple phone can spread far beyond the uploader’s initial followers. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A single TikTok review of an Apple phone can spread far beyond the uploader’s initial followers. Why it fits: This shows scalability (online context) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ONLINE CONTEXT"},{"id":141,"term":"Replicability (online context)","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":38,"definition":"The quality of online content that allows it to be copied and reused in other contexts.","explanation":"Digital messages can be copied, reproduced and redistributed with little connection to their original setting. The recipient may encounter only a fragment or screenshot. Because copies persist elsewhere, the original author cannot fully control later uses.\n\nHow to explain it in an exam: Replicability (online context) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as replicability (online context), and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: Someone copies a screenshot of a Nike advertisement and uses it in a critical video with an entirely different context. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Someone copies a screenshot of a Nike advertisement and uses it in a critical video with an entirely different context. Why it fits: This shows replicability (online context) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The quality of online content that allows it to be copied and reused in other contexts.\n\nDigital messages can be copied, reproduced and redistributed with little connection to their original setting. The recipient may encounter only a fragment or screenshot. Because copies persist elsewhere, the original author cannot fully control later uses.\n\nHow to explain it in an exam: Replicability (online context) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as replicability (online context), and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: Someone copies a screenshot of a Nike advertisement and uses it in a critical video with an entirely different context. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Someone copies a screenshot of a Nike advertisement and uses it in a critical video with an entirely different context. Why it fits: This shows replicability (online context) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ONLINE CONTEXT"},{"id":142,"term":"Thumbocracy","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":39,"definition":"Serneberg's term for an affirmation-seeking online culture shaped by the thumb and visible approval signals such as likes.","explanation":"The lecturer uses the term for online participation shaped by the thumb and visible signals of approval. Likes and similar interactions can encourage people to seek affirmation through countable reactions. It connects interface design to identity and social behaviour.\n\nHow to explain it in an exam: Thumbocracy is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as thumbocracy, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: An Instagram user deletes an underperforming photo because visible likes become a measure of social approval. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): An Instagram user deletes an underperforming photo because visible likes become a measure of social approval. Why it fits: This shows thumbocracy in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Serneberg's term for an affirmation-seeking online culture shaped by the thumb and visible approval signals such as likes.\n\nThe lecturer uses the term for online participation shaped by the thumb and visible signals of approval. Likes and similar interactions can encourage people to seek affirmation through countable reactions. It connects interface design to identity and social behaviour.\n\nHow to explain it in an exam: Thumbocracy is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as thumbocracy, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: An Instagram user deletes an underperforming photo because visible likes become a measure of social approval. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): An Instagram user deletes an underperforming photo because visible likes become a measure of social approval. Why it fits: This shows thumbocracy in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"IDENTITY"},{"id":143,"term":"Identity (ethical area)","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":39,"definition":"How people present themselves and manage their digital personas online.","explanation":"Identity concerns how individuals construct and present themselves in digital settings. People may manage profiles or personas differently depending on who they expect to see them. Ethical problems can arise when these identities are misrepresented or exposed to unintended audiences.\n\nHow to explain it in an exam: Identity (ethical area) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as identity (ethical area), and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A person curates a LinkedIn profile differently from an informal TikTok account to shape how others see them. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A person curates a LinkedIn profile differently from an informal TikTok account to shape how others see them. Why it fits: This shows identity (ethical area) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"How people present themselves and manage their digital personas online.\n\nIdentity concerns how individuals construct and present themselves in digital settings. People may manage profiles or personas differently depending on who they expect to see them. Ethical problems can arise when these identities are misrepresented or exposed to unintended audiences.\n\nHow to explain it in an exam: Identity (ethical area) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as identity (ethical area), and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A person curates a LinkedIn profile differently from an informal TikTok account to . A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A creator showing a friend’s home in an Instagram story considers whether the friend consented to revealing private details. Why it fits: This shows privacy (ethical area) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ETHICAL FAULT LINES"},{"id":145,"term":"Ownership and authorship","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":39,"definition":"The ethical area concerned with who owns digital content and who receives credit for it.","explanation":"This area asks who owns digital material and who should receive credit for creating it. Content that is easy to copy online still has an author or origin. Ethical participation requires considering permission and attribution rather than assuming access means unrestricted use.\n\nHow to explain it in an exam: Ownership and authorship is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as ownership and authorship, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A YouTube creator uses a photographer’s image in a video without credit; the question is about rights and authorship, not just image quality. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A YouTube creator uses a photographer’s image in a video without credit; the question is about rights and authorship, not just image quality. Why it fits: This shows ownership and authorship in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The ethical area concerned with who owns digital content and who receives credit for it.\n\nThis area asks who owns digital material and who should receive credit for creating it. Content that is easy to copy online still has an author or origin. Ethical participation requires considering permission and attribution rather than assuming access means unrestricted use.\n\nHow to explain it in an exam: Ownership and authorship is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as ownership and authorship, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A YouTube creator uses a photographer’s image in a video without credit; the question is about rights and authorship, not just image quality. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A YouTube creator uses a photographer’s image in a video without credit; the question is about rights and authorship, not just image quality. Why it fits: This shows ownership and authorship in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ETHICAL FAULT LINES"},{"id":146,"term":"Credibility (ethical area)","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":40,"definition":"The ethical area concerned with one's own trustworthiness online and the assessment of other people and sources.","explanation":"Credibility concerns both being trustworthy oneself and judging whether online material from others deserves trust. A post, claim or source can spread widely without being reliable. Ethical online behaviour includes examining what supports information before passing it on.\n\nHow to explain it in an exam: Credibility (ethical area) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as credibility (ethical area), and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: An influencer reviewing a Samsung phone should disclose a paid partnership so viewers can assess credibility. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the  paid partnership so viewers can assess credibility. Why it fits: This shows credibility (ethical area) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ETHICAL FAULT LINES"},{"id":147,"term":"Participation (ethical area)","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":40,"definition":"The ethical area concerned with conduct, social relations and responsibilities in online communities.","explanation":"Participation addresses how people treat one another in online groups and communities. It includes the responsibilities that come with commenting, sharing and interacting. The course connects meaningful participation with considering the effect of one’s conduct on others.\n\nHow to explain it in an exam: Participation (ethical area) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as participation (ethical area), and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: Members of a Discord study server choose whether to welcome newcomers, share sources, and prevent harassment. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Members of a Discord study server choose whether to welcome n n abstract label.","category":"ETHICAL FAULT LINES"},{"id":148,"term":"Explicit data","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":40,"definition":"Information a person knowingly provides, such as profile details and posts.","explanation":"A person directly supplies explicit data when they fill out a profile or post information. The important feature is that the information is knowingly provided. The course contrasts this with implicit data inferred from actions and behaviour.\n\nHow to explain it in an exam: Explicit data is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as explicit data, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A user deliberately types their birthday into a Spotify profile; that is explicitly provided information. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A user deliberately types their birthday into a Spotify profile; that is explicitly provided information. Why it fits: This shows explicit data in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Information a person knowingly provides, such as profile details and posts.\n\nA person directly sup ation about a user. The distinction raises questions about whether people understand what their behaviour reveals.\n\nHow to explain it in an exam: Implicit data is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as implicit data, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A TikTok system infers interest in sneakers from watch time and repeated clicks even if the user never explicitly selected that interest. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A TikTok system infers interest in sneakers from watch time and repeated clicks even if the user never explicitly selected that interest. Why it fits: This shows implicit data in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Information inferred from behaviour, such as clicks, time spent and location.\n\nImplicit data is drawn from patterns of behaviour rather than necessarily being typed into a form. Clicks, time spent and location can be used to infer information about a user. The distinction raises questions about whether people understand what their behaviour reveals.\n\nHow to explain it in an exam: Implicit data is not simply a label to memorize. rtime. Why it fits: This shows iwwiwwiwi in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"I want what I want when I want it.\n\nThe phrase expresses an expectation of immediate access and satisfaction: “I want what I want when I want it.” The lecture uses it to describe a culture of on-demand digital experiences. Users become accustomed to choosing the content or service at a time that suits them.\n\nHow to explain it in an exam: IWWIWWIWI is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as iwwiwwiwi, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A Netflix user expects to stream a show immediately on their own schedule instead of waiting for a broadcaster’s fixed airtime. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A Netflix user expects to stream a show immediately on their own schedule instead of waiting for a broadcaster’s fixed airtime. Why it fits: This shows iwwiwwiwi in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ONLINE BEHAVIOUR"},{"id":153,"term":"Appointment culture","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":41,"definition":"A media culture in which audiences watch at the same scheduled broadcast time.","explanation":"In appointment culture, media consumption follows a set schedule and people must watch at the designated broadcast time. Audiences are organised around the provider’s timetable. The course contrasts this with the greater freedom and participation of engagement culture.\n\nHow to explain it in an exam: Appointment culture is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as appointment culture, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A family plans to watch a new episode on TV at 20:00 when a broadcaster transmits it to everyone at the same scheduled time. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A family plans to watch a new episode on TV at 20:00 when a broadcaster transmits it to everyone at the same scheduled time. Why it fits: This shows appointment culture in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A media culture in which audiences watch at the same scheduled broadcast time.\n\nIn appointment culture, media consumption follows a set schedule and people must watch at the designated broadcast time. Audiences are organised around the provider’s timetable. The course contrasts this with the greater freedom and participation of engagement culture.\n\nHow to explain it in an exam: Appointment culture is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as appointment culture, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A family plans to watch a new episode on TV at 20:00 when a broadcaster transmits it to everyone at the same scheduled time. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A family plans to watch a new episode on TV at 20:00 when a broadcaster transmits it to everyone at the same scheduled time. Why it fits: This shows appointment culture in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"PARTICIPATION"},{"id":154,"term":"Engagement culture","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":41,"definition":"A media culture in which audiences watch, discuss and participate on their own terms.","explanation":"Audiences can watch, discuss, share and participate when and how they choose. This changes the relationship between media publishers and audiences, who are no longer only scheduled viewers. It also connects consumption with participation and social interaction.\n\nHow to explain it in an exam: Engagement culture is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as engagement culture, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: Fans stream a Netflix series when convenient, post reactions on TikTok, and join online discussions instead of only watching at a fixed airtime. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Fans stream a Netflix series when convenient, post reactions on TikTok, and join online discussions instead of only watching at a fixed airtime. Why it fits: This shows engagement culture in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A media culture in which audiences watch, discuss and participate on their own terms.\n\nAudiences can watch, discuss, share and participate when and how they choose. This changes the relationship between media publishers and audiences, who are no longer only scheduled viewers. It also connects consumption with participation and social interaction.\n\nHow to explain it in an e class="moduleGrid">${modules}</div><div class="bottomButtons"><button class="ghost" id="export">Export progress (.json)</button><button class="ghost" id="import">Import progress</button><input id="importFile" type="file" accept="application/json" hidden><button class="ghost danger" id="reset">Reset all progress</button></div>`, 'Know it. By heart.','156 concepts. Eight lectures. One place to master every single one.');$$('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;render()});$$('[data-module]').forEach(b=>b.onclick=()=>{filter=b.dataset.module;view='learn';render()});$('#export').onclick=()=>download('marketing-progress.json',JSON.stringify(state,null,2));$('#import').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{let o=JSON.parse(await e.target.files[0].text());if(!o.cards||typeof o.cards!=='object')throw Error();state=o;save();render()}catch{alert('Not a valid progress file.')}};$('#reset').onclick=()=>{if(confirm('Delete ALL saved progress on this device?')){state={cards:{},session:{correct:0,attempts:0}};save();render()}}}

function offlineTutor(t,q){
 const l=q.toLowerCase(), definition=t.definition||'', explanation=t.explanation||'', example=t.example||'';
 const short=explanation.split(/(?<=[.!?])\s+/).slice(0,3).join(' ');
 const why=explanation.split(/(?<=[.!?])\s+/).slice(1,5).join(' ');
 const names=TERMS.filter(x=>x.id!==t.id && (l.includes(x.term.toLowerCase()) || (x.term.length>4 && l.includes(x.term.toLowerCase().replace(/ \(.*\)/,''))))).slice(0,2);
 if(names.length){const other=names[0];return `COURSE-GUIDED COMPARISON (offline)\n\n${t.term}: ${definition}\n\n${other.term}: ${other.definition}\n\nKey distinction: Compare what each definition is measuring, describing or trying to achieve. For ${t.term}, ${short}\n\nFor a nuanced comparison, connect Live AI with the optional server.`}
 if(/example|brand|company|product|ikea|nike|spotify|netflix|apple|filmstaden|amazon|real.life|concrete/.test(l))return `BRAND / PRODUCT EXAMPLE\n\n${example||'The course material does not provide a specific named-brand example for this entry.'}\n\nWHY IT FITS\n${definition}\n\nThe example is illustrative; where it describes a hypothetical brand scenario it should not be treated as evidence of a real campaign.`;
 if(/exam|essay|answer|write|paragraph|test/.test(l))return `EXAM-STYLE ANSWER FRAMEWORK\n\n1. Define ${t.term}: ${definition}\n\n2. Explain: ${explanation}\n\n3. Add a concrete example: ${example||'Choose a relevant product or service and explain exactly how it illustrates the definition.'}\n\n4. End with why this matters for a marketer, customer or digital platform.\n\nWrite the response in your own words rather than memorizing a script.`;
 if(/simple|simpl|easy|basic|understand|mean|what is|explain/.test(l))return `IN SIMPLE TERMS\n\n${definition}\n\nHere's the idea in more detail: ${short}\n\nExample to remember it: ${example||'Think of how the idea could appear on a familiar website or app.'}`;
 if(/important|matter|why|use|apply|practic|benefit/.test(l))return `WHY ${t.term.toUpperCase()} MATTERS\n\n${why||explanation}\n\nPractical link: ${example||definition}\n\nExam tip: Don't only name the concept. Explain the consequence of using it or misunderstanding it.`;
 return `ABOUT ${t.term.toUpperCase()}\n\nDefinition: ${definition}\n\nFull explanation: ${explanation}\n\n${example?'Concrete example: '+example+'\n\n':''}This is an offline answer assembled from your course material. If your question needs reasoning beyond these notes, connect Live AI using the secure server described in the README.`;
}
async function answerChat(box){
 const input=box.querySelector('[data-chat-input]'),q=input.value.trim();if(!q)return;
 const t=TERMS[Number(box.dataset.chatTerm)], reply=box.querySelector('.askreply');box.setAttribute('aria-busy','true');reply.hidden=false;reply.textContent='Thinking…';

   const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({term:t.term,definition:t.definition,explanation:t.explanation,example:t.example,lecture:t.lecture,question:q}),signal:controller.signal});clearTimeout(timeout);
   if(!r.ok)throw Error('AI service unavailable');const data=await r.json();if(!data.answer)throw Error('No answer');output='LIVE AI ANSWER\n\n'+data.answer;

function lectureClean(s){return String(s||'').replace(/\s+/g,' ').trim();}
function lectureSentences(s,limit){let a=lectureClean(s).match(/[^.!?]+(?:[.!?]+|$)/g)||[];return a.slice(0,limit).join(' ').trim();}
function lectureBuildParts(group){
 const entries=group.ids.map(id=>TERMS[id]);
 const title=group.name;
 let parts=[`Welcome to ${title}, from lecture ${group.lecture}. In this lesson, we will connect ${entries.length} related concepts, look at concrete examples, and finish with a quick recap. Listen for the differences between ideas as well as their definitions.`];
 entries.forEach((t,i)=>{
  let intro=i===0?'Let’s start with':i===entries.length-1?'Finally, let’s consider':'Next, let’s connect this to';
  let extra=lectureSentences(t.full||t.explanation,3);
  let sample=lectureSentences(t.example,2);
  let speech=`${intro} ${t.term}. ${lectureClean(t.definition)} ${extra}`;
  if(sample)speech+=` Here is an example to help you remember it. ${sample}`;
  parts.push(speech);
 });
 parts.push(`Let’s recap ${title}. The key concepts were: ${entries.map(t=>t.term).join('; ')}. Try pausing the audio and explaining how two of these ideas connect without looking at the transcript. When you can teach the ideas to someone else, move on to another topic.`);
 return parts;
}

 shell(`<div class="panel note" style="margin-bottom:22px"><h2 style="margin-top:0">Choose a test, not a question marathon.</h2><p>Every test mixes question types and includes only <b>two essay questions</b>. Original past-paper questions are separated from additional practice. Past A and B share core questions, but have different essay questions. Your drafts are saved automatically.</p></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px">${cards}</div>`, 'Exam practice','Short, independent tests with your results at the end.');
 $$('[data-start-test]').forEach(b=>b.onclick=()=>{selectedTest=TESTS.find(t=>t.id===b.dataset.startTest);testIndex=0;testReveal=false;testChoice=null;testDone=false;pastExam()});
}
function pastExam(){
 if(!selectedTest){testList();return}
 const t=selectedTest, list=t.questions;
 if(testDone){let c=list.filter(q=>q.kind==='mcq'),correct=c.filter(q=>testAnswers[t.id+'|'+testKey(q)]===q.answer).length;
 testScores[t.id]={correct,total:c.length,date:new Date().toISOString()};localStorage.setItem('dm-test-results-v2',JSON.stringify(testScores));
 const review=list.filter(q=>q.kind!=='mcq').map(q=>`<details style="margin:10px 0"><summary style="cursor:pointer"><b>${q.kind==='long'?'Essay':'Short answer'}</b> · ${esc(q.prompt)}</summary><div style="padding:12px 0"><p><b>Your answer</b></p><p style="white-space:pre-wrap">${esc(examDrafts[t.id+'|'+testKey(q)]||'(No answer saved)')}</p><p class="muted">Self-check: did you define the concept, answer every part and include a concrete example? Compare with your glossary and lecture material. Written work is not automatically graded.</p></div></details>`).join('');
 shell(`<article class="bigCard"><span class="tinyLabel">TEST COMPLETE</span><h2>${esc(t.title)}</h2><p><b>${correct} / ${c.length}</b> multiple-choice questions correct.</p><p>${list.length-c.length} written responses need your own review; no automatic written score is claimed.</p><h3>Review your written answers</h3>${review}<div class="pager"><button class="primary" id="allTests">← Choose another test</button><button id="retryTest">Retake this test →</button></div></article>`,'Test results','Review what you know and what needs work.');$('#allTests').onclick=testList;$('#retryTest').onclick=()=>{testIndex=0;testDone=false;pastExam()};return;
 }
 const q=list[testIndex], key=t.id+'|'+testKey(q), saved=testAnswers[key];
 const mcq=q.kind==='mcq';
 const options=mcq?`<div class="options">${q.options.map((a,i)=>`<button data-examopt="${i}" class="option ${saved!==undefined?(a===q.answer?'correct':a===saved?'incorrect':''):''}" ${saved!==undefined?'disabled':''}>${esc(a)}</button>`).join('')}</div>${saved!==undefined?`<p class="resultLine">${saved===q.answer?'✓ Correct!':'Correct answer: '+esc(q.answer)}</p>`:''}`:`<textarea id="examWriting" style="min-height:${q.kind==='long'?'230px':'140px'}" placeholder="Write your answer before checking your notes...">${esc(examDrafts[key]||'')}</textarea><p class="muted">${q.kind==='long'?'Essay: define, explain, apply and provide a concrete example.':'Short answer: be precise and cover each part.'}</p>${testReveal?`<div class="comparison"><h3>Self-review checklist</h3><p>Check every part of the question against the glossary and lecture notes. Is the definition accurate? Have you explained why it matters and used relevant examples? This is guidance, not an official model answer.</p></div>`:''}`;
 let done=testIndex===list.length-1;
 shell(`<div class="studyTools"><button class="miniButton" id="backTests">← All tests</button><div class="pill">${esc(t.title)}</div><div class="spacer"></div><div class="pill">QUESTION ${testIndex+1} / ${list.length}</div></div><div style="height:7px;background:#e6e9ed;border-radius:20px;margin:0 0 20px;overflow:hidden"><div style="height:100%;width:${(testIndex+1)/list.length*100}%;background:#397a75"></div></div><div class="studyLayout"><article class="bigCard"><div class="cardMeta"><span>${esc(q.source||t.type)} · ${mcq?'MULTIPLE CHOICE':q.kind==='long'?'ESSAY':'SHORT ANSWER'}</span><span>QUESTION ${testIndex+1}</span></div><h2 style="font-size:clamp(19px,2vw,27px)">${esc(q.prompt)}</h2>${options}<div class="pager"><button id="examPrev" ${testIndex===0?'disabled':''}>← Previous</button>${!mcq?`<button id="examReveal">${testReveal?'Hide guide':'Self-review guide'}</button>`:''}<button class="primary" id="examNext">${done?'Finish test & see results →':'Next question →'}</button></div></article><aside class="studyAside"><h3>One test at a time</h3><p>This test contains ${list.filter(q=>q.kind==='mcq').length} multiple-choice, ${list.filter(q=>q.kind==='short').length} short-answer and ${list.filter(q=>q.kind==='long').length} essay questions.</p><div class="asideRule"></div><p>Go back whenever you like. Your written responses are automatically saved. Scoring is shown after you finish.</p></aside></div>`,t.title,'Focused exam practice — you can stop between tests.');
 $('#backTests').onclick=testList;
 $('#examPrev').onclick=()=>{testIndex--;testReveal=false;pastExam()};
 $('#examNext').onclick=()=>{if(done){testDone=true}else{testIndex++;testReveal=false}pastExam()};
 $$('[data-examopt]').forEach(b=>b.onclick=()=>{testAnswers[key]=q.options[Number(b.dataset.examopt)];testSave();pastExam()});
 if($('#examWriting'))$('#examWriting').oninput=e=>{examDrafts[key]=e.target.value;testSave()};
 if($('#examReveal'))$('#examReveal').onclick=()=>{testReveal=!testReveal;pastExam()};
}
</script></body></html>
