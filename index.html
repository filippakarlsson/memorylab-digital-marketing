he relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A Filmstaden movie listing links to a showtime page that no longer exists, producing a 404 dead end. Why it fits: This shows 404 error (broken link) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"TECHNICAL SEO"},{"id":77,"term":"Crawlability","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":22,"definition":"Whether the crawler can reach and read your pages. Nothing you write matters if the crawler cannot get to it.","explanation":"Crawlability asks whether a search-engine robot can access and read the relevant pages. Good text is not enough if important content is blocked or unreachable. The course treats crawlability as a foundation for subsequent indexing and ranking.\n\nHow to explain it in an exam: Crawlability is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. For an exam answer, identify which part of a website, search result, or external reputation is involved; explain what a visitor or crawler experiences, and why a fix would matter. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as crawlability, and what changes as a result. Do not assume that changing one SEO element guarantees a ranking: accessibility, relevance, and credibility interact.\n\nConcrete application: Googlebot cannot reach a Nike product listing hidden behind an inaccessible page; the copy cannot be indexed until access improves. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Googlebot cannot reach a Nike product listing hidden behind an inaccessible page; the copy cannot be indexed until access improves. Why it fits: This shows crawlability in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Whether the crawler can reach and read your pages. Nothing you write matters if the crawler cannot get to it.\n\nCrawlability asks whether a search-engine robot can access and read the relevant pages. Good text is not enough if important content is blocked or unreachable. The course treats crawlability as a foundation for subsequent indexing and ranking.\n\nHow to explain it in an exam: Crawlability is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. For an exam answer, identify which part of a website, search result, or external reputation is involved; explain what a visitor or crawler experiences, and why a fix would matter. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as crawlability, and what changes as a result. Do not assume that changing one SEO element guarantees a ranking: accessibility, relevance, and credibility interact.\n\nConcrete application: Googlebot cannot reach a Nike product listing hidden behind an inaccessible page; the copy cannot be indexed until access improves. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Googlebot cannot reach a Nike product listing hidden behind an inaccessible page; the copy cannot be indexed until access improves. Why it fits: This shows crawlability in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"TECHNICAL SEO"},{"id":78,"term":"Site Health score","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":22,"definition":"The overall score a site audit gives your domain, alongside a ranked list of errors and warnings. A site audit turns technical SEO into a to-do list.","explanation":"Site-audit tools combine findings into a general health score while also listing errors and warnings. The score gives an overview, but the actionable value lies in the specific problems identified. Fixes should be prioritised by their significance rather than treating the score as the whole objective.\n\nHow to explain it in an exam: Site Health score is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. For an exam answer, identify which part of a website, search result, or external reputation is involved; explain what a visitor or crawler experiences, and why a fix would matter. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as site health score, and what changes as a result. Do not assume that changing one SEO element guarantees a ranking: accessibility, relevance, and credibility interact.\n\nConcrete application: A site-audit report for a hypothetical IKEA microsite lists missing metadata and broken links along with a broad health score. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A site-audit r th a broad health score. Why it fits: This shows site health score in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"TECHNICAL SEO"},{"id":79,"term":"Markup (structured data)","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":22,"definition":"Code that tells robots about the content on your site, so that it can be understood and displayed correctly in search results.","explanation":"Structured data labels information in a form that machines can interpret more precisely. It helps search systems understand what a page contains and may support particular ways information is displayed. It is different from the visible copy, although it should describe that content accurately.\n\nHow to explain it in an exam: Markup (structured data) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. For an exam answer, identify which part of a website, search result, or external reputation is involved; explain what a visitor or crawler experiences, and why a fix would matter. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as markup (structured data), and what changes as a result. Do not assume that changing one SEO element guarantees a ranking: accessibility, relevance, and credibility interact.\n\nConcrete application: A Filmstaden event page includes structured data describing the event date and location so machines can interpret the information. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A Filmstaden event page includes s e context and combine several intents.","explanation":"A prompt to an answer engine still comes from a person with a job to accomplish. Unlike a short search query, it may include detailed circumstances or several linked needs in the same request. Marketers need to understand the underlying purpose rather than treating prompt words as isolated keywords.\n\nHow to explain it in an exam: Prompt intent is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Connect the idea to the exact question a searcher or assistant user wants answered and how a clear, consistent page would satisfy that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as prompt intent, and what changes as a result. Popularity, visibility, and being cited are not interchangeable with relevance, accuracy, or the achievement of a business objective.\n\nConcrete application: An assistant prompt asks “Compare Nike and Adidas shoes for a beginner runner under €100,” combining a budget, comparison, and purchase context. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): An assistant prompt asks “Compare Nike and Adidas shoes for a beginner runner under €100,” combining a budget, comparison, and purchase context. Why it fits: This shows prompt intent in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The job behind a prompt to an answer engine. The same informational, navigational, commercial and transactional intents transfer from search, but prompts can express more context o be quoted and cited in generated answers. GEO extends SEO; it does not replace it.","explanation":"GEO aims to help answer engines understand, summarise and cite information reliably. Clear answers, consistent facts and organised content make a source easier to use in generated responses. The course explicitly says GEO extends SEO rather than replacing the work required for normal search visibility.\n\nHow to explain it in an exam: GEO (Generative Engine Optimisation) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Connect the idea to the exact question a searcher or assistant user wants answered and how a clear, consistent page would satisfy that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as geo (generative engine optimisation), and what changes as a result. Popularity, visibility, and being cited are not interchangeable with relevance, accuracy, or the achievement of a business objective.\n\nConcrete application: An IKEA FAQ starts with a clear answer about how to measure a shelving unit so an AI answer engine can interpret and potentially cite it. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): An IKEA FAQ starts with a clear answer about how to measure a shelving unit so an AI answer engine can interpret and potentially cite it. Why it fits: This shows geo (generative engine optimisation) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The work of making content clear, consistent and structured enough to be quoted and cited in generated answers. GEO extends SEO; it does not replace it.\n\nGEO aims to help answer engines understand, summarise and cite information reliably. Clear answers, consistent facts and organised content make a source easier to use in generated responses. The course explicitly says GEO extends SEO rather than replacing the work required for normal search visibility.\n\nHow to explain it in an exam: GEO (Generative Engine Optimisation) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Connect the idea to the exact question a searcher or assistant user wants answered and how a clear, consistent page would satisfy that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as geo (generative engine optimisation), and what changes as a result. Popularity, visibility, and being cited are not interchangeable with relevance, accuracy, or the achievement of a business objective.\n\nConcrete application: An IKEA FAQ starts with a clear answer about how to measure a shelving unit so an AI answer engine can interpret and potentially cite it. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): An IKEA FAQ starts with a clear answer about how to measure a shelving unit so an AI answer engine can interpret and potentially cite it. Why it fits: This shows geo (generative engine optimisation) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"GEO"},{"id":84,"term":"Answer block","lecture":"Lecture 5 · GEO and keyword analysis","page":24,"definition":"A concise two-sentence answer near the top of a page that resolves its main job before presenting the detail.","explanation":"An answer block resolves the main question near the beginning of a page, usually in about two sentences. Supporting details can then follow below. The structure helps people and answer engines identify the central answer without having to extract it from a long introduction.\n\nHow to explain it in an exam: Answer block is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Connect the idea to the exact question a searcher or assistant user wants answered and how a clear, consistent page would satisfy that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as answer block, and what changes as a result. Popularity, visibility, and being cited are not interchangeable with relevance, accuracy, or the achievement of a business objective.\n\nConcrete application: An IKEA delivery page first answers “How long does delivery take?” in two clear sentences before explaining conditions and exceptions. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): An IKEA delivery page first answers “How long does delivery take?” in two clear sentences before explaining conditions and exceptions. Why it fits: This shows answer block in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A concise two-sentence answer near the top of a page that resolves its main job before presenting the detail.\n\nAn answer block resolves the main question near the beginning of a page, usually in about two sentences. Supporting details can then follow below. The structure helps people and answer engines identify the central answer without having to extract it from a long introduction.\n\nHow to explain it in an exam: Answer block is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Connect the idea to the exact question a searcher or assistant user wants answered and how a clear, consistent page would satisfy that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as answer block, and what changes as a result. Popularity, visibility, and being cited are not interchangeable with relevance, accuracy, or the achievement of a business objective.\n\nConcrete application: An IKEA delivery page first answers “How long does delivery take?” in two clear sentences before explaining conditions and exceptions. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): An IKEA delivery page first answers “How long does delivery take?” in two clear sentences before explaining conditions and exceptions. Why it fits: This shows answer block in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"GEO"},{"id":85,"term":"Canonical tag","lecture":"Lecture 5 · GEO and keyword analysis","page":24,"definition":"An HTML signal used to identify the preferred URL when the same or very similar content exists on multiple URLs. It helps search engines understand which version should be treated as the main one.","explanation":"When multiple URLs display the same or very similar information, the canonical signal identifies the preferred version. This helps search systems distinguish the main page from duplicates. The chosen URL should provide a consistent reference for that content.\n\nHow to explain it in an exam: Canonical tag is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Connect the idea to the exact question a searcher or assistant user wants answered and how a clear, consistent page would satisfy that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as canonical tag, and what changes as a result. Popularity, visibility, and being cited are not interchangeable with relevance, accuracy, or the achievement of a business objective.\n\nConcrete application: If a Samsung support guide is available under two near-identical URLs, a canonical tag points to the preferred version. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): If a Samsung support guide is available under two near-identical URLs, a canonical tag points to the preferred version. Why it fits: This shows canonical tag in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"An HTML signal used to identify the preferred URL when the same or very similar content exists on multiple URLs. It helps search engines understand which version should be treated as the main one.\n\nWhen multiple URLs display the same or very similar information, the canonical signal identifies the preferred versi e across pages and answers. The course also links that consistency to a clear canonical page.\n\nHow to explain it in an exam: Entity is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Connect the idea to the exact question a searcher or assistant user wants answered and how a clear, consistent page would satisfy that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as entity, and what changes as a result. Popularity, visibility, and being cited are not interchangeable with relevance, accuracy, or the achievement of a business objective.\n\nConcrete application: A search engine should recognize “IKEA” as the same organization across its store pages, delivery information, and support pages. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A search engine should recognize “IKEA” as the same organization across its store pages, delivery information, and support pages. Why it fits: This shows entity in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A clearly identified thing — such as an organisation, programme, service or location — with one consistent name, set of facts and canonical page.\n\nAn entity is a specific identifiable thing rather than a vague keyword, such as a programme or organisation. Using one consistent name and set of facts makes it easier to recognise across pages and answers. The course also links that consistency to a clear canonical page.\n\nHow to explain it in an exam: Entity is not simply a label to memo  are not interchangeable with relevance, accuracy, or the achievement of a business objective.\n\nConcrete application: “Best running shoes for beginners” may have many estimated monthly searches, but that number alone cannot show conversion value. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): “Best running shoes for beginners” may have many estimated monthly searches, but that number alone cannot show conversion value. Why it fits: This shows search volume in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The estimated number of searches for a query in a defined place and time period. It shows frequency, not the value or relevance of the query.\n\nVolume estimates how often a query is searched within a particular location and time. A large number indicates frequency, not whether the visitors are relevant or likely to act. It therefore needs to be interpreted together with intent and the page’s purpose.\n\nHow to explain it in an exam: Search volume is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Connect the idea to the exact question a searcher or assistant user wants answered and how a clear, consistent page would satisfy that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as search volume, and what changes as a result. Popularity, visibility, and being cited are not interchangeable with relevance, accuracy, or the achievement of a business objective.\n\nConcrete application: “Best running shoes for beginners” may have many estimated monthly searches, but that number alone cannot show conversion value. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): “Best running shoes for beginners” may have many estimated monthly searches, but that number alone cannot show conversion value. Why it fits: This shows search volume in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"KEYWORD ANALYSIS"},{"id":90,"term":"Keyword difficulty","lecture":"Lecture 5 · GEO and keyword analysis","page":26,"definition":"An estimate of how difficult it may be to rank organically for a keyword, based on the strength and competition of the existing results.","explanation":"Difficulty estimates the competition facing a page that wants to rank for a query. It helps compare opportunities but is not the same as customer value or intent. A highly relevant lower-volume query may be more useful than a popular one that is hard to rank for.\n\nHow to explain it in an exam: Keyword difficulty is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Connect the idea to the exact question a searcher or assistant user wants answered and how a clear, consistent page would satisfy that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as keyword difficulty, and what changes as a result. Popularity, visibility, and being cited are not interchangeable with relevance, accuracy, or the achievement of a business objective.\n\nConcrete application: A Nike guide may face high competition for “running shoes” but find a more attainable, relevant phrase for an introductory page. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A Nike guide may face high competition for “running shoes” but find a more attainable, relevant phrase for an introductory page. Why it fits: This shows keyword difficulty in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"An estimate of how difficult it may be to rank organically for a keyword, based on the strength and competition of the existing results.\n\nDifficulty estimates the competition facing a page that wants to rank for a query. It helps compare opportunities but is not the same as customer value or intent. A highly relevant lower-volume query may be more useful than a popular one that is hard to rank for.\n\nHow to explain it in an exam: Keyword difficulty is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Connect the idea to the exact question a searcher or assistant user wants answered and how a clear, consistent page would satisfy that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as keyword difficulty, and what changes as a result. Popularity, visibility, and being cited are not interchangeable with relevance, accuracy, or the achievement of a business objective.\n\nConcrete application: A Nike guide may face high competition for “running shoes” but find a more attainable, relevant phrase for an introductory page. In this illustration, identify the specific observable action or design de rand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): “Beginner running shoes” and “shoes for new runners” could share one helpful Nike guide if they express the same intent. Why it fits: This shows keyword cluster in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A group of related queries that share a topic and intent and can usually be answered by the same canonical page.\n\nA cluster combines related search phrases that share a subject and similar intent. One useful canonical page can often answer several such phrases. This avoids creating a separate near-duplicate page for every small variation.\n\nHow to explain it in an exam: Keyword cluster is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Connect the idea to the exact question a searcher or assistant user wants answered and how a clear, consistent page would satisfy that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as keyword cluster, and what changes as a result. Popularity, visibility, and being cited are not interchangeable with relevance, accuracy, or the achievement of a business objective.\n\nConcrete application: “Beginner running shoes” and “shoes for new runners” could share one helpful Nike guide if they express the same intent. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): “Beginner running shoes” and “shoes for new runners” could share one helpful Nike guide if they express the same intent. Why it fits: This shows keyword cluster in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"KEYWORD ANALYSIS"},{"id":92,"term":"Primary keyword","lecture":"Lecture 5 · GEO and keyword analysis","page":26,"definition":"The main query a page is designed to answer. Related phrases support it; a different intent normally requires a different page.","explanation":"The primary keyword expresses the main search need that a particular page should answer. Supporting phrases can add context without replacing that main purpose. A substantially different search intent normally calls for a different page.\n\nHow to explain it in an exam: Primary keyword is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Connect the idea to the exact question a searcher or assistant user wants answered and how a clear, consistent page would satisfy that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as primary keyword, and what changes as a result. Popularity, visibility, and being cited are not interchangeable with relevance, accuracy, or the achievement of a business objective.\n\nConcrete application: A Nike landing page targets “trail running shoes” as its main phrase while using supporting language about grip and terrain. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A Nike landing page targets “trail running shoes” as its main phrase while using supporting language about term":"Cognitive Load Theory","lecture":"Lecture 6 · Cognitive load theory and outbound marketing","page":27,"definition":"A theory about how people process new information while thinking and learning, centred on the limited capacity of working memory.","explanation":"The theory explains why presenting too much unfamiliar information at once can overwhelm a person. Working memory has limited capacity, while organised knowledge in long-term memory can make processing easier. In communication design, clarity matters because presentation choices can create or reduce unnecessary mental effort.\n\nHow to explain it in an exam: Cognitive Load Theory is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Describe what information the customer is trying to process, which mental effort is necessary, and which effort is added by the way content is presented. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as cognitive load theory, and what changes as a result. Simplifying presentation is not the same as deleting essential details; a useful design removes avoidable work while keeping the task understandable.\n\nConcrete application: A hypothetical Filmstaden ticket page with five competing pop-ups and long instructions overwhelms the visitor's limited working memory. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A hypothetical Filmstaden ticket page with five competing pop-ups and long instructions overwhelms the visitor's limited working memory. Why it fits: This shows cognitive load theory in a specific cus an treating the concept as an abstract label.","category":"COGNITIVE LOAD THEORY"},{"id":94,"term":"Working memory","lecture":"Lecture 6 · Cognitive load theory and outbound marketing","page":27,"definition":"The memory system where we consciously process information. It can handle only a limited amount of unfamiliar information at one time.","explanation":"Working memory is used while a person is actively reading, comparing or understanding new information. Because its capacity is limited, too many unfamiliar elements can make a message difficult to follow. The course uses this to explain why marketing communication should avoid unnecessary complexity.\n\nHow to explain it in an exam: Working memory is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Describe what information the customer is trying to process, which mental effort is necessary, and which effort is added by the way content is presented. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as working memory, and what changes as a result. Simplifying presentation is not the same as deleting essential details; a useful design removes avoidable work while keeping the task understandable.\n\nConcrete application: Someone mentally comparing four IKEA wardrobe measurements while remembering their room dimensions uses working memory. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Someone mentally comparing four IKEA wardrobe measurements while remembering their room dimensions uses working memory. Why it fits: This shows working memory in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The memory system where we consciously process information. It can handle only a limited amount of unfamiliar information at one time.\n\nWorking memory is used while a person is actively reading, comparing or understanding new information. Because its capacity is limited, too many unfamiliar elements can make a message difficult to follow. The course uses this to explain why marketing communication should avoid unnecessary complexity.\n\nHow to explain it in an exam: Working memory is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Describe what information the customer is trying to process, which mental effort is necessary, and which effort is added by the way content is presented. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as working memory, and what changes as a result. Simplifying presentation is not the same as deleting essential details; a useful design removes avoidable work while keeping the task understandable.\n\nConcrete application: Someone mentally comparing four IKEA wardrobe measurements while remembering their room dimensions uses working memory. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Someone mentally comparing four IKEA wardrobe measurements while remembering their room dimensions uses working memory. Why it fits: This shows working memory in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"MEMORY SYSTEMS"},{"id":95,"term":"Long-term memory","lecture":"Lecture 6 · Cognitive load theory and outbound marketing","page":27,"definition":"The memory system that stores organised knowledge for later use. It is not limited in the same way as working memory.","explanation":"Long-term memory holds knowledge that has already been learned and organised. A familiar idea can be processed more easily because the person can draw on existing knowledge. This helps explain why recognition and prior experience affect how demanding new information feels.\n\nHow to explain it in an exam: Long-term memory is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Describe what information the customer is trying to process, which mental effort is necessary, and which effort is added by the way content is presented. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as long-term memory, and what changes as a result. Simplifying presentation is not the same as deleting essential details; a useful design removes avoidable work while keeping the task understandable.\n\nConcrete application: An experienced IKEA kitchen planner can recall familiar cabinet-sizing principles without rebuilding them from scratch each time. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): An experienced IKEA kitchen planner can recall familiar cabinet-sizing principles without rebuilding them from scratch each time. Why it fits: This shows long-term memory in a specific customer, product or platform context, rather than treating the concept as an abstr ":27,"definition":"An organised structure that connects several pieces of knowledge, making information easier to process and retrieve.","explanation":"A schema organises related knowledge into a meaningful structure. Instead of having to process each detail separately, a person can use that structure to understand a larger idea. Building and using schemas therefore helps reduce the effort required by unfamiliar material.\n\nHow to explain it in an exam: Schema is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Describe what information the customer is trying to process, which mental effort is necessary, and which effort is added by the way content is presented. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as schema, and what changes as a result. Simplifying presentation is not the same as deleting essential details; a useful design removes avoidable work while keeping the task understandable.\n\nConcrete application: A student groups CTR, CPC, and CPM under an organized “ad measurement” mental schema rather than memorizing isolated letters. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A student groups CTR, CPC, and CPM under an organized “ad measurement” mental schema rather than memorizing isolated letters. Why it fits: This shows schema in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"An organised structure that connects several pieces of knowledge, making information easier to process and retrieve.\n\nA schema organises y. Some load comes from the task itself, while some is added unnecessarily by poor presentation. Designers can often improve understanding by reducing the avoidable part.\n\nHow to explain it in an exam: Cognitive load is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Describe what information the customer is trying to process, which mental effort is necessary, and which effort is added by the way content is presented. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as cognitive load, and what changes as a result. Simplifying presentation is not the same as deleting essential details; a useful design removes avoidable work while keeping the task understandable.\n\nConcrete application: A Samsung product comparison demands more mental effort when ten unfamiliar specifications appear at once. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A Samsung product comparison demands more mental effort when ten unfamiliar specifications appear at once. Why it fits: This shows cognitive load in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The demands placed on working memory while a person processes information.\n\nCognitive load is the amount of mental effort a task demands from working memory. Some load comes from the task itself, while some is added unnecessarily by poor presentation. Designers can often improve understanding by reducing the avoidable part.\n\nHow to explain it in an exam: Cognitive load is not simply a label to memori t simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Describe what information the customer is trying to process, which mental effort is necessary, and which effort is added by the way content is presented. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as extraneous cognitive load, and what changes as a result. Simplifying presentation is not the same as deleting essential details; a useful design removes avoidable work while keeping the task understandable.\n\nConcrete application: A Filmstaden checkout adds moving banners and unrelated promotional messages, creating avoidable mental work. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A Filmstaden checkout adds moving banners and unrelated promotional messages, creating avoidable mental work. Why it fits: This shows extraneous cognitive load in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Unnecessary processing created by how information is presented or by the design of a task.\n\nThis is effort caused by the way information is delivered rather than by the important meaning of the information. Examples in the course include splitting related information across locations, repeating the same message without benefit and making information disappear too quickly. Better design reduces this unnecessary burden.\n\nHow to explain it in an exam: Extraneous cognitive load is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. ply a label to memorize. Start with the definition and then describe the process or relationship it captures. Describe what information the customer is trying to process, which mental effort is necessary, and which effort is added by the way content is presented. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as split-attention effect, and what changes as a result. Simplifying presentation is not the same as deleting essential details; a useful design removes avoidable work while keeping the task understandable.\n\nConcrete application: An IKEA assembly diagram places the correct bolt label next to the bolt illustration rather than on a separate page. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): An IKEA assembly diagram places the correct bolt label next to the bolt illustration rather than on a separate page. Why it fits: This shows split-attention effect in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"When related information is separated and the audience must use working memory to connect it. Placing related information together reduces this load.\n\nIf the caption describing a diagram is far from the relevant part of the diagram, the reader must keep switching between them. This uses working memory for matching rather than understanding. The course recommends keeping related information close together.\n\nHow to explain it in an exam: Split-attention effect is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Describe what ip it captures. Describe what information the customer is trying to process, which mental effort is necessary, and which effort is added by the way content is presented. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as redundancy effect, and what changes as a result. Simplifying presentation is not the same as deleting essential details; a useful design removes avoidable work while keeping the task understandable.\n\nConcrete application: A Nike product demo shows a runner’s movement while on-screen text repeats every spoken word unnecessarily instead of adding meaning. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A Nike product demo shows a runner’s movement while on-screen text repeats every spoken word unnecessarily instead of adding meaning. Why it fits: This shows redundancy effect in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Unnecessary processing caused by repeating the same message without adding understanding. Text and visuals should have complementary jobs.\n\nRepeated text and visuals can create extra processing when they merely say the same thing. Communication becomes clearer when each element adds a useful contribution. The aim is not to eliminate explanation, but to avoid duplication that does not improve comprehension.\n\nHow to explain it in an exam: Redundancy effect is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Describe what information the customer is trying to process, which mental effort is nec rying to process, which mental effort is necessary, and which effort is added by the way content is presented. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as transient information effect, and what changes as a result. Simplifying presentation is not the same as deleting essential details; a useful design removes avoidable work while keeping the task understandable.\n\nConcrete application: A short Spotify audio advertisement lists a complicated offer too quickly for listeners to retain the conditions. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A short Spotify audio advertisement lists a complicated offer too quickly for listeners to retain the conditions. Why it fits: This shows transient information effect in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The load created when information disappears before it is understood, forcing the audience to hold it in working memory.\n\nA temporary message, slide or moving element may disappear before the audience has understood it. The user then has to hold the unfinished information in working memory. Giving people enough time or making important material available reduces this problem.\n\nHow to explain it in an exam: Transient information effect is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Describe what information the customer is trying to process, which mental effort is necessary, and which effort is added by the way content is presented. The important reasoning is the mportant reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as walled garden, and what changes as a result. Simplifying presentation is not the same as deleting essential details; a useful design removes avoidable work while keeping the task understandable.\n\nConcrete application: Apple’s App Store is a controlled environment in which Apple sets app distribution rules and manages platform-level data and transactions. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Apple’s App Store is a controlled environment in which Apple sets app distribution rules and manages platform-level data and transactions. Why it fits: This shows walled garden in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A closed digital ecosystem where one company controls the content, user data, ad inventory and measurement.\n\nA walled garden keeps audiences, content, advertising opportunities and measurement within one company’s environment. Businesses can reach people inside that platform, but they depend on the platform’s rules and data. This illustrates the control major intermediaries have over digital advertising.\n\nHow to explain it in an exam: Walled garden is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Describe what information the customer is trying to process, which mental effort is necessary, and which effort is added by the way content is presented. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as walled garden, and what changes as a result. Simplifying presentation is not the same as deleting essential details; a useful design removes avoidable work while keeping the task understandable.\n\nConcrete application: Apple’s App Store is a controlled environment in which Apple sets app distribution rules and manages platform-level data and transactions. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Apple’s App Store is a controlled environment in which Apple sets app distribution rules and manages platform-level data and transactions. Why it fits: This shows walled garden in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"OUTBOUND MARKETING"},{"id":104,"term":"SEM (Search Engine Marketing)","lecture":"Lecture 7 · SEM, distinction and decision-making","page":30,"definition":"Paid advertisements that appear in search-engine results, targeting specific keywords to reach people actively searching for related products or services.","explanation":"The course defines SEM in terms of paid ads shown in search results. Advertisers choose keywords connected to what people are actively searching for. The query signals a need, while the advertisement and its landing page should respond to that need.\n\nHow to explain it in an exam: SEM (Search Engine Marketing) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as sem (search engine marketing), and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: Google Search Ads can place a sponsored running-shoe listing in results when someone searches for running shoes. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Google Search Ads can place a sponsored running-shoe listing in results when someone searches for running shoes. Why it fits: This shows sem (search engine marketing) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Paid advertisements that appear in search-engine results, targeting specific keywords to reach people actively searching for related products or services.\n\nThe course defines SEM in terms of paid ads shown in search results. Advertisers choose keywords connected to what people are actively searching for. The query signals a need, while the advertisement and its landing page should respond to that need.\n\nHow to explain it in an exam: SEM (Search Engine Marketing) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as sem (search engine marketing), and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: Google Search Ads can place a sponsored running-shoe listing in results when someone searches for running shoes. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Google Search Ads can place a sponsored running-shoe listing in results when someone searches for running shoes. Why it fits: This shows sem (search engine marketing) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"SEM"},{"id":105,"term":"Distinctiveness","lecture":"Lecture 7 · SEM, distinction and decision-making","page":30,"definition":"Being easy to notice and recognise as your brand through consistent distinctive assets such as colours, shapes, taglines, characters, sonic cues and pack shapes.","explanation":"A distinctive brand is easy to notice and recognise because it repeatedly uses recognisable cues. The course names colours, shapes, characters, taglines, sounds and packaging as possible assets. Distinctiveness helps someone connect a message to the correct brand.\n\nHow to explain it in an exam: Distinctiveness is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as distinctiveness, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: Someone sees Nike’s swoosh on a shoe without reading the name; the cue helps them identify the brand quickly. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Someone sees Nike’s swoosh on a shoe without reading the name; the cue helps them identify the brand quickly. Why it fits: This shows distinctiveness in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Being easy to notice and recognise as your brand through consistent distinctive assets such as colours, shapes, taglines, characters, sonic cues and pack shapes.\n\nA distinctive brand is easy to notice and recognise because it repeatedly uses recognisable cues. The course names colours, shapes, characters, taglines, sounds and packaging as possible assets. Distinctiveness helps someone connect a message to the correct brand.\n\nHow to explain it in an exam: Distinctiveness is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as distinctiveness, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: Someone sees Nike’s swoosh on a shoe without reading the name; the cue helps them identify the brand quickly. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Someone sees Nike’s swoosh on a shoe without reading the name; the cue helps them identify the brand quickly. Why it fits: This shows distinctiveness in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"DISTINCTION AND CREATIVITY"},{"id":106,"term":"Distinctive brand asset","lecture":"Lecture 7 · SEM, distinction and decision-making","page":30,"definition":"A recognisable cue linked to a brand, such as a colour, shape, tagline, character, sound, promise or pack shape.","explanation":"This is a particular feature people associate with a brand, such as its familiar colour or sound. Repeated consistent use helps strengthen recognition. An asset is useful when it helps identify the brand, rather than merely decorating an advertisement.\n\nHow to explain it in an exam: Distinctive brand asset is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as distinctive brand asset, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: Nike’s swoosh is a distinctive asset because repeated use has linked the shape to the brand in consumers’ minds. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Nike’s swoosh is a distinctive asset because repeated use has linked the shape to the brand in consumers’ minds. Why it fits: This shows distinctive brand asset in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A recognisable cue linked to a brand, such as a colour, shape, tagline, character, sound, promise or pack shape.\n\nThis is a particular feature people associate with a brand, such as its familiar colour or sound. Repeated consistent use helps strengthen recognition. An asset is useful when it helps identify the brand, rather than merely decorating an advertisement.\n\nHow to explain it in an exam: Distinctive brand asset is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as distinctive brand asset, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: Nike’s swoosh is a distinctive asset because repeated use has linked the shape to the brand in consumers’ minds. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Nike’s swoosh is a distinctive asset because repeated use has linked the shape to the brand in consumers’ minds. Why it fits: This shows distinctive brand asset in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"DISTINCTION AND CREATIVITY"},{"id":107,"term":"Brand image","lecture":"Lecture 7 · SEM, distinction and decision-making","page":30,"definition":"How a brand is being perceived.","explanation":"Brand image concerns the perceptions people actually hold about an organisation. It may not match what the organisation intends to communicate. Understanding the distinction matters because the audience, not the company, determines how the brand is perceived.\n\nHow to explain it in an exam: Brand image is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as brand image, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: A shopper perceives Volvo as safety-focused because of the impressions they have formed from communication and experience. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A shopper perceives Volvo as safety-focused because of the impressions they have formed from communication and experience. Why it fits: This shows brand image in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"How a brand is being perceived.\n\nBrand image concerns the perceptions people actually hold about an organisation. It may not match what the organisation intends to communicate. Understanding the distinction matters because the audience, not the company, determines how the brand is perceived.\n\nHow to explain it in an exam: Brand image is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as brand image, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: A shopper perceives Volvo as safety-focused because of the impressions they have formed from communication and experience. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A shopper perceives Volvo as safety-focused because of the impressions they have formed from communication and experience. Why it fits: This shows brand image in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"DISTINCTION AND CREATIVITY"},{"id":108,"term":"Brand identity","lecture":"Lecture 7 · SEM, distinction and decision-making","page":31,"definition":"How a brand wants to be perceived.","explanation":"Brand identity is the way a brand deliberately presents itself and wishes to be understood. It may involve its chosen visual and verbal cues. The difference from brand image is intention versus actual audience perception.\n\nHow to explain it in an exam: Brand identity is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as brand identity, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: Volvo wants its messaging, visual identity, and product experience to communicate a safety-oriented brand identity. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Volvo wants its messaging, visual identity, ,"lecture":"Lecture 7 · SEM, distinction and decision-making","page":31,"definition":"An advertising billing model in which the advertiser pays per 1,000 impressions.","explanation":"Under CPM pricing, the advertiser pays for every 1,000 counted impressions. The cost is connected to display opportunities rather than clicks or purchases. It is therefore important not to confuse the volume of impressions with proof of attention or sales.\n\nHow to explain it in an exam: CPM (cost per mille) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as cpm (cost per mille), and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: A hypothetical Adidas display campaign costs €12 for each 1,000 ad impressions; that rate is CPM, not a cost per sale. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A hypothetical Adidas display campaign costs €12 for each 1,000 ad impressions; that rate is CPM, not a cost per sale. Why it fits: This shows cpm (cost per mille) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"An advertising billing model in which the advertiser pays per 1,000 impressions.\n\nUnde  valid clicks on an advertisement. This makes a click the billing event, but it does not guarantee that the visitor buys something. The lecture’s later discussion of advertising measurement warns against treating clicks as proof of business effect.\n\nHow to explain it in an exam: CPC (cost per click) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as cpc (cost per click), and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: A hypothetical Nike search ad costs €0.80 each time a valid user click is billed; impressions alone do not trigger CPC payment. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A hypothetical Nike search ad costs €0.80 each time a valid user click is billed; impressions alone do not trigger CPC payment. Why it fits: This shows cpc (cost per click) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"An advertising billing model in which the advertiser pays for each valid click.\n\nUnder CPC pricing, cost is linked to valid clicks on an advertisement. This makes a click the billing event, but it does not guarantee that the visitor buys something. The lectur e point against which another price seems low. The important mechanism is reliance on the first piece of information, not a full independent comparison.\n\nHow to explain it in an exam: Anchoring effect is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as anchoring effect, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: A hypothetical Apple accessories page shows a €199 option first; customers may use that first number as an anchor when comparing cheaper options. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A hypothetical Apple accessories page shows a €199 option first; customers may use that first number as an anchor when comparing cheaper options. Why it fits: This shows anchoring effect in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A cognitive bias where people rely heavily on the first piece of information they encounter when making decisions.\n\nThe first number or fact encountered can shape how later options are judged. For example, an initial high price can become a reference point against which another price seems low. The important mechanism is reliance nd or access. This can influence decisions by making delay feel costly.\n\nHow to explain it in an exam: Scarcity is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as scarcity, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: Imagine Filmstaden showing “Only 6 seats left” for a screening when that number is genuinely accurate; limited quantity can accelerate a decision. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Imagine Filmstaden showing “Only 6 seats left” for a screening when that number is genuinely accurate; limited quantity can accelerate a decision. Why it fits: This shows scarcity in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A principle where limited availability is perceived as more valuable, prompting faster decisions. Scarcity can concern quantity, time, demand or access.\n\nPeople may assign greater value or urgency to something that appears limited. The limit can concern time, quantity, demand or access. This can influence decisions by making delay feel costly.\n\nHow to explain it in an exam: Scarcity is not simply a label to memorize. Start with
