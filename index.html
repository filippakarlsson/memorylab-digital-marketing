\nA descriptive, unique page title lets searchers distinguish the result from alternatives. Repeated vague titles reduce clarity at the decision to click."},"exampleType":"illustrative"},{"id":63,"term":"Meta description","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":18,"definition":"The brief summary below the meta title on the SERP, around 150–160 characters. It is the sales pitch: it should give a reason to click, not list keywords.","explanation":"The description briefly explains why a searcher might want to open the page. The lecture suggests around 150–160 characters and stresses persuasion instead of keyword stuffing. It should accurately describe the page and make its relevance clear.\n\nA useful description tells searchers why the page answers their need. Repeating keywords without meaningful detail gives little reason to visit.","example":"Illustrative example: A small pottery shop could write a search-result description such as 'Handmade mugs in six colours. See sizes, prices and shipping options.' It tells shoppers why to open that particular page instead of just repeating 'mug.'","full":"A meta description is a short summary supplied for a webpage that search engines may show below its title. The course suggests about 150–160 characters as a practical guide and emphasizes clear, persuasive information instead of keyword repetition. Search engines can generate their own snippets, so the description is a proposed summary instead of guaranteed displayed text.\n\nA cinema movie-page description might summarize showtimes, booking options and available locations instead of repeating the word 'cinema.' The description acts as a short explanation of why the result is worth opening. It should accurately reflect what the visitor will find, since inflated promises can increase disappointment. Search systems may choose alternative snippet text; the website owner does not fully control the displayed description.\n\nA useful description tells searchers why the page answers their need. Repeating keywords without meaningful detail gives little reason to visit.","category":"ON-SITE SEO","study":{"simple":"The description briefly explains why a searcher might want to open the page. The lecture suggests around 150–160 characters and stresses persuasion instead of keyword stuffing.","why":"A useful description tells searchers why the page answers their need. Repeating keywords without meaningful detail gives little reason to visit. It should accurately reflect what the visitor will find, since inflated promises can increase disappointment. Search systems may choose alternative snippet text; the website owner does not fully control the displayed description.","example":"A small pottery shop could write a search-result description such as 'Handmade mugs in six colours. See sizes, prices and shipping options.' It tells shoppers why to open that particular page instead of just repeating 'mug.'","exam":"A meta description is a short summary supplied for a webpage that search engines may show below its title. The course suggests about 150–160 characters as a practical guide and emphasizes clear, persuasive information instead of keyword repetition. Search engines can generate their own snippets, so the description is a proposed summary instead of guaranteed displayed text.\n\nA cinema movie-page description might summarize showtimes, booking options and available locations instead of repeating the word 'cinema.' The description acts as a short explanation of why the result is worth opening. It should accurately reflect what the visitor will find, since inflated promises can increase disappointment. Search systems may choose alternative snippet text; the website owner does not fully control the displayed description.\n\nA useful description tells searchers why the page answers their need. Repeating keywords without meaningful detail gives little reason to visit."},"exampleType":"illustrative"},{"id":64,"term":"Header tags (H1, H2, H3)","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":18,"definition":"The outline of the page. H1 is the main title; H2 and H3 are subheadings. They tell both reader and crawler what the page is about, in order of importance.","explanation":"Heading tags form an outline of the information on a page. The H1 names the main subject, and H2/H3 headings break it into logically organised sections. This helps people scan the page and helps crawlers interpret its structure.\n\nA logical heading structure allows people to scan and find sections; it also signals how the page content fits together.","example":"Illustrative example: A care guide might use H1 'How to care for orchids,' H2 'Watering' and H3 'How often in winter.' The headings create a readable outline instead of using larger text at random.","full":"Heading tags establish the structural outline of a webpage: H1 states the main topic, H2 organizes major sections and H3 provides more specific subsections. The H1 names the main subject, and H2/H3 headings break it into logically organised sections. This helps people scan the page and helps crawlers interpret its structure.\n\nAn IKEA kitchen-planning guide could use an H1 for its main subject, H2s for measuring and selecting cabinets, and H3s for details within each stage. That outline helps readers skim and understand which advice belongs where. It also exposes the logical structure to search systems. Heading tags should reflect genuine information relationships, not merely be chosen for visual font size.\n\nA logical heading structure allows people to scan and find sections; it also signals how the page content fits together.","category":"ON-SITE SEO","study":{"simple":"Heading tags form an outline of the information on a page. The H1 names the main subject, and H2/H3 headings break it into logically organised sections.","why":"A logical heading structure allows people to scan and find sections; it also signals how the page content fits together. That outline helps readers skim and understand which advice belongs where. It also exposes the logical structure to search systems.","example":"A care guide might use H1 'How to care for orchids,' H2 'Watering' and H3 'How often in winter.' The headings create a readable outline instead of using larger text at random.","exam":"Heading tags establish the structural outline of a webpage: H1 states the main topic, H2 organizes major sections and H3 provides more specific subsections. The H1 names the main subject, and H2/H3 headings break it into logically organised sections. This helps people scan the page and helps crawlers interpret its structure.\n\nAn IKEA kitchen-planning guide could use an H1 for its main subject, H2s for measuring and selecting cabinets, and H3s for details within each stage. That outline helps readers skim and understand which advice belongs where. It also exposes the logical structure to search systems. Heading tags should reflect genuine information relationships, not merely be chosen for visual font size.\n\nA logical heading structure allows people to scan and find sections; it also signals how the page content fits together."},"exampleType":"illustrative"},{"id":65,"term":"URL slug","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":19,"definition":"The specific address of a page. It should be clean, descriptive and readable: /womens/running-shoes tells you where you are, /p?id=99381 tells you nothing.","explanation":"A descriptive slug makes a page’s topic and location easier to understand from its address. For example, /womens/running-shoes gives more information than /p?id=99381. Clear URLs support understandable navigation instead of hiding the subject behind an arbitrary identifier.\n\nA readable URL gives visitors a clue about the page before they open it. Unclear codes make navigation and sharing less understandable.","example":"Illustrative example: Compare /help/return-an-item with /page?id=89273 on a clothing shop's site. The first address tells a visitor what to expect before clicking; the second does not.","full":"URL slug is the specific address of a page. It should be clean, descriptive and readable: /womens/running-shoes tells you where you are, /p?id=99381 tells you nothing. A descriptive slug makes a page’s topic and location easier to understand from its address. For example, /womens/running-shoes gives more information than /p?id=99381. Clear URLs support understandable navigation instead of hiding the subject behind an arbitrary identifier.\n\nA hypothetical IKEA desk page using '/desks/' tells visitors and systems more than a URL with an unexplained identifier. Readable URL slugs support orientation and make links easier to share and recognize. Their effect is modest compared with whether the content actually answers a query. Changing a valid URL casually can also create broken links, so descriptive structure should be designed carefully.\n\nA readable URL gives visitors a clue about the page before they open it. Unclear codes make navigation and sharing less understandable.","category":"ON-SITE SEO","study":{"simple":"A descriptive slug makes a page’s topic and location easier to understand from its address. For example, /womens/running-shoes gives more information than /p?id=99381.","why":"A readable URL gives visitors a clue about the page before they open it. Unclear codes make navigation and sharing less understandable. Readable URL slugs support orientation and make links easier to share and recognize. Their effect is modest compared with whether the content actually answers a query.","example":"Compare /help/return-an-item with /page?id=89273 on a clothing shop's site. The first address tells a visitor what to expect before clicking; the second does not.","exam":"URL slug is the specific address of a page. It should be clean, descriptive and readable: /womens/running-shoes tells you where you are, /p?id=99381 tells you nothing. A descriptive slug makes a page’s topic and location easier to understand from its address. For example, /womens/running-shoes gives more information than /p?id=99381. Clear URLs support understandable navigation instead of hiding the subject behind an arbitrary identifier.\n\nA hypothetical IKEA desk page using '/desks/' tells visitors and systems more than a URL with an unexplained identifier. Readable URL slugs support orientation and make links easier to share and recognize. Their effect is modest compared with whether the content actually answers a query. Changing a valid URL casually can also create broken links, so descriptive structure should be designed carefully.\n\nA readable URL gives visitors a clue about the page before they open it. Unclear codes make navigation and sharing less understandable."},"exampleType":"illustrative"},{"id":66,"term":"Alt text","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":19,"definition":"A description of an image for search engines and for people using a screen reader. Search engines cannot see your images — alt text is how you describe them.","explanation":"Alt text describes an image in words, particularly for visitors using screen readers and for systems interpreting the image. It should communicate what is meaningful about the image in its context. This is both a content-accessibility consideration and an on-site SEO element.\n\nMeaningful alt text enables screen-reader users to understand informative images. It also helps communicate visual content that cannot be interpreted from a filename.","example":"Illustrative example: For a cake shop, useful image alt text could be 'Chocolate cake with strawberries and a number-18 candle' rather than just 'cake image.' Someone using a screen reader gets the important visual information.","full":"Alt text is a written alternative for meaningful image content, intended particularly for screen-reader users and also available to search systems. It should communicate what is meaningful about the image in its context. This is both a content-accessibility consideration and an on-site SEO element.\n\nAn IKEA desk photograph that conveys the object's appearance could have alt text such as 'White desk with two drawers, viewed from the front.' A screen-reader user then receives meaningful information instead of 'image123.' Alt text also communicates image context to search systems. It should describe what the image contributes, not stuff unrelated keywords or narrate decorative elements that add no meaning.\n\nMeaningful alt text enables screen-reader users to understand informative images. It also helps communicate visual content that cannot be interpreted from a filename.","category":"ON-SITE SEO","study":{"simple":"Alt text describes an image in words, particularly for visitors using screen readers and for systems interpreting the image. It should communicate what is meaningful about the image in its context.","why":"Meaningful alt text enables screen-reader users to understand informative images. It also helps communicate visual content that cannot be interpreted from a filename. It should describe what the image contributes, not stuff unrelated keywords or narrate decorative elements that add no meaning.","example":"For a cake shop, useful image alt text could be 'Chocolate cake with strawberries and a number-18 candle' rather than just 'cake image.' Someone using a screen reader gets the important visual information.","exam":"Alt text is a written alternative for meaningful image content, intended particularly for screen-reader users and also available to search systems. It should communicate what is meaningful about the image in its context. This is both a content-accessibility consideration and an on-site SEO element.\n\nAn IKEA desk photograph that conveys the object's appearance could have alt text such as 'White desk with two drawers, viewed from the front.' A screen-reader user then receives meaningful information instead of 'image123.' Alt text also communicates image context to search systems. It should describe what the image contributes, not stuff unrelated keywords or narrate decorative elements that add no meaning.\n\nMeaningful alt text enables screen-reader users to understand informative images. It also helps communicate visual content that cannot be interpreted from a filename."},"exampleType":"illustrative"},{"id":67,"term":"Internal link","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":19,"definition":"A link to another page on the same site. Internal links pass value between your own pages and keep the visitor moving through the funnel.","explanation":"Internal links connect relevant pages belonging to the same website. They help visitors move between related information and allow crawlers to discover the site’s structure. They can also guide someone from an introductory page toward more detailed content.\n\nLinks between related pages help readers continue their task and help crawlers discover content. Missing internal links can leave valuable pages isolated.","example":"Illustrative example: A plant shop's guide to growing tomatoes links to its own article on choosing pot sizes. The link helps readers take the next step and helps crawlers discover a related page.","full":"Internal link is a link to another page on the same site. Internal links pass value between your own pages and keep the visitor moving through the funnel. Internal links connect relevant pages belonging to the same website. They help visitors move between related information and allow crawlers to discover the site’s structure. They can also guide someone from an introductory page toward more detailed content.\n\nAn IKEA guide on organizing small rooms can link directly to its storage-box page when that next step helps the reader. The internal link improves navigation and gives search crawlers a path to related content. It is also a way of connecting stages of a customer's job. A link is useful because of the relevant destination and understandable anchor text, not merely because it increases the link count.\n\nLinks between related pages help readers continue their task and help crawlers discover content. Missing internal links can leave valuable pages isolated.","category":"ON-SITE SEO","study":{"simple":"Internal links connect relevant pages belonging to the same website. They help visitors move between related information and allow crawlers to discover the site’s structure.","why":"Links between related pages help readers continue their task and help crawlers discover content. Missing internal links can leave valuable pages isolated. The internal link improves navigation and gives search crawlers a path to related content. It is also a way of connecting stages of a customer's job.","example":"A plant shop's guide to growing tomatoes links to its own article on choosing pot sizes. The link helps readers take the next step and helps crawlers discover a related page.","exam":"Internal link is a link to another page on the same site. Internal links pass value between your own pages and keep the visitor moving through the funnel. Internal links connect relevant pages belonging to the same website. They help visitors move between related information and allow crawlers to discover the site’s structure. They can also guide someone from an introductory page toward more detailed content.\n\nAn IKEA guide on organizing small rooms can link directly to its storage-box page when that next step helps the reader. The internal link improves navigation and gives search crawlers a path to related content. It is also a way of connecting stages of a customer's job. A link is useful because of the relevant destination and understandable anchor text, not merely because it increases the link count.\n\nLinks between related pages help readers continue their task and help crawlers discover content. Missing internal links can leave valuable pages isolated."},"exampleType":"illustrative"},{"id":68,"term":"External link (outbound link)","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":19,"definition":"A link pointing to an authoritative, relevant source outside your own website. It builds credibility and provides value to your users.","explanation":"An outbound link takes the reader to a relevant source on another website. It can provide supporting information that the current page does not contain. The lecture presents relevant authoritative links as a way to add value\n\nAn appropriate outside source can answer questions beyond the current page and increase usefulness. Linking merely for appearances does not create credibility.","example":"Illustrative example: A campsite's information page links to an official national-park website for current fire rules. The external link gives visitors an authoritative source instead of guessing about safety restrictions.","full":"External link (outbound link) is a link pointing to an authoritative, relevant source outside your own website. It builds credibility and provides value to your users. An outbound link takes the reader to a relevant source on another website. It can provide supporting information that the current page does not contain. The lecture presents relevant authoritative links as a way to add value.\n\nIf an IKEA measuring guide cites an official safety or product-standard resource on an external website, the outbound link can help users verify details beyond the shop's own claims. This differs from a backlink, which points into IKEA's site. Linking outward should serve a real informational need. An unrelated list of authoritative-looking URLs would not automatically increase credibility.\n\nAn appropriate outside source can answer questions beyond the current page and increase usefulness. Linking merely for appearances does not create credibility.","category":"ON-SITE SEO","study":{"simple":"An outbound link takes the reader to a relevant source on another website. It can provide supporting information that the current page does not contain.","why":"An appropriate outside source can answer questions beyond the current page and increase usefulness. Linking merely for appearances does not create credibility. This differs from a backlink, which points into IKEA's site. Linking outward should serve a real informational need.","example":"A campsite's information page links to an official national-park website for current fire rules. The external link gives visitors an authoritative source instead of guessing about safety restrictions.","exam":"External link (outbound link) is a link pointing to an authoritative, relevant source outside your own website. It builds credibility and provides value to your users. An outbound link takes the reader to a relevant source on another website. It can provide supporting information that the current page does not contain. The lecture presents relevant authoritative links as a way to add value.\n\nIf an IKEA measuring guide cites an official safety or product-standard resource on an external website, the outbound link can help users verify details beyond the shop's own claims. This differs from a backlink, which points into IKEA's site. Linking outward should serve a real informational need. An unrelated list of authoritative-looking URLs would not automatically increase credibility.\n\nAn appropriate outside source can answer questions beyond the current page and increase usefulness. Linking merely for appearances does not create credibility."},"exampleType":"illustrative"},{"id":69,"term":"Backlink","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":20,"definition":"A link from someone else's site to yours. Search engines read it as a vote: someone thought this was worth pointing at. One link from a trusted site beats a hundred from nobody.","explanation":"A backlink is created when another website links to yours. It can suggest that the linked information is worth referring to. The course stresses the quality and trustworthiness of the referring site instead of just the number of links.\n\nA trustworthy, relevant link can direct visitors to a page and signal its value. Numerous irrelevant links are not equivalent to quality references.","example":"Illustrative example: A neighbourhood newspaper writes about a new farmers' market and links to the market's official site. That incoming link is a backlink: another website is pointing readers towards it.","full":"Backlink is a link from someone else's site to yours. Search engines read it as a vote: someone thought this was worth pointing at. One link from a trusted site beats a hundred from nobody. A backlink is created when another website links to yours. It can suggest that the linked information is worth referring to. The course stresses the quality and trustworthiness of the referring site instead of just the number of links.\n\nWhen an independent design blog links to IKEA's room-planning page, IKEA receives a backlink because the link originates on another site. Such references can indicate that content is worth finding, especially when the source is relevant and trustworthy. The quality of the referring context matters more than raw quantity. Buying low-quality link schemes is not equivalent to earning a credible editorial recommendation.\n\nA trustworthy, relevant link can direct visitors to a page and signal its value. Numerous irrelevant links are not equivalent to quality references.","category":"OFF-SITE SEO","study":{"simple":"A backlink is created when another website links to yours. It can suggest that the linked information is worth referring to.","why":"A trustworthy, relevant link can direct visitors to a page and signal its value. Numerous irrelevant links are not equivalent to quality references. Such references can indicate that content is worth finding, especially when the source is relevant and trustworthy. The quality of the referring context matters more than raw quantity.","example":"A neighbourhood newspaper writes about a new farmers' market and links to the market's official site. That incoming link is a backlink: another website is pointing readers towards it.","exam":"Backlink is a link from someone else's site to yours. Search engines read it as a vote: someone thought this was worth pointing at. One link from a trusted site beats a hundred from nobody. A backlink is created when another website links to yours. It can suggest that the linked information is worth referring to. The course stresses the quality and trustworthiness of the referring site instead of just the number of links.\n\nWhen an independent design blog links to IKEA's room-planning page, IKEA receives a backlink because the link originates on another site. Such references can indicate that content is worth finding, especially when the source is relevant and trustworthy. The quality of the referring context matters more than raw quantity. Buying low-quality link schemes is not equivalent to earning a credible editorial recommendation.\n\nA trustworthy, relevant link can direct visitors to a page and signal its value. Numerous irrelevant links are not equivalent to quality references."},"exampleType":"illustrative"},{"id":70,"term":"Sitelinks","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":20,"definition":"Additional links to important pages that Google adds beneath the main result — typically for well-structured sites with clear navigation. They increase visibility and click-through rate.","explanation":"Sitelinks are extra destinations shown below a main search result, often for well-organised websites. They make it easier to jump to important sections without first opening the homepage. Their appearance can increase the space and visibility of a listing in results.\n\nSitelinks give searchers direct paths into relevant parts of a site. Clear organisation can make important destinations easier to recognise.","example":"Illustrative example: Google sometimes shows extra links such as 'Rooms,' 'Restaurant' and 'Contact' underneath a hotel's main search result. These sitelinks give people shortcuts to useful sections.","full":"Sitelinks are additional links that a search engine may show beneath a main result to help users reach important pages directly. They make it easier to jump to important sections without first opening the homepage. Their appearance can increase the space and visibility of a listing in results.\n\nA branded Google result for IKEA may show extra links to Kitchens, Stores or Customer Service beneath its main homepage result. These sitelinks help users jump directly to important destinations, saving navigation steps. Clear site structure can support their usefulness, but Google selects whether and how they appear. A site owner cannot simply demand a sitelink as a standard webpage element.\n\nSitelinks give searchers direct paths into relevant parts of a site. Clear organisation can make important destinations easier to recognise.","category":"ON-SITE SEO","study":{"simple":"Sitelinks are extra destinations shown below a main search result, often for well-organised websites. They make it easier to jump to important sections without first opening the homepage.","why":"Sitelinks give searchers direct paths into relevant parts of a site. Clear organisation can make important destinations easier to recognise. These sitelinks help users jump directly to important destinations, saving navigation steps. Clear site structure can support their usefulness, but Google selects whether and how they appear.","example":"Google sometimes shows extra links such as 'Rooms,' 'Restaurant' and 'Contact' underneath a hotel's main search result. These sitelinks give people shortcuts to useful sections.","exam":"Sitelinks are additional links that a search engine may show beneath a main result to help users reach important pages directly. They make it easier to jump to important sections without first opening the homepage. Their appearance can increase the space and visibility of a listing in results.\n\nA branded Google result for IKEA may show extra links to Kitchens, Stores or Customer Service beneath its main homepage result. These sitelinks help users jump directly to important destinations, saving navigation steps. Clear site structure can support their usefulness, but Google selects whether and how they appear. A site owner cannot simply demand a sitelink as a standard webpage element.\n\nSitelinks give searchers direct paths into relevant parts of a site. Clear organisation can make important destinations easier to recognise."},"exampleType":"illustrative"},{"id":71,"term":"Google Business Profile","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":20,"definition":"A company's profile in Google's search and maps results — address, opening hours, photos, category. The cheapest visibility a company can get, as long as it is kept up to date.","explanation":"This profile can display a business’s location, category, photos and opening hours in Google Search and Maps. Accurate information helps people find and assess the business. The lecture stresses keeping the listing up to date.\n\nCustomers deciding whether to visit a location rely on accurate business information. Wrong opening hours can undermine trust before a purchase begins.","example":"Real-world example: Google lets a café update its business hours on its Business Profile for Maps and Search. Keeping those hours accurate helps customers decide whether to visit, even before opening the café's website.","full":"Google Business Profile is a company's profile in Google's search and maps results — address, opening hours, photos, category. The cheapest visibility a company can get, as long as it is kept up to date. This profile can display a business’s location, category, photos and opening hours in Google Search and Maps. Accurate information helps people find and assess the business. The
