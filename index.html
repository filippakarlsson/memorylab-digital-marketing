e. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as search-centric internet, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: A person Googling “IKEA desk dimensions,” opening the search results, and reading IKEA’s product page directly. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A person Googling “IKEA desk dimensions,” opening the search results, and reading IKEA’s product page directly. Why it fits: This shows search-centric internet in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"An internet where people reach information by searching and clicking through to websites — the model that answer engines and assistants are now displacing.\n\nIn this model, a person types a query, reviews search results and opens webpages to find information. Websites therefore compete to be discovered and clicked in those results. Assistant-generated answers challenge that pattern by placing a composed response between the person and the original webpages.\n\nHow to explain it in an exam: Search-centric internet is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as search-centric internet, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: A person Googling “IKEA desk dimensions,” opening the search results, and reading IKEA’s product page directly. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A person Googling “IKEA desk dimensions,” opening the search results, and reading IKEA’s product page directly. Why it fits: This shows search-centric internet in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"CONSEQUENCES"},{"id":26,"term":"Replicability","lecture":"Lecture 2 · Web 4.0 and the advertising marketplace","page":8,"definition":"Anything published can be copied and reused in contexts you never chose. What is posted stays: removing the original does not remove the copies.","explanation":"The original publisher cannot reliably control every later copy. A post may be downloaded, screenshot, quoted or shared in a different setting where the context has changed. Deleting the initial version does not automatically remove copies elsewhere.\n\nHow to explain it in an exam: Replicability is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as replicability, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: Someone screenshots an IKEA price promotion and reposts it after the promotion ends, stripping away its original dates and context. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Someone screenshots an IKEA price promotion and reposts it after the promotion ends, stripping away its original dates and context. Why it fits: This shows replicability in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Anything published can be copied and reused in contexts you never chose. What is posted stays: removing the original does not remove the copies.\n\nThe original publisher cannot reliably control every later copy. A post may be downloaded, screenshot, quoted or shared in a different setting where the context has changed. Deleting the initial version does not automatically remove copies elsewhere.\n\nHow to explain it in an exam: Replicability is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Explain both what the technology or marketing practice enables and what changes as a result: who gets access, whose attention is affected, and what limits or unintended consequences follow. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as replicability, and what changes as a result. Do not confuse a new technological capability with proof that its outcomes are beneficial or that it is a complete marketing strategy.\n\nConcrete application: Someone screenshots an IKEA price promotion and reposts it after the promotion ends, stripping away its original dates and context. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Someone screenshots an IKEA price promotion and reposts it after the promotion ends, stripping away its original dates and context. Why it fits: This shows replicability in a specific customer, product or platform context, rather than treating the concept as an abstract label."},{"id":27,"term":"Objective","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":9,"definition":"A clear, measurable goal that defines what a business wants to achieve with its marketing efforts within a set timeframe. The clearer the objective, the more likely the campaign is to succeed.","explanation":"An objective specifies what an activity is supposed to achieve and by when. A clear objective should be measurable so that the team can judge whether the effort worked. For example, increasing completed sign-ups over a defined campaign period is more actionable than simply wanting more attention.\n\nHow to explain it in an exam: Objective is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as objective, and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: Filmstaden sets an objective to increase completed online ticket purchases by 10% over eight weeks, rather than merely “post more on Instagram.” In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Filmstaden sets an objective to increase completed online ticket purchases by 10% over eight weeks, rather than merely “post more on Instagram.” Why it fits: This shows objective in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A clear, measurable goal that defines what a business wants to achieve with its marketing efforts within a set timeframe. The clearer the objective, the more likely the campaign is to succeed.\n\nAn objective specifies what an activity is supposed to achieve and by when. A clear objective should be measurable so that the team can judge whether the effort worked. For example, increasing completed sign-ups over a defined campaign period is more actionable than simply wanting more attention.\n\nHow to explain it in an exam: Objective is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as objective, and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: Filmstaden sets an objective to increase completed online ticket purchases by 10% over eight weeks, rather than merely “post more on Instagram.” In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Filmstaden sets an objective to increase completed online ticket purchases by 10% over eight weeks, rather than merely “post more on Instagram.” Why it fits: This shows objective in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"OBJECTIVES AND MEASUREMENT"},{"id":28,"term":"Call to action (CTA)","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":9,"definition":"What we ask the customer to do next. Every objective needs a CTA: a sign in a store, a sentence from a salesperson, or a clickable link online.","explanation":"A CTA makes the desired next step explicit. It might ask someone to buy, subscribe, download, book or visit a page; it can also exist outside digital marketing. A good CTA connects the communication to the actual objective rather than merely attracting attention.\n\nHow to explain it in an exam: Call to action (CTA) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as call to action (cta), and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: A Filmstaden ticket page showing “Choose seats” as the next step after a visitor selects a movie. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A Filmstaden ticket page showing “Choose seats” as the next step after a visitor selects a movie. Why it fits: This shows call to action (cta) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"What we ask the customer to do next. Every objective needs a CTA: a sign in a store, a sentence from a salesperson, or a clickable link online.\n\nA CTA makes the desired next step explicit. It might ask someone to buy, subscribe, download, book or visit a page; it can also exist outside digital marketing. A good CTA connects the communication to the actual objective rather than merely attracting attention.\n\nHow to explain it in an exam: Call to action (CTA) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as call to action (cta), and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: A Filmstaden ticket page showing “Choose seats” as the next step after a visitor selects a movie. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A Filmstaden ticket page showing “Choose seats” as the next step after a visitor selects a movie. Why it fits: This shows call to action (cta) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"OBJECTIVES AND MEASUREMENT"},{"id":29,"term":"KPI (key performance indicator)","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":9,"definition":"The measure that shows whether an objective is being met — for example conversion rate, cost per acquisition or qualified leads generated.","explanation":"A KPI is selected because it indicates progress toward a specific objective. If the goal is to gain customers, qualified leads or conversion rate may be more useful than follower count. The distinction from a general metric is that a KPI is tied directly to judging success.\n\nHow to explain it in an exam: KPI (key performance indicator) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as kpi (key performance indicator), and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: For Filmstaden’s ticket-purchase objective, the share of website visitors who complete checkout is a more useful KPI than total Instagram likes. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): For Filmstaden’s ticket-purchase objective, the share of website visitors who complete checkout is a more useful KPI than total Instagram likes. Why it fits: This shows kpi (key performance indicator) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The measure that shows whether an objective is being met — for example conversion rate, cost per acquisition or qualified leads generated.\n\nA KPI is selected because it indicates progress toward a specific objective. If the goal is to gain customers, qualified leads or conversion rate may be more useful than follower count. The distinction from a general metric is that a KPI is tied directly to judging success.\n\nHow to explain it in an exam: KPI (key performance indicator) is not simply a label to memorize. Start with the definition and then describe the process or relatio abel to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as metric, and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: Filmstaden records page views, clicks on “Showtimes,” and checkout starts; these metrics describe behaviour but are not automatically success measures. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Filmstaden records page views, clicks on “Showtimes,” and checkout starts; these metrics describe behaviour but are not automatically success measures. Why it fits: This shows metric in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Supporting data that describes activity. Metrics explain what happened; KPIs tell you whether the objective was reached.\n\nMetrics provide numerical descriptions of what happened, such as impressions, page views or clicks. They help explain activity, but not every metric demonstrates progress toward the campaign objective. Whether a metric is useful as a KPI depends on the goal.\n\nHow to explain it in an exam: Metric is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a . An unfamiliar customer needs different communication from someone already evaluating alternatives or ready to buy. The model helps connect each stage to suitable activities, calls to action and objectives.\n\nHow to explain it in an exam: Marketing funnel is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as marketing funnel, and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: Someone sees an IKEA sofa ad, reads a review, compares fabric options, and finally places an order; each step needs different information. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Someone sees an IKEA sofa ad, reads a review, compares fabric options, and finally places an order; each step needs different information. Why it fits: This shows marketing funnel in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A metaphor describing the customer journey from first awareness to loyal customer. It helps marketers set clear objectives for each stage so activities match where customers are in their decision-making.\n\nThe funnel represents different stages in the customer’s decision-making process. An unfamiliar customer needs different communication from someone already evaluating alternatives or ready to buy. The model helps connect each stage to suitable activities, calls to action and objectives.\n\nHow to explain it in an exam: Marketing funnel is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as marketing funnel, and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: Someone sees an IKEA sofa ad, reads a review, compares fabric options, and finally places an order; each step needs different information. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Someone sees an IKEA sofa ad, reads a review, compares fabric options, and finally places an order; each step needs different information. Why it fits: This shows marketing funnel in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"FUNNELS"},{"id":33,"term":"AIDA","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":10,"definition":"The mother funnel: Attention, Interest, Desire, Action. There is a CTA in each step.","explanation":"Attention is the stage where someone notices a ":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":11,"definition":"Breaking a job down into its steps — define, locate, prepare, execute, conclude — to see where customers struggle and where the innovation opportunities are.","explanation":"Mapping a job divides it into define, locate, prepare, execute and conclude. This makes it possible to identify where the customer gets stuck rather than assuming the difficulty happens only during the final action. Each problem point may suggest an opportunity to improve the offer or information.\n\nHow to explain it in an exam: Job mapping is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as job mapping, and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: For an IKEA kitchen purchase, the shopper defines storage needs, locates measurements, prepares a plan, orders components, and completes installation. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): For an IKEA kitchen purchase, the shopper defines storage needs, locates measurements, prepares a plan, orders components, and completes installation. Why it fits: This shows job mapping in a specific customer, product or han treating the concept as an abstract label.","category":"CUSTOMER BEHAVIOUR"},{"id":38,"term":"Inbound marketing","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":11,"definition":"Marketing that earns attention by being findable and useful: pages, guides and blog posts that match real searches, organic social, newsletters people choose to receive, reviews and user-generated content.","explanation":"Inbound activity aims to be found when people have a relevant question or need. Search-friendly guides, helpful pages, chosen newsletters and organic content can attract attention without directly interrupting the user. The emphasis is on being useful and discoverable.\n\nHow to explain it in an exam: Inbound marketing is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as inbound marketing, and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: IKEA’s online room-planning and furnishing guides can attract someone searching for small-bedroom ideas before they are ready to buy. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): IKEA’s online room-planning and furnishing guides can attract someone searching for fore they are ready to buy. Why it fits: This shows inbound marketing in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"INBOUND AND OUTBOUND"},{"id":39,"term":"Outbound marketing","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":12,"definition":"Marketing that pushes a message to an audience: paid social ads, display banners and pop-ups, pre-roll video, direct mail, cold calls, out-of-home advertising and sponsored content.","explanation":"Outbound activity sends the message toward an audience rather than waiting to be found. Examples in the lecture include paid social advertising, banners, video pre-rolls, direct mail and cold calls. The key contrast with inbound is the way attention is reached: interruption or push versus attraction through useful content.\n\nHow to explain it in an exam: Outbound marketing is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as outbound marketing, and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: A hypothetical Nike shoe advertisement interrupts a free Spotify listening session even though the listener did not search for shoes. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A hypothetical Nike shoe advertisement interrupts a free Spotify listening session even though the listener did not search for shoes. Why it fits: This shows outbound marketing in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Marketing that pushes a message to an audience: paid social ads, display banners and pop-ups, pre-roll video, direct mail, cold calls, out-of-home advertising and sponsored content.\n\nOutbound activity sends the message toward an audience rather than waiting to be found. Examples in the lecture include paid social advertising, banners, video pre-rolls, direct mail and cold calls. The key contrast with inbound is the way attention is reached: interruption or push versus attraction through useful content.\n\nHow to explain it in an exam: Outbound marketing is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as outbound marketing, and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: A hypothetical Nike shoe advertisement interrupts a free Spotify listening session even though the listener did not search for shoes. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treat d results, a map, organic listings, and other search features on the same page. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A Google search for “IKEA near me” could show paid results, a map, organic listings, and other search features on the same page. Why it fits: This shows serp (search engine results page) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"SEO BASICS"},{"id":42,"term":"Crawler (robot)","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":12,"definition":"The robots that work their way across the internet, following links and reading content so the search engine can index it.","explanation":"A crawler follows links and reads accessible pages so the search engine can discover content. This happens before the page can be included in a searchable index. Poor linking or technical barriers may prevent important pages from being discovered.\n\nHow to explain it in an exam: Crawler (robot) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as crawler (robot), and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: Googlebot follows an internal link from an IKEA category page to a particular wardrobe page so the page can be discovered. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Googlebot follows an internal link from an IKEA category page to a particular wardrobe page so the page can be discovered. Why it fits: This shows crawler (robot) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The robots that work their way across the internet, following links and reading content so the search engine can index it.\n\nA crawler follows links and reads accessible pages so the search engine can discover content. This happens before the page can be included in a searchable index. Poor linking or technical barriers may prevent important pages from being discovered.\n\nHow to explain it in an exam: Crawler (robot) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as crawler (robot), and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: Googlebot follows an internal link from an IKEA category page to a particular wardrobe page so the page can be discovered. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Googlebot follows an internal link from an IKEA category page to a particular wardrobe page so the page can be discovered. Why it fits: This shows crawler (robot) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"SEO BASICS"},{"id":43,"term":"Index","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":13,"definition":"The search engine's record of the pages its robots have found. Each search engine has an index of websites that the robots keep updated.","explanation":"The index is a search engine’s stored record of discovered pages. Crawling finds and reads pages; indexing makes the information available to the search system. A page that is not properly indexed cannot compete normally in search results.\n\nHow to explain it in an exam: Index is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as index, and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: After Google has discovered an IKEA shelf page, information about that page can be stored in its searchable index. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): After Google has discovered an IKEA shelf page, information about that page can be stored in its searchable index. Why it fits: This shows index in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The search engine's record of the pages its robots have found. Each search engine has an index of websites that the robots keep updated.\n\nThe index is a search engine’s stored record of discovered pages. Crawling finds and reads pages; indexing makes the information available to the search system. A page that is not properly indexed cannot compete normally in search results.\n\nHow to explain it in an exam: Index is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as index, and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: After Google has discovered an IKEA shelf page, information about that page can be stored in its searchable index. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a e result as proven fact.","example":"Brand/product example (illustrative): Google’s ranking systems determine which pages to display for “small bookshelf” rather than simply showing pages in the order they were created. Why it fits: This shows algorithm in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The search engine's code that decides how the pages in the index are ranked for a given query.\n\nOnce pages are in the index, the search engine must decide which ones best answer a query. The algorithm provides that ranking process. SEO work aims to make a page accessible, relevant and useful within that system, rather than directly controlling the rankings.\n\nHow to explain it in an exam: Algorithm is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as algorithm, and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: Google’s ranking systems determine which pages to display for “small bookshelf” rather than simply showing pages in the order they were created. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Google’s ranking systems determine which pages to display for “small bookshelf” rather than simply showing pages in the order they were created. Why it fits: This shows algorithm in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"SEO BASICS"},{"id":45,"term":"Organic result","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":13,"definition":"A standard, unpaid listing on the SERP — title, URL and snippet — possibly with sitelinks or a site search box for brands.","explanation":"An organic listing appears without the site paying for that particular placement. It commonly includes a title, URL and text snippet and can sometimes include sitelinks. Organic visibility is therefore different from paid search advertising.\n\nHow to explain it in an exam: Organic result is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as organic result, and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: An unpaid IKEA furniture product page appearing in Google’s regular results, distinguished from a sponsored result. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): An unpaid IKEA furniture product page appearing in Googl ncept as an abstract label.","category":"SEO BASICS"},{"id":46,"term":"Position 0 (featured snippet)","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":13,"definition":"An answer box extracted from a page — a paragraph, list, table or video — shown ahead of the regular results.","explanation":"A featured snippet pulls a short answer from a page and presents it prominently above regular results. The answer may be formatted as a paragraph, list, table or video. It demonstrates how a search engine can provide information directly on its results page.\n\nHow to explain it in an exam: Position 0 (featured snippet) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as position 0 (featured snippet), and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: Google extracts a short paragraph from a recipe site to answer “how long to boil rice” above regular search listings. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Google extracts a short paragraph from a recipe site to answer “how long to boil rice” above regular search listings. Why it fits: This shows position 0 (featured snippet) in a specific customer, p nowledge panel collects key facts about a recognised person, place or brand into a dedicated result feature. It is different from an ordinary organic webpage listing. The feature can help users identify an entity and find basic information quickly.\n\nHow to explain it in an exam: Knowledge panel is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as knowledge panel, and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: A Google results panel showing recognized facts about Apple such as its website and company information. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A Google results panel showing recognized facts about Apple such as its website and company information. Why it fits: This shows knowledge panel in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A panel of facts about a brand, person or place, shown at the top or on the right of the results page.\n\nA knowledge panel collects key facts about a recognised person, place or brand into a dedicated result feature. It is different from an ordinary organic webpage listing. The feature can help users ident omer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as search intent, and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: “Spotify login” and “best music streaming app” contain different intents even though both concern streaming. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): “Spotify login” and “best music streaming app” contain different intents even though both concern streaming. Why it fits: This shows search intent in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"What the person actually wants from a query. Four types: informational, navigational, commercial (investigation) and transactional — each mapping to a stage of the funnel.\n\nSearch intent is the purpose behind a query rather than just the words typed. The four types in the course are informational, navigational, commercial and transactional. Understanding the difference helps a marketer match a page and its content to the action the searcher actually wants.\n\nHow to explain it in an exam: Search intent is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match he implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): “Buy IKEA KALLAX white” suggests the person is ready to select and purchase a product. Why it fits: This shows transactional intent in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The user is ready to act now: buy, sign up or download. Maps to conversion and purchase.\n\nThe person is ready to do something, such as purchase, download or register. The page should make the action clear and straightforward. It belongs close to conversion and purchase in the funnel.\n\nHow to explain it in an exam: Transactional intent is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as transactional intent, and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: “Buy IKEA KALLAX white” suggests the person is ready to select and purchase a product. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): “Buy IKEA KALLAX white” suggests the person is ready to select and purchase a product. Why it fits: This shows transactional intent in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"SEO BASICS"},{"id":55,"term":"SEO audit","lecture":"Lecture 3 · Digital marketing fundamentals and SEO basics","page":15,"definition":"An SEO analysis of a site that uncovers the highest-priority issues: a Site Health rank, errors and warnings, crawlability, HTTPS, Core Web Vitals, internal linking, markup and site performance.","explanation":"An SEO audit identifies issues that could limit a website’s search performance. Findings can cover site health, crawling, security, page experience, links and markup. The point is to prioritise what to investigate and fix, not just produce a long list of technical observations.\n\nHow to explain it in an exam: SEO audit is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. In a practical marketing decision, first identify the customer need and stage of decision-making, then select an action and a measure that truly match that need. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as seo audit, and what changes as a result. A click, an impression, and a completed purchase describe different kinds of events; only the one linked to the objective should be treated as evidence of success.\n\nConcrete application: An IKEA SEO audit discovers an important category page blocked from crawling and prioritizes fixing it before rewriting minor page descriptions. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): An IKEA SEO audit discovers an important category page blocked from crawling and e rewriting minor page descriptions. Why it fits: This shows seo audit in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"SEO BASICS"},{"id":56,"term":"Technical SEO","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":17,"definition":"The “under-the-hood” aspects of a site that affect crawling, indexation, user experience and rankings. It asks one question: can a machine reach, read and trust your site?.","explanation":"Technical SEO focuses on whether the website works in ways that allow crawlers and users to reach its content. It includes crawlability, secure connections, performance, mobile usability and site structure. A page with excellent writing can still struggle if it cannot be reached or processed properly.\n\nHow to explain it in an exam: Technical SEO is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. For an exam answer, identify which part of a website, search result, or external reputation is involved; explain what a visitor or crawler experiences, and why a fix would matter. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as technical seo, and what changes as a result. Do not assume that changing one SEO element guarantees a ranking: accessibility, relevance, and credibility interact.\n\nConcrete application: A hypothetical Nike product page fails to load on mobile; improving its reliability and crawlability is technical SEO. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A hypothetical Nike product page fails to load on mobile; improving its reliability and crawlability is technical SEO. Why it fits: This shows technical seo in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The “under-the-hood” aspects of a site that affect crawling, indexation, user experience and rankings. It asks one question: can a machine reach, read and trust your site?.\n\nTechnical SEO focuses on whether the website works in ways that allow crawlers and users to reach its content. It includes crawlability, secure connections, performance, mobile usability and site structure. A page with excellent writing can still struggle if it cannot be reached or processed properly.\n\nHow to explain it in an exam: Technical SEO is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. For an exam answer, identify which part of a website, search result, or external reputation is involved; explain what a visitor or crawler experiences, and why a fix would matter. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as technical seo, and what changes as a result. Do not assume that changing one SEO element guarantees a ranking: accessibility, relevance, and credibility interact.\n\nConcrete application: A hypothetical Nike product page fails to load on mobile; improving its reliability and crawlability is technical SEO. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A hypothetical Nike product page fails to load on mobile; improving its reliability and crawlability is technical SEO. Why it fits: This shows technical seo in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"TECHNICAL SEO"},{"id":57,"term":"On-site SEO","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":17,"definition":"Everything on your own pages that you control: content, keywords, titles, descriptions, headings, URLs, images and links.","explanation":"This covers elements the site owner can edit directly, including page content, headings, metadata, descriptive URLs, image text and internal links. The goal is to make each page understandable and useful for its intended query. It complements technical access and signals from other websites.\n\nHow to explain it in an exam: On-site SEO is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. For an exam answer, identify which part of a website, search result, or external reputation is involved; explain what a visitor or crawler experiences, and why a fix would matter. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as on-site seo, and what changes as a result. Do not assume that changing one SEO element guarantees a ranking: accessibility, relevance, and credibility interact.\n\nConcrete application: IKEA adds a specific H1, clearer product details, useful image alt text, and internal links to a wardrobe page. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): IKEA adds a specific H1, clearer product details, useful image alt text, and internal links to a wardrobe page. Why it fits: T Off-site SEO","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":17,"definition":"Everything said about you somewhere else — business profiles, reviews, mentions, backlinks, PR and word of mouth. You influence it; you do not control it.","explanation":"Off-site factors are created outside the website itself, such as backlinks, business listings, reviews and mentions. A company can influence these through its work and relationships but cannot completely control them. The lecture connects them with credibility and recognition beyond the site.\n\nHow to explain it in an exam: Off-site SEO is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. For an exam answer, identify which part of a website, search result, or external reputation is involved; explain what a visitor or crawler experiences, and why a fix would matter. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as off-site seo, and what changes as a result. Do not assume that changing one SEO element guarantees a ranking: accessibility, relevance, and credibility interact.\n\nConcrete application: A furniture review website independently links to IKEA’s measuring guide; IKEA can influence but not directly edit that external link. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A furniture review website independently links to IKEA’s measuring guide; IKEA can influence but not directly edit that external link. Why it fits: This shows off-site seo in a specific customer, product or platform context, rather than treating the concept as han “Product Page” on every URL. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): An IKEA desk page uses a specific title such as “MICKE desk – IKEA” rather than “Product Page” on every URL. Why it fits: This shows meta title in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ON-SITE SEO"},{"id":63,"term":"Meta description","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":18,"definition":"The brief summary below the meta title on the SERP, around 150–160 characters. It is the sales pitch: it should give a reason to click, not list keywords.","explanation":"The description briefly explains why a searcher might want to open the page. The lecture suggests around 150–160 characters and stresses persuasion rather than keyword stuffing. It should accurately describe the page and make its relevance clear.\n\nHow to explain it in an exam: Meta description is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. For an exam answer, identify which part of a website, search result, or external reputation is involved; explain what a visitor or crawler experiences, and why a fix would matter. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as meta description, and what changes as a result. Do not assume that changing one SEO element guarantees a ranking: accessibility, relevance, and credibility interact.\n\nConcrete application: A hypothetical Filmstaden movie page describes showtimes and seat booking in its search-result description ins e action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A hypothetical Filmstaden movie page describes showtimes and seat booking in its search-result description instead of repeating “cinema” ten times. Why it fits: This shows meta description in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ON-SITE SEO"},{"id":64,"term":"Header tags (H1, H2, H3)","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":18,"definition":"The outline of the page. H1 is the main title; H2 and H3 are subheadings. They tell both reader and crawler what the page is about, in order of importance.","explanation":"Heading tags form an outline of the information on a page. The H1 names the main subject, and H2/H3 headings break it into logically organised sections. This helps people scan the page and helps crawlers interpret its structure.\n\nHow to explain it in an exam: Header tags (H1, H2, H3) is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. For an exam answer, identify which part of a website, search result, or external reputation is involved; explain what a visitor or crawler experiences, and why a fix would matter. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as header tags (h1, h2, h3), and what changes as a result. Do not assume that changing one SEO element guarantees a ranking: accessibility, relevance, and credibility interact.\n\nConcrete application: An IKEA kitchen page uses one H1 for “Kitchen planning,” H2s for stages, and H3s for measuring tips inside a stage. In this illustration, identi t, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): An IKEA kitchen page uses one H1 for “Kitchen planning,” H2s for stages, and H3s for measuring tips inside a stage. Why it fits: This shows header tags (h1, h2, h3) in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ON-SITE SEO"},{"id":65,"term":"URL slug","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":19,"definition":"The specific address of a page. It should be clean, descriptive and readable: /womens/running-shoes tells you where you are, /p?id=99381 tells you nothing.","explanation":"A descriptive slug makes a page’s topic and location easier to understand from its address. For example, /womens/running-shoes gives more information than /p?id=99381. Clear URLs support understandable navigation rather than hiding the subject behind an arbitrary identifier.\n\nHow to explain it in an exam: URL slug is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. For an exam answer, identify which part of a website, search result, or external reputation is involved; explain what a visitor or crawler experiences, and why a fix would matter. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as url slug, and what changes as a result. Do not assume that changing one SEO element guarantees a ranking: accessibility, relevance, and credibility interact.\n\nConcrete application: A path like ikea.com/.../desks/ gives useful context, while a path ending in ?item=938202 is harder to interpret. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, ed from the front,” rather than “image123.” Why it fits: This shows alt text in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"ON-SITE SEO"},{"id":67,"term":"Internal link","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":19,"definition":"A link to another page on the same site. Internal links pass value between your own pages and keep the visitor moving through the funnel.","explanation":"Internal links connect relevant pages belonging to the same website. They help visitors move between related information and allow crawlers to discover the site’s structure. They can also guide someone from an introductory page toward more detailed content.\n\nHow to explain it in an exam: Internal link is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. For an exam answer, identify which part of a website, search result, or external reputation is involved; explain what a visitor or crawler experiences, and why a fix would matter. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as internal link, and what changes as a result. Do not assume that changing one SEO element guarantees a ranking: accessibility, relevance, and credibility interact.\n\nConcrete application: An IKEA guide about small rooms links to its own storage-box category, helping users and crawlers find the next relevant page. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): An IKEA guide about small rooms links to its own storage-box category, helping users and inal comment and the response.\n\nHow to explain it in an exam: Reviews and mentions is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. For an exam answer, identify which part of a website, search result, or external reputation is involved; explain what a visitor or crawler experiences, and why a fix would matter. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as reviews and mentions, and what changes as a result. Do not assume that changing one SEO element guarantees a ranking: accessibility, relevance, and credibility interact.\n\nConcrete application: An unhappy customer reviews a Samsung appliance; the company's public reply can influence how future shoppers interpret the experience. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): An unhappy customer reviews a Samsung appliance; the company's public reply can influence how future shoppers interpret the experience. Why it fits: This shows reviews and mentions in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Other people doing your marketing. Answering them matters, because the reply is read by everyone who comes after.\n\nPeople’s comments, recommendations and discussions can influence the reputation of a business. The organisation does not fully control this conversation, but it can respond. A public reply matters because later readers see both the original comment and the response.\n\nHow to explain it in an exam: Reviews and mentions is not simply a label to memorize. Star nd what changes as a result. Do not assume that changing one SEO element guarantees a ranking: accessibility, relevance, and credibility interact.\n\nConcrete application: Google PageSpeed Insights reports whether an IKEA mobile product page responds promptly and avoids unexpected layout shifts. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Google PageSpeed Insights reports whether an IKEA mobile product page responds promptly and avoids unexpected layout shifts. Why it fits: This shows core web vitals in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"TECHNICAL SEO"},{"id":75,"term":"Mobile-friendliness","lecture":"Lecture 4 · On-site, off-site and technical SEO","page":21,"definition":"Whether the site adapts well across screen sizes. Google evaluates the mobile version of your site first.","explanation":"A mobile-friendly page adapts to small screens so visitors can read and use it. The course connects this to Google’s emphasis on evaluating the mobile version of a site. A design that works on a desktop but fails on a phone creates both usability and search problems.\n\nHow to explain it in an exam: Mobile-friendliness is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. For an exam answer, identify which part of a website, search result, or external reputation is involved; explain what a visitor or crawler experiences, and why a fix would matter. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as mobile-friendliness, and what changes as a result. Do not assume that changing one SEO element guarantees a ranking: accessibility, relevance, and credibility interact.\n\nConcrete application: An IKEA wardrobe page uses a mobile layout where text and buy controls fit a small phone screen without horizontal scrolling. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): An IKEA wardrobe page uses a mobile layout where text and buy controls fit a small phone screen without horizontal scrolling. Why it fits: This shows mobile-friendliness in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Whether the site adapts well across screen sizes. Google evaluates the mobile version of your site first.\n\nA mobile-friendly page adapts to small screens so visitors can read and use it. The course connects this to Google’s emphasis on evaluating the mobile version of a site. A design that works on a desktop but fails on a phone creates both usability and search problems.\n\nHow to explain it in an exam: Mobile-friendliness is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. For an exam answer, identify which part of a website, search result, or external reputation is involved; explain what a visitor or crawler experiences, and why a fix would matter. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as mobile-friendliness, and what changes as a result. Do not assume that changing one SEO element guarantees a ranking: accessibility, relevance, and credibility interact.\n\nConcrete applicati
