ormation is the same; its label depends on how each company got it.\n\nThe companies still need permission to share and use the data, must protect it, and must agree on a clear purpose for using it. Nike should also know where the information originally came from. Being part of a data partnership does not remove those responsibilities.","category":"ETHICS ONLINE","study":{"simple":"A sports shop collects information from its own customers. If it shares that information directly with Nike through a partnership, the shop calls it first-party data, while Nike calls it second-party data.","why":"This matters because a company may use information collected by a partner instead of collecting it itself. But it still needs to know where that information came from, have permission to use it, protect it, and follow the purpose both companies agreed on.","example":"A concert venue collects ticket buyers' music preferences with appropriate permission, then shares the information directly with a festival organiser under an agreed partnership. It is first-party data for the venue and second-party data for the festival organiser.","exam":"Second-party data is another company's first-party data shared directly through a partnership. First-party data is information a company collects directly from its own customers or website visitors. When the company shares that information with a partner, it becomes second-party data for the partner.\n\nFor example, imagine a sports shop collects information about which sports products its customers like. With the necessary permission, the shop shares that information with Nike through a direct, transparent agreement. For the sports shop, the information is first-party data because it collected it from its own customers. For Nike, it is second-party data because Nike received it directly from another company. The information is the same; its label depends on how each company got it.\n\nThe companies still need permission to share and use the data, must protect it, and must agree on a clear purpose for using it. Nike should also know where the information originally came from. Being part of a data partnership does not remove those responsibilities."},"exampleType":"illustrative"},{"id":138,"term":"Persistence","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":38,"definition":"The quality of online content that allows it to remain accessible, or to survive through copies, long after it was published.","explanation":"Online information may remain available long after its original posting. Copies can preserve material even when the first version is removed. This increases the long-term consequences of publishing and sharing.\n\nAn online post may remain accessible long after its author expects it to disappear. Later readers can encounter content without knowing its original context.","example":"Illustrative example: Someone deletes an embarrassing old post, but their classmates still have screenshots saved in a chat. Online content can persist through copies long after the original is gone.","full":"Persistence is the quality of online content that allows it to remain accessible, or to survive through copies, long after it was published. Online information may remain available long after its original posting. Copies can preserve material even when the first version is removed. This increases the long-term consequences of publishing and sharing.\n\nA screenshot of a deleted TikTok video may remain in messaging groups or archives for years. This illustrates persistence: online material can outlast both the original post and the author's intention to remove it. People may later encounter content under changed circumstances. The resulting long-term visibility changes how creators and brands should assess privacy, reputation and the durability of published claims.\n\nAn online post may remain accessible long after its author expects it to disappear. Later readers can encounter content without knowing its original context.","category":"ONLINE CONTEXT","study":{"simple":"Online information may remain available long after its original posting. Copies can preserve material even when the first version is removed.","why":"An online post may remain accessible long after its author expects it to disappear. Later readers can encounter content without knowing its original context. This illustrates persistence: online material can outlast both the original post and the author's intention to remove it. People may later encounter content under changed circumstances.","example":"Someone deletes an embarrassing old post, but their classmates still have screenshots saved in a chat. Online content can persist through copies long after the original is gone.","exam":"Persistence is the quality of online content that allows it to remain accessible, or to survive through copies, long after it was published. Online information may remain available long after its original posting. Copies can preserve material even when the first version is removed. This increases the long-term consequences of publishing and sharing.\n\nA screenshot of a deleted TikTok video may remain in messaging groups or archives for years. This illustrates persistence: online material can outlast both the original post and the author's intention to remove it. People may later encounter content under changed circumstances. The resulting long-term visibility changes how creators and brands should assess privacy, reputation and the durability of published claims.\n\nAn online post may remain accessible long after its author expects it to disappear. Later readers can encounter content without knowing its original context."},"exampleType":"illustrative"},{"id":139,"term":"Searchability (online context)","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":38,"definition":"The quality of online content that allows it to be found by people you did not intend.","explanation":"Online information can be discovered through searches by people outside the intended audience. A post written for a small group may later become easy for strangers to find. The course treats this as one of the qualities that changes the social consequences of communication.\n\nInformation meant for one audience can become discoverable by another through search. Privacy expectations can conflict with long-term online findability.","example":"Illustrative example: Years after posting a public review, an applicant's username makes the old comment easy to find in search. Searchability means the audience can include people the writer never expected.","full":"Searchability (online context) is the quality of online content that allows it to be found by people you did not intend. Online information can be discovered through searches by people outside the intended audience. A post written for a small group may later become easy for strangers to find. The course treats this as one of the qualities that changes the social consequences of communication.\n\nA review written about an IKEA desk for a small circle can later appear in search results to unknown shoppers or employers. Searchability means the author's expected audience does not define everyone who can find the material. It increases the usefulness of publicly available information while also exposing writers to unforeseen interpretation. Search access is a distribution property, not a promise that the material remains relevant or accurate forever.\n\nInformation meant for one audience can become discoverable by another through search. Privacy expectations can conflict with long-term online findability.","category":"ONLINE CONTEXT","study":{"simple":"Online information can be discovered through searches by people outside the intended audience. A post written for a small group may later become easy for strangers to find.","why":"Information meant for one audience can become discoverable by another through search. Privacy expectations can conflict with long-term online findability. Searchability means the author's expected audience does not define everyone who can find the material. It increases the usefulness of publicly available information while also exposing writers to unforeseen interpretation.","example":"Years after posting a public review, an applicant's username makes the old comment easy to find in search. Searchability means the audience can include people the writer never expected.","exam":"Searchability (online context) is the quality of online content that allows it to be found by people you did not intend. Online information can be discovered through searches by people outside the intended audience. A post written for a small group may later become easy for strangers to find. The course treats this as one of the qualities that changes the social consequences of communication.\n\nA review written about an IKEA desk for a small circle can later appear in search results to unknown shoppers or employers. Searchability means the author's expected audience does not define everyone who can find the material. It increases the usefulness of publicly available information while also exposing writers to unforeseen interpretation. Search access is a distribution property, not a promise that the material remains relevant or accurate forever.\n\nInformation meant for one audience can become discoverable by another through search. Privacy expectations can conflict with long-term online findability."},"exampleType":"illustrative"},{"id":140,"term":"Scalability (online context)","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":38,"definition":"The quality of online content that allows it to reach far larger audiences than intended.","explanation":"A message can travel far beyond the small audience its author imagined. Online networks can extend its reach quickly and widely. The consequence is that a private-feeling interaction may have public-scale effects.\n\nA small post can suddenly reach a vast public. The impact of errors or insensitive messages can grow far beyond the author's initial audience.","example":"Illustrative example: A student uploads a funny five-second dance clip for 40 friends and it spreads to thousands of strangers. Scalability means the audience can grow far beyond the one originally intended.","full":"Scalability (online context) is the quality of online content that allows it to reach far larger audiences than intended. A message can travel far beyond the small audience its author imagined. Online networks can extend its reach quickly and widely. The consequence is that a private-feeling interaction may have public-scale effects.\n\nA TikTok review of an Apple phone might unexpectedly spread from a few followers to millions of viewers through shares and recommendations. Scalability describes that expansion beyond the initial audience. The same growth can amplify useful consumer advice or an error that was never intended for a global public. Ethical responsibility increases when visibility expands faster than an author can provide corrections and context.\n\nA small post can suddenly reach a vast public. The impact of errors or insensitive messages can grow far beyond the author's initial audience.","category":"ONLINE CONTEXT","study":{"simple":"A message can travel far beyond the small audience its author imagined. Online networks can extend its reach quickly and widely.","why":"A small post can suddenly reach a vast public. The impact of errors or insensitive messages can grow far beyond the author's initial audience. Scalability describes that expansion beyond the initial audience. The same growth can amplify useful consumer advice or an error that was never intended for a global public.","example":"A student uploads a funny five-second dance clip for 40 friends and it spreads to thousands of strangers. Scalability means the audience can grow far beyond the one originally intended.","exam":"Scalability (online context) is the quality of online content that allows it to reach far larger audiences than intended. A message can travel far beyond the small audience its author imagined. Online networks can extend its reach quickly and widely. The consequence is that a private-feeling interaction may have public-scale effects.\n\nA TikTok review of an Apple phone might unexpectedly spread from a few followers to millions of viewers through shares and recommendations. Scalability describes that expansion beyond the initial audience. The same growth can amplify useful consumer advice or an error that was never intended for a global public. Ethical responsibility increases when visibility expands faster than an author can provide corrections and context.\n\nA small post can suddenly reach a vast public. The impact of errors or insensitive messages can grow far beyond the author's initial audience."},"exampleType":"illustrative"},{"id":141,"term":"Replicability (online context)","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":38,"definition":"The quality of online content that allows it to be copied and reused in other contexts.","explanation":"Digital messages can be copied, reproduced and redistributed with little connection to their original situation. The recipient may encounter only a fragment or screenshot. Because copies persist elsewhere, the original author cannot fully control later uses.\n\nCopies can survive deletion and circulate with different captions. Publishers cannot always control every subsequent interpretation.","example":"Illustrative example: A short video of an athlete's interview is copied, trimmed and reposted with the answer removed. Replicability allows content to travel into a different context and sometimes change its apparent meaning.","full":"Replicability (online context) is the quality of online content that allows it to be copied and reused in other contexts. Digital messages can be copied, reproduced and redistributed with little connection to their original situation. The recipient may encounter only a fragment or screenshot. Because copies persist elsewhere, the original author cannot fully control later uses.\n\nSomeone can copy a Nike advertisement into a critical reaction video, cropping out the original caption or campaign date. This shows replicability: digital material can be reproduced and reused under different frames of meaning. It differs from scalability, which concerns the size of the audience. Replicability makes messages easier to preserve and critique but harder for their originators to contextualize or control.\n\nCopies can survive deletion and circulate with different captions. Publishers cannot reliably control every subsequent interpretation.","category":"ONLINE CONTEXT","study":{"simple":"Digital messages can be copied, reproduced and redistributed with little connection to their original situation. The recipient may encounter only a fragment or screenshot.","why":"Copies can survive deletion and circulate with different captions. Publishers cannot reliably control every subsequent interpretation. This shows replicability: digital material can be reproduced and reused under different frames of meaning. It differs from scalability, which concerns the size of the audience.","example":"A short video of an athlete's interview is copied, trimmed and reposted with the answer removed. Replicability allows content to travel into a different context and sometimes change its apparent meaning.","exam":"Replicability (online context) is the quality of online content that allows it to be copied and reused in other contexts. Digital messages can be copied, reproduced and redistributed with little connection to their original situation. The recipient may encounter only a fragment or screenshot. Because copies persist elsewhere, the original author cannot fully control later uses.\n\nSomeone can copy a Nike advertisement into a critical reaction video, cropping out the original caption or campaign date. This shows replicability: digital material can be reproduced and reused under different frames of meaning. It differs from scalability, which concerns the size of the audience. Replicability makes messages easier to preserve and critique but harder for their originators to contextualize or control.\n\nCopies can survive deletion and circulate with different captions. Publishers cannot reliably control every subsequent interpretation."},"exampleType":"illustrative"},{"id":142,"term":"Thumbocracy","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":39,"definition":"Serneberg's term for an affirmation-seeking online culture shaped by the thumb and visible approval signals such as likes.","explanation":"The lecturer uses the term for online participation shaped by the thumb and visible signals of approval. Likes and similar interactions can encourage people to seek affirmation through countable reactions. It connects interface design to identity and social behaviour.\n\nAn approval-focused interface can reward popularity seeking over meaningful contribution. Visible reactions should not become the only measure of value.","example":"Illustrative example: Imagine a person deleting a photo because it got fewer likes than usual, then posting a different one for more approval. That focus on visible positive reactions illustrates thumbocracy.","full":"Thumbocracy is Serneberg’s term for an online culture in which public approval signals such as likes encourage affirmation-seeking. Likes and similar interactions can encourage people to seek affirmation through countable reactions. It connects interface design to identity and social behaviour.\n\nAn Instagram user deletes a photo because it receives fewer likes than expected, even though friends enjoyed it. Under Serneberg's idea of thumbocracy, visible approval signals influence identity and self-evaluation. The platform's interface turns affirmation into a measurable public response. For digital marketers, the concept cautions against equating high engagement counts with healthy social participation or meaningful approval.\n\nAn approval-focused interface can reward popularity seeking over meaningful contribution. Visible reactions should not become the only measure of value.","category":"IDENTITY","study":{"simple":"The lecturer uses the term for online participation shaped by the thumb and visible signals of approval. Likes and similar interactions can encourage people to seek affirmation through countable reactions.","why":"An approval-focused interface can reward popularity seeking over meaningful contribution. Visible reactions should not become the only measure of value. Under Serneberg's idea of thumbocracy, visible approval signals influence identity and self-evaluation. The platform's interface turns affirmation into a measurable public response.","example":"Imagine a person deleting a photo because it got fewer likes than usual, then posting a different one for more approval. That focus on visible positive reactions illustrates thumbocracy.","exam":"Thumbocracy is Serneberg’s term for an online culture in which public approval signals such as likes encourage affirmation-seeking. Likes and similar interactions can encourage people to seek affirmation through countable reactions. It connects interface design to identity and social behaviour.\n\nAn Instagram user deletes a photo because it receives fewer likes than expected, even though friends enjoyed it. Under Serneberg's idea of thumbocracy, visible approval signals influence identity and self-evaluation. The platform's interface turns affirmation into a measurable public response. For digital marketers, the concept cautions against equating high engagement counts with healthy social participation or meaningful approval.\n\nAn approval-focused interface can reward popularity seeking over meaningful contribution. Visible reactions should not become the only measure of value."},"exampleType":"illustrative"},{"id":143,"term":"Identity (ethical area)","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":39,"definition":"How people present themselves and manage their digital personas online.","explanation":"Identity concerns how individuals construct and present themselves in digital settings. People may manage profiles or personas differently depending on who they expect to see them. Ethical problems can arise when these identities are misrepresented or exposed to unintended audiences.\n\nPeople present different aspects of themselves for different audiences. Platform design and re-sharing can make managing those boundaries difficult.","example":"Illustrative example: A person presents a formal professional identity on LinkedIn but a playful identity on a private gaming profile. Choosing how to present yourself across settings is an online identity issue.","full":"Digital identity concerns how individuals present and manage themselves in online spaces and how different audiences interpret those representations. People may manage profiles or personas differently depending on who they expect to see them. Ethical problems can arise when these identities are misrepresented or exposed to unintended audiences.\n\nA person may maintain a professional LinkedIn profile and a more informal TikTok persona, each designed for a different audience. Digital identity involves these choices about self-presentation and how others interpret them. Sharing or searching across platforms can expose a persona to people outside its expected context. Ethical platform behavior therefore includes avoiding misrepresentation and respecting others' control over their identities.\n\nPeople present different aspects of themselves for different audiences. Platform design and re-sharing can make managing those boundaries difficult.","category":"ETHICAL FAULT LINES","study":{"simple":"Identity concerns how individuals construct and present themselves in digital settings. People may manage profiles or personas differently depending on who they expect to see them.","why":"People present different aspects of themselves for different audiences. Platform design and re-sharing can make managing those boundaries difficult. Digital identity involves these choices about self-presentation and how others interpret them. Sharing or searching across platforms can expose a persona to people outside its expected context.","example":"A person presents a formal professional identity on LinkedIn but a playful identity on a private gaming profile. Choosing how to present yourself across settings is an online identity issue.","exam":"Digital identity concerns how individuals present and manage themselves in online spaces and how different audiences interpret those representations. People may manage profiles or personas differently depending on who they expect to see them. Ethical problems can arise when these identities are misrepresented or exposed to unintended audiences.\n\nA person may maintain a professional LinkedIn profile and a more informal TikTok persona, each designed for a different audience. Digital identity involves these choices about self-presentation and how others interpret them. Sharing or searching across platforms can expose a persona to people outside its expected context. Ethical platform behavior therefore includes avoiding misrepresentation and respecting others' control over their identities.\n\nPeople present different aspects of themselves for different audiences. Platform design and re-sharing can make managing those boundaries difficult."},"exampleType":"illustrative"},{"id":144,"term":"Privacy (ethical area)","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":39,"definition":"Decisions about sharing personal information and respecting the privacy of other people.","explanation":"Privacy concerns choices about personal information, including one’s own data and other people’s information. The ethical question is not only whether data can be shared, but whether doing so respects the people affected. It therefore extends beyond the convenience of collecting or publishing information.\n\nSharing private details can expose someone who never agreed to take part. Ethical communication should think about the privacy of bystanders too.","example":"Illustrative example: A friend uploads a birthday photo that clearly shows your home address on a parcel in the background. Even if they meant well, they should consider your privacy before sharing it publicly.","full":"Privacy as an ethical area concerns whether sharing or collecting personal information respects the people affected. The ethical question is not only whether data can be shared, but whether doing so respects the people affected. It therefore extends beyond the convenience of collecting or publishing information.\n\nAn influencer filming an Instagram story in a friend's home may reveal personal details or location information without the friend's permission. Even if the creator chooses to share their own experience, the post can affect another person's privacy. The relevant issue is who has authority over the information and who may be harmed by disclosure. Audience interest alone is not a sufficient justification.\n\nSharing private details can expose someone who never agreed to take part. Ethical communication should think about the privacy of bystanders too.","category":"ETHICAL FAULT LINES","study":{"simple":"Privacy concerns choices about personal information, including one’s own data and other people’s information. The ethical question is not only whether data can be shared, but whether doing so respects the people affected.","why":"Sharing private details can expose someone who never agreed to take part. Ethical communication should think about the privacy of bystanders too. Even if the creator chooses to share their own experience, the post can affect another person's privacy. The relevant issue is who has authority over the information and who may be harmed by disclosure.","example":"A friend uploads a birthday photo that clearly shows your home address on a parcel in the background. Even if they meant well, they should consider your privacy before sharing it publicly.","exam":"Privacy as an ethical area concerns whether sharing or collecting personal information respects the people affected. The ethical question is not only whether data can be shared, but whether doing so respects the people affected. It therefore extends beyond the convenience of collecting or publishing information.\n\nAn influencer filming an Instagram story in a friend's home may reveal personal details or location information without the friend's permission. Even if the creator chooses to share their own experience, the post can affect another person's privacy. The relevant issue is who has authority over the information and who may be harmed by disclosure. Audience interest alone is not a sufficient justification.\n\nSharing private details can expose someone who never agreed to take part. Ethical communication should think about the privacy of bystanders too."},"exampleType":"illustrative"},{"id":145,"term":"Ownership and authorship","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":39,"definition":"The ethical area concerned with who owns digital content and who receives credit for it.","explanation":"This area asks who owns digital material and who should receive credit for creating it. Content that is easy to copy online still has an author or origin. Ethical participation requires considering permission and attribution instead of assuming access means unrestricted use.\n\nEasy copying does not remove intellectual rights or the need to credit creators. Responsible publishing checks permission, ownership and attribution.","example":"Illustrative example: A student uses a photographer's picture in a video without permission or credit. The creative result may look good, but ownership and authorship concern who has the rights and who should be acknowledged.","full":"Ownership and authorship is the ethical area concerned with who owns digital content and who receives credit for it. This area asks who owns digital material and who should receive credit for creating it. Content that is easy to copy online still has an author or origin. Ethical participation requires considering permission and attribution instead of assuming access means unrestricted use.\n\nA YouTube creator may include a photographer's image in a video without permission or attribution. The image's accessibility online does not make its authorship disappear, and copying it can create ethical or legal questions about rights. Ownership and authorship ask both who may authorize use and who should receive credit. Responsible publication requires checking those conditions instead of treating discoverability as a license.\n\nEasy copying does not remove intellectual rights or the need to credit creators. Responsible publishing checks permission, ownership and attribution.","category":"ETHICAL FAULT LINES","study":{"simple":"This area asks who owns digital material and who should receive credit for creating it. Content that is easy to copy online still has an author or origin.","why":"Easy copying does not remove intellectual rights or the need to credit creators. Responsible publishing checks permission, ownership and attribution. The image's accessibility online does not make its authorship disappear, and copying it can create ethical or legal questions about rights. Ownership and authorship ask both who may authorize use and who should receive credit.","example":"A student uses a photographer's picture in a video without permission or credit. The creative result may look good, but ownership and authorship concern who has the rights and who should be acknowledged.","exam":"Ownership and authorship is the ethical area concerned with who owns digital content and who receives credit for it. This area asks who owns digital material and who should receive credit for creating it. Content that is easy to copy online still has an author or origin. Ethical participation requires considering permission and attribution instead of assuming access means unrestricted use.\n\nA YouTube creator may include a photographer's image in a video without permission or attribution. The image's accessibility online does not make its authorship disappear, and copying it can create ethical or legal questions about rights. Ownership and authorship ask both who may authorize use and who should receive credit. Responsible publication requires checking those conditions instead of treating discoverability as a license.\n\nEasy copying does not remove intellectual rights or the need to credit creators. Responsible publishing checks permission, ownership and attribution."},"exampleType":"illustrative"},{"id":146,"term":"Credibility (ethical area)","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":40,"definition":"The ethical area concerned with one's own trustworthiness online and the assessment of other people and sources.","explanation":"Credibility concerns both being trustworthy oneself and judging whether online material from others deserves trust. A post, claim or source can spread widely without being reliable. Ethical online behaviour includes examining what supports information before passing it on.\n\nTrustworthiness depends on accurate claims and transparent relationships. Hidden sponsorship or weak evidence can mislead people evaluating a recommendation.","example":"Illustrative example: Imagine a beauty influencer praising a moisturizer after being paid, without explaining the sponsorship. Viewers may mistake the promotion for an independent opinion, creating a credibility problem.","full":"Credibility (ethical area) is the ethical area concerned with one's own trustworthiness online and the review of other people and sources. Credibility concerns both being trustworthy oneself and judging whether online material from others deserves trust. A post, claim or source can spread widely without being reliable. Ethical online behaviour includes examining what supports information before passing it on.\n\nAn influencer reviewing a Samsung phone should disclose a paid partnership so viewers can evaluate potential incentives behind the praise. Credibility concerns the communicator's honesty and the audience's ability to judge source reliability. A polished video or high follower count does not establish accuracy. Evidence, transparency and consistency between claims and experience are more relevant grounds for trust.\n\nTrustworthiness depends on accurate claims and transparent relationships. Hidden sponsorship or weak evidence can mislead people evaluating a recommendation.","category":"ETHICAL FAULT LINES","study":{"simple":"Credibility concerns both being trustworthy oneself and judging whether online material from others deserves trust. A post, claim or source can spread widely without being reliable.","why":"Trustworthiness depends on accurate claims and transparent relationships. Hidden sponsorship or weak evidence can mislead people evaluating a recommendation. Credibility concerns the communicator's honesty and the audience's ability to judge source reliability. A polished video or high follower count does not establish accuracy.","example":"Imagine a beauty influencer praising a moisturizer after being paid, without explaining the sponsorship. Viewers may mistake the promotion for an independent opinion, creating a credibility problem.","exam":"Credibility (ethical area) is the ethical area concerned with one's own trustworthiness online and the review of other people and sources. Credibility concerns both being trustworthy oneself and judging whether online material from others deserves trust. A post, claim or source can spread widely without being reliable. Ethical online behaviour includes examining what supports information before passing it on.\n\nAn influencer reviewing a Samsung phone should disclose a paid partnership so viewers can evaluate potential incentives behind the praise. Credibility concerns the communicator's honesty and the audience's ability to judge source reliability. A polished video or high follower count does not establish accuracy. Evidence, transparency and consistency between claims and experience are more relevant grounds for trust.\n\nTrustworthiness depends on accurate claims and transparent relationships. Hidden sponsorship or weak evidence can mislead people evaluating a recommendation."},"exampleType":"illustrative"},{"id":147,"term":"Participation (ethical area)","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":40,"definition":"The ethical area concerned with conduct, social relations and responsibilities in online communities.","explanation":"Participation addresses how people treat one another in online groups and communities. It includes the responsibilities that come with commenting, sharing and interacting. The course connects meaningful participation with considering the effect of one’s conduct on others.\n\nThe quality of online communities depends on members' conduct. Participation includes responsibility to others, not just the freedom to post.","example":"Illustrative example: Members of a gaming Discord server decide whether to welcome beginners or ridicule their questions. Those choices shape trust and responsibility in the community: the ethics of participation.","full":"Participation as an ethical area concerns respectful conduct, social responsibility and relationships within online communities. It includes the responsibilities that come with commenting, sharing and interacting. The course connects meaningful participation with considering the effect of one’s conduct on others.\n\nA Discord study server becomes more useful when members cite sources, welcome newcomers and moderate harassment instead of reward the loudest participant. Participation as an ethical area concerns how interaction affects other people and the community. Open access to commenting does not guarantee responsible conduct. Designers and moderators influence whether users can contribute safely and meaningfully.\n\nThe quality of online communities depends on members' conduct. Participation includes responsibility to others, not just the freedom to post.","category":"ETHICAL FAULT LINES","study":{"simple":"Participation addresses how people treat one another in online groups and communities. It includes the responsibilities that come with commenting, sharing and interacting.","why":"The quality of online communities depends on members' conduct. Participation includes responsibility to others, not just the freedom to post. Participation as an ethical area concerns how interaction affects other people and the community. Open access to commenting does not guarantee responsible conduct.","example":"Members of a gaming Discord server decide whether to welcome beginners or ridicule their questions. Those choices shape trust and responsibility in the community: the ethics of participation.","exam":"Participation as an ethical area concerns respectful conduct, social responsibility and relationships within online communities. It includes the responsibilities that come with commenting, sharing and interacting. The course connects meaningful participation with considering the effect of one’s conduct on others.\n\nA Discord study server becomes more useful when members cite sources, welcome newcomers and moderate harassment instead of reward the loudest participant. Participation as an ethical area concerns how interaction affects other people and the community. Open access to commenting does not guarantee responsible conduct. Designers and moderators influence whether users can contribute safely and meaningfully.\n\nThe quality of online communities depends on members' conduct. Participation includes responsibility to others, not just the freedom to post."},"exampleType":"illustrative"},{"id":148,"term":"Explicit data","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":40,"definition":"Information a person knowingly provides, such as profile details and posts.","explanation":"A person directly supplies explicit data when they fill out a profile or post information. The important feature is that the information is knowingly provided. The course contrasts this with implicit data inferred from actions and behaviour.\n\nInformation entered deliberately can be more obvious to the user than data inferred in the background. Both types still require responsible handling.","example":"Illustrative example: When someone deliberately fills in their shoe size and preferred style on a shop's profile page, they are giving explicit data. They know which details they typed in.","full":"Explicit data is information a person knowingly gives to a company, such as details they type into a profile or information they post. The person provides it directly. This is different from implicit data, which a company works out from what the person does rather than what they say.\n\nFor example, when someone enters their favourite music genre in a Spotify profile, that is explicit data because they chose to provide the information. Spotify might separately work out music preferences from what the person listens to; that would be implicit data.\n\nGiving information directly does not mean the company is free to use it for anything. The company still needs a clear purpose for collecting and using it, and it must respect the person's privacy and reasonable expectations.","category":"PRIVACY AND DATA","study":{"simple":"A person directly supplies explicit data when they fill out a profile or post information. The important feature is that the information is knowingly provided.","why":"Information entered deliberately can be more obvious to the user than data inferred in the background. Both types still require responsible handling. This differs from a system inferring preferences from listening time. Explicit provision does not automatically authorize every future use of the data.","example":"When someone deliberately fills in their shoe size and preferred style on a shop's profile page, they are giving explicit data. They know which details they typed in.","exam":"Explicit data is information a person knowingly gives to a company, such as details they type into a profile or information they post. The person provides it directly. This is different from implicit data, which a company works out from what the person does rather than what they say.\n\nFor example, when someone enters their favourite music genre in a Spotify profile, that is explicit data because they chose to provide the information. Spotify might separately work out music preferences from what the person listens to; that would be implicit data.\n\nGiving information directly does not mean the company is free to use it for anything. The company still needs a clear purpose for collecting and using it, and it must respect the person's privacy and reasonable expectations."},"exampleType":"illustrative"},{"id":149,"term":"Implicit data","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":40,"definition":"Information inferred from behaviour, such as clicks, time spent and location.","explanation":"Implicit data is taken from patterns of behaviour instead of necessarily being typed into a form. Clicks, time spent and location can help make guesses about a user. The distinction raises questions about whether people understand what their behaviour reveals.\n\nBehavioural inference can reveal interests that users never stated. Marketers need to think carefully about the assumptions and privacy effects of those predictions.","example":"Illustrative example: A video platform notices that someone watches several coffee-making clips to the end, then infers they like coffee equipment. The interest is implicit data inferred from behavior, not an interest they explicitly typed in.","full":"Implicit data is information a company works out from a person's behaviour instead of asking the person to state it directly. It may use clicks, time spent viewing content, or location to guess someone's interests. The important point is that this information is inferred from actions, not knowingly typed into a form.\n\nFor example, imagine someone often watches sneaker videos and clicks links to shoes on TikTok. The platform may guess that they are interested in sneakers, even if they never wrote that in their profile. This can help the platform personalise content, but its guess may be wrong. It may also reveal sensitive interests or behaviour that the user did not realise they were sharing.\n\nCompanies need to treat these guesses carefully, because inferred data is not the same as something a person explicitly said. They must also think about privacy and whether people understand how their behaviour is being used.","category":"PRIVACY AND DATA","study":{"simple":"Implicit data is taken from patterns of behaviour instead of necessarily being typed into a form. Clicks, time spent and location can help make guesses about a user.","why":"Behavioural inference can reveal interests that users never stated. Marketers need to think carefully about the assumptions and privacy effects of those predictions. The user did not necessarily state that interest; it was inferred from behavioral traces. Implicit data can enable personalization but also generate mistakes or reveal sensitive patterns without obvious user awareness.","example":"A video platform notices that someone watches several coffee-making clips to the end, then infers they like coffee equipment. The interest is implicit data inferred from behavior, not an interest they explicitly typed in.","exam":"Implicit data is information a company works out from a person's behaviour instead of asking the person to state it directly. It may use clicks, time spent viewing content, or location to guess someone's interests. The important point is that this information is inferred from actions, not knowingly typed into a form.\n\nFor example, imagine someone often watches sneaker videos and clicks links to shoes on TikTok. The platform may guess that they are interested in sneakers, even if they never wrote that in their profile. This can help the platform personalise content, but its guess may be wrong. It may also reveal sensitive interests or behaviour that the user did not realise they were sharing.\n\nCompanies need to treat these guesses carefully, because inferred data is not the same as something a person explicitly said. They must also think about privacy and whether people understand how their behaviour is being used."},"exampleType":"illustrative"},{"id":150,"term":"FOMO","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":40,"definition":"Fear of missing out.","explanation":"Fear of missing out describes anxiety about being absent from experiences or activities others may be having. Digital feeds can make these alternatives visible and constantly updated. The term helps explain some motivations for repeated online checking\n\nConstantly seeing other people's activities can create pressure to stay connected. Campaigns that exploit exclusion may encourage unhealthy engagement.","example":"Illustrative example: A group posts photos from a concert while one friend stayed home. The friend keeps checking their stories and worries they missed a special moment: fear of missing out, or FOMO.","full":"FOMO, or fear of missing out, describes anxiety about being absent from experiences and interactions that others appear to be having. Continually refreshed social feeds make these alternative experiences highly visible and can encourage habitual checking. The feeling is social instead of just informational: seeing other people participate can make an individual worry about exclusion.\n\nA person might check Instagram repeatedly during a movie premiere because friends are posting stories and the person fears missing a shared experience. FOMO links social visibility with pressure to stay connected. Marketers can exploit that anxiety through urgency and exclusion-based messages, but doing so can harm wellbeing. The phenomenon explains behavior without making the pressure automatically desirable or effective.\n\nConstantly seeing other people's activities can create pressure to stay connected. Campaigns that exploit exclusion may encourage unhealthy engagement.","category":"ONLINE BEHAVIOUR","study":{"simple":"Fear of missing out describes anxiety about being absent from experiences or activities others may be having. Digital feeds can make these alternatives visible and constantly updated.","why":"Constantly seeing other people's activities can create pressure to stay connected. Campaigns that exploit exclusion may encourage unhealthy engagement. FOMO links social visibility with pressure to stay connected. Marketers can exploit that anxiety through urgency and exclusion-based messages, but doing so can harm wellbeing.","example":"A group posts photos from a concert while one friend stayed home. The friend keeps checking their stories and worries they missed a special moment: fear of missing out, or FOMO.","exam":"FOMO, or fear of missing out, describes anxiety about being absent from experiences and interactions that others appear to be having. Continually refreshed social feeds make these alternative experiences highly visible and can encourage habitual checking. The feeling is social instead of just informational: seeing other people participate can make an individual worry about exclusion.\n\nA person might check Instagram repeatedly during a movie premiere because friends are posting stories and the person fears missing a shared experience. FOMO links social visibility with pressure to stay connected. Marketers can exploit that anxiety through urgency and exclusion-based messages, but doing so can harm wellbeing. The phenomenon explains behavior without making the pressure automatically desirable or effective.\n\nConstantly seeing other people's activities can create pressure to stay connected. Campaigns that exploit exclusion may encourage unhealthy engagement."},"exampleType":"illustrative"},{"id":151,"term":"FOBO","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":41,"definition":"Fear of better options.","explanation":"Fear of better options describes hesitation caused by the possibility that a better alternative exists. Having many choices available can make committing to one feel difficult. The concept captures a different pressure from FOMO: uncertainty about choosing instead of exclusion from an experience.\n\nEndless alternatives can make customers postpone a decision. Clear comparisons and limits on unnecessary choice can help them progress.","example":"Illustrative example: Someone compares headphones for weeks and hesitates to buy because a slightly better model might appear tomorrow. That fear of a better choice is FOBO, rather than fear of missing an event.","full":"FOBO, or fear of better options, describes difficulty committing to a decision because another alternative might be superior. The abundance of choices visible online can make comparison feel endless. It differs from FOMO, which centres on missing a shared experience, because FOBO concerns the risk of making the wrong selection.\n\nSomeone choosing between Samsung phones may postpone buying because they imagine a better model or deal might appear next week. FOBO is the fear of selecting one option while a potentially superior alternative exists. Unlike FOMO, which concerns missing an experience, it creates decision paralysis through comparison. Clear, relevant criteria can support choice better than endless alternatives and manufactured urgency.\n\nEndless alternatives can make customers postpone a decision. Clear comparisons and limits on unnecessary choice can help them progress.","category":"ONLINE BEHAVIOUR","study":{"simple":"Fear of better options describes hesitation caused by the possibility that a better alternative exists. Having many choices available can make committing to one feel difficult.","why":"Endless alternatives can make customers postpone a decision. Clear comparisons and limits on unnecessary choice can help them progress. FOBO is the fear of selecting one option while a potentially superior alternative exists. Unlike FOMO, which concerns missing an experience, it creates decision paralysis through comparison.","example":"Someone compares headphones for weeks and hesitates to buy because a slightly better model might appear tomorrow. That fear of a better choice is FOBO, rather than fear of missing an event.","exam":"FOBO, or fear of better options, describes difficulty committing to a decision because another alternative might be superior. The abundance of choices visible online can make comparison feel endless. It differs from FOMO, which centres on missing a shared experience, because FOBO concerns the risk of making the wrong selection.\n\nSomeone choosing between Samsung phones may postpone buying because they imagine a better model or deal might appear next week. FOBO is the fear of selecting one option while a potentially superior alternative exists. Unlike FOMO, which concerns missing an experience, it creates decision paralysis through comparison. Clear, relevant criteria can support choice better than endless alternatives and manufactured urgency.\n\nEndless alternatives can make customers postpone a decision. Clear comparisons and limits on unnecessary choice can help them progress."},"exampleType":"illustrative"},{"id":152,"term":"IWWIWWIWI","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":41,"definition":"I want what I want when I want it.","explanation":"The phrase expresses an expectation of immediate access and satisfaction: “I want what I want when I want it.” The lecture uses it to describe a culture of on-demand digital experiences. Users become accustomed to choosing the content or service at a time that suits them.\n\nOn-demand access changes expectations of speed and convenience. Services must decide where immediate delivery genuinely helps users and where it creates pressure.","example":"Illustrative example: A person expects to start a favourite show instantly on a phone during the bus ride instead of waiting for a scheduled broadcast. That expectation is 'I want what I want when I want it.'","full":"IWWIWWIWI stands for “I want what I want when I want it,” a phrase describing expectations of immediate, on-demand access to digital services. The phrase expresses an expectation of immediate access and satisfaction: “I want what I want when I want it.” The lecture uses it to describe a culture of on-demand digital experiences. Users become accustomed to choosing the content or service at a time that suits them.\n\nA Netflix subscriber expects to select a programme and start watching immediately instead of wait for a broadcast schedule. The phrase 'I want what I want when I want it' captures expectations shaped by on-demand services. Convenience can increase perceived value, but instant access may also intensify pressure on providers and reduce tolerance for delays. The concept describes a cultural demand, not a universal entitlement.\n\nOn-demand access changes expectations of speed and convenience. Services must decide where immediate delivery genuinely helps users and where it creates pressure.","category":"ONLINE BEHAVIOUR","study":{"simple":"The phrase expresses an expectation of immediate access and satisfaction: “I want what I want when I want it.” The lecture uses it to describe a culture of on-demand digital experiences. Users become accustomed to choosing the content or service at a time that suits them.","why":"On-demand access changes expectations of speed and convenience. Services must decide where immediate delivery genuinely helps users and where it creates pressure. The phrase 'I want what I want when I want it' captures expectations shaped by on-demand services. Convenience can increase perceived value, but instant access may also intensify pressure on providers and reduce tolerance for delays.","example":"A person expects to start a favourite show instantly on a phone during the bus ride instead of waiting for a scheduled broadcast. That expectation is 'I want what I want when I want it.'","exam":"IWWIWWIWI stands for “I want what I want when I want it,” a phrase describing expectations of immediate, on-demand access to digital services. The phrase expresses an expectation of immediate access and satisfaction: “I want what I want when I want it.” The lecture uses it to describe a culture of on-demand digital experiences. Users become accustomed to choosing the content or service at a time that suits them.\n\nA Netflix subscriber expects to select a programme and start watching immediately instead of wait for a broadcast schedule. The phrase 'I want what I want when I want it' captures expectations shaped by on-demand services. Convenience can increase perceived value, but instant access may also intensify pressure on providers and reduce tolerance for delays. The concept describes a cultural demand, not a universal entitlement.\n\nOn-demand access changes expectations of speed and convenience. Services must decide where immediate delivery genuinely helps users and where it creates pressure."},"exampleType":"illustrative"},{"id":153,"term":"Appointment culture","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":41,"definition":"A media culture in which audiences watch at the same scheduled broadcast time.","explanation":"In appointment culture, media consumption follows a set schedule and people must watch at the designated broadcast time. Audiences are organised around the provider’s timetable. The course contrasts this with the greater freedom and participation of engagement culture.\n\nScheduled broadcasting gathers audiences at a shared moment. Marketing placements and audience habits follow that fixed timing.","example":"Illustrative example: A family plans its evening around a TV talent-show finale broadcast at 8 p.m. Everyone watches when the broadcaster decides: that is appointment culture.","full":"Appointment culture is a media culture in which audiences watch at the same scheduled broadcast time. In appointment culture, media consumption follows a set schedule and people must watch at the designated broadcast time. Audiences are organised around the provider’s timetable. The course contrasts this with the greater freedom and participation of engagement culture.\n\nA family planning to watch a television premiere at 20:00 follows appointment culture because the broadcaster fixes the shared viewing time. That schedule can create collective anticipation and make advertising exposure predictable within a programme slot. Viewers have less control than with streaming on demand. The contrast explains how digital distribution changes both audience habits and the timing of marketing opportunities.\n\nScheduled broadcasting gathers audiences at a shared moment. Marketing placements and audience habits follow that fixed timing.","category":"PARTICIPATION","study":{"simple":"In appointment culture, media consumption follows a set schedule and people must watch at the designated broadcast time. Audiences are organised around the provider’s timetable.","why":"Scheduled broadcasting gathers audiences at a shared moment. Marketing placements and audience habits follow that fixed timing. That schedule can create collective anticipation and make advertising exposure predictable within a programme slot. Viewers have less control than with streaming on demand.","example":"A family plans its evening around a TV talent-show finale broadcast at 8 p.m. Everyone watches when the broadcaster decides: that is appointment culture.","exam":"Appointment culture is a media culture in which audiences watch at the same scheduled broadcast time. In appointment culture, media consumption follows a set schedule and people must watch at the designated broadcast time. Audiences are organised around the provider’s timetable. The course contrasts this with the greater freedom and participation of engagement culture.\n\nA family planning to watch a television premiere at 20:00 follows appointment culture because the broadcaster fixes the shared viewing time. That schedule can create collective anticipation and make advertising exposure predictable within a programme slot. Viewers have less control than with streaming on demand. The contrast explains how digital distribution changes both audience habits and the timing of marketing opportunities.\n\nScheduled broadcasting gathers audiences at a shared moment. Marketing placements and audience habits follow that fixed timing."},"exampleType":"illustrative"},{"id":154,"term":"Engagement culture","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":41,"definition":"A media culture in which audiences watch, discuss and participate on their own terms.","explanation":"Audiences can watch, discuss, share and participate when and how they choose. This changes the relationship between media publishers and audiences, who are no longer only scheduled viewers. It also connects consumption with participation and social interaction.\n\nPeople can watch and respond when convenient instead of only consuming at a fixed time. Participation becomes part of the media experience.","example":"Illustrative example: Fans watch a talent show later, share clips, vote in an app and discuss performances with friends online. They're actively participating on their own schedules: engagement culture.","full":"Engagement culture is a media culture in which audiences watch, discuss and participate on their own terms. Audiences can watch, discuss, share and participate when and how they choose. This changes the relationship between media publishers and audiences, who are no longer only scheduled viewers. It also connects consumption with participation and social interaction.\n\nFans can stream a Netflix series when convenient, post TikTok reactions and discuss theories in online communities. They are not merely a synchronized audience: they also circulate interpretations and content. Engagement culture describes this more flexible, participatory relationship to media. Brands can facilitate discussion, but fan responses may evolve independently and may not align with official promotional messages.\n\nPeople can watch and respond when convenient instead of only consuming at a fixed time. Participation becomes part of the media experience.","category":"PARTICIPATION","study":{"simple":"Audiences can watch, discuss, share and participate when and how they choose. This changes the relationship between media publishers and audiences, who are no longer only scheduled viewers.","why":"People can watch and respond when convenient instead of only consuming at a fixed time. Participation becomes part of the media experience. They are not merely a synchronized audience: they also circulate interpretations and content. Engagement culture describes this more flexible, participatory relationship to media.","example":"Fans watch a talent show later, share clips, vote in an app and discuss performances with friends online. They're actively participating on their own schedules: engagement culture.","exam":"Engagement culture is a media culture in which audiences watch, discuss and participate on their own terms. Audiences can watch, discuss, share and participate when and how they choose. This changes the relationship between media publishers and audiences, who are no longer only scheduled viewers. It also connects consumption with participation and social interaction.\n\nFans can stream a Netflix series when convenient, post TikTok reactions and discuss theories in online communities. They are not merely a synchronized audience: they also circulate interpretations and content. Engagement culture describes this more flexible, participatory relationship to media. Brands can facilitate discussion, but fan responses may evolve independently and may not align with official promotional messages.\n\nPeople can watch and respond when convenient instead of only consuming at a fixed time. Participation becomes part of the media experience."},"exampleType":"illustrative"},{"id":155,"term":"Binge-watching","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":42,"definition":"Watching multiple episodes, or an entire season, of a programme in one sitting.","explanation":"Binge-watching occurs when someone watches several episodes in succession instead of waiting for separate scheduled broadcasts. It is a clear example of on-demand habits. The concept connects with the shift from appointment culture toward audiences choosing their own viewing patterns.\n\nContinuous access encourages viewers to consume multiple episodes in one sitting. Platforms should think about both user convenience and the effects on attention and wellbeing.","example":"Illustrative example: Someone watches an entire eight-episode mystery season in one weekend rather than one episode each week. That is binge-watching, regardless of which streaming service they use.","full":"Binge-watching refers to watching several episodes of a television series consecutively in one sitting. It is a clear example of on-demand habits. The concept connects with the shift from appointment culture toward audiences choosing their own viewing patterns.\n\nSomeone who watches six Netflix episodes in one evening is binge-watching instead of following weekly release intervals. On-demand availability and recommendations can make continuous consumption convenient and attractive. The experience may strengthen immersion and immediate engagement, but long sessions also raise questions about attention and wellbeing. Total viewing time should not be mistaken for an unqualified measure of user benefit.\n\nContinuous access encourages viewers to consume multiple episodes in one sitting. Platforms should think about both user convenience and the effects on attention and wellbeing.","study":{"simple":"Binge-watching occurs when someone watches several episodes in succession instead of waiting for separate scheduled broadcasts. It is a clear example of on-demand habits.","why":"Continuous access encourages viewers to consume multiple episodes in one sitting. Platforms should think about both user convenience and the effects on attention and wellbeing. On-demand availability and recommendations can make continuous consumption convenient and attractive. The experience may strengthen immersion and immediate engagement, but long sessions also raise questions about attention and wellbeing.","example":"Someone watches an entire eight-episode mystery season in one weekend rather than one episode each week. That is binge-watching, regardless of which streaming service they use.","exam":"Binge-watching refers to watching several episodes of a television series consecutively in one sitting. It is a clear example of on-demand habits. The concept connects with the shift from appointment culture toward audiences choosing their own viewing patterns.\n\nSomeone who watches six Netflix episodes in one evening is binge-watching instead of following weekly release intervals. On-demand availability and recommendations can make continuous consumption convenient and attractive. The experience may strengthen immersion and immediate engagement, but long sessions also raise questions about attention and wellbeing. Total viewing time should not be mistaken for an unqualified measure of user benefit.\n\nContinuous access encourages viewers to consume multiple episodes in one sitting. Platforms should think about both user convenience and the effects on attention and wellbeing."},"exampleType":"illustrative"}];</script><script>window.EXAM_QUESTIONS=[{"number":1,"kind":"mcq","prompt":"What is an objective in marketing?","options":["A creative idea for a campaign","A type of media buying decision","A measurable goal a company wants to achieve","The distribution channel used for advertising"],"answer":"A measurable goal a company wants to achieve"},{"number":2,"kind":"mcq","prompt":"According to Binet and Carter (2018), what increases campaign success?","options":["The clarity of the campaign’s objective","Increasing vanity metrics","Using more ad placements","Relying on technology"],"answer":"The clarity of the campaign’s objective"},{"number":3,"kind":"mcq","prompt":"What does KPI stand for?","options":["Knowledge Performance Insight","Key Process Integration","Key Product Indicator","Key Performance Indicator"],"answer":"Key Performance Indicator"},{"number":4,"kind":"mcq","prompt":"The “Job to Be Done” theory suggests customers:","options":["Hire products to make progress in a specific circumstance","Follow linear decision-making steps","Choose products based solely on price","Buy products because of demographics"],"answer":"Hire products to make progress in a specific circumstance"},{"number":5,"kind":"mcq","prompt":"The marketing funnel primarily helps marketers:","options":["Plan ad creatives","Avoid defining audiences","Design logos","Structure objectives along the customer journey"],"answer":"Structure objectives along the customer journey"},{"number":6,"kind":"mcq","prompt":"Which of these is NOT a stage in a typical marketing funnel?","options":["Awareness","Ownership","Consideration","Conversion"],"answer":"Ownership"},{"number":7,"kind":"mcq","prompt":"According to Cognitive Load Theory, our working memory is:","options":["Unlimited in capacity","Independent of attention","Responsible for long-term storage","Easily overloaded"],"answer":"Easily overloaded"},{"number":8,"kind":"mcq","prompt":"What is the main goal of SEO?","options":["To help users find and choose you through organic search","To design creative advertisements","To increase paid media reach","To improve follower count"],"answer":"To help users find and choose you through organic search"},{"number":9,"kind":"mcq","prompt":"Which of these is NOT a component of SEO?","options":["Paid SEO","On-page SEO","Off-page SEO","Technical SEO"],"answer":"Paid SEO"},{"number":10,"kind":"mcq","prompt":"What does SERP stand for?","options":["Search Engine Result Page","Site Evaluation and Ranking Process","Search Engine Ranking Protocol","Search Evaluation Result Page"],"answer":"Search Engine Result Page"},{"number":11,"kind":"mcq","prompt":"What does outbound marketing primarily do?","options":["Attracts audiences organically","Pushes messages to audiences who didn’t request them","Relies on earned media only","Focuses on SEO and search intent"],"answer":"Pushes messages to audiences who didn’t request them"},{"number":12,"kind":"mcq","prompt":"Which of the following is a type of paid media?","options":["Organic social posts in the feed","Blog posts","Instagram feed ads","Press releases"],"answer":"Instagram feed ads"},{"number":13,"kind":"mcq","prompt":"Which of these is NOT part of a paid media campaign structure?","options":["Distribution","Creative","Keyword density","Objective"],"answer":"Keyword density"},{"number":14,"kind":"mcq","prompt":"In digital advertising, the creative refers to:","options":["The media budget","The website code","The analytics report","The ad’s visual and textual content"],"answer":"The ad’s visual and textual content"},{"number":15,"kind":"mcq","prompt":"What does CTA stand for?","options":["Call to Action","Conversion Tracking Algorithm","Click Through Advertising","Campaign Target Analysis"],"answer":"Call to Action"},{"number":16,"kind":"mcq","prompt":"Which principle explains why limited offers drive urgency?","options":["Framing effect","Decoy effect","Priming","Scarcity"],"answer":"Scarcity"},{"number":17,"kind":"mcq","prompt":"What is the purpose of trust signals on a landing page?","options":["To test multiple CTAs","To create visual clutter","To improve color contrast","To make users feel secure and confident"],"answer":"To make users feel secure and confident"},{"number":18,"kind":"mcq","prompt":"Which statement about brand distinctiveness is TRUE?","options":["Uniqueness always equals market share","Being different is more important than being distinct","Distinctive assets reduce confusion and speed recognition","Distinctiveness is only visual"],"answer":"Distinctive assets reduce confusion and speed recognition"},{"number":19,"kind":"short","prompt":"What is the definition of Marketing? (2 points)","options":[],"guidance":"Compare your response with the related lecture notes and the 156-term glossary. Written responses are self-assessed; no automatic score is assigned."},{"number":20,"kind":"short","prompt":"What is the definition of Digital Marketing? (2 points)","options":[],"guidance":"Compare your response with the related lecture notes and the 156-term glossary. Written responses are self-assessed; no automatic score is assigned."},{"number":21,"kind":"short","prompt":"Define search intent and list its four main types. (2 points)","options":[],"guidance":"Compare your response with the related lecture notes and the 156-term glossary. Written responses are self-assessed; no automatic score is assigned."},{"number":22,"kind":"short","prompt":"Explain briefly what an objective–distribution–creative structure means in advertising. (2 points)","options":[],"guidance":"Compare your response with the related lecture notes and the 156-term glossary. Written responses are self-assessed; no automatic score is assigned."},{"number":23,"kind":"short","prompt":"Name the three components of distribution in digital advertising. (2 points)","options":[],"guidance":"Compare your response with the related lecture notes and the 156-term glossary. Written responses are self-assessed; no automatic score is assigned."},{"number":24,"kind":"short","prompt":"What does framing mean in marketing? (2 points)","options":[],"guidance":"Compare your response with the related lecture notes and the 156-term glossary. Written responses are self-assessed; no automatic score is assigned."},{"number":25,"kind":"long","prompt":"Explain how measurement and KPIs are used to evaluate digital marketing efforts. Discuss how KPIs should be connected to objectives rather than platforms or tools. Explain common pitfalls in measurement and provide examples of how success can be evaluated at different stages of the marketing funnel (10 points).","options":[],"guidance":"Compare your response with the related lecture notes and the 156-term glossary. Written responses are self-assessed; no automatic score is assigned."},{"number":26,"kind":"long","prompt":"Explain the importance of creative (ad content) in digital advertising. Discuss how message clarity, format, and audience adaptation influence performance. Explain how creative choices interact with objectives and distribution, and give examples of how creative should differ across platforms or funnel stages (10 points).","options":[],"guidance":"Compare your response with the related lecture notes and the 156-term glossary. Written responses are self-assessed; no automatic score is assigned."},{"number":27,"kind":"long","prompt":"Define inbound marketing and discuss its key characteristics. Compare it briefly with outbound marketing and provide examples of outbound tactics in the digital environment (10 points).","options":[],"guidance":"Compare your response with the related lecture notes and the 156-term glossary. Written responses are self-assessed; no automatic score is assigned."},{"number":28,"kind":"long","prompt":"Explain the role of distribution and budget allocation in digital marketing. Discuss how distribution choices across channels and audiences influence campaign outcomes. Explain the relationship between objectives, distribution, and budget, and give examples of how different objectives require different distribution strategies (10 points).","options":[],"guidance":"Compare your response with the related lecture notes and the 156-term glossary. Written responses are self-assessed; no automatic score is assigned."},{"number":"Exam A-L1","kind":"long","prompt":"Explain how measurement and KPIs are used to evaluate digital marketing efforts. Discuss how KPIs should be connected to objectives rather than platforms or tools. Explain common pitfalls in measurement and provide examples of how success can be evaluated at different stages of the marketing funnel","source":"Exam A"},{"number":"Exam A-L2","kind":"long","prompt":"Explain the importance of creative (ad content) in digital advertising. Discuss how message clarity, format, and audience adaptation influence performance. Explain how creative choices interact with objectives and distribution, and give examples of how creative should differ across platforms or funnel stages","source":"Exam A"},{"number":"Exam A-L3","kind":"long","prompt":"Define inbound marketing and discuss its key characteristics. Compare it briefly with outbound marketing and provide examples of outbound tactics in the digital environment","source":"Exam A"},{"number":"Exam A-L4","kind":"long","prompt":"Explain the role of distribution and budget allocation in digital marketing. Discuss how distribution choices across channels and audiences influence campaign outcomes. Explain the relationship between objectives, distribution, and budget, and give examples of how different objectives require different distribution strategies","source":"Exam A"},{"number":"Exam B-L1","kind":"long","prompt":"Explain the role of objectives in digital marketing. Discuss why setting clear, measurable objectives is essential and how the marketing funnel can help define them","source":"Exam B"},{"number":"Exam B-L2","kind":"long","prompt":"Describe what an SEO audit should consist of. Explain the difference between the three components, and give examples of what each includes","source":"Exam B"},{"number":"Exam B-L3","kind":"long","prompt":"Define outbound marketing and discuss its key characteristics. Compare it briefly with inbound marketing and provide examples of outbound tactics in the digital environment","source":"Exam B"},{"number":"Exam B-L4","kind":"long","prompt":"Explain the importance of landing pages in digital campaigns. Discuss and provide examples on how consistency, cognitive load, and psychological principles affect landing page effectiveness","source":"Exam B"},{"number":"Study-L1","kind":"long","prompt":"Explain the difference between an objective, a KPI and a metric. Develop a realistic campaign example with an objective, relevant KPIs and supporting metrics.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-L2","kind":"long","prompt":"Explain the Jobs to Be Done approach and compare it with demographic segmentation. Discuss functional, emotional and social jobs using a recognizable product.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-L3","kind":"long","prompt":"Compare inbound and outbound marketing using the concepts of attraction and interruption. Explain when each approach is useful and provide concrete brand examples.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-L4","kind":"long","prompt":"Explain the four types of search intent, how they relate to the marketing funnel, and which page or content format serves each intent.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-L5","kind":"long","prompt":"Explain how Cognitive Load Theory can guide advertising and landing-page design. Discuss working memory, long-term memory, intrinsic load and extraneous load.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-L6","kind":"long","prompt":"Describe the three components of SEO (technical, on-site and off-site), how they work together and what issues a practical audit should prioritize.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-L7","kind":"long","prompt":"Compare SEO with GEO and discuss answer engines, answer blocks, entities, structured data and how content might be cited in AI-generated answers.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-L8","kind":"long","prompt":"Explain how the marketing funnel supports objectives and calls to action across awareness, consideration, conversion and loyalty, using one continuous brand example.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-L9","kind":"long","prompt":"Discuss programmatic advertising, dark pools, the subprime attention argument, viewability, attribution and incrementality. Explain why reported clicks may not equal genuine marketing impact.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-L10","kind":"long","prompt":"Discuss the ethical challenges of online marketing using identity, privacy, ownership and authorship, credibility and participation. Apply the five ethical areas to a realistic brand scenario.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-S1","kind":"short","prompt":"Define KPI and explain how it differs from a general metric; give an example.","source":"Additional course-aligned practice (not a verbatim past exam)"},{"number":"Study-S2","kind":"short","prompt":"What is the fundamental difference between demographic segment
