</style><style> .exam-review summary::marker{color:#27769a} .exam-review .modelAnswer p{font-size:14px;line-height:1.85;white-space:normal;margin:0 0 12px;color:#132c3b}.exam-review h4{color:#16456b} .exam-review b{color:#153b57} .exam-review .tinyLabel{color:#175b7a}</style></head><body><div id="app"></div><script>window.TERMS=[{"id":0,"term":"Marketing","lecture":"Lecture 1 · Marketing, technology and change","page":1,"definition":"The activity of creating, communicating and delivering value. Marketing begins with value, and advertising is only one of the many things marketing does.","explanation":"The starting point is the value offered to the customer, not the advertisement used to promote it. Research, segmentation, product development, pricing, distribution, branding, content, service and customer relationships are all marketing activities. A campaign cannot compensate for an offer that does not create value for the people it is meant to serve.\n\nA company that only focuses on promotion can attract visitors without giving them a reason to buy or return. Value, pricing, availability and customer experience must work together.","example":"Real-world example: Patagonia accepts eligible used clothing through its trade-in program and gives customers credit. That decision involves the product, pricing, service and customer relationship—not merely an advert. It shows marketing creating value before and after a sale.","full":"Marketing is the process of creating, communicating and delivering value to customers. It includes far more than advertising. The starting point is the value offered to the customer, not the advertisement used to promote it. Research, segmentation, product development, pricing, distribution, branding, content, service and customer relationships are all marketing activities. A campaign cannot compensate for an offer that does not create value for the people it is meant to serve.\n\nConsider IKEA deciding how to design a compact wardrobe, price it affordably, make it available online and in stores, and provide understandable assembly instructions. These decisions collectively create customer value. A beautiful Instagram advertisement could attract attention, but it cannot rescue a wardrobe that does not fit the intended customer's needs. Marketing therefore begins before promotion and continues after purchase.\n\nA company that only focuses on promotion can attract visitors without giving them a reason to buy or return. Value, pricing, availability and customer experience must work together.","category":"MARKETING FUNDAMENTALS","study":{"simple":"The starting point is the value offered to the customer, not the advertisement used to promote it. Research, segmentation, product development, pricing, distribution, branding, content, service and customer relationships are all marketing activities.","why":"A company that only focuses on promotion can attract visitors without giving them a reason to buy or return. Value, pricing, availability and customer experience must work together. These decisions collectively create customer value. A beautiful Instagram advertisement could attract attention, but it cannot rescue a wardrobe that does not fit the intended customer's needs.","example":"Patagonia accepts eligible used clothing through its trade-in program and gives customers credit. That decision involves the product, pricing, service and customer relationship—not merely an advert. It shows marketing creating value before and after a sale.","exam":"Marketing is the process of creating, communicating and delivering value to customers. It includes far more than advertising. The starting point is the value offered to the customer, not the advertisement used to promote it. Research, segmentation, product development, pricing, distribution, branding, content, service and customer relationships are all marketing activities. A campaign cannot compensate for an offer that does not create value for the people it is meant to serve.\n\nConsider IKEA deciding how to design a compact wardrobe, price it affordably, make it available online and in stores, and provide understandable assembly instructions. These decisions collectively create customer value. A beautiful Instagram advertisement could attract attention, but it cannot rescue a wardrobe that does not fit the intended customer's needs. Marketing therefore begins before promotion and continues after purchase.\n\nA company that only focuses on promotion can attract visitors without giving them a reason to buy or return. Value, pricing, availability and customer experience must work together."},"exampleType":"real","exampleSource":"https://www.patagonia.com/trade-in/"},{"id":1,"term":"Advertising","lecture":"Lecture 1 · Marketing, technology and change","page":1,"definition":"Paid communication. It is one marketing activity among many, and it exists both online and offline.","explanation":"Advertising is a specific communication activity within the wider field of marketing. Paying for a social media ad, a search ad or a billboard is advertising; developing the offer, setting its price and serving customers are also marketing, but are not themselves advertising. The defining feature is the paid communication, not whether the channel is digital.\n\nBuying attention can introduce a product to new customers, but the exposure itself does not show whether the product delivered value or produced sales.","example":"Illustrative example: Imagine seeing a paid poster for a neighbourhood bakery at a bus stop. The bakery is paying to place a message in front of passers-by: that's advertising, whether the poster is printed or digital.","full":"Advertising is paid communication used to present a message to an audience. It is one activity within marketing, not the whole discipline. Advertising is a specific communication activity within the wider field of marketing. Paying for a social media ad, a search ad or a billboard is advertising; developing the offer, setting its price and serving customers are also marketing, but are not themselves advertising. The defining feature is the paid communication, not whether the channel is digital.\n\nImagine Nike buys an Instagram ad promoting a particular running shoe. The payment for that placement is what makes it advertising; the same message shared voluntarily by a customer would not be paid advertising. The ad may create awareness, but whether the shoe meets runners' needs depends on broader marketing decisions. Reach should not be confused with value delivered.\n\nBuying attention can introduce a product to new customers, but the exposure itself does not show whether the product delivered value or produced sales.","category":"MARKETING FUNDAMENTALS","study":{"simple":"Advertising is a specific communication activity within the wider field of marketing. Paying for a social media ad, a search ad or a billboard is advertising; developing the offer, setting its price and serving customers are also marketing, but are not themselves advertising.","why":"Buying attention can introduce a product to new customers, but the exposure itself does not show whether the product delivered value or produced sales. The payment for that placement is what makes it advertising; the same message shared voluntarily by a customer would not be paid advertising. The ad may create awareness, but whether the shoe meets runners' needs depends on broader marketing decisions.","example":"Imagine seeing a paid poster for a neighbourhood bakery at a bus stop. The bakery is paying to place a message in front of passers-by: that's advertising, whether the poster is printed or digital.","exam":"Advertising is paid communication used to present a message to an audience. It is one activity within marketing, not the whole discipline. Advertising is a specific communication activity within the wider field of marketing. Paying for a social media ad, a search ad or a billboard is advertising; developing the offer, setting its price and serving customers are also marketing, but are not themselves advertising. The defining feature is the paid communication, not whether the channel is digital.\n\nImagine Nike buys an Instagram ad promoting a particular running shoe. The payment for that placement is what makes it advertising; the same message shared voluntarily by a customer would not be paid advertising. The ad may create awareness, but whether the shoe meets runners' needs depends on broader marketing decisions. Reach should not be confused with value delivered.\n\nBuying attention can introduce a product to new customers, but the exposure itself does not show whether the product delivered value or produced sales."},"exampleType":"illustrative"},{"id":2,"term":"Digital marketing","lecture":"Lecture 1 · Marketing, technology and change","page":1,"definition":"Marketing carried out in a digital environment. It applies the same fundamentals as all marketing — product, price, place and promotion — but depends on technology.","explanation":"Digital technology changes how each of the four Ps operates: products may become services, prices can be compared or adjusted rapidly, place includes search results and feeds, and promotion can travel through brands, partners and customers. It also depends on the digital environment through which people discover and interact with offers. Digital marketing is broader than paid digital advertising.\n\nCustomers move between discovery, comparison, purchase and support on digital channels. Optimising only the ad leaves gaps elsewhere in that journey.","example":"Real-world example: Spotify Wrapped turns listening data into personalized year-end stories people can view and share. It combines a digital service, customer data and communication, showing why digital marketing is more than buying online ads.","full":"Digital marketing applies the broader principles of marketing through digital technologies and channels, including product, price, place and promotion. Digital technology changes how each of the four Ps operates: products may become services, prices can be compared or adjusted rapidly, place includes search results and feeds, and promotion can travel through brands, partners and customers. It also depends on the digital environment through which people discover and interact with offers. Digital marketing is broader than paid digital advertising.\n\nSpotify illustrates the breadth of digital marketing: users discover playlists, encounter subscription plans, pay in an app and receive personalized recommendations and digital support. These touchpoints shape the experience even when no sponsored advertisement is involved. The organization must coordinate product design, price, discovery and customer relationships across connected technologies instead of treat its social ads as the entire strategy.\n\nCustomers move between discovery, comparison, purchase and support on digital channels. Optimising only the ad leaves gaps elsewhere in that journey.","category":"MARKETING FUNDAMENTALS","study":{"simple":"Digital technology changes how each of the four Ps operates: products may become services, prices can be compared or adjusted rapidly, place includes search results and feeds, and promotion can travel through brands, partners and customers. It also depends on the digital environment through which people discover and interact with offers.","why":"Customers move between discovery, comparison, purchase and support on digital channels. Optimising only the ad leaves gaps elsewhere in that journey. These touchpoints shape the experience even when no sponsored advertisement is involved. The organization must coordinate product design, price, discovery and customer relationships across connected technologies instead of treat its social ads as the entire strategy.","example":"Spotify Wrapped turns listening data into personalized year-end stories people can view and share. It combines a digital service, customer data and communication, showing why digital marketing is more than buying online ads.","exam":"Digital marketing applies the broader principles of marketing through digital technologies and channels, including product, price, place and promotion. Digital technology changes how each of the four Ps operates: products may become services, prices can be compared or adjusted rapidly, place includes search results and feeds, and promotion can travel through brands, partners and customers. It also depends on the digital environment through which people discover and interact with offers. Digital marketing is broader than paid digital advertising.\n\nSpotify illustrates the breadth of digital marketing: users discover playlists, encounter subscription plans, pay in an app and receive personalized recommendations and digital support. These touchpoints shape the experience even when no sponsored advertisement is involved. The organization must coordinate product design, price, discovery and customer relationships across connected technologies instead of treat its social ads as the entire strategy.\n\nCustomers move between discovery, comparison, purchase and support on digital channels. Optimising only the ad leaves gaps elsewhere in that journey."},"exampleType":"real","exampleSource":"https://newsroom.spotify.com/2025-12-03/2025-wrapped-user-experience/"},{"id":3,"term":"Digital advertising","lecture":"Lecture 1 · Marketing, technology and change","page":2,"definition":"Paid communication placed in digital channels. It is only one part of digital marketing.","explanation":"The lecture identifies paid search, paid social, display and programmatic advertising, and paid influencer partnerships as examples. These are different ways of paying to place promotional messages online. SEO, organic social media, digital services and customer experience can be part of digital marketing without being paid advertising.\n\nDigital ads can reach particular audiences and be measured quickly, but impressions or clicks are not proof that a person paid attention or became a customer.","example":"Illustrative example: Imagine a sponsored video for a new electric toothbrush playing before a YouTube tutorial. Because the company paid for that placement in a digital channel, it is digital advertising rather than an unpaid recommendation.","full":"Digital advertising is paid promotional communication distributed through digital channels, such as paid search, social media placements and pre-roll video. The lecture identifies paid search, paid social, display and programmatic advertising, and paid influencer partnerships as examples. These are different ways of paying to place promotional messages online. SEO, organic social media, digital services and customer experience can be part of digital marketing without being paid advertising.\n\nA paid pre-roll for a Samsung phone before a YouTube video is digital advertising because Samsung pays to place a promotional message in a digital channel. A helpful unpaid Samsung support guide is digital marketing but not advertising. This distinction matters when evaluating budgets: paid media purchases exposure, while useful services and content can create value outside the paid placement.\n\nDigital ads can reach particular audiences and be measured quickly, but impressions or clicks are not proof that a person paid attention or became a customer.","category":"MARKETING FUNDAMENTALS","study":{"simple":"The lecture identifies paid search, paid social, display and programmatic advertising, and paid influencer partnerships as examples. These are different ways of paying to place promotional messages online.","why":"Digital ads can reach particular audiences and be measured quickly, but impressions or clicks are not proof that a person paid attention or became a customer. A helpful unpaid Samsung support guide is digital marketing but not advertising. This distinction matters when evaluating budgets: paid media purchases exposure, while useful services and content can create value outside the paid placement.","example":"Imagine a sponsored video for a new electric toothbrush playing before a YouTube tutorial. Because the company paid for that placement in a digital channel, it is digital advertising rather than an unpaid recommendation.","exam":"Digital advertising is paid promotional communication distributed through digital channels, such as paid search, social media placements and pre-roll video. The lecture identifies paid search, paid social, display and programmatic advertising, and paid influencer partnerships as examples. These are different ways of paying to place promotional messages online. SEO, organic social media, digital services and customer experience can be part of digital marketing without being paid advertising.\n\nA paid pre-roll for a Samsung phone before a YouTube video is digital advertising because Samsung pays to place a promotional message in a digital channel. A helpful unpaid Samsung support guide is digital marketing but not advertising. This distinction matters when evaluating budgets: paid media purchases exposure, while useful services and content can create value outside the paid placement.\n\nDigital ads can reach particular audiences and be measured quickly, but impressions or clicks are not proof that a person paid attention or became a customer."},"exampleType":"illustrative"},{"id":4,"term":"The four Ps (marketing mix)","lecture":"Lecture 1 · Marketing, technology and change","page":2,"definition":"Product, price, place and promotion — the marketing mix. It still matters in a digital environment, but each P changes: products become services, prices become dynamic, place becomes search and feed.","explanation":"Product asks what is offered: a music album can become a streaming service. Price asks what customers pay and may become dynamic or easy to compare online. Place asks where an offer can be found, including search engines, feeds, apps and stores. Promotion asks how and by whom it is communicated, including brands, paid partners and customers.\n\nA compelling promotion will not compensate for an unsuitable product, unaffordable price or hard-to-find offer. The four decisions reinforce one another.","example":"Illustrative example: A new bubble-tea shop offers fruity drinks (product), charges a student-friendly price (price), sells beside campus (place), and advertises with colourful posters (promotion). If the drinks taste bad, beautiful posters will not fix the other three decisions.","full":"The four Ps of marketing are product, price, place and promotion. They are connected decisions, and all four must work together. Digital technology changes how each one works. Product is what the business offers, such as access to music instead of a physical album. Price is what customers pay, which may be easy to compare online or may change over time. Place is where people find and access the offer, such as a shop, website, app, search result or social feed. Promotion is how the offer is communicated by a brand, its partners or customers.\n\nNetflix is one example. The films and series available are the product, the subscription fee is the price, the website and app are the place, and trailers and other messages are promotion. These decisions affect one another. A great trailer might persuade someone to subscribe, but it will not keep them subscribed if they dislike the content, think the price is too high or find the service hard to use.\n\nThis is why strong promotion cannot fully make up for a product people do not want, a price they cannot afford or an offer that is difficult to find. Successful marketing means making decisions about all four Ps together.","category":"MARKETING FUNDAMENTALS","study":{"simple":"Product asks what is offered: a music album can become a streaming service. Price asks what customers pay and may become dynamic or easy to compare online.","why":"Strong advertising may attract new subscribers, but it cannot keep them if the product disappoints, the price is too high or the service is difficult to use. Product, price, place and promotion affect one another, so all four need to work together. A good trailer alone cannot keep someone paying for a catalogue they do not enjoy.","example":"A new bubble-tea shop offers fruity drinks (product), charges a student-friendly price (price), sells beside campus (place), and advertises with colourful posters (promotion). If the drinks taste bad, beautiful posters will not fix the other three decisions.","exam":"The four Ps of marketing are product, price, place and promotion. They are connected decisions, and all four must work together. Digital technology changes how each one works. Product is what the business offers, such as access to music instead of a physical album. Price is what customers pay, which may be easy to compare online or may change over time. Place is where people find and access the offer, such as a shop, website, app, search result or social feed. Promotion is how the offer is communicated by a brand, its partners or customers.\n\nNetflix is one example. The films and series available are the product, the subscription fee is the price, the website and app are the place, and trailers and other messages are promotion. These decisions affect one another. A great trailer might persuade someone to subscribe, but it will not keep them subscribed if they dislike the content, think the price is too high or find the service hard to use.\n\nThis is why strong promotion cannot fully make up for a product people do not want, a price they cannot afford or an offer that is difficult to find. Successful marketing means making decisions about all four Ps together."},"exampleType":"illustrative"},{"id":5,"term":"Web 1.0","lecture":"Lecture 1 · Marketing, technology and change","page":2,"definition":"The read-only web: a library you read. Information was published to an audience that could not easily answer back.","explanation":"Website owners mainly published information and visitors mainly read it. The lecture compares this stage to a library: information was available, but audience participation was limited. This matters because later developments changed users from readers into contributors and made their participation part of the digital environment.\n\nIn a mostly read-only web, organisations controlled much of the publishing process. Understanding that baseline shows how radically audience participation changed online communication.","example":"Illustrative example: Imagine an early 2000s website listing a band's tour dates with no comments or uploads. Fans could read the information but had no easy way to add their own: that is the read-only idea behind Web 1.0.","full":"Web 1.0 is the read-only web: a library you read. Information was published to an audience that could not easily answer back. Website owners mainly published information and visitors mainly read it. The lecture compares this stage to a library: information was available, but audience participation was limited. This matters because later developments changed users from readers into contributors and made their participation part of the digital environment.\n\nImagine an early Apple product website that publishes specifications and company announcements, while visitors can only read them. The firm controls publishing and visitors have little opportunity to contribute. This contrasts with modern review sites and social platforms where audiences respond publicly. The historical distinction shows why later marketing communication could no longer be managed as a one-way broadcast alone.\n\nIn a mostly read-only web, organisations controlled much of the publishing process. Understanding that baseline shows how radically audience participation changed online communication.","category":"THE DIGITAL ENVIRONMENT","study":{"simple":"Website owners mainly published information and visitors mainly read it. The lecture compares this stage to a library: information was available, but audience participation was limited.","why":"In a mostly read-only web, organisations controlled much of the publishing process. Understanding that baseline shows how radically audience participation changed online communication. The firm controls publishing and visitors have little opportunity to contribute. This contrasts with modern review sites and social platforms where audiences respond publicly.","example":"Imagine an early 2000s website listing a band's tour dates with no comments or uploads. Fans could read the information but had no easy way to add their own: that is the read-only idea behind Web 1.0.","exam":"Web 1.0 is the read-only web: a library you read. Information was published to an audience that could not easily answer back. Website owners mainly published information and visitors mainly read it. The lecture compares this stage to a library: information was available, but audience participation was limited. This matters because later developments changed users from readers into contributors and made their participation part of the digital environment.\n\nImagine an early Apple product website that publishes specifications and company announcements, while visitors can only read them. The firm controls publishing and visitors have little opportunity to contribute. This contrasts with modern review sites and social platforms where audiences respond publicly. The historical distinction shows why later marketing communication could no longer be managed as a one-way broadcast alone.\n\nIn a mostly read-only web, organisations controlled much of the publishing process. Understanding that baseline shows how radically audience participation changed online communication."},"exampleType":"illustrative"},{"id":6,"term":"Web 2.0","lecture":"Lecture 1 · Marketing, technology and change","page":2,"definition":"Named at a conference in San Francisco in 2004 under the theme “The Web as Platform”. A shift from reading information to creating, sharing and correcting it — blogs, wikis, video sharing, communities, participation.","explanation":"The shift was not just technological; it changed the role of the audience. People could publish blog posts, contribute to wikis, upload videos and participate in communities instead of only read pages. These interactions also produced data and created new possibilities and consequences for marketers.\n\nUsers can independently create, correct and challenge information about companies. Brands therefore need to listen and participate instead of assume they control the whole conversation.","example":"Illustrative example: Wikipedia articles can be written and corrected by contributors instead of one publisher. The website's value grows through participation, making it an easy example of Web 2.0.","full":"Web 2.0 describes the participatory web, in which users create, share and correct content through blogs, wikis, videos and online communities. The shift was not just technological; it changed the role of the audience. People could publish blog posts, contribute to wikis, upload videos and participate in communities instead of only read pages. These interactions also produced data and created new possibilities and consequences for marketers.\n\nWikipedia's collaborative editing captures the Web 2.0 shift: users do not only consume an article but also propose corrections, add sources and discuss changes. A company's product may likewise be reviewed and discussed outside its control. Participation increases the amount of available information but also makes reputation depend partly on user communities and moderation instead of publisher decisions alone.\n\nUsers can independently create, correct and challenge information about companies. Brands therefore need to listen and participate instead of assume they control the whole conversation.","category":"THE DIGITAL ENVIRONMENT","study":{"simple":"The shift was not just technological; it changed the role of the audience. People could publish blog posts, contribute to wikis, upload videos and participate in communities instead of only read pages.","why":"Users can independently create, correct and challenge information about companies. Brands therefore need to listen and participate instead of assume they control the whole conversation. A company's product may likewise be reviewed and discussed outside its control. Participation increases the amount of available information but also makes reputation depend partly on user communities and moderation instead of publisher decisions alone.","example":"Wikipedia articles can be written and corrected by contributors instead of one publisher. The website's value grows through participation, making it an easy example of Web 2.0.","exam":"Web 2.0 describes the participatory web, in which users create, share and correct content through blogs, wikis, videos and online communities. The shift was not just technological; it changed the role of the audience. People could publish blog posts, contribute to wikis, upload videos and participate in communities instead of only read pages. These interactions also produced data and created new possibilities and consequences for marketers.\n\nWikipedia's collaborative editing captures the Web 2.0 shift: users do not only consume an article but also propose corrections, add sources and discuss changes. A company's product may likewise be reviewed and discussed outside its control. Participation increases the amount of available information but also makes reputation depend partly on user communities and moderation instead of publisher decisions alone.\n\nUsers can independently create, correct and challenge information about companies. Brands therefore need to listen and participate instead of assume they control the whole conversation."},"exampleType":"illustrative"},{"id":7,"term":"Web 3.0","lecture":"Lecture 1 · Marketing, technology and change","page":3,"definition":"The predictive web: data, privacy law and prediction. Web 1.0 read, Web 2.0 wrote, Web 3.0 predicts.","explanation":"In the course, this stage is presented through prediction, data and privacy law instead of just publishing or participation. The contrast is useful: Web 1.0 focused on reading, Web 2.0 on writing and contributing, and Web 3.0 on systems drawing predictions from data. That raises questions about how the data is collected and governed.\n\nPersonalised predictions can make services feel relevant, but they depend on user data and raise questions about consent, transparency and mistaken assumptions.","example":"Real-world example: Airbnb says its recommendations can consider people's earlier bookings and interactions to suggest relevant stays. That illustrates the prediction-and-data emphasis used for Web 3.0 in this course, rather than simply showing everyone the same list.","full":"Web 3.0 is the predictive web: data, privacy law and prediction. Web 1.0 read, Web 2.0 wrote, Web 3.0 predicts. In the course, this stage is presented through prediction, data and privacy law instead of just publishing or participation. The contrast is useful: Web 1.0 focused on reading, Web 2.0 on writing and contributing, and Web 3.0 on systems drawing predictions from data. That raises questions about how the data is collected and governed.\n\nNetflix recommendations illustrate the predictive model emphasized in this course: viewing history is analyzed to estimate which programme a subscriber may enjoy next. The system is doing more than storing or displaying information; it makes a prediction from behavior. Better personalization can reduce search effort, but wrong inferences and questions about responsible data use show why prediction and privacy must be considered together.\n\nPersonalised predictions can make services feel relevant, but they depend on user data and raise questions about consent, transparency and mistaken assumptions.","category":"THE DIGITAL raise questions about consent, transparency and mistaken assumptions."},"exampleType":"real","exampleSource":"https://www.airbnb.com/help/article/39"},{"id":8,"term":"User-generated content","lecture":"Lecture 1 · Marketing, technology and change","page":3,"definition":"Content created by users rather than by publishers or brands — posts, reviews, comments, wiki entries, uploaded video. The core of Web 2.0.","explanation":"Examples include reviews, comments, uploaded videos and wiki contributions. Instead of brands and publishers having exclusive control over communication, users become contributors whose content other people can find and share. This changes how an organisation is discussed because not every message about it comes from the organisation itself.\n\nCustomers can help or harm a brand's reputation through independent reviews and posts. A marketer must distinguish authentic audience voices from brand-created claims.","example":"Real-world example: Airbnb publishes guest reviews written by people who stayed at a property. The guests, not Airbnb's advertising team, create that content, and other travellers use it when deciding where to book.","full":"User-generated content is content created by users instead of by publishers or brands — posts, reviews, comments, wiki entries, uploaded video. The core of Web 2.0. Examples include reviews, comments, uploaded videos and wiki contributions. Instead of brands and publishers having exclusive control over communication, users become contributors whose content other people can find and share. This changes how an organisation is discussed because not every message about it comes from the organisation itself.\n\nA YouTube reviewer independently tests an IKEA desk and comments on its sturdiness and assembly. The review is user-generated content because its author is the user, not IKEA. Potential buyers may trust it differently from a product advertisement, and negative details can spread without the brand's approval. For people working in marketing, listening to independent experiences is as important as publishing their own claims.\n\nCustomers can help or harm a brand's reputation through independent reviews and posts. A marketer must distinguish authentic audience voices from brand-created claims.","category":"THE DIGITAL ENVIRONMENT","study":{"simple":"Examples include reviews, comments, uploaded videos and wiki contributions. Instead of brands and publishers having exclusive control over communication, users become contributors whose content other people can find and share.","why":"Customers can help or harm a brand's reputation through independent reviews and posts. A marketer must distinguish authentic audience voices from brand-created claims. The review is user-generated content because its author is the user, not IKEA Potential buyers may trust it differently from a product advertisement, and negative details can spread without the brand's approval.","example":"Airbnb publishes guest reviews written by people who stayed at a property. The guests, not Airbnb's advertising team, create that content, and other travellers use it when deciding where to book.","exam":"User-generated content is content created by users instead of by publishers or brands — posts, reviews, comments, wiki entries, uploaded video. The core of Web 2.0. Examples include reviews, comments, uploaded videos and wiki contributions. Instead of brands and publishers having exclusive control over communication, users become contributors whose content other people can find and share. This changes how an organisation is discussed because not every message about it comes from the organisation itself.\n\nA YouTube reviewer independently tests an IKEA desk and comments on its sturdiness and assembly. The review is user-generated content because its author is the user, not IKEA. Potential buyers may trust it differently from a product advertisement, and negative details can spread without the brand's approval. For people working in marketing, listening to independent experiences is as important as publishing their own claims.\n\nCustomers can help or harm a brand's reputation through independent reviews and posts. A marketer must distinguish authentic audience voices from brand-created claims."},"exampleType":"real","exampleSource":"https://www.airbnb.com/help/article/1885"},{"id":9,"term":"The like button","lecture":"Lecture 1 · Marketing, technology and change","page":3,"definition":"A small interface element with enormous consequences: it turned approval into a number, made attention countable, and gave marketers real-time feedback.","explanation":"A click of approval became a visible metric that platforms and marketers could count. This makes audience reactions immediately measurable, but it also encourages attention and approval to be treated as numbers. The lecture uses it to show how a very small design choice can change behaviour on a large scale.\n\nVisible like counts can reward content that gains quick approval while hiding whether the response is thoughtful, genuine or useful to a business objective.","example":"Illustrative example: Imagine two identical photos on Instagram, one with 20 likes and one with 20,000. People might judge the second as more popular, even though likes do not prove quality. The button turns approval into a visible number.","full":"The like button is a small interface element with enormous consequences: it turned approval into a number, made attention countable, and gave marketers real-time feedback. A click of approval became a visible metric that platforms and marketers could count. This makes audience reactions immediately measurable, but it also encourages attention and approval to be treated as numbers. The lecture uses it to show how a very small design choice can change behaviour on a large scale.\n\nWhen an Adidas shoe photo receives thousands of likes on Instagram, the interface converts many individual reactions into one visible number. Users may interpret that number as social approval, while the publisher may optimize subsequent posts for likes. Yet tapping a heart is much easier than purchasing shoes or understanding a message. A high count measures an interaction, not the full quality or impact of attention.\n\nVisible like counts can reward content that gains quick approval while hiding whether the response is thoughtful, genuine or useful to a business objective.","category":"THE DIGITAL ENVIRONMENT","study":{"simple":"A click of approval became a visible metric that platforms and marketers could count. This makes audience reactions immediately measurable, but it also encourages attention and approval to be treated as numbers.","why":"Visible like counts can reward content that gains quick approval while hiding whether the response is thoughtful, genuine or useful to a business objective. Users may interpret that number as social approval, while the publisher may optimize subsequent posts for likes. Yet tapping a heart is much easier than purchasing shoes or understanding a message.","example":"Imagine two identical photos on Instagram, one with 20 likes and one with 20,000. People might judge the second as more popular, even though likes do not prove quality. The button turns approval into a visible number.","exam":"The like button is a small interface element with enormous consequences: it turned approval into a number, made attention countable, and gave marketers real-time feedback. A click of approval became a visible metric that platforms and marketers could count. This makes audience reactions immediately measurable, but it also encourages attention and approval to be treated as numbers. The lecture uses it to show how a very small design choice can change behaviour on a large scale.\n\nWhen an Adidas shoe photo receives thousands of likes on Instagram, the interface converts many individual reactions into one visible number. Users may interpret that number as social approval, while the publisher may optimize subsequent posts for likes. Yet tapping a heart is much easier than purchasing shoes or understanding a message. A high count measures an interaction, not the full quality or impact of attention.\n\nVisible like counts can reward content that gains quick approval while hiding whether the response is thoughtful, genuine or useful to a business objective."},"exampleType":"illustrative"},{"id":10,"term":"Scalable, searchable, replicable","lecture":"Lecture 1 · Marketing, technology and change","page":3,"definition":"Three qualities of networked content — and their consequences. It can reach a global public, it can be found by anyone at any time, and it can be copied and reused out of context.","explanation":"Scalability means a message can spread far beyond its intended audience; searchability means unexpected people may later find it; replicability means it can be copied and reused in another context. Together, these properties make online publishing powerful but hard to control. They explain why the consequences of sharing something may last beyond the original post.\n\nA post can reach unplanned audiences, be rediscovered years later and reappear outside its original situation. Publishers must think about these consequences before sharing.","example":"Real-world example: Spotify Wrapped gives users shareable summaries of their listening. Once someone posts a card, it can travel to people outside Spotify, be found later and be screenshotted or reposted—three qualities of networked content.","full":"Networked information has three important qualities: scalability allows it to reach large publics, searchability allows later discovery, and replicability allows copying and reuse. Together, these properties make online publishing powerful but hard to control. They explain why the consequences of sharing something may last beyond the original post.\n\nImagine a TikTok review of a Stanley tumbler: it can suddenly reach millions outside the creator's followers, remain discoverable through search, and circulate as screenshots detached from the initial video. Those are scalability, searchability and replicability acting together. The same properties that make organic discovery powerful also make inaccurate claims, embarrassing remarks and obsolete promotions hard to contain.\n\nA post can reach unplanned audiences, be rediscovered years later and reappear outside its original situation. Publishers must think about these consequences before sharing.","category":"THE DIGITAL ENVIRONMENT","study":{"simple":"Scalability means a message can spread far beyond its intended audience; searchability means unexpected people may later find it; replicability means it can be copied and reused in another context. Together, these properties make online publishing powerful but hard to control.","why":"A post can reach unplanned audiences, be rediscovered years later and reappear outside its original situation. Publishers must think about these consequences before sharing. Those are scalability, searchability and replicability acting together. The same properties that make organic discovery powerful also make inaccurate claims, embarrassing remarks and obsolete promotions hard to contain.","example":"Spotify Wrapped gives users shareable summaries of their listening. Once someone posts a card, it can travel to people outside Spotify, be found later and be screenshotted or reposted—three qualities of networked content.","exam":"Networked information has three important qualities: scalability allows it to reach large publics, searchability allows later discovery, and replicability allows copying and reuse. Together, these properties make online publishing powerful but hard to control. They explain why the consequences of sharing something may last beyond the original post.\n\nImagine a TikTok review of a Stanley tumbler: it can suddenly reach millions outside the creator's followers, remain discoverable through search, and circulate as screenshots detached from the initial video. Those are scalability, searchability and replicability acting together. The same properties that make organic discovery powerful also make inaccurate claims, embarrassing remarks and obsolete promotions hard to contain.\n\nA post can reach unplanned audiences, be rediscovered years later and reappear outside its original situation. Publishers must think about these consequences before sharing."},"exampleType":"real","exampleSource":"https://newsroom.spotify.com/2025-12-03/2025-wrapped-user-experience/"},{"id":11,"term":"GDPR","lecture":"Lecture 1 · Marketing, technology and change","page":4,"definition":"European data protection regulation that made consent, purpose and data minimisation legal obligations. Regulation is society answering back to a technology it had already adopted.","explanation":"The lecture connects privacy regulation to technological change: after organisations gained new ways to collect and use data, society introduced legal limits and responsibilities. Consent, a defined purpose and collecting only necessary data are central requirements in the course description. Digital marketing so cannot treat every possible use of personal data as automatically acceptable.\n\nA customer relationship is damaged when personal information is collected without a clear purpose or lawful basis. Responsible data use protects people and reduces legal and reputational risk.","example":"Illustrative example: Imagine an online skincare shop with an optional checkbox for marketing emails. It must explain why it collects an address and cannot treat a purchase as automatic permission to send unrelated marketing messages. That's a practical data-protection issue under GDPR.","full":"The General Data Protection Regulation (GDPR) establishes legal responsibilities for processing personal data in the European Union, including having a lawful basis, a defined purpose and data minimisation. The lecture connects privacy regulation to technological change: after organisations gained new ways to collect and use data, society introduced legal limits and responsibilities. Consent, a defined purpose and collecting only necessary data are central requirements in the course description. Digital marketing so cannot treat every possible use of personal data as automatically acceptable.\n\nImagine IKEA offering a newsletter form that states what emails subscribers will receive, requests consent where required, and avoids collecting unrelated sensitive details. This links purpose and data minimisation to an everyday marketing activity. GDPR is not only a checkbox: it limits how organizations justify, store and use personal information. The existence of a technically available data point does not automatically permit its use.\n\nA customer relationship is damaged when personal information is collected without a clear purpose or lawful basis. Responsible data use protects people and reduces legal and reputational risk.","category":"THE DIGITAL ENVIRONMENT","study":{"simple":"The lecture connects privacy regulation to technological change: after organisations gained new ways to collect and use data, society introduced legal limits and responsibilities. Consent, a defined purpose and collecting only necessary data are central requirements in the course description.","why":"A customer relationship is damaged when personal information is collected without a clear purpose or lawful basis. Responsible data use protects people and reduces legal and reputational risk. This links purpose and data minimisation to an everyday marketing activity GDPR is not only a checkbox: it limits how organizations justify, store and use personal information.","example":"Imagine an online skincare shop with an optional checkbox for marketing emails. It must explain why it collects an address and cannot treat a purchase as automatic permission to send unrelated marketing messages. That's a practical data-protection issue under GDPR.","exam":"The General Data Protection Regulation (GDPR) establishes legal responsibilities for processing personal data in the European Union, including having a lawful basis, a defined purpose and data minimisation. The lecture connects privacy regulation to technological change: after organisations gained new ways to collect and use data, society introduced legal limits and responsibilities. Consent, a defined purpose and collecting only necessary data are central requirements in the course description. Digital marketing so cannot treat every possible use of personal data as automatically acceptable.\n\nImagine IKEA offering a newsletter form that states what emails subscribers will receive, requests consent where required, and avoids collecting unrelated sensitive details. This links purpose and data minimisation to an everyday marketing activity. GDPR is not only a checkbox: it limits how organizations justify, store and use personal information. The existence of a technically available data point does not automatically permit its use.\n\nA customer relationship is damaged when personal information is collected without a clear purpose or lawful basis. Responsible data use protects people and reduces legal and reputational risk."},"exampleType":"illustrative"},{"id":12,"term":"Trade-off (Postman 1)","lecture":"Lecture 1 · Marketing, technology and change","page":4,"definition":"All technological change is a trade-off. For every advantage a technology offers, there is a corresponding disadvantage.","explanation":"A tool can solve one problem while creating another. The main question is not whether the technology is simply good or bad, but what advantage it brings and what cost accompanies that advantage. This helps marketers evaluate a new technology beyond its attractive features.\n\nA new tool should be evaluated for its costs as well as its convenience. A marketer might gain precision while customers lose privacy or control.","example":"Illustrative example: A navigation app can help a driver avoid traffic but may also process sensitive location information. The convenience and the privacy concern exist at the same time—an example of Postman's technological trade-off.","full":"Postman’s first proposition is that technological change involves trade-offs: an innovation can solve a problem while introducing new costs. The main question is not whether the technology is simply good or bad, but what advantage it brings and what cost accompanies that advantage. This helps marketers evaluate a new technology beyond its attractive features.\n\nGoogle Maps gives drivers efficient directions but can involve collecting and processing location information. Postman's trade-off principle asks us to recognize both the convenience and the privacy cost instead of declare the technology purely beneficial. For people working in marketing, the same tension arises when personalization makes offers relevant but increases monitoring. The responsible decision weighs gains against what customers surrender.\n\nA new tool should be evaluated for its costs as well as its convenience. A marketer might gain precision while customers lose privacy or control.","category":"ATTENTION AND DISTRIBUTION","study":{"simple":"A tool can solve one problem while creating another. The main question is not whether the technology is simply good or bad, but what advantage it brings and what cost accompanies that advantage.","why":"A new tool should be evaluated for its costs as well as its convenience. A marketer might gain precision while customers lose privacy or control. Postman's trade-off principle asks us to recognize both the convenience and the privacy cost instead of declare the technology purely beneficial. For people working in marketing, the same tension arises when personalization makes offers relevant but increases monitoring.","example":"A navigation app can help a driver avoid traffic but may also process sensitive location information. The convenience and the privacy concern exist at the same time—an example of Postman's technological trade-off.","exam":"Postman’s first proposition is that technological change involves trade-offs: an innovation can solve a problem while introducing new costs. The main question is not whether the technology is simply good or bad, but what advantage it brings and what cost accompanies that advantage. This helps marketers evaluate a new technology beyond its attractive features.\n\nGoogle Maps gives drivers efficient directions but can involve collecting and processing location information. Postman's trade-off principle asks us to recognize both the convenience and the privacy cost instead of declare the technology purely beneficial. For people working in marketing, the same tension arises when personalization makes offers relevant but increases monitoring. The responsible decision weighs gains against what customers surrender.\n\nA new tool should be evaluated for its costs as well as its convenience. A marketer might gain precision while customers lose privacy or control."},"exampleType":"illustrative"},{"id":13,"term":"Uneven distribution (Postman 2)","lecture":"Lecture 1 · Marketing, technology and change","page":4,"definition":"The advantages and disadvantages of a technology are never distributed evenly. Ask who gains reach or control, whose work becomes easier, and whose skills lose market value.","explanation":"A technology may benefit one group while placing costs on another. For example, a new digital channel can increase the reach of some organisations while reducing the value of skills built around older channels. Postman’s question is who gains, who loses and how these effects differ.\n\nDifferent groups do not receive technology's benefits equally. When assessing a new system, a business should ask who saves effort and who takes on new work or risk.","example":"Illustrative example: When customers switch from printed menus to app-only ordering, confident smartphone users may find it faster, but people without a phone may struggle. The benefits and costs of the same technology are unevenly distributed.","full":"Postman’s second proposition concerns unequal distribution: different people and organizations experience different benefits and disadvantages from the same technology. A technology may benefit one group while placing costs on another. For example, a new digital channel can increase the reach of some organisations while reducing the value of skills built around older channels. Postman’s question is who gains, who loses and how these effects differ.\n\nImagine IKEA expands self-checkout. Some shoppers gain faster service and the shop may reduce routine checkout work, but other customers struggle with the interface and employees' tasks change. These consequences fall on different groups. Postman's principle therefore challenges a simple statement that the innovation 'saves time': the key question is whose time is saved and whose effort or risk increases.\n\nDifferent groups do not receive technology's benefits equally. When assessing a new system, a business should ask who saves effort and who takes on new work or risk.","study":{"simple":"A technology may benefit one group while placing costs on another. For example, a new digital channel can increase the reach of some organisations while reducing the value of skills built around older channels.","why":"Different groups do not receive technology's benefits equally. When assessing a new system, a business should ask who saves effort and who takes on new work or risk. Some shoppers gain faster service and the shop may reduce routine checkout work, but other customers struggle with the interface and employees' tasks change. These consequences fall on different groups.","example":"When customers switch from printed menus to app-only ordering, confident smartphone users may find it faster, but people without a phone may struggle. The benefits and costs of the same technology are unevenly distributed.","exam":"Postman’s second proposition concerns unequal distribution: different people and organizations experience different benefits and disadvantages from the same technology. A technology may benefit one group while placing costs on another. For example, a new digital channel can increase the reach of some organisations while reducing the value of skills built around older channels. Postman’s question is who gains, who loses and how these effects differ.\n\nImagine IKEA expands self-checkout. Some shoppers gain faster service and the shop may reduce routine checkout work, but other customers struggle with the interface and employees' tasks change. These consequences fall on different groups. Postman's principle therefore challenges a simple statement that the innovation 'saves time': the key question is whose time is saved and whose effort or risk increases.\n\nDifferent groups do not receive technology's benefits equally. When assessing a new system, a business should ask who saves effort and who takes on new work or risk."},"exampleType":"illustrative"},{"id":14,"term":"Embedded idea (Postman 3)","lecture":"Lecture 1 · Marketing, technology and change","page":5,"definition":"Every technology contains a powerful idea or bias. Technologies are not neutral tools: their design favours particular behaviours, values and ways of understanding people.","explanation":"A technology shapes behaviour through its design, even if users treat it as a neutral tool. For example, a system that emphasises visible likes makes approval especially important and easy to compare. Evaluating a technology therefore includes asking which behaviours it encourages and which values it assumes.\n\nInterface design affects what people value and do. Prioritising public like counts, for example, can shift attention from meaningful conversation to approval seeking.","example":"Illustrative example: A social network that prominently displays hearts and follower counts makes public popularity easy to compare. The interface quietly encourages people to seek visible approval; that preference is built into the design.","full":"Postman’s third proposition argues that technologies are not neutral because their design embeds ideas and priorities that influence human behaviour. A technology shapes behaviour through its design, even if users treat it as a neutral tool. For example, a system that emphasises visible likes makes approval especially important and easy to compare. Evaluating a technology therefore includes asking which behaviours it encourages and which values it assumes.\n\nInstagram's prominent heart icon rewards an easily counted form of approval, making popularity visible and comparable. That design expresses a preference for certain interactions even if users regard the platform as neutral. A marketer who optimizes only for hearts may adopt the platform's value system instead of measuring meaningful customer relationships. Technology shapes which behaviours appear natural or desirable.\n\nInterface design affects what people value and do. Prioritising public like counts, for example, can shift attention from meaningful conversation to approval seeking.","study":{"simple":"A technology shapes behaviour through its design, even if users treat it as a neutral tool. For example, a system that emphasises visible likes makes approval especially important and easy to compare.","why":"Interface design affects what people value and do. Prioritising public like counts, for example, can shift attention from meaningful conversation to approval seeking. That design expresses a preference for certain interactions even if users regard the platform as neutral. A marketer who optimizes only for hearts may adopt the platform's value system instead of measuring meaningful customer relationships.","example":"A social network that prominently displays hearts and follower counts makes public popularity easy to compare. The interface quietly encourages people to seek visible approval; that preference is built into the design.","exam":"Postman’s third proposition argues that technologies are not neutral because their design embeds ideas and priorities that influence human behaviour. A technology shapes behaviour through its design, even if users treat it as a neutral tool. For example, a system that emphasises visible likes makes approval especially important and easy to compare. Evaluating a technology therefore includes asking which behaviours it encourages and which values it assumes.\n\nInstagram's prominent heart icon rewards an easily counted form of approval, making popularity visible and comparable. That design expresses a preference for certain interactions even if users regard the platform as neutral. A marketer who optimizes only for hearts may adopt the platform's value system instead of measuring meaningful customer relationships. Technology shapes which behaviours appear natural or desirable.\n\nInterface design affects what people value and do. Prioritising public like counts, for example, can shift attention from meaningful conversation to approval seeking."},"exampleType":"illustrative"},{"id":15,"term":"Ecological change (Postman 4)","lecture":"Lecture 1 · Marketing, technology and change","page":5,"definition":"Technological change is ecological, not additive. A new channel does not simply get added — it changes all the existing channels around it.","explanation":"Introducing a new technology changes its surrounding environment instead of only adding another option. The spread of search, social feeds or assistants changes how existing websites and communication channels are used. A marketer must think about the effects on the entire system, not only the new tool.\n\nAdopting a channel changes the other channels around it. Planning only the new technology misses how customer habits, budgets and expectations also change.","example":"Illustrative example: When music moved from CD shops to streaming apps, the change affected how artists earn revenue, how people discover songs and what physical shops sell. Streaming changed the whole music environment, not just one part of it.","full":"Postman’s fourth proposition is that technological change is ecological, not additive: a new technology changes the environment around existing practices. The spread of search, social feeds or assistants changes how existing websites and communication channels are used. A marketer must think about the effects on the entire system, not only the new tool.\n\nSpotify did not merely provide one more way to purchase an album: streaming changed music discovery, payment, distribution and the meaning of owning music. Artists, record labels, retailers and listeners all adjusted their behavior. This is ecological change because introducing a tool reorganizes the surrounding system. Marketing strategy must think about effects on other channels instead of add the new technology to an unchanged plan.\n\nAdopting a channel changes the other channels around it. Planning only the new technology misses how customer habits, budgets and expectations also change.","study":{"simple":"Introducing a new technology changes its surrounding environment instead of only adding another option. The spread of search, social feeds or assistants changes how existing websites and communication channels are used.","why":"Adopting a channel changes the other channels around it. Planning only the new technology misses how customer habits, budgets and expectations also change. Artists, record labels, retailers and listeners all adjusted their behavior. This is ecological change because introducing a tool reorganizes the surrounding system.","example":"When music moved from CD shops to streaming apps, the change affected how artists earn revenue, how people discover songs and what physical shops sell. Streaming changed the whole music environment, not just one part of it.","exam":"Postman’s fourth proposition is that technological change is ecological, not additive: a new technology changes the environment around existing practices. The spread of search, social feeds or assistants changes how existing websites and communication channels are used. A marketer must think about the effects on the entire system, not only the new tool.\n\nSpotify did not merely provide one more way to purchase an album: streaming changed music discovery, payment, distribution and the meaning of owning music. Artists, record labels, retailers and listeners all adjusted their behavior. This is ecological change because introducing a tool reorganizes the surrounding system. Marketing strategy must think about effects on other channels instead of add the new technology to an unchanged plan.\n\nAdopting a channel changes the other channels around it. Planning only the new technology misses how customer habits, budgets and expectations also change."},"exampleType":"illustrative"},{"id":16,"term":"Mythic technology (Postman 5)","lecture":"Lecture 1 · Marketing, technology and change","page":5,"definition":"Technologies tend to become mythic: they come to feel natural and inevitable, so we stop questioning them. Technology can never be the solution in itself — it is a strategy.","explanation":"When a technology becomes ordinary, people can begin to assume it must exist and cannot be questioned. Postman warns against treating the tool itself as the answer. A technology should instead be judged as a possible strategy for a clearly understood problem.\n\nTreating a familiar platform as unavoidable prevents critical evaluation. Organisations should still ask whether it serves the customer's actual need.","example":"Illustrative example: Imagine a team deciding it 'must use AI' because everyone else does. Postman's point is to question that assumption: what actual customer problem would AI solve, and could a simpler tool do it better?","full":"Postman’s fifth proposition is that technologies can become mythic, appearing so natural and inevitable that their social assumptions go unquestioned. Postman warns against treating the tool itself as the answer. A technology should instead be judged as a possible strategy for a clearly understood problem.\n\nA student may treat Google's ranked results as the inevitable way of finding information, overlooking that rankings are designed, changeable decisions. This is a technology becoming mythic: its assumptions disappear from view. An organization should still question whether one platform offers the best route to its audience. Familiarity is not evidence that a tool is inherently fair, neutral or essential.\n\nTreating a familiar platform as unavoidable prevents critical evaluation. Organisations should still ask whether it serves the customer's actual need.","study":{"simple":"When a technology becomes ordinary, people can begin to assume it must exist and cannot be questioned. Postman warns against treating the tool itself as the answer.","why":"Treating a familiar platform as unavoidable prevents critical evaluation. Organisations should still ask whether it serves the customer's actual need. This is a technology becoming mythic: its assumptions disappear from view. An organization should still question whether one platform offers the best route to its audience.","example":"Imagine a team deciding it 'must use AI' because everyone else does. Postman's point is to question that assumption: what actual customer problem would AI solve, and could a simpler tool do it better?","exam":"Postman’s fifth proposition is that technologies can become mythic, appearing so natural and inevitable that their social assumptions go unquestioned. Postman warns against treating the tool itself as the answer. A technology should instead be judged as a possible strategy for a clearly understood problem.\n\nA student may treat Google's ranked results as the inevitable way of finding information, overlooking that rankings are designed, changeable decisions. This is a technology becoming mythic: its assumptions disappear from view. An organization should still question whether one platform offers the best route to its audience. Familiarity is not evidence that a tool is inherently fair, neutral or essential.\n\nTreating a familiar platform as unavoidable prevents critical evaluation. Organisations should still ask whether it serves the customer's actual need."},"exampleType":"illustrative"},{"id":17,"term":"Web 4.0","lecture":"Lecture 2 · Web 4.0 and the advertising marketplace","page":6,"definition":"The assistant-centric web: from a global library to a global databank, where generative AI and answer engines increasingly stand between people and information.","explanation":"In the lecture, this is a shift from people navigating a library of web pages towards assistants working over a wider databank of information. Generative AI and answer engines can compose responses before a user visits an original source. That changes where people encounter information and what organisations need to consider when making information available.\n\nAn assistant may give the user an answer without sending them to the company's page. Brands need information that is clear and trustworthy beyond traditional search-result clicks.","example":"Real-world example: Google describes AI-generated features that can respond within Search rather than only listing websites. That illustrates the course's Web 4.0 idea: assistants increasingly stand between a user's question and the original sources.","full":"Web 4.0 is the assistant-centric web: from a global library to a global databank, where generative AI and answer engines increasingly stand between people and information. In the lecture, this is a shift from people navigating a library of web pages towards assistants working over a wider databank of information. Generative AI and answer engines can compose responses before a user visits an original source. That changes where people encounter information and what organisations need to consider when making information available.\n\nSuppose a customer asks an AI assistant to compare Samsung phones within a budget and gets a written recommendation before opening a website. Discovery has shifted from browsing pages to interacting with an intermediary. Brands now depend on whether information is interpreted and represented correctly inside a composed answer. The benefit is convenience for the user; the risk is losing context, visits or control over presentation.\n\nAn assistant may give the user an answer without sending them to the company's page. Brands need information that is clear and trustworthy beyond traditional search-result clicks.","study":{"simple":"In the lecture, this is a shift from people navigating a library of web pages towards assistants working over a wider databank of information. Generative AI and answer engines can compose responses before a user visits an original source.","why":"An assistant may give the user an answer without sending them to the company's page. Brands need information that is clear and trustworthy beyond traditional search-result clicks. Discovery has shifted from browsing pages to interacting with an intermediary. Brands now depend on whether information is interpreted and represented correctly inside a composed answer.","example":"Google describes AI-generated features that can respond within Search rather than only listing websites. That illustrates the course's Web 4.0 idea: assistants increasingly stand between a user's question and the original sources.","exam":"Web 4.0 is the assistant-centric web: from a global library to a global databank, where generative AI and answer engines increasingly stand between people and information. In the lecture, this is a shift from people navigating a library of web pages towards assistants working over a wider databank of information. Generative AI and answer engines can compose responses before a user visits an original source. That changes where people encounter information and what organisations need to consider when making information available.\n\nSuppose a customer asks an AI assistant to compare Samsung phones within a budget and gets a written recommendation before opening a website. Discovery has shifted from browsing pages to interacting with an intermediary. Brands now depend on whether information is interpreted and represented correctly inside a composed answer. The benefit is convenience for the user; the risk is losing context, visits or control over presentation.\n\nAn assistant may give the user an answer without sending them to the company's page. Brands need information that is clear and trustworthy beyond traditional search-result clicks."},"exampleType":"real","exampleSource":"https://developers.google.com/search/docs/appearance"},{"id":18,"term":"Answer engine","lecture":"Lecture 2 · Web 4.0 and the advertising marketplace","page":6,"definition":"A system that answers a query directly instead of returning a list of links, changing search, SEO and how people encounter information.","explanation":"Instead of presenting only a list of pages, an answer engine produces a response to a question. This may make obtaining an answer easier, but it also changes whether and how someone visits the pages the information came from. The course connects this development with search, SEO and the newer idea of GEO.\n\nDirect answers can save the searcher time while reducing visits to source sites. Accuracy, source selection and how information is cited therefore become important.","example":"Illustrative example: Someone asks an AI assistant, 'Which suitcase size fits a weekend flight?' and gets a direct written answer instead of ten links to open. The system is acting as an answer engine, although the user should still check important details.","full":"An answer engine produces a direct response to a user’s query instead of merely presenting a list of webpages. This may make obtaining an answer easier, but it also changes whether and how someone visits the pages the information came from. The course connects this development with search, SEO and the newer idea of GEO.\n\nIf someone asks an assistant whether an IKEA KALLAX unit fits a narrow room, the system may answer directly from product dimensions instead of showing ten result links. That meets the underlying information need quickly, but the answer must be accurate and grounded in reliable source details. The organization supplying those details may gain visibility without receiving a visit, which changes the role of a traditional search ranking.\n\nDirect answers can save the searcher time while reducing visits to source sites. Accuracy, source selection and how information is cited therefore become important.","study":{"simple":"Instead of presenting only a list of pages, an answer engine produces a response to a question. This may make obtaining an answer easier, but it also changes whether and how someone visits the pages the information came from.","why":"Direct answers can save the searcher time while reducing visits to source sites. Accuracy, source selection and how information is cited therefore become important. That meets the underlying information need quickly, but the answer must be accurate and grounded in reliable source details. The organization supplying those details may gain visibility without receiving a visit, which changes the role of a traditional search ranking.","example":"Someone asks an AI assistant, 'Which suitcase size fits a weekend flight?' and gets a direct written answer instead of ten links to open. The system is acting as an answer engine, although the user should still check important details.","exam":"An answer engine produces a direct response to a user’s query instead of merely presenting a list of webpages. This may make obtaining an answer easier, but it also changes whether and how someone visits the pages the information came from. The course connects this development with search, SEO and the newer idea of GEO.\n\nIf someone asks an assistant whether an IKEA KALLAX unit fits a narrow room, the system may answer directly from product dimensions instead of showing ten result links. That meets the underlying information need quickly, but the answer must be accurate and grounded in reliable source details. The organization supplying those details may gain visibility without receiving a visit, which changes the role of a traditional search ranking.\n\nDirect answers can save the searcher time while reducing visits to source sites. Accuracy, source selection and how information is cited therefore become important."},"exampleType":"illustrative"},{"id":19,"term":"Generative AI","lecture":"Lecture 2 · Web 4.0 and the advertising marketplace","page":6,"definition":"Models that produce text, images or answers from patterns in existing data. In marketing they change both how content is made and how it is found.","explanation":"A generative model can compose content or responses from patterns learned in data. For people working in marketing, this affects content production and the way audiences may receive answers through assistants. The lecture treats this as a change online, not just another way of writing copy.\n\nGenerated copy can accelerate production, but invented product facts and misleading images can harm customers. Human checking remains necessary.","example":"Illustrative example: Imagine a small candle shop asking a generative AI tool to draft three product descriptions. The tool produces new wording from patterns in data, but a person must verify the claims before publishing them.","full":"Generative AI involves models that produce text, images or answers from patterns in existing data. In marketing they change both how content is made and how it is found. A generative model can compose content or responses from patterns learned in data. For people working in marketing, this affects content production and the way audiences may receive answers through assistants. The lecture treats this as a change online, not just another way of writing copy.\n\nImagine a shop uses generative AI to draft several descriptions of an IKEA-style table. The model produces plausible wording from learned patterns, not independently verified product measurements. Human review is needed to catch invented materials, sizes or warranties. Generative AI can accelerate content creation, but the speed advantage is valuable only when accuracy, authorship and consumer trust are protected.\n\nGenerated copy can accelerate production, but invented product facts and misleading images can harm customers. Human checking remains necessary.","study":{"simple":"A generative model can compose content or responses from patterns learned in data. For people working in marketing, this affects content production and the way audiences may receive answers through assistants.","why":"Generated copy can accelerate production, but invented product facts and misleading images can harm customers. Human checking remains necessary. The model produces plausible wording from learned patterns, not independently verified product measurements. Human review is needed to catch invented materials, sizes or warranties.","example":"Imagine a small candle shop asking a generative AI tool to draft three product descriptions. The tool produces new wording from patterns in data, but a person must verify the claims before publishing them.","exam":"Generative AI involves models that produce text, images or answers from patterns in existing data. In marketing they change both how content is made and how it is found. A generative model can compose content or responses from patterns learned in data. For people working in marketing, this affects content production and the way audiences may receive answers through assistants. The lecture treats this as a change online, not just another way of writing copy.\n\nImagine a shop u
