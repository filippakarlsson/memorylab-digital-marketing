ly a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as loss aversion, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: An IKEA return message could say “Avoid losing your exchange window” instead of focusing on the equivalent gain from acting now. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): An IKEA return message could say “Avoid losing your exchange window” instead of focusing on the equivalent gain from acting now. Why it fits: This shows loss aversion in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The principle that people are more motivated to avoid losses than to acquire equivalent gains.\n\nA potential loss can have a stronger motivational effect than an equivalent possible gain. A message that emphasises what someone might lose may therefore feel different from one describing what they could gain. The principle concerns how choices are perceived, not an objective change in value.\n\nHow to explain it in an exam: Loss aversion is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, ssage, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as reciprocity, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: A cosmetics brand like Lush could offer a useful free sample, which might make some shoppers more willing to reciprocate with a purchase. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A cosmetics brand like Lush could offer a useful free sample, which might make some shoppers more willing to reciprocate with a purchase. Why it fits: This shows reciprocity in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The principle that people feel compelled to return a favour or gesture after receiving something of value.\n\nReceiving something useful or generous can create a feeling that one should respond in kind. In marketing, the idea helps explain why offering value may influence later behaviour. The response is based on a perceived social obligation, not simply a direct transaction.\n\nHow to explain it in an exam: Reciprocity is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning tion, the mechanism, and the consequence: what the person or organization does, why that counts as priming, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: Seeing a Nike running video before a shoe product page could prime a viewer to think about movement and fitness. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Seeing a Nike running video before a shoe product page could prime a viewer to think about movement and fitness. Why it fits: This shows priming in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Prior exposure to a cue that changes how a person perceives, interprets or responds to related information.\n\nA cue encountered earlier can affect the interpretation of something that appears later. The influence may occur even when the person is not consciously thinking about the first cue. The principle helps explain how context changes perception.\n\nHow to explain it in an exam: Priming is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as priming, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: Seeing a Nike running video before a shoe product page could prime a viewer to think about movement and fitness. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Seeing a Nike running video before a shoe product page could prime a viewer to think about movement and fitness. Why it fits: This shows priming in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"DECISION-MAKING"},{"id":116,"term":"Framing","lecture":"Lecture 7 · SEM, distinction and decision-making","page":32,"definition":"Presenting information in a way that emphasises certain aspects and influences how people perceive and react to it.","explanation":"The facts can remain the same while the way they are presented changes the audience’s reaction. Highlighting a gain, loss, risk or benefit gives one interpretation greater prominence. Framing is therefore about presentation and perception rather than changing the underlying information.\n\nHow to explain it in an exam: Framing is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as framing, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: A Filmstaden ticket bundle could be framed as “Save €5 together” or “Avoid paying €5 extra separately,” changing how the same offer feels. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A Filmstaden ticket bundle could be framed as “Save €5 together” or “Avoid paying €5 extra separately,” changing how the same offer feels. Why it fits: This shows framing in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Presenting information in a way that emphasises certain aspects and influences how people perceive and react to it.\n\nThe facts can remain the same while the way they are presented changes the audience’s reaction. Highlighting a gain, loss, risk or benefit gives one interpretation greater prominence. Framing is therefore about presentation and perception rather than changing the underlying information.\n\nHow to explain it in an exam: Framing is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as framing, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: A Filmstaden ticket bundle could be framed as “Save €5 together” or “Avoid paying €5 extra separately,” changing how the same offer feels. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A Filmstaden ticket bundle could be framed as “Save €5 together” or “Avoid paying €5 extra separately,” changing how the same offer feels. Why it fits: This shows framing in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"DECISION-MAKING"},{"id":117,"term":"Trust signals","lecture":"Lecture 7 · SEM, distinction and decision-making","page":33,"definition":"Visual or textual cues that reassure people about a brand's credibility, reliability and security, such as reviews, security badges or guarantees.","explanation":"Signals such as reviews, guarantees and security badges can reduce uncertainty about a purchase or service. They provide cues about reliability and credibility. Their usefulness depends on whether the cues are meaningful and trustworthy.\n\nHow to explain it in an exam: Trust signals is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as trust signals, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: A hypothetical Samsung checkout includes verified customer reviews, warranty terms, and secure-payment indicators to build confidence. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A hypothetical Samsung checkout includes verified customer reviews, warranty terms, and secure-payment indicators to build confidence. Why it fits: This shows trust signals in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Visual or textual cues that reassure people about a brand's credibility, reliability and security, such as reviews, security badges or guarantees.\n\nSignals such as reviews, guarantees and security badges can reduce uncertainty about a purchase or service. They provide cues about reliability and credibility. Their usefulness depends on whether the cues are meaningful and trustworthy.\n\nHow to explain it in an exam: Trust signals is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as trust signals, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: A hypothetical Samsung checkout includes verified customer reviews, warranty terms, and secure-payment indicators to build confidence. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A hypothetical Samsung checkout includes verified customer reviews, warranty terms, and secure-payment indicators to build confidence. Why it fits: This shows trust signals in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"DECISION-MAKING"},{"id":118,"term":"Decoy effect","lecture":"Lecture 7 · SEM, distinction and decision-making","page":33,"definition":"When a third, less attractive option changes how two other options are compared, making one appear more appealing.","explanation":"An additional option can change the relative attractiveness of two existing choices. The third option is designed or positioned so that one of the original options appears preferable. This shows that decisions depend on the comparison set, not only on each option considered alone.\n\nHow to explain it in an exam: Decoy effect is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as decoy effect, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: An imaginary Spotify subscription page has Basic €8, Plus €12, and a deliberately unattractive €11 option with fewer benefits, pushing comparisons toward Plus. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): An imaginary Spotify subscription page has Basic €8, Plus €12, and a deliberately unattractive €11 option with fewer benefits, pushing comparisons toward Plus. Why it fits: This shows decoy effect in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"When a third, less attractive option changes how two other options are compared, making one appear more appealing.\n\nAn additional option can change the relative attractiveness of two existing choices. The third option is designed or positioned so that one of the original options appears preferable. This shows that decisions depend on the comparison set, not only on each option considered alone.\n\nHow to explain it in an exam: Decoy effect is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as decoy effect, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: An imaginary Spotify subscription page has Basic €8, Plus €12, and a deliberately unattractive €11 option with fewer benefits, pushing comparisons toward Plus. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): An imaginary Spotify subscription page has Basic €8, Plus €12, and a deliberately unattractive €11 option with fewer benefits, pushing comparisons toward Plus. Why it fits: This shows decoy effect in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"DECISION-MAKING"},{"id":119,"term":"Peak-end rule","lecture":"Lecture 7 · SEM, distinction and decision-making","page":33,"definition":"The principle that people judge an experience largely by its most intense moment and its end, rather than by the whole experience.","explanation":"A person’s memory of an experience is especially influenced by its emotional high point and its ending. The experience may therefore be judged differently from a simple average of every moment. This principle is relevant when thinking about how a customer remembers an interaction.\n\nHow to explain it in an exam: Peak-end rule is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as peak-end rule, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: A visitor may remember a smooth last step and a particularly helpful IKEA employee more than every ordinary minute of their store visit. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A visitor may remember a smooth last step and a particularly helpful IKEA employee more than every ordinary minute of their store visit. Why it fits: This shows peak-end rule in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"The principle that people judge an experience largely by its most intense moment and its end, rather than by the whole experience.\n\nA person’s memory of an experience is especially influenced by its emotional high point and its ending. The experience may therefore be judged differently from a simple average of every moment. This principle is relevant when thinking about how a customer remembers an interaction.\n\nHow to explain it in an exam: Peak-end rule is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Identify the specific cue, price, message, comparison, or decision step that changes how the customer perceives the offer or chooses what to do next. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as peak-end rule, and what changes as a result. Explain the mechanism rather than claiming a design choice always causes sales; the effect depends on the audience, context, and whether the message is credible.\n\nConcrete application: A visitor may remember a smooth last step and a particularly helpful IKEA employee more than every ordinary minute of their store visit. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A visitor may remember a smooth last step and a particularly helpful IKEA employee more than every ordinary minute of their store visit. Why it fits: This shows peak-end rule in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"DECISION-MAKING"},{"id":120,"term":"Assistant-centric web","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":34,"definition":"A web where people increasingly receive a composed answer from an assistant instead of searching through and choosing between a list of webpages.","explanation":"The user can ask a question and receive a composed response instead of selecting and reading several search results. The intermediary assistant affects which information is surfaced and how it is expressed. This has consequences for organisations whose content previously depended on direct website visits.\n\nHow to explain it in an exam: Assistant-centric web is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as assistant-centric web, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A student asks an AI assistant which IKEA desks fit a narrow room and receives a synthesized answer rather than browsing every individual listing. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A student asks an AI assistant which IKEA desks fit a narrow room and receives a synthesized answer rather than browsing every individual listing. Why it fits: This shows assistant-centric web in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A web where people increasingly receive a composed answer from an assistant instead of searching through and choosing between a list of webpages.\n\nThe user can ask a question and receive a composed response instead of selecting and reading several search results. The intermediary assistant affects which information is surfaced and how it is expressed. This has consequences for organisations whose content previously depended on direct website visits.\n\nHow to explain it in an exam: Assistant-centric web is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as assistant-centric web, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A student asks an AI assistant which IKEA desks fit a narrow room and receives a synthesized answer rather than browsing every individual listing. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A student asks an AI assistant which IKEA desks fit a narrow room and receives a synthesized answer rather than browsing every individual listing. Why it fits: This shows assistant-centric web in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"THE DIGITAL ENVIRONMENT"},{"id":121,"term":"Attention economy","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":34,"definition":"An environment where information is abundant, human attention is limited, and access to audiences can therefore be sold.","explanation":"Digital information can be produced and distributed at enormous scale, but people cannot pay attention to everything. Audience attention consequently becomes something platforms and advertisers compete over and sell access to. The course questions whether sold impressions reliably represent meaningful human attention.\n\nHow to explain it in an exam: Attention economy is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as attention economy, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: Netflix, YouTube, and TikTok all compete for limited time in someone’s evening; impressions are not the same as genuine attention. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Netflix, YouTube, and TikTok all compete for limited time in someone’s evening; impressions are not the same as genuine attention. Why it fits: This shows attention economy in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"An environment where information is abundant, human attention is limited, and access to audiences can therefore be sold.\n\nDigital information can be produced and distributed at enormous scale, but people cannot pay attention to everything. Audience attention consequently becomes something platforms and advertisers compete over and sell access to. The course questions whether sold impressions reliably represent meaningful human attention.\n\nHow to explain it in an exam: Attention economy is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as attention economy, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: Netflix, YouTube, and TikTok all compete for limited time in someone’s evening; impressions are not the same as genuine attention. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Netflix, YouTube, and TikTok all compete for limited time in someone’s evening; impressions are not the same as genuine attention. Why it fits: This shows attention economy in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"THE BROKEN MARKETPLACE"},{"id":122,"term":"Impression","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":34,"definition":"An opportunity to display an ad that has been counted as served. It is not proof that anyone noticed the ad.","explanation":"An impression is a counted event indicating an advertisement was served. It does not necessarily mean the ad was on screen long enough to be seen, or that a person actually noticed it. This difference matters when evaluating digital advertising reports.\n\nHow to explain it in an exam: Impression is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as impression, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A hypothetical Nike banner is counted as served 5,000 times; that means 5,000 impressions, not 5,000 attentive viewers. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A hypothetical Nike banner is counted as served 5,000 times; that means 5,000 impressions, not 5,000 attentive viewers. Why it fits: This shows impression in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"An opportunity to display an ad that has been counted as served. It is not proof that anyone noticed the ad.\n\nAn impression is a counted event indicating an advertisement was served. It does not necessarily mean the ad was on screen long enough to be seen, or that a person actually noticed it. This difference matters when evaluating digital advertising reports.\n\nHow to explain it in an exam: Impression is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as impression, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A hypothetical Nike banner is counted as served 5,000 times; that means 5,000 impressions, not 5,000 attentive viewers. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A hypothetical Nike banner is counted as served 5,000 times; that means 5,000 impressions, not 5,000 attentive viewers. Why it fits: This shows impression in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"THE BROKEN MARKETPLACE"},{"id":123,"term":"Viewability","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":34,"definition":"A measurement of whether enough of an advertisement appeared on screen for long enough to count as viewable. It does not prove that a person noticed it.","explanation":"Viewability checks whether an ad met technical conditions for appearing on screen. It is a stronger claim than simple delivery, but not evidence of genuine attention or persuasion. The course stresses these differences because advertising measurements can be mistaken for outcomes.\n\nHow to explain it in an exam: Viewability is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as viewability, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A banner for IKEA could technically appear in the visible area of a page long enough to meet viewability rules without the visitor noticing it. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A banner for IKEA could technically appear in the visible area of a page long enough to meet viewability rules without the visitor noticing it. Why it fits: This shows viewability in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A measurement of whether enough of an advertisement appeared on screen for long enough to count as viewable. It does not prove that a person noticed it.\n\nViewability checks whether an ad met technical conditions for appearing on screen. It is a stronger claim than simple delivery, but not evidence of genuine attention or persuasion. The course stresses these differences because advertising measurements can be mistaken for outcomes.\n\nHow to explain it in an exam: Viewability is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as viewability, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A banner for IKEA could technically appear in the visible area of a page long enough to meet viewability rules without the visitor noticing it. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A banner for IKEA could technically appear in the visible area of a page long enough to meet viewability rules without the visitor noticing it. Why it fits: This shows viewability in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"THE BROKEN MARKETPLACE"},{"id":124,"term":"Attribution","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":35,"definition":"A rule for assigning credit for an outcome, such as a sale, to one or more marketing touchpoints. First click and last click are attribution rules, not proof of effect.","explanation":"An attribution model decides how reported credit is distributed among interactions before an outcome. For example, the first or final click may receive credit for a sale. Such a rule describes measurement, but does not establish that the credited interaction caused the sale.\n\nHow to explain it in an exam: Attribution is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as attribution, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A shopper sees an Adidas ad, then later clicks an email and buys shoes; last-click attribution might give the email credit without proving causality. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A shopper sees an Adidas ad, then later clicks an email and buys shoes; last-click attribution might give the email credit without proving causality. Why it fits: This shows attribution in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A rule for assigning credit for an outcome, such as a sale, to one or more marketing touchpoints. First click and last click are attribution rules, not proof of effect.\n\nAn attribution model decides how reported credit is distributed among interactions before an outcome. For example, the first or final click may receive credit for a sale. Such a rule describes measurement, but does not establish that the credited interaction caused the sale.\n\nHow to explain it in an exam: Attribution is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as attribution, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A shopper sees an Adidas ad, then later clicks an email and buys shoes; last-click attribution might give the email credit without proving causality. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A shopper sees an Adidas ad, then later clicks an email and buys shoes; last-click attribution might give the email credit without proving causality. Why it fits: This shows attribution in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"THE BROKEN MARKETPLACE"},{"id":125,"term":"Incrementality","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":35,"definition":"An outcome that happened because of the advertising and would not have happened without it.","explanation":"Incrementality asks what extra outcome occurred because the advertising was present. If a customer would have purchased anyway, the ad may be attributed a sale without adding one. The course contrasts incrementality with convenient measures such as clicks and attributed conversions.\n\nHow to explain it in an exam: Incrementality is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as incrementality, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: To test whether a Nike ad actually creates additional sales, compare a randomized exposed group with a comparable group that did not receive it. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): To test whether a Nike ad actually creates additional sales, compare a randomized exposed group with a comparable group that did not receive it. Why it fits: This shows incrementality in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"An outcome that happened because of the advertising and would not have happened without it.\n\nIncrementality asks what extra outcome occurred because the advertising was present. If a customer would have purchased anyway, the ad may be attributed a sale without adding one. The course contrasts incrementality with convenient measures such as clicks and attributed conversions.\n\nHow to explain it in an exam: Incrementality is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as incrementality, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: To test whether a Nike ad actually creates additional sales, compare a randomized exposed group with a comparable group that did not receive it. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): To test whether a Nike ad actually creates additional sales, compare a randomized exposed group with a comparable group that did not receive it. Why it fits: This shows incrementality in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"THE BROKEN MARKETPLACE"},{"id":126,"term":"Invalid traffic","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":35,"definition":"Impressions or clicks that do not come from genuine human interest, for example from bots or fraud.","explanation":"Bots, fraudulent clicks and other non-genuine interactions can generate counts without genuine human interest. These events can make campaign numbers appear stronger than the attention actually obtained. This is part of the lecture’s criticism of the digital advertising marketplace.\n\nHow to explain it in an exam: Invalid traffic is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as invalid traffic, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: Automated clicks on a hypothetical Samsung banner from a bot farm count as invalid traffic, not genuine customer interest. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): Automated clicks on a hypothetical Samsung banner from a bot farm count as invalid traffic, not genuine customer interest. Why it fits: This shows invalid traffic in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Impressions or clicks that do not come from genuine human interest, for example from bots or fraud.\n\nBots, fraudulent clicks and other non-genuine interactions can generate counts without genuine human interest. These events can make campaign numbers appear stronger than the attention actually obtained. This is part of the lecture’s criticism of the digital advertising marketplace.\n\nHow to explain it in an exam: Invalid traffic is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as invalid traffic, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: Automated clicks on a hypothetical Samsung banner from a bot farm count as invalid traffic, not genuine customer interest. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): Automated clicks on a hypothetical Samsung banner from a bot farm count as invalid traffic, not genuine customer interest. Why it fits: This shows invalid traffic in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"THE BROKEN MARKETPLACE"},{"id":127,"term":"Algorithmic trading of advertising","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":35,"definition":"Software buying and selling ad placements in fractions of a second, making individual transactions difficult for advertisers to inspect.","explanation":"Automated systems buy and sell digital advertising placements extremely quickly. Transactions can be difficult for advertisers to follow or verify individually. The course connects this scale and speed with reduced transparency over what was bought.\n\nHow to explain it in an exam: Algorithmic trading of advertising is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as algorithmic trading of advertising, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: An advertising system automatically bids for a Spotify display placement on behalf of a retail brand in a fraction of a second. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): An advertising system automatically bids for a Spotify display placement on behalf of a retail brand in a fraction of a second. Why it fits: This shows algorithmic trading of advertising in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Software buying and selling ad placements in fractions of a second, making individual transactions difficult for advertisers to inspect.\n\nAutomated systems buy and sell digital advertising placements extremely quickly. Transactions can be difficult for advertisers to follow or verify individually. The course connects this scale and speed with reduced transparency over what was bought.\n\nHow to explain it in an exam: Algorithmic trading of advertising is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as algorithmic trading of advertising, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: An advertising system automatically bids for a Spotify display placement on behalf of a retail brand in a fraction of a second. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): An advertising system automatically bids for a Spotify display placement on behalf of a retail brand in a fraction of a second. Why it fits: This shows algorithmic trading of advertising in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"THE BROKEN MARKETPLACE"},{"id":128,"term":"Advertising dark pool","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":35,"definition":"A private marketplace where selected buyers trade ad placements outside the open market, so wider trading activity and prices are not visible.","explanation":"A private marketplace permits selected participants to trade advertising inventory away from the wider open market. Outsiders cannot see all the prices or transactions. This limited visibility makes the true value of the trade harder to assess.\n\nHow to explain it in an exam: Advertising dark pool is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as advertising dark pool, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A hypothetical Nike media buy routes through an invite-only advertising exchange whose transactions are not visible on the open marketplace. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A hypothetical Nike media buy routes through an invite-only advertising exchange whose transactions are not visible on the open marketplace. Why it fits: This shows advertising dark pool in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"A private marketplace where selected buyers trade ad placements outside the open market, so wider trading activity and prices are not visible.\n\nA private marketplace permits selected participants to trade advertising inventory away from the wider open market. Outsiders cannot see all the prices or transactions. This limited visibility makes the true value of the trade harder to assess.\n\nHow to explain it in an exam: Advertising dark pool is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as advertising dark pool, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A hypothetical Nike media buy routes through an invite-only advertising exchange whose transactions are not visible on the open marketplace. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.\n\nBrand/product example (illustrative): A hypothetical Nike media buy routes through an invite-only advertising exchange whose transactions are not visible on the open marketplace. Why it fits: This shows advertising dark pool in a specific customer, product or platform context, rather than treating the concept as an abstract label.","category":"THE BROKEN MARKETPLACE"},{"id":129,"term":"Subprime attention","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":36,"definition":"Hwang's description of attention of uncertain quality being traded as if its value were more reliable: an ad may be unseen, a click manufactured, or a purchase may have happened anyway.","explanation":"Hwang uses this term for uncertain or poor-quality advertising attention sold as if its value were dependable. Some ads are not noticed, some clicks are fake and some credited sales would have happened anyway. The issue is the gap between the reported transaction and real business effect.\n\nHow to explain it in an exam: Subprime attention is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as subprime attention, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A hypothetical Filmstaden ad reports 20,000 impressions but its buyer questions which were genuine and whether any extra tickets were sold. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A hypothetical Filmstaden ad reports 20,000 impressions but its buyer questions which were genuine and whether any extra tickets were sold. Why it fits: This shows subprime attention in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Hwang's description of attention of uncertain quality being traded as if its value were more reliable: an ad may be unseen, a click manufactured, or a purchase may have happened a xplanation":"Good play combines active digital participation with consideration for the effects on other people. It is not enough for an online action to be entertaining or engaging. The ethical dimension asks whether that participation is responsible toward others.\n\nHow to explain it in an exam: Good play is not simply a label to memorize. Start with the definition and then describe the process or relationship it captures. Distinguish what a platform records or enables from what people actually notice, understand, consent to, or do; describe who benefits and who might be harmed. The important reasoning is the link between the situation, the mechanism, and the consequence: what the person or organization does, why that counts as good play, and what changes as a result. Measurement and ease of sharing do not automatically establish causal impact, accuracy, or ethical acceptability.\n\nConcrete application: A Duolingo learning group helps each other respectfully and corrects misinformation rather than maximizing likes at others’ expense. In this illustration, identify the specific observable action or design decision, then connect it back to the definition. A strong written answer would name the brand or product, describe the relevant mechanism, and explain the implication without treating a hypothetical performance result as proven fact.","example":"Brand/product example (illustrative): A Duolingo learning group helps each other respectfully and corrects misinformation rather than maximizing likes at others’ expense. Why it fits: This shows good play in a specific customer, product or platform context, rather than treating the concept as an abstract label.","full":"Meaningful engagement in digital media combined with responsibility to other people.\n\nGood play combines active digital participation with consideration for the effects on other people. It is not enough for an online action to be entertaining or engaging. The ethical dimension asks whether that partici
