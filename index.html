facts can feel different when expressed as a gain or a loss. Responsible framing remains truthful while making consequences understandable.","example":"Illustrative example: A gym could describe the same yearly plan as 'save €60 compared with monthly payments' or 'pay €240 for the year.' Both can be true, but the chosen frame draws attention to different aspects of the decision.","full":"Framing is the presentation of the same information in different ways to emphasize certain implications and influence interpretation. Highlighting a gain, loss, risk or benefit gives one interpretation greater prominence. Framing is therefore about presentation and perception instead of changing the underlying information.\n\nA concert bundle described as 'Save €5 together' and the same offer described as 'Avoid paying €5 extra separately' emphasize different aspects of an identical economic difference. People may respond differently because losses and gains carry different psychological weight. Framing affects interpretation, not the underlying price. Responsible marketing should preserve accurate facts instead of conceal meaningful costs.\n\nThe same facts can feel different when expressed as a gain or a loss. Responsible framing remains truthful while making consequences understandable.","category":"DECISION-MAKING","study":{"simple":"The facts can remain the same while the way they are presented changes the audience’s reaction. Highlighting a gain, loss, risk or benefit gives one interpretation greater prominence.","why":"The same facts can feel different when expressed as a gain or a loss. Responsible framing remains truthful while making consequences understandable. People may respond differently because losses and gains carry different psychological weight. Framing affects interpretation, not the underlying price.","example":"A gym could describe the same yearly plan as 'save €60 compared with monthly payments' or 'pay €240 for the year.' Both can be true, but the chosen frame draws attention to different aspects of the decision.","exam":"Framing is the presentation of the same information in different ways to emphasize certain implications and influence interpretation. Highlighting a gain, loss, risk or benefit gives one interpretation greater prominence. Framing is therefore about presentation and perception instead of changing the underlying information.\n\nA concert bundle described as 'Save €5 together' and the same offer described as 'Avoid paying €5 extra separately' emphasize different aspects of an identical economic difference. People may respond differently because losses and gains carry different psychological weight. Framing affects interpretation, not the underlying price. Responsible marketing should preserve accurate facts instead of conceal meaningful costs.\n\nThe same facts can feel different when expressed as a gain or a loss. Responsible framing remains truthful while making consequences understandable."},"exampleType":"illustrative"},{"id":117,"term":"Trust signals","lecture":"Lecture 7 · SEM, distinction and decision-making","page":33,"definition":"Visual or textual cues that reassure people about a brand's credibility, reliability and security, such as reviews, security badges or guarantees.","explanation":"Signals such as reviews, guarantees and security badges can reduce uncertainty about a purchase or service. They provide cues about reliability and credibility. Their usefulness depends on whether the cues are meaningful and trustworthy.\n\nBuying online involves uncertainty. Visible returns policies, genuine reviews and clear guarantees can help someone judge whether a seller is dependable.","example":"Real-world example: Airbnb displays past guest reviews that can be sorted and read before booking. Those independent accounts can reduce uncertainty, although reviews are not a guarantee that every future stay will be good.","full":"Trust signals are pieces of evidence or cues—such as genuine reviews, warranties and clear policies—that help users assess the reliability of a seller. They provide cues about reliability and credibility. Their usefulness depends on whether the cues are meaningful and trustworthy.\n\nA Samsung checkout showing verified customer reviews, clear warranty terms and reputable payment methods can reduce perceived uncertainty. These are trust signals because they offer reasons to believe the seller and process are reliable. But decorative badges or fabricated testimonials can create false reassurance. Credibility depends on the evidence behind the cue, not merely its visual authority.\n\nBuying online involves uncertainty. Visible returns policies, genuine reviews and clear guarantees can help someone judge whether a seller is dependable.","category":"DECISION-MAKING","study":{"simple":"Signals such as reviews, guarantees and security badges can reduce uncertainty about a purchase or service. They provide cues about reliability and credibility.","why":"Buying online involves uncertainty. Visible returns policies, genuine reviews and clear guarantees can help someone judge whether a seller is dependable. These are trust signals because they offer reasons to believe the seller and process are reliable. But decorative badges or fabricated testimonials can create false reassurance.","example":"Airbnb displays past guest reviews that can be sorted and read before booking. Those independent accounts can reduce uncertainty, although reviews are not a guarantee that every future stay will be good.","exam":"Trust signals are pieces of evidence or cues—such as genuine reviews, warranties and clear policies—that help users assess the reliability of a seller. They provide cues about reliability and credibility. Their usefulness depends on whether the cues are meaningful and trustworthy.\n\nA Samsung checkout showing verified customer reviews, clear warranty terms and reputable payment methods can reduce perceived uncertainty. These are trust signals because they offer reasons to believe the seller and process are reliable. But decorative badges or fabricated testimonials can create false reassurance. Credibility depends on the evidence behind the cue, not merely its visual authority.\n\nBuying online involves uncertainty. Visible returns policies, genuine reviews and clear guarantees can help someone judge whether a seller is dependable."},"exampleType":"real","exampleSource":"https://www.airbnb.com/help/article/1885"},{"id":118,"term":"Decoy effect","lecture":"Lecture 7 · SEM, distinction and decision-making","page":33,"definition":"When a third, less attractive option changes how two other options are compared, making one appear more appealing.","explanation":"An additional option can change the relative attractiveness of two existing choices. The third option is designed or positioned so that one of the original options appears preferable. This shows that decisions depend on the comparison set, not only on each option considered alone.\n\nA deliberately inferior third option can make one preferred choice seem better by comparison. It illustrates how the set of alternatives shapes decisions.","example":"Illustrative example: A fictional café offers small coffee for €3, medium for €4.50 and large for €4.70. The medium may make the large seem like much better value, even if the shopper originally wanted only a small cup. That's the decoy effect.","full":"Decoy effect occurs when a third, less attractive option changes how two other options are compared, making one appear more appealing. An additional option can change the relative attractiveness of two existing choices. The third option is designed or positioned so that one of the original options appears preferable. This shows that decisions depend on the comparison set, not only on each option considered alone.\n\nImagine Spotify presents a €12 plan alongside an €11 plan that offers notably fewer benefits. The inferior option may make the €12 plan feel like a bargain by changing the comparison set, even if few customers choose the €11 plan. That is the decoy effect. It illustrates context-dependent judgment; the ethical concern concerns whether the added option informs choice or is designed to manipulate it.\n\nA deliberately inferior third option can make one preferred choice seem better by comparison. It illustrates how the set of alternatives shapes decisions.","category":"DECISION-MAKING","study":{"simple":"An additional option can change the relative attractiveness of two existing choices. The third option is designed or positioned so that one of the original options appears preferable.","why":"A deliberately inferior third option can make one preferred choice seem better by comparison. It illustrates how the set of alternatives shapes decisions. The inferior option may make the €12 plan feel like a bargain by changing the comparison set, even if few customers choose the €11 plan. That is the decoy effect.","example":"A fictional café offers small coffee for €3, medium for €4.50 and large for €4.70. The medium may make the large seem like much better value, even if the shopper originally wanted only a small cup. That's the decoy effect.","exam":"Decoy effect occurs when a third, less attractive option changes how two other options are compared, making one appear more appealing. An additional option can change the relative attractiveness of two existing choices. The third option is designed or positioned so that one of the original options appears preferable. This shows that decisions depend on the comparison set, not only on each option considered alone.\n\nImagine Spotify presents a €12 plan alongside an €11 plan that offers notably fewer benefits. The inferior option may make the €12 plan feel like a bargain by changing the comparison set, even if few customers choose the €11 plan. That is the decoy effect. It illustrates context-dependent judgment; the ethical concern concerns whether the added option informs choice or is designed to manipulate it.\n\nA deliberately inferior third option can make one preferred choice seem better by comparison. It illustrates how the set of alternatives shapes decisions."},"exampleType":"illustrative"},{"id":119,"term":"Peak-end rule","lecture":"Lecture 7 · SEM, distinction and decision-making","page":33,"definition":"The principle that people judge an experience largely by its most intense moment and its end, rather than by the whole experience.","explanation":"A person’s memory of an experience is especially influenced by its emotional high point and its ending. The experience can then be judged differently from a simple average of every moment. This principle is relevant when thinking about how a customer remembers an interaction.\n\nA standout moment and the final interaction strongly affect memory of an experience. Brands should not ignore the end of a customer journey.","example":"Illustrative example: Imagine a delayed online order where customer service resolves the issue kindly and the parcel arrives beautifully packed. People may remember the helpful peak and satisfying ending more than every earlier inconvenience.","full":"Peak-end rule is the principle that people judge an experience largely by its most intense moment and its end, instead of by the whole experience. A person’s memory of an experience is especially influenced by its emotional high point and its ending. The experience can then be judged differently from a simple average of every moment. This principle is relevant when thinking about how a customer remembers an interaction.\n\nAn IKEA customer may remember an unusually helpful staff interaction and a smooth final delivery more strongly than many ordinary moments during shopping. Under the peak-end rule, the experience's emotional peak and ending shape retrospective evaluation. This does not mean everything between them is irrelevant, but it helps explain why a poor checkout or abrupt service ending can dominate the memory of otherwise adequate service.\n\nA standout moment and the final interaction strongly affect memory of an experience. Brands should not ignore the end of a customer journey.","category":"DECISION-MAKING","study":{"simple":"A person’s memory of an experience is especially influenced by its emotional high point and its ending. The experience can then be judged differently from a simple average of every moment.","why":"A standout moment and the final interaction strongly affect memory of an experience. Brands should not ignore the end of a customer journey. Under the peak-end rule, the experience's emotional peak and ending shape retrospective evaluation. This does not mean everything between them is irrelevant, but it helps explain why a poor checkout or abrupt service ending can dominate the memory of otherwise adequate service.","example":"Imagine a delayed online order where customer service resolves the issue kindly and the parcel arrives beautifully packed. People may remember the helpful peak and satisfying ending more than every earlier inconvenience.","exam":"Peak-end rule is the principle that people judge an experience largely by its most intense moment and its end, instead of by the whole experience. A person’s memory of an experience is especially influenced by its emotional high point and its ending. The experience can then be judged differently from a simple average of every moment. This principle is relevant when thinking about how a customer remembers an interaction.\n\nAn IKEA customer may remember an unusually helpful staff interaction and a smooth final delivery more strongly than many ordinary moments during shopping. Under the peak-end rule, the experience's emotional peak and ending shape retrospective evaluation. This does not mean everything between them is irrelevant, but it helps explain why a poor checkout or abrupt service ending can dominate the memory of otherwise adequate service.\n\nA standout moment and the final interaction strongly affect memory of an experience. Brands should not ignore the end of a customer journey."},"exampleType":"illustrative"},{"id":120,"term":"Assistant-centric web","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":34,"definition":"A web where people increasingly receive a composed answer from an assistant instead of searching through and choosing between a list of webpages.","explanation":"The user can ask a question and receive a composed response instead of selecting and reading several search results. The intermediary assistant affects which information is surfaced and how it is expressed. This has consequences for organisations whose content previously depended on direct website visits.\n\nAssistants can become the main interface through which people encounter sources. Clear factual content matters even when the user never opens a website.","example":"Illustrative example: A student asks an assistant 'Which laptop can run Photoshop comfortably under €900?' and receives a comparison before visiting any shop. That's the assistant-centric web: the answer may come before the webpage.","full":"Assistant-centric web is a web where people increasingly receive a composed answer from an assistant instead of searching through and choosing between a list of webpages. The user can ask a question and receive a composed response instead of selecting and reading several search results. The intermediary assistant affects which information is surfaced and how it is expressed. This has consequences for organisations whose content previously depended on direct website visits.\n\nAn AI assistant that recommends several IKEA desks from a room's dimensions becomes the interface through which the shopper encounters those products. The customer may never open each source page. The assistant-centric web therefore redistributes attention and influence between publishers, platforms and users. Brands need consistent, accessible facts, while users still need ways to verify recommendations and see missing context.\n\nAssistants can become the main interface through which people encounter sources. Clear factual content matters even when the user never opens a website.","category":"THE DIGITAL ENVIRONMENT","study":{"simple":"The user can ask a question and receive a composed response instead of selecting and reading several search results. The intermediary assistant affects which information is surfaced and how it is expressed.","why":"Assistants can become the main interface through which people encounter sources. Clear factual content matters even when the user never opens a website. The customer may never open each source page. The assistant-centric web therefore redistributes attention and influence between publishers, platforms and users.","example":"A student asks an assistant 'Which laptop can run Photoshop comfortably under €900?' and receives a comparison before visiting any shop. That's the assistant-centric web: the answer may come before the webpage.","exam":"Assistant-centric web is a web where people increasingly receive a composed answer from an assistant instead of searching through and choosing between a list of webpages. The user can ask a question and receive a composed response instead of selecting and reading several search results. The intermediary assistant affects which information is surfaced and how it is expressed. This has consequences for organisations whose content previously depended on direct website visits.\n\nAn AI assistant that recommends several IKEA desks from a room's dimensions becomes the interface through which the shopper encounters those products. The customer may never open each source page. The assistant-centric web therefore redistributes attention and influence between publishers, platforms and users. Brands need consistent, accessible facts, while users still need ways to verify recommendations and see missing context.\n\nAssistants can become the main interface through which people encounter sources. Clear factual content matters even when the user never opens a website."},"exampleType":"illustrative"},{"id":121,"term":"Attention economy","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":34,"definition":"An environment where information is abundant, human attention is limited, and access to audiences can therefore be sold.","explanation":"Digital information can be produced and distributed at enormous scale, but people cannot pay attention to everything. Audience attention consequently becomes something platforms and advertisers compete over and sell access to. The course questions whether sold impressions reliably represent meaningful human attention.\n\nMany services compete for the same limited human attention. Being served as an ad is not equivalent to being meaningfully noticed.","example":"Illustrative example: During a lunch break, YouTube, TikTok, a game and a news app all compete for the same ten minutes. Content is plentiful but attention is limited, making that attention commercially valuable.","full":"Attention economy is an environment where information is abundant, human attention is limited, and access to audiences can then be sold. Digital information can be produced and distributed at enormous scale, but people cannot pay attention to everything. Audience attention consequently becomes something platforms and advertisers compete over and sell access to. The course questions whether sold impressions reliably represent meaningful human attention.\n\nNetflix, YouTube and TikTok compete for a limited evening of human attention even though digital information itself is abundant. Platforms can sell opportunities to reach audiences, which gives attention economic value. But an impression is not equivalent to an engaged person: someone can scroll past an ad without processing it. The attention economy explains both the commercial incentive to capture attention and the risk of overvaluing superficial engagement.\n\nMany services compete for the same limited human attention. Being served as an ad is not equivalent to being meaningfully noticed.","category":"THE BROKEN MARKETPLACE","study":{"simple":"Digital information can be produced and distributed at enormous scale, but people cannot pay attention to everything. Audience attention consequently becomes something platforms and advertisers compete over and sell access to.","why":"Many services compete for the same limited human attention. Being served as an ad is not equivalent to being meaningfully noticed. Platforms can sell opportunities to reach audiences, which gives attention economic value. But an impression is not equivalent to an engaged person: someone can scroll past an ad without processing it.","example":"During a lunch break, YouTube, TikTok, a game and a news app all compete for the same ten minutes. Content is plentiful but attention is limited, making that attention commercially valuable.","exam":"Attention economy is an environment where information is abundant, human attention is limited, and access to audiences can then be sold. Digital information can be produced and distributed at enormous scale, but people cannot pay attention to everything. Audience attention consequently becomes something platforms and advertisers compete over and sell access to. The course questions whether sold impressions reliably represent meaningful human attention.\n\nNetflix, YouTube and TikTok compete for a limited evening of human attention even though digital information itself is abundant. Platforms can sell opportunities to reach audiences, which gives attention economic value. But an impression is not equivalent to an engaged person: someone can scroll past an ad without processing it. The attention economy explains both the commercial incentive to capture attention and the risk of overvaluing superficial engagement.\n\nMany services compete for the same limited human attention. Being served as an ad is not equivalent to being meaningfully noticed."},"exampleType":"illustrative"},{"id":122,"term":"Impression","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":34,"definition":"An opportunity to display an ad that has been counted as served. It is not proof that anyone noticed the ad.","explanation":"An impression is a counted event indicating an advertisement was served. It does not necessarily mean the ad was on screen long enough to be seen, or that a person actually noticed it. This difference matters when evaluating digital advertising reports.\n\nAn impression records that an ad was served, not that a person saw or understood it. Using impressions alone can overstate reach.","example":"Illustrative example: A shopping app records that a sports-shoe banner was served 4,000 times. Those are impressions, even if some users scrolled past without noticing the ad at all.","full":"Impression is an opportunity to display an ad that has been counted as served. It is not proof that anyone noticed the ad. An impression is a counted event indicating an advertisement was served. It does not necessarily mean the ad was on screen long enough to be seen, or that a person actually noticed it. This difference matters when evaluating digital advertising reports.\n\nA hypothetical Nike banner served 5,000 times generates 5,000 impressions under the relevant counting rule. This says the advertising system delivered opportunities for display, not that 5,000 people actively observed the message. Some deliveries can occur outside meaningful view or to non-genuine traffic. Impression counts help describe scale but should never be represented as verified attention or sales impact.\n\nAn impression records that an ad was served, not that a person saw or understood it. Using impressions alone can overstate reach.","category":"THE BROKEN MARKETPLACE","study":{"simple":"An impression is a counted event indicating an advertisement was served. It does not necessarily mean the ad was on screen long enough to be seen, or that a person actually noticed it.","why":"An impression records that an ad was served, not that a person saw or understood it. Using impressions alone can overstate reach. This says the advertising system delivered opportunities for display, not that 5,000 people actively observed the message. Some deliveries can occur outside meaningful view or to non-genuine traffic.","example":"A shopping app records that a sports-shoe banner was served 4,000 times. Those are impressions, even if some users scrolled past without noticing the ad at all.","exam":"Impression is an opportunity to display an ad that has been counted as served. It is not proof that anyone noticed the ad. An impression is a counted event indicating an advertisement was served. It does not necessarily mean the ad was on screen long enough to be seen, or that a person actually noticed it. This difference matters when evaluating digital advertising reports.\n\nA hypothetical Nike banner served 5,000 times generates 5,000 impressions under the relevant counting rule. This says the advertising system delivered opportunities for display, not that 5,000 people actively observed the message. Some deliveries can occur outside meaningful view or to non-genuine traffic. Impression counts help describe scale but should never be represented as verified attention or sales impact.\n\nAn impression records that an ad was served, not that a person saw or understood it. Using impressions alone can overstate reach."},"exampleType":"illustrative"},{"id":123,"term":"Viewability","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":34,"definition":"A measurement of whether enough of an advertisement appeared on screen for long enough to count as viewable. It does not prove that a person noticed it.","explanation":"Viewability checks whether an ad met technical conditions for appearing on screen. It is a stronger claim than simple delivery, but not evidence of real attention or persuasion. The course stresses these differences because advertising measurements can be mistaken for outcomes.\n\nA technically viewable ad may still be ignored. Viewability improves on raw delivery counts but cannot measure attention directly.","example":"Illustrative example: An ad for a desk chair appears partly on-screen for long enough to meet a viewability rule. Someone may still be reading another paragraph and never notice it: viewability is not attention.","full":"Viewability is a measurement of whether enough of an advertisement appeared on screen for long enough to count as viewable. It does not prove that a person noticed it. Viewability checks whether an ad met technical conditions for appearing on screen. It is a stronger claim than simple delivery, but not evidence of real attention or persuasion. The course stresses these differences because advertising measurements can be mistaken for outcomes.\n\nAn IKEA banner can meet technical viewability criteria by appearing sufficiently on-screen for the required duration, yet the visitor may be reading something else. Viewability improves on counting all served impressions because it checks a condition for possible exposure. It still does not verify attention, understanding or persuasion. Campaign reporting needs to distinguish opportunities to see from actual behavioral consequences.\n\nA technically viewable ad may still be ignored. Viewability improves on raw delivery counts but cannot measure attention directly.","category":"THE BROKEN MARKETPLACE","study":{"simple":"Viewability checks whether an ad met technical conditions for appearing on screen. It is a stronger claim than simple delivery, but not evidence of real attention or persuasion.","why":"A technically viewable ad may still be ignored. Viewability improves on raw delivery counts but cannot measure attention directly. Viewability improves on counting all served impressions because it checks a condition for possible exposure. It still does not verify attention, understanding or persuasion.","example":"An ad for a desk chair appears partly on-screen for long enough to meet a viewability rule. Someone may still be reading another paragraph and never notice it: viewability is not attention.","exam":"Viewability is a measurement of whether enough of an advertisement appeared on screen for long enough to count as viewable. It does not prove that a person noticed it. Viewability checks whether an ad met technical conditions for appearing on screen. It is a stronger claim than simple delivery, but not evidence of real attention or persuasion. The course stresses these differences because advertising measurements can be mistaken for outcomes.\n\nAn IKEA banner can meet technical viewability criteria by appearing sufficiently on-screen for the required duration, yet the visitor may be reading something else. Viewability improves on counting all served impressions because it checks a condition for possible exposure. It still does not verify attention, understanding or persuasion. Campaign reporting needs to distinguish opportunities to see from actual behavioral consequences.\n\nA technically viewable ad may still be ignored. Viewability improves on raw delivery counts but cannot measure attention directly."},"exampleType":"illustrative"},{"id":124,"term":"Attribution","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":35,"definition":"A rule for assigning credit for an outcome, such as a sale, to one or more marketing touchpoints. First click and last click are attribution rules, not proof of effect.","explanation":"An attribution model decides how reported credit is distributed among interactions before an outcome. For example, the first or final click may receive credit for a sale. Such a rule describes measurement, but does not prove that the credited interaction caused the sale.\n\nCredit-allocation rules can make a channel look important without showing causation. Attribution reports where an outcome is credited, not whether the ad created it.","example":"Illustrative example: Someone hears a podcast ad for headphones, sees a social post and later clicks a promotional email before buying. A last-click attribution rule credits the email, but it cannot prove that the email caused the purchase.","full":"Attribution is a way of deciding which marketing contact gets credit for a result, such as a purchase. A company might give the credit to the first ad someone clicked, the last link they used, or several different contacts. These are rules for reporting; they do not prove that any one contact caused the purchase.\n\nFor example, imagine a customer sees an Adidas ad, then opens a promotional email, and later buys shoes. A last-click attribution model might give the email credit, while a first-click model might give the ad credit. Both models are simply different ways to assign credit. The customer might have made the purchase anyway.\n\nAttribution is useful for organizing reports about a customer journey. But it is not the same as measuring the actual extra sales caused by marketing. A channel may receive credit even when it did not change what the customer would have done.","category":"THE BROKEN MARKETPLACE","study":{"simple":"An attribution model decides how reported credit is distributed among interactions before an outcome. For example, the first or final click may receive credit for a sale.","why":"Credit-allocation rules can make a channel look important without showing causation. Attribution reports where an outcome is credited, not whether the ad created it. A last-click attribution rule gives the email credit, whereas a first-click rule could credit the ad. Both are conventions for assigning credit among touchpoints.","example":"Someone hears a podcast ad for headphones, sees a social post and later clicks a promotional email before buying. A last-click attribution rule credits the email, but it cannot prove that the email caused the purchase.","exam":"Attribution is a way of deciding which marketing contact gets credit for a result, such as a purchase. A company might give the credit to the first ad someone clicked, the last link they used, or several different contacts. These are rules for reporting; they do not prove that any one contact caused the purchase.\n\nFor example, imagine a customer sees an Adidas ad, then opens a promotional email, and later buys shoes. A last-click attribution model might give the email credit, while a first-click model might give the ad credit. Both models are simply different ways to assign credit. The customer might have made the purchase anyway.\n\nAttribution is useful for organizing reports about a customer journey. But it is not the same as measuring the actual extra sales caused by marketing. A channel may receive credit even when it did not change what the customer would have done."},"exampleType":"illustrative"},{"id":125,"term":"Incrementality","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":35,"definition":"An outcome that happened because of the advertising and would not have happened without it.","explanation":"Incrementality asks what extra outcome occurred because the advertising was present. If a customer would have purchased anyway, the ad may be attributed a sale without adding one. The course contrasts incrementality with convenient measures such as clicks and attributed conversions.\n\nKnowing whether advertising produced extra outcomes allows better spending decisions. Attributed purchases that would have happened anyway are not incremental.","example":"Illustrative example: An online shoe shop shows a campaign to one randomly chosen customer group but not another similar group. If the first group buys more, the difference can estimate sales caused by the ads—not merely sales reported alongside them.","full":"Incrementality means the extra results that happened because of advertising and would not have happened without it. The key question is not simply whether someone saw an ad and then bought something. It is whether the ad made a difference compared with what would have happened anyway.\n\nFor example, Nike could show an advertisement to one randomly chosen group of people and not show it to a similar control group. If the group that saw the ad buys more, the difference can provide evidence of extra sales caused by the advertising, provided the test is designed properly. Counting every purchase after an ad click would not prove this, because some customers would have bought anyway.\n\nIncrementality helps a company judge whether its advertising genuinely brings in additional results. It is different from attribution, which simply uses a rule to assign credit for a purchase.","category":"THE BROKEN MARKETPLACE","study":{"simple":"Incrementality asks what extra outcome occurred because the advertising was present. If a customer would have purchased anyway, the ad may be attributed a sale without adding one.","why":"Knowing whether advertising produced extra outcomes allows better spending decisions. Attributed purchases that would have happened anyway are not incremental. If the exposed group buys more, the difference may provide evidence of incremental effect under a well-designed test. Simply observing that an ad-clicker purchased does not establish causation.","example":"An online shoe shop shows a campaign to one randomly chosen customer group but not another similar group. If the first group buys more, the difference can estimate sales caused by the ads—not merely sales reported alongside them.","exam":"Incrementality means the extra results that happened because of advertising and would not have happened without it. The key question is not simply whether someone saw an ad and then bought something. It is whether the ad made a difference compared with what would have happened anyway.\n\nFor example, Nike could show an advertisement to one randomly chosen group of people and not show it to a similar control group. If the group that saw the ad buys more, the difference can provide evidence of extra sales caused by the advertising, provided the test is designed properly. Counting every purchase after an ad click would not prove this, because some customers would have bought anyway.\n\nIncrementality helps a company judge whether its advertising genuinely brings in additional results. It is different from attribution, which simply uses a rule to assign credit for a purchase."},"exampleType":"illustrative"},{"id":126,"term":"Invalid traffic","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":35,"definition":"Impressions or clicks that do not come from genuine human interest, for example from bots or fraud.","explanation":"Bots, fraudulent clicks and other non-genuine interactions can generate counts without real interest from people. These events can make campaign numbers appear stronger than the attention actually obtained. This is part of the lecture’s criticism of the digital advertising marketplace.\n\nBot clicks can inflate advertising metrics and waste budgets. Campaign evaluation should distinguish authentic human interest from invalid traffic.","example":"Illustrative example: A bot repeatedly clicks a banner for a food-delivery app without any intention to order. Those clicks count as invalid traffic, not genuine customer interest.","full":"Invalid traffic consists of advertising impressions or clicks that do not reflect real interest from people, including bot-generated and fraudulent activity. These events can make campaign numbers appear stronger than the attention actually obtained. This is part of the lecture’s criticism of the digital advertising marketplace.\n\nA bot farm can generate clicks on a Samsung advertisement that look like human interactions in a basic dashboard. These events are invalid traffic because they do not represent genuine interested customers. Advertisers may pay for activity that creates no meaningful demand. Verification, filtering and attention to suspicious patterns are therefore important before interpreting clicks or impressions as campaign success.\n\nBot clicks can inflate advertising metrics and waste budgets. Campaign evaluation should distinguish authentic human interest from invalid traffic.","category":"THE BROKEN MARKETPLACE","study":{"simple":"Bots, fraudulent clicks and other non-genuine interactions can generate counts without real interest from people. These events can make campaign numbers appear stronger than the attention actually obtained.","why":"Bot clicks can inflate advertising metrics and waste budgets. Campaign evaluation should distinguish authentic human interest from invalid traffic. These events are invalid traffic because they do not represent genuine interested customers. Advertisers may pay for activity that creates no meaningful demand.","example":"A bot repeatedly clicks a banner for a food-delivery app without any intention to order. Those clicks count as invalid traffic, not genuine customer interest.","exam":"Invalid traffic consists of advertising impressions or clicks that do not reflect real interest from people, including bot-generated and fraudulent activity. These events can make campaign numbers appear stronger than the attention actually obtained. This is part of the lecture’s criticism of the digital advertising marketplace.\n\nA bot farm can generate clicks on a Samsung advertisement that look like human interactions in a basic dashboard. These events are invalid traffic because they do not represent genuine interested customers. Advertisers may pay for activity that creates no meaningful demand. Verification, filtering and attention to suspicious patterns are therefore important before interpreting clicks or impressions as campaign success.\n\nBot clicks can inflate advertising metrics and waste budgets. Campaign evaluation should distinguish authentic human interest from invalid traffic."},"exampleType":"illustrative"},{"id":127,"term":"Algorithmic trading of advertising","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":35,"definition":"Software buying and selling ad placements in fractions of a second, making individual transactions difficult for advertisers to inspect.","explanation":"Automated systems buy and sell digital advertising placements extremely quickly. Transactions can be difficult for advertisers to follow or verify individually. The course connects this scale and speed with reduced transparency over what was bought.\n\nAutomated trading increases speed and scale but also makes individual placements harder to inspect. Advertisers need verification instead of assuming automation equals value.","example":"Illustrative example: As someone opens a weather app, software may bid for the advertising space in milliseconds. The auction happens automatically rather than through a salesperson negotiating that one impression.","full":"Algorithmic trading of advertising is software buying and selling ad placements in fractions of a second, making individual transactions difficult for advertisers to inspect. Automated systems buy and sell digital advertising placements extremely quickly. Transactions can be difficult for advertisers to follow or verify individually. The course connects this scale and speed with reduced transparency over what was bought.\n\nAdvertising software may automatically bid for an available Spotify display placement in milliseconds. Algorithmic trading reduces the need for humans to negotiate each impression and makes purchasing scalable. The speed and number of intermediaries can make individual transactions hard to inspect. Automatic delivery should therefore be judged against placement quality, transparency and genuine outcomes, not celebrated as valuable simply because it is efficient.\n\nAutomated trading increases speed and scale but also makes individual placements harder to inspect. Advertisers need verification instead of assuming automation equals value.","category":"THE BROKEN MARKETPLACE","study":{"simple":"Automated systems buy and sell digital advertising placements extremely quickly. Transactions can be difficult for advertisers to follow or verify individually.","why":"Automated trading increases speed and scale but also makes individual placements harder to inspect. Advertisers need verification instead of assuming automation equals value. Algorithmic trading reduces the need for humans to negotiate each impression and makes purchasing scalable. The speed and number of intermediaries can make individual transactions hard to inspect.","example":"As someone opens a weather app, software may bid for the advertising space in milliseconds. The auction happens automatically rather than through a salesperson negotiating that one impression.","exam":"Algorithmic trading of advertising is software buying and selling ad placements in fractions of a second, making individual transactions difficult for advertisers to inspect. Automated systems buy and sell digital advertising placements extremely quickly. Transactions can be difficult for advertisers to follow or verify individually. The course connects this scale and speed with reduced transparency over what was bought.\n\nAdvertising software may automatically bid for an available Spotify display placement in milliseconds. Algorithmic trading reduces the need for humans to negotiate each impression and makes purchasing scalable. The speed and number of intermediaries can make individual transactions hard to inspect. Automatic delivery should therefore be judged against placement quality, transparency and genuine outcomes, not celebrated as valuable simply because it is efficient.\n\nAutomated trading increases speed and scale but also makes individual placements harder to inspect. Advertisers need verification instead of assuming automation equals value."},"exampleType":"illustrative"},{"id":128,"term":"Advertising dark pool","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":35,"definition":"A private marketplace where selected buyers trade ad placements outside the open market, so wider trading activity and prices are not visible.","explanation":"A private marketplace permits selected participants to trade advertising inventory away from the wider open market. Outsiders cannot see all the prices or transactions. This limited visibility makes the true value of the trade harder to assess.\n\nPrivate trading may reduce transparency for outsiders. The buyer still needs to know what inventory was purchased and whether it was worthwhile.","example":"Illustrative example: Imagine a clothing brand buying ad space through an invitation-only private exchange. The advertiser might see its own transaction but not the wider prices and trading activity, illustrating an advertising dark pool.","full":"Advertising dark pool is a private marketplace where selected buyers trade ad placements outside the open market, so wider trading activity and prices are not visible. A private marketplace permits selected participants to trade advertising inventory away from the wider open market. Outsiders cannot see all the prices or transactions. This limited visibility makes the true value of the trade harder to assess.\n\nA hypothetical Nike media buyer may gain access to a private exchange where selected publishers sell ad inventory outside open trading. This can create a controlled purchasing environment but limits what outsiders can observe about prices and participants. The issue is not that private trading must be ineffective: it is that limited transparency makes independent valuation and scrutiny more difficult.\n\nPrivate trading may reduce transparency for outsiders. The buyer still needs to know what inventory was purchased and whether it was worthwhile.","category":"THE BROKEN MARKETPLACE","study":{"simple":"A private marketplace permits selected participants to trade advertising inventory away from the wider open market. Outsiders cannot see all the prices or transactions.","why":"Private trading may reduce transparency for outsiders. The buyer still needs to know what inventory was purchased and whether it was worthwhile. This can create a controlled purchasing environment but limits what outsiders can observe about prices and participants. The issue is not that private trading must be ineffective: it is that limited transparency makes independent valuation and scrutiny more difficult.","example":"Imagine a clothing brand buying ad space through an invitation-only private exchange. The advertiser might see its own transaction but not the wider prices and trading activity, illustrating an advertising dark pool.","exam":"Advertising dark pool is a private marketplace where selected buyers trade ad placements outside the open market, so wider trading activity and prices are not visible. A private marketplace permits selected participants to trade advertising inventory away from the wider open market. Outsiders cannot see all the prices or transactions. This limited visibility makes the true value of the trade harder to assess.\n\nA hypothetical Nike media buyer may gain access to a private exchange where selected publishers sell ad inventory outside open trading. This can create a controlled purchasing environment but limits what outsiders can observe about prices and participants. The issue is not that private trading must be ineffective: it is that limited transparency makes independent valuation and scrutiny more difficult.\n\nPrivate trading may reduce transparency for outsiders. The buyer still needs to know what inventory was purchased and whether it was worthwhile."},"exampleType":"illustrative"},{"id":129,"term":"Subprime attention","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":36,"definition":"Hwang's description of attention of uncertain quality being traded as if its value were more reliable: an ad may be unseen, a click manufactured, or a purchase may have happened anyway.","explanation":"Hwang uses this term for uncertain or poor-quality advertising attention sold as if its value were dependable. Some ads are not noticed, some clicks are fake and some credited sales would have happened anyway. The issue is the gap between the reported transaction and real business effect.\n\nSelling uncertain attention as reliable can mislead advertisers about return on investment. Real exposure and additional business results need scrutiny.","example":"Illustrative example: A company celebrates a campaign with thousands of low-cost clicks, but later discovers many were accidental and others would have purchased anyway. That gap between apparent attention and real value is subprime attention.","full":"Subprime attention is Tim Hwang’s description of unreliable advertising attention being bought and sold as if its quality and value were dependable. Some ads are not noticed, some clicks are fake and some credited sales would have happened anyway. The issue is the gap between the reported transaction and real business effect.\n\nA concert promoter's campaign might report 20,000 served impressions while the advertiser cannot check how many were seen by humans or how many additional tickets were sold. In Hwang's argument, uncertain-quality attention is traded as though it had dependable value. The analogy challenges optimistic dashboard figures: reported clicks and attributed sales can overstate the attention and incremental economic effect actually obtained.\n\nSelling uncertain attention as reliable can mislead advertisers about return on investment. Real exposure and additional business results need scrutiny.","category":"THE BROKEN MARKETPLACE","study":{"simple":"Hwang uses this term for uncertain or poor-quality advertising attention sold as if its value were dependable. Some ads are not noticed, some clicks are fake and some credited sales would have happened anyway.","why":"Selling uncertain attention as reliable can mislead advertisers about return on investment. Real exposure and additional business results need scrutiny. In Hwang's argument, uncertain-quality attention is traded as though it had dependable value. The analogy challenges optimistic dashboard figures: reported clicks and attributed sales can overstate the attention and incremental economic effect actually obtained.","example":"A company celebrates a campaign with thousands of low-cost clicks, but later discovers many were accidental and others would have purchased anyway. That gap between apparent attention and real value is subprime attention.","exam":"Subprime attention is Tim Hwang’s description of unreliable advertising attention being bought and sold as if its quality and value were dependable. Some ads are not noticed, some clicks are fake and some credited sales would have happened anyway. The issue is the gap between the reported transaction and real business effect.\n\nA concert promoter's campaign might report 20,000 served impressions while the advertiser cannot check how many were seen by humans or how many additional tickets were sold. In Hwang's argument, uncertain-quality attention is traded as though it had dependable value. The analogy challenges optimistic dashboard figures: reported clicks and attributed sales can overstate the attention and incremental economic effect actually obtained.\n\nSelling uncertain attention as reliable can mislead advertisers about return on investment. Real exposure and additional business results need scrutiny."},"exampleType":"illustrative"},{"id":130,"term":"Good play","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":36,"definition":"Meaningful engagement in digital media combined with responsibility to other people.","explanation":"Good play combines active digital participation with consideration for the effects on other people. It is not enough for an online action to be entertaining or engaging. The ethical dimension asks whether that participation is responsible toward others.\n\nHigh engagement is not automatically healthy engagement. Brands should encourage participation that respects other people, credits creators and limits harm, not simply maximise reactions.","example":"Illustrative example: Imagine a Discord language-learning group where members give constructive corrections, credit useful resources and do not mock beginners. The interaction is active *and* responsible—an example of good play.","full":"Good play means taking part in digital spaces in ways that are both meaningful and responsible toward other people. A community can have lots of likes, comments and shares but still be harmful if people spread false information or harass one another. High engagement alone does not mean that people are interacting well.\n\nFor example, imagine a Duolingo learning community where members help each other with questions, credit the resources they use and correct mistakes without making beginners feel stupid. People are actively involved, but they also treat one another fairly and respectfully. That is good play. A different community with more comments but regular harassment would not necessarily be healthier.\n\nGood play matters in marketing because brands and platforms need to think about the quality of participation, not only the number of interactions. Moderation, respectful behaviour and responsible design can help build healthier communities and stronger long-term relationships.","category":"ETHICS ONLINE","study":{"exam":"Good play means taking part in digital spaces in ways that are both meaningful and responsible toward other people. A community can have lots of likes, comments and shares but still be harmful if people spread false information or harass one another. High engagement alone does not mean that people are interacting well.\n\nFor example, imagine a Duolingo learning community where members help each other with questions, credit the resources they use and correct mistakes without making beginners feel stupid. People are actively involved, but they also treat one another fairly and respectfully. That is good play. A different community with more comments but regular harassment would not necessarily be healthier.\n\nGood play matters in marketing because brands and platforms need to think about the quality of participation, not only the number of interactions. Moderation, respectful behaviour and responsible design can help build healthier communities and stronger long-term relationships.","simple":"Good play is taking part online in a way that is fun or useful without harming other people. The important part isn't how many likes or comments you get—it's whether you treat others responsibly.","why":"A community might have thousands of comments but still be hostile or misleading. Brands and platforms need to care about whether people participate responsibly, not just how much engagement they generate. The group demonstrates good play because engagement is both active and responsible. A community with more comments but frequent harassment would not automatically be better.","example":"Imagine a Discord language-learning group where members give constructive corrections, credit useful resources and do not mock beginners. The interaction is active *and* responsible—an example of good play."},"exampleType":"illustrative"},{"id":131,"term":"Ethical fault lines","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":36,"definition":"Five areas for analysing ethics online: identity, privacy, ownership and authorship, credibility and participation (James et al., 2009).","explanation":"The course uses five areas from James and colleagues: identity, privacy, ownership and authorship, credibility, and participation. They give a way to examine different problems instead of reducing all online ethics to one question. More than one area may apply to the same situation.\n\nA post can be ethically problematic in several ways at once. Looking through the five fault lines prevents a decision from focusing only on one obvious issue.","example":"Illustrative example: A video creator posts a stranger's reaction without permission and adds a misleading caption. Identity, privacy, ownership, credibility and participation are all possible ethical issues—not just the number of views.","full":"Ethical fault lines are five areas used to analyze online conduct: identity, privacy, ownership and authorship, credibility and participation. They give a way to examine different problems instead of reducing all online ethics to one question. More than one area may apply to the same situation.\n\nSuppose a TikTok creator posts a stranger's image with an unverified allegation and invites followers to comment. The post may involve identity, privacy, authorship, credibility and participation simultaneously. James and colleagues' five ethical fault lines provide separate questions for each dimension. Using the framework prevents a narrow judgment based only on whether the post is popular or whether its creator intended harm.\n\nA post can be ethically problematic in several ways at once. Looking through the five fault lines prevents a decision from focusing only on one obvious issue.","category":"ETHICS ONLINE","study":{"simple":"The course uses five areas from James and colleagues: identity, privacy, ownership and authorship, credibility, and participation. They give a way to examine different problems instead of reducing all online ethics to one question.","why":"A post can be ethically problematic in several ways at once. Looking through the five fault lines prevents a decision from focusing only on one obvious issue. The post may involve identity, privacy, authorship, credibility and participation simultaneously. James and colleagues' five ethical fault lines provide separate questions for each dimension.","example":"A video creator posts a stranger's reaction without permission and adds a misleading caption. Identity, privacy, ownership, credibility and participation are all possible ethical issues—not just the number of views.","exam":"Ethical fault lines are five areas used to analyze online conduct: identity, privacy, ownership and authorship, credibility and participation. They give a way to examine different problems instead of reducing all online ethics to one question. More than one area may apply to the same situation.\n\nSuppose a TikTok creator posts a stranger's image with an unverified allegation and invites followers to comment. The post may involve identity, privacy, authorship, credibility and participation simultaneously. James and colleagues' five ethical fault lines provide separate questions for each dimension. Using the framework prevents a narrow judgment based only on whether the post is popular or whether its creator intended harm.\n\nA post can be ethically problematic in several ways at once. Looking through the five fault lines prevents a decision from focusing only on one obvious issue."},"exampleType":"illustrative"},{"id":132,"term":"Ethical analysis","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":36,"definition":"A method that describes what happened, identifies who is affected, selects relevant ethical areas, explains possible harm, and recommends a justified responsible action.","explanation":"A structured analysis first explains the event and who is affected. It then identifies relevant ethical areas and the possible harms before recommending a justified response. The goal is reasoned responsibility, not simply labelling an online action good or bad\n\nNaming who is affected, what harm is possible and why a response is justified leads to better decisions than simply calling an action 'good' or 'bad'.","example":"Illustrative example: Before a sports club reposts a photo of a child celebrating a goal, it asks who might be affected, whether permission exists and whether a safer photo could work. That sequence is ethical analysis, not just checking whether the post is popular.","full":"Ethical analysis is a method that describes what happened, identifies who is affected, selects relevant ethical areas, explains possible harm, and recommends a justified responsible action. A structured analysis first explains the event and who is affected. It then identifies relevant ethical areas and the possible harms before recommending a justified response. The goal is reasoned responsibility, not simply labelling an online action good or bad.\n\nImagine a marketer wants to repost a customer's Nike workout photo. An ethical analysis identifies the customer and bystanders, checks what consent was given, examines image ownership and privacy, considers reputational effects and proposes a justified response. The method connects the observed action to affected people and potential harm. Permission or a different image may be needed, even when the content would produce positive engagement.\n\nNaming who is affected, what harm is possible and why a response is justified leads to better decisions than simply calling an action 'good' or 'bad'.","category":"ETHICS ONLINE","study":{"simple":"A structured analysis first explains the event and who is affected. It then identifies relevant ethical areas and the possible harms before recommending a justified response.","why":"Naming who is affected, what harm is possible and why a response is justified leads to better decisions than simply calling an action 'good' or 'bad'. An ethical analysis identifies the customer and bystanders, checks what consent was given, examines image ownership and privacy, considers reputational effects and proposes a justified response. The method connects the observed action to affected people and potential harm.","example":"Before a sports club reposts a photo of a child celebrating a goal, it asks who might be affected, whether permission exists and whether a safer photo could work. That sequence is ethical analysis, not just checking whether the post is popular.","exam":"Ethical analysis is a method that describes what happened, identifies who is affected, selects relevant ethical areas, explains possible harm, and recommends a justified responsible action. A structured analysis first explains the event and who is affected. It then identifies relevant ethical areas and the possible harms before recommending a justified response. The goal is reasoned responsibility, not simply labelling an online action good or bad.\n\nImagine a marketer wants to repost a customer's Nike workout photo. An ethical analysis identifies the customer and bystanders, checks what consent was given, examines image ownership and privacy, considers reputational effects and proposes a justified response. The method connects the observed action to affected people and potential harm. Permission or a different image may be needed, even when the content would produce positive engagement.\n\nNaming who is affected, what harm is possible and why a response is justified leads to better decisions than simply calling an action 'good' or 'bad'."},"exampleType":"illustrative"},{"id":133,"term":"Context collapse","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":37,"definition":"When different audiences and contexts converge in one place, so something meant for one group is seen and read by others.","explanation":"An online post can reach audiences who would normally be separate, such as friends, teachers and employers. A message intended for one setting may be interpreted differently in another. The effect is increased risk of misunderstanding because the original social context is missing.\n\nA message can leave its intended social setting and reach people who interpret it differently. Brands, creators and users should not assume their audience stays separate.","example":"Illustrative example: A student posts an inside joke that friends understand, but a screenshot reaches a future employer who reads it differently. Several audiences have collapsed into one context; the original audience no longer controls the meaning.","full":"Context collapse happens when people who would normally be separate audiences see the same online post. A person may post something for friends, but it can also reach teachers, employers, family members or strangers. Those people may not know the original situation or understand the post in the same way. That is why context collapse can lead to misunderstandings.\n\nFor example, imagine a student shares a joke on Instagram that close friends know is sarcastic. Someone takes a screenshot and sends it to a potential employer. The employer does not know the inside joke and reads it as a serious statement. The post has moved from one social setting to another, and its meaning may change for the new audience.\n\nContext collapse matters because online content can spread beyond the people it was intended for. Losing the original context can cause misunderstandings and harm someone's reputation. The problem is not just that a post reaches more people, but that different audiences may interpret the same message differently.","category":"ETHICS ONLINE","study":{"exam":"Context collapse happens when people who would normally be separate audiences see the same online post. A person may post something for friends, but it can also reach teachers, employers, family members or strangers. Those people may not know the original situation or understand the post in the same way. That is why context collapse can lead to misunderstandings.\n\nFor example, imagine a student shares a joke on Instagram that close friends know is sarcastic. Someone takes a screenshot and sends it to a potential employer. The employer does not know the inside joke and reads it as a serious statement. The post has moved from one social setting to another, and its meaning may change for the new audience.\n\nContext collapse matters because online content can spread beyond the people it was intended for. Losing the original context can cause misunderstandings and harm someone's reputation. The problem is not just that a post reaches more people, but that different audiences may interpret the same message differently.","simple":"Imagine telling a joke to a few close friends, and then your teacher or future employer seeing it without knowing the joke's context. Context collapse means audiences you normally keep separate suddenly see the same thing.","why":"Posts can be screenshot, shared or rediscovered outside their intended audience. A brand or individual can be misunderstood or suffer reputational harm when a message loses its original social context. A screenshot reaches a potential employer, who lacks the situation it came from and interprets the remark literally. Context collapse occurs because distinct audiences encounter the same message under different expectations.","example":"A student posts an inside joke that friends understand, but a screenshot reaches a future employer who reads it differently. Several audiences have collapsed into one context; the original audience no longer controls the meaning."},"exampleType":"illustrative"},{"id":134,"term":"Online disinhibition effect","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":37,"definition":"People say and do things online that they would not ordinarily say and do face to face (Suler, 2004).","explanation":"People may behave differently when communicating online than they would face to face. The lecture cites Suler’s explanation of how online settings can change what individuals feel comfortable saying or doing. The concept is relevant to evaluating responsibility in digital interactions.\n\nDistance or anonymity can make harsh comments feel easier. Community guidelines and moderation are needed to support respectful participation.","example":"Illustrative example: Someone leaves a cruel comment under a cooking video using an anonymous account, even though they would not say it to the cook in person. The difference illustrates online disinhibition.","full":"The online disinhibition effect describes how people may behave more freely, harshly or personally online than they ordinarily would face to face. The lecture cites Suler’s explanation of how online settings can change what individuals feel comfortable saying or doing. The concept is relevant to evaluating responsibility in digital interactions.\n\nA person may send a hostile comment under a YouTube video that they would avoid saying to the creator face to face. The online disinhibition effect describes how features of mediated communication can reduce restraint and change behavior. Some disinhibition can encourage honesty and support, while other forms enable abuse. Platforms and brands running communities should think about moderation and social norms, not simply the volume of comments.\n\nDistance or anonymity can make harsh comments feel easier. Community guidelines and moderation are needed to support respectful participation.","category":"ETHICS ONLINE","study":{"simple":"People may behave differently when communicating online than they would face to face. The lecture cites Suler’s explanation of how online settings can change what individuals feel comfortable saying or doing.","why":"Distance or anonymity can make harsh comments feel easier. Community guidelines and moderation are needed to support respectful participation. The online disinhibition effect describes how features of mediated communication can reduce restraint and change behavior. Some disinhibition can encourage honesty and support, while other forms enable abuse.","example":"Someone leaves a cruel comment under a cooking video using an anonymous account, even though they would not say it to the cook in person. The difference illustrates online disinhibition.","exam":"The online disinhibition effect describes how people may behave more freely, harshly or personally online than they ordinarily would face to face. The lecture cites Suler’s explanation of how online settings can change what individuals feel comfortable saying or doing. The concept is relevant to evaluating responsibility in digital interactions.\n\nA person may send a hostile comment under a YouTube video that they would avoid saying to the creator face to face. The online disinhibition effect describes how features of mediated communication can reduce restraint and change behavior. Some disinhibition can encourage honesty and support, while other forms enable abuse. Platforms and brands running communities should think about moderation and social norms, not simply the volume of comments.\n\nDistance or anonymity can make harsh comments feel easier. Community guidelines and moderation are needed to support respectful participation."},"exampleType":"illustrative"},{"id":135,"term":"First-party data","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":37,"definition":"Data a company collects directly from its own audience, such as customers or website visitors.","explanation":"First-party data is information a company collects directly from its own customers or website visitors. The company gets it through its own contact with those people, rather than buying it from a data broker.\n\nThis can help a company understand customers, but it still has to explain why it collects the information, protect it and use it responsibly.","example":"Illustrative example: A local gym records class bookings made directly in its own app. Those booking records are first-party data because the gym collects them from its own members.","full":"First-party data is information a company collects directly from people who use its own services, shop with it, or visit its website. The key point is that the company gathers the information through its own relationship with those people, not by buying it from an outside data broker.\n\nFor example, Spotify may collect account details and listening activity when people use Spotify. For Spotify, that is first-party data because the information comes from its own users. The information can help Spotify improve its service or communicate with users in ways that fit their interests.\n\nHowever, collecting data directly does not give a company permission to do anything it wants with it. It still needs a lawful reason to use the data, must tell people how their information is used, protect it, and avoid keeping it longer than needed. Being first-party data does not remove privacy responsibilities.","category":"ETHICS ONLINE","study":{"simple":"The company collects this data through its own direct relationships with visitors or customers. Examples in the course include information from its audience and website visitors.","why":"Directly collected data can help a company understand its own customers. That relationship still requires transparency, appropriate purposes and protection of user information. From Spotify's perspective, those records are first-party data because of the direct relationship. They can support service improvement and relevant communication, but first-party status does not remove privacy obligations.","example":"A local gym records class bookings made directly in its own app. Those booking records are first-party data because the gym collects them from its own members.","exam":"First-party data is information a company collects directly from people who use its own services, shop with it, or visit its website. The key point is that the company gathers the information through its own relationship with those people, not by buying it from an outside data broker.\n\nFor example, Spotify may collect account details and listening activity when people use Spotify. For Spotify, that is first-party data because the information comes from its own users. The information can help Spotify improve its service or communicate with users in ways that fit their interests.\n\nHowever, collecting data directly does not give a company permission to do anything it wants with it. It still needs a lawful reason to use the data, must tell people how their information is used, protect it, and avoid keeping it longer than needed. Being first-party data does not remove privacy responsibilities."},"exampleType":"illustrative"},{"id":136,"term":"Third-party data","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":37,"definition":"Data aggregated and sold by providers who did not collect it themselves.","explanation":"The data comes from providers that aggregate and sell information they did not collect directly from the people concerned. The course distinguishes it from first-party data because the organisation buying it is further removed from the original collection relationship. That distinction matters when considering transparency and privacy.\n\nData bought from outside providers may come with limited context and consent questions. Companies should not assume third-party availability means unrestricted ethical use.","example":"Illustrative example: Imagine a holiday retailer buying audience profiles from a separate data broker that collected information across many sources. That retailer is using third-party data, not information gathered directly from its own customers.","full":"Third-party data is information sold or combined by an outside data provider that did not collect the information directly from the people concerned. A company buying that information is not the company that originally gathered it. This is different from first-party data, which a company collects from its own customers.\n\nFor example, imagine a shop buys customer-interest profiles from a data broker. The broker has put together information that originally came from other sources. The shop is using third-party data, not information it collected from its own customers. Because the data has passed between organizations, it may be harder to know exactly where it came from or what people agreed to.\n\nBuying data does not automatically mean the company has permission to use it for any marketing purpose. The company still needs to check that its planned use is lawful, protects people's privacy and is ethically acceptable.","category":"ETHICS ONLINE","study":{"simple":"The data comes from providers that aggregate and sell information they did not collect directly from the people concerned. The course distinguishes it from first-party data because the organisation buying it is further removed from the original collection relationship.","why":"Data bought from outside providers may come with limited context and consent questions. Companies should not assume third-party availability means unrestricted ethical use. The retailer is using third-party data instead of information it collected from its own customers. Distance from the original data relationship can make context and permissions less clear.","example":"Imagine a holiday retailer buying audience profiles from a separate data broker that collected information across many sources. That retailer is using third-party data, not information gathered directly from its own customers.","exam":"Third-party data is information sold or combined by an outside data provider that did not collect the information directly from the people concerned. A company buying that information is not the company that originally gathered it. This is different from first-party data, which a company collects from its own customers.\n\nFor example, imagine a shop buys customer-interest profiles from a data broker. The broker has put together information that originally came from other sources. The shop is using third-party data, not information it collected from its own customers. Because the data has passed between organizations, it may be harder to know exactly where it came from or what people agreed to.\n\nBuying data does not automatically mean the company has permission to use it for any marketing purpose. The company still needs to check that its planned use is lawful, protects people's privacy and is ethically acceptable."},"exampleType":"illustrative"},{"id":137,"term":"Second-party data","lecture":"Lecture 8 · The advertising marketplace and online ethics","page":38,"definition":"Another company's first-party data, shared through a direct partnership.","explanation":"Second-party data is information one company collected from its own customers and then shared directly with another company through a partnership. For the first company, it is first-party data. For the company receiving it, it is second-party data. The name depends on how each company got the information.\n\nThe companies need permission to share and use the data, must protect it, and must agree on what it can be used for. The company receiving the information should know where it came from.","example":"Illustrative example: A concert venue collects ticket buyers' music preferences with appropriate permission, then shares the information directly with a festival organiser under an agreed partnership. It is first-party data for the venue and second-party data for the festival organiser.","full":"Second-party data is another company's first-party data shared directly through a partnership. First-party data is information a company collects directly from its own customers or website visitors. When the company shares that information with a partner, it becomes second-party data for the partner.\n\nFor example, imagine a sports shop collects information about which sports products its customers like. With the necessary permission, the shop shares that information with Nike through a direct, transparent agreement. For the sports shop, the information is first-party data because it collected it from its own customers. For Nike, it is second-party data because Nike received it directly from another company. The inf
